/* ---------- Übersetzungen: en, pl, tr, ar, ru, ku (Kurmancî), uk ---------- */
var LANGS=[["de","Deutsch (nur Deutsch)"],["en","English"],["pl","Polski"],["tr","Türkçe"],["ar","العربية"],["ru","Русский"],["ku","Kurmancî"],["uk","Українська"]];
var LANG="de";
var D={};
function A(k,a){D[k]={en:a[0],pl:a[1],tr:a[2],ar:a[3],ru:a[4],ku:a[5],uk:a[6]};}
function T(k){return "<div class=\"tl\" data-k=\""+k+"\"></div>";}
function TI(k){return "<span class=\"tli\" data-k=\""+k+"\"></span>";}
function TS(r,t){return "<div class=\"tl\" data-k=\"score\" data-r=\""+r+"\" data-t=\""+t+"\"></div>";}
function tl(parent,k){var d=document.createElement("div");d.className="tl";d.setAttribute("data-k",k);parent.appendChild(d);return d;}
function applyLang(){
  var els=document.querySelectorAll(".tl,.tli"),i;
  for(i=0;i<els.length;i++){
    var e=els[i],k=e.getAttribute("data-k"),isInline=(e.className.indexOf("tli")>=0);
    var txt="";
    if(LANG!=="de"&&D[k]&&D[k][LANG]){
      txt=D[k][LANG];
      var r=e.getAttribute("data-r"),t=e.getAttribute("data-t");
      if(r!==null){txt=txt.replace("{r}",r).replace("{t}",t);}
    }
    if(isInline){
      e.innerHTML=txt?" ("+txt+")":"";
      e.setAttribute("dir",(LANG==="ar"||LANG==="fa")?"rtl":"ltr");
    }else{
      e.innerHTML=txt;
      e.setAttribute("dir",(LANG==="ar"||LANG==="fa")?"rtl":"ltr");
      e.style.display=txt?"block":"none";
    }
  }
  document.documentElement.setAttribute("data-lang",LANG);
}
function buildLangBar(){
  var bar=document.createElement("div");
  bar.className="langbar";
  bar.innerHTML="Erklärungen auch auf / Explanations also in: ";
  var sel=document.createElement("select"),i;
  for(i=0;i<LANGS.length;i++){var o=document.createElement("option");o.value=LANGS[i][0];o.innerHTML=LANGS[i][1];sel.appendChild(o);}
  try{var saved=window.localStorage.getItem("pp_lang");if(saved){LANG=saved;}}catch(e){}
  sel.value=LANG;
  sel.onchange=function(){LANG=sel.value;try{window.localStorage.setItem("pp_lang",LANG);}catch(e){}applyLang();};
  bar.appendChild(sel);
  var nav=document.getElementById("nav");
  nav.parentNode.insertBefore(bar,nav);
}

A("start_h",["What is this about?","O co chodzi?","Konu ne?","ما الموضوع؟","О чём речь?","Mijar çi ye?","Про що йдеться?"]);
A("start_p",["When we talk about the past, there are two important forms: the Perfekt and the Präteritum. Which one do you use when? You will find this out yourself here.","Kiedy mówimy o przeszłości, są dwie ważne formy: Perfekt i Präteritum. Którą formę stosuje się kiedy? Tutaj sam/sama to odkryjesz.","Geçmişten söz ederken iki önemli biçim vardır: Perfekt ve Präteritum. Hangisi ne zaman kullanılır? Bunu burada kendin keşfedeceksin.","عندما نتحدث عن الماضي، هناك صيغتان مهمتان: Perfekt وPräteritum. أيّ صيغة نستخدم ومتى؟ ستكتشف ذلك بنفسك هنا.","Когда мы говорим о прошлом, есть две важные формы: Perfekt и Präteritum. Какую форму использовать и когда? Здесь ты откроешь это сам(а).","Gava em li ser borî diaxivin, du formên girîng hene: Perfekt û Präteritum. Kîjan form kengê tê bikaranîn? Tu li vir wê bi xwe bibînî.","Коли ми говоримо про минуле, є дві важливі форми: Perfekt і Präteritum. Яку форму коли використовувати? Тут ти відкриєш це сам(а)."]);
A("start_list",["1. Discover: You read a text and observe the verbs. You recognise the pattern yourself.<br>2. Quiz: You test whether you have recognised the pattern.<br>3. Practise: You write sentences and fill gaps.<br>4. Extra (later in the course): modal verbs in the Präteritum.","1. Odkrywanie: Czytasz tekst i obserwujesz czasowniki. Sam/sama dostrzegasz wzorzec.<br>2. Sprawdzian: Sprawdzasz, czy rozpoznałeś/rozpoznałaś wzorzec.<br>3. Ćwiczenia: Piszesz zdania i uzupełniasz luki.<br>4. Dodatek (później w kursie): czasowniki modalne w Präteritum.","1. Keşfetme: Bir metin okur ve fiilleri gözlemlersin. Kalıbı kendin fark edersin.<br>2. Sorgulama: Kalıbı fark edip etmediğini test edersin.<br>3. Alıştırma: Cümleler yazar ve boşlukları doldurursun.<br>4. Ek (kursta daha sonra): Präteritum'da modal fiiller.","1. الاكتشاف: تقرأ نصًا وتلاحظ الأفعال، وتتعرّف على النمط بنفسك.<br>2. الاختبار: تختبر هل تعرّفت على النمط.<br>3. التمرين: تكتب جملًا وتملأ الفراغات.<br>4. ملحق (لاحقًا في الدورة): الأفعال الناقصة (Modalverben) في Präteritum.","1. Открытие: ты читаешь текст и наблюдаешь за глаголами. Закономерность ты находишь сам(а).<br>2. Проверка: ты проверяешь, понял(а) ли ты закономерность.<br>3. Практика: ты пишешь предложения и заполняешь пропуски.<br>4. Дополнение (позже на курсе): модальные глаголы в Präteritum.","1. Vedîtin: Tu tekstekê dixwînî û lêkeran temaşe dikî. Tu şêwazê bi xwe dinasî.<br>2. Pirsîn: Tu diceribînî ka te şêwaz nas kiriye.<br>3. Pratîk: Tu hevokan dinivîsî û valahiyan tijî dikî.<br>4. Pêvek (paşê di kursê de): lêkerên modal di Präteritum de.","1. Відкриття: ти читаєш текст і спостерігаєш за дієсловами. Закономірність ти знаходиш сам(а).<br>2. Перевірка: ти перевіряєш, чи помітив(ла) закономірність.<br>3. Практика: ти пишеш речення й заповнюєш пропуски.<br>4. Доповнення (пізніше на курсі): модальні дієслова в Präteritum."]);
A("go_discover",["Let's go: discover","Zaczynamy: odkrywaj","Başlayalım: keşfet","هيا نبدأ: اكتشف","Начинаем: открывай","Em dest pê dikin: bibîne","Починаємо: відкривай"]);
A("d1_h",["Step 1: Read the text and observe","Krok 1: Przeczytaj tekst i obserwuj","Adım 1: Metni oku ve gözlemle","الخطوة 1: اقرأ النص ولاحظ","Шаг 1: Прочитай текст и понаблюдай","Gava 1: Tekstê bixwîne û temaşe bike","Крок 1: Прочитай текст і придивись"]);
A("d1_p",["Anna tells us about her weekend. The verbs for the past are in bold. Look closely: what does the verb look like?","Anna opowiada o swoim weekendzie. Czasowniki w czasie przeszłym są pogrubione. Przyjrzyj się dokładnie: jak wygląda czasownik?","Anna hafta sonunu anlatıyor. Geçmiş zaman fiilleri kalın yazılmıştır. İyi bak: Fiil nasıl görünüyor?","تحكي آنا عن عطلة نهاية الأسبوع. أفعال الماضي مكتوبة بخط عريض. انظر جيدًا: كيف يبدو الفعل؟","Анна рассказывает о своих выходных. Глаголы прошедшего времени выделены жирным. Посмотри внимательно: как выглядит глагол?","Anna behsa dawiya hefteya xwe dike. Lêkerên demên borî bi tîpên stûr hatine nivîsîn. Baş binêre: lêker çawa xuya dike?","Анна розповідає про свої вихідні. Дієслова минулого часу виділено жирним. Придивись уважно: як виглядає дієслово?"]);
A("d1_legend",["Form A: haben/sein + Partizip II (two parts) = Perfekt. Form B: only one verb form, e.g. \"ich war\" = Präteritum.","Forma A: haben/sein + Partizip II (dwie części) = Perfekt. Forma B: tylko jedna forma czasownika, np. „ich war” = Präteritum.","Biçim A: haben/sein + Partizip II (iki parça) = Perfekt. Biçim B: tek bir fiil biçimi, örn. „ich war” = Präteritum.","الصيغة A: haben/sein + Partizip II (جزءان) = Perfekt. الصيغة B: فعل واحد فقط، مثل „ich war“ = Präteritum.","Форма A: haben/sein + Partizip II (две части) = Perfekt. Форма B: только один глагол, например «ich war» = Präteritum.","Form A: haben/sein + Partizip II (du beş) = Perfekt. Form B: tenê yek lêker, mînak „ich war“ = Präteritum.","Форма A: haben/sein + Partizip II (дві частини) = Perfekt. Форма B: лише одне дієслово, наприклад «ich war» = Präteritum."]);
A("d1_task",["Which form is it? Click for each sentence.","Którą formą jest? Kliknij przy każdym zdaniu.","Hangi biçim? Her cümlede tıkla.","أيّ صيغة هي؟ اضغط عند كل جملة.","Какая это форма? Нажми у каждого предложения.","Kîjan form e? Li her hevokê bitikîne.","Яка це форма? Натисни біля кожного речення."]);
A("d2_h",["Step 2: Which verbs are these?","Krok 2: Jakie to czasowniki?","Adım 2: Bunlar hangi fiiller?","الخطوة 2: ما هي هذه الأفعال؟","Шаг 2: Что это за глаголы?","Gava 2: Ev kîjan lêker in?","Крок 2: Що це за дієслова?"]);
A("d2_p",["Look at all sentences with Form B: war, hatte, hatte, war, war. Which verbs (infinitive) do these forms belong to? Select all correct verbs.","Spójrz na wszystkie zdania z formą B: war, hatte, hatte, war, war. Do jakich czasowników (bezokolicznik) należą te formy? Zaznacz wszystkie poprawne czasowniki.","Biçim B'li tüm cümlelere bak: war, hatte, hatte, war, war. Bu biçimler hangi fiillere (mastar) aittir? Doğru olan tüm fiilleri seç.","انظر إلى كل الجمل ذات الصيغة B: war, hatte, hatte, war, war. إلى أيّ أفعال (المصدر) تنتمي هذه الصيغ؟ اختر كل الأفعال الصحيحة.","Посмотри на все предложения с формой B: war, hatte, hatte, war, war. К каким глаголам (инфинитив) относятся эти формы? Выбери все правильные глаголы.","Li hemû hevokên bi Form B binêre: war, hatte, hatte, war, war. Ev form ji kîjan lêkeran (infînîtîv) in? Hemû lêkerên rast hilbijêre.","Подивись на всі речення з формою B: war, hatte, hatte, war, war. До яких дієслів (інфінітив) належать ці форми? Вибери всі правильні дієслова."]);
A("d2_q",["Form B (only one verb) occurs with:","Forma B (tylko jeden czasownik) występuje przy:","Biçim B (tek fiil) şunlarda görülür:","تظهر الصيغة B (فعل واحد فقط) مع:","Форма B (только один глагол) встречается у:","Form B (tenê yek lêker) li ba van tê dîtin:","Форма B (лише одне дієслово) трапляється у:"]);
A("d3_h",["Step 3: And all the other verbs?","Krok 3: A wszystkie inne czasowniki?","Adım 3: Peki diğer tüm fiiller?","الخطوة 3: وماذا عن بقية الأفعال؟","Шаг 3: А все остальные глаголы?","Gava 3: Û hemû lêkerên din?","Крок 3: А всі інші дієслова?"]);
A("d3_q1",["Anna uses machen, fahren, treffen, trinken, gehen, sehen in the past with …","Anna używa czasowników machen, fahren, treffen, trinken, gehen, sehen w czasie przeszłym z …","Anna machen, fahren, treffen, trinken, gehen, sehen fiillerini geçmişte … ile kullanıyor.","تستخدم آنا الأفعال machen, fahren, treffen, trinken, gehen, sehen في الماضي مع …","Анна употребляет глаголы machen, fahren, treffen, trinken, gehen, sehen в прошедшем времени с …","Anna lêkerên machen, fahren, treffen, trinken, gehen, sehen di dema borî de bi … bi kar tîne.","Анна вживає дієслова machen, fahren, treffen, trinken, gehen, sehen в минулому часі з …"]);
A("d3_q2",["Where is the Partizip II in the sentence? (am Satzende = at the end of the sentence; direkt nach dem Subjekt = right after the subject; am Satzanfang = at the beginning)","Gdzie w zdaniu stoi Partizip II? (am Satzende = na końcu zdania; direkt nach dem Subjekt = zaraz po podmiocie; am Satzanfang = na początku zdania)","Partizip II cümlede nerede durur? (am Satzende = cümlenin sonunda; direkt nach dem Subjekt = öznenin hemen arkasında; am Satzanfang = cümlenin başında)","أين يقع Partizip II في الجملة؟ (am Satzende = في نهاية الجملة؛ direkt nach dem Subjekt = مباشرة بعد الفاعل؛ am Satzanfang = في بداية الجملة)","Где в предложении стоит Partizip II? (am Satzende = в конце предложения; direkt nach dem Subjekt = сразу после подлежащего; am Satzanfang = в начале предложения)","Partizip II di hevokê de li ku ye? (am Satzende = di dawiya hevokê de; direkt nach dem Subjekt = rasterast piştî mijarê; am Satzanfang = di destpêka hevokê de)","Де в реченні стоїть Partizip II? (am Satzende = в кінці речення; direkt nach dem Subjekt = одразу після підмета; am Satzanfang = на початку речення)"]);
A("d4_h",["Step 4: Formulate the rule","Krok 4: Sformułuj regułę","Adım 4: Kuralı formüle et","الخطوة 4: صُغ القاعدة","Шаг 4: Сформулируй правило","Gava 4: Rêzê formule bike","Крок 4: Сформулюй правило"]);
A("d4_p",["Complete the rule with your observations. (sein und haben = sein and haben; fast alle anderen Verben = almost all other verbs)","Uzupełnij regułę swoimi obserwacjami. (sein und haben = sein i haben; fast alle anderen Verben = prawie wszystkie inne czasowniki)","Kuralı gözlemlerinle tamamla. (sein und haben = sein ve haben; fast alle anderen Verben = diğer fiillerin neredeyse hepsi)","أكمل القاعدة بملاحظاتك. (sein und haben = sein وhaben؛ fast alle anderen Verben = تقريبًا كل الأفعال الأخرى)","Дополни правило своими наблюдениями. (sein und haben = sein и haben; fast alle anderen Verben = почти все остальные глаголы)","Rêzê bi çavdêriyên xwe temam bike. (sein und haben = sein û haben; fast alle anderen Verben = hema hema hemû lêkerên din)","Доповни правило своїми спостереженнями. (sein und haben = sein і haben; fast alle anderen Verben = майже всі інші дієслова)"]);
A("d4_rule",["For (1) I mostly use the Präteritum (Form B). For (2) I mostly use the Perfekt (Form A).","Dla (1) zazwyczaj używam Präteritum (forma B). Dla (2) zazwyczaj używam Perfekt (forma A).","(1) için çoğunlukla Präteritum (Biçim B) kullanırım. (2) için çoğunlukla Perfekt (Biçim A) kullanırım.","مع (1) أستخدم غالبًا Präteritum (الصيغة B). ومع (2) أستخدم غالبًا Perfekt (الصيغة A).","Для (1) я обычно использую Präteritum (форма B). Для (2) я обычно использую Perfekt (форма A).","Ji bo (1) ez piranî Präteritum (Form B) bi kar tînim. Ji bo (2) ez piranî Perfekt (Form A) bi kar tînim.","Для (1) я зазвичай використовую Präteritum (форма B). Для (2) я зазвичай використовую Perfekt (форма A)."]);

A("hint",["Important: In most situations there is no difference in meaning between Perfekt and Präteritum. The difference is style. The fact that sein and haben are used in the Präteritum and the other verbs in the Perfekt is a convention of the language. (The modal verbs – können, müssen, wollen … – also belong to the Präteritum. That comes a bit later in the course, see the extra material.)","Ważne: W większości sytuacji nie ma różnicy w znaczeniu między Perfekt a Präteritum. Różnica dotyczy stylu. To, że sein i haben używa się w Präteritum, a pozostałe czasowniki w Perfekt, jest konwencją językową. (Czasowniki modalne – können, müssen, wollen … – również należą do Präteritum. Pojawią się nieco później w kursie, zob. materiały dodatkowe.)","Önemli: Çoğu durumda Perfekt ile Präteritum arasında anlam farkı yoktur. Fark üsluptadır. sein ve haben'in Präteritum'da, diğer fiillerin ise Perfekt'te kullanılması dilsel bir gelenektir (konvansiyon). (Modal fiiller – können, müssen, wollen … – de Präteritum'a aittir. Bu konu kursta biraz sonra gelecek, bkz. ek materyal.)","مهم: في معظم المواقف لا يوجد فرق في المعنى بين Perfekt وPräteritum. الفرق في الأسلوب فقط. واستخدام sein وhaben في Präteritum واستخدام بقية الأفعال في Perfekt هو عُرف لغوي. (الأفعال الناقصة – können, müssen, wollen … – تنتمي أيضًا إلى Präteritum. وسيأتي ذلك لاحقًا قليلًا في الدورة، انظر المواد الإضافية.)","Важно: В большинстве ситуаций разницы в значении между Perfekt и Präteritum нет. Разница стилистическая. То, что sein и haben употребляют в Präteritum, а остальные глаголы — в Perfekt, является языковой конвенцией. (Модальные глаголы – können, müssen, wollen … – тоже относятся к Präteritum. Это будет на курсе немного позже, см. дополнительные материалы.)","Girîng: Di piraniya rewşan de di navbera Perfekt û Präteritum de cudahiya wateyê tune ye. Cudahî stîlistîk e. Ku sein û haben di Präteritum de û lêkerên din di Perfekt de tên bikaranîn, peymanek (konvensiyon) a zimanî ye. (Lêkerên modal – können, müssen, wollen … – jî girêdayî Präteritum in. Ev di kursê de piçekî paşê tê, li materyalên zêde binêre.)","Важливо: У більшості ситуацій різниці в значенні між Perfekt і Präteritum немає. Різниця стилістична. Те, що sein і haben вживають у Präteritum, а решту дієслів — у Perfekt, є мовною конвенцією. (Модальні дієслова – können, müssen, wollen … – теж належать до Präteritum. Це буде на курсі трохи пізніше, див. додаткові матеріали.)"]);

A("modal_banner",["Extra material – comes a little later in the course. The modal verbs (können, müssen, wollen, dürfen, sollen) also have their own form in the Präteritum. This topic is not yet part of the regular programme. You can already look at it now, but you do not have to master it yet.","Materiał dodatkowy – pojawi się w kursie nieco później. Czasowniki modalne (können, müssen, wollen, dürfen, sollen) mają w Präteritum również własną formę. Ten temat nie jest jeszcze częścią regularnego programu. Możesz już na niego spojrzeć, ale nie musisz go jeszcze opanować.","Ek materyal – kursta biraz sonra gelecek. Modal fiillerin (können, müssen, wollen, dürfen, sollen) Präteritum'da da kendi biçimleri vardır. Bu konu henüz normal programın parçası değildir. Şimdiden bakabilirsin ama henüz bilmen gerekmiyor.","مواد إضافية – ستأتي لاحقًا قليلًا في الدورة. للأفعال الناقصة (können, müssen, wollen, dürfen, sollen) صيغة خاصة بها في Präteritum أيضًا. هذا الموضوع ليس جزءًا من البرنامج العادي بعد. يمكنك الاطلاع عليه الآن، لكن لا يلزمك إتقانه بعد.","Дополнительные материалы – будут на курсе немного позже. У модальных глаголов (können, müssen, wollen, dürfen, sollen) в Präteritum тоже есть своя форма. Эта тема пока не входит в обычную программу. Ты можешь уже сейчас посмотреть её, но осваивать её пока не нужно.","Materyalê zêde – di kursê de piçekî paşê tê. Lêkerên modal (können, müssen, wollen, dürfen, sollen) di Präteritum de jî formeke xwe ya taybet heye. Ev mijar hê ne beşek ji bernameya asayî ye. Tu niha dikarî li wê binêrî, lê hê ne pêwîst e tu wê baş fêr bibî.","Додаткові матеріали – будуть на курсі трохи пізніше. У модальних дієслів (können, müssen, wollen, dürfen, sollen) у Präteritum теж є своя форма. Ця тема ще не входить до звичайної програми. Ти можеш уже зараз подивитися її, але опановувати її поки не потрібно."]);

A("modal_task",["Which form is it? Form A = haben/sein + Partizip II, Form B = only one verb.","Którą formą jest? Forma A = haben/sein + Partizip II, forma B = tylko jeden czasownik.","Hangi biçim? Biçim A = haben/sein + Partizip II, Biçim B = tek fiil.","أيّ صيغة هي؟ الصيغة A = haben/sein + Partizip II، الصيغة B = فعل واحد فقط.","Какая это форма? Форма A = haben/sein + Partizip II, форма B = только один глагол.","Kîjan form e? Form A = haben/sein + Partizip II, Form B = tenê yek lêker.","Яка це форма? Форма A = haben/sein + Partizip II, форма B = лише одне дієслово."]);

A("modal_q2",["How are the forms for \"ich\" and \"er/sie/es\"? (Option 1: the same; option 2: different)","Jakie są formy przy „ich” i „er/sie/es”? (Opcja 1: takie same; opcja 2: różne)","„ich” ve „er/sie/es” için biçimler nasıldır? (1. seçenek: aynı; 2. seçenek: farklı)","كيف تكون الصيغ مع „ich“ و„er/sie/es“؟ (الخيار الأول: متطابقة؛ الخيار الثاني: مختلفة)","Какие формы у „ich“ и „er/sie/es“? (Вариант 1: одинаковые; вариант 2: разные)","Form ji bo „ich“ û „er/sie/es“ çawa ne? (Vebijêrka 1: wekhev; vebijêrka 2: cuda)","Які форми в „ich“ та „er/sie/es“? (Варіант 1: однакові; варіант 2: різні)"]);

function $(id){return document.getElementById(id);}
function h(tag,cls,html){var e=document.createElement(tag);if(cls){e.className=cls;}if(html!==undefined){e.innerHTML=html;}return e;}
function norm(s){return String(s).toLowerCase().replace(/[.!?,;:]/g,'').replace(/\s+/g,' ').replace(/^\s+|\s+$/g,'');}
function shuffle(a){var b=a.slice(),i,j,t;for(i=b.length-1;i>0;i--){j=Math.floor(Math.random()*(i+1));t=b[i];b[i]=b[j];b[j]=t;}return b;}

/* ---------- Bausteine ---------- */
function mcBlock(parent,q,opts,correct,tracker){
  var d=h("div","item");
  d.appendChild(h("div","task",q));
  var fb=h("div","fb","");
  var btns=[],answered=false,i;
  for(i=0;i<opts.length;i++){
    (function(o){
      var b=h("button","opt",o);
      b.onclick=function(){
        if(answered){return;}
        answered=true;
        var right=(o===correct);
        b.className="opt "+(right?"ok":"bad");
        var j;
        if(!right){for(j=0;j<btns.length;j++){if(btns[j].innerHTML===correct){btns[j].className="opt ok";}}}
        fb.className="fb "+(right?"ok":"bad");
        fb.innerHTML=right?("Richtig!"+TI("right")):("Nicht ganz"+TI("wrong")+". Richtig ist: <b>"+correct+"</b>");
        applyLang();
        if(tracker){tracker(right);}
      };
      btns.push(b);d.appendChild(b);
    })(opts[i]);
  }
  d.appendChild(fb);
  parent.appendChild(d);
  return d;
}
function msBlock(parent,q,opts,correctArr,onDone,tracker){
  var d=h("div","item");
  d.appendChild(h("div","task",q));
  var chosen={},btns=[],i;
  for(i=0;i<opts.length;i++){
    (function(o){
      var b=h("button","opt",o);
      b.onclick=function(){
        if(go.disabled){return;}
        if(chosen[o]){delete chosen[o];b.className="opt";}else{chosen[o]=true;b.className="opt sel";}
      };
      btns.push(b);d.appendChild(b);
    })(opts[i]);
  }
  d.appendChild(h("br"));
  var go=h("button","primary","Prüfen"+TI("check"));
  var fb=h("div","fb","");
  go.onclick=function(){
    var ok=true,j,n=0;
    for(j=0;j<opts.length;j++){
      var should=(correctArr.indexOf(opts[j])>=0);
      var is=!!chosen[opts[j]];
      if(should!==is){ok=false;}
      if(should){btns[j].className="opt ok";}else if(is){btns[j].className="opt bad";}
    }
    fb.className="fb "+(ok?"ok":"bad");
    fb.innerHTML=ok?("Richtig!"+TI("right")):("Nicht ganz. Grün markiert sind die richtigen Antworten."+T("wrongms"));
    applyLang();
    go.disabled=true;
    if(tracker){tracker(ok);}
    if(onDone){onDone(ok);}
  };
  d.appendChild(go);d.appendChild(fb);
  parent.appendChild(d);
  return d;
}
/* Lückensätze: s enthält ___ ; a = Array von Arrays akzeptierter Antworten */
function gapSet(parent,items,onFinish){
  var list=[],i;
  for(i=0;i<items.length;i++){
    (function(it,idx){
      var d=h("div","item");
      var parts=it.s.split("___");
      var inputs=[],p;
      var line=h("div","");
      for(p=0;p<parts.length;p++){
        line.appendChild(document.createTextNode(parts[p]));
        if(p<parts.length-1){
          var inp=h("input","gap");inp.type="text";inp.setAttribute("autocapitalize","off");inp.setAttribute("autocomplete","off");inp.setAttribute("spellcheck","false");
          inputs.push(inp);line.appendChild(inp);
        }
      }
      d.appendChild(line);
      var fb=h("div","fb","");d.appendChild(fb);
      parent.appendChild(d);
      list.push({it:it,inputs:inputs,fb:fb});
    })(items[i],i);
  }
  var go=h("button","primary","Alle prüfen"+TI("checkall"));
  var sc=h("div","score","");
  go.onclick=function(){
    var right=0,k,m;
    for(k=0;k<list.length;k++){
      var L=list[k],all=true,sol=[];
      for(m=0;m<L.inputs.length;m++){
        var v=norm(L.inputs[m].value);
        var acc=L.it.a[m],hit=false,z;
        for(z=0;z<acc.length;z++){if(norm(acc[z])===v){hit=true;}}
        L.inputs[m].className="gap "+(hit?"ok":"bad");
        if(!hit){all=false;}
        sol.push(acc[0]);
      }
      L.fb.className="fb "+(all?"ok":"bad");
      L.fb.innerHTML=all?("Richtig!"+TI("right")):("Lösung"+TI("sol")+": <b>"+sol.join(" … ")+"</b>");
      if(all){right++;}
    }
    sc.innerHTML="Ergebnis: "+right+" von "+list.length+" richtig."+TS(right,list.length);
    applyLang();
    if(onFinish){onFinish(right,list.length);}
  };
  parent.appendChild(go);parent.appendChild(sc);
}
/* Ganze Sätze tippen: a = Array akzeptierter Sätze */
function sentSet(parent,items,onFinish){
  var list=[],i;
  for(i=0;i<items.length;i++){
    (function(it){
      var d=h("div","item");
      d.appendChild(h("div","",it.q));
      var inp=h("input","long");inp.type="text";inp.setAttribute("autocomplete","off");inp.setAttribute("spellcheck","false");inp.setAttribute("autocapitalize","off");
      d.appendChild(inp);
      var fb=h("div","fb","");d.appendChild(fb);
      parent.appendChild(d);
      list.push({it:it,inp:inp,fb:fb});
    })(items[i]);
  }
  var go=h("button","primary","Alle prüfen"+TI("checkall"));
  var sc=h("div","score","");
  go.onclick=function(){
    var right=0,k,z;
    for(k=0;k<list.length;k++){
      var L=list[k],v=norm(L.inp.value),hit=false;
      for(z=0;z<L.it.a.length;z++){if(norm(L.it.a[z])===v){hit=true;}}
      L.inp.className="long "+(hit?"ok":"bad");
      L.fb.className="fb "+(hit?"ok":"bad");
      L.fb.innerHTML=hit?("Richtig!"+TI("right")):("Mögliche Lösung"+TI("sol2")+": <b>"+L.it.a[0]+"</b>");
      if(hit){right++;}
    }
    sc.innerHTML="Ergebnis: "+right+" von "+list.length+" richtig."+TS(right,list.length);
    applyLang();
    if(onFinish){onFinish(right,list.length);}
  };
  parent.appendChild(go);parent.appendChild(sc);
}

  ];

/* ---------- Zusatz: Modalverben ---------- */
function buildModal(){
  var s=$("s4");
  var n=h("div","appx");
  n.innerHTML="<b>Zusatzmaterial – kommt im Kurs etwas später.</b><br>Die Modalverben (können, müssen, wollen, dürfen, sollen) haben im Präteritum auch eine eigene Form. Dieses Thema ist <b>noch nicht Teil des normalen Programms</b>. Du kannst es jetzt schon ansehen, musst es aber noch nicht beherrschen."+T("modal_banner");
  s.appendChild(n);

  var c1=h("div","card");
  c1.appendChild(h("h2","","Entdecken: Modalverben in der Vergangenheit"));
  tl(c1,"modal_h");
  c1.appendChild(h("div","task","Welche Form ist es? Form A = haben/sein + Partizip II, Form B = nur ein Verb."));
  tl(c1,"modal_task");
  var rows=[
   ["Gestern <b>musste</b> ich lange arbeiten.","B"],
   ["Wir <b>wollten</b> ins Kino gehen.","B"],
   ["Er <b>konnte</b> nicht kommen.","B"],
   ["Sie <b>hat</b> gestern lange <b>gearbeitet</b>.","A"],
   ["Ich <b>durfte</b> nicht mitspielen.","B"],
   ["Wir <b>sollten</b> die Hausaufgaben machen.","B"],
   ["Ich <b>bin</b> gestern nach Hause <b>gegangen</b>.","A"]
  ];
  var cnt=0,i;
  var next=h("div","");next.style.display="none";
  for(i=0;i<rows.length;i++){
    (function(r){
      var d=h("div","sent");
      d.appendChild(h("div","t",r[0]));
      var bw=h("div","btns");
      var bA=h("button","","Form A");var bB=h("button","","Form B");var fb=h("span","fb","");
      var done=false;
      function pick(isA,btn){
        if(done){return;}
        done=true;cnt++;
        var right=((r[1]==="A")===isA);
        btn.className=right?"ok":"bad";
        if(!right){((r[1]==="A")?bA:bB).className="ok";}
        fb.className="fb "+(right?"ok":"bad");fb.innerHTML=right?"✓":"✗";
        if(cnt===rows.length){next.style.display="block";}
      }
      bA.onclick=function(){pick(true,bA);};bB.onclick=function(){pick(false,bB);};
      bw.appendChild(bA);bw.appendChild(bB);bw.appendChild(fb);d.appendChild(bw);c1.appendChild(d);
    })(rows[i]);
  }
  next.appendChild(h("p","","Vergleiche die Verben:"+T("modal_cmp")));
  next.appendChild(h("table","","<tr><th>Infinitiv</th><th>ich / er, sie, es</th></tr><tr><td>können</td><td>konnte</td></tr><tr><td>müssen</td><td>musste</td></tr><tr><td>wollen</td><td>wollte</td></tr><tr><td>dürfen</td><td>durfte</td></tr><tr><td>sollen</td><td>sollte</td></tr>"));
  mcBlock(next,"Was passiert mit dem Umlaut (ä, ö, ü) im Präteritum?"+T("modal_q1"),["Er bleibt: könnte, müsste","Er fällt weg: konnte, musste"],"Er fällt weg: konnte, musste",null);
  mcBlock(next,"Wie sind die Formen bei „ich“ und „er/sie/es“?"+T("modal_q2"),["Sie sind gleich: ich konnte, er konnte","Sie sind verschieden: ich konnte, er kann"],"Sie sind gleich: ich konnte, er konnte",null);
  c1.appendChild(next);
  s.appendChild(c1);

  var c2=h("div","card");
  c2.appendChild(h("h2","","Übung: Präteritum der Modalverben"));
  tl(c2,"modal_ex_h");
  gapSet(c2,[
   {s:"Gestern ___ ich arbeiten. (müssen)",a:[["musste"]]},
   {s:"Wir ___ nicht kommen. (können)",a:[["konnten"]]},
   {s:"Er ___ nach Hause gehen. (wollen)",a:[["wollte"]]},
   {s:"Ihr ___ hier nicht parken. (dürfen)",a:[["durftet"]]},
   {s:"Du ___ das nicht machen. (sollen)",a:[["solltest"]]},
   {s:"Maria ___ gestern nicht schlafen. (können)",a:[["konnte"]]}
  ],function(r,t){markDone(4);});
  s.appendChild(c2);
}

buildNav();buildLangBar();buildStart();buildDiscover();buildQuiz();buildPractice();buildModal();applyLang();show(0);
