<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PerfektTrainerA1L11</title>
<style>
  :root {
    --bg:#f4f6fa; --card:#fff; --text:#1d2433; --muted:#5b667a; --line:#d5dbe6;
    --accent:#2b5fd9; --accent-text:#fff; --chip:#e9eef8;
    --ok:#1f7a4d; --ok-bg:#e0f3e8; --bad:#b3303f; --bad-bg:#fbe4e7; --warn-bg:#fff4d6; --info-bg:#e6edfb;
    --font:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#12161f; --card:#1b2130; --text:#e8ecf5; --muted:#9aa5ba; --line:#30394d;
      --accent:#6b97ff; --accent-text:#0b1226; --chip:#252d40;
      --ok:#6fd6a2; --ok-bg:#183427; --bad:#ff8a98; --bad-bg:#42202a; --warn-bg:#3a3118; --info-bg:#1f2a44;
    }
  }
  * { box-sizing:border-box; }
  html,body { margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:var(--font); line-height:1.5; min-height:100vh; font-size:16px; }
  [hidden] { display:none !important; }
  .wrap { max-width:760px; margin:0 auto; padding:14px 16px 40px; }
  h1 { font-size:1.45rem; margin:6px 0 4px; line-height:1.25; }
  button, input, select { font-family:inherit; font-size:1rem; color:var(--text); }
  button { cursor:pointer; }
  button:focus-visible, input:focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
  .pick h1 { text-align:center; margin:22px 0 4px; font-size:1.6rem; }
  .pick .sub { text-align:center; color:var(--muted); margin:0 0 4px; }
  .pickprompt { text-align:center; color:var(--muted); font-size:.95rem; margin:20px 0 16px; }
  .pickprompt p { margin:0 0 4px; }
  .langlist { display:flex; flex-direction:column; gap:12px; }
  .langchoice { width:100%; min-height:68px; padding:14px 18px; border:none; border-bottom:4px solid var(--cd); border-radius:14px; background:var(--c); color:#fff; font-size:1.35rem; font-weight:700; text-align:center; }
  .langchoice:active { filter:brightness(.92); }
  .hdr { display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:6px; }
  .pill { display:inline-flex; align-items:center; gap:6px; min-height:44px; padding:0 14px; border-radius:999px; border:2px solid var(--line); background:var(--card); font-size:.92rem; white-space:nowrap; flex:none; }
  .intro { color:var(--muted); margin:2px 0 10px; font-size:.95rem; }
  .poolrow { display:flex; flex-wrap:wrap; align-items:center; gap:6px; margin:0 0 10px; }
  .poollabel { font-size:.85rem; color:var(--muted); margin-inline-end:2px; }
  .chip { min-height:40px; padding:0 14px; border-radius:999px; border:2px solid var(--line); background:var(--card); font-size:.92rem; }
  .chip.on { border-color:var(--accent); background:var(--chip); font-weight:700; }
  .poolcount { font-size:.85rem; color:var(--muted); margin-inline-start:auto; }
  .tabs { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin:0 0 14px; }
  .tab { min-height:52px; padding:4px 4px; border-radius:12px; border:2px solid var(--line); background:var(--card); font-size:.85rem; line-height:1.2; font-weight:600; overflow-wrap:anywhere; }
  .tab.on { border-color:var(--accent); background:var(--accent); color:var(--accent-text); }
  .panel { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 14px 16px; }
  .small { font-size:.88rem; color:var(--muted); margin:0 0 8px; }
  .center { text-align:center; }
  .badge { display:inline-block; background:var(--warn-bg); border-radius:999px; padding:2px 12px; font-size:.82rem; font-weight:700; margin:0 0 6px; }
  .dirrow { display:flex; gap:6px; margin-bottom:10px; }
  .dirrow .chip { flex:1; min-height:44px; border-radius:12px; }
  .flashcard { position:relative; min-height:210px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; padding:28px 16px 18px; border-radius:16px; border:2px solid var(--line); background:var(--card); text-align:center; cursor:pointer; margin-bottom:12px; }
  .flashcard.back { background:var(--info-bg); border-color:var(--accent); }
  .ctag { position:absolute; top:8px; inset-inline-start:12px; font-size:.78rem; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); }
  .cword { font-size:1.55rem; font-weight:700; line-height:1.35; overflow-wrap:anywhere; }
  .cinf { font-size:.95rem; color:var(--muted); }
  .cmean { font-size:1.02rem; }
  .twocols { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  button.main { width:100%; min-height:56px; border-radius:14px; border:none; font-size:1.05rem; font-weight:700; background:var(--accent); color:var(--accent-text); padding:8px 14px; }
  button.main.ok { background:var(--ok); color:#fff; }
  button.main:disabled { opacity:.4; }
  button.sec { min-height:56px; width:100%; border-radius:14px; border:2px solid var(--line); background:var(--card); font-size:1rem; padding:8px 14px; }
  .linkbtn { background:none; border:none; color:var(--accent); font-size:.95rem; padding:6px 4px; min-height:44px; text-decoration:underline; }
  .task { font-weight:700; margin:0 0 10px; }
  .presline { background:var(--chip); border-radius:10px; padding:8px 12px; margin-bottom:12px; font-size:1.02rem; text-align:left; }
  .presline .lab { font-size:.78rem; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); display:block; }
  .gline { font-size:1.2rem; line-height:2.5; text-align:left; margin-bottom:6px; }
  .gline .w { margin:0 2px; }
  input.blank { min-height:44px; border-radius:10px; border:2px solid var(--line); background:var(--card); padding:2px 8px; font-size:1.1rem; vertical-align:middle; margin:0 2px; text-align:center; }
  input.blank.ok { border-color:var(--ok); background:var(--ok-bg); }
  input.blank.bad { border-color:var(--bad); background:var(--bad-bg); }
  .infhint { color:var(--muted); font-size:.95rem; }
  .umlauts { display:flex; gap:6px; margin:8px 0 2px; }
  .umlauts button { min-width:48px; min-height:44px; border-radius:10px; border:2px solid var(--line); background:var(--card); font-size:1.1rem; }
  .fb { margin-top:10px; border-radius:10px; padding:10px 12px; font-weight:600; text-align:left; }
  .fb:empty { display:none; }
  .fb.good { background:var(--ok-bg); color:var(--ok); }
  .fb.warn { background:var(--bad-bg); }
  .fb.info { background:var(--warn-bg); }
  .fb .sol { display:block; font-weight:700; margin-top:2px; }
  .mean { font-size:.95rem; color:var(--muted); margin:6px 0 0; }
  .btnrow { margin-top:12px; }
  .tapq { font-weight:700; margin:0 0 6px; }
  .tapchips { display:flex; gap:8px; margin:0 0 12px; flex-wrap:wrap; }
  .fchip { border-radius:10px; border:2px solid var(--line); padding:6px 14px; font-size:1.1rem; font-weight:700; background:var(--card); }
  .fchip.cur { border-color:var(--accent); background:var(--chip); }
  .fchip.done { border-color:var(--ok); background:var(--ok-bg); color:var(--ok); }
  .tsent { display:flex; flex-wrap:wrap; align-items:center; row-gap:6px; font-size:1.2rem; margin-bottom:6px; text-align:left; }
  .tsent .tw { padding:6px 2px; }
  .tsent .tw.ins { color:var(--ok); font-weight:800; }
  .tsent .punct { padding:6px 0; }
  button.gap { position:relative; width:22px; min-height:44px; padding:0; border:none; background:transparent; }
  button.gap::before { content:""; position:absolute; inset:6px 8px; border-radius:3px; background:var(--line); transition:background .15s; }
  button.gap:hover::before, button.gap:focus-visible::before { background:var(--accent); }
  button.gap.bad::before { background:var(--bad); }
  .done-panel h2 { margin:6px 0 4px; font-size:1.25rem; }
  .score { font-size:1.1rem; margin:0 0 10px; }
  .revlist { list-style:none; margin:0 0 12px; padding:0; display:flex; flex-direction:column; gap:6px; }
  .revlist li { background:var(--bad-bg); border-radius:10px; padding:8px 12px; text-align:left; }
  .revlist .sub2 { display:block; color:var(--muted); font-size:.9rem; }
  .btns2 { display:grid; gap:10px; }
  .progsum { margin:0 0 6px; font-weight:700; }
  .bar { height:10px; background:var(--chip); border-radius:999px; overflow:hidden; margin-bottom:12px; }
  .bar > i { display:block; height:100%; background:var(--ok); transition:width .3s; }
  .boxh { font-size:.95rem; margin:14px 0 6px; }
  .vlist { display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:6px; }
  .vi { background:var(--card); border:1px solid var(--line); border-inline-start:6px solid var(--line); border-radius:10px; padding:6px 10px; text-align:left; overflow-wrap:anywhere; }
  .vi b { color:var(--accent); }
  .vi.b0 { border-inline-start-color:var(--bad); }
  .vi.b1 { border-inline-start-color:#d99a1a; }
  .vi.b2 { border-inline-start-color:var(--ok); }
  .resetrow { margin-top:16px; }
  @media (max-width:420px) {
    .cword { font-size:1.4rem; }
    .gline { font-size:1.1rem; }
  }

</style>
</head>

    var isPres = frontIsPres ? !showBack : showBack;
    var card = el("div", "flashcard" + (showBack ? " back" : ""));
    card.setAttribute("role", "button"); card.tabIndex = 0;
    card.appendChild(tgNode("span", "ctag", isPres ? STR.tagPres : STR.tagPerf));
    card.appendChild(deNode("div", "cword", isPres ? presString(it) : perfString(it)));
    if (showBack) {
      card.appendChild(deNode("div", "cinf", it.v.i + " – " + it.v.p));
      card.appendChild(tgNode("div", "cmean", meaningOf(it.v)));
    } else {
      card.appendChild(tgNode("div", "cinf", STR.flipHint));
    }
    function flip() { f.flipped = !f.flipped; render(); }
    card.addEventListener("click", flip);
    card.addEventListener("keydown", function (ev) { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); flip(); } });
    panel.appendChild(card);
    var actions = el("div", "twocols");
    var learn = el("button", "sec", STR.learning), know = el("button", "main ok", STR.know);
    learn.type = "button"; know.type = "button"; setLangAttrs(learn, lang); setLangAttrs(know, lang);
    function advance(ok) {
      recordResult(it.v.id, ok);
      if (!ok) f.wrong.push(it);
      f.idx += 1; f.flipped = false;
      if (f.idx >= f.deck.length) f.finished = true;
      render();
    }
    learn.addEventListener("click", function () { advance(false); });
    know.addEventListener("click", function () { advance(true); });
    actions.appendChild(learn); actions.appendChild(know);
    panel.appendChild(actions);
    app.appendChild(panel);
  }

  /* ---------- Lückenaufgabe ---------- */
  function umlautBar() {
    var bar = el("div", "umlauts"); bar.dir = "ltr"; var chars = ["ä", "ö", "ü", "ß"];
    for (var i = 0; i < chars.length; i++) (function (ch) {
      var b = el("button", "", ch); b.type = "button";
      b.addEventListener("mousedown", function (e) { e.preventDefault(); });
      b.addEventListener("click", function () {
        var inp = lastInput && document.body.contains(lastInput) ? lastInput : null;
        if (!inp) return;
        var s = inp.selectionStart, e2 = inp.selectionEnd;
        if (typeof s !== "number") { inp.value += ch; } else { inp.value = inp.value.slice(0, s) + ch + inp.value.slice(e2); inp.selectionStart = inp.selectionEnd = s + 1; }
        inp.focus();
        try { inp.dispatchEvent(new Event("input", {bubbles: true})); } catch (err) {}
      });
      bar.appendChild(b);
    })(chars[i]);
    return bar;
  }
  function renderGaps(app) {
    var g = state.gaps;
    if (g.finished || g.idx >= g.deck.length) {
      renderFinished(app, "gaps", fmt(STR.score, {r: g.score, n: g.deck.length}), g.wrong);
      return;
    }
    var it = g.deck[g.idx], f = frame(it);
    var panel = el("div", "panel");
    if (g.review) panel.appendChild(tgNode("span", "badge", STR.reviewBadge));
    panel.appendChild(tgNode("p", "small center", fmt(STR.cardCounter, {n: g.idx + 1, t: g.deck.length})));
    panel.appendChild(tgNode("p", "task", STR.gapsTask));
    var pl = deNode("div", "presline", "");
    pl.appendChild(tgNode("span", "lab", STR.gapsHintLabel));
    pl.appendChild(document.createTextNode(presString(it)));
    panel.appendChild(pl);
    var line = deNode("div", "gline", "");
    var inputs = [];
    function mkInput(ph, size) {
      var inp = el("input", "blank"); inp.type = "text"; inp.size = size;
      inp.setAttribute("autocomplete", "off"); inp.setAttribute("autocapitalize", "off"); inp.setAttribute("autocorrect", "off"); inp.setAttribute("spellcheck", "false");
      inp.setAttribute("aria-label", ph);
      inp.addEventListener("focus", function () { lastInput = inp; });
      inp.addEventListener("input", function () { if (!g.checked) inp.className = "blank"; });
      inp.addEventListener("keydown", function (ev) { if (ev.key === "Enter") { ev.preventDefault(); act(); } });
      inputs.push(inp);
      return inp;
    }
    var auxIn = mkInput("haben", 6), partIn = mkInput("Partizip II", 12);
    for (var i = 0; i <= f.tokens.length; i++) {
      if (i === f.auxGap) line.appendChild(auxIn);
      if (i < f.tokens.length) line.appendChild(el("span", "w", f.tokens[i]));
    }
    line.appendChild(partIn);
    line.appendChild(document.createTextNode(f.punct + " "));
    line.appendChild(el("span", "infhint", "(" + it.v.i + ")"));
    panel.appendChild(line);
    panel.appendChild(tgNode("p", "mean", it.v.i + " = " + meaningOf(it.v)));
    panel.appendChild(umlautBar());
    var fb = tgNode("div", "fb", "");
    fb.setAttribute("role", "status");
    panel.appendChild(fb);
    var row = el("div", "btnrow");
    var btn = el("button", "main", STR.check); btn.type = "button"; setLangAttrs(btn, lang);
    row.appendChild(btn); panel.appendChild(row);
    g.checked = false;
    function act() {
      if (g.checked) { g.idx += 1; if (g.idx >= g.deck.length) g.finished = true; render(); return; }
      var ok1 = norm(auxIn.value) === norm(f.auxText), ok2 = norm(partIn.value) === norm(f.part);
      g.checked = true;
      auxIn.className = "blank " + (ok1 ? "ok" : "bad"); partIn.className = "blank " + (ok2 ? "ok" : "bad");
      auxIn.readOnly = true; partIn.readOnly = true;
      var ok = ok1 && ok2;
      recordResult(it.v.id, ok);
      if (ok) { g.score += 1; fb.className = "fb good"; fb.textContent = "✓ " + STR.okMsg; }
      else {
        g.wrong.push(it);
        fb.className = "fb warn"; fb.textContent = STR.badMsg;
        var sol = deNode("span", "sol", perfString(it)); fb.appendChild(sol);
      }
      btn.textContent = STR.nextBtn; btn.focus();
    }
    btn.addEventListener("click", act);
    app.appendChild(panel);
  }

  /* ---------- Antipp-Übung: Stelle im Satz ---------- */
  function renderTap(app) {
    var t = state.tap;
    if (t.finished || t.idx >= t.deck.length) {
      renderFinished(app, "tap", fmt(STR.score, {r: t.score, n: t.deck.length}), t.wrong);
      return;
    }
    var it = t.deck[t.idx], f = frame(it), ts = t.ts;
    var panel = el("div", "panel");
    if (t.review) panel.appendChild(tgNode("span", "badge", STR.reviewBadge));
    panel.appendChild(tgNode("p", "small center", fmt(STR.cardCounter, {n: t.idx + 1, t: t.deck.length})));
    panel.appendChild(tgNode("p", "task", STR.tapTask));
    /* Chips: vorgegebene Formen */
    var chips = deNode("div", "tapchips", "");
    var c1 = el("span", "fchip " + (ts.step === 0 ? "cur" : "done"), f.auxText);
    var c2 = el("span", "fchip " + (ts.step === 0 ? "" : (ts.step === 1 ? "cur" : "done")), f.part);
    chips.appendChild(c1); chips.appendChild(c2);
    panel.appendChild(chips);
    /* Satz mit Lücken */
    var seq = [], k;
    for (k = 0; k < f.tokens.length; k++) seq.push({w: f.tokens[k], ins: false});
    if (ts.step >= 1) seq.splice(f.auxGap, 0, {w: f.auxText, ins: true});
    if (ts.step >= 2) seq.push({w: f.part, ins: true});
    var correctGap = ts.step === 0 ? f.auxGap : seq.length;
    var sent = deNode("div", "tsent", "");
    function gapBtn(pos) {
      var b = el("button", "gap" + (ts.bad === pos ? " bad" : "")); b.type = "button";
      b.setAttribute("aria-label", String(pos + 1));
      b.addEventListener("click", function () { onTap(pos); });
      return b;
    }
    for (k = 0; k <= seq.length; k++) {
      if (ts.step < 2) sent.appendChild(gapBtn(k));
      if (k < seq.length) sent.appendChild(el("span", "tw" + (seq[k].ins ? " ins" : ""), (ts.step < 2 ? "" : (k > 0 ? " " : "")) + seq[k].w));
    }
    sent.appendChild(el("span", "punct", f.punct));
    if (ts.step < 2) {
      panel.appendChild(tgNode("p", "tapq", fmt(STR.tapQ, {w: ts.step === 0 ? f.auxText : f.part})));
    }
    panel.appendChild(sent);
    panel.appendChild(tgNode("p", "mean", it.v.i + " = " + meaningOf(it.v)));
    var fb = tgNode("div", "fb", "");
    fb.setAttribute("role", "status");
    if (ts.msg) { fb.className = "fb info"; fb.textContent = ts.msg; }
    if (ts.step === 2) { fb.className = "fb good"; fb.textContent = "✓ " + STR.tapDone; }
    panel.appendChild(fb);
    if (ts.step === 2) {
      var row = el("div", "btnrow");
      var nb = el("button", "main", STR.nextBtn); nb.type = "button"; setLangAttrs(nb, lang);
      nb.addEventListener("click", function () {
        t.idx += 1; t.ts = {step: 0, err: false, bad: -1, msg: ""};
        if (t.idx >= t.deck.length) t.finished = true;
        render();
      });
      row.appendChild(nb); panel.appendChild(row);
    }
    app.appendChild(panel);
    function onTap(pos) {
      if (ts.step > 1) return;
      if (pos === correctGap) {
        ts.step += 1; ts.bad = -1; ts.msg = "";
        if (ts.step === 2) {
          var ok = !ts.err;
          recordResult(it.v.id, ok);
          if (ok) t.score += 1; else t.wrong.push(it);
        }
      } else {
        ts.err = true; ts.bad = pos;
        ts.msg = STR.tapWrong + " " + (ts.step === 1 ? STR.hintPart : (it.pat === 2 ? STR.hintAuxQ : STR.hintAuxS));
      }
      render();
    }
  }

  /* ---------- Fortschritt ---------- */
  function renderProg(app) {
    var p = loadProgress(), pool = getPool(), cats = {"new": [], 0: [], 1: [], 2: []}, i;
    for (i = 0; i < pool.length; i++) cats[boxOf(p, pool[i].id)].push(pool[i]);
    var panel = el("div", "panel");
    panel.appendChild(tgNode("p", "small", STR.progIntro));
    panel.appendChild(tgNode("p", "progsum", fmt(STR.progCount, {k: cats[2].length, n: pool.length})));
    var bar = el("div", "bar"), bi = el("i"); bi.style.width = Math.round(100 * cats[2].length / pool.length) + "%"; bar.appendChild(bi);
    panel.appendChild(bar);
    var order = [[0, STR.box0], [1, STR.box1], [2, STR.box2], ["new", STR.boxNew]];
    for (i = 0; i < order.length; i++) {
      var list = cats[order[i][0]];
      if (!list.length) continue;
      panel.appendChild(tgNode("p", "boxh", order[i][1] + " (" + list.length + ")"));
      var grid = el("div", "vlist");
      for (var j = 0; j < list.length; j++) {
        var cell = deNode("div", "vi b" + order[i][0], "");
        cell.appendChild(el("b", "", list[j].i)); cell.appendChild(document.createTextNode(" – " + list[j].p));
        grid.appendChild(cell);
      }
      panel.appendChild(grid);
    }
    var rr = el("div", "resetrow");
    var rb = el("button", "linkbtn", STR.resetProg); rb.type = "button"; setLangAttrs(rb, lang);
    rb.addEventListener("click", function () {
      if (window.confirm(STR.resetConfirm)) { lsDel(PROG_KEY); resetModes(); render(); }
    });
    rr.appendChild(rb); panel.appendChild(rr);
    app.appendChild(panel);
  }

  /* ---------- Start ---------- */
  buildPicker();
  
  (function init() {
    var f = lsGet(SEL_KEY);
    if (f === "all" || f === "w" || f === "s" || f === "m") state.filter = f;
    var h = (window.location.hash || "").replace("#", "");
    var saved = lsGet(LANG_KEY);
    if (STRINGS[h]) { applyLanguage(h); render(); }
    else if (saved && STRINGS[saved]) { applyLanguage(saved); render(); }
    else showPicker();
  })();

})();
</script>
