<style>

html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);

.textbox{font-size:1.04rem;line-height:2.05}

.gap.filled{border-bottom-style:solid}

.btn{font:inherit;font-weight:600;cursor:pointer;border:2px solid var(--accent);background:var(--accent);color:#fff;

.btn:disabled{opacity:.45;cursor:default}
.result{border-radius:12px;padding:14px 16px;margin-bottom:14px;font-weight:600;background:var(--warn-soft)}

.expl:first-of-type{border-top:0}

.expl .tag.ok{color:var(--ok)} .expl .tag.bad{color:var(--bad)}

footer{color:var(--muted);font-size:.82rem;margin-top:22px}
</style>

/* ===================== DATEN: TEIL 1 (Multiple Choice) ===================== */

{
  id: "t1-1", title: "Fahrradkeller", topic: "Wohnen",
  heading: "Betreff: Überfüllter Fahrradkeller",
  text:
"Sehr geehrte Frau Brandt,\n\n" +
"ich schreibe Ihnen, [[1]] der Fahrradkeller in unserem Haus seit Monaten völlig überfüllt ist. Viele Mieter sind inzwischen dazu übergegangen, ihre Räder im Treppenhaus [[2]], was aus Brandschutzgründen nicht erlaubt ist. [[3]] der Tatsache, dass die Hausordnung das Abstellen im Flur verbietet, nutzen viele Bewohner weiterhin das Treppenhaus. Letzte Woche wurde sogar ein Kinderwagen, [[4]] im Flur stand, umgestoßen und beschädigt.\n\n" +
"Hätte man die Räder von Anfang an ordentlich untergebracht, [[5]] es gar nicht erst zu diesen Problemen gekommen. Ich schlage daher vor, im Hof eine überdachte Anlage zu errichten. Sie würde nicht nur die [[6]] Situation im Keller entspannen, sondern auch das Treppenhaus entlasten. Die von vielen Mietern [[7]] Anlage sollte außerdem abschließbar sein.\n\n" +
"Ich wäre Ihnen dankbar, wenn Sie sich bald [[8]] kümmern würden, dass wir einen Ortstermin vereinbaren können. Ich stehe Ihnen jederzeit zur Verfügung, [[9]] Sie weitere Informationen benötigen. Ich danke Ihnen im Voraus [[10]] Ihre Mühe.\n\n" +

  items: [
    { c: "weil", w: ["denn", "deshalb"], why: "Der Satz ist ein Nebensatz: Das Verb steht am Ende („überfüllt ist“). „denn“ und „deshalb“ verlangen Hauptsatz-Wortstellung." },
    { c: "abzustellen", w: ["abstellen", "zu abstellen"], why: "dazu übergehen, … zu + Infinitiv. Bei trennbaren Verben steht „zu“ zwischen Präfix und Verbstamm: ab|zu|stellen." },
    { c: "Trotz", w: ["Wegen", "Dank"], why: "Gegensatz: Obwohl das Abstellen verboten ist, nutzen viele das Treppenhaus. „Trotz“ + Genitiv. „Wegen“ und „Dank“ drücken einen Grund aus und passen nicht." },
    { c: "der", w: ["den", "dem"], why: "Relativpronomen: Bezugswort „Kinderwagen“ (maskulin). Im Relativsatz ist es das Subjekt („… der im Flur stand“), also Nominativ." },
    { c: "wäre", w: ["hätte", "würde"], why: "Konjunktiv II der Vergangenheit ohne „wenn“ (Hätte man …, wäre es … gekommen). „kommen“ bildet das Perfekt mit „sein“." },
    { c: "angespannte", w: ["angespannten", "angespanntes"], why: "Adjektivendung nach bestimmtem Artikel im Akkusativ Femininum Singular: die angespannte Situation." },
    { c: "gewünschte", w: ["wünschende", "wünschte"], why: "Partizip II als Attribut mit passivischer Bedeutung: eine Anlage, die von vielen Mietern gewünscht wird. „wünschende“ hätte aktive Bedeutung." },
    { c: "darum", w: ["dafür", "davon"], why: "sich um etwas kümmern → Pronominaladverb „darum“ (bezieht sich auf den dass-Satz)." },
    { c: "falls", w: ["obwohl", "damit"], why: "„falls“ leitet einen Konditionalsatz ein (= wenn Sie … benötigen). „obwohl“ (Gegensatz) und „damit“ (Zweck) passen nicht." },
    { c: "für", w: ["um", "auf"], why: "jemandem für etwas danken: „für“ + Akkusativ." }
  ]
},
{
  id: "t1-2", title: "Digital Detox", topic: "Gesundheit & Gesellschaft",
  heading: "Digital Detox: Weniger Bildschirm, mehr Leben?",
  text:
"Immer mehr Menschen [[1]] sich, ihre Bildschirmzeit bewusst zu verringern. Das hat gute Gründe: Ständige Erreichbarkeit kann dazu [[2]], dass sich Menschen kaum noch erholen. Teilnehmer eines Experiments, [[3]] Smartphone eine Woche lang ausgeschaltet blieb, berichteten von deutlich besserem Schlaf. [[4]] weniger Zeit sie am Bildschirm verbrachten, desto besser konnten sie sich konzentrieren. Viele sprachen außerdem von einer deutlich [[5]] Stimmung am Morgen.\n\n" +
"Trotzdem sollten digitale Medien nicht grundsätzlich verteufelt [[6]]. Viele Menschen haben Angst [[7]], etwas Wichtiges zu verpassen, und halten das Handy für einen Begleiter, [[8]] sie nur ungern entbehren. Entscheidend ist nicht der Verzicht, sondern die Fähigkeit, die Nutzung [[9]] Geräte selbst zu steuern. Letztlich kommt es nicht darauf an, ob man das Gerät nutzt, sondern [[10]] man es tut.",
  items: [
    { c: "bemühen", w: ["versuchen", "streben"], why: "sich bemühen, … zu + Infinitiv: reflexives Verb. „versuchen“ und „streben“ werden hier nicht reflexiv gebraucht." },
    { c: "führen", w: ["bringen", "kommen"], why: "dazu führen, dass …: feste Verbindung. „bringen“ bräuchte ein Objekt (jemanden dazu bringen), „kommen“ passt mit diesem Subjekt nicht." },
    { c: "deren", w: ["dessen", "derer"], why: "Genitiv-Relativpronomen, Bezugswort „Teilnehmer“ (Plural): deren Smartphone. Ein Experiment hat kein Smartphone – deshalb nicht „dessen“." },
    { c: "Je", w: ["Umso", "Desto"], why: "Doppelte Konjunktion: Je weniger …, desto besser … Der Nebensatz mit „je“ steht zuerst." },
    { c: "besseren", w: ["bessere", "besserer"], why: "Dativ Femininum nach „einer“ (von einer … Stimmung): Das Adjektiv endet auf -en." },
    { c: "werden", w: ["wird", "worden"], why: "Passiv mit Modalverb: sollten … verteufelt werden (Infinitiv Passiv). „wird“ und „worden“ passen grammatisch nicht zu „sollten“." },
    { c: "davor", w: ["dafür", "darauf"], why: "Angst haben vor etwas → Pronominaladverb „davor“, bezieht sich auf den Infinitivsatz (davor, etwas zu verpassen)." },
    { c: "den", w: ["der", "dem"], why: "Relativpronomen: Bezugswort „Begleiter“ (maskulin). „entbehren“ steht mit Akkusativ: einen Begleiter entbehren → den." },
    { c: "dieser", w: ["dieses", "diesen"], why: "Genitiv Plural nach „die Nutzung“: die Nutzung dieser Geräte." },
    { c: "wie", w: ["dass", "was"], why: "Gegenüberstellung: nicht ob …, sondern wie man es tut (indirekter Fragesatz). „dass man es tut“ ergäbe hier keinen Sinn." }
  ]
},
{
  id: "t1-3", title: "Stadtbibliothek", topic: "Kultur & Gesellschaft",
  heading: "Leserbrief: Hände weg von unserer Stadtbibliothek!",
  text:
"Sehr geehrte Redaktion,\n\n" +
"ich bin entsetzt [[1]] die Absicht der Stadt, die Öffnungszeiten der Stadtbibliothek drastisch zu kürzen. Die Bibliothek ist für viele Menschen ein Ort, [[2]] sie sich treffen, lernen und zur Ruhe kommen können. Besonders ältere Menschen, [[3]] kaum eine andere Möglichkeit zur Begegnung bleibt, wären hart betroffen.\n\n" +
"Die Stadt begründet die Kürzung [[4]] der angespannten Haushaltslage. [[5]] es nicht klüger, die Mittel an anderer Stelle einzusparen? Die [[6]] Einsparungen von jährlich 80.000 Euro stehen in keinem Verhältnis zum kulturellen Schaden. [[7]] die Öffnungszeiten zu kürzen, sollte die Stadt lieber neue Besucher gewinnen.\n\n" +
"Ich fordere die Verantwortlichen auf, das Vorhaben noch einmal in [[8]] zu ziehen. [[9]] die Bibliothek ein wichtiger Bildungsort ist, darf sie nicht zum Sparobjekt werden. [[10]] Sie meinen Leserbrief veröffentlichen würden, wäre ich Ihnen sehr verbunden.\n\n" +
"Mit freundlichen Grüßen\nSabine Krämer",
  items: [
    { c: "über", w: ["von", "für"], why: "entsetzt sein über + Akkusativ (über die Absicht)." },
    { c: "an dem", w: ["an den", "dem"], why: "Relativsatz mit Präposition: ein Ort, an dem sie sich treffen. Ortsangabe (Wo?) → Dativ; ohne Präposition wäre der Satz unvollständig." },
    { c: "denen", w: ["die", "deren"], why: "Dativ-Relativpronomen: Menschen, denen kaum eine Möglichkeit bleibt (bleiben + Dativ). „deren“ wäre Genitiv." },
    { c: "mit", w: ["von", "für"], why: "etwas mit etwas begründen: die Kürzung mit der Haushaltslage begründen." },
    { c: "Wäre", w: ["Würde", "Sei"], why: "Rhetorische Frage im Konjunktiv II: Wäre es nicht klüger, …? „würde + Adjektiv“ ist nicht möglich, „sei“ (Konjunktiv I) ist hier unüblich." },
    { c: "erhofften", w: ["erhoffenden", "erhofft"], why: "Partizip II als Attribut vor dem Nomen wird dekliniert: die erhofften Einsparungen (Nominativ Plural)." },
    { c: "Anstatt", w: ["Außer", "Sondern"], why: "„anstatt … zu + Infinitiv“ nennt eine Alternative: Anstatt zu kürzen, sollte die Stadt Besucher gewinnen. „außer“ und „sondern“ funktionieren so nicht." },
    { c: "Betracht", w: ["Frage", "Kauf"], why: "Nomen-Verb-Verbindung: etwas in Betracht ziehen (= erwägen). „in Frage stellen“ und „in Kauf nehmen“ haben andere Verben." },
    { c: "Da", w: ["Obwohl", "Nachdem"], why: "Kausalsatz: Weil/Da die Bibliothek wichtig ist, darf sie nicht zum Sparobjekt werden. „Obwohl“ (Gegensatz) und „Nachdem“ (zeitlich) passen nicht." },
    { c: "Wenn", w: ["Obwohl", "Als"], why: "Konditionalsatz (hypothetisch, Konjunktiv II im Hauptsatz): Wenn Sie … veröffentlichen würden, wäre ich … verbunden. „als“ bezieht sich auf einmalige Ereignisse in der Vergangenheit." }
  ]
}
];

var T2 = [

  text:

"Die Vorbereitungen laufen schon auf Hochtouren, [[5]] wir können noch jede helfende Hand gebrauchen. Wer nicht körperlich mit anpacken kann, kann einen Kuchen oder Salat [[6]] das Büfett spenden. Das Fest findet [[7]] 14. Juni auf dem Vereinsgelände statt. Der Erlös soll [[8]] Anschaffung neuer Trikots für die Jugendmannschaften verwendet werden.\n\n" +
"Bitte teilen Sie uns mit, [[9]] Sie am Fest teilnehmen können. Unter [[10]], die sich rechtzeitig melden, verlosen wir drei Gutscheine für das Vereinsrestaurant.\n\n" +
"Mit sportlichen Grüßen\nIhr Vorstand",
  gaps: [
    { w: "deshalb", why: "Folge: Wir möchten feiern – deshalb haben wir beschlossen … Das Adverb steht im Mittelfeld nach dem Hilfsverb." },
    { w: "auf", why: "angewiesen sein auf + Akkusativ (auf Ihre Mithilfe)." },
    { w: "die", why: "Relativpronomen: Bezugswort „Freiwillige“ (Plural), Subjekt im Relativsatz → die." },

{

  text:

  gaps: [

    { w: "während", why: "Zeitraum: „während“ + Genitiv (während der ersten beiden Tage)." },
    { w: "dessen", why: "Genitiv-Relativpronomen, Bezugswort „See“ (maskulin): dessen Wasser." },

    { w: "desto", why: "Doppelte Konjunktion: je länger …, desto schlechter …" },
    { w: "jedoch", why: "Gegensatz nach „zwar“. Das Adverb steht auf Position 1, das Verb folgt direkt: jedoch sind sie … keine Lösung." },
    { w: "die", why: "Relativpronomen: Bezugswort „Menschen“ (Plural), Subjekt im Relativsatz → die." },
    { w: "bei", why: "bei + Dativ nennt die Bedingung/den Zeitpunkt: Bei ersten Anzeichen (= sobald sie auftreten)." }
  ],
  extra: ["obwohl", "damit", "falls", "deshalb", "zwischen"]
}
];

/* ===================== HILFSFUNKTIONEN ===================== */
var LETTERS = "abcdefghijklmno";
var mode = 1, cur1 = 0, cur2 = 0, st1 = {}, st2 = {};

function el(tag, cls, txt) {
  var e = document.createElement(tag);
  if (cls) { e.className = cls; }
  if (txt !== undefined) { e.textContent = txt; }
  return e;
}
function clear(node) { while (node.firstChild) { node.removeChild(node.firstChild); } }
function shuffle(arr) {
  var a = arr.slice(), i, j, t;
  for (i = a.length - 1; i > 0; i--) {
    j = Math.floor(Math.random() * (i + 1));
    t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function loadBest() {
  try { return JSON.parse(window.localStorage.getItem("sbB2best") || "{}"); } catch (e) { return {}; }
}
function saveBest(id, score) {
  try {
    var b = loadBest();
    if (b[id] === undefined || score > b[id]) {
      b[id] = score;
      window.localStorage.setItem("sbB2best", JSON.stringify(b));
    }
  } catch (e) { /* Speichern nicht möglich – kein Problem */ }
}
function addText(parent, str) {
  var parts = str.split("\n"), i;
  for (i = 0; i < parts.length; i++) {
    if (i > 0) { parent.appendChild(document.createElement("br")); }
    if (parts[i]) { parent.appendChild(document.createTextNode(parts[i])); }
  }
}
function buildText(container, text, makeGap) {
  var re = /\[\[(\d+)\]\]/g, last = 0, m;
  while ((m = re.exec(text)) !== null) {
    addText(container, text.substring(last, m.index));
    container.appendChild(makeGap(parseInt(m[1], 10) - 1));
    last = re.lastIndex;
  }
  addText(container, text.substring(last));
}
function verdict(score) {
  if (score >= 9) { return { cls: "good", msg: "Sehr gut!" }; }
  if (score >= 7) { return { cls: "good", msg: "Gut – schau dir die Fehler noch einmal an." }; }
  if (score >= 5) { return { cls: "", msg: "Ausbaufähig – lies die Erklärungen und versuche es noch einmal." }; }
  return { cls: "low", msg: "Noch viel Luft nach oben – nutze die Erklärungen und wiederhole die Übung." };
}
function resultBox(score, total) {
  var v = verdict(score);
  var box = el("div", "result " + v.cls);
  box.setAttribute("role", "status");
  box.appendChild(document.createTextNode(score + " von " + total + " Lücken richtig"));
  box.appendChild(el("small", "", v.msg));
  return box;
}

/* ===================== KOPF: TABS UND ÜBUNGSAUSWAHL ===================== */
function renderTabs() {
  var tabs = document.getElementById("tabs"), sets = document.getElementById("sets"), best = loadBest();
  clear(tabs); clear(sets);
  var defs = [[1, "Teil 1 · Multiple Choice"], [2, "Teil 2 · Wortbank"]];
  defs.forEach(function (d) {
    var b = el("button", "tab" + (mode === d[0] ? " active" : ""), d[1]);
    b.type = "button";
    b.addEventListener("click", function () { mode = d[0]; renderAll(); });
    tabs.appendChild(b);
  });
  var list = mode === 1 ? T1 : T2, cur = mode === 1 ? cur1 : cur2;
  list.forEach(function (s, i) {
    var b = el("button", "setbtn" + (i === cur ? " active" : ""));
    b.type = "button";
    b.appendChild(document.createTextNode("Übung " + (i + 1) + ": " + s.title));
    var sm = el("small", "", s.topic + (best[s.id] !== undefined ? " · Bestwert " + best[s.id] + "/10" : ""));
    b.appendChild(sm);
    b.addEventListener("click", function () {
      if (mode === 1) { cur1 = i; } else { cur2 = i; }
      renderAll();
    });
    sets.appendChild(b);
  });
}

/* ===================== TEIL 1 ===================== */
function init1(i) {
  var set = T1[i], s = { ans: [], checked: false, opts: [] };
  set.items.forEach(function (it) {
    var o = [{ t: it.c, ok: true }];
    it.w.forEach(function (w) { o.push({ t: w, ok: false }); });
    s.opts.push(shuffle(o));
    s.ans.push(-1);
  });
  st1[i] = s;
}

function render1() {
  if (!st1[cur1]) { init1(cur1); }
  var set = T1[cur1], s = st1[cur1], main = document.getElementById("main");
  clear(main);

  var info = el("div", "card info");
  info.appendChild(el("strong", "", "Aufgabe – Teil 1"));
  info.appendChild(document.createTextNode("Lies den Text und wähle für jede Lücke (1–10) die passende Lösung a, b oder c. Pro Lücke ist genau eine Lösung richtig."));
  main.appendChild(info);

  var gapEls = [], rowEls = [], optBtns = [], whyEls = [];

  var tcard = el("div", "card");
  tcard.appendChild(el("p", "heading", set.heading));
  var tbox = el("div", "textbox");
  buildText(tbox, set.text, function (k) {
    var g = el("button", "gap");
    g.type = "button";
    g.addEventListener("click", function () {
      var r = rowEls[k];
      if (r && r.scrollIntoView) { r.scrollIntoView({ behavior: "smooth", block: "center" }); }
    });
    gapEls[k] = g;
    return g;
  });
  tcard.appendChild(tbox);
  main.appendChild(tcard);

  var rcard = el("div", "card");
  var rows = el("div", "rows");
  set.items.forEach(function (it, k) {
    var row = el("div", "row");
    var head = el("div", "rowhead");
    head.appendChild(el("span", "num", String(k + 1)));
    var opts = el("div", "opts");
    optBtns[k] = [];
    s.opts[k].forEach(function (o, j) {
      var b = el("button", "opt", LETTERS.charAt(j) + ") " + o.t);
      b.type = "button";
      b.addEventListener("click", function () {
        if (s.checked) { return; }
        s.ans[k] = j;
        refresh();
      });
      optBtns[k].push(b);
      opts.appendChild(b);
    });
    head.appendChild(opts);
    row.appendChild(head);
    var why = el("div", "why");
    why.style.display = "none";
    row.appendChild(why);
    whyEls[k] = why;
    rowEls[k] = row;
    rows.appendChild(row);
  });
  rcard.appendChild(rows);
  main.appendChild(rcard);

  var resultHolder = el("div");
  var controls = el("div", "controls");
  var bCheck = el("button", "btn", "Prüfen");
  var bRetry = el("button", "btn sec", "Falsche zurücksetzen");
  var bReset = el("button", "btn sec", "Neu starten");
  [bCheck, bRetry, bReset].forEach(function (b) { b.type = "button"; controls.appendChild(b); });
  main.appendChild(controls);
  main.appendChild(resultHolder);

  function refresh() {
    set.items.forEach(function (it, k) {
      var a = s.ans[k], g = gapEls[k], ok = a >= 0 && s.opts[k][a].ok, label;
      label = "(" + (k + 1) + ") " + (a >= 0 ? s.opts[k][a].t : "\u2003\u2003");
      if (s.checked) { label += ok ? " \u2713" : (a >= 0 ? " \u2717" : " \u2717"); }
      g.textContent = label;
      g.className = "gap" + (a >= 0 ? " filled" : "") + (s.checked ? (ok ? " ok" : " bad") : "");
      optBtns[k].forEach(function (b, j) {
        var cls = "opt";
        if (s.checked) {
          if (s.opts[k][j].ok) { cls += " right"; }
          else if (j === a) { cls += " wrong"; }
        } else if (j === a) { cls += " sel"; }
        b.className = cls;
        b.disabled = s.checked;
      });
    });
    bCheck.disabled = s.checked;
    bRetry.disabled = !s.checked;
  }

  bCheck.addEventListener("click", function () {
    var score = 0, empty = 0;
    s.checked = true;
    set.items.forEach(function (it, k) {
      var a = s.ans[k], ok = a >= 0 && s.opts[k][a].ok, w = whyEls[k];
      if (ok) { score++; }
      if (a < 0) { empty++; }
      clear(w);
      w.appendChild(el("b", "", ok ? "\u2713 Richtig. " : (a < 0 ? "\u2717 Nicht beantwortet. " : "\u2717 Falsch. ")));
      w.appendChild(document.createTextNode(it.why));
      w.style.display = "block";
    });
    refresh();
    clear(resultHolder);
    var box = resultBox(score, set.items.length);
    if (empty > 0) { box.appendChild(el("small", "", empty + " Lücke(n) waren noch leer.")); }
    resultHolder.appendChild(box);
    saveBest(set.id, score);
    renderTabs();
    if (box.scrollIntoView) { box.scrollIntoView({ behavior: "smooth", block: "nearest" }); }
  });
  bRetry.addEventListener("click", function () {
    set.items.forEach(function (it, k) {
      var a = s.ans[k];
      if (!(a >= 0 && s.opts[k][a].ok)) { s.ans[k] = -1; }
      whyEls[k].style.display = "none";
    });
    s.checked = false;
    clear(resultHolder);
    refresh();
  });
  bReset.addEventListener("click", function () { init1(cur1); render1(); window.scrollTo(0, 0); });

  refresh();
  if (s.checked) { bCheck.click(); }
}

/* ===================== TEIL 2 ===================== */
function init2(i) {
  var set = T2[i], words = [], s = { bank: [], fill: [], active: 0, checked: false };
  set.gaps.forEach(function (g) { words.push(g.w); });
  set.extra.forEach(function (w) { words.push(w); });
  s.bank = shuffle(words);
  set.gaps.forEach(function () { s.fill.push(-1); });
  st2[i] = s;
}

function render2() {
  if (!st2[cur2]) { init2(cur2); }
  var set = T2[cur2], s = st2[cur2], main = document.getElementById("main");
  clear(main);

  var info = el("div", "card info");
  info.appendChild(el("strong", "", "Aufgabe – Teil 2"));
  info.appendChild(document.createTextNode("Wähle für jede Lücke (1–10) das passende Wort aus der Wortbank. Jedes Wort passt nur einmal; fünf Wörter bleiben übrig. Tippe eine Lücke an, dann ein Wort. Tippe eine gefüllte Lücke an, um sie zu leeren."));
  main.appendChild(info);

  var work = el("div", "work");
  var gapEls = [];
  var tcard = el("div", "card");
  tcard.appendChild(el("p", "heading", set.heading));
  var tbox = el("div", "textbox");
  buildText(tbox, set.text, function (k) {
    var g = el("button", "gap");
    g.type = "button";
    g.addEventListener("click", function () {
      if (s.checked) { return; }
      s.fill[k] = -1;
      s.active = k;
      refresh();
    });
    gapEls[k] = g;
    return g;
  });
  tcard.appendChild(tbox);
  work.appendChild(tcard);

  var bank = el("div", "bank");
  bank.appendChild(el("h3", "", "Wortbank"));
  var chips = el("div", "chips"), chipEls = [];
  s.bank.forEach(function (w, idx) {
    var c = el("button", "chip");
    c.type = "button";
    c.appendChild(el("i", "", LETTERS.charAt(idx)));
    c.appendChild(document.createTextNode(w));
    c.addEventListener("click", function () { place(idx); });
    chipEls.push(c);
    chips.appendChild(c);
  });
  bank.appendChild(chips);
  work.appendChild(bank);
  main.appendChild(work);

  var controls = el("div", "controls");
  var bCheck = el("button", "btn", "Prüfen");
  var bRetry = el("button", "btn sec", "Falsche zurücksetzen");
  var bReset = el("button", "btn sec", "Neu starten");
  [bCheck, bRetry, bReset].forEach(function (b) { b.type = "button"; controls.appendChild(b); });
  main.appendChild(controls);
  var resultHolder = el("div");
  main.appendChild(resultHolder);
  var explHolder = el("div");
  main.appendChild(explHolder);

  function nextEmpty(from) {
    var n = s.fill.length, i, k;
    for (i = 1; i <= n; i++) {
      k = (from + i) % n;
      if (s.fill[k] < 0) { return k; }
    }
    return -1;
  }
  function place(idx) {
    if (s.checked) { return; }
    var i, target;
    for (i = 0; i < s.fill.length; i++) { if (s.fill[i] === idx) { s.fill[i] = -1; } }
    target = s.active;
    if (target < 0 || s.fill[target] >= 0) { target = nextEmpty(-1); }
    if (target < 0) { refresh(); return; }
    s.fill[target] = idx;
    s.active = nextEmpty(target);
    refresh();
  }
  function isOk(k) { return s.fill[k] >= 0 && s.bank[s.fill[k]] === set.gaps[k].w; }

  function refresh() {
    var used = {};
    set.gaps.forEach(function (g, k) {
      var f = s.fill[k], label = "(" + (k + 1) + ") ";
      if (f >= 0) { used[f] = true; label += s.bank[f]; } else { label += "\u2003\u2003"; }
      if (s.checked) { label += isOk(k) ? " \u2713" : " \u2717"; }
      gapEls[k].textContent = label;
      gapEls[k].className = "gap" + (f >= 0 ? " filled" : "") +
        (!s.checked && s.active === k ? " active" : "") +
        (s.checked ? (isOk(k) ? " ok" : " bad") : "");
    });
    chipEls.forEach(function (c, idx) {
      c.className = "chip" + (used[idx] ? " used" : "");
      c.disabled = s.checked;
    });
    bCheck.disabled = s.checked;
    bRetry.disabled = !s.checked;
  }

  bCheck.addEventListener("click", function () {
    var score = 0, empty = 0, leftover = [];
    s.checked = true;
    clear(explHolder);
    var card = el("div", "card");
    card.appendChild(el("p", "heading", "Lösungen und Erklärungen"));
    set.gaps.forEach(function (g, k) {
      var ok = isOk(k), f = s.fill[k], d = el("div", "expl"), t;
      if (ok) { score++; }
      if (f < 0) { empty++; }
      t = el("span", "tag " + (ok ? "ok" : "bad"), (ok ? "\u2713 " : "\u2717 ") + "(" + (k + 1) + ") " + g.w);
      d.appendChild(t);
      if (!ok) {
        d.appendChild(document.createTextNode(f >= 0 ? " – deine Antwort: „" + s.bank[f] + "“. " : " – nicht beantwortet. "));
      } else {
        d.appendChild(document.createTextNode(". "));
      }
      d.appendChild(document.createTextNode(g.why));
      card.appendChild(d);
    });
    s.bank.forEach(function (w) {
      var isAnswer = false;
      set.gaps.forEach(function (g) { if (g.w === w) { isAnswer = true; } });
      if (!isAnswer) { leftover.push(w); }
    });
    card.appendChild(el("p", "leftover", "Passen in keine Lücke: " + leftover.join(", ") + "."));
    explHolder.appendChild(card);
    refresh();
    clear(resultHolder);
    var box = resultBox(score, set.gaps.length);
    if (empty > 0) { box.appendChild(el("small", "", empty + " Lücke(n) waren noch leer.")); }
    resultHolder.appendChild(box);
    saveBest(set.id, score);
    renderTabs();
    if (box.scrollIntoView) { box.scrollIntoView({ behavior: "smooth", block: "nearest" }); }
  });
  bRetry.addEventListener("click", function () {
    set.gaps.forEach(function (g, k) { if (!isOk(k)) { s.fill[k] = -1; } });
    s.checked = false;
    s.active = nextEmpty(-1);
    clear(resultHolder); clear(explHolder);
    refresh();
  });
  bReset.addEventListener("click", function () { init2(cur2); render2(); window.scrollTo(0, 0); });

  refresh();
  if (s.checked) { bCheck.click(); }
}

function renderAll() {
  renderTabs();
  if (mode === 1) { render1(); } else { render2(); }
}
renderAll();

})();
</script>
</body>
