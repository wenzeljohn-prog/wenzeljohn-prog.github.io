.pool{margin:6px 0 10px;padding:10px;background:#f4f0e9;min-height:52px}

          alts: [["ich", "spiele", "am Wochenende", "Fußball"], ["ich", "spiele", "Fußball", "am Wochenende"]] },
        { type: "jn", end: "?", chips: ["hast", "du", "morgen", "Zeit"], verb: "hast",
          alts: [["hast", "du", "Zeit", "morgen"]] },

  /* ---------- Zustand ---------- */
  var S = { step: 0, item: 0, d: null, st: null, ds: {}, states: {}, navOpen: false, lang: "de" };
  try { var saved = window.localStorage.getItem("weilTrainerLang"); if (saved && LI[saved] !== undefined) { S.lang = saved; } } catch (e) { /* ignorieren */ }
  var root = document.getElementById("app");
  var app = root;

  /* ---------- Helfer ---------- */
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) { e.className = cls; }
    if (text !== undefined) { e.textContent = text; }
    return e;
  }
  function X(key, wrapCls) {
    var box = el("span", "x" + (wrapCls ? " " + wrapCls : ""));
    var entry = I[key];
    if (!entry) { box.appendChild(el("span", "de", key)); return box; }
    box.appendChild(el("span", "de", entry[0]));
    if (S.lang !== "de") {
      var t = entry[LI[S.lang]];
      if (t) {
        var s = el("span", "tr", t);
        s.setAttribute("dir", (S.lang === "fa" || S.lang === "ar") ? "rtl" : "ltr");
        s.setAttribute("lang", S.lang);
        box.appendChild(s);
      }
    }
    return box;
  }
  function btn(text, cls, fn) {
    var b = el("button", cls, text);
    b.type = "button";
    if (fn) { b.addEventListener("click", fn); }
    return b;
  }
  function btnX(key, cls, fn) {
    var b = el("button", cls);
    b.type = "button";
    b.appendChild(X(key));
    if (fn) { b.addEventListener("click", fn); }
    return b;
  }
  function shuffle(a) {
    var r = a.slice(), i, j, t;
    for (i = r.length - 1; i > 0; i--) {
      j = Math.floor(Math.random() * (i + 1));
      t = r[i]; r[i] = r[j]; r[j] = t;
    }
    return r;
  }
  function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
  function de(key) { return I[key][0]; }

  function langSelect() {
    var sel = el("select");
    sel.setAttribute("aria-label", "Erklärsprache / Language");
    LANGS.forEach(function (l) {
      var o = el("option", null, LNAMES[l]);
      o.value = l;
      if (l === S.lang) { o.selected = true; }
      sel.appendChild(o);
    });
    sel.addEventListener("change", function () {
      S.lang = sel.value;
      try { window.localStorage.setItem("weilTrainerLang", S.lang); } catch (e) { /* ignorieren */ }
      render();
    });
    return sel;
  }

  function newItemState(step, item) {
    var chips = step.fixedWeil ? item.clause.slice() : item.chips.slice();
    var idx = [], i, order, tries = 0, same;
    for (i = 0; i < chips.length; i++) { idx.push(i); }
    do {
      order = shuffle(idx);
      same = true;
      for (i = 0; i < order.length; i++) { if (order[i] !== i) { same = false; } }
      tries++;
    } while (same && tries < 30);
    return { chips: chips, order: order, placed: [], attempts: 0, done: false, msgKey: "", msgType: "", offerSolution: false };
  }

  function resetAll() { S.ds = {}; S.states = {}; S.navOpen = false; enterStep(0); }

  function enterStep(i, itemIdx) {
    var step = STEPS[i], n;
    S.step = i; S.item = itemIdx || 0; S.d = null; S.st = null; S.navOpen = false;
    if (step.kind === "discover") {
      if (!S.ds[i]) {
        S.ds[i] = { solved: [], wrong: {}, msgs: {}, qWrong: {}, qDone: false };
        for (n = 0; n < step.examples.length; n++) { S.ds[i].solved.push(false); }
      }
      S.d = S.ds[i];
    }
    if (step.kind === "ex") {
      var key = i + "-" + S.item;
      if (!S.states[key]) { S.states[key] = newItemState(step, step.items[S.item]); }
      S.st = S.states[key];
    }
    render();
    try { window.scrollTo(0, 0); } catch (e) { /* ignorieren */ }
  }

  function navPanel() {
    var panel = el("div", "navp");
    STEPS.forEach(function (s, si) {
      if (s.kind === "intro") { return; }
      var row = el("div", "nrow");
      if (s.kind === "end") {
        row.appendChild(btn("Ergebnis", "nb" + (S.step === si ? " cur" : ""), function () { enterStep(si); }));
        panel.appendChild(row);
        return;
      }
      row.appendChild(el("span", "nl", s.label));
      if (s.kind === "discover") {
        var cls = "nb" + (S.ds[si] && S.ds[si].qDone ? " ok" : "") + (S.step === si ? " cur" : "");
        row.appendChild(btn("Beispiele", cls, function () { enterStep(si); }));
      } else {
        s.items.forEach(function (it, k) {
          var st = S.states[si + "-" + k];
          var c = "nb";
          if (st && st.done) { c += st.attempts === 0 ? " ok" : " part"; }
          if (S.step === si && S.item === k) { c += " cur"; }
          row.appendChild(btn(String(k + 1), c, function () { enterStep(si, k); }));
        });
      }
      panel.appendChild(row);
    });
    return panel;
  }

  function header(step) {
    var label = step.label || "Einführung";
    if (step.kind === "ex") { label += " · Aufgabe " + (S.item + 1) + " von " + step.items.length; }
    var hd = el("header", "top");
    var wrap = el("div", "wrap");
    wrap.appendChild(el("div", "chnum", "A2"));
    wrap.appendChild(el("div", "kicker", "Treffpunkt A1/A2 · Lektion 1–3 · Grammatik"));
    wrap.appendChild(el("h1", null, "weil-Sätze"));
    var pr = el("div", "progress");
    pr.appendChild(el("span", null, label));
    var bar = el("div", "bar");
    var fill = el("i");
    fill.style.width = Math.round((S.step / (STEPS.length - 1)) * 100) + "%";
    bar.appendChild(fill);
    pr.appendChild(bar);
    wrap.appendChild(pr);
    hd.appendChild(wrap);
    root.appendChild(hd);

    var nav = el("nav", "jump");
    nav.setAttribute("aria-label", "Aufgaben");
    var nw = el("div", "wrap");
    var nb = el("button", "navbtn");
    nb.type = "button";
    nb.setAttribute("aria-expanded", S.navOpen ? "true" : "false");
    nb.appendChild(X("nav"));
    nb.addEventListener("click", function () { S.navOpen = !S.navOpen; render(); });
    nw.appendChild(nb);
    nw.appendChild(langSelect());
    nw.appendChild(el("span", "sp"));
    nw.appendChild(btnX("restart", "link", function () { resetAll(); }));
    nav.appendChild(nw);
    root.appendChild(nav);
    if (S.navOpen) { root.appendChild(navPanel()); }
  }

  /* ---------- Rendern ---------- */
  function render() {
    var step = STEPS[S.step];
    root.innerHTML = "";
    app = root;
    header(step);
    app = el("main");
    root.appendChild(app);
    if (step.kind === "intro") { renderIntro(); }
    else if (step.kind === "discover") { renderDiscover(step); }
    else if (step.kind === "ex") { renderExercise(step); }
    else if (step.kind === "end") { renderEnd(); }
  }

  function renderIntro() {
    var c = el("div", "card");
    var h = el("h2"); h.appendChild(X("intro_title")); c.appendChild(h);
    c.appendChild(el("p", "muted", "Deutsch A2 · Entwurf · Wortschatz aus Treffpunkt A1/A2, Lektion 1–3"));
    var p = el("p"); p.appendChild(X("intro_text")); c.appendChild(p);
    var ol = el("ol", "steps");
    STEPS.forEach(function (s) {
      if (s.kind === "intro" || s.kind === "end") { return; }
      var li = el("li");
      li.appendChild(el("b", null, s.label + ": "));
      li.appendChild(X(s.title));
      ol.appendChild(li);
    });
    c.appendChild(ol);
    c.appendChild(btnX("start", "btn", function () { enterStep(1); }));
    app.appendChild(c);
  }

  function wordsLine(words, vIdx, showV) {
    var frag = document.createDocumentFragment();
    words.forEach(function (w, i) {
      frag.appendChild(el("span", "w plain" + (showV && i === vIdx ? " v" : ""), w));
    });
    return frag;
  }

  function renderDiscover(step) {
    var d = S.d;
    var card = el("div", "card disc");
    card.appendChild(el("div", "dtag", "Zum Entdecken"));
    var h = el("h2"); h.appendChild(X(step.title)); card.appendChild(h);
    var t = el("p", "muted"); t.appendChild(X(step.task)); card.appendChild(t);

    step.examples.forEach(function (ex, i) {
      var box = el("div", "ex");
      var r1 = el("div", "row");
      r1.appendChild(el("span", "tag", "Normaler Satz"));
      r1.appendChild(wordsLine(ex.simple, ex.sv, d.solved[i]));
      box.appendChild(r1);

      if (ex.cmp && d.solved[i]) {
        var rc = el("div", "row");
        rc.appendChild(el("span", "tag", "Mit " + ex.cmp.conn));
        rc.appendChild(el("span", "w plain", ex.pre));
        rc.appendChild(el("span", "w plain k", ex.cmp.conn));
        rc.appendChild(wordsLine(ex.cmp.words, ex.cmp.v, true));
        box.appendChild(rc);
      }

      var r2 = el("div", "row");
      r2.appendChild(el("span", "tag", "Mit " + ex.conn));
      r2.appendChild(el("span", "w plain", ex.pre));
      r2.appendChild(el("span", "w plain k", ex.conn));
      if (d.solved[i]) {
        r2.appendChild(wordsLine(ex.words, ex.v, true));
      } else {
        ex.words.forEach(function (w, wi) {
          var b = btn(w, "w" + (d.wrong[i + "-" + wi] ? " bad" : ""), function () {
            if (wi === ex.v) {
              d.solved[i] = true; d.msgs[i] = false;
            } else {
              d.wrong[i + "-" + wi] = true;
              d.msgs[i] = true;
            }
            render();
          });
          r2.appendChild(b);
        });
      }
      box.appendChild(r2);
      if (d.msgs[i] && !d.solved[i]) {
        var m = el("div", "msg no"); m.appendChild(X("wrongtap")); box.appendChild(m);
      }
      card.appendChild(box);
    });

    var allSolved = d.solved.every(function (x) { return x; });
    if (allSolved) {
      var look = el("div", "msg ok"); look.appendChild(X("look")); card.appendChild(look);
      var qh = el("h2"); qh.appendChild(X(step.q.text)); card.appendChild(qh);
      step.q.options.forEach(function (ok, oi) {
        var cls = "opt";
        if (d.qDone && oi === step.q.correct) { cls += " good"; }
        else if (d.qWrong[oi]) { cls += " bad"; }
        var b = el("button", cls);
        b.type = "button";
        b.appendChild(X(ok));
        b.addEventListener("click", function () {
          if (d.qDone) { return; }
          if (oi === step.q.correct) { d.qDone = true; } else { d.qWrong[oi] = true; }
          render();
        });
        card.appendChild(b);
      });
      if (!d.qDone && Object.keys(d.qWrong).length) {
        var qw = el("div", "msg no"); qw.appendChild(X("qwrong")); card.appendChild(qw);
      }
    }

    if (d.qDone) {
      var rule = el("div", "rule");
      var rh = el("b", "h"); rh.appendChild(X("merke")); rule.appendChild(rh);
      var rp = el("p"); rp.appendChild(X(step.rule.text)); rule.appendChild(rp);
      var f = el("div", "formula");
      step.rule.formula.forEach(function (p) { f.appendChild(el("span", p[1], p[0])); });
      rule.appendChild(f);
      card.appendChild(rule);
      card.appendChild(btnX("practise", "btn", function () { enterStep(S.step + 1); }));
    }
    app.appendChild(card);
  }

  function renderExercise(step) {
    var item = step.items[S.item];
    var st = S.st;
    var card = el("div", "card");
    var h = el("h2"); h.appendChild(X(step.title)); card.appendChild(h);
    var t = el("p", "muted"); t.appendChild(X(step.task)); card.appendChild(t);

    if (item.q) { card.appendChild(el("div", "bubble", item.q)); }

    if (step.fixedWeil) {
      var line = el("div", "build");
      line.appendChild(el("span", null, item.pre + " "));
      line.appendChild(el("span", "k", "weil …"));
      card.appendChild(line);
    }

    var slot = el("div", "slot");
    st.placed.forEach(function (ci, pos) {
      var txt = st.chips[ci];
      if (!step.fixedWeil && pos === 0) { txt = cap(txt); }
      slot.appendChild(btn(txt, "w", function () {
        if (st.done) { return; }
        st.placed.splice(pos, 1);
        st.msgKey = ""; st.msgType = "";
        render();
      }));
    });
    if (!st.placed.length) {
      var ph = el("span", "muted"); ph.appendChild(X("slot")); slot.appendChild(ph);
    }
    card.appendChild(slot);

    if (!st.done) {
      var pool = el("div", "pool");
      st.order.forEach(function (ci) {
        if (st.placed.indexOf(ci) !== -1) { return; }
        pool.appendChild(btn(st.chips[ci], "w", function () {
          st.placed.push(ci);
          st.msgKey = ""; st.msgType = "";
          render();
        }));
      });
      card.appendChild(pool);
    }

    if (st.msgKey) {
      var m = el("div", "msg " + st.msgType); m.appendChild(X(st.msgKey)); card.appendChild(m);
    }

    if (st.done) {
      card.appendChild(solutionLine(step, item, st));
      var last = S.item === step.items.length - 1;
      card.appendChild(btnX(last ? "cont" : "next", "btn", function () {
        if (last) { enterStep(S.step + 1); }
        else { enterStep(S.step, S.item + 1); }
      }));
    } else {
      var check = btnX("check", "btn", function () { checkAnswer(step, item); });
      check.disabled = st.placed.length !== st.chips.length;
      card.appendChild(check);
      card.appendChild(btnX("reset", "btn sec", function () { st.placed = []; st.msgKey = ""; st.msgType = ""; render(); }));
      if (st.offerSolution) {
        card.appendChild(btnX("sol", "btn sec", function () {
          st.done = true; st.msgKey = "solmsg"; st.msgType = "info";
          st.placed = [];
          for (var i = 0; i < st.chips.length; i++) { st.placed.push(i); }
          render();
        }));
      }
    }
    app.appendChild(card);
  }

  function solutionLine(step, item, st) {
    var wrap = el("div", "row");
    var toks = st.placed.map(function (ci) { return st.chips[ci]; });
    var hl = item.hl || [item.verb];
    var conns = ["weil", "denn", "aber"];
    if (step.fixedWeil) {
      wrap.appendChild(el("span", "w plain", item.pre));
      wrap.appendChild(el("span", "w plain k", "weil"));
    }
    toks.forEach(function (tk, i) {
      var txt = tk;
      if (!step.fixedWeil && i === 0) { txt = cap(txt); }
      if (i === toks.length - 1) { txt += (item.end || "."); }
      else if (!step.fixedWeil && conns.indexOf(toks[i + 1]) !== -1) { txt += ","; }
      var isV = hl.indexOf(tk) !== -1;
      var isConn = conns.indexOf(tk) !== -1;
      wrap.appendChild(el("span", "w plain" + (isV ? " v" : "") + (isConn ? " k" : ""), txt));
    });
    return wrap;
  }

  function sameSeq(a, b) {
    var i;
    if (a.length !== b.length) { return false; }
    for (i = 0; i < a.length; i++) { if (a[i] !== b[i]) { return false; } }
    return true;
  }

  function checkAnswer(step, item) {
    var st = S.st;
    var toks = st.placed.map(function (ci) { return st.chips[ci]; });
    var sols = [st.chips].concat(item.alts || []);
    var ok = false, i;
    for (i = 0; i < sols.length; i++) { if (sameSeq(toks, sols[i])) { ok = true; } }

    if (ok) {
      st.done = true;
      st.msgKey = st.attempts === 0 ? "ok1" : "ok2";
      st.msgType = "ok";
    } else {
      st.attempts++;
      var lastTok = toks[toks.length - 1];
      var key;
      if (item.type && item.type !== "weil") {
        if (item.type === "denn" || item.type === "aber") { key = "h_denn"; }
        else if (item.type === "w") { key = "h_w"; }
        else if (item.type === "jn") { key = "h_jn"; }
        else { key = (lastTok === item.verb) ? "h_noweil" : "h_hs"; }
      } else if (lastTok !== item.verb) {
        key = "h_end";
      } else if (!step.fixedWeil && toks.indexOf("weil") !== st.chips.indexOf("weil")) {
        key = "h_main";
      } else {
        key = "h_subj";
      }
      st.msgKey = key;
      st.msgType = "no";
      if (st.attempts >= 2) { st.offerSolution = true; }
    }
    render();
  }

  function renderEnd() {
    var card = el("div", "card");
    var h = el("h2"); h.appendChild(X("endtitle")); card.appendChild(h);
    var right = 0, total = 0;
    var table = el("table");
    STEPS.forEach(function (s, si) {
      if (s.kind !== "ex") { return; }
      var r = { right: 0, total: s.items.length }, k, stt;
      for (k = 0; k < s.items.length; k++) {
        stt = S.states[si + "-" + k];
        if (stt && stt.done && stt.attempts === 0) { r.right++; }
      }
      right += r.right; total += r.total;
      var tr = el("tr");
      tr.appendChild(el("td", null, s.label));
      var td = el("td");
      td.appendChild(el("div", null, r.right + " / " + r.total));
      td.appendChild(X("firsttry"));
      tr.appendChild(td);
      table.appendChild(tr);
    });
    card.appendChild(el("div", "score", right + " / " + total));
    card.appendChild(table);
    card.appendChild(btnX("again", "btn", function () { resetAll(); }));
    app.appendChild(card);
  }

  enterStep(0);
})();
</script>
</body>
</html>
