}

/* ---------- Spiel-Logik ---------- */
function pickBalanced(per) {
  var out = [], k, n, g;
  for (k = 0; k < ORDER.length; k++) {
    g = [];
    for (n = 0; n < ITEMS.length; n++) { if (ITEMS[n].k === ORDER[k]) { g.push(ITEMS[n]); } }
    out = out.concat(shuffle(g).slice(0, per));
  }
  return shuffle(out);
}
function newGame(mode, items) {
  var pool;
  if (items) { pool = shuffle(items); }
  else if (mode === 'tl') { pool = shuffle(TLITEMS); }
  else { pool = pickBalanced(2); }
  return {mode: mode, items: pool, i: 0, score: 0, wrong: [], phase: 'q', done: false, res: null, vals: null, last: null};
}
function newMatch(kind) {
  match = {kind: kind || 'fn', right: shuffle(ORDER), left: shuffle(ORDER), selL: null, selR: null, done: {}, tries: 0, bad: null};
}
function doneCount() {
  var c = 0, k;
  for (k in match.done) { if (match.done.hasOwnProperty(k)) { c++; } }
  return c;
}
function setMode(m) {
  state.mode = m;
  if (m === 'quiz' || m === 'write' || m === 'tl') {
    if (!games[m]) { games[m] = newGame(m); }
    game = games[m];
  } else if (m === 'match') {
    if (!match) { newMatch('fn'); }
  }
  render();
  window.scrollTo(0, 0);
}
function answerQuiz(key) {
  var it = game.items[game.i];
  if (game.phase !== 'q') { return; }
  var ok = (key === it.k);
  game.last = {ok: ok, pick: key};
  if (ok) { game.score++; } else { game.wrong.push(it); }
  game.phase = 'a';
  render();
}
function answerTL(type) {
  var it = game.items[game.i];
  if (game.phase !== 'q') { return; }
  var ok = (type === it.tl);
  game.last = {ok: ok, pick: type};
  if (ok) { game.score++; } else { game.wrong.push(it); }
  game.phase = 'a';
  render();
}
function checkWrite() {
  if (game.phase !== 'q') { return; }
  var it = game.items[game.i];
  var ea = document.getElementById('in_a');
  var eb = document.getElementById('in_b');
  var a = ea ? ea.value : '';
  var b = eb ? eb.value : '';
  if (!norm(a)) { if (ea) { ea.focus(); } return; }
  if (eb && !norm(b)) { eb.focus(); return; }
  var okA = accepts(a, it.a, it.altA);
  var okB = eb ? accepts(b, it.b, it.altB) : true;
  game.res = {a: okA, b: okB};
  game.vals = {a: a, b: b};
  game.last = {ok: okA && okB};
  if (okA && okB) { game.score++; } else { game.wrong.push(it); }
  game.phase = 'a';
  render();
}
function nextItem() {
  if (game.phase !== 'a') { return; }
  if (game.i >= game.items.length - 1) {
    game.done = true;
  } else {
    game.i++;
    game.phase = 'q'; game.res = null; game.vals = null; game.last = null;
  }
  render();
  window.scrollTo(0, 0);
}
function restart(practice) {
  var items = practice ? game.wrong.slice() : null;
  games[state.mode] = newGame(state.mode, items);
  game = games[state.mode];
  render();
  window.scrollTo(0, 0);
}
function tryMatch() {
  if (match.selL && match.selR) {
    if (match.selL === match.selR) {
      match.done[match.selL] = true;
      match.selL = null; match.selR = null;
    } else {
      match.tries++;
      match.bad = {l: match.selL, r: match.selR};
      setTimeout(function () {
        if (match) { match.bad = null; match.selL = null; match.selR = null; render(); }
      }, 650);

  }
}

      h += '<span class="ex" style="border-color:' + p.col + ';color:' + p.col + '">' + esc(p.ex[j]) + '</span>';
    }
    h += '</div><div class="row"><div class="rl">' + lblIn('l_note') + '</div>';
    for (j = 0; j < p.nt.length; j++) {
      h += '<div class="note" style="border-left-color:' + p.col + '">' + bi(p.nt[j]) + '</div>';
    }
    h += '</div></div>';
  }
  h += '<div class="card"><div class="rl">' + lblIn('cmp_t') + '</div>';
  var cmp = ['ab', 'bis', 'vb'];
  for (i = 0; i < cmp.length; i++) {
    p = P[cmp[i]];
    h += '<div class="cmprow"><span class="badge" style="background:' + p.col + '">' + esc(p.lab) + '</span>' + tlHTML(p.tl, p.col) + '</div>';
  }
  h += '<div class="note">' + bi('cmp1') + '</div>';
  h += '<div class="note" style="margin-top:10px">' + bi('cmp2') + '</div></div>';
  return h;
}

function bodyQuiz() {
  if (game.done) { return resultHTML(); }
  var it = game.items[game.i], h, k, i;
  h = '<div class="card">' + bi('inst_quiz') + progress();
  h += '<div class="ctx">' + esc(it.q) + '</div>';
  if (game.phase === 'q') {
    h += '<div class="sent">' + sentenceHTML(it, 'open') + '</div><div class="opts">';
    for (i = 0; i < ORDER.length; i++) {
      k = ORDER[i];
      h += '<button class="opt" style="border-top-color:' + P[k].col + '" data-act="pick" data-v="' + k + '">' + esc(P[k].lab) + '</button>';
    }
    h += '</div>';
  } else {
    h += '<div class="sent">' + sentenceHTML(it, 'filled') + '</div>';
    h += feedbackHTML(game.last.ok, it.k, true);
    h += '<button class="btn" id="nextbtn" data-act="next">' + lbl('next') + '</button>';
  }
  return h + '</div>';
}

function bodyWrite() {
  if (game.done) { return resultHTML(); }
  var it = game.items[game.i], h;
  h = '<div class="card">' + bi('inst_write') + progress();
  h += '<div class="ctx">' + esc(it.q) + '</div>';
  h += '<div class="sent">' + sentenceHTML(it, 'input') + '</div>';
  if (it.date) { h += '<div class="note">' + bi('tip_date') + '</div>'; }
  if (game.phase === 'q') {
    h += '<button class="btn" data-act="check">' + lbl('check') + '</button>';
  } else {
    if (!game.last.ok) {
      h += '<div class="corr"><span class="de">' + esc(T.is.de) + '</span>' + trHTML('is') + '<div class="sent" style="margin-bottom:0">' + sentenceHTML(it, 'filled') + '</div></div>';
    }
    h += feedbackHTML(game.last.ok, it.k, false);
    h += '<button class="btn" id="nextbtn" data-act="next">' + lbl('next') + '</button>';
  }
  return h + '</div>';
}

function hlSentence(t, col) {
  return esc(t).replace(/\*([^*]+)\*/g, function (m, g) {
    return '<b class="hl" style="color:' + col + '">' + g + '</b>';
  });
}
function bodyTL() {
  if (game.done) { return resultHTML(); }
  var it = game.items[game.i], p = P[it.k], h, i, t, cls;
  h = '<div class="card">' + bi('inst_tl') + progress();
  h += '<div class="sent">' + hlSentence(it.t, p.col) + '</div><div class="tlopts">';
  for (i = 0; i < TLO.length; i++) {
    t = TLO[i][0]; cls = '';
    if (game.phase === 'a') {
      if (t === it.tl) { cls = ' good'; }
      else if (game.last && t === game.last.pick) { cls = ' badp'; }
    }
    h += '<button class="tlo' + cls + '" data-act="tlpick" data-v="' + t + '">' + tlHTML(t, '#2b5fd9') + '<div>' + lbl(TLO[i][1]) + '</div></button>';
  }
  h += '</div>';
  if (game.phase === 'a') {
    h += feedbackHTML(game.last.ok, it.k, false);
    h += '<button class="btn" id="nextbtn" data-act="next">' + lbl('next') + '</button>';
  }
  return h + '</div>';
}

function bodyMatch() {
  var m = match, h, i, k, cls, all = (doneCount() === ORDER.length);
  h = '<div class="card">' + bi('inst_match');
  h += '<div class="seg"><button class="chip' + (m.kind === 'fn' ? ' on' : '') + '" data-act="mkind" data-v="fn">' + lblIn('l_use') + '</button>' +
    '<button class="chip' + (m.kind === 'q' ? ' on' : '') + '" data-act="mkind" data-v="q">' + lblIn('l_q') + '</button></div>';
  if (all) {
    h += '<div class="fb ok"><div class="big">' + bi('found') + '</div>' + bi('tries', {n: m.tries, m: 0}) + '</div>';
    h += '<button class="btn" data-act="mnew">' + lbl('again') + '</button>';
  }
  h += '<div class="mgrid"><div class="mcol">';
  for (i = 0; i < m.left.length; i++) {
    k = m.left[i]; cls = '';
    if (m.done[k]) { cls = ' done'; }
    else if (m.bad && m.bad.l === k) { cls = ' badc'; }
    else if (m.selL === k) { cls = ' sel'; }
    h += '<button class="mc lb' + cls + '" style="border-left-color:' + P[k].col + '" data-act="ml" data-v="' + k + '">' + esc(P[k].lab) + '</button>';
  }
  h += '</div><div class="mcol">';
  for (i = 0; i < m.right.length; i++) {
    k = m.right[i]; cls = '';
    if (m.done[k]) { cls = ' done'; }
    else if (m.bad && m.bad.r === k) { cls = ' badc'; }
    else if (m.selR === k) { cls = ' sel'; }
    h += '<button class="mc' + cls + '" style="border-left-color:' + P[k].col + '" data-act="mr" data-v="' + k + '">';
    h += (m.kind === 'fn') ? bi(P[k].fn) : '<div class="de">' + esc(P[k].qm) + '</div>';
    h += '</button>';
  }
  h += '</div></div></div>';
  return h;
}

function render() {
  var h = '<h1>Zeit-Präpositionen</h1><div class="sub">am · um · von … bis · bis · ab</div>';
  h += langBar() + tabBar();
  if (state.mode === 'rules') { h += bodyRules(); }
  else if (state.mode === 'quiz') { h += bodyQuiz(); }
  else if (state.mode === 'write') { h += bodyWrite(); }
  else if (state.mode === 'tl') { h += bodyTL(); }
  else { h += bodyMatch(); }
  h += '<div class="foot">Offline nutzbar · eine einzelne HTML-Datei</div>';
  app.innerHTML = h;
  var el;
  if (state.mode === 'write' && game && !game.done) {
    el = document.getElementById(game.phase === 'q' ? 'in_a' : 'nextbtn');
    if (el) { try { el.focus(); } catch (e2) { /* egal */ } }
  } else if (game && game.phase === 'a' && !game.done && state.mode !== 'rules' && state.mode !== 'match') {
    el = document.getElementById('nextbtn');
    if (el) { try { el.focus(); } catch (e3) { /* egal */ } }
  }
}

/* ---------- Ereignisse ---------- */
function handle(act, v) {
  if (act === 'lang') {
    state.lang = v;
    try { window.localStorage.setItem('zp_lang', v); } catch (e4) { /* egal */ }
    render();
  } else if (act === 'tab') { setMode(v); }
  else if (act === 'pick') { answerQuiz(v); }
  else if (act === 'tlpick') { answerTL(v); }
  else if (act === 'check') { checkWrite(); }
  else if (act === 'next') { nextItem(); }
  else if (act === 'again') { restart(false); }
  else if (act === 'practice') { restart(true); }
  else if (act === 'mkind') { newMatch(v); render(); }
  else if (act === 'mnew') { newMatch(match.kind); render(); }
  else if (act === 'ml') {
    if (match.bad || match.done[v]) { return; }
    match.selL = v; tryMatch(); render();
  } else if (act === 'mr') {
    if (match.bad || match.done[v]) { return; }
    match.selR = v; tryMatch(); render();
  }
}
app.addEventListener('click', function (e) {
  var el = e.target, act;
  while (el && el !== app) {
    if (el.getAttribute) {
      act = el.getAttribute('data-act');
      if (act) { handle(act, el.getAttribute('data-v')); return; }
    }
    el = el.parentNode;
  }
});
app.addEventListener('keydown', function (e) {
  if (e.keyCode === 13 && state.mode === 'write' && game && !game.done) {
    e.preventDefault();
    if (game.phase === 'q') { checkWrite(); } else { nextItem(); }
  }
});

setMode('rules');
})();
</script>
</body>
</html>
