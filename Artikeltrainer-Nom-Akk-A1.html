    background:var(--card);

    padding:18px;
    margin-bottom:14px;
  }
  .rules-toggle{
    display:inline-block; margin-bottom:10px; cursor:pointer;

  }

  .progress{ font-size:0.85rem; color:var(--ink-soft); margin-bottom:6px; }
  .sentence{
    font-size:1.25rem; font-weight:600; margin:6px 0 18px 0; text-align:center;
    line-height:1.7;
  }
  .gap{
    display:inline-block; min-width:78px; padding:2px 6px; border-bottom:3px solid var(--accent);
    color:var(--accent-dark);
  }
  .options{
    display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-bottom:14px;
  }
  .opt-btn{
    padding:14px 6px; font-size:1.05rem; font-weight:600;
    border-radius:10px; border:2px solid var(--line); background:#fbfcfd; color:var(--ink);
    cursor:pointer; min-height:48px;
  }
  .opt-btn:active{ transform:scale(0.98); }
  .opt-btn.correct{ background:var(--good-bg); border-color:var(--good); color:var(--good); }
  .opt-btn.incorrect{ background:var(--bad-bg); border-color:var(--bad); color:var(--bad); }
  .opt-btn:disabled{ cursor:default; opacity:0.85; }
  .feedback{
    min-height:44px; font-size:0.95rem; padding:10px 12px; border-radius:10px;
    margin-bottom:10px; display:none;
  }
  .feedback.show{ display:block; }
  .feedback.good{ background:var(--good-bg); color:var(--good); }
  .feedback.bad{ background:var(--bad-bg); color:var(--bad); }
  .actions{ display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; }
  .next-btn{
    padding:11px 20px; border-radius:10px; border:none; background:var(--accent); color:#fff;

  }
  .next-btn:disabled{ background:#a9bfd1; cursor:default; }
  .score{ font-size:0.92rem; color:var(--ink-soft); }
  .restart-btn{

      subtitle: "ein/eine/einen · kein/keine/keinen · بدون أداة في صيغة الجمع",
      rulesShow: "إظهار القواعد", rulesHide: "إخفاء القواعد",
      rulesIntro: "<p>في اللغة العربية لا توجد أداة نكرة منفصلة (لا مقابل لكلمة \"a/an\")؛ الاسم النكرة يُعرف عادة من غياب \"ال\" التعريف. في الألمانية لكل اسم جنس نحوي: <b>مذكر</b> (der)، <b>مؤنث</b> (die) أو <b>محايد</b> (das)، وتوجد أداة نكرة منفصلة (<b>ein/eine</b>) تدل على شيء جديد أو غير معروف.</p>" +
        "<p><b>Nominativ</b> (الفاعل، مثلاً بعد \"Das ist…\" = \"هذا…\"): ein Mann, eine Frau, ein Kind.</p>" +
        "<p><b>Akkusativ</b> (المفعول به، مثلاً بعد \"Ich habe…\" = \"لدي…\"): يتغيّر شكل المذكر فقط: ein → <b>einen</b>. المؤنث والمحايد لا يتغيّران.</p>" +
        "<p><b>الجمع</b>: لا تُستخدم أداة نكرة على الإطلاق: Das sind Kinder. / Ich habe Brüder.</p>" +
        "<p><b>النفي</b>: تتحول \"ein\" إلى \"kein\" (وليس \"nicht ein\"): kein Mann, keine Frau, kein Kind, einen Bruder → keinen Bruder. الجمع: keine Kinder.</p>",
      progress: "السؤال {n}",
      correct: "إجابة صحيحة!",
      incorrect: "ليست صحيحة.",
      next: "التالي",
      score: "{correct} من {total} صحيحة",
      restart: "إعادة البدء",
      gender_m: "مذكر", gender_f: "مؤنث", gender_n: "محايد", pluralLabel: "جمع",
      explAffix: function(noun, gender, caseLabel, verb, article){
        var v = verb ? " (بعد \"" + verb + "\")" : "";
        return "\"" + noun + "\" اسم " + gender + ". " + caseLabel + v + " ← \"" + article + "\".";
      },
      explPlural: function(noun, article){
        return "\"" + noun + "\" جمع ← بدون أداة: \"" + article + "\".";
      },
      caseNom: "Nominativ", caseAkk: "Akkusativ"
    },
    tr: {
      title: "Artikel Antrenörü",
      subtitle: "ein/eine/einen · kein/keine/keinen · çoğulda artikel yok",
      rulesShow: "Kuralları göster", rulesHide: "Kuralları gizle",
      rulesIntro: "<p>Türkçede belirsiz artikel yoktur; \"bir\" bir sayı sıfatı gibi kullanılır ama zorunlu değildir ve hâllere göre değişmez. Almancada her ismin bir cinsiyeti vardır: <b>eril</b> (der), <b>dişil</b> (die) veya <b>nötr</b> (das), ve belirsiz artikel (<b>ein/eine</b>) bir şeyin yeni veya bilinmeyen olduğunu gösterir; her cümlede zorunludur.</p>" +
        "<p><b>Nominativ</b> (özne, örn. \"Das ist…\" = \"Bu…\"'dan sonra): ein Mann, eine Frau, ein Kind.</p>" +
        "<p><b>Akkusativ</b> (nesne durumu, örn. \"Ich habe…\" = \"Benim … var\"'dan sonra): sadece eril biçim değişir: ein → <b>einen</b>. Dişil ve nötr biçim aynı kalır.</p>" +
        "<p><b>Çoğul</b>: hiçbir artikel kullanılmaz: Das sind Kinder. / Ich habe Brüder.</p>" +
        "<p><b>Olumsuzluk</b>: \"ein\" yerine \"kein\" kullanılır (\"nicht ein\" değil): kein Mann, keine Frau, kein Kind, einen Bruder → keinen Bruder. Çoğul: keine Kinder.</p>",
      progress: "Soru {n}",
      correct: "Doğru!",
      incorrect: "Maalesef yanlış.",
      next: "İleri",
      score: "{total} sorudan {correct} doğru",
      restart: "Yeniden başla",
      gender_m: "eril", gender_f: "dişil", gender_n: "nötr", pluralLabel: "çoğul",
      explAffix: function(noun, gender, caseLabel, verb, article){
        var v = verb ? " (\"" + verb + "\"dan sonra)" : "";
        return "\"" + noun + "\" " + gender + ". " + caseLabel + v + " → \"" + article + "\".";
      },
      explPlural: function(noun, article){
        return "\"" + noun + "\" çoğul → artikelsiz: \"" + article + "\".";
      },
      caseNom: "Nominativ", caseAkk: "Akkusativ"
    }
  };

  var currentLang = "de";
  var rtlLangs = {ar:true};

  // ---------- Zustand ----------
  var state = { correct:0, total:0, current:null, answered:false, questionNum:0 };

  function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

  function shuffle(arr){
    var a = arr.slice();
    for(var i=a.length-1;i>0;i--){
      var j = Math.floor(Math.random()*(i+1));
      var t=a[i]; a[i]=a[j]; a[j]=t;
    }
    return a;
  }

  function cap(w){ return w.charAt(0).toUpperCase() + w.slice(1); }

  function getArticle(gender, isAkk, isPlural, isNeg){
    if(isPlural){ return isNeg ? "keine" : "–"; }
    if(!isAkk){
      if(isNeg){ return gender==="m" ? "kein" : (gender==="f" ? "keine" : "kein"); }
      return gender==="m" ? "ein" : (gender==="f" ? "eine" : "ein");
    } else {
      if(isNeg){ return gender==="m" ? "keinen" : (gender==="f" ? "keine" : "kein"); }
      return gender==="m" ? "einen" : (gender==="f" ? "eine" : "ein");
    }
  }

  function generateQuestion(){
    var isAkk = Math.random() < 0.5;
    var noun, verb=null, pronoun=null;

    if(isAkk){
      noun = pick(AKK_NOUNS);
      verb = pick(noun.akkVerbs);
      pronoun = pick(PRONOUNS);
    } else {
      noun = pick(NOUNS);
    }

    var isPlural;
    if(noun.pluralOnly){ isPlural = true; }
    else { isPlural = noun.hasPlural && Math.random() < 0.3; }

    var allowNeg = noun.allowNegation !== false;
    var isNeg = allowNeg && Math.random() < 0.3;

    var article = getArticle(noun.gender, isAkk, isPlural, isNeg);

    var nounForm;
    if(isPlural){ nounForm = noun.plural || noun.base; }
    else { nounForm = (isAkk && noun.weakAkk) ? noun.weakAkk : noun.base; }

    var sentenceParts;
    if(isAkk){
      var verbForm = VERB_CONJ[verb][pronoun];
      sentenceParts = [cap(pronoun), verbForm, "__GAP__", nounForm + "."];
    } else {
      var copula = isPlural ? "sind" : "ist";
      sentenceParts = ["Das", copula, "__GAP__", nounForm + "."];
    }

    return {
      isAkk: isAkk, isPlural: isPlural, isNeg: isNeg,
      noun: noun, verb: verb, pronoun: pronoun,
      article: article, sentenceParts: sentenceParts,
      nounDisplay: nounForm, nounBase: noun.base
    };
  }

  // ---------- Rendering ----------
  function applyLang(){
    var s = STR[currentLang];
    document.getElementById("langSelect").value = currentLang;
    document.body.setAttribute("dir", rtlLangs[currentLang] ? "rtl" : "ltr");
    document.getElementById("titleText").textContent = s.title;
    document.getElementById("subtitleText").textContent = s.subtitle;
    document.getElementById("rulesText").innerHTML = s.rulesIntro;
    var open = document.getElementById("rulesBody").classList.contains("open");
    document.getElementById("rulesToggleBtn").textContent = open ? s.rulesHide : s.rulesShow;
    document.getElementById("nextBtn").textContent = s.next;
    document.getElementById("restartBtn").textContent = s.restart;
    renderQuestion();
    updateScore();
  }

  function renderQuestion(){
    var s = STR[currentLang];
    state.questionNum++;
    state.current = generateQuestion();
    state.answered = false;

    document.getElementById("progressText").textContent = s.progress.replace("{n}", state.questionNum);

    var p = state.current.sentenceParts;
    var html = "";
    for(var i=0;i<p.length;i++){
      if(p[i] === "__GAP__"){
        html += ' <span class="gap" id="gapSpan">?</span> ';
      } else {
        html += (i>0 && p[i-1] !== "__GAP__" ? " " : "") + p[i];
      }
    }
    document.getElementById("sentenceText").innerHTML = html.replace(/\s+/g," ").trim();

    var grid = document.getElementById("optionsGrid");
    grid.innerHTML = "";
    var opts = shuffle(state.current.isNeg ? NEG_OPTIONS : AFFIRM_OPTIONS);
    for(var j=0;j<opts.length;j++){
      var btn = document.createElement("button");
      btn.className = "opt-btn";
      btn.textContent = opts[j];
      btn.setAttribute("data-value", opts[j]);
      btn.onclick = (function(val, el){ return function(){ handleAnswer(val, el); }; })(opts[j], btn);
      grid.appendChild(btn);
    }

    var fb = document.getElementById("feedbackBox");
    fb.className = "feedback";
    fb.textContent = "";
    document.getElementById("nextBtn").disabled = true;
  }

  function handleAnswer(val, el){
    if(state.answered) return;
    state.answered = true;
    var s = STR[currentLang];
    var q = state.current;
    var correct = (val === q.article);

    state.total++;
    if(correct){ state.correct++; }

    document.getElementById("gapSpan").textContent = q.article;

    var buttons = document.querySelectorAll(".opt-btn");
    for(var i=0;i<buttons.length;i++){
      buttons[i].disabled = true;
      var v = buttons[i].getAttribute("data-value");
      if(v === q.article){ buttons[i].classList.add("correct"); }
      else if(v === val && !correct){ buttons[i].classList.add("incorrect"); }
    }

    var explanation;
    if(q.isPlural){
      explanation = s.explPlural(q.nounDisplay, q.article);
    } else {
      var genderLabel = q.noun.gender==="m" ? s.gender_m : (q.noun.gender==="f" ? s.gender_f : s.gender_n);
      var caseLabel = q.isAkk ? s.caseAkk : s.caseNom;
      explanation = s.explAffix(q.nounBase, genderLabel, caseLabel, q.verb, q.article);
    }

    var fb = document.getElementById("feedbackBox");
    fb.className = "feedback show " + (correct ? "good" : "bad");
    fb.textContent = (correct ? s.correct : s.incorrect) + " " + explanation;

    document.getElementById("nextBtn").disabled = false;
    updateScore();
  }

  function updateScore(){
    var s = STR[currentLang];
    document.getElementById("scoreText").textContent =
      s.score.replace("{correct}", state.correct).replace("{total}", state.total);
  }

  function restart(){
    state = { correct:0, total:0, current:null, answered:false, questionNum:0 };
    renderQuestion();
    updateScore();
  }

  // ---------- Events ----------
  document.getElementById("langSelect").addEventListener("change", function(e){
    currentLang = e.target.value;
    applyLang();
  });

  document.getElementById("rulesToggleBtn").addEventListener("click", function(){
    var body = document.getElementById("rulesBody");
    var s = STR[currentLang];
    if(body.classList.contains("open")){
      body.classList.remove("open");
      this.textContent = s.rulesShow;
    } else {
      body.classList.add("open");
      this.textContent = s.rulesHide;
    }
  });

  document.getElementById("nextBtn").addEventListener("click", function(){
    if(!this.disabled){ renderQuestion(); }
  });

  document.getElementById("restartBtn").addEventListener("click", restart);

  // ---------- Start ----------
  applyLang();

})();
</script>
</body>
</html>
