<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PerfektA1L11</title>
<style>
  :root {
    --bg:#f4f6fa; --card:#fff; --text:#1d2433; --muted:#5b667a; --line:#d5dbe6;
    --accent:#2b5fd9; --accent-text:#fff; --chip:#e9eef8;
    --ok:#1f7a4d; --ok-bg:#e0f3e8; --bad:#b3303f; --bad-bg:#fbe4e7; --warn-bg:#fff4d6; --info-bg:#e6edfb;
    --font:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#12161f; --card:#1b2130; --text:#e8ecf5; --muted:#9aa5ba; --line:#30394d;
      --accent:#6b97ff; --accent-text:#0b1226; --chip:#252d40;
      --ok:#6fd6a2; --ok-bg:#183427; --bad:#ff8a98; --bad-bg:#42202a; --warn-bg:#3a3118; --info-bg:#1f2a44;
    }
  }
  * { box-sizing:border-box; }
  html,body { margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:var(--font); line-height:1.5; min-height:100vh; font-size:16px; }
  [hidden] { display:none !important; }
  .wrap { max-width:760px; margin:0 auto; padding:14px 16px 40px; }
  h1 { font-size:1.6rem; margin:6px 0 4px; }
  button, input, select, textarea { font-family:inherit; font-size:1rem; color:var(--text); }
  button { cursor:pointer; }
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
  /* Sprachwahl */
  .pick h1 { text-align:center; margin:22px 0 4px; }
  .pick .sub { text-align:center; color:var(--muted); margin:0 0 4px; }
  .pickprompt { text-align:center; color:var(--muted); font-size:.95rem; margin:20px 0 16px; }
  .pickprompt p { margin:0 0 4px; }
  .langlist { display:flex; flex-direction:column; gap:12px; }
  .langchoice { width:100%; min-height:68px; padding:14px 18px; border:none; border-bottom:4px solid var(--cd); border-radius:14px; background:var(--c); color:#fff; font-size:1.35rem; font-weight:700; text-align:center; }
  .langchoice:active { filter:brightness(.92); }
  /* Obere Leiste */
  .topbar { display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:10px; }
  .brand { font-weight:700; color:var(--muted); }
  .pill { display:inline-flex; align-items:center; gap:6px; min-height:44px; padding:0 14px; border-radius:999px; border:2px solid var(--line); background:var(--card); font-size:.92rem; white-space:nowrap; }
  .subtitle { color:var(--muted); margin:0 0 12px; font-size:1.05rem; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin-bottom:12px; }
  .lead p { margin:0 0 8px; }
  .mini { font-size:.78rem; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:12px 0 6px; }
  .steps { margin:0 0 4px; padding-inline-start:1.4em; }
  .steps li { margin:3px 0; }
  button.main { width:100%; min-height:56px; border-radius:14px; border:none; font-size:1.1rem; font-weight:700; background:var(--accent); color:var(--accent-text); padding:8px 14px; }
  button.main:disabled { opacity:.4; }
  button.sec { min-height:56px; width:100%; border-radius:14px; border:2px solid var(--line); background:var(--card); font-size:1rem; padding:8px 14px; }
  .linkbtn { background:none; border:none; color:var(--accent); font-size:.95rem; padding:6px 4px; min-height:44px; text-decoration:underline; }
  .linkbtn.small { min-height:36px; font-size:.88rem; }
  .startrow { margin:4px 0 12px; }
  .progwrap { margin:6px 0 14px; }
  .progtxt { font-size:.9rem; color:var(--muted); margin-bottom:4px; }
  .bar { height:10px; background:var(--chip); border-radius:999px; overflow:hidden; }
  .bar > i { display:block; height:100%; background:var(--accent); transition:width .3s; }
  h2.sect { font-size:1.2rem; margin:16px 0 8px; }
  /* Inhaltsverzeichnis */
  .toc { list-style:none; margin:0 0 14px; padding:0; display:flex; flex-direction:column; gap:8px; }
  .tocitem { width:100%; display:flex; align-items:center; gap:12px; min-height:60px; padding:8px 12px; border-radius:12px; border:2px solid var(--line); background:var(--card); text-align:start; }
  .tocitem:hover { border-color:var(--accent); }
  .tocitem .num { flex:none; width:34px; height:34px; border-radius:50%; background:var(--chip); display:flex; align-items:center; justify-content:center; font-weight:800; }
  .tocitem .ttxt { flex:1; min-width:0; display:flex; flex-direction:column; }
  .tocitem .t1 { font-weight:700; overflow-wrap:anywhere; }
  .tocitem .t2 { font-size:.85rem; color:var(--muted); overflow-wrap:anywhere; }
  .tocitem .stat { flex:none; font-size:.78rem; color:var(--muted); text-align:end; max-width:7.5em; }
  .tocitem.st-done { border-color:var(--ok); }
  .tocitem.st-done .num, .tocitem.st-seen .num { background:var(--ok-bg); color:var(--ok); }
  .tocitem.st-some .num { background:var(--warn-bg); }
  .skipped summary { cursor:pointer; font-weight:700; min-height:32px; }
  .skipped ul { margin:6px 0 0; padding-inline-start:1.3em; }
  .skipped li { margin:4px 0; }
  /* Abschnitt */
  .jumprow { display:flex; align-items:center; gap:10px; margin-bottom:6px; }
  .partof { color:var(--muted); font-size:.88rem; white-space:nowrap; }
  select.jump, select.vgroup { flex:1; min-width:0; min-height:44px; border-radius:10px; border:2px solid var(--line); background:var(--card); padding:6px 10px; }
  .sechead { margin:10px 0 10px; }
  .kicker { font-size:.8rem; text-transform:uppercase; letter-spacing:.07em; color:var(--accent); font-weight:700; }
  .sectitle { margin:2px 0 0; font-size:1.4rem; line-height:1.25; }
  .sectitle .tde { display:block; }
  .sectitle .ttr { display:block; font-size:1.05rem; font-weight:500; color:var(--muted); margin-top:2px; }
  .keyde { background:var(--chip); border-radius:10px; padding:10px 12px; margin-bottom:10px; border-inline-start:5px solid var(--accent); text-align:left; }
  .ruletext p { margin:0 0 8px; }
  .ruletext strong { color:var(--text); }
  .tlabel { font-size:.8rem; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:14px 0 6px; }
  .tablewrap { overflow-x:auto; background:var(--card); border:1px solid var(--line); border-radius:12px; margin-bottom:12px; }
  table { border-collapse:collapse; width:100%; min-width:360px; font-size:.95rem; }
  th, td { padding:7px 10px; text-align:left; vertical-align:top; border-bottom:1px solid var(--line); }
  th { background:var(--chip); font-size:.82rem; white-space:nowrap; }
  th small { display:block; font-weight:500; color:var(--muted); }
  td strong { color:var(--accent); }
  td small.note { display:block; color:var(--muted); font-size:.8rem; }
  td .tag { color:var(--muted); font-size:.85rem; }
  tr:last-child td { border-bottom:none; }
  .memo { background:var(--warn-bg); border-radius:12px; padding:10px 14px; margin-bottom:14px; }
  .memolabel { font-weight:700; font-size:.88rem; margin-bottom:4px; }
  .memode { margin-bottom:4px; text-align:left; }
  .memotext { font-size:.95rem; }
  /* Übungen */
  .excard { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 14px 12px; margin:16px 0; }
  .exhead { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:6px; }
  .exhead h3 { margin:0; font-size:1.05rem; }
  .badge { font-size:.8rem; font-weight:700; border-radius:999px; padding:2px 10px; }
  .badge.b-ok { background:var(--ok-bg); color:var(--ok); }
  .badge.b-sol { background:var(--info-bg); color:var(--accent); }
  .insde { margin:0 0 2px; font-weight:700; text-align:left; }
  .inst { margin:0 0 8px; color:var(--muted); font-size:.95rem; }
  .exnote { margin:0 0 8px; font-size:.92rem; background:var(--chip); border-radius:8px; padding:6px 10px; }
  .items { list-style:none; counter-reset:it; margin:8px 0; padding:0; display:flex; flex-direction:column; gap:8px; }
  .item { counter-increment:it; position:relative; display:flex; align-items:flex-start; gap:8px; flex-wrap:wrap; padding:8px 10px 8px 10px; border:2px solid var(--line); border-radius:12px; }
  .item::before { content:counter(it); flex:none; width:26px; height:26px; border-radius:50%; background:var(--chip); font-size:.82rem; font-weight:700; display:flex; align-items:center; justify-content:center; margin-top:2px; }
  .item .imain { flex:1; min-width:0; }
  .item .mark { font-weight:800; font-size:1.2rem; width:1.2em; text-align:center; }
  .item.ok { border-color:var(--ok); background:var(--ok-bg); }
  .item.ok .mark { color:var(--ok); }
  .item.bad { border-color:var(--bad); background:var(--bad-bg); }
  .item.bad .mark { color:var(--bad); }
  .item.shown { border-color:var(--accent); background:var(--info-bg); }
  .solline { flex-basis:100%; font-size:.92rem; color:var(--text); text-align:left; padding-inline-start:34px; }
  .solline:empty { display:none; }
  .line { font-size:1.05rem; line-height:2.3; text-align:left; }
  input.blank { min-height:40px; border-radius:8px; border:2px solid var(--line); background:var(--card); padding:2px 8px; font-size:1.05rem; vertical-align:middle; margin:0 2px; max-width:100%; }
  input.blank.wide { display:block; width:100%; margin:6px 0 0; }
  input.blank.okin { border-color:var(--ok); }
  input.blank.badin { border-color:var(--bad); }
  .wprompt { font-size:1.02rem; text-align:left; }
  .cprompt { font-size:1.02rem; text-align:left; margin-bottom:6px; }
  .cword { font-size:1.25rem; font-weight:800; text-align:left; margin-bottom:6px; }
  .ctr { font-size:.88rem; color:var(--muted); margin:-2px 0 6px; }
  .optrow { display:flex; flex-wrap:wrap; gap:8px; }
  button.opt { min-height:48px; border-radius:12px; border:2px solid var(--line); background:var(--card); padding:6px 16px; font-size:1.02rem; }
  button.opt.sel { border-color:var(--accent); background:var(--chip); font-weight:700; }
  .ordans { min-height:52px; display:flex; flex-wrap:wrap; gap:6px; align-items:center; padding:6px; border:2px dashed var(--line); border-radius:10px; margin-bottom:8px; }
  .ordpool { display:flex; flex-wrap:wrap; gap:6px; }
  .ordhint { color:var(--muted); font-size:.9rem; padding:0 4px; }
  button.wchip { min-height:44px; border-radius:10px; border:2px solid var(--line); background:var(--card); padding:4px 12px; font-size:1.02rem; }
  button.wchip.in { background:var(--chip); border-color:var(--accent); }
  .umlauts { display:flex; gap:6px; margin:8px 0 2px; }
  .umlauts button { min-width:48px; min-height:44px; border-radius:10px; border:2px solid var(--line); background:var(--card); font-size:1.1rem; }
  .btnrow { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-top:10px; }
  .btnrow .main { flex:1 1 160px; width:auto; min-height:52px; }
  .btnrow .sec { flex:1 1 140px; width:auto; min-height:52px; }
  .result { margin-top:8px; border-radius:10px; padding:0; font-weight:600; }
  .result.good, .result.warn, .result.info { padding:10px 12px; }
  .result.good { background:var(--ok-bg); color:var(--ok); }
  .result.warn { background:var(--warn-bg); }
  .result.info { background:var(--info-bg); }
  .result .rulelinks { display:flex; flex-wrap:wrap; gap:4px; }
  .freebox textarea { width:100%; border-radius:10px; border:2px solid var(--line); background:var(--card); padding:8px 10px; font-size:1.02rem; }
  .freelabel { display:block; font-weight:700; margin-bottom:4px; }
  .freechecks { margin:10px 0 4px; font-weight:700; }
  .ckrow { display:flex; align-items:center; gap:8px; min-height:44px; }
  .ckrow input { width:22px; height:22px; flex:none; }
  /* Beobachten + Fragen */
  .obscard { background:var(--info-bg); border:1px solid var(--line); }
  .obstitle { margin:0 0 8px; font-size:1.05rem; }
  .obsgroup { margin:0 0 10px; }
  .obsgroup:last-child { margin-bottom:0; }
  .grouplabel { font-size:.8rem; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:2px 0 4px; }
  .obsline { font-size:1.12rem; line-height:1.55; padding:7px 12px; margin:5px 0; background:var(--card); border-radius:10px; border-inline-start:4px solid var(--accent); text-align:left; overflow-wrap:anywhere; }
  .obsline strong { color:var(--accent); }
  .dqhint { margin:0 0 6px; color:var(--muted); font-size:.95rem; }
  .dqprog { font-size:.88rem; font-weight:700; color:var(--accent); margin-bottom:6px; }
  .dq { padding:12px 0; border-top:1px solid var(--line); }
  .dqq { font-weight:700; margin-bottom:8px; }
  .dqn { display:inline-flex; width:26px; height:26px; border-radius:50%; background:var(--chip); align-items:center; justify-content:center; font-size:.82rem; margin-inline-end:4px; }
  .dqopts { display:flex; flex-direction:column; gap:8px; }
  .dqopts button.opt { text-align:start; width:100%; }
  button.opt.right { border-color:var(--ok); background:var(--ok-bg); font-weight:700; }
  button.opt.wrong { border-color:var(--bad); background:var(--bad-bg); text-decoration:line-through; opacity:.8; }
  button.opt:disabled { cursor:default; }
  .dqfb { margin-top:8px; font-weight:700; border-radius:10px; }
  .dqfb:empty { display:none; }
  .dqfb.good { color:var(--ok); }
  .dqfb.warn { color:var(--bad); }
  .skiprow { margin-top:6px; text-align:center; }
  .afterdisc[hidden] { display:none; }
  .banner { background:var(--ok-bg); color:var(--ok); font-weight:700; border-radius:12px; padding:10px 14px; margin:14px 0 6px; }
  .ruletitle { margin:14px 0 6px; font-size:1.15rem; }
  .navrow { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:22px; }
  /* Verbliste */
  .verbslead { color:var(--muted); }
  .vtools { display:flex; gap:8px; margin:8px 0; flex-wrap:wrap; }
  input.vsearch { flex:1 1 180px; min-width:0; min-height:44px; border-radius:10px; border:2px solid var(--line); background:var(--card); padding:6px 10px; }
  .vcount { color:var(--muted); font-size:.9rem; margin:0 0 4px; }
  .vh { font-size:1rem; margin:14px 0 6px; }
  .vgrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:6px; }
  .vitem { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:6px 10px; text-align:left; overflow-wrap:anywhere; }
  .vitem b { color:var(--accent); }
  @media (max-width:420px) {
    .tocitem .stat { display:none; }
    .item { padding:8px; }
    .line { line-height:2.4; }
    th, td { padding:6px 7px; }
    table { font-size:.9rem; }
  }

</style>
</head>

        "Şimdi bunu kendiniz gördünüz. Perfekt'te fiil **iki parçaya** ayrılır.\n**1. parça** *haben* olur. Kişiye göre değişir (ich habe, du hast, er hat …) ve normal bir cümlede her zaman **ikinci sırada** durur.\n**2. parça** ana fiilin özel bir biçimidir, örneğin *gearbeitet*, *gelesen*, *gespielt*. Buna **Partizip II** denir ve her zaman **en sonda** yer alır.\nDiğer her şey (gestern, das Buch, am Samstag …) ikisinin arasında durur. Bir parantez gibi düşünün: *Ich **habe** gestern **gearbeitet**.*\nEvet/hayır sorusunda önce *haben* gelir: *Hast du Kaffee getrunken?* Soru sözcüklü sorularda soru sözcüğünün hemen arkasından gelir: *Was haben Sie gemacht?* Son kısım aynı kalır.",
        "والآن رأيتَ ذلك بنفسك. في الـ Perfekt ينقسم الفعل إلى **جزأين**.\n**الجزء 1** هو *haben*. وهو يتغيّر بحسب الشخص (ich habe, du hast, er hat …) ويقع دائماً في **المرتبة الثانية** في الجملة العادية.\n**الجزء 2** صيغة خاصة من الفعل الأساسي، مثل *gearbeitet* و*gelesen* و*gespielt*. ويُسمّى **Partizip II** ويقع دائماً **في آخر الجملة تماماً**.\nوكل شيء آخر (gestern, das Buch, am Samstag …) يقع بينهما. تخيّل قوساً: *Ich **habe** gestern **gearbeitet**.*\nفي سؤال «نعم/لا» يأتي *haben* أولاً: *Hast du Kaffee getrunken?* وفي السؤال بأداة استفهام يأتي بعدها مباشرة: *Was haben Sie gemacht?* ويبقى الجزء الأخير في مكانه."

        "بعض الأفعال في بدايتها كلمة صغيرة يمكنها أن «تقفز» إلى آخر الجملة: *ein|kaufen – Ich kaufe heute **ein**.* وتُسمّى **أفعالاً منفصلة**.\nفي الـ Perfekt لا تقفز الكلمة الصغيرة. بل تبقى مع الفعل، ويدخل **ge** **بين** الكلمة الصغيرة والفعل:\nein + ge + kauft → **eingekauft**، ab + ge + holt → **abgeholt**، an + ge + rufen → **angerufen**.\nوالنهاية تتبع الفعل الأساسي كما سبق: منتظم ← -t (abgeholt)، غير منتظم ← -en (angerufen).\nوفي الجملة يقع الفعل كله في الآخر: *Ich habe heute eingekauft.*"

 "The two parts of the Perfekt (verb bracket)": "Дві частини Perfekt (дієслівна рамка)",
 "Now you have seen it yourself. In the Perfekt, the verb is split into **two parts**.\n**Part 1** is *haben*. It changes with the person (ich habe, du hast, er hat …) and in a normal sentence it always stands in **second place**.\n**Part 2** is a special form of the main verb, for example *gearbeitet*, *gelesen*, *gespielt*. We call it the **Partizip II**. It always stands **at the very end**.\nEverything else (gestern, das Buch, am Samstag …) stands in between. Think of a bracket: *Ich **habe** gestern **gearbeitet**.*\nIn a yes/no question, *haben* comes first: *Hast du Kaffee getrunken?* In a question with a question word, it comes right after that word: *Was haben Sie gemacht?* The end stays the same.": "Тепер ви побачили це самі. У Perfekt дієслово складається з **двох частин**.\n**Частина 1** — *haben*. Воно змінюється за особами (ich habe, du hast, er hat …) і в звичайному реченні завжди стоїть **на другому місці**.\n**Частина 2** — особлива форма основного дієслова, наприклад *gearbeitet*, *gelesen*, *gespielt*. Вона називається **Partizip II** і завжди стоїть **в самому кінці**.\nВсе інше (gestern, das Buch, am Samstag …) стоїть між ними. Уявіть дужку: *Ich **habe** gestern **gearbeitet**.*\nУ питанні без питального слова на першому місці стоїть *haben*: *Hast du Kaffee getrunken?* У питанні з питальним словом — одразу після нього: *Was haben Sie gemacht?* Кінець залишається тим самим.",

 "Most verbs are **regular**. For these verbs the second part is easy to build:\n**ge + the verb without -en + t**\nmachen → ge**mach**t, spielen → ge**spiel**t, kaufen → ge**kauf**t.\nThe middle part never changes. These verbs almost always use *haben*: *Ich habe Fußball gespielt.*\nOne small trick: if the verb stem ends in **t** or **d** (arbeiten, baden, antworten), or in letters that are hard to say before one more t (kosten, reden), you add an **e** before the final t: ge**arbeit**et, ge**bad**et, ge**antwort**et, ge**kost**et, ge**red**et.": "Більшість дієслів — **правильні**. У них друга частина утворюється просто:\n**ge + дієслово без -en + t**\nmachen → ge**mach**t, spielen → ge**spiel**t, kaufen → ge**kauf**t.\nСередина слова ніколи не змінюється. Ці дієслова майже завжди вживаються з *haben*: *Ich habe Fußball gespielt.*\nНевеликий прийом: якщо основа дієслова закінчується на **t** або **d** (arbeiten, baden, antworten) або на приголосні, які важко вимовити перед ще одним t (kosten, reden), перед останнім t додається **e**: ge**arbeit**et, ge**bad**et, ge**antwort**et, ge**kost**et, ge**red**et.",

    function ruleLinks(wrongRules) {
      var box = el("div", "rulelinks"); var any = false;
      for (var k = 0; k < wrongRules.length; k++) (function (r) {
        if (!r) return;
        var target = null;
        for (var s = 0; s < SECTIONS.length; s++) if (SECTIONS[s].rule === r) target = SECTIONS[s];
        if (!target || target === sec) return;
        var a = el("button", "linkbtn", fmt(STR.seeRule, {n: r})); a.type = "button"; setLangAttrs(a, lang);
        a.addEventListener("click", function () { go(target.id); });
        box.appendChild(a); any = true;
      })(wrongRules[k]);
      return any ? box : null;
    }
    function setRes(text, cls, extra) {
      res.className = "result " + cls;
      res.textContent = text;
      if (extra) res.appendChild(extra);
    }

    checkBtn.addEventListener("click", function () {
      if (ex.kind === "free") {
        var n = ex.checks.length, r = 0;
        for (var c = 0; c < n; c++) if (st.vals.checks[c]) r++;
        st.checked = true;
        if (r === n) { prog.ex[ex.id] = "ok"; saveProg(); setBadge(); setRes(STR.freeFilled, "good"); }
        else setRes(fmt(STR.resFmt, {r: r, n: n}), "warn");
        return;
      }
      var right = 0, wrongRules = [];
      for (var i2 = 0; i2 < recs.length; i2++) {
        var ok = recs[i2].ev();
        setMark(i2, ok);
        if (ok) { right++; recs[i2].sol.textContent = ""; }
        else {
          var it2 = ex.items[i2];
          var rr = it2.r || ex.rule || sec.rule;
          if (wrongRules.indexOf(rr) < 0) wrongRules.push(rr);
          if (recs[i2].fix) recs[i2].sol.textContent = recs[i2].fix;
        }
        if (recs[i2].inputs.length && !ok) { for (var q2 = 0; q2 < recs[i2].inputs.length; q2++) recs[i2].inputs[q2].className = recs[i2].inputs[q2].className.replace(/ ?(okin|badin)/g, "") + " badin"; }
        if (recs[i2].inputs.length && ok) { for (var q3 = 0; q3 < recs[i2].inputs.length; q3++) recs[i2].inputs[q3].className = recs[i2].inputs[q3].className.replace(/ ?(okin|badin)/g, "") + " okin"; }
      }
      st.checked = true;
      var n2 = recs.length;
      if (right === n2) {
        if (prog.ex[ex.id] !== "ok") { prog.ex[ex.id] = "ok"; saveProg(); }
        setBadge();
        setRes(fmt(STR.resFmt, {r: right, n: n2}) + " · " + STR.allOk, "good");
      } else {
        setRes(fmt(STR.resFmt, {r: right, n: n2}) + " · " + STR.fixIt, "warn", ruleLinks(wrongRules));
      }
    });
    solBtn.addEventListener("click", function () {
      for (var i3 = 0; i3 < recs.length; i3++) {
        recs[i3].showSol();
        recs[i3].li.className = "item shown";
        recs[i3].mark.textContent = "";
        for (var q4 = 0; q4 < recs[i3].inputs.length; q4++) recs[i3].inputs[q4].className = recs[i3].inputs[q4].className.replace(/ ?(okin|badin)/g, "");
        if (recs[i3].fix) recs[i3].sol.textContent = recs[i3].fix; else recs[i3].sol.textContent = "";
        if (ex.kind === "order" || ex.kind === "write" || ex.kind === "fill") { /* Lösung steht in den Feldern */ }
        if (ex.kind === "order") {
          var itx = ex.items[i3], a0 = itx.a[0];
          var words = [];
          for (var k3 = 0; k3 < st.vals[i3].length; k3++) words.push(itx.w[st.vals[i3][k3]]);
          if (norm(words.join(" ")) !== norm(a0)) recs[i3].sol.textContent = STR.answerLabel + " " + dispPunct(a0, !!itx.q);
        }
      }
      st.shown = true;
      if (!prog.ex[ex.id]) { prog.ex[ex.id] = "sol"; saveProg(); }
      setBadge();
      setRes(STR.solShown, "info");
    });
    rstBtn.addEventListener("click", function () {
      delete exState[ex.id];
      var fresh = buildExercise(sec, ex);
      card.parentNode.replaceChild(fresh, card);
    });
    return card;
  }

  /* ---------- Rendering ---------- */
  function render() {
    var app = $("app");
    app.innerHTML = "";
    if (!STR) return;
    if (cur === "home") renderHome(app);
    else { var sec = secById(cur); if (sec) renderSection(app, sec); else renderHome(app); }
    window.scrollTo(0, 0);
  }

  /* ---------- Start ---------- */
  buildPicker();
  
  (function init() {
    var h = window.location.hash || "";
    if (/^#(tr|ar|ru|uk|en)(\/(home|\d+))?$/.test(h)) route();
    else showPicker(true);
  })();

})();
</script>
</body>
</html>
