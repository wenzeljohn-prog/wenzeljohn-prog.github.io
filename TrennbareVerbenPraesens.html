<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trennbare Verben – Trainer (Präsens)</title>
<style>
:root{
  --bg:#F4F5F9;--surface:#FFFFFF;--ink:#172033;--muted:#586278;--line:#D8DDE7;
  --stem:#2A3AB8;--stem-t:#E4E8FB;--pre:#9E4308;--pre-t:#FCE9D0;
  --ok:#17724A;--ok-t:#DDF2E6;--bad:#B3261E;--bad-t:#FBE3E0;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1320;--surface:#161D2E;--ink:#E7EBF4;--muted:#9AA5BC;--line:#2A3450;
    --stem:#93A3FF;--stem-t:#232B58;--pre:#F4A75E;--pre-t:#3C2A15;
    --ok:#5FD198;--ok-t:#15382A;--bad:#FF8F86;--bad-t:#40201E;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1320;--surface:#161D2E;--ink:#E7EBF4;--muted:#9AA5BC;--line:#2A3450;
  --stem:#93A3FF;--stem-t:#232B58;--pre:#F4A75E;--pre-t:#3C2A15;
  --ok:#5FD198;--ok-t:#15382A;--bad:#FF8F86;--bad-t:#40201E;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Naskh Arabic",Arial,sans-serif}
.serif,.sent,.chip,.sent2,.ex1,.vw{font-family:Charter,"Bitstream Charter","Sitka Text",Cambria,"Iowan Old Style",Georgia,"Noto Naskh Arabic",serif}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--stem);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding:14px 16px 56px}

/* Kopfzeile */
.top{display:flex;flex-direction:column;gap:10px;padding-bottom:6px}
.brand{display:flex;align-items:baseline;gap:10px}
.bt{font-family:Charter,Cambria,Georgia,serif;font-size:22px;font-weight:700}
.bs{color:var(--muted);font-size:15px}
.langs{display:flex;flex-wrap:wrap;gap:6px}
.lang{border:1px solid var(--line);background:var(--surface);padding:6px 12px;border-radius:999px;font-size:14px;min-height:38px;cursor:pointer}
.lang[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* Wortteile */
.stem{color:var(--stem);border-bottom:3px solid var(--stem);padding-bottom:1px}
.pre{color:var(--pre);border-bottom:3px dashed var(--pre);padding-bottom:1px}
.bar{color:var(--muted);padding:0 2px}
.de{display:block}
.aux{display:block;font-size:.84em;color:var(--muted);unicode-bidi:isolate;font-weight:400}
.aux[dir="rtl"]{text-align:right}
.btn .aux,.lang .aux{color:inherit;opacity:.85;text-align:center!important}

/* Hero */
.hero{padding:18px 0 10px}
.hcap{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:18px;margin-bottom:8px}
.hcap .vw{font-size:20px}
.replay{border:1px solid var(--line);background:var(--surface);border-radius:999px;width:38px;height:38px;cursor:pointer;font-size:18px;line-height:1}
.sent{display:flex;flex-wrap:nowrap;align-items:baseline;white-space:nowrap;font-size:clamp(22px,6.6vw,44px);line-height:1.25;direction:ltr;overflow:visible}
.tk{display:inline-block;margin-right:.3em;will-change:transform}
.tk.joined{margin-right:0}
.tk.stem,.tk.pre{border-bottom-width:4px}

/* Menü */
.menu{margin-top:8px;border-top:1px solid var(--line)}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;padding:14px 2px;background:none;border:0;border-bottom:1px solid var(--line);text-align:start;cursor:pointer}
.row:hover .rt .de{color:var(--stem)}
.rt .de{font-size:19px;font-weight:650}
.rt .aux{font-size:15px}
.rd .de{font-size:14px;color:var(--muted)}
.rd .aux{font-size:13px}
.chev{font-size:26px;color:var(--muted)}
.opts{margin-top:26px}
.opts h3{margin:0 0 8px;font-size:15px;color:var(--muted);font-weight:600}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;cursor:pointer;min-height:44px;text-align:start}
.pill[aria-pressed="true"]{border-color:var(--stem);background:var(--stem-t);color:var(--ink);box-shadow:inset 0 0 0 1px var(--stem)}
details.sel>summary{cursor:pointer;padding:10px 0;font-weight:600}
.vsel{display:flex;flex-wrap:wrap;gap:6px;padding:6px 0 4px}
.vsel .pill{font-family:Charter,Cambria,Georgia,serif;font-size:17px;min-height:42px;padding:6px 10px}

/* Lernen */
h2.pg{font-size:24px;margin:14px 0 6px;font-family:Charter,Cambria,Georgia,serif}
h2.pg .aux{font-family:system-ui,sans-serif;font-size:15px}
.rule{padding:14px 0;border-bottom:1px solid var(--line)}
.rule h3{margin:0 0 6px;font-size:17px}
.rule h3 .aux{font-size:14px}
.rule p{margin:0 0 10px}
.exrow{display:flex;flex-wrap:wrap;gap:8px 12px;margin:8px 0}
.cell{display:flex;flex-direction:column;align-items:flex-start;gap:2px}
.cell small{color:var(--muted);font-size:12px;min-height:16px}
.cell span.w{font-size:20px}
.split{display:flex;gap:16px;align-items:flex-end;margin:8px 0;font-size:30px}
.split small{display:block;font-size:12px;color:var(--muted)}
details.vd{border-bottom:1px solid var(--line)}
details.vd>summary{display:flex;align-items:center;gap:12px;padding:12px 2px;cursor:pointer;list-style:none;min-height:56px}
details.vd>summary::-webkit-details-marker{display:none}
details.vd>summary::after{content:"+";margin-inline-start:auto;font-size:22px;color:var(--muted)}
details.vd[open]>summary::after{content:"–"}
.ic{font-size:26px;width:38px;text-align:center;flex:none}
.vw{font-size:22px}
.vm .de{font-size:14px;color:var(--muted)}
.vm .aux{font-size:13px}
.vb{padding:0 2px 16px 50px}
.ex1{font-size:19px}
.tbl{display:grid;grid-template-columns:1fr 1fr;gap:6px 16px;margin:12px 0;font-family:Charter,Cambria,Georgia,serif;font-size:18px}
.ln{margin:6px 0;font-family:Charter,Cambria,Georgia,serif;font-size:18px}
.ln b{font-family:system-ui,sans-serif;font-size:13px;font-weight:600;color:var(--muted);display:block}
.note{margin-top:10px;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;font-size:14px}
.pl{margin:8px 0;font-family:Charter,Cambria,Georgia,serif;font-size:18px}

/* Übung */
.qbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:10px 0 8px}
.link{display:flex;align-items:flex-start;gap:6px;background:none;border:0;padding:8px 4px;cursor:pointer;color:var(--muted);min-height:44px;text-align:start}
.cnt .de{font-size:14px}
.cnt .aux{font-size:12px;text-align:end}
.prog{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin-bottom:16px}
.prog i{display:block;height:100%;background:var(--stem);transition:width .3s}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 16px}
.instr{color:var(--muted);margin-bottom:10px;font-size:15px}
.instr .aux{font-size:13px}
.prompt{display:flex;align-items:center;gap:14px;margin:6px 0 14px}
.prompt .big{font-size:clamp(26px,7vw,36px);line-height:1.2}
.prompt .ico{font-size:40px}
.sent2{font-size:clamp(20px,5.4vw,26px);line-height:1.9;margin:6px 0 14px}
.blank{display:inline-block;min-width:3em;border-bottom:2px solid var(--muted);text-align:center;color:var(--muted);line-height:1.2}
.blank.fill{color:var(--ink);border-bottom-color:var(--ink)}
.blank.ok{color:var(--ok);border-bottom-color:var(--ok)}
.blank.bad{color:var(--bad);border-bottom-color:var(--bad)}
.opts-l{display:grid;gap:8px}
.opt{display:block;width:100%;text-align:start;padding:12px 14px;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;cursor:pointer;min-height:54px;font-size:18px}
.opt:hover:not([disabled]){border-color:var(--stem)}
.opt[disabled]{cursor:default}
.opt.ok{border-color:var(--ok);background:var(--ok-t)}
.opt.bad{border-color:var(--bad);background:var(--bad-t)}
.opt.sel{border-color:var(--stem);background:var(--stem-t)}
.opt.sm{display:inline-block;width:auto;min-width:64px;text-align:center;font-family:Charter,Cambria,Georgia,serif;font-size:19px;padding:8px 14px;min-height:46px}
.grp{margin:12px 0 4px;font-size:14px;color:var(--muted)}
.grp .aux{font-size:12px}
.optrow{display:flex;flex-wrap:wrap;gap:8px}
.answer{display:flex;flex-wrap:wrap;gap:8px;align-items:center;min-height:64px;padding:10px;border:2px dashed var(--line);border-radius:12px;margin-bottom:12px}
.answer.empty::before{content:"…";color:var(--muted);font-size:22px}
.answer .pun{font-size:26px}
.bank{display:flex;flex-wrap:wrap;gap:8px;min-height:56px;margin-bottom:8px}
.chip{border:1.5px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:10px;min-height:46px;font-size:20px;cursor:pointer}
.chip:hover:not([disabled]){border-color:var(--stem)}
.chip.ok{border-color:var(--ok);background:var(--ok-t)}
.chip.bad{border-color:var(--bad);background:var(--bad-t)}
.chip[disabled]{cursor:default}
.mhint{display:flex;gap:10px;align-items:center;padding:8px 12px;background:var(--stem-t);border-radius:10px;margin-bottom:10px;font-size:15px}
.mhint .ico{font-size:24px}
.acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.btn{min-height:50px;padding:10px 22px;border-radius:12px;border:1.5px solid var(--ink);background:var(--ink);color:var(--bg);font-weight:650;cursor:pointer;text-align:center}
.btn.sec{background:transparent;color:var(--ink);border-color:var(--line)}
.btn[disabled]{opacity:.4;cursor:default}
.fb{margin-top:16px;padding:12px 14px;border-left:5px solid var(--line);border-radius:0 12px 12px 0;background:var(--surface);border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.fb.ok{border-left-color:var(--ok)}
.fb.bad{border-left-color:var(--bad)}
.fb .h{font-weight:700;margin-bottom:6px}
.fb.ok .h{color:var(--ok)}
.fb.bad .h{color:var(--bad)}
.fb .h .aux{font-weight:400}
.fb .sol{font-family:Charter,Cambria,Georgia,serif;font-size:21px;line-height:1.6;margin:4px 0 8px}
.fb .lbl{font-size:13px;color:var(--muted)}
.rulebox{margin-top:10px;padding:10px 12px;background:var(--bg);border-radius:10px;font-size:14px}
.rulebox strong{display:block}
.hintbox{margin-top:12px;padding:10px 12px;background:var(--bg);border-radius:10px;font-size:15px}
.hl{margin:4px 0}
.res{text-align:center;padding:20px 0}
.res .big{font-size:56px;font-family:Charter,Cambria,Georgia,serif;font-weight:700}
.res .msg .de{font-size:22px;font-weight:650}
.wl{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:14px 0}
.wl span.w{padding:6px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-family:Charter,Cambria,Georgia,serif;font-size:19px}
@media (max-width:420px){.vb{padding-left:2px}.tbl{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function rnd(n){return Math.floor(Math.random()*n);}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=rnd(i+1);var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function pick(a){return a[rnd(a.length)];}
function sample(a,n){return shuffle(a.slice()).slice(0,n);}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1);}

function li(){return LI[state.lang];}

function inf(v){return v.pre+v.stem+'en';}
function vd(v,bar){return '<span class="pre">'+v.pre+'</span>'+(bar?'<span class="bar">|</span>':'')+'<span class="stem">'+v.stem+'en</span>';}
function conj(v){

 var f=[s+'e',s+(ext?'est':'st'),s+(ext?'et':'t'),s+'en',s+(ext?'et':'t'),s+'en',s+'en'];
 if(v.irr){f[1]=v.irr.du;f[2]=v.irr.er;}
 return f;
}
function selected(){var a=[],i;for(i=0;i<VERBS.length;i++){if(state.sel[VERBS[i].id])a.push(VERBS[i]);}return a.length?a:VERBS.slice();}
function selCount(){var n=0,i;for(i=0;i<VERBS.length;i++){if(state.sel[VERBS[i].id])n++;}return n;}

function colorItem(it,v){
 var t=esc(it.t);
 if(it.r==='f')return '<span class="stem">'+t+'</span>';
 if(it.r==='p')return '<span class="pre">'+t+'</span>';
 if(it.r==='i')return '<span class="pre">'+esc(v.pre)+'</span><span class="stem">'+esc(it.t.substr(v.pre.length))+'</span>';
 return t;
}
function sentHtml(items,v,punct){
 var out=[],i,it;
 for(i=0;i<items.length;i++){
  it=items[i];
  if(i===0){it={t:cap(it.t),r:it.r};}
  out.push(colorItem(it,v));
 }
 return out.join(' ')+(punct||'');
}
function ruleBox(k){return '<div class="rulebox"><strong>'+bi(R[k].h)+'</strong><div>'+bi(R[k].t)+'</div></div>';}

/* ================= Fragen erzeugen ================= */
function shapeItems(q,fv){
 var S={t:q.S.p,r:'s'},O={t:q.o,r:'o'},P={t:q.v.pre,r:'p'},F={t:fv,r:'f'};
 if(q.shape==='stmt')return [S,F,O,P];
 if(q.shape==='yn')return [F,S,O,P];
 return [{t:'warum',r:'w'},F,S,O,P];
}
function shapePunct(q){return q.shape==='stmt'?'.':'?';}
function genOrder(v){
 var S=pick(SUBJ),o=pick(v.objs),f=conj(v),ty=pick(['stmt','yn','wh']);
 var Sx={t:S.p,r:'s'},Ox={t:o,r:'o'},Px={t:v.pre,r:'p'},Fx={t:f[S.i],r:'f'},items,vars,punct,rule;
 if(ty==='stmt'){items=[Sx,Fx,Ox,Px];vars=[items,[Ox,Fx,Sx,Px]];punct='.';rule='r2';}
 else if(ty==='yn'){items=[Fx,Sx,Ox,Px];vars=[items];punct='?';rule='r3';}
 else{items=[{t:'warum',r:'w'},Fx,Sx,Ox,Px];vars=[items];punct='?';rule='r3';}
 var bank,tries=0,ident,k;
 do{bank=[];for(k=0;k<items.length;k++)bank.push(k);shuffle(bank);ident=true;for(k=0;k<bank.length;k++){if(bank[k]!==k)ident=false;}tries++;}while(ident&&tries<20);
 return {kind:'order',v:v,ty:ty,items:items,vars:vars,punct:punct,rule:rule,bank:bank,picked:[],done:false,okv:false,hint:false};
}
function forms4(v,S){
 var f=conj(v),correct=f[S.i];
 var pool=uniq([f[0],f[1],f[2],f[3],f[4]]),d=[],i;
 for(i=0;i<pool.length;i++){if(pool[i]!==correct)d.push(pool[i]);}
 return {correct:correct,opts:shuffle([correct].concat(sample(d,3)))};
}
function genGap(v){
 var S=pick(SUBJ),o=pick(v.objs),fm=forms4(v,S),sh=pick(['stmt','yn','wh']);
 var pres=sample(PRE.filter(function(p){return p!==v.pre;}),3);
 return {kind:'gap',v:v,S:S,o:o,f:fm.correct,shape:sh,o1:fm.opts,o2:shuffle([v.pre].concat(pres)),sel1:null,sel2:null,done:false,ok1:false,ok2:false,rule:(sh==='stmt'?'r2':'r3'),hint:false};
}
function genPres(v){
 var S=pick(SUBJ),o=pick(v.objs),fm=forms4(v,S),sh=pick(['stmt','yn','wh']),opts=[],i;
 for(i=0;i<fm.opts.length;i++){opts.push({h:'<span class="serif">'+esc(fm.opts[i])+'</span>',ok:fm.opts[i]===fm.correct});}
 return {kind:'pres',v:v,S:S,o:o,f:fm.correct,shape:sh,opts:opts,picked:null,rule:(sh==='stmt'?'r2':'r3'),hint:false};
}
function distractVerbs(v,n){
 var res=[],i,pool=[];
 if(v.opp)res.push(byId(v.opp));
 for(i=0;i<VERBS.length;i++){if(VERBS[i]!==v&&res.indexOf(VERBS[i])<0)pool.push(VERBS[i]);}
 shuffle(pool);
 while(res.length<n&&pool.length)res.push(pool.shift());
 return res;
}
function genMeaning(v){
 var d=state.dir,toL=(d==='a')||(d==='m'&&rnd(2)===0),idx=li(),ds=distractVerbs(v,3),opts=[],i,all;
 if(toL){
  all=[v].concat(ds);
  var seen={};
  for(i=0;i<all.length;i++){var s=all[i].m[idx];if(seen[s])continue;seen[s]=1;opts.push({h:L(s),ok:all[i]===v});}
  shuffle(opts);
  return {kind:'meaning',dirL:true,v:v,opts:opts,picked:null,hint:false};
 }
 all=[v].concat(ds);
 for(i=0;i<all.length;i++){opts.push({h:'<span class="serif">'+vd(all[i],true)+'</span>',ok:all[i]===v});}
 shuffle(opts);
 return {kind:'meaning',dirL:false,v:v,opts:opts,picked:null,hint:false};
}
var useIdx={};
function genUse(v){
 var list=[],i;
 for(i=0;i<USEQ.length;i++){if(USEQ[i].v===v.id)list.push(USEQ[i]);}
 useIdx[v.id]=((useIdx[v.id]||0)+1+rnd(2))%list.length;
 var it=list[useIdx[v.id]],ds=distractVerbs(v,3),all=[v].concat(ds),opts=[];
 for(i=0;i<all.length;i++){opts.push({h:'<span class="serif">'+vd(all[i],true)+'</span>',ok:all[i]===v,vid:all[i].id});}
 shuffle(opts);
 return {kind:'use',v:v,it:it,opts:opts,picked:null,hint:false};
}
function gen(kind,v){
 switch(kind){
  case 'meaning':return genMeaning(v);
  case 'gap':return genGap(v);
  case 'order':return genOrder(v);
  case 'pres':return genPres(v);
  case 'use':return genUse(v);
 }
 return genMeaning(v);
}
function buildQuestions(mode,n){
 var pool=selected(),order=[],qs=[],i,kinds;
 while(order.length<n){order=order.concat(shuffle(pool.slice()));}
 if(mode==='meaning')kinds=['meaning'];
 else if(mode==='gap')kinds=['gap'];
 else if(mode==='order')kinds=['order'];
 else if(mode==='use')kinds=['use'];
 else if(mode==='grammar')kinds=['pres'];
 else kinds=shuffle(['meaning','gap','order','pres','use']);
 for(i=0;i<n;i++){
  var k=kinds[i%kinds.length];
  qs.push(gen(k,order[i]));
 }
 return qs;
}

function fbHead(ok){return '<div class="h">'+(ok?'✓ ':'✗ ')+bi(ok?TT.ok:TT.bad)+'</div>';}
function explain(q,ok){
 var v=q.v,h='',idx=li();
 if(q.kind==='meaning'){
  h='<div class="lbl">'+vd(v,true)+' = '+esc(v.m[0])+'</div>'+auxHtml(v.m[idx])+'<div class="sol">'+esc(v.x[0])+'</div>'+auxHtml(v.x[idx]);
  if(v.n)h+='<div class="rulebox">'+bi(v.n)+'</div>';
 }else if(q.kind==='pres'){
  h='<div class="sol">'+sentHtml(shapeItems(q,q.f),v,shapePunct(q))+'</div>'+ruleBox(q.rule);
 }else if(q.kind==='use'){
  h='<div class="sol">'+useSentence(q.it,false)+'</div><div class="lbl">'+vd(v,true)+' = '+esc(v.m[0])+'</div>'+auxHtml(v.m[idx]);
 }

}
function useSentence(it,blank){

  s=s.replace('{F}','<span class="blank">___</span>').replace('{P}','<span class="blank">___</span>').replace('{I}','<span class="blank">______</span>');
 }else{
  s=s.replace('{F}','<span class="stem">'+esc(it.f||'')+'</span>').replace('{P}','<span class="pre">'+esc(v.pre)+'</span>').replace('{I}','<span class="pre">'+esc(v.pre)+'</span><span class="stem">'+esc(v.stem+'en')+'</span>');

  h+='<button class="chip" data-act="pick" data-v="'+id+'"'+(q.done?' disabled':'')+'>'+esc(q.items[id].t)+'</button>';
 }
 h+='</div>';
 if(q.hint&&!q.done)h+=hintHtml(q);
 if(q.done){
  var shown=q.items,j;
  if(q.okv){shown=[];for(j=0;j<q.picked.length;j++)shown.push(q.items[q.picked[j]]);}
  h+='<div class="fb '+(q.okv?'ok':'bad')+'" role="status">'+fbHead(q.okv)+
   (q.okv?'':'<div class="lbl">'+bi(TT.sol)+'</div>')+
   '<div class="sol">'+sentHtml(shown,q.v,q.punct)+'</div>'+ruleBox(q.rule)+'</div>';
 }
 return h;
}
function quizActs(q){
 var h='<div class="acts">',done,canCheck=false;
 if(q.kind==='order'){done=q.done;canCheck=q.picked.length===q.items.length;}
 else if(q.kind==='gap'){done=q.done;canCheck=(q.sel1!==null&&q.sel2!==null);}
 else{done=state.answered;}
 if(!done){
  if(q.kind==='order'||q.kind==='gap'){
   h+='<button class="btn" data-act="check"'+(canCheck?'':' disabled')+'>'+bi(TT.check)+'</button>';
   if(q.kind==='order')h+='<button class="btn sec" data-act="reset"'+(q.picked.length?'':' disabled')+'>'+bi(TT.reset)+'</button>';
  }
  h+='<button class="btn sec" data-act="hint"'+(q.hint?' disabled':'')+'>'+bi(TT.hint)+'</button>';
 }else{
  h+='<button class="btn" data-act="next" data-focus="1">'+bi(TT.next)+'</button>';
 }
 return h+'</div>';
}
function screenQuiz(){
 var q=state.qs[state.qi],n=state.qs.length,i=state.qi+1;
 var h=topbar()+'<div class="qbar"><button class="link" data-act="menu">‹ '+bi(TT.menu)+'</button><span class="cnt"><span class="de">'+esc(TT.q[0])+' '+i+' / '+n+'</span>'+auxHtml(TT.q[li()]+' '+i+' / '+n)+'</span></div>';
 h+='<div class="prog" aria-hidden="true"><i style="width:'+Math.round((state.qi/n)*100)+'%"></i></div><div class="panel">';
 h+=(q.kind==='order')?bodyOrder(q):(q.kind==='gap')?bodyGap(q):bodySingle(q);
 return h+quizActs(q)+'</div>';
}
function screenResult(){
 var n=state.qs.length,pct=Math.round(state.score/n*100),msg=pct>=90?TT.great:(pct>=60?TT.good:TT.more);
 var h=topbar()+'<div class="res"><div class="lbl">'+bi(TT.score)+'</div><div class="big">'+state.score+' / '+n+'</div><div class="msg">'+bi(msg)+'</div>';
 if(state.wrong.length){
  var seen={},w='',i;
  for(i=0;i<state.wrong.length;i++){var v=state.wrong[i].v;if(seen[v.id])continue;seen[v.id]=1;w+='<span class="w">'+vd(v,true)+'</span>';}
  h+='<div class="wl">'+w+'</div>';
 }
 h+='<div class="acts" style="justify-content:center">';
 if(state.wrong.length)h+='<button class="btn" data-act="retry">'+bi(TT.mist)+'</button>';
 h+='<button class="btn'+(state.wrong.length?' sec':'')+'" data-act="again">'+bi(TT.again)+'</button><button class="btn sec" data-act="menu">'+bi(TT.menu)+'</button></div></div>';
 return h;
}

function render(){
 var app=document.getElementById('app'),h;
 if(state.screen==='menu')h=screenMenu();
 else if(state.screen==='learn')h=screenLearn();
 else if(state.screen==='quiz')h=screenQuiz();
 else h=screenResult();
 app.innerHTML=h;
 if(state.screen==='menu'&&!state.heroDone){state.heroDone=true;setTimeout(heroPlay,250);}
 if(state.focus){var el=app.querySelector('[data-focus]');if(el){try{el.focus();}catch(e){}}state.focus=null;}
}

/* ================= Hero-Animation (FLIP) ================= */
function heroPlay(){
 var box=document.getElementById('hs');if(!box)return;
 if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
 var toks=box.querySelectorAll('.tk'),arr=[],i;
 for(i=0;i<toks.length;i++){arr.push(toks[i]);}
 var stem=arr[1],pre=arr[3],first=[],last=[];
 box.insertBefore(pre,stem);pre.className='tk pre joined';
 for(i=0;i<arr.length;i++){first.push(arr[i].getBoundingClientRect());}
 box.appendChild(pre);pre.className='tk pre';
 for(i=0;i<arr.length;i++){last.push(arr[i].getBoundingClientRect());}
 for(i=0;i<arr.length;i++){arr[i].style.transition='none';arr[i].style.transform='translate('+(first[i].left-last[i].left)+'px,0)';}
 void box.offsetWidth;
 setTimeout(function(){
  for(var j=0;j<arr.length;j++){arr[j].style.transition='transform 1s cubic-bezier(.3,.7,.2,1)';arr[j].style.transform='';}
 },900);
}

/* ================= Ablauf ================= */
function start(mode){
 state.mode=mode;state.qs=buildQuestions(mode,12);state.qi=0;state.score=0;state.wrong=[];state.answered=false;state.screen='quiz';
 render();window.scrollTo(0,0);
}
function retry(){
 var qs=[],i;
 for(i=0;i<state.wrong.length;i++){qs.push(gen(state.wrong[i].kind,state.wrong[i].v));}
 if(!qs.length)return;
 state.qs=qs;state.qi=0;state.score=0;state.wrong=[];state.answered=false;state.screen='quiz';
 render();window.scrollTo(0,0);
}
function cur(){return state.qs[state.qi];}
function finish(q,ok){
 if(ok)state.score++;else state.wrong.push({kind:q.kind,v:q.v});
}
function handle(a,v){
 var q,i;
 if(a==='lang'){state.lang=v;save();render();return;}
 if(a==='dir'){state.dir=v;save();render();return;}
 if(a==='vtog'){
  if(state.sel[v]&&selCount()<=1)return;
  state.sel[v]=!state.sel[v];state.open.sel=true;save();render();return;
 }
 if(a==='vall'){for(i=0;i<VERBS.length;i++)state.sel[VERBS[i].id]=true;state.open.sel=true;save();render();return;}
 if(a==='mode'){if(v==='learn'){state.screen='learn';render();window.scrollTo(0,0);}else start(v);return;}
 if(a==='menu'){state.screen='menu';render();window.scrollTo(0,0);return;}
 if(a==='replay'){heroPlay();return;}
 if(a==='again'){start(state.mode);return;}
 if(a==='retry'){retry();return;}
 if(state.screen!=='quiz')return;
 q=cur();
 if(a==='opt'){
  if(state.answered)return;
  q.picked=parseInt(v,10);state.answered=true;finish(q,q.opts[q.picked].ok);state.focus=true;render();return;
 }
 if(a==='gap1'){if(!q.done){q.sel1=parseInt(v,10);render();}return;}
 if(a==='gap2'){if(!q.done){q.sel2=parseInt(v,10);render();}return;}
 if(a==='pick'){if(!q.done){q.picked.push(parseInt(v,10));render();}return;}
 if(a==='unpick'){if(!q.done){var id=parseInt(v,10),p=q.picked.indexOf(id);if(p>-1)q.picked.splice(p,1);render();}return;}
 if(a==='reset'){if(!q.done){q.picked=[];render();}return;}
 if(a==='hint'){q.hint=true;render();return;}
 if(a==='check'){
  if(q.kind==='gap'){
   if(q.sel1===null||q.sel2===null||q.done)return;
   q.ok1=(q.o1[q.sel1]===q.f);q.ok2=(q.o2[q.sel2]===q.v.pre);q.done=true;
   finish(q,q.ok1&&q.ok2);
  }else if(q.kind==='order'){
   if(q.done||q.picked.length!==q.items.length)return;
   var seq=[],j,k,ok=false;
   for(j=0;j<q.picked.length;j++)seq.push(q.items[q.picked[j]].t);
   for(j=0;j<q.vars.length;j++){var arr=[];for(k=0;k<q.vars[j].length;k++)arr.push(q.vars[j][k].t);if(arr.join('|')===seq.join('|'))ok=true;}
   q.done=true;q.okv=ok;finish(q,ok);
  }
  state.focus=true;render();return;
 }
 if(a==='next'){
  state.qi++;state.answered=false;
  if(state.qi>=state.qs.length)state.screen='result';
  render();window.scrollTo(0,0);return;
 }
}

document.addEventListener('click',function(e){
 var el=e.target;
 while(el&&el!==document&&!(el.getAttribute&&el.getAttribute('data-act')))el=el.parentNode;
 if(!el||el===document)return;
 handle(el.getAttribute('data-act'),el.getAttribute('data-v'));
});
document.addEventListener('toggle',function(e){
 var t=e.target;
 if(t&&t.getAttribute&&t.getAttribute('data-key')){state.open[t.getAttribute('data-key')]=t.open;}
},true);

load();
render();
})();
</script>
