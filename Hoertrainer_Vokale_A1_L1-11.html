<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hörtrainer: Vokale und Diphthonge</title>
<style>

  :root {
    --bg:#f4f6fa; --card:#fff; --text:#1d2433; --muted:#5b667a; --line:#d5dbe6;
    --accent:#2b5fd9; --accent-text:#fff; --chip:#e9eef8;
    --ok:#1f7a4d; --ok-bg:#e0f3e8; --bad:#b3303f; --bad-bg:#fbe4e7; --warn-bg:#fff4d6; --mark:#fde8a6;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#12161f; --card:#1b2130; --text:#e8ecf5; --muted:#9aa5ba; --line:#30394d;
      --accent:#6b97ff; --accent-text:#0b1226; --chip:#252d40;
      --ok:#6fd6a2; --ok-bg:#183427; --bad:#ff8a98; --bad-bg:#42202a; --warn-bg:#3a3118; --mark:#6b5a1d;
    }
  }
  * { box-sizing:border-box; }
  html,body { margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; line-height:1.45; min-height:100vh; }
  .wrap { max-width:900px; margin:0 auto; padding:14px; }
  h1 { font-size:1.2rem; margin:2px 0 10px; }
  .tabs { display:flex; gap:6px; margin-bottom:12px; }
  .tab { flex:1; min-height:48px; border-radius:12px; border:2px solid var(--line); background:var(--card); color:var(--text); font-size:1rem; cursor:pointer; font-weight:600; }
  .tab.on { border-color:var(--accent); background:var(--chip); }
  .panel { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin-bottom:12px; }
  .panel h2 { font-size:.78rem; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:0 0 8px; }
  .row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .chip { display:inline-flex; align-items:center; gap:6px; min-height:44px; padding:6px 14px; border-radius:999px; background:var(--chip); border:2px solid transparent; cursor:pointer; user-select:none; font-size:.95rem; }
  .chip input { position:absolute; opacity:0; pointer-events:none; }
  .chip.on { border-color:var(--accent); font-weight:700; }
  .chip:focus-within { outline:3px solid var(--accent); outline-offset:2px; }
  .chip small { color:var(--muted); font-weight:400; }
  .small { color:var(--muted); font-size:.86rem; margin-top:6px; }
  .linkbtn { background:none; border:none; color:var(--accent); cursor:pointer; font-size:.92rem; padding:6px 4px; min-height:44px; }
  select, input[type=text], input[type=search] { min-height:44px; border-radius:10px; border:2px solid var(--line); background:var(--card); color:var(--text); font-size:1rem; padding:6px 10px; }
  label.opt { display:flex; align-items:center; gap:8px; min-height:44px; }
  button.main { width:100%; min-height:56px; border-radius:14px; border:none; cursor:pointer; font-size:1.15rem; font-weight:700; background:var(--accent); color:var(--accent-text); }
  button.main:disabled { opacity:.4; cursor:default; }
  button.sec { min-height:48px; padding:0 18px; border-radius:12px; cursor:pointer; font-size:1rem; background:var(--card); color:var(--text); border:2px solid var(--line); }
  button:focus-visible, input:focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
  .bar { height:10px; background:var(--chip); border-radius:999px; overflow:hidden; }
  .bar > i { display:block; height:100%; background:var(--accent); }
  .top { display:flex; justify-content:space-between; font-size:.9rem; color:var(--muted); margin-bottom:6px; }
  .qcard { text-align:center; padding:18px 12px 12px; }
  .qtask { font-size:.95rem; color:var(--muted); margin-bottom:6px; }
  .qmean { font-size:1.1rem; color:var(--muted); min-height:1.5em; margin-bottom:6px; }
  .qbig { font-size:clamp(2rem,9vw,3.2rem); font-weight:800; margin:8px 0 12px; word-wrap:break-word; overflow-wrap:anywhere; letter-spacing:.02em; }
  .gap { display:inline-block; min-width:1.6em; border-bottom:4px solid var(--accent); color:var(--accent); }
  .opts { display:grid; gap:10px; margin:10px 0; }
  .opts.two { grid-template-columns:1fr 1fr; }
  .opts button { min-height:68px; border-radius:14px; border:3px solid var(--line); background:var(--card); color:var(--text); font-size:1.5rem; font-weight:800; cursor:pointer; padding:6px 10px; word-wrap:break-word; overflow-wrap:anywhere; }
  .opts.rule button { font-size:1.05rem; font-weight:700; text-align:left; min-height:60px; }
  .opts button small.sub { font-size:.82rem; font-weight:500; color:var(--text); opacity:.85; margin-top:4px; }
  .opts button small { display:block; font-size:.7rem; font-weight:500; color:var(--muted); }
  .opts button.right { background:var(--ok-bg); border-color:var(--ok); color:var(--ok); }
  .opts button.wrong { background:var(--bad-bg); border-color:var(--bad); color:var(--bad); }
  .opts button:disabled { cursor:default; }
  .opts button:disabled:not(.right):not(.wrong) { opacity:.5; }
  .typebox { display:flex; gap:8px; margin:8px 0; }
  .typebox input { flex:1; font-size:1.4rem; min-width:0; }
  .typebox button { min-width:96px; }
  .umlauts { display:flex; gap:6px; justify-content:center; margin-bottom:8px; }
  .umlauts button { min-width:52px; min-height:44px; border-radius:10px; border:2px solid var(--line); background:var(--card); color:var(--text); font-size:1.2rem; cursor:pointer; }
  mark.seg { background:var(--mark); color:inherit; border-radius:4px; padding:0 2px; }
  .fb { border-radius:12px; padding:12px 14px; margin-top:6px; text-align:left; }
  .fb.ok { background:var(--ok-bg); } .fb.bad { background:var(--bad-bg); }
  .fb .big { font-size:1.3rem; font-weight:800; }
  .fb .hint { margin-top:6px; padding:8px 10px; border-radius:10px; background:var(--warn-bg); font-size:.95rem; }
  .fb s { opacity:.7; }
  .speak { min-height:44px; padding:0 14px; border-radius:999px; border:2px solid var(--line); background:var(--card); color:var(--text); cursor:pointer; font-size:.95rem; margin-bottom:6px; }
  .score { font-size:2.2rem; font-weight:800; text-align:center; }
  .rev { list-style:none; margin:8px 0 0; padding:0; }
  .rev li { padding:10px 0; border-top:1px solid var(--line); }
  .rev .pl { color:var(--muted); font-size:.92rem; }
  .rev .w { font-size:1.15rem; font-weight:700; }
  .grp h3 { font-size:1.02rem; margin:0 0 4px; }
  .grp p { margin:0 0 8px; color:var(--muted); font-size:.92rem; }
  .words { display:flex; flex-wrap:wrap; gap:6px; }
  .words span { background:var(--chip); border-radius:10px; padding:4px 10px; font-size:1rem; }
  .words span small { color:var(--muted); }
  .rowbar { display:flex; height:14px; border-radius:999px; overflow:hidden; background:var(--chip); }
  .rowbar i { display:block; height:100%; }
  .seg-s { background:var(--ok); } .seg-g { background:#e0a526; }
  table.prog { width:100%; border-collapse:collapse; font-size:.95rem; }
  table.prog td { padding:6px 4px; border-top:1px solid var(--line); vertical-align:middle; }
  table.prog td.n { width:44%; font-weight:600; }
  table.prog td.c { width:92px; text-align:right; color:var(--muted); font-size:.85rem; white-space:nowrap; }
  details summary { cursor:pointer; font-weight:600; min-height:44px; display:flex; align-items:center; }
  .rules li { margin:6px 0; }
  .hidden { display:none !important; }
  @media (max-width:560px) { .opts.two { grid-template-columns:1fr; } .wrap { padding:10px; } }

  .play { min-height:64px; padding:0 26px; border-radius:999px; border:none; background:var(--accent); color:var(--accent-text); font-size:1.2rem; font-weight:700; cursor:pointer; }
  .playrow { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin:6px 0 4px; align-items:center; }
  .opts.many { grid-template-columns:repeat(auto-fit,minmax(104px,1fr)); }
  .opts.many button { font-size:1.8rem; }
  .mini { min-height:36px; min-width:36px; padding:0 10px; border-radius:999px; border:2px solid var(--line); background:var(--card); color:var(--text); cursor:pointer; font-size:.95rem; }
  .warn { background:var(--warn-bg); border-radius:10px; padding:10px 12px; font-size:.93rem; margin-top:8px; }
  .vars summary { font-weight:600; }
  .words span.clk { cursor:pointer; }
  .words span.clk:hover { outline:2px solid var(--accent); }
  .fb .ex { margin-top:6px; font-size:.95rem; }
  @media (max-width:560px) { .opts.many { grid-template-columns:repeat(auto-fit,minmax(88px,1fr)); } }
</style>
</head>

<div class="wrap">
  <h1>Hörtrainer &middot; Vokale und Diphthonge</h1>
  <div class="tabs" role="tablist">

  <div id="viewPractice"></div>
  <div id="viewList" class="hidden"></div>
  <div id="viewProg" class="hidden"></div>
</div>

    for (var k = r.length - 1; k > 0; k--) { var j = Math.floor(Math.random() * (k + 1)); var t = r[k]; r[k] = r[j]; r[j] = t; }

  }

  /* Antwortoptionen: die richtige Schreibung + je EINE Schreibung aus anderen Lautgruppen.
     Nie zwei Schreibungen derselben Gruppe (sie klingen gleich). */
  function isSingle(v) { return v.length === 1; }
  function pickVariant(group, wantSingle) {
    var c = group.variants.filter(function (v) { return isSingle(v) === wantSingle; });
    if (!c.length) { c = group.variants; }
    var total = 0, k;
    for (k = 0; k < c.length; k++) { total += (VARIANT_WEIGHT[c[k]] || 1); }
    var r = Math.random() * total;
    for (k = 0; k < c.length; k++) { r -= (VARIANT_WEIGHT[c[k]] || 1); if (r <= 0) { return c[k]; } }
    return c[c.length - 1];
  }
  function buildOptions(it, n) {
    var correctGroup = groupById[it.g];
    var opts = [{ text: it.seg, correct: true, group: it.g }];
    var used = {}; used[it.g] = true;
    /* 1. Schwerpunkt-Verwechslungen zuerst (bis zu 2) */
    var pr = [];
    (PARTNER[it.seg] || []).forEach(function (ps) {
      var gid = segGroup(ps), k;
      for (k = 0; k < pr.length; k++) { if (pr[k].g === gid) { pr[k].vs.push(ps); return; } }
      pr.push({ g: gid, vs: [ps] });
    });
    pr = shuffle(pr);
    var k2;
    for (k2 = 0; k2 < pr.length && opts.length < n && opts.length < 3; k2++) {
      if (used[pr[k2].g]) { continue; }
      used[pr[k2].g] = true;
      opts.push({ text: pr[k2].vs[Math.floor(Math.random() * pr[k2].vs.length)], correct: false, group: pr[k2].g });
    }
    /* 2. aehnlich klingende Laute, 3. beliebige andere */
    var near = shuffle(correctGroup.conf);
    var rest = shuffle(GROUPS.filter(function (g) { return g.id !== it.g && correctGroup.conf.indexOf(g.id) < 0; }).map(function (g) { return g.id; }));
    var order = near.concat(rest);
    var wantSingle = isSingle(it.seg);
    if (correctGroup.variants.length === 1 && it.seg.length === 2) { wantSingle = false; }
    for (k2 = 0; k2 < order.length && opts.length < n; k2++) {
      if (used[order[k2]]) { continue; }
      used[order[k2]] = true;
      var g = groupById[order[k2]];
      var diph = g.variants.every(function (v) { return v.length === 2; });
      opts.push({ text: pickVariant(g, diph ? false : wantSingle), correct: false, group: order[k2] });
    }
    return shuffle(opts);
  }
  /* Schwerpunkt-Training: pro Seite des Paars genau eine Antwort */
  function buildFocusOptions(it, modeId) {
    var mode = modeById(modeId);
    var own = sideIndex(mode, it.seg);
    var opts = [{ text: it.seg, correct: true, group: it.g }];
    mode.sides.forEach(function (side, idx) {
      if (idx === own) { return; }
      var c = (PARTNER[it.seg] || []).filter(function (p) { return side.indexOf(p) >= 0; });
      if (!c.length) { c = [side[0]]; }
      var text = c[Math.floor(Math.random() * c.length)];
      opts.push({ text: text, correct: false, group: segGroup(text) });
    });
    return shuffle(opts);
  }

  /* ---------- Sprachausgabe ---------- */

      out.sort(function (a, b) {
        var sa = (a.lang || "").toLowerCase().replace("_", "-") === "de-de" ? 0 : 1;
        var sb = (b.lang || "").toLowerCase().replace("_", "-") === "de-de" ? 0 : 1;

  }

    var acts = el("div");
    if (wrong.length) {
      var rb = el("button", "main", "Fehlerwörter wiederholen (" + wrong.length + ")"); rb.type = "button";
      rb.addEventListener("click", function () {
        startSession(shuffle(wrong.map(function (r) { return { id: r.id, mode: r.mode }; })), true);
      });
      acts.appendChild(rb);
    }
    var again = el("button", "sec", "Neue Runde"); again.type = "button"; again.style.marginTop = "10px"; again.style.width = "100%";
    again.addEventListener("click", function () { session = null; renderPractice(); });
    acts.appendChild(again); v.appendChild(acts);
  }

  /* ---------- Laute & Wörter ---------- */
  function renderList() {
    var v = $("viewList"); clear(v);
    var rules = el("div", "panel");
    var det = document.createElement("details"); det.open = true;
    det.appendChild(el("summary", null, "Hören und schreiben – das Wichtigste"));
    var ul = el("ul", "rules");
    [
      "Ein Laut kann verschieden geschrieben werden. Beispiel: Der Laut [iː] steht in Liebe (ie), Tiger (i), ihr (ih) und sieht (ieh).",
      "Darum fragt der Trainer nur nach dem Laut: Pro Frage steht nur eine Schreibung eines Lauts in den Antworten.",
      "Die Lücke zeigt, wo der Laut im Wort steht. Die anderen Buchstaben sind schon da.",
      "Wenn man einen Laut nicht sicher hört, hilft der Knopf „Langsam“ und der Vergleich mit dem Beispielwort.",
      "Die richtige Schreibung muss man oft lernen oder nachschlagen (z. B. Wortfamilie: Hand – Hände, Haus – Häuser).",
      "Tipp: Klicke auf ein Wort in der Liste, um es zu hören."
    ].forEach(function (t) { ul.appendChild(el("li", null, t)); });
    det.appendChild(ul); rules.appendChild(det); v.appendChild(rules);

    var pm = el("div", "panel");
    var dm = document.createElement("details");
    dm.appendChild(el("summary", null, "Schwerpunkte: So klingt der Unterschied"));
    var um = el("ul", "rules");
    MODES.forEach(function (m) { var li = el("li"); li.appendChild(el("b", null, m.label + ": ")); li.appendChild(document.createTextNode(m.text)); um.appendChild(li); });
    dm.appendChild(um); pm.appendChild(dm); v.appendChild(pm);

    var p1 = el("div", "panel"); p1.appendChild(el("h2", null, "Wörter")); lessonChips(p1, renderList); v.appendChild(p1);
    GROUPS.forEach(function (g) {
      var items = ITEMS.filter(function (it) { return it.g === g.id && store.settings.lessons[lessonIdx(it)]; });
      if (!items.length) { return; }
      var p = el("div", "panel grp vars");
      p.appendChild(el("h3", null, g.label + " (" + items.length + ")"));
      p.appendChild(el("p", null, g.text));
      g.variants.forEach(function (va) {
        var vi = items.filter(function (it) { return it.seg === va; });
        if (!vi.length) { return; }
        vi.sort(function (a, b) { return a.w.localeCompare(b.w, "de"); });
        var d = document.createElement("details");
        d.appendChild(el("summary", null, va + " (" + vi.length + ") – wie in „" + EXAMPLE[va] + "“"));
        var w = el("div", "words");
        vi.forEach(function (it) {
          var s = el("span", "clk"); s.appendChild(wordNode(it));
          s.addEventListener("click", function () { speak(it.w, false); });
          w.appendChild(s);
        });
        d.appendChild(w); p.appendChild(d);
      });
      v.appendChild(p);
    });
  }

  /* ---------- Fortschritt ---------- */
  function renderProg() {
    var v = $("viewProg"); clear(v);
    var seen = 0, sure = 0, tot = ITEMS.length;
    var perG = {}; GROUPS.forEach(function (g) { perG[g.id] = { t: 0, s: 0, g: 0 }; });
    var hard = [];
    ITEMS.forEach(function (it) {
      var r = rec(it.id); perG[it.g].t += 1;
      if (r && r.n > 0) {
        seen += 1;
        if (isSure(it.id)) { sure += 1; perG[it.g].s += 1; } else { perG[it.g].g += 1; }
        if (r.n - r.c > 0) { hard.push({ it: it, wrong: r.n - r.c, all: r.n }); }
      }
    });
    var p = el("div", "panel"); p.appendChild(el("h2", null, "Gesamt"));
    p.appendChild(el("div", null, sure + " von " + tot + " Wörtern sicher · " + seen + " schon geübt"));
    var rb = el("div", "rowbar"); rb.style.marginTop = "8px";
    var s1 = el("i", "seg-s"); s1.style.width = (100 * sure / tot) + "%";
    var s2 = el("i", "seg-g"); s2.style.width = (100 * (seen - sure) / tot) + "%";
    rb.appendChild(s1); rb.appendChild(s2); p.appendChild(rb);
    p.appendChild(el("div", "small", "„sicher“ = zuletzt mindestens zweimal hintereinander richtig. Grün: sicher · Gelb: geübt, aber noch nicht sicher."));
    v.appendChild(p);

    var p2 = el("div", "panel"); p2.appendChild(el("h2", null, "Nach Laut"));
    var tb = el("table", "prog");
    GROUPS.forEach(function (g) {
      var d = perG[g.id]; var tr = el("tr");
      tr.appendChild(el("td", "n", g.label));
      var tdb = el("td"); var bb = el("div", "rowbar");
      var a1 = el("i", "seg-s"); a1.style.width = (100 * d.s / d.t) + "%";
      var a2 = el("i", "seg-g"); a2.style.width = (100 * d.g / d.t) + "%";
      bb.appendChild(a1); bb.appendChild(a2); tdb.appendChild(bb); tr.appendChild(tdb);
      tr.appendChild(el("td", "c", d.s + " / " + d.t + " sicher")); tb.appendChild(tr);
    });
    p2.appendChild(tb); v.appendChild(p2);

    var p2b = el("div", "panel"); p2b.appendChild(el("h2", null, "Schwerpunkte (Verwechslungspaare)"));
    var tb2 = el("table", "prog");
    MODES.forEach(function (m) {
      var tt = 0, ss = 0, gg = 0;
      ITEMS.forEach(function (it) {
        if (modesOf(it.seg).indexOf(m.id) < 0) { return; }
        tt += 1; var r = rec(it.id);
        if (r && r.n > 0) { if (isSure(it.id)) { ss += 1; } else { gg += 1; } }
      });
      var tr = el("tr"); tr.appendChild(el("td", "n", m.label));
      var tdb = el("td"); var bb = el("div", "rowbar");
      var a1 = el("i", "seg-s"); a1.style.width = (100 * ss / tt) + "%";
      var a2 = el("i", "seg-g"); a2.style.width = (100 * gg / tt) + "%";
      bb.appendChild(a1); bb.appendChild(a2); tdb.appendChild(bb); tr.appendChild(tdb);
      tr.appendChild(el("td", "c", ss + " / " + tt + " sicher")); tb2.appendChild(tr);
    });
    p2b.appendChild(tb2); v.appendChild(p2b);

    var p3 = el("div", "panel"); p3.appendChild(el("h2", null, "Schwierigste Wörter"));
    hard.sort(function (a, b) { return b.wrong - a.wrong || b.all - a.all; });
    if (!hard.length) { p3.appendChild(el("div", "small", "Noch keine Fehler – oder noch nichts geübt.")); }
    else {
      var ul = el("ul", "rev");
      hard.slice(0, 10).forEach(function (h) {
        var li = el("li"); var line = el("div", "w"); line.appendChild(wordNode(h.it)); line.appendChild(document.createTextNode(" ")); line.appendChild(speakMini(h.it.w)); li.appendChild(line);
        li.appendChild(el("div", "pl", h.wrong + " von " + h.all + " falsch")); ul.appendChild(li);
      });
      p3.appendChild(ul);
    }
    v.appendChild(p3);
    var p4 = el("div", "panel");
    var rs = el("button", "sec", "Fortschritt zurücksetzen"); rs.type = "button";
    rs.addEventListener("click", function () {
      if (window.confirm("Gesamten Fortschritt löschen? Das kann nicht rückgängig gemacht werden.")) { store.words = {}; save(); renderProg(); }
    });
    p4.appendChild(rs); v.appendChild(p4);
  }

  /* ---------- Tabs & Tastatur ---------- */
  var tab = "practice";
  function showTab(t) {
    tab = t;
    $("viewPractice").className = t === "practice" ? "" : "hidden";
    $("viewList").className = t === "list" ? "" : "hidden";
    $("viewProg").className = t === "prog" ? "" : "hidden";
    $("tabPractice").className = "tab" + (t === "practice" ? " on" : "");
    $("tabList").className = "tab" + (t === "list" ? " on" : "");
    $("tabProg").className = "tab" + (t === "prog" ? " on" : "");
    if (t === "practice") { renderPractice(); } else if (t === "list") { renderList(); } else { renderProg(); }
  }
  function init() {
    load();
    $("tabPractice").addEventListener("click", function () { showTab("practice"); });
    $("tabList").addEventListener("click", function () { showTab("list"); });
    $("tabProg").addEventListener("click", function () { showTab("prog"); });
    document.addEventListener("keydown", function (ev) {
      if (tab !== "practice" || !session || session.pos >= session.queue.length) { return; }
      var tag = ev.target && ev.target.tagName;
      if (tag === "INPUT" || tag === "SELECT") { return; }
      if (!session.answered) {
        var row = $("optRow");
        var n = parseInt(ev.key, 10);
        if (row && n >= 1 && n <= 5) {
          var b = row.getElementsByTagName("button")[n - 1];
          if (b) { b.click(); }
        } else if (ev.key === "r" || ev.key === "R") { speak(session.current.it.w, false); }
        else if (ev.key === "l" || ev.key === "L") { speak(session.current.it.w, true); }
      } else if ((ev.key === "Enter" || ev.key === " ") && tag !== "BUTTON") { ev.preventDefault(); nextQuestion(); }
    });
    if (hasSpeech()) {
      try {
        window.speechSynthesis.onvoiceschanged = function () { if (tab === "practice" && !session) { renderPractice(); } };
      } catch (e) { /* egal */ }
    }
    showTab("practice");
  }
  init();
})();
</script>
</body>
</html>
