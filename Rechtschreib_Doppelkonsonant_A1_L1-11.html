  .hidden { display:none !important; }

    var rep = 0;
    ids.forEach(function (id) { var r = rec(id); if (r && r.box !== undefined && r.box < 2) { rep += 1; } });
    var info = el("div", "small", ids.length + " Wörter im Pool" + (rep ? " · " + rep + " davon kommen wegen früherer Fehler häufiger dran." : ". Wörter, die du falsch beantwortest, kommen danach häufiger dran."));
    info.style.marginBottom = "10px"; v.appendChild(info);
    var go = el("button", "main", "Start"); go.type = "button"; go.disabled = ids.length === 0 || !langReady();
    if (store.settings.format === "rule") {
      var okRule = ids.filter(function (id) { return ruleApplicable(byId[id]); });
      if (okRule.length === 0) { go.disabled = true; }
      ids = okRule.length ? okRule : ids;
    }
    go.addEventListener("click", function () {
      var chosen = weightedSample(ids, store.settings.size);
      startSession(chosen.map(function (id) { return { id: id, fmt: formatFor(byId[id]) }; }), false);
    });
    v.appendChild(go);
    if (go.disabled) {
      var why = !store.settings.langSet ? "Bitte zuerst oben eine Sprache wählen."
        : (!langReady() ? "Für „Tippen“ und „Mix“ wird eine Sprache gebraucht (nicht „keine Hilfe“)."
        : (store.settings.format === "rule" ? "Für „Regel erkennen“ passt die Auswahl nicht (Zusammensetzungen und unbetonte Fälle sind ausgenommen)." : "Bitte mindestens ein Thema und eine Lektion wählen."));
      v.appendChild(el("div", "small", why));
    }
  }

  function formatFor(it) {
    var f = store.settings.format;
    if (f === "mix") { return pick(formatsFor(it)); }
    if (f === "rule" && !ruleApplicable(it)) { return "choose"; }
    return f;
  }

  function startSession(queue, isReview) {
    if (autoTimer) { clearTimeout(autoTimer); autoTimer = null; }
    session = { queue: queue, pos: 0, results: [], answered: false, review: isReview };
    renderPractice();
  }

  function renderQuestion(v) {
    var q = session.queue[session.pos];
    var it = byId[q.id];
    var total = session.queue.length;
    var top = el("div", "top");
    top.appendChild(el("span", null, (session.review ? "Wiederholung · " : "") + "Frage " + (session.pos + 1) + " / " + total));
    var right = 0; session.results.forEach(function (r) { if (r.ok) { right += 1; } });
    top.appendChild(el("span", null, right + " richtig"));
    v.appendChild(top);
    var bar = el("div", "bar"); var fill = el("i"); fill.style.width = Math.round(100 * session.pos / total) + "%"; bar.appendChild(fill); v.appendChild(bar);

    var card = el("div", "panel qcard");
    var fmt = q.fmt;
    var lg = meaningLang();
    var mean = meaning(it);
    var note = it.base ? "Mehrzahl von: " + it.base : "";
    if (fmt === "choose") { renderChoose(card, it, q, mean, note); }
    else if (fmt === "gap") { renderGap(card, it, q, mean, note); }
    else if (fmt === "rule") { renderRule(card, it, q, mean, note); }
    else { renderType(card, it, q, mean, note); }
    var fb = el("div"); fb.id = "fbBox"; card.appendChild(fb);
    var nxt = el("button", "main hidden", session.pos + 1 >= total ? "Auswertung" : "Weiter"); nxt.type = "button"; nxt.id = "nextBtn"; nxt.style.marginTop = "10px";
    nxt.addEventListener("click", nextQuestion); card.appendChild(nxt);
    v.appendChild(card);
    var quit = el("button", "linkbtn", "Runde abbrechen"); quit.type = "button";
    quit.addEventListener("click", function () { if (autoTimer) { clearTimeout(autoTimer); autoTimer = null; } session = null; renderPractice(); });
    v.appendChild(quit);
    session.answered = false;
    session.current = { it: it, fmt: fmt };
    if (fmt === "type") { var inp = $("typeInput"); if (inp && inp.focus) { try { inp.focus(); } catch (e) { /* egal */ } } }
  }

  function headBits(card, it, mean, note, withSpeak) {
    var m = el("div", "qmean", [mean, note].filter(function (x) { return x; }).join(" · "));
    if (meaningLang() === "ar" && mean) { m.setAttribute("dir", "rtl"); }
    var sp = withSpeak ? speakBtn(it.w) : null;
    if (sp) { card.appendChild(sp); }
    card.appendChild(m);
  }
  function optButtons(card, labels, cls, onPick) {
    var box = el("div", "opts " + cls); box.id = "optRow";
    labels.forEach(function (o, k) {
      var b = el("button", null, o.text); b.type = "button"; b.setAttribute("data-v", o.value);
      if (o.sub) { var sb = el("small", "sub", o.sub); if (o.rtl) { sb.setAttribute("dir", "rtl"); } b.appendChild(sb); }
      b.appendChild(el("small", null, "Taste " + (k + 1)));
      b.addEventListener("click", function () { onPick(o.value); });
      box.appendChild(b);
    });
    card.appendChild(box);
  }

  function renderChoose(card, it, q, mean, note) {
    card.appendChild(el("div", "qtask", "Welche Schreibweise ist richtig?"));
    headBits(card, it, mean, note, true);
    var opts = shuffle([{ text: it.w, value: "c" }, { text: it.wrong, value: "w" }]);
    optButtons(card, opts, "two", function (val) { answer(val === "c", val === "c" ? it.w : it.wrong); });
  }
  function renderGap(card, it, q, mean, note) {
    card.appendChild(el("div", "qtask", "Welche Schreibung passt in die Lücke?"));
    headBits(card, it, mean, note, true);
    var big = el("div", "qbig"); big.id = "gapWord";
    big.appendChild(document.createTextNode(it.pre));
    var g = el("span", "gap", "   "); g.id = "gapSpot"; big.appendChild(g);
    big.appendChild(document.createTextNode(it.post));
    card.appendChild(big);
    var opts = shuffle([{ text: it.a, value: "c" }, { text: it.b, value: "w" }]);
    optButtons(card, opts, "two", function (val) {
      var spot = $("gapSpot"); if (spot) { spot.textContent = (val === "c" ? it.a : it.b); }
      answer(val === "c", val === "c" ? it.a : it.b);
    });
  }
  function renderRule(card, it, q, mean, note) {
    card.appendChild(el("div", "qtask", "Warum wird das Wort so geschrieben?"));
    headBits(card, it, mean, note, true);
    var big = el("div", "qbig"); big.appendChild(wordNode(it, "right")); card.appendChild(big);
    var lgR = meaningLang();
    var opts = RULE_OPTS.map(function (o) { return { text: o.label, value: o.id, sub: lgR ? o[lgR] : "", rtl: lgR === "ar" }; });
    optButtons(card, opts, "rule", function (val) { answer(val === it.cat, RULE_OPTS.filter(function (o) { return o.id === val; })[0].label); });
  }
  function renderType(card, it, q, mean, note) {
    card.appendChild(el("div", "qtask", "Schreibe das Wort richtig."));
    headBits(card, it, mean, note, true);
    var pat = it.w.charAt(0);
    for (var k = 1; k < it.w.length; k++) { pat += " _"; }
    card.appendChild(el("div", "qbig", pat));
    card.appendChild(el("div", "small", it.w.length + " Buchstaben"));
    var uml = el("div", "umlauts");
    ["ä", "ö", "ü", "ß"].forEach(function (c) {
      var b = el("button", null, c); b.type = "button";
      b.addEventListener("click", function () { var inp = $("typeInput"); if (inp && !inp.disabled) { inp.value += c; inp.focus(); } });
      uml.appendChild(b);
    });
    card.appendChild(uml);
    var box = el("div", "typebox");
    var inp = document.createElement("input"); inp.type = "text"; inp.id = "typeInput"; inp.autocomplete = "off"; inp.setAttribute("autocapitalize", "off"); inp.setAttribute("spellcheck", "false"); inp.setAttribute("aria-label", "Antwort");
    var ok = el("button", "sec", "Prüfen"); ok.type = "button"; ok.id = "checkBtn";
    function doCheck() {
      if (session.answered) { return; }
      var val = inp.value.replace(/^\s+|\s+$/g, "");
      if (!val) { return; }
      var exact = val === it.w;
      var caseOnly = !exact && val.toLowerCase() === it.w.toLowerCase();
      inp.disabled = true; ok.disabled = true;
      answer(exact || caseOnly, val, caseOnly ? "Groß-/Kleinschreibung beachten: " + it.w : null);
    }
    ok.addEventListener("click", doCheck);
    inp.addEventListener("keydown", function (ev) { if (ev.key === "Enter") { ev.preventDefault(); doCheck(); } });
    box.appendChild(inp); box.appendChild(ok); card.appendChild(box);
  }

  function answer(ok, pickedText, extraNote) {
    if (!session || session.answered) { return; }
    var cur = session.current, it = cur.it;
    session.answered = true;
    session.results.push({ id: it.id, ok: ok, pick: pickedText, fmt: cur.fmt });
    var r = store.words[it.id] || { n: 0, c: 0, s: 0 };
    r.n += 1;
    if (ok) { r.c += 1; r.s += 1; if (r.box !== undefined && r.box < 2) { r.box += 1; } }
    else { r.s = 0; r.box = 0; }
    store.words[it.id] = r; save();

    var row = $("optRow");
    if (row) {
      var btns = row.getElementsByTagName("button");
      var correctVal = cur.fmt === "rule" ? it.cat : "c";
      for (var k = 0; k < btns.length; k++) {
        var v = btns[k].getAttribute("data-v");
        btns[k].disabled = true;
        if (v === correctVal) { btns[k].className = "right"; }
        else if (!ok && cur.fmt !== "rule" && btns[k].textContent.indexOf(pickedText) === 0 && v !== correctVal) { btns[k].className = "wrong"; }
        else if (!ok && cur.fmt === "rule" && btns[k].textContent.indexOf(pickedText) === 0) { btns[k].className = "wrong"; }
      }
    }
    var fb = $("fbBox"); clear(fb);
    var box = el("div", "fb " + (ok ? "ok" : "bad"));
    var big = el("div", "big");
    big.appendChild(document.createTextNode(ok ? "✓ Richtig: " : "✗ Richtig ist: "));
    big.appendChild(wordNode(it, "right"));
    box.appendChild(big);
    if (!ok && cur.fmt === "type") { var yours = el("div", "small"); yours.appendChild(document.createTextNode("Deine Antwort: ")); yours.appendChild(el("s", null, pickedText)); box.appendChild(yours); }
    if (!ok && cur.fmt === "choose") { var wr = el("div", "small"); wr.appendChild(document.createTextNode("Falsch wäre: ")); var s = el("s"); s.appendChild(wordNode(it, "wrong")); wr.appendChild(s); box.appendChild(wr); }
    if (extraNote) { box.appendChild(el("div", "small", extraNote)); }
    var m = meaning(it);
    if (m && cur.fmt !== "type") { var md = el("div", "small", m); if (meaningLang() === "ar") { md.setAttribute("dir", "rtl"); } box.appendChild(md); }
    if (!ok || cur.fmt === "rule") { box.appendChild(el("div", "hint", "Regel: " + it.exp)); }
    fb.appendChild(box);
    $("nextBtn").className = "main";
    if (ok && store.settings.auto && cur.fmt !== "rule") {
      autoTimer = setTimeout(function () { autoTimer = null; nextQuestion(); }, 1100);
    }
  }

  function nextQuestion() {
    if (!session || !session.answered) { return; }
    if (autoTimer) { clearTimeout(autoTimer); autoTimer = null; }
    session.pos += 1;
    renderPractice();
  }

  function renderEnd(v) {
    var total = session.results.length, right = 0, wrong = [];
    session.results.forEach(function (r) { if (r.ok) { right += 1; } else { wrong.push(r); } });
    var pct = total ? Math.round(100 * right / total) : 0;
    var p = el("div", "panel");
    p.appendChild(el("div", "score", right + " / " + total + " (" + pct + " %)"));
    var msg = pct === 100 ? "Alles richtig!" : (pct >= 80 ? "Sehr gut." : "Weiter üben – die Fehlerwörter kommen jetzt öfter dran.");
    var m = el("div", "small", msg); m.style.textAlign = "center"; p.appendChild(m);
    v.appendChild(p);
    if (wrong.length) {
      var pl = el("div", "panel"); pl.appendChild(el("h2", null, "Wiederholungsliste (" + wrong.length + ")"));
      var ul = el("ul", "rev");
      wrong.forEach(function (r) {
        var it = byId[r.id]; var li = el("li");
        var line = el("div", "w"); line.appendChild(wordNode(it, "right")); li.appendChild(line);
        var mm = meaning(it);
        var bits = [mm, it.base ? "Mehrzahl von " + it.base : ""].filter(function (x) { return x; }).join(" · ");
        if (bits) { var md = el("div", "pl", bits); if (meaningLang() === "ar" && mm) { md.setAttribute("dir", "rtl"); } li.appendChild(md); }
        li.appendChild(el("div", "pl", "Regel: " + it.exp));
        ul.appendChild(li);
      });
      pl.appendChild(ul); v.appendChild(pl);
    }
    var acts = el("div");
    if (wrong.length) {
      var rb = el("button", "main", "Fehlerwörter wiederholen (" + wrong.length + ")"); rb.type = "button";
      rb.addEventListener("click", function () {
        var ids = shuffle(wrong.map(function (r) { return r.id; }));
        startSession(ids.map(function (id) { return { id: id, fmt: formatFor(byId[id]) }; }), true);
      });
      acts.appendChild(rb);
    }
    var again = el("button", "sec", "Neue Runde"); again.type = "button"; again.style.marginTop = "10px"; again.style.width = "100%";
    again.addEventListener("click", function () { session = null; renderPractice(); });
    acts.appendChild(again); v.appendChild(acts);
  }

  /* ---------- Regeln & Wörter ---------- */
  var KIND_TEXT = {
    dk: "Nach einem kurzen, betonten Vokal wird der Konsonant verdoppelt: kommen, Mutter, Zimmer.",
    ck: "Statt kk schreibt man ck – nur nach kurzem, betontem Vokal: Stück, backen, Rucksack.",
    tz: "Statt zz schreibt man tz – nur nach kurzem Vokal: Platz, jetzt, putzen.",
    ek: "Nach langem Vokal oder Doppellaut (ei, au, eu, ie) steht nur ein Konsonant: Name, Käse, Spiele.",
    k:  "Nach einem Konsonanten steht k, nie ck: Bank, Schrank. Auch nach langem oder unbetontem Vokal: Paket, Apotheke.",
    z:  "Nach einem Konsonanten steht z, nie tz: Salz, tanzen, Arzt. Auch nach langem Vokal oder Doppellaut: Heizung.",
    zs: "Bei Zusammensetzungen behalten beide Wortteile ihren Buchstaben: Fahr + Rad = Fahrrad, aus + sehen = aussehen."
  };
  function renderList() {
    var v = $("viewList"); clear(v);
    var rules = el("div", "panel");
    var det = document.createElement("details"); det.open = true;
    det.appendChild(el("summary", null, "Die Regeln auf einen Blick"));
    var ul = el("ul", "rules");
    [
      "Kurzer Vokal → Doppelkonsonant: kom-men, Mut-ter, Zim-mer. Statt kk schreibt man ck, statt zz schreibt man tz.",
      "Langer Vokal oder Doppellaut (ei, au, eu, ie) → nur ein Konsonant: Na-me, Kä-se, Spie-le.",
      "Nach einem Konsonanten steht nie ck oder tz: Bank, Schrank, Salz, tanzen.",
      "Probe: Sprich das Wort langsam in Silben. Bei kommen hörst du das m am Ende der ersten Silbe (kom-) – der Vokal ist kurz.",
      "Probe: Verlängere das Wort: Platz → Plätze, Bus → Busse. Dann hörst du den Vokal und den Konsonanten besser.",
      "Zusammensetzungen: Fahr + Rad = Fahrrad (rr), aus + sehen = aussehen (ss).",
      "Hier nicht enthalten: ss oder ß (z. B. Straße, heißen, groß) – das ist ein eigenes Thema."
    ].forEach(function (t) { ul.appendChild(el("li", null, t)); });
    det.appendChild(ul); rules.appendChild(det); v.appendChild(rules);

    var p1 = el("div", "panel"); p1.appendChild(el("h2", null, "Lektionen")); lessonChips(p1, renderList); v.appendChild(p1);
    KINDS.forEach(function (k) {
      var items = ITEMS.filter(function (it) { return it.kind === k.id && store.settings.lessons[it.l - 1]; });
      if (!items.length) { return; }
      items.sort(function (a, b) { return a.w.localeCompare(b.w, "de"); });
      var p = el("div", "panel grp");
      p.appendChild(el("h3", null, k.label + " (" + items.length + ")"));
      p.appendChild(el("p", null, KIND_TEXT[k.id]));
      var w = el("div", "words");
      items.forEach(function (it) {
        var s = el("span"); s.appendChild(wordNode(it, "right")); s.appendChild(document.createTextNode(" ")); s.appendChild(el("small", null, "L" + it.l)); w.appendChild(s);
      });
      p.appendChild(w); v.appendChild(p);
    });
  }

  /* ---------- Fortschritt ---------- */
  function renderProg() {
    var v = $("viewProg"); clear(v);
    var seen = 0, sure = 0, tot = ITEMS.length;
    var perK = {}; KINDS.forEach(function (k) { perK[k.id] = { t: 0, s: 0, g: 0 }; });
    var hard = [];
    ITEMS.forEach(function (it) {
      var r = rec(it.id); perK[it.kind].t += 1;
      if (r && r.n > 0) {
        seen += 1;
        if (isSure(it.id)) { sure += 1; perK[it.kind].s += 1; } else { perK[it.kind].g += 1; }
        if (r.n - r.c > 0) { hard.push({ it: it, wrong: r.n - r.c, all: r.n }); }
      }
    });
    var p = el("div", "panel"); p.appendChild(el("h2", null, "Gesamt"));
    p.appendChild(el("div", null, sure + " von " + tot + " Wörtern sicher · " + seen + " schon geübt"));
    var rb = el("div", "rowbar"); rb.style.marginTop = "8px";
    var s1 = el("i", "seg-s"); s1.style.width = (100 * sure / tot) + "%";
    var s2 = el("i", "seg-g"); s2.style.width = (100 * (seen - sure) / tot) + "%";
    rb.appendChild(s1); rb.appendChild(s2); p.appendChild(rb);
    p.appendChild(el("div", "small", "„sicher“ = zuletzt mindestens zweimal hintereinander richtig. Grün: sicher · Gelb: geübt, aber noch nicht sicher."));
    v.appendChild(p);

    var p2 = el("div", "panel"); p2.appendChild(el("h2", null, "Nach Thema"));
    var tb = el("table", "prog");
    KINDS.forEach(function (k) {
      var d = perK[k.id]; var tr = el("tr");
      tr.appendChild(el("td", "n", k.label));
      var tdb = el("td"); var bb = el("div", "rowbar");
      var a1 = el("i", "seg-s"); a1.style.width = (100 * d.s / d.t) + "%";
      var a2 = el("i", "seg-g"); a2.style.width = (100 * d.g / d.t) + "%";
      bb.appendChild(a1); bb.appendChild(a2); tdb.appendChild(bb); tr.appendChild(tdb);
      tr.appendChild(el("td", "c", d.s + " / " + d.t + " sicher")); tb.appendChild(tr);
    });
    p2.appendChild(tb); v.appendChild(p2);

    var p3 = el("div", "panel"); p3.appendChild(el("h2", null, "Schwierigste Wörter"));
    hard.sort(function (a, b) { return b.wrong - a.wrong || b.all - a.all; });
    if (!hard.length) { p3.appendChild(el("div", "small", "Noch keine Fehler – oder noch nichts geübt.")); }
    else {
      var ul = el("ul", "rev");
      hard.slice(0, 10).forEach(function (h) {
        var li = el("li"); var line = el("div", "w"); line.appendChild(wordNode(h.it, "right")); li.appendChild(line);
        li.appendChild(el("div", "pl", h.wrong + " von " + h.all + " falsch")); ul.appendChild(li);
      });
      p3.appendChild(ul);
    }
    v.appendChild(p3);
    var p4 = el("div", "panel");
    var rs = el("button", "sec", "Fortschritt zurücksetzen"); rs.type = "button";
    rs.addEventListener("click", function () {
      if (window.confirm("Gesamten Fortschritt löschen? Das kann nicht rückgängig gemacht werden.")) { store.words = {}; save(); renderProg(); }
    });
    p4.appendChild(rs); v.appendChild(p4);
  }

  /* ---------- Tabs & Tastatur ---------- */
  var tab = "practice";
  function showTab(t) {
    tab = t;
    $("viewPractice").className = t === "practice" ? "" : "hidden";
    $("viewList").className = t === "list" ? "" : "hidden";
    $("viewProg").className = t === "prog" ? "" : "hidden";
    $("tabPractice").className = "tab" + (t === "practice" ? " on" : "");
    $("tabList").className = "tab" + (t === "list" ? " on" : "");
    $("tabProg").className = "tab" + (t === "prog" ? " on" : "");
    if (t === "practice") { renderPractice(); } else if (t === "list") { renderList(); } else { renderProg(); }
  }
  function init() {
    load();
    $("tabPractice").addEventListener("click", function () { showTab("practice"); });
    $("tabList").addEventListener("click", function () { showTab("list"); });
    $("tabProg").addEventListener("click", function () { showTab("prog"); });
    document.addEventListener("keydown", function (ev) {
      if (tab !== "practice" || !session || session.pos >= session.queue.length) { return; }
      var tag = ev.target && ev.target.tagName;
      var fmt = session.current ? session.current.fmt : "";
      if (tag === "INPUT" || tag === "SELECT") {
        if (tag === "INPUT" && ev.target.id === "typeInput" && session.answered && ev.key === "Enter") { ev.preventDefault(); nextQuestion(); }
        return;
      }
      if (!session.answered) {
        var row = $("optRow");
        if (row && (ev.key === "1" || ev.key === "2" || ev.key === "3")) {
          var b = row.getElementsByTagName("button")[parseInt(ev.key, 10) - 1];
          if (b) { b.click(); }
        }
      } else if ((ev.key === "Enter" || ev.key === " ") && tag !== "BUTTON") { ev.preventDefault(); nextQuestion(); }
    });
    if (window.speechSynthesis) {
      try { window.speechSynthesis.onvoiceschanged = function () { /* Stimmen geladen; Knopf erscheint ab der nächsten Frage */ }; } catch (e) { /* egal */ }
    }
    showTab("practice");
  }
  init();
})();
</script>
</body>
</html>
