  C('Welche Frage passt zu den Sätzen?',['Wo?','Wer?','Wie?'],'Wo ist der Bus? An der Haltestelle.'),
  C('Was steht nach <span class="v">bin / ist / sind</span>?',['ein Ort (in, an, auf, hier, zu Hause …)','ein Beruf','ein Name'])
 ],
 rule:{f:['sein + Ort'],de:'Mit <b>sein</b> sagst du, <b>wo</b> jemand oder etwas ist. Danach steht ein Ort: <i>in, an, auf, bei, hier, da, zu Hause …</i>',ex:['Ich [[bin]] {{in Jena}}.','Der Bahnhof [[ist]] {{hier}}.','Wo [[ist]] {{die Schule}}?'],
  tr:{
   en:'With <i>sein</i> you say where someone or something is: <i>sein</i> + place (<i>in, an, auf, hier, da, zu Hause</i>).',
   pl:'Za pomocą <i>sein</i> mówimy, gdzie ktoś lub coś jest: <i>sein</i> + miejsce (<i>in, an, auf, hier, da, zu Hause</i>).',
   tr:'<i>sein</i> ile birinin ya da bir şeyin nerede olduğunu söyleriz: <i>sein</i> + yer (<i>in, an, auf, hier, da, zu Hause</i>).',
   ar:'نستخدم <i>sein</i> لنقول أين يوجد شخص أو شيء: <i>sein</i> + المكان (<i>in, an, auf, hier, da, zu Hause</i>).',
   ru:'С глаголом <i>sein</i> мы говорим, где находится человек или предмет: <i>sein</i> + место (<i>in, an, auf, hier, da, zu Hause</i>).',
   ku:'Bi <i>sein</i> em dibêjin kes an tişt li ku ye: <i>sein</i> + cih (<i>in, an, auf, hier, da, zu Hause</i>).',
   uk:'За допомогою <i>sein</i> ми говоримо, де є людина або предмет: <i>sein</i> + місце (<i>in, an, auf, hier, da, zu Hause</i>).'}},
 ex:[g('Ich ___ in Jena.','bin'),g('Das Buch ___ auf dem Tisch.','ist'),g('Wo ___ du jetzt?','bist'),g('Wir ___ zu Hause.','sind'),g('Die Lehrerin ___ im Kursraum.','ist'),g('Ihr ___ im Park.','seid'),g('Wo ___ der Bahnhof?','ist')]},

{title:'sein: Beruf',tag:'sein',ph:'Präsens',
 observe:['Ich [[bin]] {{Lehrerin}}.','Mein Vater [[ist]] {{Arzt}}.','Wir [[sind]] {{Studenten}}.','Frau Yilmaz [[ist]] {{Krankenschwester}}.','Du [[bist]] {{Fahrer}}.'],
 tasks:[
  C('Welche Frage passt zu den Sätzen?',['Was sind Sie von Beruf?','Wo sind Sie?','Wie alt sind Sie?']),
  C('Steht vor dem Beruf ein Artikel (ein / eine)?',['Nein. Der Beruf steht ohne Artikel.','Ja. Immer ein / eine.','Ja. Nur bei Frauen: eine.'],'Lies noch einmal: „Ich bin Lehrerin.“ Steht dort „eine“?')
 ],
 rule:{f:['sein + Beruf (ohne Artikel!)'],de:'Mit <b>sein</b> sagst du den Beruf. Vor dem Beruf steht <b>kein</b> Artikel: <i>Ich bin Lehrer.</i> (nicht: <i>Ich bin ein Lehrer.</i>) <b>sein</b> darf nie fehlen!',ex:['Ich [[bin]] {{Lehrer}}.','Sie [[ist]] {{Bäckerin}}.','Was [[sind]] Sie von Beruf?'],
  tr:{
   en:'With <i>sein</i> you say someone’s job: <i>sein</i> + job. No article before the job: <i>Ich bin Lehrer.</i> (not: <i>Ich bin ein Lehrer.</i>)',
   pl:'Za pomocą <i>sein</i> podajemy zawód: <i>sein</i> + zawód. Przed zawodem nie ma rodzajnika: <i>Ich bin Lehrer.</i> (nie: <i>Ich bin ein Lehrer.</i>)',
   tr:'<i>sein</i> ile meslek söylenir: <i>sein</i> + meslek. Mesleğin önünde artikel (ein/eine) yoktur: <i>Ich bin Lehrer.</i> (<i>Ich bin ein Lehrer.</i> değil.) Dikkat: Türkçede “öğretmenim” gibi bir ek kullanılır; Almancada ise <i>sein</i> ayrı bir sözcüktür ve her zaman gerekir.',
   ar:'نستخدم <i>sein</i> للتعبير عن المهنة: <i>sein</i> + المهنة. لا نضع أداة (ein / eine) قبل المهنة: <i>Ich bin Lehrer.</i> (وليس: <i>Ich bin ein Lehrer.</i>) تنبيه: في العربية لا نستخدم فعلًا في مثل هذه الجمل («أنا معلّم»)، أمّا في الألمانية فلا بدّ دائمًا من <i>sein</i>.',
   ru:'С <i>sein</i> называют профессию: <i>sein</i> + профессия. Перед профессией нет артикля: <i>Ich bin Lehrer.</i> (не: <i>Ich bin ein Lehrer.</i>) Внимание: по-русски в настоящем времени глагола «быть» нет («Я учитель»). По-немецки <i>sein</i> нужен всегда.',
   ku:'Bi <i>sein</i> pîşe tê gotin: <i>sein</i> + pîşe. Beriya pîşeyê artîkel (ein / eine) nayê: <i>Ich bin Lehrer.</i> (ne: <i>Ich bin ein Lehrer.</i>)',
   uk:'За допомогою <i>sein</i> називають професію: <i>sein</i> + професія. Перед професією немає артикля: <i>Ich bin Lehrer.</i> (не: <i>Ich bin ein Lehrer.</i>) Увага: українською в теперішньому часі дієслова «бути» зазвичай немає («Я вчитель»). Німецькою <i>sein</i> потрібен завжди.'}},
 ex:[p('Welcher Satz ist richtig?',['Ich bin Ärztin.','Ich bin eine Ärztin.'],'Ich bin Ärztin.'),p('Welcher Satz ist richtig?',['Er ist ein Koch.','Er ist Koch.'],'Er ist Koch.'),g('Ich ___ Studentin.','bin'),g('Sie ___ Bäckerin.','ist'),g('Wir ___ Lehrer.','sind'),g('Was ___ du von Beruf?','bist'),g('Ihr ___ Ingenieure.','seid')]},

{title:'sein: Wie?',tag:'sein',ph:'Präsens',
 observe:['Ich [[bin]] {{müde}}.','Das Wetter [[ist]] {{schön}}.','Der Tee [[ist]] {{heiß}}.','Die Getränke [[sind]] {{heiß}}.','Die Wohnung [[ist]] {{groß}}.','Wir [[sind]] {{krank}}.','Die Kinder [[sind]] {{glücklich}}.'],
 tasks:[
  C('Welche Frage passt zu den Sätzen?',['Wie?','Wer?','Woher?']),
  C('Was steht nach <span class="v">bin / ist / sind</span>?',['ein Adjektiv (müde, schön, heiß)','ein Name','ein Ort mit „in“']),
  C('Wie ändert sich das Adjektiv bei <b>ist</b> und <b>sind</b>?',['Gar nicht: Der Tee ist heiß. Die Getränke sind heiß.','Es bekommt immer ein -e: heiße.','Es bekommt immer -en: heißen.'],'Vergleiche: „Der Tee ist heiß.“ und „Die Getränke sind heiß.“')
 ],
 rule:{f:['sein + Adjektiv'],de:'Mit <b>sein</b> sagst du, <b>wie</b> jemand oder etwas ist (auch: wie man sich fühlt). Das Adjektiv ändert sich nicht.',ex:['Ich [[bin]] {{müde}}.','Der Kaffee [[ist]] {{heiß}}.','Die Kinder [[sind]] {{klein}}.'],
  tr:{
   en:'With <i>sein</i> you say what someone or something is like (or how someone feels): <i>sein</i> + adjective. The adjective does not change: <i>Der Tee ist heiß. Die Getränke sind heiß.</i>',
   pl:'Za pomocą <i>sein</i> mówimy, jaki ktoś lub coś jest (albo jak się czuje): <i>sein</i> + przymiotnik. Przymiotnik się nie zmienia: <i>Der Tee ist heiß. Die Getränke sind heiß.</i>',
   tr:'<i>sein</i> ile birinin ya da bir şeyin nasıl olduğu (ya da nasıl hissettiği) söylenir: <i>sein</i> + sıfat. Sıfat değişmez: <i>Der Tee ist heiß. Die Getränke sind heiß.</i>',
   ar:'نستخدم <i>sein</i> لوصف شخص أو شيء أو حالته: <i>sein</i> + صفة. الصفة لا تتغيّر: <i>Der Tee ist heiß. Die Getränke sind heiß.</i>',
   ru:'С <i>sein</i> говорят, какой человек или предмет (или как человек себя чувствует): <i>sein</i> + прилагательное. Прилагательное не изменяется: <i>Der Tee ist heiß. Die Getränke sind heiß.</i>',
   ku:'Bi <i>sein</i> em dibêjin kes an tişt çawa ye (an kes çawa hîs dike): <i>sein</i> + rengdêr. Rengdêr nayê guhertin: <i>Der Tee ist heiß. Die Getränke sind heiß.</i>',
   uk:'За допомогою <i>sein</i> ми говоримо, який хтось або щось є (чи як почувається): <i>sein</i> + прикметник. Прикметник не змінюється: <i>Der Tee ist heiß. Die Getränke sind heiß.</i>'}},
 ex:[g('Ich ___ müde.','bin'),g('Die Suppe ___ heiß.','ist'),g('Wir ___ glücklich.','sind'),g('Du ___ krank.','bist'),g('Das Auto ___ neu.','ist'),g('Ihr ___ fleißig.','seid'),g('Die Kinder ___ klein.','sind')]},

{title:'sein: Wie alt?',tag:'sein',ph:'Präsens',
 observe:['Ich [[bin]] {{25}} Jahre alt.','Meine Tochter [[ist]] {{5}}.','Wir [[sind]] {{30}} Jahre alt.','Wie alt [[bist]] du?','Ich [[bin]] {{40}}.','Mein Vater [[ist]] {{62}} Jahre alt.'],
 tasks:[
  C('Welche Frage passt zu den Sätzen?',['Wie alt?','Wie viel?','Wie lange?']),
  C('Welches Verb steht in den Sätzen?',['sein (bin, bist, ist, sind)','haben (habe, hast, hat, haben)'],'Schau auf die gelben Wörter: bin, ist, bist …')
 ],
 rule:{f:['sein + Zahl (+ Jahre alt)'],de:'Das Alter sagst du mit <b>sein</b> – nie mit <i>haben</i>! <i>Ich bin 25 Jahre alt.</i> (nicht: <i>Ich habe 25 Jahre.</i>)',ex:['Ich [[bin]] {{25}} Jahre alt.','Wie alt [[ist]] {{deine Tochter}}?','Sie [[ist]] {{5}}.'],
  tr:{
   en:'You say your age with <i>sein</i>: <i>sein</i> + number (+ <i>Jahre alt</i>). Never with <i>haben</i>! <i>Ich bin 25 Jahre alt.</i> (not: <i>Ich habe 25 Jahre.</i>) In German you “are” a certain age, you do not “have” years.',
   pl:'Wiek podajemy z <i>sein</i>: <i>sein</i> + liczba (+ <i>Jahre alt</i>). Nigdy z <i>haben</i>! Uwaga: po polsku mówimy „mam 25 lat”, ale po niemiecku: <i>Ich bin 25 Jahre alt.</i>',
   tr:'Yaş <i>sein</i> ile söylenir: <i>sein</i> + sayı (+ <i>Jahre alt</i>). <i>haben</i> ile asla! Türkçedeki “25 yaşındayım” gibi Almancada da <i>sein</i> kullanılır: <i>Ich bin 25 Jahre alt.</i>',
   ar:'نذكر العمر بـ <i>sein</i>: <i>sein</i> + رقم (+ <i>Jahre alt</i>). وليس بـ <i>haben</i> أبدًا! تنبيه: بالعربية نقول «عمري 25 سنة»، وبالألمانية: <i>Ich bin 25 Jahre alt.</i> (وليس: <i>Ich habe 25 Jahre.</i>)',
   ru:'Возраст выражают с <i>sein</i>: <i>sein</i> + число (+ <i>Jahre alt</i>). Никогда с <i>haben</i>! Обратите внимание: по-русски «мне 25 лет», а по-немецки: <i>Ich bin 25 Jahre alt.</i>',
   ku:'Temen bi <i>sein</i> tê gotin: <i>sein</i> + hejmar (+ <i>Jahre alt</i>). Qet bi <i>haben</i> nayê gotin! Bala xwe bide: bi kurmancî dibêjin «ez 25 salî me», bi almanî jî <i>sein</i> tê bikaranîn: <i>Ich bin 25 Jahre alt.</i>',
   uk:'Вік виражають із <i>sein</i>: <i>sein</i> + число (+ <i>Jahre alt</i>). Ніколи з <i>haben</i>! Зверніть увагу: українською «мені 25 років», а німецькою: <i>Ich bin 25 Jahre alt.</i>'}},
 ex:[p('Ich ___ 30 Jahre alt.',['bin','habe'],'bin'),p('Mein Bruder ___ 12.',['ist','hat'],'ist'),g('Wie alt ___ du?','bist'),g('Wir ___ 20 Jahre alt.','sind'),p('Meine Tochter ___ 8 Jahre alt.',['ist','hat'],'ist'),p('Welcher Satz ist richtig?',['Ich bin 25 Jahre alt.','Ich habe 25 Jahre alt.'],'Ich bin 25 Jahre alt.'),g('Mein Opa ___ 80 Jahre alt.','ist')]},

{title:'haben: etwas besitzen',tag:'haben',ph:'Präsens',
 observe:['Ich [[habe]] {{ein Handy}} ((das Handy)).','Du [[hast]] {{einen Computer}} ((der Computer)).','Sie [[hat]] {{eine Katze}} ((die Katze)).','Wir [[haben]] {{ein Auto}} ((das Auto)).','Er [[hat]] {{einen Hund}} ((der Hund)).','Ihr [[habt]] {{eine Wohnung}} ((die Wohnung)).'],
 tasks:[
  C('Was sagen die Sätze?',['Was jemand hat (besitzt): Dinge, Tiere.','Wo jemand ist.','Wie jemand ist.']),
  C('Was steht nach <span class="v">habe / hast / hat / haben</span>?',['ein Nomen mit Artikel (ein Handy, eine Katze)','ein Adjektiv','ein Ort']),
  C('Bei welchen Nomen steht <b>einen</b>?',['bei Computer und Hund (der-Wörter)','bei Handy und Auto (das-Wörter)','bei Katze und Wohnung (die-Wörter)'],'Schau auf die grauen Wörter in Klammern: der, das, die.')
 ],
 rule:{f:['haben + ein / eine / einen + Nomen'],de:'Mit <b>haben</b> sagst du, <b>was</b> jemand hat (Dinge, Tiere). Danach steht ein Nomen mit Artikel. Bei <b>der</b>-Wörtern: <b>einen</b>!',ex:['Ich [[habe]] {{ein Handy}}.','Er [[hat]] {{einen Computer}}.','Wir [[haben]] {{eine Katze}}.'],
  tr:{
   en:'With <i>haben</i> you say what someone has (things, animals): <i>haben</i> + noun with article. Masculine (<i>der</i>) nouns: <i>einen</i>! <i>Ich habe einen Computer.</i>',
   pl:'Za pomocą <i>haben</i> mówimy, co ktoś ma (rzeczy, zwierzęta): <i>haben</i> + rzeczownik z rodzajnikiem. Rzeczowniki rodzaju męskiego (<i>der</i>): <i>einen</i>! <i>Ich habe einen Computer.</i>',
   tr:'<i>haben</i> ile birinin neyi olduğu (eşya, hayvan) söylenir: <i>haben</i> + artikelli isim. Eril (<i>der</i>) isimlerde: <i>einen</i>! <i>Ich habe einen Computer.</i>',
   ar:'نستخدم <i>haben</i> لنقول ماذا يملك الشخص (أشياء، حيوانات): <i>haben</i> + اسم مع أداة (Artikel). الأسماء المذكّرة (<i>der</i>): <i>einen</i>! <i>Ich habe einen Computer.</i>',
   ru:'С <i>haben</i> мы говорим, что у человека есть (вещи, животные): <i>haben</i> + существительное с артиклем. Мужской род (<i>der</i>): <i>einen</i>! <i>Ich habe einen Computer.</i>',
   ku:'Bi <i>haben</i> em dibêjin kesek çi heye (tişt, heywan): <i>haben</i> + navdêr bi artîkel. Navdêrên nêr (<i>der</i>): <i>einen</i>! <i>Ich habe einen Computer.</i>',
   uk:'За допомогою <i>haben</i> ми говоримо, що є в людини (речі, тварини): <i>haben</i> + іменник з артиклем. Чоловічий рід (<i>der</i>): <i>einen</i>! <i>Ich habe einen Computer.</i>'}},
 ex:[g('Ich ___ ein Fahrrad.','habe'),g('Du ___ ein Handy.','hast'),g('Er ___ einen Computer.','hat'),g('Wir ___ ein Auto.','haben'),g('Ihr ___ eine Katze.','habt'),g('Meine Eltern ___ ein Haus.','haben'),p('Ich habe ___ Tisch. (der Tisch)',['ein','eine','einen'],'einen'),p('Sie hat ___ Lampe. (die Lampe)',['ein','eine','einen'],'eine')]},

{title:'haben: Familie und Aussehen',tag:'haben',ph:'Präsens',
 observe:['Ich [[habe]] {{zwei Kinder}}.','Er [[hat]] {{einen Bruder}}.','Sie [[hat]] {{keine Schwester}}.','Wir [[haben]] {{eine Tochter}}.','Anna [[hat]] {{lange Haare}}.','Der Mann [[hat]] {{blaue Augen}}.'],
 tasks:[
  C('Welches Verb steht in den Sätzen?',['haben','sein']),
  C('Was steht nach dem Verb?',['ein Nomen (Kinder, Bruder, Haare, Augen)','ein Adjektiv allein (lang, blau)','ein Ort'],'Schau auf die blauen Wörter: zwei Kinder, einen Bruder …'),
  C('Welcher Satz ist richtig?',['Sie hat lange Haare.','Sie ist lange Haare.','Sie hat lang.'],'Haare ist ein Nomen. Man „hat“ Haare.')
 ],
 rule:{f:['haben + Familie','haben + Haare / Augen'],de:'Mit <b>haben</b> sagst du auch, welche <b>Familie</b> jemand hat und wie jemand <b>aussieht</b> (Haare, Augen). Aber: <i>Sie ist blond.</i> (Adjektiv → <b>sein</b>)',ex:['Ich [[habe]] {{zwei Kinder}}.','Sie [[hat]] {{lange Haare}}.','Aber: Sie [[ist]] {{blond}}.'],
  tr:{
   en:'With <i>haben</i> you also say what family someone has and what someone looks like (hair, eyes): <i>Ich habe zwei Kinder. Sie hat lange Haare.</i> But: <i>Sie ist blond.</i> (adjective: <i>sein</i>)',
   pl:'Za pomocą <i>haben</i> mówimy też o rodzinie (kto ma dzieci, rodzeństwo) i o wyglądzie (włosy, oczy): <i>Ich habe zwei Kinder. Sie hat lange Haare.</i> Ale: <i>Sie ist blond.</i> (przymiotnik: <i>sein</i>)',
   tr:'<i>haben</i> ile ailen (çocuk, kardeş) ve dış görünüş (saç, göz) de anlatılır: <i>Ich habe zwei Kinder. Sie hat lange Haare.</i> Ama: <i>Sie ist blond.</i> (sıfat: <i>sein</i>)',
   ar:'نستخدم <i>haben</i> أيضًا للحديث عن العائلة (أولاد، إخوة) وعن المظهر (الشعر، العينان): <i>Ich habe zwei Kinder. Sie hat lange Haare.</i> لكن: <i>Sie ist blond.</i> (صفة: <i>sein</i>)',
   ru:'С <i>haben</i> говорят также о семье (дети, братья и сёстры) и о внешности (волосы, глаза): <i>Ich habe zwei Kinder. Sie hat lange Haare.</i> Но: <i>Sie ist blond.</i> (прилагательное: <i>sein</i>)',
   ku:'Bi <i>haben</i> herwiha behsa malbatê (zarok, bira) û xuyabûnê (por, çav) dikin: <i>Ich habe zwei Kinder. Sie hat lange Haare.</i> Lê: <i>Sie ist blond.</i> (rengdêr: <i>sein</i>)',
   uk:'За допомогою <i>haben</i> говорять також про сім’ю (діти, брати й сестри) та зовнішність (волосся, очі): <i>Ich habe zwei Kinder. Sie hat lange Haare.</i> Але: <i>Sie ist blond.</i> (прикметник: <i>sein</i>)'}},
 ex:[g('Ich ___ einen Sohn.','habe'),g('Sie ___ zwei Brüder.','hat'),g('Wir ___ keine Kinder.','haben'),g('Du ___ braune Augen.','hast'),g('Die Frau ___ lange Haare.','hat'),g('Ihr ___ eine Schwester.','habt'),p('Welcher Satz ist richtig?',['Anna hat blonde Haare.','Anna ist blonde Haare.'],'Anna hat blonde Haare.')]},

{title:'haben: Hunger, Durst, Angst …',tag:'both',ph:'Präsens',
 observe:[
  {t:'Gruppe A',l:['Ich [[habe]] {{Hunger}}.','Du [[hast]] {{Durst}}.','Sie [[hat]] {{Angst}}.','Er [[hat]] {{Kopfschmerzen}}.']},
  {t:'Gruppe B',l:['Ich [[bin]] {{müde}}.','Du [[bist]] {{krank}}.','Sie [[ist]] {{glücklich}}.','Er [[ist]] {{fit}}.']}
 ],
 tasks:[
  {t:'sort',q:'Ich … + welches Wort? Ordne zu.',labels:['ich bin …','ich habe …'],hint:'Tipp: Nomen schreibt man groß (Hunger). Adjektive schreibt man klein (müde).',
   items:[['Hunger',1],['müde',0],['Durst',1],['krank',0],['Angst',1],['glücklich',0],['Kopfschmerzen',1],['fit',0],['Fieber',1],['traurig',0]]},
  C('Was ist der Unterschied?',['Hunger, Durst, Angst = Nomen → haben. müde, krank = Adjektive → sein.','Hunger, Durst, Angst = Adjektive → sein.','Es gibt keinen Unterschied.'],'Denk an die Großschreibung: Hunger (Nomen) – müde (Adjektiv).')
 ],
 rule:{f:['haben + Hunger / Durst / Angst / Schmerzen','sein + müde / krank / glücklich'],de:'<b>Hunger, Durst, Angst, Schmerzen</b> sind <b>Nomen</b> → <b>haben</b> + Nomen (ohne Artikel): <i>Ich habe Hunger.</i><br><b>müde, krank, glücklich</b> sind <b>Adjektive</b> → <b>sein</b>: <i>Ich bin müde.</i>',ex:['Ich [[habe]] {{Hunger}}.','Sie [[hat]] {{Kopfschmerzen}}.','Ich [[bin]] {{müde}}.'],
  tr:{
   en:'Hunger, Durst, Angst, Schmerzen are <b>nouns</b>: <i>haben</i> + noun, no article: <i>Ich habe Hunger.</i> müde, krank, glücklich are <b>adjectives</b>: <i>sein</i>. Careful: in English you say “I am hungry” (be + adjective). In German it is “I have hunger”!',
   pl:'Hunger, Durst, Angst, Schmerzen to <b>rzeczowniki</b>: <i>haben</i> + rzeczownik, bez rodzajnika: <i>Ich habe Hunger.</i> müde, krank, glücklich to <b>przymiotniki</b>: <i>sein</i>. Uwaga: po polsku mówimy „jestem głodny” (być + przymiotnik), a po niemiecku dosłownie „mam głód” (<i>haben</i> + rzeczownik)!',
   tr:'Hunger, Durst, Angst, Schmerzen <b>isimdir</b>: <i>haben</i> + isim, artikelsiz: <i>Ich habe Hunger.</i> müde, krank, glücklich <b>sıfattır</b>: <i>sein</i>. Dikkat: Türkçede “açım” (sıfat) dersin; Almancada kelimesi kelimesine “açlığım var” gibidir (<i>haben</i> + isim)!',
   ar:'الكلمات Hunger وDurst وAngst وSchmerzen هي <b>أسماء</b>: <i>haben</i> + اسم، بدون أداة: <i>Ich habe Hunger.</i> أمّا müde وkrank وglücklich فهي <b>صفات</b>: <i>sein</i>. تنبيه: بالعربية نقول «أنا جائع» (صفة)، وبالألمانية نقول حرفيًّا «عندي جوع» (<i>haben</i> + اسم)!',
   ru:'Hunger, Durst, Angst, Schmerzen — <b>существительные</b>: <i>haben</i> + существительное, без артикля: <i>Ich habe Hunger.</i> müde, krank, glücklich — <b>прилагательные</b>: <i>sein</i>. Внимание: по-русски «я голоден» (прилагательное), а по-немецки буквально «у меня голод» (<i>haben</i> + существительное)!',
   ku:'Hunger, Durst, Angst, Schmerzen <b>navdêr</b> in: <i>haben</i> + navdêr, bê artîkel: <i>Ich habe Hunger.</i> müde, krank, glücklich <b>rengdêr</b> in: <i>sein</i>. Bala xwe bide: bi kurmancî «ez birçî me» (rengdêr) tê gotin, lê bi almanî <i>haben</i> + navdêr (<i>Hunger</i>) tê bikaranîn!',
   uk:'Hunger, Durst, Angst, Schmerzen — <b>іменники</b>: <i>haben</i> + іменник, без артикля: <i>Ich habe Hunger.</i> müde, krank, glücklich — <b>прикметники</b>: <i>sein</i>. Увага: українською «я голодний» (прикметник), а німецькою буквально «у мене голод» (<i>haben</i> + іменник)!'}},

   items:[['heute',0],['gestern',1],['jetzt',0],['letzte Woche',1],['früher',1],['im Moment',0],['vor zwei Jahren',1],['gerade',0],['vorgestern',1],['letztes Jahr',1]]},

 rule:{f:['gestern, früher, vor … → war / hatte','heute, jetzt → bin / habe'],de:'Die <b>Regeln</b> bleiben gleich – nur die <b>Zeit</b> ist anders. Signalwörter für die Vergangenheit: <i>gestern, letzte Woche, früher, vor zwei Jahren</i> → <b>war / hatte</b>. Signalwörter für jetzt: <i>heute, jetzt, im Moment</i> → <b>bin / habe</b>.',ex:['Gestern [[war]] ich {{müde}}. (sein + Adjektiv)','Gestern [[hatte]] ich {{Hunger}}. (haben + Nomen)'],
  tr:{
   en:'Same rules as in the present — only the time is different. Words like <i>gestern, letzte Woche, früher, vor zwei Jahren</i> (yesterday, last week, earlier, two years ago) → <i>war / hatte</i>. Words like <i>heute, jetzt, im Moment</i> (today, now, at the moment) → <i>bin / habe</i>. About the past, with <i>sein</i> and <i>haben</i> you mostly say <i>war</i> and <i>hatte</i>.',
   pl:'Zasady są takie same jak w czasie teraźniejszym — zmienia się tylko czas. Słowa takie jak <i>gestern, letzte Woche, früher, vor zwei Jahren</i> (wczoraj, w zeszłym tygodniu, dawniej, dwa lata temu) → <i>war / hatte</i>. Słowa takie jak <i>heute, jetzt, im Moment</i> (dziś, teraz, w tej chwili) → <i>bin / habe</i>. O przeszłości z <i>sein</i> i <i>haben</i> mówi się najczęściej <i>war</i> i <i>hatte</i>.',
   tr:'Kurallar şimdiki zamanla aynıdır — sadece zaman farklıdır. <i>gestern, letzte Woche, früher, vor zwei Jahren</i> (dün, geçen hafta, eskiden, iki yıl önce) gibi sözcükler → <i>war / hatte</i>. <i>heute, jetzt, im Moment</i> (bugün, şimdi, şu anda) gibi sözcükler → <i>bin / habe</i>. Geçmişten bahsederken <i>sein</i> ve <i>haben</i> için çoğunlukla <i>war</i> ve <i>hatte</i> kullanılır.',
   ar:'القواعد نفسها كما في المضارع، والفرق في الزمن فقط. كلمات مثل <i>gestern, letzte Woche, früher, vor zwei Jahren</i> (أمس، الأسبوع الماضي، سابقًا، قبل سنتين) ← <i>war / hatte</i>. وكلمات مثل <i>heute, jetzt, im Moment</i> (اليوم، الآن، في هذه اللحظة) ← <i>bin / habe</i>. مع <i>sein</i> و<i>haben</i> نقول في الغالب <i>war</i> و<i>hatte</i> عن الماضي.',
   ru:'Правила те же, что и в настоящем времени — меняется только время. Слова <i>gestern, letzte Woche, früher, vor zwei Jahren</i> (вчера, на прошлой неделе, раньше, два года назад) → <i>war / hatte</i>. Слова <i>heute, jetzt, im Moment</i> (сегодня, сейчас, в данный момент) → <i>bin / habe</i>. О прошлом с <i>sein</i> и <i>haben</i> чаще всего говорят <i>war</i> и <i>hatte</i>.',
   ku:'Rêgez ew in ku di dema niha de ne — tenê dem cuda ye. Peyvên wekî <i>gestern, letzte Woche, früher, vor zwei Jahren</i> (duh, hefteya borî, berê, du sal berê) → <i>war / hatte</i>. Peyvên wekî <i>heute, jetzt, im Moment</i> (îro, niha, vê gavê) → <i>bin / habe</i>. Ji bo borî bi <i>sein</i> û <i>haben</i> piranî <i>war</i> û <i>hatte</i> tê gotin.',
   uk:'Правила ті самі, що й у теперішньому часі — змінюється лише час. Слова <i>gestern, letzte Woche, früher, vor zwei Jahren</i> (вчора, минулого тижня, раніше, два роки тому) → <i>war / hatte</i>. Слова <i>heute, jetzt, im Moment</i> (сьогодні, зараз, наразі) → <i>bin / habe</i>. Про минуле з <i>sein</i> і <i>haben</i> здебільшого кажуть <i>war</i> і <i>hatte</i>.'}},
 ex:[g('Gestern ___ ich in Jena.','war'),g('Heute ___ ich in Erfurt.','bin'),g('Letzte Woche ___ wir Unterricht.','hatten'),g('Jetzt ___ du Zeit.','hast'),g('Vor zwei Jahren ___ Olena noch in Kyiv.','war'),g('Früher ___ er ein Fahrrad.','hatte'),g('Im Moment ___ die Kinder im Park.','sind'),g('Gestern ___ ihr krank.','wart'),g('Heute ___ wir Hunger.','haben'),g('Letztes Jahr ___ Frau Yilmaz 29 Jahre alt.','war')]},

/* ---------- Übersetzungen der Entdecke-Fragen und Antwortmöglichkeiten ----------
   Je Aufgabe: Sprache → [Frage, Antwort 1, Antwort 2, …] in der Reihenfolge von t.o (richtige Antwort zuerst).

var TRREG=[];
function trq(t,i){
  if(!t.tr){return '';}
  TRREG.push({t:t,i:i});
  return '<span class="tr tro" data-q="'+(TRREG.length-1)+'" hidden></span>';
}

/* ---------- Zustand ---------- */
var state={cur:0,lang:sget('lang')||'',done:sget('done')||{}};
var panels=[];

/* ---------- Übersetzungen ein-/ausblenden ---------- */
function updateTr(){
  var list=$$('.tr'),i,e,txt,k,idx;
  for(i=0;i<list.length;i++){
    e=list[i];txt='';
    if(state.lang){
      idx=LK.indexOf(state.lang);
      if(e.getAttribute('data-u')){
        k=UI[e.getAttribute('data-u')];
        txt=k?k.t[idx]:'';
      }else if(e.getAttribute('data-q')!==null){
        k=TRREG[parseInt(e.getAttribute('data-q'),10)];
        txt=(k&&k.t.tr&&k.t.tr[state.lang]&&k.t.tr[state.lang][k.i])?k.t.tr[state.lang][k.i]:'';
      }else if(e.getAttribute('data-r')!==null&&e.getAttribute('data-r')!==''){
        k=STEPS[parseInt(e.getAttribute('data-r'),10)].rule;
        txt=(k&&k.tr&&k.tr[state.lang])?k.tr[state.lang]:'';
      }
    }
    e.innerHTML=txt;
    e.hidden=!txt;
    e.setAttribute('lang',state.lang||'de');
    e.setAttribute('dir',RTL[state.lang]?'rtl':'ltr');
  }
}
function tri(key,cls){return '<span class="tr '+(cls||'')+'" data-u="'+key+'" hidden></span>';}
function sh(n,key){return '<h3 class="sh"><span class="num">'+n+'</span><span>'+UI[key].de+'</span> '+tri(key)+'</h3>';}

/* ---------- Beobachte ---------- */
function observeEl(S){
  var w=el('div','sec');
  w.innerHTML=sh(1,'h_observe')+'<div class="instr">'+UI.i_observe.de+'</div><div class="tr tb" data-u="i_observe" hidden></div>';
  var groups=(typeof S.observe[0]==='string')?[{t:null,l:S.observe}]:S.observe;
  var gi,li,gdiv,h;
  for(gi=0;gi<groups.length;gi++){
    gdiv=el('div','group');
    if(groups[gi].t){h=el('h4',null,groups[gi].t);gdiv.appendChild(h);}
    for(li=0;li<groups[gi].l.length;li++){gdiv.appendChild(el('div','line',mk(groups[gi].l[li])));}
    w.appendChild(gdiv);
  }
  return w;
}

/* ---------- Entdecke: Aufgabentypen ---------- */
function choiceTask(t,done){
  var w=el('div','task');
  w.appendChild(el('div','tq',t.q+' '+tri('i_choice')+trq(t,0)));
  var opts=[],i;
  for(i=0;i<t.o.length;i++){opts.push({x:t.o[i],c:i===0,i:i+1});}
  opts=shuffle(opts);
  var box=el('div','opts'),msg=el('div','msg'),btns=[];
  function lockAll(){var k;for(k=0;k<btns.length;k++){btns[k].disabled=true;}}
  function make(o){
    var b=el('button','opt',mk(o.x)+trq(t,o.i));b.type='button';
    b.onclick=function(){
      if(o.c){
        b.className='opt good';lockAll();
        msg.className='msg good';msg.innerHTML='✓ '+UI.m_ok.de+' '+tri('m_ok');updateTr();
        done();
      }else{
        b.className='opt bad shake';b.disabled=true;
        msg.className='msg bad';msg.innerHTML=(t.hint||'')+' '+tri('m_no');updateTr();
      }
    };
    btns.push(b);box.appendChild(b);
  }
  for(i=0;i<opts.length;i++){make(opts[i]);}
  w.appendChild(box);w.appendChild(msg);
  return w;
}
function sortTask(t,done){
  var w=el('div','task');
  w.appendChild(el('div','tq',t.q+' '+tri('i_sort')));
  var left=t.items.length,msg=el('div','msg'),i;
  function row(item){
    var r=el('div','srow'),sw=el('span','sw',item[0]),bs=[],j;
    r.appendChild(sw);
    function mkb(j){
      var b=el('button','sb',t.labels[j]);b.type='button';
      b.onclick=function(){
        var k;
        if(j===item[1]){
          b.className='sb good';
          for(k=0;k<bs.length;k++){bs[k].disabled=true;}
          left--;
          if(left===0){msg.className='msg good';msg.innerHTML='✓ '+UI.m_ok.de+' '+tri('m_ok');updateTr();done();}
        }else{
          b.className='sb bad shake';b.disabled=true;
          msg.className='msg bad';msg.textContent=t.hint||'';
        }
      };
      bs.push(b);r.appendChild(b);
    }
    for(j=0;j<t.labels.length;j++){mkb(j);}
    return r;
  }
  for(i=0;i<t.items.length;i++){w.appendChild(row(t.items[i]));}
  w.appendChild(msg);
  return w;
}
function tableTask(t,done){
  var w=el('div','task');
  w.appendChild(el('div','tq',UI.i_table.de+' '+tri('i_table')));
  var tb=el('table','tbl'),tr,th,td,inp,cells=[],r,c;
  tr=el('tr');
  for(c=0;c<t.head.length;c++){th=el('th',null,t.head[c]);tr.appendChild(th);}
  tb.appendChild(tr);
  for(r=0;r<t.rows.length;r++){
    tr=el('tr');
    td=el('td','lab',t.rows[r][0]);tr.appendChild(td);
    for(c=1;c<t.rows[r].length;c++){
      td=el('td');inp=el('input','in');inp.type='text';
      inp.setAttribute('autocomplete','off');inp.setAttribute('autocapitalize','none');
      inp.setAttribute('autocorrect','off');inp.setAttribute('spellcheck','false');
      td.appendChild(inp);tr.appendChild(td);
      cells.push({inp:inp,a:t.rows[r][c]});
    }
    tb.appendChild(tr);
  }
  w.appendChild(tb);
  var btn=el('button','btn primary',UI.b_check.de+' '+tri('b_check'));btn.type='button';
  var msg=el('div','msg');
  btn.onclick=function(){
    var ok=0,k,good;
    for(k=0;k<cells.length;k++){
      good=norm(cells[k].inp.value)===norm(cells[k].a);
      cells[k].inp.className='in '+(good?'good':'bad');
      if(good){ok++;}
    }
    if(ok===cells.length){
      msg.className='msg good';msg.innerHTML='✓ '+UI.m_ok.de+' '+tri('m_ok');updateTr();
      btn.disabled=true;done();
    }else{
      msg.className='msg bad';msg.innerHTML=ok+' / '+cells.length+' – '+(t.hint||'')+' '+tri('m_no');updateTr();
    }
  };
  w.appendChild(btn);w.appendChild(msg);
  return w;
}
function tasksEl(S,onAll){
  var w=el('div','sec');
  w.innerHTML=sh(2,'h_discover');
  var list=S.tasks,nodes=[],idx=0,i,n;
  function next(){
    idx++;
    if(idx<list.length){nodes[idx].hidden=false;scrollToEl(nodes[idx]);}
    else{onAll();}
  }
  for(i=0;i<list.length;i++){
    if(list[i].t==='choice'){n=choiceTask(list[i],next);}
    else if(list[i].t==='sort'){n=sortTask(list[i],next);}
    else{n=tableTask(list[i],next);}
    n.hidden=(i>0);nodes.push(n);w.appendChild(n);
  }
  return w;
}

/* ---------- Regel ---------- */
function tableHtml(T){
  var h='<table class="tbl"><tr>',i,j;
  for(i=0;i<T.head.length;i++){h+='<th>'+T.head[i]+'</th>';}
  h+='</tr>';
  for(i=0;i<T.rows.length;i++){
    h+='<tr><td class="lab">'+T.rows[i][0]+'</td>';
    for(j=1;j<T.rows[i].length;j++){h+='<td>'+T.rows[i][j]+'</td>';}
    h+='</tr>';
  }
  return h+'</table>';
}
function ruleEl(S,i){
  var R=S.rule,w=el('div','sec'),h='',k,cls;
  h+=sh(3,'h_rule')+'<div class="rule">';
  if(R.f&&R.f.length){
    h+='<div class="fms">';
    for(k=0;k<R.f.length;k++){
      cls=R.f[k].indexOf('sein')===0?'sein':(R.f[k].indexOf('haben')===0?'haben':'');
      h+='<span class="fm '+cls+'">'+R.f[k]+'</span>';
    }
    h+='</div>';
  }
  h+='<div>'+R.de+'</div>';
  if(R.table){h+=tableHtml(R.table);}
  if(R.ex&&R.ex.length){
    h+='<ul class="exs">';
    for(k=0;k<R.ex.length;k++){h+='<li>'+mk(R.ex[k])+'</li>';}
    h+='</ul>';
  }
  h+='<div class="tr trbox" data-r="'+i+'" hidden></div></div>';
  w.innerHTML=h;
  return w;
}

/* ---------- Übung ---------- */
function exEl(S,i,onChecked){
  var w=el('div','sec'),items=[],usedSol=false;
  w.innerHTML=sh(4,'h_ex')+'<div class="instr">'+UI.i_ex.de+'</div><div class="tr tb" data-u="i_ex" hidden></div>';
  var list=el('div','exlist');
  function build(it,n){
    var row=el('div','item'),body=el('div','ib'),obj={row:row},inp,sel=null,mark=el('span','mk'),sol=el('span','sol'),parts,q,bx,k,b;
    sol.hidden=true;
    row.appendChild(el('span','n',String(n+1)));
    if(it.o){
      q=el('div','pq',it.s.replace('___','<span class="blank">&nbsp;&nbsp;&nbsp;&nbsp;</span>'));
      body.appendChild(q);
      bx=el('div','opts inline');
      for(k=0;k<it.o.length;k++){
        (function(o){
          b=el('button','opt',o);b.type='button';
          b.onclick=function(){
            var z,bs=bx.children;
            sel=o;
            for(z=0;z<bs.length;z++){bs[z].className='opt'+(bs[z]===this?' sel':'');}
            row.className='item';mark.textContent='';sol.hidden=true;
          };
          bx.appendChild(b);
        })(it.o[k]);
      }
      body.appendChild(bx);
      body.appendChild(mark);body.appendChild(sol);
      obj.ok=function(){return sel===it.a;};
      obj.answer=it.a;
    }else{
      parts=it.s.split('___');
      inp=el('input','in');inp.type='text';
      inp.setAttribute('autocomplete','off');inp.setAttribute('autocapitalize','none');
      inp.setAttribute('autocorrect','off');inp.setAttribute('spellcheck','false');
      inp.setAttribute('aria-label','Antwort '+(n+1));
      inp.oninput=function(){row.className='item';inp.className='in';mark.textContent='';sol.hidden=true;};
      body.appendChild(document.createTextNode(parts[0]));
      body.appendChild(inp);
      body.appendChild(document.createTextNode(parts.slice(1).join('___')));
      if(it.v){body.appendChild(el('span','vh','('+it.v+')'));}
      body.appendChild(mark);body.appendChild(sol);
      obj.ok=function(){
        var v=norm(inp.value),z;
        for(z=0;z<it.a.length;z++){if(v===norm(it.a[z])){return true;}}
        return false;
      };
      obj.answer=it.a[0];
      obj.inp=inp;
    }
    obj.mark=mark;obj.sol=sol;
    row.appendChild(body);
    return obj;
  }
  var n;
  for(n=0;n<S.ex.length;n++){var o=build(S.ex[n],n);items.push(o);list.appendChild(o.row);}
  w.appendChild(list);
  var btn=el('button','btn primary',UI.b_check.de+' '+tri('b_check'));btn.type='button';
  var solBtn=el('button','btn',UI.b_sol.de+' '+tri('b_sol'));solBtn.type='button';solBtn.hidden=true;
  var res=el('div','result');
  btn.onclick=function(){
    var right=0,k,good,total=items.length;
    for(k=0;k<items.length;k++){
      good=items[k].ok();
      if(good){right++;}
      items[k].row.className='item '+(good?'good':'bad');
      if(items[k].inp){items[k].inp.className='in '+(good?'good':'bad');}
      items[k].mark.textContent=good?'✓':'✗';
      items[k].sol.hidden=!(usedSol&&!good);
    }
    if(right===total){
      res.className='result msg good';
      res.innerHTML='🎉 '+total+' / '+total+' – '+UI.m_all.de+' '+tri('m_all');
      solBtn.hidden=true;
      state.done[i]=usedSol?'part':'ok';
    }else{
      res.className='result msg bad';
      res.innerHTML=right+' / '+total+' – '+UI.m_fix.de+' '+tri('m_fix');
      solBtn.hidden=false;
      state.done[i]='part';
    }
    sset('done',state.done);paintStepper();updateTr();onChecked(right===total);
  };
  solBtn.onclick=function(){
    var k;usedSol=true;
    for(k=0;k<items.length;k++){
      if(!items[k].ok()){items[k].sol.textContent='→ '+items[k].answer;items[k].sol.hidden=false;}
    }
  };
  w.appendChild(btn);w.appendChild(solBtn);w.appendChild(res);
  return w;
}

/* ---------- Panels ---------- */
function buildPanel(i){
  var S=STEPS[i],p=el('section','panel'),tags='',after=el('div','after'),hasTasks=!!(S.tasks&&S.tasks.length);
  tags='<span class="badge">'+S.ph+'</span>';
  if(S.tag==='sein'||S.tag==='both'){tags+='<span class="badge sein">sein</span>';}
  if(S.tag==='haben'||S.tag==='both'){tags+='<span class="badge haben">haben</span>';}
  if(i===0){p.appendChild(introEl());}
  p.appendChild(el('div','phead',tags+'<h2>'+(i+1)+'. '+S.title+'</h2>'));
  if(S.observe){p.appendChild(observeEl(S));}

  var nav=el('div','nav'),prev=el('button','btn','← '+UI.b_prev.de+' '+tri('b_prev')),next=el('button','btn primary',UI.b_next.de+' '+tri('b_next')+' →');
  prev.type='button';next.type='button';
  prev.onclick=function(){show(i-1);};
  next.onclick=function(){show(i+1);};
  prev.style.visibility=(i===0)?'hidden':'visible';
  next.style.visibility=(i===STEPS.length-1)?'hidden':'visible';
  next.disabled=!state.done[i];
  nav.appendChild(prev);nav.appendChild(next);

  var sum=null;
  if(S.summary){sum=summaryEl();sum.hidden=true;}

  if(hasTasks){
    after.hidden=true;
    p.appendChild(tasksEl(S,function(){after.hidden=false;scrollToEl(after);}));
  }
  if(S.rule){after.appendChild(ruleEl(S,i));}
  after.appendChild(exEl(S,i,function(allOk){
    next.disabled=false;
    if(sum){sum.hidden=false;updateTr();if(allOk){scrollToEl(sum);}}
  }));
  if(sum){after.appendChild(sum);}
  p.appendChild(after);
  p.appendChild(nav);
  return p;
}

/* ---------- Navigation ---------- */
function paintStepper(){
  var bs=$('#stepper').children,i,d,done=0,k;
  for(i=0;i<bs.length;i++){
    d=state.done[i];
    bs[i].className=bs[i].className.replace(/\s*(cur|d-ok|d-part)/g,'');
    if(i===state.cur){bs[i].className+=' cur';}
    if(d){bs[i].className+=' d-'+d;}
  }
  for(k in state.done){if(state.done.hasOwnProperty(k)&&state.done[k]){done++;}}
  $('#prog').textContent='Fortschritt: '+done+' / '+STEPS.length+' Schritte bearbeitet';
}
function show(i){
  var j;
  if(i<0||i>=STEPS.length){return;}
  state.cur=i;sset('cur',i);
  if(!panels[i]){panels[i]=buildPanel(i);$('#main').appendChild(panels[i]);}
  for(j=0;j<STEPS.length;j++){if(panels[j]){panels[j].hidden=(j!==i);}}
  paintStepper();updateTr();
  try{window.scrollTo(0,0);}catch(e){}
}
function buildStepper(){
  var bar=$('#stepper'),i,b,gaps={1:1,6:1,10:1,11:1,13:1};
  for(i=0;i<STEPS.length;i++){
    (function(i){
      b=el('button','pill '+STEPS[i].tag+(gaps[i]?' gap':''),String(i+1));
      b.type='button';b.title=STEPS[i].title;b.setAttribute('aria-label',(i+1)+'. '+STEPS[i].title);
      b.onclick=function(){show(i);};
      bar.appendChild(b);
    })(i);
  }
}
function buildLang(){
  var sel=$('#lang'),o,k;
  o=el('option',null,'— keine · none —');o.value='';sel.appendChild(o);
  for(k=0;k<LK.length;k++){o=el('option',null,LN[LK[k]]);o.value=LK[k];sel.appendChild(o);}
  sel.value=state.lang;
  sel.onchange=function(){state.lang=sel.value;sset('lang',state.lang);updateTr();};
}

/* ---------- Start ---------- */
buildStepper();buildLang();
$('#reset').onclick=function(){
  if(window.confirm('Fortschritt wirklich zurücksetzen?')){sdel('done');sdel('cur');window.location.reload();}
};
var start=sget('cur');
show((typeof start==='number'&&start>=0&&start<STEPS.length)?start:0);

/* Testzugriff (nur für automatische Prüfung) */
window.__SH={STEPS:STEPS,show:show,state:state};
})();
</script>
</body>
