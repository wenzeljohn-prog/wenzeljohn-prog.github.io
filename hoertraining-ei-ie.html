<style>
  :root{

  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  header{background:var(--accent);color:#fff;padding:18px 20px}
  header h1{margin:0;font-size:1.4rem}
  header p{margin:4px 0 0;opacity:.9;font-size:.95rem}
  main{max-width:860px;margin:0 auto;padding:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
  .settings{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
  .settings label{display:flex;flex-direction:column;font-size:.85rem;color:var(--muted);gap:4px}
  select,input[type=text]{font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink)}
  .warn{background:#fff4d6;border:1px solid #e9c46a;border-radius:10px;padding:10px 12px;margin-top:12px;font-size:.92rem}
  nav{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
  nav button{flex:1 1 180px;padding:12px;border:1px solid var(--line);background:#fff;border-radius:12px;font:inherit;font-weight:600;cursor:pointer;color:var(--ink)}
  nav button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
  .btn{font:inherit;font-weight:600;border:none;border-radius:10px;padding:11px 18px;cursor:pointer;background:var(--accent);color:#fff}
  .btn.sec{background:var(--accent-soft);color:var(--accent)}
  .btn:disabled{opacity:.5;cursor:default}
  .play{width:44px;height:44px;border-radius:50%;border:none;background:var(--accent-soft);color:var(--accent);font-size:1.15rem;cursor:pointer;flex:none}
  .play:hover{background:#d3defa}
  .bigplay{width:84px;height:84px;font-size:2.1rem}
  table.pairs{width:100%;border-collapse:collapse}
  table.pairs td{padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:middle;width:50%}
  .wcell{display:flex;align-items:center;gap:10px;font-size:1.15rem;font-weight:600}
  .rule{background:var(--accent-soft);border-radius:10px;padding:12px 14px;margin-top:12px}
  .rule ul{margin:6px 0 0;padding-left:20px}
  .rule li{margin-bottom:8px}
  .q{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}
  .opts{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
  .opt{font:inherit;padding:9px 14px;border:1px solid var(--line);background:#fff;border-radius:10px;cursor:pointer;color:var(--ink)}
  .opt.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);font-weight:600}
  .opt.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
  .fb{margin-top:8px;font-size:.95rem;min-height:1.4em}
  .prog{color:var(--muted);font-size:.9rem;display:flex;justify-content:space-between;gap:10px}
  .bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin:6px 0 16px}
  .bar>div{height:100%;background:var(--accent);transition:width .25s}
  .center{text-align:center}
  .choices{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0}
  .choice{font:inherit;font-size:1.5rem;font-weight:700;padding:22px 10px;border:2px solid var(--line);background:#fff;border-radius:14px;cursor:pointer;color:var(--ink)}
  .choice:hover:not(:disabled){border-color:var(--accent)}
  .choice.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
  .choice.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
  .writerow{display:flex;gap:10px;justify-content:center;margin:18px 0;flex-wrap:wrap}
  .writerow input{font-size:1.4rem;width:min(320px,100%);text-align:center}
  .fbbox{padding:10px 14px;border-radius:10px;margin:8px 0;font-weight:600}
  .fbbox.ok{background:var(--ok-soft);color:var(--ok)}
  .fbbox.bad{background:var(--bad-soft);color:var(--bad)}
  .fbbox small{display:block;font-weight:400;color:var(--ink);margin-top:5px;font-size:.9rem}
  .score{font-size:2.2rem;font-weight:800;color:var(--accent)}
  ul.wrongs{text-align:left;max-width:560px;margin:12px auto;padding-left:22px}
  ul.wrongs li{margin-bottom:6px}
  .sent{font-size:1.4rem;font-weight:600;text-align:center;margin:12px 0 6px;line-height:1.6}
  .gap{display:inline-block;min-width:5.5em;border-bottom:3px solid var(--ink);margin:0 4px;color:transparent;user-select:none}
  .fill{color:var(--ok)}
  .sentTr{background:var(--accent-soft);border-radius:10px;padding:8px 12px;margin:8px auto;max-width:640px;font-size:.95rem;text-align:center}
  .trwrap{min-height:42px;margin:6px 0}
  .audiorow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:10px 0}
  /* Übersetzungen */
  .tr{display:block;font-size:.78em;font-weight:400;opacity:.85;line-height:1.3}
  .tr:not([dir=rtl]){}
  .choice .tr{font-size:.5em;margin-top:4px;font-weight:500}
  .wcell .tr{font-size:.72em}
  .btn .tr,nav button .tr{font-size:.8em}
  [hidden]{display:none!important}
</style>
</head>

  rd1:["Many verbs have ei in the infinitive and ie in the past: bleiben – blieb, schreiben – schrieb, steigen – stieg, leihen – lieh.","كثير من الأفعال فيها ei في المصدر وie في الماضي: bleiben – blieb, schreiben – schrieb, steigen – stieg, leihen – lieh.","У многих глаголов в инфинитиве ei, а в прошедшем времени ie: bleiben – blieb, schreiben – schrieb, steigen – stieg, leihen – lieh.","У багатьох дієслів в інфінітиві ei, а в минулому часі ie: bleiben – blieb, schreiben – schrieb, steigen – stieg, leihen – lieh.","Birçok fiilde mastarda ei, geçmiş zamanda ie vardır: bleiben – blieb, schreiben – schrieb, steigen – stieg, leihen – lieh.","Multe verbe au ei la infinitiv și ie la trecut: bleiben – blieb, schreiben – schrieb, steigen – stieg, leihen – lieh."],
  rd2:["This is a vowel change (ablaut): ei → ie. These verbs are learned together with their forms.","هذا تغيّر في الحرف المتحرك (Ablaut): ei → ie. تُتعلَّم هذه الأفعال مع صيغها.","Это чередование гласных (Ablaut): ei → ie. Эти глаголы учат вместе с их формами.","Це чергування голосних (Ablaut): ei → ie. Ці дієслова вчать разом з їхніми формами.","Bu bir ünlü değişimidir (Ablaut): ei → ie. Bu fiiller biçimleriyle birlikte öğrenilir.","Este o alternanță vocalică (Ablaut): ei → ie. Aceste verbe se învață împreună cu formele lor."],
  rd3:["Careful: not all verbs with ei change. Regular: reisen – reiste.","انتبه: ليست كل الأفعال التي فيها ei تتغيّر. منتظم: reisen – reiste.","Внимание: не все глаголы с ei меняются. Правильный глагол: reisen – reiste.","Увага: не всі дієслова з ei змінюються. Правильне дієслово: reisen – reiste.","Dikkat: ei'li her fiil değişmez. Düzenli: reisen – reiste.","Atenție: nu toate verbele cu ei se schimbă. Regulat: reisen – reiste."],

const $  = s => document.querySelector(s);

function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function pool(){ const g=$('#group').value; return PAIRS.filter(p=>g==='alle'||p.t===g); }

/* ---------- Hilfssprache ---------- */
let LANG='none';
const LS_KEY='hoertraining_hilfssprache';
try{ const s=localStorage.getItem(LS_KEY); if(s && LANGS.indexOf(s)>=0) LANG=s; }catch(e){}
let NOSPEAK=false;

function langAttr(){ return ' lang="'+LANG+'"'+(LANG==='ar'?' dir="rtl"':''); }
function tr(key,args){
  if(LANG==='none') return '';
  const e=T[key]; if(!e) return '';
  let s=e[LANGS.indexOf(LANG)]||'';
  if(args) s=s.replace(/\{(\w+)\}/g,(m,k)=>args[k]!==undefined?args[k]:m);
  return s;
}
function trSpan(s){ return s?'<span class="tr"'+langAttr()+'>'+s+'</span>':''; }
/* Deutsch + Übersetzung darunter */
function bi(de,key,args){ return de+trSpan(tr(key,args)); }
/* Deutsch / Übersetzung in einer Zeile (für Optionen) */
function plainBi(de,key,args){ const s=tr(key,args); return s?de+' · '+s:de; }
function mean(w){ if(LANG==='none') return ''; const e=M[w]; return e?(e[LANGS.indexOf(LANG)]||''):''; }
function meanSpan(w){ return trSpan(mean(w)); }
function meanPair(it){
  if(LANG==='none') return '';
  return '<small>'+it.word+' – '+mean(it.word)+'<br>'+it.other+' – '+mean(it.other)+'</small>';
}

/* ---------- Sprachausgabe ---------- */
const synth = window.speechSynthesis || null;
let voices = [];
function initVoices(){
  if(!synth){ showNoVoice(true); return; }
  voices = synth.getVoices().filter(v=>/^de/i.test(v.lang));
  voices.sort((a,b)=>(/de[-_]DE/i.test(b.lang)?1:0)-(/de[-_]DE/i.test(a.lang)?1:0));
  const sel=$('#voice'); const keep=sel.value;
  sel.innerHTML='';
  voices.forEach((v,i)=>{
    const o=document.createElement('option');
    o.value=i; o.textContent=v.name+' ('+v.lang+')'+(v.localService?' · offline':'');
    sel.appendChild(o);
  });
  if(keep && sel.querySelector('option[value="'+keep+'"]')) sel.value=keep;
  showNoVoice(voices.length===0);
}
function showNoVoice(flag){
  const box=$('#novoice');
  box.hidden=!flag;
  box.innerHTML=bi('Es wurde keine deutsche Stimme gefunden. Bitte in den Geräteeinstellungen eine deutsche Sprachausgabe installieren (Windows: Sprache → Deutsch; Android/iOS: Sprachausgabe → Deutsch) und die Seite neu laden.','novoice');
}
function speak(word){
  if(!synth) return;
  synth.cancel();
  setTimeout(()=>{
    const u=new SpeechSynthesisUtterance(word);
    u.lang='de-DE';
    const v=voices[parseInt($('#voice').value||'0',10)];
    if(v){ u.voice=v; u.lang=v.lang; }
    u.rate=parseFloat($('#rate').value);
    synth.speak(u);
  },60);
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-say]');
  if(b) speak(b.dataset.say);
});

let S2=null;
function makeItems(n){
  let out=[];
  while(out.length<n) out=out.concat(shuffle(pool()));
  return out.slice(0,n).map(p=>{
    const side=Math.random()<.5?'e':'i';
    return {p, side, word:p[side], other:p[side==='e'?'i':'e'], flip:Math.random()<.5};
  });
}

  const a=S2.i+1, b=S2.items.length;
  root.innerHTML='<div class="card">'+
    '<div class="prog"><span>'+bi('Aufgabe '+a+' / '+b,'prog',{a:a,b:b})+'</span><span>'+bi('Richtig: '+S2.score,'rcount',{a:S2.score})+'</span></div>'+
    '<div class="bar"><div style="width:'+pct+'%"></div></div>'+
    '<div class="center"><p>'+bi('Welches Wort fehlt?','q2')+'</p>'+
    '<div class="sent" id="sent2">'+gapHtml(it.word)+'</div>'+
    trWrapHtml(S2.showTr||S2.done,it)+
    audioRowHtml()+
    '<div class="choices">'+
      '<button class="choice" data-w="'+opts[0]+'">a) '+opts[0]+'</button>'+
      '<button class="choice" data-w="'+opts[1]+'">b) '+opts[1]+'</button>'+
    '</div>'+
    '<div id="fb2"></div>'+
    '<button class="btn" id="next2" hidden>'+bi('Weiter','btn_next')+'</button></div></div>';
  bindCommon('#t2',it,S2);
  $$('#t2 .choice').forEach(btn=>btn.addEventListener('click',()=>answerT2(btn.dataset.w,it)));
  $('#next2').addEventListener('click',()=>{S2.i++;S2.done=false;S2.sel=null;S2.showTr=false;renderT2();});
  if(S2.done){ showAnswerT2(it); }
  else if(!NOSPEAK){ speakItem(it,$('#audio').value); }
}
function answerT2(chosen,it){
  if(S2.done) return;
  S2.done=true; S2.sel=chosen;
  if(chosen===it.word) S2.score++; else S2.wrong.push(it);
  showAnswerT2(it);
  $('#next2').focus();
}
function showAnswerT2(it){
  const ok=(S2.sel===it.word);
  $$('#t2 .choice').forEach(b=>{
    b.disabled=true;
    if(b.dataset.w===it.word) b.classList.add('ok');
    else if(b.dataset.w===S2.sel) b.classList.add('bad');
  });
  $('#sent2').innerHTML=fillHtml(it.word);
  const tw=$('#t2 .trwrap'); if(tw) tw.innerHTML=sentTrHtml(it.word);
  const w='<b>'+it.word+'</b>', c='<b>'+S2.sel+'</b>';
  $('#fb2').innerHTML = ok
    ? '<div class="fbbox ok">'+bi('Richtig: '+w,'fb_right',{w:w})+meanPair(it)+'</div>'
    : '<div class="fbbox bad">'+bi('Nicht ganz. Richtig ist '+w+' – nicht '+c+'.','fb2_wrong',{w:w,c:c})+meanPair(it)+'</div>';
  $('#next2').hidden=false;
}
function resultT2(){
  const n=S2.items.length;
  const root=$('#t2');
  root.innerHTML='<div class="card center"><h2 style="margin-top:0">'+bi('Ergebnis','res_title')+'</h2>'+
    '<div class="score">'+S2.score+' / '+n+'</div>'+
    (S2.wrong.length
      ? '<p>'+bi('Das war schwierig:','hard')+'</p><ul class="wrongs">'+S2.wrong.map(w=>
          '<li><button class="play" style="width:34px;height:34px;font-size:.9rem" data-say="'+w.word+'">▶</button> <b>'+w.word+'</b> ('+w.p.e+' – '+w.p.i+')'+meanSpan(w.word)+'<div style="font-size:.85em">'+fillHtml(w.word)+'</div></li>').join('')+'</ul>'
      : '<p>'+bi('Perfekt – keine Fehler!','perfect')+'</p>')+
    '<div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">'+
    (S2.wrong.length?'<button class="btn sec" id="redo2">'+bi('Nur Fehler üben','btn_redo')+'</button>':'')+
    '<button class="btn" id="again2">'+bi('Neu starten','btn_again')+'</button>'+
    '<button class="btn sec" id="to3">'+bi('Weiter zu Aufgabe 3','btn_to3')+'</button></div></div>';
  const r=$('#redo2'); if(r) r.addEventListener('click',()=>{
    S2={items:shuffle(S2.wrong).map(x=>({p:x.p,side:x.side,word:x.word,other:x.other,flip:Math.random()<.5})), i:0, score:0, wrong:[], done:false, sel:null, showTr:false}; renderT2();
  });
  $('#again2').addEventListener('click',startT2);
  $('#to3').addEventListener('click',()=>$('nav button[data-tab="t3"]').click());
}

/* ====================================================================
   3 · Hören & schreiben
   ==================================================================== */
let S3=null;
function startT3(){
  S3={items:makeItems(parseInt($('#count').value,10)), i:0, score:0, wrong:[], checked:false, typed:'', res:null, showTr:false};
  renderT3();
}
function checkWord(input,item){
  const a=input.trim(); if(!a) return null;
  const t=item.word;
  if(a===t) return {ok:true};
  const al=a.toLowerCase(), tl=t.toLowerCase();
  if(al===tl) return {ok:true,kind:'case'};
  if((ALT[tl]||[]).indexOf(al)>=0) return {ok:true,kind:'hom'};
  return {ok:false};
}
function renderT3(){
  const root=$('#t3');
  if(!S3){
    root.innerHTML='<div class="card center"><h2 style="margin-top:0">'+bi('Hören &amp; schreiben','t3_title')+'</h2>'+
      '<p>'+bi('Lies den Satz und höre zu. Schreibe das fehlende Wort. Mit der Eingabetaste prüfst du und gehst weiter.','t3_intro')+'</p>'+
      '<button class="btn" id="start3">'+bi('Starten','btn_start')+'</button></div>';
    $('#start3').addEventListener('click',startT3); return;
  }
  if(S3.i>=S3.items.length){ resultT3(); return; }
  const it=S3.items[S3.i];
  const pct=Math.round(S3.i/S3.items.length*100);
  const a=S3.i+1, b=S3.items.length;
  root.innerHTML='<div class="card">'+
    '<div class="prog"><span>'+bi('Aufgabe '+a+' / '+b,'prog',{a:a,b:b})+'</span><span>'+bi('Richtig: '+S3.score,'rcount',{a:S3.score})+'</span></div>'+
    '<div class="bar"><div style="width:'+pct+'%"></div></div>'+
    '<div class="center"><p>'+bi('Schreibe das fehlende Wort.','q3')+'</p>'+
    '<div class="sent" id="sent3">'+gapHtml(it.word)+'</div>'+
    trWrapHtml(S3.showTr||S3.checked,it)+
    audioRowHtml()+
    '<div class="writerow"><input type="text" id="in3" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" aria-label="Wort schreiben">'+
    '<button class="btn" id="chk3">'+bi('Prüfen','btn_check')+'</button></div>'+
    '<div id="fb3"></div></div></div>';
  const inp=$('#in3');
  bindCommon('#t3',it,S3);
  const act=()=>{ if(S3.checked){ S3.i++; S3.checked=false; S3.typed=''; S3.res=null; S3.showTr=false; renderT3(); } else { doCheck(it); } };
  $('#chk3').addEventListener('click',act);
  inp.addEventListener('keydown',e=>{ if(e.key==='Enter'){e.preventDefault();act();} });
  if(S3.checked){
    inp.value=S3.typed; inp.disabled=true;
    showFeedbackT3(it);
  } else {
    inp.focus();
    if(!NOSPEAK) speakItem(it,$('#audio').value);
  }
}
function doCheck(it){
  const inp=$('#in3'); const r=checkWord(inp.value,it);
  if(r===null){ $('#fb3').innerHTML='<div class="fbbox bad">'+bi('Bitte schreibe zuerst ein Wort.','empty')+'</div>'; return; }
  S3.checked=true; S3.typed=inp.value.trim(); S3.res=r; inp.disabled=true;
  if(r.ok) S3.score++; else S3.wrong.push({p:it.p,side:it.side,word:it.word,other:it.other,typed:S3.typed});
  showFeedbackT3(it);
  $('#chk3').focus();
}
function showFeedbackT3(it){
  const r=S3.res, typed=S3.typed;
  const w='<b>'+it.word+'</b>';
  $('#sent3').innerHTML=fillHtml(it.word);
  const tw=$('#t3 .trwrap'); if(tw) tw.innerHTML=sentTrHtml(it.word);
  if(r.ok){
    let note='';
    if(r.kind==='case') note='<small>'+bi('Achte auf die Groß- und Kleinschreibung: '+w,'case_note',{w:w})+'</small>';
    if(r.kind==='hom')  note='<small>'+bi('„'+esc(typed)+'“ klingt genauso – gemeint war hier: '+w,'hom_note',{a:esc(typed),w:w})+'</small>';
    $('#fb3').innerHTML='<div class="fbbox ok">'+bi('Richtig: '+w,'fb_right',{w:w})+note+meanPair(it)+'</div>';
  } else {
    const o='<b>'+it.other+'</b>';
    $('#fb3').innerHTML='<div class="fbbox bad">'+bi('Nicht ganz. Richtig ist: '+w,'wrong3',{w:w})+
      '<small>'+bi('Du hast „'+esc(typed)+'“ geschrieben. Achtung: Das Gegenstück ist '+o+'.','wrong3b',{t:esc(typed),o:o})+'</small>'+
      meanPair(it)+'</div>';
  }
  $('#chk3').innerHTML=bi('Weiter','btn_next');
}
function resultT3(){
  const n=S3.items.length;
  const root=$('#t3');
  const wlabel=LANG==='none'?'geschrieben':('geschrieben / '+tr('written'));
  root.innerHTML='<div class="card center"><h2 style="margin-top:0">'+bi('Ergebnis','res_title')+'</h2>'+
    '<div class="score">'+S3.score+' / '+n+'</div>'+
    (S3.wrong.length
      ? '<p>'+bi('Das war schwierig:','hard')+'</p><ul class="wrongs">'+S3.wrong.map(w=>
          '<li><button class="play" style="width:34px;height:34px;font-size:.9rem" data-say="'+w.word+'">▶</button> <b>'+w.word+'</b> ('+wlabel+': '+esc(w.typed)+'; '+w.p.e+' – '+w.p.i+')'+meanSpan(w.word)+'<div style="font-size:.85em">'+fillHtml(w.word)+'</div></li>').join('')+'</ul>'
      : '<p>'+bi('Perfekt – keine Fehler!','perfect')+'</p>')+
    '<div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">'+
    (S3.wrong.length?'<button class="btn sec" id="redo3">'+bi('Nur Fehler üben','btn_redo')+'</button>':'')+
    '<button class="btn" id="again3">'+bi('Neu starten','btn_again')+'</button></div></div>';
  const r=$('#redo3'); if(r) r.addEventListener('click',()=>{
    S3={items:shuffle(S3.wrong).map(x=>({p:x.p,side:x.side,word:x.word,other:x.other})), i:0, score:0, wrong:[], checked:false, typed:'', res:null, showTr:false}; renderT3();
  });
  $('#again3').addEventListener('click',startT3);
}

/* ====================================================================
   Start & Ereignisse
   ==================================================================== */
function renderAll(){
  updateStatic();
  renderT1(); renderT2(); renderT3();
}
$('#lang').value=LANG;
$('#lang').addEventListener('change',()=>{
  LANG=$('#lang').value;
  try{ localStorage.setItem(LS_KEY,LANG); }catch(e){}
  NOSPEAK=true; renderAll(); NOSPEAK=false;
});
['group','count'].forEach(id=>$('#'+id).addEventListener('change',()=>{S2=null;S3=null;renderT2();renderT3();}));

if(synth){ synth.onvoiceschanged=initVoices; }
NOSPEAK=true;
renderAll();
NOSPEAK=false;
initVoices();
</script>
</body>
</html>
