<html lang="de">
<head>
<meta charset="utf-8">

<title>Artikeltrainer A1 L1–L20</title>
<style>
  :root {
    --bg:#f4f6fa; --card:#fff; --text:#1d2433; --muted:#5b667a; --line:#d5dbe6;
    --accent:#2b5fd9; --accent-text:#fff; --chip:#e9eef8;
    --der:#1f5fbf; --der-bg:#e3ecfb; --die:#b3303f; --die-bg:#fbe4e7; --das:#1f7a4d; --das-bg:#e0f3e8;
    --ok:#1f7a4d; --ok-bg:#e0f3e8; --bad:#b3303f; --bad-bg:#fbe4e7; --warn-bg:#fff4d6;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#12161f; --card:#1b2130; --text:#e8ecf5; --muted:#9aa5ba; --line:#30394d;
      --accent:#6b97ff; --accent-text:#0b1226; --chip:#252d40;
      --der:#7fb0ff; --der-bg:#1b2c4a; --die:#ff8a98; --die-bg:#42202a; --das:#6fd6a2; --das-bg:#183427;
      --ok:#6fd6a2; --ok-bg:#183427; --bad:#ff8a98; --bad-bg:#42202a; --warn-bg:#3a3118;
    }
  }
  * { box-sizing:border-box; }
  html,body { margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; line-height:1.45; min-height:100vh; }
  .wrap { max-width:900px; margin:0 auto; padding:14px; }
  h1 { font-size:1.2rem; margin:2px 0 10px; }
  .tabs { display:flex; gap:6px; margin-bottom:12px; }
  .tab { flex:1; min-height:48px; border-radius:12px; border:2px solid var(--line); background:var(--card); color:var(--text); font-size:1rem; cursor:pointer; font-weight:600; }
  .tab.on { border-color:var(--accent); background:var(--chip); }
  .panel { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin-bottom:12px; }
  .panel h2 { font-size:.78rem; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:0 0 8px; }
  .row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .chip { display:inline-flex; align-items:center; gap:6px; min-height:44px; padding:6px 14px; border-radius:999px; background:var(--chip); border:2px solid transparent; cursor:pointer; user-select:none; font-size:.95rem; }
  .chip input { position:absolute; opacity:0; pointer-events:none; }
  .chip.on { border-color:var(--accent); font-weight:700; }
  .chip:focus-within { outline:3px solid var(--accent); outline-offset:2px; }
  .chip small { color:var(--muted); font-weight:400; }
  .small { color:var(--muted); font-size:.86rem; margin-top:6px; }
  .linkbtn { background:none; border:none; color:var(--accent); cursor:pointer; font-size:.92rem; padding:6px 4px; min-height:44px; }
  select, input[type=search] { min-height:44px; border-radius:10px; border:2px solid var(--line); background:var(--card); color:var(--text); font-size:1rem; padding:6px 10px; }
  label.opt { display:flex; align-items:center; gap:8px; min-height:44px; }
  button.main { width:100%; min-height:56px; border-radius:14px; border:none; cursor:pointer; font-size:1.15rem; font-weight:700; background:var(--accent); color:var(--accent-text); }
  button.main:disabled { opacity:.4; cursor:default; }
  button.sec { min-height:48px; padding:0 18px; border-radius:12px; cursor:pointer; font-size:1rem; background:var(--card); color:var(--text); border:2px solid var(--line); }
  button:focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
  .bar { height:10px; background:var(--chip); border-radius:999px; overflow:hidden; }
  .bar > i { display:block; height:100%; background:var(--accent); }
  .top { display:flex; justify-content:space-between; font-size:.9rem; color:var(--muted); margin-bottom:6px; }
  .qcard { text-align:center; padding:22px 10px 12px; }
  .qlesson { font-size:.8rem; color:var(--muted); }
  .qword { font-size:clamp(2rem,9vw,3.4rem); font-weight:800; margin:10px 0 4px; word-wrap:break-word; overflow-wrap:anywhere; }
  .qmean { font-size:1.15rem; color:var(--muted); min-height:1.6em; }
  .art { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin:14px 0 8px; }
  .art button { min-height:72px; border-radius:14px; border:3px solid var(--line); background:var(--card); color:var(--text); font-size:1.5rem; font-weight:800; cursor:pointer; }
  .art button small { display:block; font-size:.7rem; font-weight:500; color:var(--muted); }
  .art button[data-a=der] { border-color:var(--der); color:var(--der); }
  .art button[data-a=die] { border-color:var(--die); color:var(--die); }
  .art button[data-a=das] { border-color:var(--das); color:var(--das); }
  .art button.right { background:var(--ok-bg); border-color:var(--ok); color:var(--ok); }
  .art button.wrong { background:var(--bad-bg); border-color:var(--bad); color:var(--bad); }
  .art button:disabled { cursor:default; }
  .art button:disabled:not(.right):not(.wrong) { opacity:.45; }
  .fb { border-radius:12px; padding:12px 14px; margin-top:6px; text-align:left; }
  .fb.ok { background:var(--ok-bg); } .fb.bad { background:var(--bad-bg); }
  .fb .big { font-size:1.25rem; font-weight:800; }
  .fb .hint { margin-top:6px; padding:8px 10px; border-radius:10px; background:var(--warn-bg); font-size:.95rem; }
  .fb .hint .ex { margin-top:4px; color:var(--muted); font-size:.9rem; }
  .hint b.exc { color:var(--bad); }
  .g-der { color:var(--der); font-weight:800; } .g-die { color:var(--die); font-weight:800; } .g-das { color:var(--das); font-weight:800; }
  .score { font-size:2.2rem; font-weight:800; text-align:center; }
  .rev { list-style:none; margin:8px 0 0; padding:0; }
  .rev li { padding:10px 0; border-top:1px solid var(--line); }
  .rev .pl { color:var(--muted); font-size:.92rem; }
  .cols { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .col { border-radius:12px; padding:8px 10px; }
  .col h3 { margin:0 0 6px; font-size:1.05rem; }
  .col.der { background:var(--der-bg); } .col.die { background:var(--die-bg); } .col.das { background:var(--das-bg); }
  .col ul { list-style:none; margin:0; padding:0; }
  .col li { padding:2px 0; font-size:.95rem; }
  .col li small { color:var(--muted); }
  .rowbar { display:flex; height:14px; border-radius:999px; overflow:hidden; background:var(--chip); }
  .rowbar i { display:block; height:100%; }
  .seg-s { background:var(--ok); } .seg-g { background:#e0a526; }
  table.prog { width:100%; border-collapse:collapse; font-size:.95rem; }
  table.prog td { padding:6px 4px; border-top:1px solid var(--line); vertical-align:middle; }
  table.prog td.n { width:56px; font-weight:700; white-space:nowrap; }
  table.prog td.c { width:110px; text-align:right; color:var(--muted); font-size:.85rem; white-space:nowrap; }
  details summary { cursor:pointer; font-weight:600; min-height:44px; display:flex; align-items:center; }
  .rules li { margin:4px 0; }
  .seg { display:flex; gap:6px; margin-bottom:10px; }
  .seg button { flex:1; min-height:48px; border-radius:12px; border:2px solid var(--line); background:var(--card); color:var(--text); font-size:1rem; font-weight:600; cursor:pointer; }
  .seg button.on { border-color:var(--accent); background:var(--chip); }
  .seg button:focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
  table.prog.tl td.n { width:44%; white-space:normal; }
  table.prog.tl td:nth-child(2) { width:auto; min-width:70px; }
  .hidden { display:none !important; }
  [dir=rtl] { direction:rtl; unicode-bidi:isolate; }
  @media (max-width:560px) { .cols { grid-template-columns:1fr; } .wrap { padding:10px; } }
</style>
</head>

    quit.addEventListener("click", function () { if (autoTimer) { clearTimeout(autoTimer); autoTimer = null; } session = null; renderPractice(); });
    v.appendChild(quit);
    session.answered = false;
  }

  function answer(pick) {
    if (!session || session.answered) { return; }
    var n = byId[session.queue[session.pos]];
    session.answered = true;
    var ok = isCorrect(n, pick);
    session.results.push({ id: n.id, ok: ok, pick: pick });
    /* Fortschritt */
    var r = store.words[n.k] || { n: 0, c: 0, s: 0 };
    r.n += 1;
    if (ok) { r.c += 1; r.s += 1; if (r.box !== undefined && r.box < 2) { r.box += 1; } }
    else { r.s = 0; r.box = 0; }
    store.words[n.k] = r; save();
    /* Anzeige */
    var btns = $("artRow").getElementsByTagName("button");
    for (var k = 0; k < btns.length; k++) {
      var a = btns[k].getAttribute("data-a");
      btns[k].disabled = true;
      if (isCorrect(n, a)) { btns[k].className = "right"; }
      else if (a === pick) { btns[k].className = "wrong"; }
    }
    var fb = $("fbBox"); clear(fb);
    var box = el("div", "fb " + (ok ? "ok" : "bad"));
    var big = el("div", "big");
    big.appendChild(document.createTextNode(ok ? "✓ Richtig: " : "✗ Richtig ist: "));
    big.appendChild(artSpan(n.a)); big.appendChild(document.createTextNode(" " + n.w));
    box.appendChild(big);
    if (n.alt && !n.note) { box.appendChild(el("div", "small", "Auch möglich: " + n.alt + " " + n.w)); }
    if (n.note) { box.appendChild(el("div", "small", n.note)); }
    if (n.p) { box.appendChild(el("div", "small", "Plural: die " + n.p)); }
    if (!ok && n.h) { box.appendChild(hintNode(n)); }
    fb.appendChild(box);
    var nb = $("nextBtn"); nb.className = "main";
    if (ok && store.settings.auto) {
      autoTimer = setTimeout(function () { autoTimer = null; nextQuestion(); }, 1100);
    }
  }

  function nextQuestion() {
    if (!session || !session.answered) { return; }
    if (autoTimer) { clearTimeout(autoTimer); autoTimer = null; }
    session.pos += 1;
    renderPractice();
  }

  function renderEnd(v) {
    var total = session.results.length, right = 0, wrong = [];
    session.results.forEach(function (r) { if (r.ok) { right += 1; } else { wrong.push(r); } });
    var pct = total ? Math.round(100 * right / total) : 0;
    var p = el("div", "panel");
    p.appendChild(el("div", "score", right + " / " + total + " (" + pct + " %)"));
    var msg = pct === 100 ? "Alles richtig!" : (pct >= 80 ? "Sehr gut." : (pct >= 50 ? "Solide Basis – die Fehlerwörter kommen jetzt öfter dran." : "Weiter üben – die Fehlerwörter kommen jetzt öfter dran."));
    var m = el("div", "small", msg); m.style.textAlign = "center"; p.appendChild(m);
    v.appendChild(p);

    if (wrong.length) {
      var pl = el("div", "panel");
      pl.appendChild(el("h2", null, "Wiederholungsliste (" + wrong.length + ")"));
      var ul = el("ul", "rev");
      wrong.forEach(function (r) {
        var n = byId[r.id];
        var li = el("li");
        var line = el("div");
        line.appendChild(artSpan(n.a)); line.appendChild(document.createTextNode(" " + n.w));
        if (n.p) { var sp = el("span", "pl", " · Pl.: " + n.p); line.appendChild(sp); }
        line.appendChild(el("span", "pl", "  (du: " + r.pick + ")"));
        li.appendChild(line);
        var mm = meaning(n);
        if (mm) { var md = el("div", "pl", mm); if (store.settings.lang === "ar") { md.setAttribute("dir", "rtl"); } li.appendChild(md); }
        if (n.h) { li.appendChild(hintNode(n, "pl")); }
        ul.appendChild(li);
      });
      pl.appendChild(ul);
      v.appendChild(pl);
    }

    var acts = el("div");
    if (wrong.length) {
      var rb = el("button", "main", "Fehlerwörter wiederholen (" + wrong.length + ")"); rb.type = "button";
      rb.addEventListener("click", function () {
        startSession(shuffle(wrong.map(function (r) { return r.id; })), true);
      });
      acts.appendChild(rb);
    }
    var again = el("button", "sec", "Neue Runde"); again.type = "button";
    again.style.marginTop = "10px"; again.style.width = "100%";
    again.addEventListener("click", function () { session = null; renderPractice(); });
    acts.appendChild(again);
    v.appendChild(acts);
  }

  /* ---------- Lernliste ---------- */
  var listFilter = "";
  function renderList() {
    var v = $("viewList"); clear(v);
    var p1 = el("div", "panel");
    buildFilter(p1, renderList);
    v.appendChild(p1);

    var p2 = el("div", "panel");
    var s = document.createElement("input"); s.type = "search"; s.placeholder = "Wort suchen …"; s.value = listFilter;
    s.style.width = "100%"; s.setAttribute("aria-label", "Wort suchen");
    s.addEventListener("input", function () { listFilter = s.value; fillCols(); });
    p2.appendChild(s);
    var cols = el("div", "cols"); cols.style.marginTop = "10px"; cols.id = "listCols";
    p2.appendChild(cols);
    v.appendChild(p2);

    var rules = el("div", "panel");
    var det = document.createElement("details");
    det.appendChild(el("summary", null, "Faustregeln im Überblick"));
    var ul = el("ul", "rules");
    [
      "Wochentage, Monate, Jahreszeiten, Tageszeiten und Himmelsrichtungen sind maskulin: der Montag, der Mai, der Winter, der Morgen, der Norden (Ausnahme: die Nacht).",
      "Männliche Personen und Berufe sind meist maskulin: der Vater, der Lehrer, der Arzt.",
      "Weibliche Personen sind meist feminin; die weibliche Form auf -in ist immer die: die Lehrerin, die Ärztin. (Ausnahme: das Kind – sächlich.)",
      "Zusammengesetzte Nomen: Das letzte Wort entscheidet. die Maschine → die Waschmaschine; das Zimmer → das Wohnzimmer; der Arzt → der Zahnarzt.",
      "Immer oder fast immer die: -ung (die Wohnung), -ion (die Station), -heit, -keit (die Staatsangehörigkeit), -schaft, -tät (die Universität), -ik (die Musik), -ei (die Bäckerei), -thek (die Bibliothek). Meist die: -ur (die Reparatur), -ft (die Ankunft).",
      "Immer oder meist das: -chen (das Brötchen), -ment (das Medikament, das Dokument), -um (das Museum, das Datum), -o (das Auto, das Kino; Ausnahme: der Euro).",
      "Aus Verben gemachte Nomen sind sächlich: essen → das Essen. Nomen mit Ge- am Anfang sind oft sächlich: das Gespräch, das Geschenk.",
      "Nomen auf -e sind meist feminin: die Tasche, die Lampe (Ausnahmen: der Name, der Käse, das Ende, das Auge).",
      "Nomen auf -er sind oft maskulin: der Computer, der Hammer, der Keller – aber das ist nur eine Tendenz (Ausnahmen: das Fenster, das Zimmer, die Butter, das Wetter).",
      "Viele Obst- und Gemüsesorten sind feminin: die Birne, die Tomate (Ausnahmen: der Apfel, der Salat). Viele Getränke sind maskulin: der Kaffee, der Saft (Ausnahmen: das Bier, das Wasser, die Milch).",
      "Für viele Nomen (z. B. Tisch, Haus, Stadt, Kopf, Hand) gibt es keine verlässliche Regel – hier hilft nur: immer mit Artikel lernen."
    ].forEach(function (t) { ul.appendChild(el("li", null, t)); });
    det.appendChild(ul);
    rules.appendChild(det);
    v.appendChild(rules);
    fillCols();
  }
  function fillCols() {
    var cols = $("listCols"); if (!cols) { return; }
    clear(cols);
    var q = listFilter.toLowerCase();
    ["der", "die", "das"].forEach(function (a) {
      var col = el("div", "col " + a);
      var items = NOUNS.filter(function (n) {
        if (n.a !== a || !inSelection(n)) { return false; }
        if (q && n.w.toLowerCase().indexOf(q) < 0) { return false; }
        return true;
      });
      items.sort(function (x, y) { return x.w.localeCompare(y.w, "de"); });
      col.appendChild(el("h3", "g-" + a, a + " (" + items.length + ")"));
      var ul = el("ul");
      items.forEach(function (n) {
        var li = el("li", null, n.w + " ");
        li.appendChild(el("small", null, "L" + n.ls.join("+")));
        ul.appendChild(li);
      });
      col.appendChild(ul);
      cols.appendChild(col);
    });
  }

  /* ---------- Fortschritt ---------- */
  function progRow(tb, label, st) {
    var tr = el("tr");
    tr.appendChild(el("td", "n", label));
    var tdb = el("td"); var bb = el("div", "rowbar");
    var a1 = el("i", "seg-s"); a1.style.width = (st.t ? 100 * st.s / st.t : 0) + "%";
    var a2 = el("i", "seg-g"); a2.style.width = (st.t ? 100 * st.g / st.t : 0) + "%";
    bb.appendChild(a1); bb.appendChild(a2); tdb.appendChild(bb); tr.appendChild(tdb);
    tr.appendChild(el("td", "c", st.s + " / " + st.t + " sicher"));
    tb.appendChild(tr);
  }
  function renderProg() {
    var v = $("viewProg"); clear(v);
    var seen = 0, sure = 0, tot = NOUNS.length;
    var byArt = { der: { n: 0, c: 0 }, die: { n: 0, c: 0 }, das: { n: 0, c: 0 } };
    var perL = [], perT = {};
    for (i = 0; i < LESSONS; i++) { perL.push({ t: 0, s: 0, g: 0 }); }
    THEMES.forEach(function (t) { perT[t[0]] = { t: 0, s: 0, g: 0 }; });
    var hard = [];
    NOUNS.forEach(function (n) {
      var r = rec(n);
      var pl = perL[n.l - 1], pt = perT[n.t];
      pl.t += 1; pt.t += 1;
      if (r && r.n > 0) {
        seen += 1; byArt[n.a].n += r.n; byArt[n.a].c += r.c;
        if (isSure(n)) { sure += 1; pl.s += 1; pt.s += 1; } else { pl.g += 1; pt.g += 1; }
        if (r.n - r.c > 0) { hard.push({ n: n, wrong: r.n - r.c, all: r.n }); }
      }
    });
    var p = el("div", "panel");
    p.appendChild(el("h2", null, "Gesamt"));
    p.appendChild(el("div", null, sure + " von " + tot + " Nomen sicher · " + seen + " schon geübt"));
    var rb = el("div", "rowbar"); rb.style.marginTop = "8px";
    var s1 = el("i", "seg-s"); s1.style.width = (100 * sure / tot) + "%";
    var s2 = el("i", "seg-g"); s2.style.width = (100 * (seen - sure) / tot) + "%";
    rb.appendChild(s1); rb.appendChild(s2); p.appendChild(rb);
    p.appendChild(el("div", "small", "„sicher“ = zuletzt mindestens zweimal hintereinander richtig. Grün: sicher · Gelb: geübt, aber noch nicht sicher."));
    v.appendChild(p);

    var p2 = el("div", "panel"); p2.appendChild(el("h2", null, "Nach Lektion"));
    var tb = el("table", "prog");
    for (i = 0; i < LESSONS; i++) { progRow(tb, "L" + (i + 1), perL[i]); }
    p2.appendChild(tb);
    p2.appendChild(el("div", "small", "Jedes Nomen zählt bei der Lektion, in der es zuerst vorkommt."));
    v.appendChild(p2);

    var p2b = el("div", "panel"); p2b.appendChild(el("h2", null, "Nach Themenbereich"));
    var tb2 = el("table", "prog tl");
    THEMES.forEach(function (t) { progRow(tb2, t[1], perT[t[0]]); });
    p2b.appendChild(tb2);
    v.appendChild(p2b);

    var p3 = el("div", "panel"); p3.appendChild(el("h2", null, "Trefferquote nach Artikel"));
    var row = el("div", "row");
    ["der", "die", "das"].forEach(function (a) {
      var b = byArt[a];
      var c = el("span", "chip on");
      c.appendChild(artSpan(a));
      c.appendChild(document.createTextNode(" " + (b.n ? Math.round(100 * b.c / b.n) + " %" : "–") + " (" + b.n + " Antworten)"));
      row.appendChild(c);
    });
    p3.appendChild(row); v.appendChild(p3);

    var p4 = el("div", "panel"); p4.appendChild(el("h2", null, "Schwierigste Wörter"));
    hard.sort(function (a, b) { return b.wrong - a.wrong || b.all - a.all; });
    if (!hard.length) { p4.appendChild(el("div", "small", "Noch keine Fehler – oder noch nichts geübt.")); }
    else {
      var ul = el("ul", "rev");
      hard.slice(0, 10).forEach(function (h) {
        var li = el("li");
        li.appendChild(artSpan(h.n.a)); li.appendChild(document.createTextNode(" " + h.n.w));
        li.appendChild(el("span", "pl", "  · " + h.wrong + " von " + h.all + " falsch"));
        ul.appendChild(li);
      });
      p4.appendChild(ul);
    }
    v.appendChild(p4);

    var p5 = el("div", "panel");
    var rs = el("button", "sec", "Fortschritt zurücksetzen"); rs.type = "button";
    rs.addEventListener("click", function () {
      if (window.confirm("Gesamten Fortschritt löschen? Das kann nicht rückgängig gemacht werden.")) {
        store.words = {}; save(); renderProg();
      }
    });
    p5.appendChild(rs); v.appendChild(p5);
  }

  /* ---------- Tabs & Tastatur ---------- */
  var tab = "practice";
  function showTab(t) {
    tab = t;
    $("viewPractice").className = t === "practice" ? "" : "hidden";
    $("viewList").className = t === "list" ? "" : "hidden";
    $("viewProg").className = t === "prog" ? "" : "hidden";
    $("tabPractice").className = "tab" + (t === "practice" ? " on" : "");
    $("tabList").className = "tab" + (t === "list" ? " on" : "");
    $("tabProg").className = "tab" + (t === "prog" ? " on" : "");
    if (t === "practice") { renderPractice(); }
    else if (t === "list") { renderList(); }
    else { renderProg(); }
  }

  function init() {
    load();
    $("tabPractice").addEventListener("click", function () { showTab("practice"); });
    $("tabList").addEventListener("click", function () { showTab("list"); });
    $("tabProg").addEventListener("click", function () { showTab("prog"); });
    document.addEventListener("keydown", function (ev) {
      if (tab !== "practice" || !session || session.pos >= session.queue.length) { return; }
      var tag = ev.target && ev.target.tagName;
      if (tag === "INPUT" || tag === "SELECT") { return; }
      if (!session.answered) {
        if (ev.key === "1") { answer("der"); }
        else if (ev.key === "2") { answer("die"); }
        else if (ev.key === "3") { answer("das"); }
      } else if ((ev.key === "Enter" || ev.key === " ") && tag !== "BUTTON") {
        ev.preventDefault(); nextQuestion();
      }
    });
    showTab("practice");
  }
  init();
})();

</script>
</body>
</html>
