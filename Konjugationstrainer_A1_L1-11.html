<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Konjugationstrainer A1 · Treffpunkt L1–L11</title>
<style>

  :root {
    --bg:#f4f6fa; --card:#fff; --text:#1d2433; --muted:#5b667a; --line:#d5dbe6;
    --accent:#2b5fd9; --accent-text:#fff; --chip:#e9eef8;
    --ok:#1f7a4d; --ok-bg:#e0f3e8; --bad:#b3303f; --bad-bg:#fbe4e7; --warn-bg:#fff4d6; --mark:#fde8a6;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#12161f; --card:#1b2130; --text:#e8ecf5; --muted:#9aa5ba; --line:#30394d;
      --accent:#6b97ff; --accent-text:#0b1226; --chip:#252d40;
      --ok:#6fd6a2; --ok-bg:#183427; --bad:#ff8a98; --bad-bg:#42202a; --warn-bg:#3a3118; --mark:#6b5a1d;
    }
  }
  * { box-sizing:border-box; }
  html,body { margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; line-height:1.45; min-height:100vh; }
  .wrap { max-width:900px; margin:0 auto; padding:14px; }
  h1 { font-size:1.2rem; margin:2px 0 10px; }
  .tabs { display:flex; gap:6px; margin-bottom:12px; }
  .tab { flex:1; min-height:48px; border-radius:12px; border:2px solid var(--line); background:var(--card); color:var(--text); font-size:1rem; cursor:pointer; font-weight:600; }
  .tab.on { border-color:var(--accent); background:var(--chip); }
  .panel { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin-bottom:12px; }
  .panel h2 { font-size:.78rem; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:0 0 8px; }
  .row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .chip { display:inline-flex; align-items:center; gap:6px; min-height:44px; padding:6px 14px; border-radius:999px; background:var(--chip); border:2px solid transparent; cursor:pointer; user-select:none; font-size:.95rem; }
  .chip input { position:absolute; opacity:0; pointer-events:none; }
  .chip.on { border-color:var(--accent); font-weight:700; }
  .chip:focus-within { outline:3px solid var(--accent); outline-offset:2px; }
  .chip small { color:var(--muted); font-weight:400; }
  .small { color:var(--muted); font-size:.86rem; margin-top:6px; }
  .linkbtn { background:none; border:none; color:var(--accent); cursor:pointer; font-size:.92rem; padding:6px 4px; min-height:44px; }
  select, input[type=text], input[type=search] { min-height:44px; border-radius:10px; border:2px solid var(--line); background:var(--card); color:var(--text); font-size:1rem; padding:6px 10px; }
  label.opt { display:flex; align-items:center; gap:8px; min-height:44px; }
  button.main { width:100%; min-height:56px; border-radius:14px; border:none; cursor:pointer; font-size:1.15rem; font-weight:700; background:var(--accent); color:var(--accent-text); }
  button.main:disabled { opacity:.4; cursor:default; }
  button.sec { min-height:48px; padding:0 18px; border-radius:12px; cursor:pointer; font-size:1rem; background:var(--card); color:var(--text); border:2px solid var(--line); }
  button:focus-visible, input:focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
  .bar { height:10px; background:var(--chip); border-radius:999px; overflow:hidden; }
  .bar > i { display:block; height:100%; background:var(--accent); }
  .top { display:flex; justify-content:space-between; font-size:.9rem; color:var(--muted); margin-bottom:6px; }
  .qcard { text-align:center; padding:18px 12px 12px; }
  .qtask { font-size:.95rem; color:var(--muted); margin-bottom:6px; }
  .qmean { font-size:1.1rem; color:var(--muted); min-height:1.5em; margin-bottom:6px; }
  .qbig { font-size:clamp(2rem,9vw,3.2rem); font-weight:800; margin:8px 0 12px; word-wrap:break-word; overflow-wrap:anywhere; letter-spacing:.02em; }
  .gap { display:inline-block; min-width:1.6em; border-bottom:4px solid var(--accent); color:var(--accent); }
  .opts { display:grid; gap:10px; margin:10px 0; }
  .opts.two { grid-template-columns:1fr 1fr; }
  .opts button { min-height:68px; border-radius:14px; border:3px solid var(--line); background:var(--card); color:var(--text); font-size:1.5rem; font-weight:800; cursor:pointer; padding:6px 10px; word-wrap:break-word; overflow-wrap:anywhere; }
  .opts.rule button { font-size:1.05rem; font-weight:700; text-align:left; min-height:60px; }
  .opts button small.sub { font-size:.82rem; font-weight:500; color:var(--text); opacity:.85; margin-top:4px; }
  .opts button small { display:block; font-size:.7rem; font-weight:500; color:var(--muted); }
  .opts button.right { background:var(--ok-bg); border-color:var(--ok); color:var(--ok); }
  .opts button.wrong { background:var(--bad-bg); border-color:var(--bad); color:var(--bad); }
  .opts button:disabled { cursor:default; }
  .opts button:disabled:not(.right):not(.wrong) { opacity:.5; }
  .typebox { display:flex; gap:8px; margin:8px 0; }
  .typebox input { flex:1; font-size:1.4rem; min-width:0; }
  .typebox button { min-width:96px; }
  .umlauts { display:flex; gap:6px; justify-content:center; margin-bottom:8px; }
  .umlauts button { min-width:52px; min-height:44px; border-radius:10px; border:2px solid var(--line); background:var(--card); color:var(--text); font-size:1.2rem; cursor:pointer; }
  mark.seg { background:var(--mark); color:inherit; border-radius:4px; padding:0 2px; }
  .fb { border-radius:12px; padding:12px 14px; margin-top:6px; text-align:left; }
  .fb.ok { background:var(--ok-bg); } .fb.bad { background:var(--bad-bg); }
  .fb .big { font-size:1.3rem; font-weight:800; }
  .fb .hint { margin-top:6px; padding:8px 10px; border-radius:10px; background:var(--warn-bg); font-size:.95rem; }
  .fb s { opacity:.7; }
  .speak { min-height:44px; padding:0 14px; border-radius:999px; border:2px solid var(--line); background:var(--card); color:var(--text); cursor:pointer; font-size:.95rem; margin-bottom:6px; }
  .score { font-size:2.2rem; font-weight:800; text-align:center; }
  .rev { list-style:none; margin:8px 0 0; padding:0; }
  .rev li { padding:10px 0; border-top:1px solid var(--line); }
  .rev .pl { color:var(--muted); font-size:.92rem; }
  .rev .w { font-size:1.15rem; font-weight:700; }
  .grp h3 { font-size:1.02rem; margin:0 0 4px; }
  .grp p { margin:0 0 8px; color:var(--muted); font-size:.92rem; }
  .words { display:flex; flex-wrap:wrap; gap:6px; }
  .words span { background:var(--chip); border-radius:10px; padding:4px 10px; font-size:1rem; }
  .words span small { color:var(--muted); }
  .rowbar { display:flex; height:14px; border-radius:999px; overflow:hidden; background:var(--chip); }
  .rowbar i { display:block; height:100%; }
  .seg-s { background:var(--ok); } .seg-g { background:#e0a526; }
  table.prog { width:100%; border-collapse:collapse; font-size:.95rem; }
  table.prog td { padding:6px 4px; border-top:1px solid var(--line); vertical-align:middle; }
  table.prog td.n { width:44%; font-weight:600; }
  table.prog td.c { width:92px; text-align:right; color:var(--muted); font-size:.85rem; white-space:nowrap; }
  details summary { cursor:pointer; font-weight:600; min-height:44px; display:flex; align-items:center; }
  .rules li { margin:6px 0; }
  .hidden { display:none !important; }
  @media (max-width:560px) { .opts.two { grid-template-columns:1fr; } .wrap { padding:10px; } }

  .tr { color:var(--muted); }
  .qtask.tr { margin-top:-2px; }
  .vhead { font-size:1.15rem; margin-bottom:4px; }
  .vinf { font-weight:800; font-size:1.5rem; }
  .vmean { color:var(--muted); }
  .sent { font-size:clamp(1.5rem,6.5vw,2.2rem); letter-spacing:0; line-height:1.35; }
  .gap.okgap { color:var(--ok); border-color:var(--ok); } .gap.badgap { color:var(--bad); border-color:var(--bad); }
  .opts.two button { font-size:1.4rem; }
  .msg .de { font-weight:600; }
  .msg .tr, .hint .tr { margin-top:3px; font-size:.95rem; color:var(--text); opacity:.85; }
  .hint { margin-top:8px; }
  .hint .de { font-weight:600; font-size:.95rem; }
  .par { display:grid; grid-template-columns:1fr 1fr; gap:4px 12px; margin-top:6px; }
  .pc { padding:4px 8px; border-radius:8px; background:var(--chip); font-size:1rem; overflow-wrap:anywhere; }
  .pc small { color:var(--muted); font-size:.82rem; }
  .pc.cur { outline:2px solid var(--accent); }
  .pc .irr { color:var(--accent); font-weight:700; }
  .txt { text-align:left; font-size:1.2rem; line-height:2.5; padding:6px 2px; margin:4px 0; overflow-wrap:anywhere; }
  .vtok { font:inherit; font-weight:700; min-height:44px; padding:2px 10px; margin:0 1px; border-radius:10px; border:2px dashed var(--line); background:var(--card); color:var(--text); cursor:pointer; }
  .vtok.marked { border:2px solid var(--accent); background:var(--mark); }
  .vtok.hit { border-color:var(--ok); background:var(--ok-bg); color:var(--ok); }
  .vtok.fa { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); text-decoration:line-through; }
  .vtok.miss { border:2px dashed #e0a526; background:var(--warn-bg); }
  .vtok:disabled { cursor:default; }
  .plainv { font-weight:700; }
  .fixwrap { display:inline-block; white-space:nowrap; margin:0 2px; }
  .fixin, .fixsel { font-size:1.1rem; min-height:44px; max-width:100%; }
  .fixin { text-align:center; }
  .fixin.okfix, .fixsel.okfix { border-color:var(--ok); background:var(--ok-bg); color:var(--ok); }
  .fixin.badfix, .fixsel.badfix { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
  .corr { color:var(--ok); font-weight:700; }
  .was { color:var(--muted); text-decoration:line-through; margin-left:4px; font-size:.8rem; }
  .fixitem { margin-top:10px; padding-top:8px; border-top:1px solid var(--line); }
  .fixitem .w { font-size:1.15rem; }
  .vlist { text-align:left; margin:6px 0; }
  .vl { margin:4px 0 4px; padding-left:20px; }
  .tact { margin-top:8px; }
  .vrow { padding:8px 0; border-top:1px solid var(--line); }
  .vrow .vh { font-size:1.05rem; }
  .tagline { color:var(--muted); }
  .rule { margin:6px 0 10px; }
  .rule.tr { padding:8px 10px; border-radius:10px; background:var(--chip); }
  .tasktitle .qtask { margin-bottom:2px; }
</style>
</head>

  /* ---------- Fehlertext ---------- */
  function pickWrong(v, p) {
    var c = v.w[p].map(function (x) { return { f: x[0], t: x[1], sc: Math.random() + bonusOf(x[1]) }; });
    c.sort(function (a, b) { return b.sc - a.sc; });
    var top = c.slice(0, 3);
    return pick(top);
  }
  function buildTextTokens(t) {
    var parts = parseText(t), toks = [], vi = [];
    parts.forEach(function (pt) {
      if (pt.k) {
        var v = byKey[pt.k], form = v.f[pt.p];
        toks.push({ v: v, p: pt.p, cap: pt.cap, correct: pt.cap ? cap1(form) : form, shown: "", err: false, marked: false, fixVal: "", wt: -1, opts: null });
        vi.push(toks.length - 1);
      } else { toks.push({ s: pt.s }); }
    });
    var n = Math.max(2, Math.round(vi.length * 0.35));
    if (n > vi.length) { n = vi.length; }
    var chosen = shuffle(vi).slice(0, n);
    toks.forEach(function (tk) { if (tk.v) { tk.shown = tk.correct; } });
    chosen.forEach(function (idx) {
      var tk = toks[idx], w = pickWrong(tk.v, tk.p);
      tk.err = true; tk.wt = w.t; tk.wrong = w.f;
      tk.shown = tk.cap ? cap1(w.f) : w.f;
      var cands = shuffle(tk.v.w[tk.p].filter(function (x) { return x[0] !== w.f; }));
      cands.sort(function (a, b) { return bonusOf(b[1]) - bonusOf(a[1]); });
      var o = [{ f: tk.correct }];
      for (var k = 0; k < cands.length && o.length < 4; k++) { o.push({ f: tk.cap ? cap1(cands[k][0]) : cands[k][0] }); }
      tk.opts = shuffle(o);
    });
    return toks;
  }

    for (var l = 1; l <= LESSONS; l++) { perL[l] = { t: 0, s: 0, g: 0 }; }
    VERBS.forEach(function (x) {
      var r = rec(x.k), isS = isSure(x.k), isSeen = !!(r && r.n > 0);
      perL[x.l].t += 1;
      x.g.forEach(function (g) { perT[g].t += 1; });
      if (isSeen) {
        seen += 1;
        if (isS) { sure += 1; perL[x.l].s += 1; x.g.forEach(function (g) { perT[g].s += 1; }); }
        else { perL[x.l].g += 1; x.g.forEach(function (g) { perT[g].g += 1; }); }
        if (r.n - r.c > 0) { hard.push({ x: x, wrong: r.n - r.c, all: r.n }); }
      }
    });
    var p = el("div", "panel"); p.appendChild(el("h2", null, "Gesamt"));
    p.appendChild(el("div", null, sure + " von " + tot + " Verben sicher · " + seen + " schon geübt"));
    var rb = el("div", "rowbar"); rb.style.marginTop = "8px";
    var s1 = el("i", "seg-s"); s1.style.width = (100 * sure / tot) + "%";
    var s2 = el("i", "seg-g"); s2.style.width = (100 * (seen - sure) / tot) + "%";
    rb.appendChild(s1); rb.appendChild(s2); p.appendChild(rb);
    p.appendChild(el("div", "small", "„sicher“ = zuletzt mindestens zweimal hintereinander richtig. Grün: sicher · Gelb: geübt, aber noch nicht sicher."));
    var tdone = 0; TEXTS.forEach(function (t) { if (store.texts[t.id]) { tdone += 1; } });
    p.appendChild(el("div", "small", "Fehlertexte bearbeitet: " + tdone + " von " + TEXTS.length));
    v.appendChild(p);

    var p2 = el("div", "panel"); p2.appendChild(el("h2", null, "Nach Thema"));
    var tb = el("table", "prog");
    TAGS.forEach(function (k) { var d = perT[k.id]; barRow(tb, k.label, d.t, d.s, d.g, d.s + " / " + d.t + " sicher"); });
    p2.appendChild(tb); v.appendChild(p2);

    var p2b = el("div", "panel"); p2b.appendChild(el("h2", null, "Nach Lektion"));
    var tb2 = el("table", "prog");
    for (var k2 = 1; k2 <= LESSONS; k2++) { var d2 = perL[k2]; barRow(tb2, "Lektion " + k2, d2.t, d2.s, d2.g, d2.s + " / " + d2.t + " sicher"); }
    p2b.appendChild(tb2); v.appendChild(p2b);

    var p3 = el("div", "panel"); p3.appendChild(el("h2", null, "Schwierigste Verben"));
    hard.sort(function (a, b) { return b.wrong - a.wrong || b.all - a.all; });
    if (!hard.length) { p3.appendChild(el("div", "small", "Noch keine Fehler – oder noch nichts geübt.")); }
    else {
      var ul = el("ul", "rev");
      hard.slice(0, 10).forEach(function (h) {
        var li = el("li"); li.appendChild(el("div", "w", infShown(h.x)));
        li.appendChild(el("div", "pl", h.wrong + " von " + h.all + " falsch")); ul.appendChild(li);
      });
      p3.appendChild(ul);
    }
    v.appendChild(p3);
    var p4 = el("div", "panel");
    var rs = el("button", "sec", "Fortschritt zurücksetzen"); rs.type = "button";
    rs.addEventListener("click", function () {
      if (window.confirm("Gesamten Fortschritt löschen? Das kann nicht rückgängig gemacht werden.")) { store.verbs = {}; store.texts = {}; save(); renderProg(); }
    });
    p4.appendChild(rs); v.appendChild(p4);
  }

  /* ---------- Tabs & Tastatur ---------- */
  var tab = "practice";
  function showTab(t) {
    tab = t;
    $("viewPractice").className = t === "practice" ? "" : "hidden";
    $("viewList").className = t === "list" ? "" : "hidden";
    $("viewProg").className = t === "prog" ? "" : "hidden";
    $("tabPractice").className = "tab" + (t === "practice" ? " on" : "");
    $("tabList").className = "tab" + (t === "list" ? " on" : "");
    $("tabProg").className = "tab" + (t === "prog" ? " on" : "");
    if (t === "practice") { renderPractice(); } else if (t === "list") { renderList(); } else { renderProg(); }
  }
  function init() {
    load();
    $("tabPractice").addEventListener("click", function () { showTab("practice"); });
    $("tabList").addEventListener("click", function () { showTab("list"); });
    $("tabProg").addEventListener("click", function () { showTab("prog"); });
    document.addEventListener("keydown", function (ev) {
      if (tab !== "practice" || !session || session.pos >= session.queue.length) { return; }
      var tag = ev.target && ev.target.tagName;
      var fmt = session.current ? session.current.fmt : "";
      if (tag === "INPUT" || tag === "SELECT") {
        if (tag === "INPUT" && ev.target.id === "typeInput" && session.answered && ev.key === "Enter") { ev.preventDefault(); nextQuestion(); }
        return;
      }
      if (fmt === "text") { return; }
      if (!session.answered) {
        var row = $("optRow");
        if (row && ev.key >= "1" && ev.key <= "4") {
          var b = row.getElementsByTagName("button")[parseInt(ev.key, 10) - 1];
          if (b) { b.click(); }
        }
      } else if ((ev.key === "Enter" || ev.key === " ") && tag !== "BUTTON") { ev.preventDefault(); nextQuestion(); }
    });
    showTab("practice");
  }
  init();
})();
</script>
</body>
</html>
