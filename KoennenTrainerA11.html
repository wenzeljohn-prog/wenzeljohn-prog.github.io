<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>können – Trainer A1.1</title>
<style>
:root{--bg:#f3f5fa;--card:#fff;--ink:#1c2333;--mut:#586179;--line:#d5dbe8;--pri:#1f5fd6;--inf:#d4470a;--kl:#6f3fc4;--ok:#1a8f4b;--bad:#c62828;--okbg:#e5f6ec;--badbg:#fdeaea}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
#wrap{max-width:860px;margin:0 auto;padding:10px 14px 70px}
#hdr{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0 10px}
#hdr .logo{font-weight:700;color:var(--pri);font-size:15px}
#hdr select{font:inherit;font-size:15px;padding:6px 8px;border:2px solid var(--line);border-radius:10px;background:#fff;max-width:55%}
h1{font-size:26px;margin:6px 0 2px}
h2{font-size:21px;margin:18px 0 8px}
h3{font-size:18px;margin:0 0 4px}
p{margin:6px 0}
.de{display:block}
.tl{display:block;color:var(--mut);font-size:.9em;margin-top:2px;line-height:1.35}
.tl[dir=rtl]{text-align:right;font-size:1em}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin:10px 0;box-shadow:0 1px 2px rgba(20,30,60,.05)}
.card.rule{border-left:6px solid var(--pri)}
.card.tip{border-left:6px solid var(--inf);background:#fff8f3}
.btn{font:inherit;color:var(--ink);border:2px solid var(--line);background:#fff;border-radius:12px;padding:9px 14px;cursor:pointer;text-align:center;-webkit-appearance:none;appearance:none;touch-action:manipulation}
.btn:active{background:#eef2fb}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.pri .tl{color:#e6eeff}
.btn.sm{padding:6px 10px;font-size:15px}
.btn:disabled{opacity:.45;cursor:default}
.btn.sel{border-color:var(--pri);background:#e7efff}
.btn.good,.chip.good{border-color:var(--ok);background:var(--okbg)}
.btn.bad,.chip.bad{border-color:var(--bad);background:var(--badbg)}
.row{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0}
.row .btn{flex:1 1 150px}
.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin:14px 0}
.menu .btn{text-align:left;padding:14px 16px;border-radius:16px;background:#fff}
.menu .btn .t{font-weight:700;font-size:19px;display:block}
.menu .btn .s{color:var(--mut);font-size:15px;display:block}
.menu .btn .pg{display:inline-block;margin-top:6px;font-size:13px;color:var(--ok);font-weight:700}
.tabs{display:flex;gap:8px;margin:8px 0}
.tabs .btn{flex:1}
.tabs .btn.on{background:var(--pri);border-color:var(--pri);color:#fff}
.tabs .btn.on .tl{color:#e6eeff}
.tb{display:flex;align-items:center;gap:10px;margin:4px 0 6px}
.tb .ttl{font-weight:700;font-size:18px;flex:1}
.prog{flex:1;height:10px;background:#dde3f1;border-radius:6px;overflow:hidden}
.prog div{height:100%;background:var(--pri);transition:width .3s}
.cnt{font-size:15px;color:var(--mut);min-width:56px;text-align:right}
.instr{color:var(--mut);margin-bottom:8px}
.big{font-size:23px;line-height:1.4;margin:10px 0 14px;direction:ltr}
.sit{background:#f1f4fb;border-radius:12px;padding:10px 12px;margin:8px 0 12px}
.opts{display:grid;gap:10px}
.opts.two{grid-template-columns:1fr 1fr}
.opts .btn{font-size:19px;text-align:left}
.gapbox{display:inline-block;min-width:76px;border-bottom:3px solid var(--pri);text-align:center;color:var(--pri);font-weight:700;margin:0 4px}
.ctx{color:var(--mut);font-size:15px;margin-bottom:2px}
input.inp{font:inherit;font-size:22px;padding:8px 10px;border:2px solid var(--line);border-radius:10px;width:170px;max-width:60%}
.fb{border-radius:14px;padding:12px 14px;margin:12px 0}
.fb.good{background:var(--okbg);border:2px solid var(--ok)}
.fb.bad{background:var(--badbg);border:2px solid var(--bad)}
.fb .h{font-weight:700;margin-bottom:4px}
.fix{margin-top:6px;font-size:19px;direction:ltr}
table.conj{border-collapse:collapse;width:100%;margin:8px 0;direction:ltr}
table.conj td,table.conj th{border:1px solid var(--line);padding:8px 10px;vertical-align:middle;text-align:left}
table.conj th{background:#eef2fb;font-size:14px;color:var(--mut)}
table.conj td.f{font-size:22px;font-weight:700}
table.conj td .tl{font-size:12.5px;font-weight:400}
table.conj td .tl[dir=rtl]{text-align:left;direction:rtl;unicode-bidi:plaintext}
table.conj u{text-decoration:none;color:var(--pri)}
table.conj i{font-style:normal;color:var(--inf)}
table.conj input{font:inherit;font-size:20px;width:100%;padding:6px 8px;border:2px solid var(--line);border-radius:8px}
table.conj input.good{border-color:var(--ok);background:var(--okbg)}
table.conj input.bad{border-color:var(--bad);background:var(--badbg)}
.corr{font-size:13px;color:var(--ok);font-weight:700}
.ex{margin:8px 0;padding:8px 10px;background:#f6f8fd;border-radius:10px}
.exde{display:block;font-size:19px;font-weight:600;direction:ltr}
.sent{direction:ltr;display:flex;flex-wrap:wrap;align-items:flex-end;gap:6px;padding:16px 0 4px;overflow-x:auto}
.cw{display:inline-flex;flex-direction:column;align-items:center}
.sub{font-size:11px;line-height:14px;min-height:14px;color:var(--mut);white-space:nowrap}
.chip{white-space:nowrap;display:inline-block;font:inherit;font-size:19px;color:var(--ink);border:2px solid var(--line);background:#fff;border-radius:10px;padding:6px 11px;-webkit-appearance:none;appearance:none}
button.chip{cursor:pointer;touch-action:manipulation}
.chip.sel{border-color:var(--pri);background:#e7efff}
.chip.v{border-color:var(--pri);background:#e7efff;color:#0f3f9e;font-weight:700}
.chip.i{border-color:var(--inf);background:#ffece4;color:#9a3308;font-weight:700}
.chip.ghost{border-style:dashed;color:var(--inf);border-color:var(--inf);background:#fff}
.kl{position:relative;display:inline-flex;flex-wrap:nowrap;align-items:flex-end;gap:6px;padding:20px 8px 0;margin:0 2px}
.kl:before{content:"";position:absolute;left:0;right:0;top:9px;height:13px;border:3px solid var(--kl);border-bottom:0;border-radius:10px 10px 0 0}
.klab{position:absolute;top:-9px;left:50%;margin-left:-40px;width:80px;text-align:center;font-size:12px;font-weight:700;color:var(--kl);white-space:nowrap;background:var(--card)}
.kl.anim:before{transform-origin:left center;animation:grow .7s ease-out}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.bank{display:flex;flex-wrap:wrap;gap:8px;direction:ltr;margin:10px 0}
.ans{min-height:58px;border:2px dashed #aab5d0;border-radius:12px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;direction:ltr;margin:8px 0;align-items:center}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0;font-size:14px}
.legend span{border-radius:8px;padding:2px 8px;border:2px solid}
.legend .a{border-color:var(--pri);background:#e7efff;color:#0f3f9e}
.legend .b{border-color:var(--inf);background:#ffece4;color:#9a3308}
.legend .c{border-color:var(--kl);color:var(--kl)}
.sum li{margin:8px 0}
.wrongs{padding-left:20px}
.score{font-size:40px;font-weight:800;color:var(--pri)}
.stepbar{display:flex;gap:6px;margin:8px 0}
.stepbar i{flex:1;height:8px;border-radius:5px;background:#dde3f1}
.stepbar i.on{background:var(--kl)}
.gl{font-size:13px;color:var(--mut)}
@media (max-width:520px){
 body{font-size:16px}
 .big{font-size:20px}
 .chip{font-size:15px;padding:4px 6px}
 .sent{flex-wrap:nowrap}
 .kl{padding-left:4px;padding-right:4px}
 .kl{gap:4px;padding-left:5px;padding-right:5px}
 .sent{gap:4px}
 .opts.two{grid-template-columns:1fr}
 h1{font-size:23px}
}
.btn.good:disabled,.btn.bad:disabled,.chip.good:disabled,.chip.bad:disabled{opacity:1}
.gapbox.good{color:var(--ok);border-color:var(--ok)}
.gapbox.bad{color:var(--bad);border-color:var(--bad)}
</style>
</head>

function pick(pool,n){
  var a=pool.slice(),out=[],i,tot,r;
  while(out.length<n&&a.length){
    tot=0;for(i=0;i<a.length;i++){tot+=wt(a[i]);}
    r=Math.random()*tot;
    for(i=0;i<a.length;i++){r-=wt(a[i]);if(r<=0){break;}}
    if(i>=a.length){i=a.length-1;}
    out.push(a.splice(i,1)[0]);
  }
  return out;
}

function newCur(it){
  var c={done:false,ok:false,fb:""},i,o;
  if(it.kind==="mc"){c.order=[];for(i=0;i<it.opts.length;i++){c.order.push(i);}if(!it.fixed){c.order=shuf(c.order);}}
  else if(it.kind==="gap"){c.order=shuf(["kann","kannst","können","könnt"]);c.typed="";}
  else if(it.kind==="mark"){c.sel=[];}
  else if(it.kind==="build"){
    var sb=SBY[it.sid],idx=[],tries=0,same;
    for(i=0;i<sb.parts.length;i++){idx.push(i);}
    do{o=shuf(idx);same=true;for(i=0;i<o.length;i++){if(o[i]!==i){same=false;}}tries++;}while(same&&tries<8);
    c.bank=o;c.seq=[];
  }
  return c;
}
function startSession(exId,items){
  var ex=EX[exId],pool=items||(ex.items?ex.items():[]);
  var list=items?items:(ex.fresh?pool:pick(pool,Math.min(ex.n,pool.length)));
  Sess={ex:exId,items:list,i:0,ok:0,wrong:[],cur:null};
  Sess.cur=newCur(list[0]);
  S.page="sess";render();window.scrollTo(0,0);
}
function renderSess(){
  var it=Sess.items[Sess.i],c=Sess.cur;
  var pct=Math.round(Sess.i/Sess.items.length*100);
  var h='<div class="tb"><button class="btn sm" data-act="exit">'+LB(T.back)+'</button><div class="prog"><div style="width:'+pct+'%"></div></div><div class="cnt">'+(Sess.i+1)+' / '+Sess.items.length+'</div></div>';
  h+='<div class="card">'+R[it.kind](it,c)+'</div>';
  if(c.done){
    h+='<div class="fb '+(c.ok?"good":"bad")+'"><div class="h">'+L(c.ok?T.okH:T.badH)+'</div>'+c.fb+'</div>';
    h+='<button class="btn pri" style="width:100%" data-act="nxt">'+L(Sess.i+1<Sess.items.length?T.next:T.result)+'</button>';
  }
  $("app").innerHTML=h;
  var inp=$("inp");if(inp&&!c.done){lastInp=inp;try{inp.focus();}catch(e){}}
}
function finish(it,ok,fb){
  var c=Sess.cur;c.done=true;c.ok=ok;c.fb=fb;
  if(ok){Sess.ok++;}else{Sess.wrong.push(it);}
  rec(it,ok);
  renderSess();
}

  }
  return h;
};
R.tf=function(it,c){
  var h='<div class="instr">'+L(T.tfI)+'</div><div class="big">'+esc(it.s)+'</div><div class="opts two">',v,cls;
  for(v=1;v>=0;v--){
    cls="";
    if(c.done){if((v===1)===it.ok){cls=" good";}else if(v===c.pickV){cls=" bad";}}
    h+='<button class="btn'+cls+'" data-act="tfa" data-v="'+v+'"'+(c.done?" disabled":"")+'>'+L(v===1?T.right:T.wrong)+'</button>';
  }
  return h+'</div>';
};
R.mark=function(it,c){
  var sb=SBY[it.sid],h='<div class="instr">'+L(T.markI)+'</div>',i,txt,sel;
  if(c.done){return h+sentHTML(sb,{color:true,anim:true})+legend();}
  h+='<div class="sent" dir="ltr">';
  for(i=0;i<sb.parts.length;i++){
    txt=sb.parts[i];if(i===0){txt=capFirst(txt);}if(i===sb.parts.length-1){txt+=sb.p;}
    sel=(c.sel.indexOf(i)>=0)?" sel":"";
    h+='<span class="cw"><button class="chip'+sel+'" data-act="mchip" data-i="'+i+'">'+esc(txt)+'</button><span class="sub">&nbsp;</span></span>';
  }
  h+='</div><div class="row"><button class="btn pri" data-act="mchk"'+(c.sel.length===2?"":" disabled")+'>'+L(T.check)+'</button></div>';
  return h;
};
R.build=function(it,c){
  var sb=SBY[it.sid],h='<div class="instr">'+L(T.buildI)+'</div>',i,k,cls,ch;
  h+='<div class="ans" id="ans">';
  for(i=0;i<c.seq.length;i++){
    k=c.seq[i];cls=c.done?(c.ok?" good":" bad"):"";
    h+='<button class="chip'+cls+'" data-act="bchip" data-i="'+i+'"'+(c.done?" disabled":"")+'>'+esc(sb.parts[k])+'</button>';
  }
  h+='</div>';
  if(!c.done){
    h+='<div class="bank">';
    for(i=0;i<c.bank.length;i++){
      k=c.bank[i];
      if(c.seq.indexOf(k)<0){h+='<button class="chip" data-act="badd" data-k="'+k+'">'+esc(sb.parts[k])+'</button>';}
    }
    h+='</div><div class="row"><button class="btn" data-act="bclr"'+(c.seq.length?"":" disabled")+'>'+L(T.clear)+'</button><button class="btn pri" data-act="bchk"'+(c.seq.length===sb.parts.length?"":" disabled")+'>'+L(T.check)+'</button></div>';
  }else{
    h+=sentHTML(sb,{color:true,anim:true})+legend();
  }
  return h;
};
function summ(it){
  var sb,s;
  if(it.kind==="mc"){return it.sent?esc(it.sent)+" → <b>"+L(CAT[it.cat].t)+"</b>":esc(it.prompt)+" → <b>"+esc(it.opts[0])+"</b>";}
  if(it.kind==="gap"){s=(it.pre?it.pre+" ":"")+it.ans+" "+it.post;return "<b>"+esc(capFirst(s))+"</b>";}
  if(it.kind==="tf"){return it.ok?"<b>"+esc(it.s)+"</b>":esc(it.s)+" → <b>"+esc(it.fix)+"</b>";}
  sb=SBY[it.sid];return "<b>"+esc(sbText(sb))+"</b>";
}
function gapSentence(it){var s=(it.pre?it.pre+" ":"")+it.ans+" "+it.post;return capFirst(s);}
function doGap(it,form){
  var ok=form===it.ans;
  var fb='<div class="fix">'+esc(gapSentence(it))+'</div><div class="gl">'+esc(HINT[it.ans])+'</div>';
  finish(it,ok,fb);
}
function builtList(it,c){var sb=SBY[it.sid],a=[],i;for(i=0;i<c.seq.length;i++){a.push(sb.parts[c.seq[i]]);}return a;}
function arrEq(a,b){return a.join("|")===b.join("|");}
function act(a,el){
  var it=Sess&&Sess.items?Sess.items[Sess.i]:null,c=Sess?Sess.cur:null,i,sb,b,ok,fb,v,val;
  if(a==="home"){S.page="home";render();window.scrollTo(0,0);}
  else if(a==="mod"){
    var m=modBy(el.getAttribute("data-m"));
    if(m.direct==="mix"){startSession("mix");return;}
    if(m.direct==="rules"){S.page="rules";render();window.scrollTo(0,0);return;}
    S.mod=m.id;S.tab=m.noexp?"ex":"exp";S.step=0;S.page="mod";render();window.scrollTo(0,0);
  }
  else if(a==="tab"){S.tab=el.getAttribute("data-t");render();window.scrollTo(0,0);}
  else if(a==="step"){S.step=Math.max(0,Math.min(3,S.step+parseInt(el.getAttribute("data-d"),10)));render();}
  else if(a==="ex"){
    var id=el.getAttribute("data-e");
    if(EX[id].table){S.tbl={vals:[],checked:false};S.exid=id;S.page="tab";render();window.scrollTo(0,0);}
    else{startSession(id);}
  }
  else if(a==="exit"||a==="exitmod"){
    if(Sess&&Sess.ex==="mix"&&a==="exit"){S.page="home";}else{S.page="mod";S.tab="ex";}
    render();window.scrollTo(0,0);
  }
  else if(a==="resetprog"){if(window.confirm("Fortschritt wirklich löschen?")){STAT={};save();render();}}
  else if(a==="oe"){
    if(lastInp&&!lastInp.disabled&&!lastInp.readOnly){lastInp.value+="ö";try{lastInp.focus();}catch(e){}if(lastInp.id==="inp"&&c){c.typed=lastInp.value;}}
  }
  else if(a==="tabchk"){
    S.tbl.vals=[];for(i=0;i<7;i++){S.tbl.vals.push($("t"+i).value);}
    S.tbl.checked=true;render();
  }
  else if(a==="tabrst"){S.tbl={vals:[],checked:false};render();}
  else if(a==="opt"){
    i=parseInt(el.getAttribute("data-i"),10);c.pick=i;ok=(i===it.a);
    fb='<div class="fix"><b>'+L(CAT[it.cat].t)+'</b></div>'+L(CAT[it.cat].d);
    if(it.prompt){fb='<div class="fix">'+esc(it.opts[0])+'</div>'+fb;}
    finish(it,ok,fb);
  }
  else if(a==="gopt"){c.pickF=el.getAttribute("data-f");doGap(it,c.pickF);}
  else if(a==="gchk"){
    val=trim($("inp").value);c.typed=val;
    if(val===""){return;}
    ok=tblOk(val,it.ans);
    doGap(it,ok?it.ans:"–");
  }
  else if(a==="tfa"){
    v=parseInt(el.getAttribute("data-v"),10);c.pickV=v;ok=((v===1)===it.ok);
    if(it.ok){fb='<div>'+L(T.itIsRight)+'</div>';}
    else{fb='<div>'+L(FB[it.err])+'</div><div class="fix">'+L(T.plus)+' <b>'+esc(it.fix)+'</b></div>';}
    finish(it,ok,fb);
  }
  else if(a==="mchip"){
    i=parseInt(el.getAttribute("data-i"),10);b=c.sel.indexOf(i);
    if(b>=0){c.sel.splice(b,1);}else if(c.sel.length<2){c.sel.push(i);}
    renderSess();
  }
  else if(a==="mchk"){
    sb=SBY[it.sid];ok=(c.sel.length===2&&c.sel.indexOf(sb.vi)>=0&&c.sel.indexOf(sb.ii)>=0);
    fb='<div>'+L(sb.type==="J"?FB.pos1:FB.pos2)+'</div><div>'+L(FB.end)+'</div>';
    finish(it,ok,fb);
  }
  else if(a==="badd"){c.seq.push(parseInt(el.getAttribute("data-k"),10));renderSess();}
  else if(a==="bchip"){c.seq.splice(parseInt(el.getAttribute("data-i"),10),1);renderSess();}
  else if(a==="bclr"){c.seq=[];renderSess();}
  else if(a==="bchk"){
    sb=SBY[it.sid];b=builtList(it,c);ok=arrEq(b,sb.parts);
    for(i=0;i<sb.alt.length&&!ok;i++){if(arrEq(b,sb.alt[i])){ok=true;}}
    if(ok){fb='<div class="fix">'+esc(capFirst(b.join(" "))+sb.p)+'</div>';}
    else{
      var pos=(sb.type==="J"?0:1),hint;
      if(b.indexOf(sb.parts[sb.vi])!==pos){hint=(sb.type==="J"?FB.pos1:FB.pos2);}
      else if(b[b.length-1]!==sb.parts[sb.ii]){hint=FB.end;}
      else{hint=FB.mid;}
      fb='<div>'+L(hint)+'</div><div class="fix">'+L(T.plus)+' <b>'+esc(sbText(sb))+'</b></div>';
    }
    finish(it,ok,fb);
  }
  else if(a==="nxt"){
    if(Sess.i+1<Sess.items.length){Sess.i++;Sess.cur=newCur(Sess.items[Sess.i]);renderSess();window.scrollTo(0,0);}
    else{S.page="res";render();window.scrollTo(0,0);}
  }
  else if(a==="rep"){var w=shuf(Sess.wrong);startSession(Sess.ex,w);}
  else if(a==="again"){startSession(Sess.ex);}
}
function renderRes(){
  var n=Sess.items.length,pct=Math.round(Sess.ok/n*100),msg=pct>=90?T.vg:(pct>=60?T.gut:T.more),i,seen={},h;
  h='<div class="card" style="text-align:center"><div class="gl">'+L(T.result)+'</div><div class="score">'+Sess.ok+' / '+n+'</div><h2>'+L(msg)+'</h2></div>';
  if(Sess.wrong.length){
    h+='<div class="card"><h3>'+L(T.mist)+'</h3><ul class="wrongs">';
    for(i=0;i<Sess.wrong.length;i++){if(!seen[Sess.wrong[i].id]){seen[Sess.wrong[i].id]=1;h+='<li style="font-size:18px">'+summ(Sess.wrong[i])+'</li>';}}
    h+='</ul></div>';
  }
  h+='<div class="row">';
  if(Sess.wrong.length){h+='<button class="btn pri" data-act="rep">'+L(T.rep)+'</button>';}
  h+='<button class="btn" data-act="again">'+L(T.again)+'</button><button class="btn" data-act="exit">'+L(T.toMod)+'</button></div>';
  $("app").innerHTML=h;
}
function render(){
  var p=S.page;
  if(p==="home"){rHome();}else if(p==="mod"){rMod();}else if(p==="sess"){renderSess();}
  else if(p==="res"){renderRes();}else if(p==="tab"){rTab();}else if(p==="rules"){rRules();}
}

/* ---------- Start ---------- */
function init(){
  load();
  var sel=$("lang"),i,o,h="";
  for(i=0;i<LANGS.length;i++){h+='<option value="'+LANGS[i][0]+'">'+(i===0?"🌐 ":"")+LANGS[i][1]+'</option>';}
  sel.innerHTML=h;sel.value=S.lang;
  sel.addEventListener("change",function(){S.lang=sel.value;save();render();});
  var app=$("app");
  app.addEventListener("click",function(e){
    var t=e.target;
    while(t&&t!==app&&!(t.getAttribute&&t.getAttribute("data-act"))){t=t.parentNode;}
    if(!t||t===app||t.disabled){return;}
    act(t.getAttribute("data-act"),t);
  });
  app.addEventListener("focusin",function(e){if(e.target&&e.target.tagName==="INPUT"){lastInp=e.target;}});
  app.addEventListener("keydown",function(e){
    if((e.key==="Enter"||e.keyCode===13)&&e.target&&e.target.id==="inp"){
      var c=Sess&&Sess.cur;if(c&&!c.done){act("gchk",e.target);}
    }
  });
  render();
}
init();
})();
</script>
