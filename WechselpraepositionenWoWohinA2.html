<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wo? Wohin? Wechselpräpositionen (A2, Lektion 4)</title>
<style>
:root{--g:#84c341;--gd:#5f9f26;--gs:#eef6e0;--navy:#2f3f98;--hand:#3a46a6;--cyan:#00a9e6;--coral:#ee5a3a;--ink:#1d1d1b;--muted:#555;--line:#e2e2e2;--peach:#e3c4b4;--ok:#15803d;--ok-soft:#dcfce7;--bad:#b91c1c;--bad-soft:#fee2e2;--warn-soft:#fef3c7;--shadow:0 1px 2px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.05)}
*{box-sizing:border-box;border-radius:0 !important}
html{font-size:17px}
@media(min-width:1500px){html{font-size:20px}}
@media(min-width:2200px){html{font-size:26px}}
@media(min-width:3200px){html{font-size:34px}}
body{margin:0;font:1.05rem/1.5 "TPSans","Fira Sans","Source Sans 3","Segoe UI",Calibri,Carlito,system-ui,-apple-system,sans-serif;background:#fff;color:var(--ink);-webkit-text-size-adjust:100%}
button,select,input{font-family:inherit;color:inherit;touch-action:manipulation}
[hidden]{display:none!important}
.wrap,main,.navp{max-width:70rem;margin:0 auto}
header.top .wrap{position:relative;padding:1rem 1rem .8rem 8rem;min-height:7rem}
header.top .chnum{position:absolute;left:0;top:0;bottom:0;width:6.5rem;background:var(--g);color:#fff;font-size:3rem;font-weight:700;display:flex;align-items:center;justify-content:center}
.kicker{color:var(--muted);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:.75rem}
h1{color:var(--gd);font-size:2.4rem;margin:0 0 .3rem;line-height:1.15}
.progress{display:flex;align-items:center;gap:.8rem;flex-wrap:wrap;font-weight:600;font-size:.9rem}
.bar{flex:1;min-width:7rem;max-width:20rem;height:.55rem;background:#e4efd3}.bar i{display:block;height:100%;background:var(--g);width:0;transition:width .3s}
nav.jump{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.97);border-bottom:2px solid var(--g)}
nav.jump .wrap{padding:.4rem .8rem;display:flex;align-items:center;flex-wrap:wrap;gap:.5rem}.sp{flex:1}
.navbtn{font-weight:700;font-size:.95rem;padding:.3rem .9rem;border:2px solid var(--g);background:#fff;cursor:pointer;min-height:2.5rem}
.navbtn[aria-expanded=true]{background:var(--g)}
select{font-size:1rem;padding:.35rem .5rem;border:2px solid var(--line);background:#fff;min-height:2.5rem}
.navp{padding:.4rem .8rem .6rem;border-top:4px solid var(--navy)}
.nb{min-height:2.5rem;min-width:2.5rem;padding:.2rem .7rem;border:2px solid var(--line);background:#fff;font-size:1rem;margin:.15rem .3rem .15rem 0;cursor:pointer;font-weight:600}
.nb.ok{background:var(--ok-soft);border-color:var(--ok)}.nb.cur{outline:3px solid var(--gd);outline-offset:1px}.nb.on{background:var(--gd);border-color:var(--gd);color:#fff}
main{padding:.9rem .7rem 3rem}
.card{background:#fff;border:1px solid var(--line);border-top:5px solid var(--gd);box-shadow:var(--shadow);padding:1rem 1.1rem}
.card.disc{border:2px dashed var(--gd);background:linear-gradient(180deg,#fcfef8,#f4f9ea);box-shadow:none}
.dtag{font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;font-weight:700;color:var(--gd)}
h2{font-size:1.45rem;margin:0 0 .4rem;color:var(--gd);line-height:1.3}p{margin:0 0 .6rem}
.x .de{display:block}.x .tr{display:block;font-size:.88em;font-weight:400;color:var(--hand);margin-top:.1rem}
[dir=rtl]{text-align:right}
.grid2,.items{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.8rem;direction:ltr}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.8rem;direction:ltr}
.cell,.item{background:#fff;border:1px solid var(--line);padding:.5rem;position:relative;min-width:0}
.pic{margin:0;border:3px solid var(--navy);line-height:0}.pic.mv{border-color:var(--coral)}
.pic svg{width:100%;height:auto;display:block;font-family:inherit}
.qt{display:inline-block;font-weight:700;color:#fff;padding:.05rem .7rem;background:var(--navy);font-size:.95rem}.qt.wohin{background:var(--coral)}.qt.letter{background:#333}
.cell .qt+.pic{margin-top:0}
.sent{font-size:1.15rem;font-weight:600;margin:.5rem 0 .2rem}
.item .num{position:absolute;left:0;top:0;z-index:2;background:var(--gd);color:#fff;font-weight:700;padding:.1rem .6rem}
.item.done{border-color:var(--ok);box-shadow:0 0 0 2px var(--ok-soft)}
.base{font-size:.9rem;color:var(--muted);font-weight:700;margin:.15rem 0 .4rem}
.gap{display:inline-block;min-width:4.5rem;border-bottom:3px dashed #a99d88;text-align:center}.gap.filled{border:none;background:var(--ok-soft);padding:0 .4rem}
.blank{color:var(--muted)}
.w{display:inline-block;margin:.2rem .35rem .2rem 0;padding:.35rem .8rem;border:2px solid var(--peach);background:#fff;font-size:1.1rem;cursor:pointer;min-height:2.8rem;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.w.big{min-width:8rem;font-weight:700}
.w:hover{border-color:var(--gd)}.w:disabled{cursor:default}
.w.bad,.opt.bad,select.bad,input.bad{border-color:var(--bad);background:var(--bad-soft)}
.w.good,.opt.good,select.good,input.good{border-color:var(--ok);background:var(--ok-soft)}
.w.mark{background:#fde68a;border-color:#f59e0b;font-weight:700}
mark{background:#fde68a;padding:0 .15rem}
u{text-decoration-color:#f59e0b;text-decoration-thickness:4px;text-underline-offset:4px;font-weight:700}
s.l{text-decoration:none;color:var(--muted)}
.q{margin-top:1rem;border-top:2px solid var(--gs);padding-top:.7rem}.qh{font-weight:700}
.row{margin:.2rem 0;direction:ltr}
.opt{display:block;width:100%;text-align:left;min-height:2.8rem;padding:.4rem .8rem;margin:.35rem 0;border:2px solid var(--line);background:#fff;font-size:1.02rem;cursor:pointer}
.btn{display:inline-block;min-height:2.8rem;padding:.4rem 1.2rem;border:2px solid var(--gd);background:var(--gd);color:#fff;font-size:1rem;font-weight:700;cursor:pointer;margin:.6rem .5rem .2rem 0;vertical-align:top}
.btn .tr{font-size:.8rem;color:#fff;text-align:center}.btn.sec{background:#fff;color:var(--ink);border-color:var(--line)}.btn.sec .tr{color:var(--hand)}.btn:disabled{opacity:.45;cursor:default}
.msg{font-size:.96rem;margin:.5rem 0;padding:.45rem .7rem}
.msg.no{background:var(--bad-soft);color:#7f1d1d}.msg.ok{background:var(--ok-soft);color:#14532d}.msg.info{background:var(--warn-soft);color:#78350f}
.msg .tr{color:inherit!important}
.rule{margin-top:1rem;padding:.7rem .9rem;background:var(--ok-soft);color:#14532d;border-left:5px solid var(--ok)}
.rule .tr{color:#14532d!important}.rule .h{display:block;font-size:.76rem;text-transform:uppercase;letter-spacing:.1em;margin-bottom:.3rem}
.formula span{display:inline-block;padding:.3rem .8rem;margin:.5rem .5rem 0 0;color:#fff;font-weight:700;background:var(--navy)}.formula .wh{background:var(--coral)}
.pair{margin:.9rem 0;border-top:2px solid var(--gs);padding-top:.5rem}.pair .base{color:var(--gd);font-size:1.05rem}
.tab{border-collapse:collapse;width:100%;max-width:40rem}.tab th,.tab td{border:1px solid #cdd9bb;padding:.35rem .5rem;text-align:left;background:#fff}
.tab th.wo{background:var(--navy);color:#fff}.tab th.wh{background:var(--coral);color:#fff}.tab select{width:100%}
.prbar{margin:.8rem 0 .6rem}
.typed{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}.typed input{font-size:1.2rem;padding:.4rem .6rem;border:2px solid var(--peach);min-width:0;flex:1;min-height:2.8rem;background:#fff}.typed .btn{margin:0}
.score{font-size:2.2rem;font-weight:700;color:var(--gd)}
table{width:100%}td{padding:.3rem .2rem;border-bottom:1px solid #eee}
@media(max-width:760px){.grid2,.grid3,.items{grid-template-columns:1fr}header.top .wrap{padding-left:5.4rem}header.top .chnum{width:4.4rem;font-size:2rem}h1{font-size:1.8rem}.card{padding:.8rem .6rem}}
</style>

var ANIM=[], uid=0;
function scene(key,dir,opt){
  /* dir: 'wo' | 'wohin' */
  var s=SC[key], o=O[s.o], to=s.to||o.to, from=s.from||o.from, id='a'+(++uid), mv=dir==='wohin';
  var fig=(mv&&s.am)?s.am:s.a;
  var svg='<svg viewBox="0 0 400 250" role="img" aria-label="'+(opt&&opt.alt?opt.alt:(mv?'Bild mit Bewegung':'Bild ohne Bewegung'))+'">'+o.back();
  if(mv){
    var mx=(from[0]+to[0])/2, my=s.mode==='fly'?Math.max(12,Math.min(from[1],to[1])-55):(from[1]+to[1])/2;
    var path = s.mode==='fly' ? 'M'+from[0]+' '+(from[1]-14)+' Q'+mx+' '+my+' '+to[0]+' '+(to[1]-14) : 'M'+from[0]+' '+(from[1]-12)+' L'+to[0]+' '+(to[1]-12);
    svg+='<g id="'+id+'" data-from="'+from+'" data-to="'+to+'" data-mode="'+s.mode+'" data-my="'+my+'" transform="translate('+to+')">'+A[fig]()+'</g>';
    if(o.front) svg+=o.front();
    var ang=s.mode==='fly'?Math.atan2((to[1]-14)-my,to[0]-mx):Math.atan2(to[1]-from[1],to[0]-from[0]);
    var ex=to[0], ey=to[1]-(s.mode==='fly'?14:12), L=14;
    svg+=P(path,null,'#ee5a3a',3).replace('/>',' stroke-dasharray="7 7"/>')
      +P('M'+(ex-L*Math.cos(ang-.5))+' '+(ey-L*Math.sin(ang-.5))+' L'+ex+' '+ey+' L'+(ex-L*Math.cos(ang+.5))+' '+(ey-L*Math.sin(ang+.5)),null,'#ee5a3a',4);
  } else {
    svg+='<g transform="translate('+to+')">'+A[fig]()+'</g>';
    if(o.front) svg+=o.front();
  }
  return '<figure class="pic '+(mv?'mv':'st')+'">'+svg+'</svg></figure>';
}
var T0=null, paused=false, clock=0, last=null;
function tick(ts){
  if(last===null)last=ts; if(!paused)clock+=ts-last; last=ts;
  var cyc=3800, t=(clock%cyc), p;
  p = t<600?0 : t<2600?(t-600)/2000 : 1;
  var els=document.querySelectorAll('g[data-mode]');
  for(var i=0;i<els.length;i++){
    var e=els[i], f=e.getAttribute('data-from').split(',').map(Number), to=e.getAttribute('data-to').split(',').map(Number), m=e.getAttribute('data-mode'), my=+e.getAttribute('data-my');
    var q = m==='fall' ? p*p : (p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2);
    var x=f[0]+(to[0]-f[0])*q, y=f[1]+(to[1]-f[1])*q, rot=0;
    if(m==='fly'){ var y0=f[1], y1=to[1], c=my+14; y=(1-q)*(1-q)*y0+2*(1-q)*q*c+q*q*y1; }
    if(m==='walk' && p>0 && p<1) y-=Math.abs(Math.sin(q*Math.PI*7))*5;
    if(m==='fall' && p>0 && p<1) rot=Math.sin(q*Math.PI*2)*25;
    e.setAttribute('transform','translate('+x.toFixed(1)+','+y.toFixed(1)+') rotate('+rot.toFixed(1)+')');
  }
  requestAnimationFrame(tick);
}

intro:['Im Haus, im Hof, bei den Nachbarn: Sie sehen zuerst Bilder und Sätze und entdecken die Regel selbst. Danach üben Sie.','In the house, in the courtyard, with the neighbours: first you look at pictures and sentences and discover the rule yourself. Then you practise.','Дом, двор, соседи: сначала вы смотрите на картинки и предложения и сами открываете правило. Потом тренируетесь.','Будинок, двір, сусіди: спочатку ви дивитеся на малюнки й речення та самі відкриваєте правило. Потім тренуєтеся.','Ev, avlu, komşular: Önce resimlere ve cümlelere bakıp kuralı kendiniz keşfedersiniz. Sonra alıştırma yaparsınız.','البيت والفناء والجيران: تنظر أولًا إلى الصور والجمل وتكتشف القاعدة بنفسك، ثم تتدرّب.','خانه، حیاط، همسایه‌ها: اول تصویرها و جمله‌ها را می‌بینید و خودتان قاعده را کشف می‌کنید. بعد تمرین می‌کنید.','Casa, curtea, vecinii: mai întâi priviți imagini și propoziții și descoperiți singuri regula. Apoi exersați.'],

d1_rule:['Frage „Wo?“ → Ort → Dativ. Frage „Wohin?“ → Bewegung zu einem Ziel → Akkusativ. Diese neun Präpositionen können beides: in, an, auf, über, unter, vor, hinter, neben, zwischen (Wechselpräpositionen).','Question “Wo?” (where) → place → dative. Question “Wohin?” (where to) → movement to a goal → accusative. These nine prepositions can take both: in, an, auf, über, unter, vor, hinter, neben, zwischen (two-way prepositions).','Вопрос «Wo?» (где?) → место → Dativ. Вопрос «Wohin?» (куда?) → движение к цели → Akkusativ. Эти девять предлогов управляют обоими падежами: in, an, auf, über, unter, vor, hinter, neben, zwischen.','Запитання «Wo?» (де?) → місце → Dativ. Запитання «Wohin?» (куди?) → рух до мети → Akkusativ. Ці дев’ять прийменників можуть вживатися з обома відмінками: in, an, auf, über, unter, vor, hinter, neben, zwischen.','„Wo?“ (nerede?) → yer → Dativ. „Wohin?“ (nereye?) → hedefe hareket → Akkusativ. Şu dokuz edat ikisiyle de kullanılır: in, an, auf, über, unter, vor, hinter, neben, zwischen.','سؤال «Wo?» (أين؟) ← مكان ← Dativ. سؤال «Wohin?» (إلى أين؟) ← حركة نحو هدف ← Akkusativ. حروف الجر التسعة هذه تأتي مع الحالتين: in, an, auf, über, unter, vor, hinter, neben, zwischen.','پرسش «Wo?» (کجا؟) ← مکان ← Dativ. پرسش «Wohin?» (به کجا؟) ← حرکت به سوی مقصد ← Akkusativ. این نه حرف اضافه با هر دو حالت می‌آیند: in, an, auf, über, unter, vor, hinter, neben, zwischen.','Întrebarea „Wo?” (unde?) → loc → Dativ. Întrebarea „Wohin?” (încotro?) → mișcare spre o țintă → Akkusativ. Aceste nouă prepoziții merg cu ambele cazuri: in, an, auf, über, unter, vor, hinter, neben, zwischen.'],

d2_task:['Lesen Sie die Satzpaare. Ergänzen Sie dann die Tabelle: Was finden Sie in den Sätzen?','Read the sentence pairs. Then complete the table with what you find in the sentences.','Прочитайте пары предложений. Затем заполните таблицу тем, что вы нашли в предложениях.','Прочитайте пари речень. Потім заповніть таблицю тим, що ви знайшли в реченнях.','Cümle çiftlerini okuyun. Sonra cümlelerde bulduklarınızla tabloyu tamamlayın.','اقرأ أزواج الجمل، ثم أكمل الجدول بما تجده في الجمل.','جفت‌جمله‌ها را بخوانید. سپس جدول را با آنچه در جمله‌ها می‌بینید کامل کنید.','Citiți perechile de propoziții. Apoi completați tabelul cu ce găsiți în ele.'],
d2_rule:['Wo? → aus „der“ wird dem, aus „die“ wird der, aus „das“ wird dem. Wohin? → aus „der“ wird den; „die“ und „das“ bleiben gleich. Plural: Wo? → den, und das Nomen bekommt ein -n (die Bäume → unter den Bäumen). Wohin? → die (unter die Bäume). Kein zusätzliches -n: wenn der Plural schon auf -n endet (die Mülltonnen) oder auf -s (die Autos).','Wo? → dem (der), der (die), dem (das). Wohin? → den (der), die (die), das (das). Plural: Wo? → den, and the noun gets -n (die Bäume → unter den Bäumen). Wohin? → die (unter die Bäume). No extra -n if the plural already ends in -n (die Mülltonnen) or in -s (die Autos).','Wo? → dem (der), der (die), dem (das). Wohin? → den (der), die (die), das (das). Множественное число: Wo? → den, и существительное получает -n (die Bäume → unter den Bäumen). Wohin? → die. Лишнее -n не нужно, если множественное число уже оканчивается на -n (die Mülltonnen) или на -s (die Autos).','Wo? → dem (der), der (die), dem (das). Wohin? → den (der), die (die), das (das). Множина: Wo? → den, а іменник отримує -n (die Bäume → unter den Bäumen). Wohin? → die. Додаткове -n не потрібне, якщо множина вже закінчується на -n (die Mülltonnen) або на -s (die Autos).','Wo? → dem (der), der (die), dem (das). Wohin? → den (der), die (die), das (das). Çoğul: Wo? → den ve isim -n alır (die Bäume → unter den Bäumen). Wohin? → die. Çoğul zaten -n (die Mülltonnen) veya -s (die Autos) ile bitiyorsa ek -n gelmez.','Wo? ← dem (der)، der (die)، dem (das). Wohin? ← den (der)، die (die)، das (das). الجمع: Wo? ← den ويأخذ الاسم ‎-n (die Bäume ← unter den Bäumen). Wohin? ← die. لا تُضاف ‎-n إذا كان الجمع ينتهي أصلًا بـ ‎-n (die Mülltonnen) أو ‎-s (die Autos).','Wo? ← dem (der)، der (die)، dem (das). Wohin? ← den (der)، die (die)، das (das). جمع: Wo? ← den و اسم ‎-n می‌گیرد (die Bäume ← unter den Bäumen). Wohin? ← die. اگر جمع خودش به ‎-n (die Mülltonnen) یا ‎-s (die Autos) ختم شود، ‎-n اضافه نمی‌شود.','Wo? → dem (der), der (die), dem (das). Wohin? → den (der), die (die), das (das). Plural: Wo? → den, iar substantivul primește -n (die Bäume → unter den Bäumen). Wohin? → die. Fără -n în plus dacă pluralul se termină deja în -n (die Mülltonnen) sau în -s (die Autos).'],
x2_h:['Welcher Artikel?','Which article?','Какой артикль?','Який артикль?','Hangi artikel?','أي أداة تعريف؟','کدام حرف تعریف؟','Ce articol?'],
x2_task:['Wo oder wohin? Wählen Sie den Artikel. Die Grundform steht unter dem Satz.','Where or where to? Choose the article. The basic form is below the sentence.','Где или куда? Выберите артикль. Исходная форма указана под предложением.','Де чи куди? Виберіть артикль. Початкова форма подана під реченням.','Nerede mi, nereye mi? Artikeli seçin. Yalın hâl cümlenin altında.','أين أم إلى أين؟ اختر الأداة. الصيغة الأساسية تحت الجملة.','کجا یا به کجا؟ حرف تعریف را انتخاب کنید. شکل پایه زیر جمله است.','Unde sau încotro? Alegeți articolul. Forma de bază este sub propoziție.'],

d3_h:['Kurze Formen','Short forms','Краткие формы','Короткі форми','Kısa biçimler','الصيغ المختصرة','شکل‌های کوتاه','Forme scurte'],
d3_task:['Vergleichen Sie: lange Form und kurze Form. Welche Wörter stecken in der kurzen Form?','Compare the long and the short form. Which words are inside the short form?','Сравните полную и краткую форму. Из каких слов состоит краткая?','Порівняйте повну й коротку форму. З яких слів складається коротка?','Uzun ve kısa biçimi karşılaştırın. Kısa biçimde hangi sözcükler var?','قارن بين الصيغة الطويلة والمختصرة. ما الكلمات الموجودة في المختصرة؟','شکل بلند و کوتاه را مقایسه کنید. شکل کوتاه از کدام کلمه‌ها ساخته شده؟','Comparați forma lungă și forma scurtă. Ce cuvinte conține forma scurtă?'],
d3_rule:['in dem = im · an dem = am (Wo?) — in das = ins · an das = ans (Wohin?). Im Alltag benutzt man fast immer die kurze Form. Für „in der“, „in die“, „in den“ gibt es keine kurze Form.','in dem = im · an dem = am (Wo?) — in das = ins · an das = ans (Wohin?). In everyday German the short form is almost always used. “in der”, “in die”, “in den” have no short form.','in dem = im · an dem = am (Wo?) — in das = ins · an das = ans (Wohin?). В речи почти всегда используют краткую форму. У «in der», «in die», «in den» краткой формы нет.','in dem = im · an dem = am (Wo?) — in das = ins · an das = ans (Wohin?). У мовленні майже завжди вживають коротку форму. «in der», «in die», «in den» не мають короткої форми.','in dem = im · an dem = am (Wo?) — in das = ins · an das = ans (Wohin?). Günlük dilde neredeyse hep kısa biçim kullanılır. „in der“, „in die“, „in den“ kısalmaz.','in dem = im · an dem = am ‏(Wo?) — in das = ins · an das = ans ‏(Wohin?). في الحياة اليومية تُستعمل الصيغة المختصرة غالبًا. لا اختصار لـ «in der» و«in die» و«in den».','in dem = im · an dem = am ‏(Wo?) — in das = ins · an das = ans ‏(Wohin?). در گفتار روزمره تقریباً همیشه شکل کوتاه به کار می‌رود. «in der»، «in die» و «in den» شکل کوتاه ندارند.','in dem = im · an dem = am (Wo?) — in das = ins · an das = ans (Wohin?). În limbajul zilnic se folosește aproape mereu forma scurtă. „in der”, „in die”, „in den” nu au formă scurtă.'],

d4_h:['Die neun Wechselpräpositionen','The nine two-way prepositions','Девять предлогов с двумя падежами','Дев’ять прийменників з двома відмінками','Dokuz yer edatı','حروف الجر التسعة','نه حرف اضافه‌ی دوحالته','Cele nouă prepoziții'],
d4_task:['Erst entdecken: auf, über und an. Sehen Sie sich die drei Bilder an.','First discover: auf, über and an. Look at the three pictures.','Сначала открытие: auf, über и an. Посмотрите на три картинки.','Спочатку відкриття: auf, über та an. Подивіться на три малюнки.','Önce keşif: auf, über ve an. Üç resme bakın.','اكتشف أولًا: auf وüber وan. انظر إلى الصور الثلاث.','اول کشف کنید: auf، über و an. سه تصویر را ببینید.','Mai întâi descoperiți: auf, über și an. Priviți cele trei imagini.'],
d4_q1:['In welchem Bild gibt es KEINEN Kontakt zum Tisch?','In which picture is there NO contact with the table?','На какой картинке НЕТ контакта со столом?','На якому малюнку НЕМАЄ контакту зі столом?','Hangi resimde masayla temas YOK?','في أي صورة لا يوجد تلامس مع الطاولة؟','در کدام تصویر هیچ تماسی با میز نیست؟','În care imagine NU există contact cu masa?'],
d4_q2:['Die Zeitung berührt den Tisch von oben. Welches Wort passt?','The newspaper touches the table from above. Which word fits?','Газета касается стола сверху. Какое слово подходит?','Газета торкається столу зверху. Яке слово підходить?','Gazete masaya üstten değiyor. Hangi sözcük uygun?','الجريدة تلامس الطاولة من الأعلى. ما الكلمة المناسبة؟','روزنامه از بالا با میز تماس دارد. کدام کلمه مناسب است؟','Ziarul atinge masa de sus. Ce cuvânt se potrivește?'],
d4_q3:['Das Bild und die Jacke sind an einer Seite fest, nicht oben darauf. Welches Wort passt?','The picture and the jacket are attached at the side, not lying on top. Which word fits?','Картина и куртка закреплены сбоку, а не лежат сверху. Какое слово подходит?','Картина й куртка закріплені збоку, а не лежать зверху. Яке слово підходить?','Resim ve ceket yan tarafa tutturulmuş, üstünde değil. Hangi sözcük uygun?','اللوحة والسترة مثبتتان على الجانب، لا فوقه. ما الكلمة المناسبة؟','تابلو و کاپشن به پهلو وصل‌اند، نه روی آن. کدام کلمه مناسب است؟','Tabloul și geaca sunt prinse lateral, nu stau deasupra. Ce cuvânt se potrivește?'],
d4_rule:['auf = oben darauf, mit Kontakt · über = höher, ohne Kontakt · an = Kontakt an der Seite oder ganz nah an einer Grenze (an der Wand, an der Tür, am Fenster). Probieren Sie unten alle neun Präpositionen aus: jeweils ein Bild zu „Wo?“ und eines zu „Wohin?“.','auf = on top, touching · über = higher, not touching · an = touching at the side, or right at an edge (an der Wand, an der Tür, am Fenster). Try all nine prepositions below: each with one picture for “Wo?” and one for “Wohin?”.','auf = сверху, с контактом · über = выше, без контакта · an = контакт сбоку или вплотную к краю. Попробуйте ниже все девять предлогов: для каждого есть картинка к «Wo?» и картинка к «Wohin?».','auf = зверху, з контактом · über = вище, без контакту · an = контакт збоку або впритул до краю. Спробуйте нижче всі дев’ять прийменників: для кожного є малюнок до «Wo?» і малюнок до «Wohin?».','auf = üstünde, temas var · über = yukarıda, temas yok · an = yandan temas veya bir kenarın hemen yanı. Aşağıda dokuz edatın hepsini deneyin: her biri için bir „Wo?“ ve bir „Wohin?“ resmi var.','auf = فوقه مع تلامس · über = أعلى منه دون تلامس · an = تلامس من الجانب أو عند الحافة تمامًا. جرّب في الأسفل الحروف التسعة: لكل حرف صورة مع «Wo?» وصورة مع «Wohin?».','auf = روی چیزی، با تماس · über = بالاتر، بدون تماس · an = تماس از پهلو یا درست در لبه. پایین هر نه حرف را امتحان کنید: برای هر کدام یک تصویر «Wo?» و یک تصویر «Wohin?» هست.','auf = deasupra, cu contact · über = mai sus, fără contact · an = contact lateral sau chiar la margine. Încercați mai jos toate cele nouă prepoziții: fiecare are o imagine pentru „Wo?” și una pentru „Wohin?”.'],

why4:['Sehen Sie sich an: Wo ist die Figur (oder wo endet der Pfeil)?','Check: where is the figure (or where does the arrow end)?','Проверьте: где фигура (или где заканчивается стрелка)?','Перевірте: де фігура (або де закінчується стрілка)?','Bakın: Figür nerede (veya ok nerede bitiyor)?','لاحظ: أين الشكل (أو أين ينتهي السهم)؟','دقت کنید: شکل کجاست (یا فلش کجا تمام می‌شود)؟','Verificați: unde este figura (sau unde se termină săgeata)?'],

d5_h:['stehen, liegen, sitzen, hängen','stehen, liegen, sitzen, hängen','stehen, liegen, sitzen, hängen','stehen, liegen, sitzen, hängen','stehen, liegen, sitzen, hängen','stehen, liegen, sitzen, hängen','stehen, liegen, sitzen, hängen','stehen, liegen, sitzen, hängen'],
d5_task:['Vier Verben für „Wo?“. Lesen Sie die Sätze und sehen Sie sich die Bilder an.','Four verbs for “Wo?”. Read the sentences and look at the pictures.','Четыре глагола для «Wo?». Прочитайте предложения и посмотрите на картинки.','Чотири дієслова для «Wo?». Прочитайте речення та подивіться на малюнки.','„Wo?“ için dört fiil. Cümleleri okuyun, resimlere bakın.','أربعة أفعال مع «Wo?». اقرأ الجمل وانظر إلى الصور.','چهار فعل برای «Wo?». جمله‌ها را بخوانید و تصویرها را ببینید.','Patru verbe pentru „Wo?”. Citiți propozițiile și priviți imaginile.'],
d5_q1:['Etwas ist flach, in horizontaler Position. Welches Verb?','Something is flat, in a horizontal position. Which verb?','Предмет лежит плоско, горизонтально. Какой глагол?','Предмет лежить пласко, горизонтально. Яке дієслово?','Bir şey yatay, düz duruyor. Hangi fiil?','شيء في وضع أفقي مسطّح. ما الفعل؟','چیزی به حالت افقی و تخت است. کدام فعل؟','Ceva este în poziție orizontală. Ce verb?'],
d5_q2:['Etwas ist oben befestigt, unten ist nichts darunter, was es trägt. Welches Verb?','Something is fixed at the top; nothing supports it from below. Which verb?','Предмет закреплён сверху, снизу его ничто не держит. Какой глагол?','Предмет закріплений зверху, знизу його ніщо не тримає. Яке дієслово?','Bir şey üstten tutturulmuş, alttan destek yok. Hangi fiil?','شيء مثبّت من الأعلى ولا شيء يحمله من الأسفل. ما الفعل؟','چیزی از بالا بسته شده و از پایین تکیه‌گاهی ندارد. کدام فعل؟','Ceva este prins sus și nu e sprijinit de jos. Ce verb?'],
d5_q3:['Das Fahrrad ist auf seinen Rädern, aufrecht. Welches Verb?','The bike is upright on its wheels. Which verb?','Велосипед находится вертикально на колёсах. Какой глагол?','Велосипед вертикально на колесах. Яке дієслово?','Bisiklet tekerlekleri üzerinde, dik. Hangi fiil?','الدراجة قائمة على عجلاتها. ما الفعل؟','دوچرخه صاف روی چرخ‌هایش است. کدام فعل؟','Bicicleta este verticală, pe roți. Ce verb?'],
d5_rule:['stehen: aufrecht (Personen, Fahrrad, Auto, Mülltonne) · liegen: flach (Zeitung, Schlüssel, Ball) · sitzen: Personen auf dem Po; auch Katzen und Vögel · hängen: oben befestigt (Bild, Jacke, Lampe). Alle vier antworten auf „Wo?“ → Dativ.','stehen: upright (people, bike, car, bin) · liegen: flat (newspaper, key, ball) · sitzen: sitting (people; also cats and birds) · hängen: fixed at the top (picture, jacket, lamp). All four answer “Wo?” → dative.','stehen: стоять вертикально (люди, велосипед, машина, бак) · liegen: лежать (газета, ключ, мяч) · sitzen: сидеть (люди, а также кошки и птицы) · hängen: висеть (картина, куртка, лампа). Все четыре отвечают на «Wo?» → Dativ.','stehen: стояти (люди, велосипед, авто, бак) · liegen: лежати (газета, ключ, м’яч) · sitzen: сидіти (люди, а також коти й птахи) · hängen: висіти (картина, куртка, лампа). Усі чотири відповідають на «Wo?» → Dativ.','stehen: dik durmak (insan, bisiklet, araba, çöp kutusu) · liegen: yatay durmak (gazete, anahtar, top) · sitzen: oturmak (insanlar; kedi ve kuşlar da) · hängen: asılı olmak (resim, ceket, lamba). Dördü de „Wo?“ sorusuna cevap verir → Dativ.','stehen: وضع قائم (أشخاص، دراجة، سيارة، حاوية) · liegen: وضع مسطّح (جريدة، مفتاح، كرة) · sitzen: جلوس (الأشخاص، وكذلك القطط والطيور) · hängen: معلّق (لوحة، سترة، مصباح). الأربعة تجيب عن «Wo?» ← Dativ.','stehen: ایستاده و قائم (آدم، دوچرخه، ماشین، سطل) · liegen: خوابیده و تخت (روزنامه، کلید، توپ) · sitzen: نشسته (آدم‌ها؛ گربه و پرنده هم) · hängen: آویزان (تابلو، کاپشن، چراغ). هر چهار به «Wo?» پاسخ می‌دهند ← Dativ.','stehen: în picioare/vertical (oameni, bicicletă, mașină, pubelă) · liegen: culcat/plat (ziar, cheie, minge) · sitzen: așezat (oameni; și pisici, păsări) · hängen: atârnat (tablou, geacă, lampă). Toate răspund la „Wo?” → Dativ.'],

d6_task:['Vier Verben für „Wohin?“. Frau Weber steht im Hof und spricht. Vergleichen Sie „kommt“ und „geht“.','Four verbs for “Wohin?”. Frau Weber is standing in the courtyard and speaking. Compare “kommt” and “geht”.','Четыре глагола для «Wohin?». Фрау Вебер стоит во дворе и говорит. Сравните «kommt» и «geht».','Чотири дієслова для «Wohin?». Пані Вебер стоїть у дворі й говорить. Порівняйте «kommt» і «geht».','„Wohin?“ için dört fiil. Bayan Weber avluda durup konuşuyor. „kommt“ ve „geht“i karşılaştırın.','أربعة أفعال مع «Wohin?». السيدة فيبر تقف في الفناء وتتكلم. قارن بين «kommt» و«geht».','چهار فعل برای «Wohin?». خانم وبر در حیاط ایستاده و حرف می‌زند. «kommt» و «geht» را مقایسه کنید.','Patru verbe pentru „Wohin?”. Doamna Weber stă în curte și vorbește. Comparați „kommt” și „geht”.'],

d6_rule:['kommen: das Ziel ist bei der Person, die spricht (hierher) · gehen: das Ziel ist ein anderer Ort · fliegen: durch die Luft · fallen: nach unten, ohne Absicht (ich falle, du fällst, er/sie/es fällt, sie fallen). Wohin? → Akkusativ.','kommen: the goal is where the speaker is (towards here) · gehen: the goal is another place · fliegen: through the air · fallen: downwards, not on purpose (ich falle, du fällst, er/sie/es fällt, sie fallen). Wohin? → accusative.','kommen: цель там, где говорящий (сюда) · gehen: цель — другое место · fliegen: по воздуху · fallen: падать вниз, неумышленно (er/sie/es fällt). Wohin? → Akkusativ.','kommen: мета там, де мовець (сюди) · gehen: мета — інше місце · fliegen: у повітрі · fallen: падати вниз, ненавмисно (er/sie/es fällt). Wohin? → Akkusativ.','kommen: hedef konuşanın yanı (buraya) · gehen: hedef başka bir yer · fliegen: havada uçmak · fallen: istemeden aşağı düşmek (er/sie/es fällt). Wohin? → Akkusativ.','kommen: الهدف حيث المتكلم (إلى هنا) · gehen: الهدف مكان آخر · fliegen: عبر الهواء · fallen: إلى الأسفل دون قصد (er/sie/es fällt). ‏Wohin? ← Akkusativ.','kommen: مقصد پیش گوینده است (به اینجا) · gehen: مقصد جای دیگری است · fliegen: در هوا · fallen: به پایین، بدون قصد (er/sie/es fällt). ‏Wohin? ← Akkusativ.','kommen: ținta e unde se află vorbitorul (încoace) · gehen: ținta e alt loc · fliegen: prin aer · fallen: în jos, fără intenție (er/sie/es fällt). Wohin? → Akkusativ.'],

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),x=a[i];a[i]=a[j];a[j]=x;}return a;}

/* Entdeckerfragen nacheinander */
function chain(card,steps,done){
  var host=el('<div></div>');card.appendChild(host);
  function run(n){
    if(n>=steps.length){done(host);return;}
    steps[n](host,function(){run(n+1);});
  }
  run(0);
}
function mc(qk,opts,right){ /* opts: [{k:key}|{s:string}] */
  return function(host,ok){
    var box=el('<div class="q"><p class="qh">'+t(qk)+'</p></div>'),fb=el('<div aria-live="polite"></div>');
    shuffle(opts.map(function(o,i){return {o:o,i:i};})).forEach(function(p){
      var b=el('<button type="button" class="opt">'+(p.o.k?t(p.o.k):'<span dir="ltr">'+p.o.s+'</span>')+'</button>');
      b.onclick=function(){
        if(p.i===right){b.className='opt good';[].forEach.call(box.querySelectorAll('.opt'),function(x){x.disabled=true;});msg(fb,'ok','good');ok();}
        else{b.className='opt bad';msg(fb,'no','look');}
      };box.appendChild(b);
    });
    box.appendChild(fb);host.appendChild(box);
  };
}
function rule(host,k,extra){
  host.appendChild(el('<div class="rule"><b class="h">Merke</b>'+t(k)+(extra||'')+'</div>'));
  host.appendChild(nextBtn('practise'));
}

function mcS(q,opts,right){return function(host,ok){
  var box=el('<div class="q" dir="ltr"><p class="qh">'+q+'</p></div>'),fb=el('<div></div>');
  opts.forEach(function(o,i){var b=el('<button type="button" class="w">'+o+'</button>');b.onclick=function(){if(i===right){b.className='w good';[].forEach.call(box.querySelectorAll('.w'),function(x){x.disabled=true;});msg(fb,'ok','good');ok();}else{b.className='w bad';msg(fb,'no','look');}};box.appendChild(b);});
  box.appendChild(fb);host.appendChild(box);};}

/* ---------- Übungen ---------- */
function exercise(c,id,h,task,items){
  head(c,h,task);
  var grid=el('<div class="items"></div>'),done=0,first=0,foot=el('<div></div>');
  score[id]={ok:0,n:items.length,done:false};
  items.forEach(function(it,n){
    var box=el('<div class="item"><div class="num">'+(n+1)+'</div>'+it.pic+'<div class="body" dir="ltr">'+it.text+'</div></div>'),fb=el('<div aria-live="polite"></div>'),tries=0,solved=false;
    function solve(shown){
      if(solved)return; solved=true;done++;
      if(tries===0&&!shown){first++;}
      score[id].ok=first;
      var g=box.querySelector('.gap'); if(g){g.innerHTML=it.show;g.className='gap filled';}
      box.className='item done';
      [].forEach.call(box.querySelectorAll('.choices button,.typed input,.typed button,.solbtn'),function(x){x.disabled=true;});
      if(done===items.length){score[id].done=true;state[id]='ok';navMark();foot.innerHTML='<div class="msg ok"><b dir="ltr">'+first+' / '+items.length+'</b> '+t('end_t')+'</div>';foot.appendChild(nextBtn());}
    }
    it.mount(box.querySelector('.body'),function(correct,k,extra){
      if(correct){msg(fb,'ok',k||'good',extra);solve(false);}
      else{tries++;msg(fb,'no',k,extra);
        if(tries>=2&&!box.querySelector('.solbtn')){var s=btn('sol','sec solbtn',function(){msg(fb,'info',it.why,it.expl);solve(true);});box.appendChild(s);}}
    });
    box.appendChild(fb);grid.appendChild(box);
  });
  c.appendChild(grid);c.appendChild(foot);
  c.appendChild(btn('again','sec',function(){render();window.scrollTo(0,0);}));
}
function choiceMount(opts,right,why,expl,whyFor){
  return function(body,res){
    var w=el('<div class="choices"></div>');
    opts.forEach(function(o){var b=el('<button type="button" class="w">'+o+'</button>');b.onclick=function(){
      if(o===right){b.className='w good';res(true,null,expl);}
      else{b.className='w bad';b.disabled=true;var f=whyFor?whyFor(o):null;res(false,f?f[0]:why,f?f[1]:'');}
    };w.appendChild(b);});
    body.appendChild(w);
  };
}
function gapText(a,b){return '<p class="sent">'+a+' <span class="gap">……</span>'+(b==='.'?'':' ')+b+'</p>';}
function caseWhy(d){return d==='wo'?'static':'motion';}
function shortOf(p,a){var m={'in dem':'im','an dem':'am','in das':'ins','an das':'ans'};return m[p+' '+a]||null;}
function explArt(it){return (it[1]==='wo'?'Wo? → Dativ':'Wohin? → Akkusativ')+' · '+it[6]+' → '+it[4]+'.';}

var EX={
x1:function(c){exercise(c,'x1','x1_h','x1_task',X1.map(function(it){
  return {pic:scene(it[0],it[1],{alt:it[2]}),text:'<p class="sent">'+it[2].replace(/ (auf das|auf den|auf dem|im|neben dem|in den|an die|an der|unter dem|hinter das) /,' <span class="blank">…</span> ')+'</p>',show:'',why:caseWhy(it[1]),expl:'',
    mount:function(body,res){var w=el('<div class="choices"></div>');['wo','wohin'].forEach(function(d){var b=el('<button type="button" class="w big">'+(d==='wo'?'Wo?':'Wohin?')+'</button>');b.onclick=function(){
      if(d===it[1]){b.className='w big good';body.querySelector('.sent').textContent=it[2];res(true,caseWhy(it[1]));}else{b.className='w big bad';b.disabled=true;res(false,caseWhy(it[1]));}};w.appendChild(b);});body.appendChild(w);}};
}));},
x2:function(c){var list=X2.map(function(it){
  return {pic:scene(it[0],it[1],{alt:it[2]+' … '+it[3]}),text:gapText(it[2],it[3])+'<div class="base">'+it[6]+'</div>',show:it[4],why:caseWhy(it[1]),expl:explArt(it),mount:choiceMount(it[5],it[4],caseWhy(it[1]),'',null)};});
  var b=X2b;list.push({pic:scene(b[0],b[1],{alt:'Kind unter den Bäumen'}),text:gapText(b[2],b[3])+'<div class="base">'+b[6]+'</div>',show:b[4],why:'static',expl:'Plural + Dativ: den Bäumen (+ n)',mount:choiceMount(b[5],b[4],'static','Plural + Dativ: + n',null)});
  exercise(c,'x2','x2_h','x2_task',list);},
x3:function(c){exercise(c,'x3','x3_h','choose',X3.map(function(it){
  return {pic:scene(it[0],it[1],{alt:it[2]+' … '+it[3]}),text:gapText(it[2],it[3])+'<div class="base">'+it[6]+'</div>',show:it[4],why:caseWhy(it[1]),expl:explArt(it),mount:choiceMount(it[5],it[4],caseWhy(it[1]),'',null)};}));},
x4:function(c){exercise(c,'x4','x4_h','x4_task',X4.map(function(it){
  var NO={tischzeitung:['an'],tischkatze:['hinter','zwischen','vor','in'],tor:['an','neben'],sofahinter:['in','über'],tonneball:['an','vor','zwischen'],tonnen:['neben','vor','in'],bild:['neben','vor','in'],autogarage:['vor','unter','hinter'],haus:['auf'],baeume:['unter','neben','vor','hinter','in'],sofakatze:['in','über','an','vor','hinter'],tischvogel:['auf']}[it[0]]||[];
  var opts=shuffle([it[4]].concat(shuffle(PR.filter(function(p){return p!==it[4]&&NO.indexOf(p)<0;})).slice(0,3)));
  return {pic:scene(it[0],it[1],{alt:'Szene zum Satz'}),text:gapText(it[2],it[3]),show:it[4],why:'why4',expl:it[2]+' '+it[4]+' '+it[3],mount:choiceMount(opts,it[4],'why4','',null)};}));},
x5:function(c){exercise(c,'x5','x5_h','chooseverb',X5.map(function(it){
  return {pic:scene(it[0],'wo',{alt:'Szene zum Satz'}),text:gapText(it[2],it[3]),show:it[4],why:'d5_rule',expl:it[2]+' '+it[4]+' '+it[3],mount:choiceMount(V,it[4],'d5_rule','',null)};}));},
x6:function(c){exercise(c,'x6','x6_h','chooseverb',X6.map(function(it){
  return {pic:scene(it[0],'wohin',{alt:'Szene zum Satz'}),text:(it[6]?'<div class="base">'+it[6]+'</div>':'')+gapText(it[2],it[3]),show:it[4],why:'d6_rule',expl:'→ '+it[4],mount:choiceMount(it[5],it[4],'d6_rule','',null)};}));},
x7:function(c){exercise(c,'x7','x7_h','x7_task',X7.map(function(it){
  var sh=shortOf(it[4],it[5]),long=it[4]+' '+it[5],best=sh||long;
  return {pic:scene(it[0],it[1],{alt:'Szene zum Satz'}),text:gapText(it[2],it[3])+'<div class="base">'+it[6]+'</div>',show:best,why:caseWhy(it[1]),expl:(it[1]==='wo'?'Wo? → Dativ':'Wohin? → Akkusativ')+' · '+best+'.',
    mount:function(body,res){var w=el('<form class="typed" autocomplete="off"><input type="text" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Antwort"><button type="submit" class="btn">'+t('check')+'</button></form>'),inp=w.querySelector('input');
      w.onsubmit=function(e){e.preventDefault();var v=inp.value.trim().toLowerCase().replace(/\s+/g,' ');if(!v)return;
        if(v===best){inp.className='good';res(true);}
        else if(v===long){inp.className='good';res(true,'shortnote','');var m=body.parentNode.querySelector('.msg.ok');m.insertAdjacentHTML('beforeend',' <b dir="ltr">'+sh+'</b>');}
        else{inp.className='bad';var first=v.split(' ')[0];var okPrep=first===it[4]||(sh&&v===sh)||(({'im':'in','ins':'in','am':'an','ans':'an'})[first]===it[4]);res(false,okPrep?caseWhy(it[1]):'wprep','');}
      };body.appendChild(w);}};
}));}};

function navMark(){[].forEach.call(document.querySelectorAll('.nb[data-i]'),function(b){var i=+b.getAttribute('data-i');b.className='nb'+(state[STEPS[i].id]==='ok'?' ok':'')+(i===cur?' cur':'');});
  var n=STEPS.filter(function(s){return state[s.id]==='ok';}).length,m=STEPS.length-2;
  var bar=document.querySelector('.bar i');if(bar)bar.style.width=Math.min(100,Math.round(n/(m+1)*100))+'%';}
var navOpen=false;
function render(){
  uid=0;
  var app=document.getElementById('app'),s=STEPS[cur];
  app.innerHTML='<header class="top"><div class="wrap"><div class="chnum">A2</div><div class="kicker">Treffpunkt A2 · Lektion 4 · Wohnen und Nachbarn</div><h1>Wo? Wohin?</h1><div class="progress"><span>'+(cur+1)+' / '+STEPS.length+' · '+s.nav+'</span><div class="bar"><i></i></div></div></div></header>'
   +'<nav class="jump"><div class="wrap"><button type="button" class="navbtn" id="nv" aria-expanded="'+navOpen+'">'+esc(I.nav[0])+'</button><button type="button" class="navbtn" id="pz"></button><span class="sp"></span><select id="lg" aria-label="Meine Sprache">'+LNAMES.map(function(n,i){return '<option value="'+i+'"'+(i===lang?' selected':'')+'>'+(i===0?'Meine Sprache: Deutsch':n)+'</option>';}).join('')+'</select></div>'
   +'<div class="navp"'+(navOpen?'':' hidden')+'>'+STEPS.map(function(x,i){return '<button type="button" class="nb" data-i="'+i+'">'+x.nav+'</button>';}).join('')+'</div></nav><main></main>';
  var pz=document.getElementById('pz');function pzl(){pz.textContent=paused?'▶ '+I.play[0]:'❚❚ '+I.pause[0];pz.title=I[paused?'play':'pause'][lang];}pzl();pz.onclick=function(){paused=!paused;pzl();};
  document.getElementById('nv').onclick=function(){navOpen=!navOpen;this.setAttribute('aria-expanded',navOpen);app.querySelector('.navp').hidden=!navOpen;};
  document.getElementById('lg').onchange=function(){
    /* Sprache umschalten, ohne Antworten zu löschen */
    var old=lang;lang=+this.value;
    [].forEach.call(app.querySelectorAll('.x'),function(x){var de=x.querySelector('.de').textContent;for(var k in I){if(I[k][0]===de){x.innerHTML='<span class="de">'+esc(de)+'</span>'+tr(k);break;}}});
    pzl();};
  [].forEach.call(app.querySelectorAll('.nb[data-i]'),function(b){b.onclick=function(){navOpen=false;go(+b.getAttribute('data-i'));};});
  var main=app.querySelector('main'),c=el('<section class="card'+(s.disc?' disc':'')+'">'+(s.disc?'<div class="dtag">Zum Entdecken</div>':'')+'</section>');
  main.appendChild(c);
  if(s.id==='start'){
    head(c,'intro_h','intro');
    c.appendChild(el('<div class="grid2">'+fig('balkon','wo','Wo ist die Katze?')+fig('balkon','wohin','Wohin geht die Katze?')+'</div>'));
    c.appendChild(el('<div class="msg info">'+t('hint1')+'</div>'));
    c.appendChild(btn('start','',function(){go(1);}));
  } else if(s.id==='end'){
    head(c,'end_h','end_t');var sum=0,max=0,rows='';
    STEPS.forEach(function(x,i){if(x.id.charAt(0)==='x'){var r=score[x.id];var n={x1:10,x2:13,x3:10,x4:12,x5:10,x6:10,x7:10}[x.id];max+=n;var v=r&&r.done?r.ok:null;if(v!==null)sum+=v;rows+='<tr><td>'+x.nav+'</td><td dir="ltr">'+(v===null?'—':v+' / '+n)+'</td></tr>';}});
    c.appendChild(el('<div><div class="score" dir="ltr">'+sum+' / '+max+'</div><table>'+rows+'</table></div>'));
  } else if(DISC[s.id]) DISC[s.id](c); else EX[s.id](c);
  navMark();
}
render();
requestAnimationFrame(tick);
})();
