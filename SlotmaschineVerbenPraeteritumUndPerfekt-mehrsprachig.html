<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verb-Slotmaschine – Präteritum und Perfekt üben (mehrsprachig)</title>
<style>
:root{--h:124px;--gold:#f5c542;--ink:#1d1633;--red1:#d12f47;--red2:#8e1428}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:radial-gradient(circle at 50% 0,#4a2a8a 0,#241447 55%,#150b2e 100%);color:#fff;min-height:100vh}
.wrap{max-width:980px;margin:0 auto;padding:16px 14px 40px}
header{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center}
h1{font-size:clamp(20px,3.2vw,30px);margin:0;line-height:1.2}
h1 span{display:block;font-size:.55em;font-weight:600;color:var(--gold);letter-spacing:.04em}
.score{display:flex;gap:8px;flex-wrap:wrap}
.pill{background:rgba(255,255,255,.14);border-radius:999px;padding:6px 14px;font-weight:700;font-size:15px}
.machine{margin-top:14px;background:linear-gradient(var(--red1),var(--red2));border:4px solid var(--gold);border-radius:26px;padding:14px 16px 22px;box-shadow:0 10px 30px rgba(0,0,0,.45),inset 0 0 0 3px rgba(255,255,255,.12)}
.lights{display:flex;justify-content:space-between;margin:0 4px 12px}
.lights i{width:12px;height:12px;border-radius:50%;background:#ffe27a;box-shadow:0 0 8px #ffd23f;animation:blink 1.2s infinite}
.lights i:nth-child(odd){animation-delay:.6s}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
.reels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.col{display:flex;flex-direction:column;gap:8px;min-width:0}
.label{text-align:center;color:var(--gold);font-weight:800;letter-spacing:.08em;font-size:13px;text-transform:uppercase}
.reel{height:var(--h);overflow:hidden;background:#fff;border-radius:14px;border:3px solid #3a2a07;position:relative;box-shadow:inset 0 6px 14px rgba(0,0,0,.3),inset 0 -6px 14px rgba(0,0,0,.3)}
.reel:after{content:"";position:absolute;left:0;right:0;top:0;bottom:0;background:linear-gradient(rgba(0,0,0,.22),transparent 25%,transparent 75%,rgba(0,0,0,.22));pointer-events:none}
.reel.spinning .strip{filter:blur(1.4px)}
.cell{height:var(--h);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:6px 8px;color:var(--ink);font-weight:800;font-size:clamp(15px,2.5vw,28px);line-height:1.15;overflow:hidden;word-break:normal;-webkit-hyphens:auto;hyphens:auto}
.cell small{font-size:.55em;font-weight:600;color:#6a5d8a;margin-top:3px}
.cell.q{font-size:56px;color:#c9c2dc}
.hold{border:2px solid rgba(255,255,255,.55);background:rgba(0,0,0,.22);color:#fff;border-radius:999px;padding:7px 8px;font-size:14px;font-weight:700;cursor:pointer}
.hold.on{background:var(--gold);color:#3a2a07;border-color:#3a2a07}
.hold:disabled{opacity:.5;cursor:not-allowed}
.tl{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:14px;font-size:14px}
.tl[hidden]{display:none}
.tl span{background:rgba(0,0,0,.28);border-radius:10px;padding:7px 4px;text-align:center;color:#fff;opacity:.55;font-weight:600}
.tl span.on{opacity:1;background:var(--gold);color:#3a2a07;font-weight:800}
.spin{margin:18px auto 0;display:block;padding:14px 54px;font-size:24px;font-weight:900;letter-spacing:.08em;border-radius:999px;border:4px solid #3a2a07;background:linear-gradient(#ffe27a,#f5b41b);color:#3a2a07;cursor:pointer;box-shadow:0 6px 0 #9a6b00}
.spin:active{transform:translateY(4px);box-shadow:0 2px 0 #9a6b00}
.spin:disabled{filter:grayscale(.6);cursor:not-allowed}
.settings{display:flex;flex-wrap:wrap;gap:10px 18px;margin-top:14px;font-size:14px;align-items:center}
.settings label{display:flex;gap:6px;align-items:center}
select{font:inherit;padding:5px 8px;border-radius:8px;border:1px solid #bbb;background:#fff;color:#1d1633}
.card{background:#fff;color:var(--ink);border-radius:18px;padding:18px;margin-top:16px;box-shadow:0 6px 20px rgba(0,0,0,.35)}
.card[hidden]{display:none}
.task{font-size:17px;margin-bottom:10px}
.chip{display:inline-block;background:#efe9ff;color:#4a2a8a;border-radius:999px;padding:3px 12px;font-weight:700;font-size:14px;margin-left:6px}
.chip[hidden]{display:none}
.inputrow{display:flex;flex-wrap:wrap;gap:8px}
.inputrow input{flex:1 1 260px;font:inherit;font-size:18px;padding:10px 12px;border:2px solid #b9aedc;border-radius:12px;color:var(--ink)}
.btn{font:inherit;font-weight:800;border:0;border-radius:12px;padding:10px 18px;cursor:pointer;background:#4a2a8a;color:#fff}
.btn.ghost{background:#e9e4f7;color:#3b2475}
.btn:disabled{opacity:.5;cursor:not-allowed}
.tip{font-size:13px;color:#5b5078;margin:8px 0 0}
#fb{margin-top:10px;font-weight:700;min-height:1.2em}
#fb.good{color:#0d7a3f}#fb.bad{color:#b3261e}#fb.warn{color:#8a5a00}
#sol{margin-top:12px;border-top:2px dashed #d6cfee;padding-top:12px}
#sol[hidden]{display:none}
.verdict{font-size:16px;margin-bottom:8px}
.model{font-size:20px;font-weight:800;line-height:1.5;margin:6px 0 10px;color:#2a1a5e}
table{border-collapse:collapse;width:100%;max-width:640px;font-size:16px}
td,th{padding:6px 10px;border-bottom:1px solid #e5e0f3;text-align:left}
tr.need td{background:#fff4c9;font-weight:800}
.stamm{font-size:14px;color:#5b5078;margin-top:8px}
.badge{display:inline-block;background:#e2f6ea;color:#0d6a37;border-radius:6px;padding:2px 8px;font-size:12px;font-weight:700;margin-left:6px}
.help{margin-top:16px;font-size:14px;color:#d9d0f2}
.help summary{cursor:pointer;font-weight:700}
.help ul{margin:8px 0 0 18px;padding:0;line-height:1.5}
.linkbtn{background:none;border:0;color:#d9d0f2;text-decoration:underline;cursor:pointer;font:inherit;padding:0}
@media (max-width:560px){:root{--h:112px}.machine{padding:10px 8px 18px}.reels{gap:6px}.hold{font-size:12px;padding:6px 2px}.spin{padding:12px 40px;font-size:20px}.cell{font-size:13px;padding:4px 3px}.cell small{font-size:.8em}.label{font-size:11px;letter-spacing:.02em}.tl{font-size:12px}}
@media (prefers-reduced-motion:reduce){.lights i{animation:none}}
.start{background:#fff;color:var(--ink);border-radius:18px;padding:20px;margin-top:16px;box-shadow:0 6px 20px rgba(0,0,0,.35)}
.start[hidden],.disc[hidden],.game[hidden]{display:none}
.start h2,.disc h2{margin:0 0 6px;font-size:22px}
.start p{margin:4px 0 14px;color:#4a4066}
.mode{display:block;width:100%;text-align:left;font:inherit;font-size:17px;font-weight:700;line-height:1.35;border:3px solid #b9aedc;border-radius:14px;background:#f6f2ff;color:var(--ink);padding:14px 16px;margin:10px 0;cursor:pointer}
.mode:hover,.mode:focus{border-color:#4a2a8a;background:#ece5ff;outline:none}
.mode.rec{border-color:#0d7a3f;background:#eaf8f0}
.mode small{display:block;font-weight:500;font-size:14px;color:#5b5078;margin-top:4px}
.disc{background:#fff;color:var(--ink);border-radius:18px;padding:20px;margin-top:16px;box-shadow:0 6px 20px rgba(0,0,0,.35)}
.pair{border:2px solid #e0d9f3;border-radius:12px;padding:10px 12px;margin:10px 0}
.pair .q{font-weight:700;margin-bottom:6px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{font:inherit;font-size:17px;font-weight:700;border:2px solid #b9aedc;background:#f6f2ff;color:var(--ink);border-radius:10px;padding:8px 12px;cursor:pointer}
.opt:disabled{cursor:default}
.opt.right{border-color:#0d7a3f;background:#e2f6ea}
.opt.wrongpick{border-color:#b3261e;background:#fde8e6}
.pair .ex{margin-top:6px;font-size:15px;min-height:1.2em;color:#3b2475;font-weight:600}
.merke{background:#fff4c9;border-radius:12px;padding:10px 14px;margin:12px 0;font-size:16px;line-height:1.5}
.merke[hidden]{display:none}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.tagU{display:inline-block;border-radius:6px;padding:1px 8px;font-size:12px;font-weight:700;margin-left:6px;background:#e2f6ea;color:#0d6a37}
.tagM{display:inline-block;border-radius:6px;padding:1px 8px;font-size:12px;font-weight:700;margin-left:6px;background:#eee8d8;color:#6b5400}
.modechip{font-size:13px;color:#d9d0f2}
.note{font-size:15px;color:#3b2475;margin-top:8px}
.langbar{display:flex;gap:8px;align-items:center;margin-top:10px;font-size:14px;color:#d9d0f2}
.langbar select{font:inherit}
.trans{display:block;font-weight:500;font-size:14px;color:#5b5078;margin-top:4px}
.trans[hidden]{display:none}
.mean{margin-top:10px;background:#eef6ff;border:2px solid #b8d4f2;border-radius:12px;padding:8px 12px;font-size:17px;font-weight:700;color:#12325a}
.mean[hidden]{display:none}
.mean .de{direction:ltr;unicode-bidi:isolate}
body.rtl .start,body.rtl .disc,body.rtl .card,body.rtl .settings,body.rtl .help,body.rtl .langbar{direction:rtl;text-align:right}
body.rtl .opts,body.rtl .opt,body.rtl .model,body.rtl .machine,body.rtl table td.de,body.rtl .inputrow input{direction:ltr;text-align:left}
body.rtl .mode{direction:ltr;text-align:left}
body.rtl .mode .trans{direction:rtl;text-align:right}
body.rtl .inputrow{direction:ltr}
.de{unicode-bidi:isolate}
body.rtl h1 span{unicode-bidi:plaintext;text-align:left}

</style>
</head>

<div class="wrap">
  <header>

  <section class="start" id="start">

    <div class="tl" id="tl"><span data-i18n="tl_past"></span><span data-i18n="tl_pres"></span><span data-i18n="tl_fut"></span></div>
    <button type="button" class="spin" id="spin" data-i18n="spin"></button>
  </div>

  <div class="settings">
    <span class="modechip" id="modeEl"></span>
    <button type="button" class="linkbtn" id="chgMode" data-i18n="chg"></button>
    <label><span data-i18n="tenses"></span>
      <select id="selTense"><option value="all" data-i18n="t_all"></option><option value="pf" data-i18n="t_pf"></option><option value="past" data-i18n="t_past"></option></select>
    </label>
    <label><span data-i18n="tlbl"></span>
      <select id="selTl"><option value="on" data-i18n="tl_on"></option><option value="off" selected data-i18n="tl_off"></option></select>
    </label>
    <label><input type="checkbox" id="chkSound"> <span data-i18n="sound"></span></label>
    <button type="button" class="linkbtn" id="resetScore" data-i18n="reset"></button>
  </div>

  <div class="card" id="card" hidden>
    <div class="task"><strong data-i18n="task"></strong> <span data-i18n="task_t"></span></div>
    <div class="inputrow">
      <input id="ans" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Antwort" lang="de" dir="ltr">
      <button type="button" class="btn" id="btnCheck" data-i18n="check"></button>
      <button type="button" class="btn ghost" id="btnReveal" data-i18n="reveal"></button>
      <button type="button" class="btn ghost" id="btnMean" data-i18n="meaning" hidden></button>
    </div>
    <div class="mean" id="mean" hidden></div>
    <p class="tip" data-i18n="tip"></p>
    <div id="fb" role="status" aria-live="polite"></div>
    <div id="sol" hidden></div>
  </div>

  <details class="help">
    <summary data-i18n="help_sum"></summary>
    <ul>
      <li data-i18n="h1"></li><li data-i18n="h2"></li><li data-i18n="h3"></li><li data-i18n="h4"></li><li data-i18n="h5"></li>
    </ul>
  </details>
  </div>
</div>

function PH(cat,sub,arr){

    mkP(pre,a[1],cn,cat,sub);
  });
}
function SPX(cat,sub,pre,v,only,extra){
  var e=extra||{};e.only=only;mkP(pre,v,null,cat,sub,e);
}

function wpick(list,rnd){
  var by={},keys=[],i,tot=0,r,acc=0,k,arr;
  for(i=0;i<list.length;i++){k=list[i].v;if(!by[k]){by[k]=[];keys.push(k);tot+=vw(k);}by[k].push(list[i]);}
  r=rnd()*tot;k=keys[keys.length-1];
  for(i=0;i<keys.length;i++){acc+=vw(keys[i]);if(r<acc){k=keys[i];break;}}
  arr=by[k];
  return arr[Math.floor(rnd()*arr.length)];
}
function pickPhrase(cfg,rnd,filter){
  rnd=rnd||Math.random;
  filter=filter||function(){return true;};
  var r=rnd(),cands,s,sub,i,l;
  if(r<HS_SHARE){cands=[G.hs,G.a];}
  else if(cfg.mode==='B'&&r<HS_SHARE+(1-HS_SHARE)*B_SHARE){
    s=rnd();sub=s<SUB_B.m?'m':(s<SUB_B.m+SUB_B.u?'u':'n');
    cands=[G.b[sub],G.b.n,G.b.u,G.b.m,G.a,G.hs];
  }else{cands=[G.a,G.hs];}
  for(i=0;i<cands.length;i++){
    l=cands[i].filter(filter);
    if(l.length){return wpick(l,rnd);}
  }
  return null;
}
function pick(a,rnd){return a[Math.floor(rnd()*a.length)];}
function pickSubj(phrase,rnd){
  var l=SUBJ.filter(function(s){return subjOK(s,phrase);});
  return pick(l,rnd);
}

var TIMES={
  past:['gestern','vorgestern','gestern Abend','gestern Nacht','gestern um 20:00 Uhr','letzte Woche','letzten Monat','letztes Jahr','letzten Sommer','letzten Montag','letzten Freitag','vor einer Stunde','vor zwei Tagen','vor einer Woche','vor einem Monat','vor drei Jahren','vor langer Zeit','früher','damals','als Kind'],
  pres:['jetzt','im Moment','momentan','zurzeit','gerade jetzt','in diesem Moment','heutzutage'],
  fut:['morgen','übermorgen','morgen früh um 07:00 Uhr','nächste Woche','nächsten Monat','nächstes Jahr','nächsten Sommer','nächsten Freitag','in einer Stunde','in zwei Tagen','in einem Monat','in drei Jahren','bald','in Zukunft'],
  clock:['06:00','08:00','10:30','12:00','15:00','18:00','20:00','22:00']
};
function timePools(nowMin){
  var out={past:[],pres:[],fut:[]},i,c,hm,m,d;
  for(i=0;i<TIMES.past.length;i++){out.past.push({t:TIMES.past[i],k:'past'});}
  for(i=0;i<TIMES.pres.length;i++){out.pres.push({t:TIMES.pres[i],k:'pres'});}
  for(i=0;i<TIMES.fut.length;i++){out.fut.push({t:TIMES.fut[i],k:'fut'});}
  for(i=0;i<TIMES.clock.length;i++){
    c=TIMES.clock[i];hm=c.split(':');m=parseInt(hm[0],10)*60+parseInt(hm[1],10);d=m-nowMin;
    if(d<=-10){out.past.push({t:'heute um '+c+' Uhr',k:'past',c:m});}
    else if(d>=10){out.fut.push({t:'heute um '+c+' Uhr',k:'fut',c:m});}
  }
  return out;
}
function kOf(item,nowMin){if(item.c!==undefined&&item.c!==null){return item.c<nowMin?'past':'fut';}return item.k;}
function pickTime(tenseCfg,nowMin,rnd){
  var pools=timePools(nowMin),w,keys,k,acc=0,r=rnd(),cat,i;
  if(tenseCfg==='past'){w={past:1};}else if(tenseCfg==='pf'){w={pres:0.5,fut:0.5};}else{w={past:0.45,pres:0.30,fut:0.25};}
  keys=[];for(k in w){if(w.hasOwnProperty(k)){keys.push(k);}}
  cat=keys[keys.length-1];
  for(i=0;i<keys.length;i++){acc+=w[keys[i]];if(r<acc){cat=keys[i];break;}}
  return pick(pools[cat],rnd);
}

/* Üblich: haben/sein (Vollverb) und Modalverben -> Präteritum, alle anderen Verben -> Perfekt */
function usual(st){
  var v;
  if(st.kind==='past'){
    v=V[st.phrase.v];
    return (v.kind==='hs'||v.kind==='modal')?'praet':'perfekt';
  }
  return 'praes';
}
function alts(st){
  if(st.kind==='past'){return [usual(st)==='praet'?'perfekt':'praet'];}
  if(st.kind==='fut'){return ['futur'];}
  return [];
}
function newSpin(prev,held,cfg,nowMin,rnd){
  rnd=rnd||Math.random;
  var st={},keep=!!prev,phrase,subj,flt;
  st.time=(keep&&held[0])?prev.time:pickTime(cfg.tense,nowMin,rnd);
  if(keep&&held[2]&&held[1]){phrase=prev.phrase;subj=prev.subj;}
  else if(keep&&held[2]){phrase=prev.phrase;subj=pickSubj(phrase,rnd);}
  else if(keep&&held[1]){
    subj=prev.subj;
    flt=function(p){return subjOK(subj,p);};
    phrase=pickPhrase(cfg,rnd,flt);
    if(!phrase){phrase=pickPhrase(cfg,rnd);subj=pickSubj(phrase,rnd);}
  }else{phrase=pickPhrase(cfg,rnd);subj=pickSubj(phrase,rnd);}
  st.phrase=phrase;st.subj=subj;
  st.kind=kOf(st.time,nowMin);
  st.tense=usual(st);
  return st;
}

function cap(s){return s.charAt(0).toUpperCase()+s.slice(1);}
function join(a){var o=[],i;for(i=0;i<a.length;i++){if(a[i]){o.push(a[i]);}}return o.join(' ');}
function nounFor(b,g){if(g==='f'){return b+'in';}if(g==='fpl'){return b+'innen';}if(g==='x'){return b+'/in';}return b;}
function preFor(ph,g){return ph.cn?nounFor(ph.cn,g):ph.pre;}
function auxOf(ph){return ph.aux||V[ph.v].aux;}
function vtoks(st,tense){
  var ph=st.phrase,v=V[ph.v],i=IDX[st.subj.p],fin;
  if(tense==='perfekt'){
    if(ph.inf){return [V.haben.p[i],v.inf];}
    return [V[auxOf(ph)].p[i],v.pp];
  }
  if(tense==='futur'){return [WERDEN[i],v.inf];}
  fin=(tense==='praes'?v.p:v.t)[i];
  return v.sep?[fin,v.sep]:[fin];
}
function clause(st,tense,g){
  var t=vtoks(st,tense);
  return join([st.subj.t,t[0],preFor(st.phrase,g||st.subj.g),t[1]||'']);
}
function sentence(st,tense,order,g){
  var t=vtoks(st,tense),pre=preFor(st.phrase,g||st.subj.g),fin=t[0],end=t[1]||'';
  var parts=order==='time'?[st.time.t,fin,st.subj.t,pre,end]:[st.subj.t,fin,st.time.t,pre,end];
  return cap(join(parts))+'.';
}
function stamm(st){
  var ph=st.phrase,v=V[ph.v],pret=v.t[2]+(v.sep?' '+v.sep:'');
  if(ph.inf){return v.inf+' – '+pret+' – (hat) … '+v.inf;}
  return v.inf+' – '+pret+' – '+(auxOf(ph)==='sein'?'ist ':'hat ')+v.pp;
}
/* Merkhinweis zur Aufgabe: liefert Textschlüssel (Übersetzung in der Oberfläche) */
function merke(st){
  var ph=st.phrase,v=V[ph.v];
  if(st.kind!=='past'){return st.kind==='fut'?{k:'m_fut'}:null;}
  if(v.kind==='hs'){return {k:'m_hs'};}
  if(v.kind==='modal'){return {k:'m_modal'};}
  if(v.untr){return {k:'m_untr',pp:v.pp};}
  if(v.ieren){return {k:'m_ieren',pp:v.pp};}
  if(v.sep){return {k:'m_sep',pp:v.pp};}
  return {k:'m_def',add:auxOf(ph)==='sein'?'m_def_sein':null};
}
function solutionRows(st){
  var u=usual(st),a=alts(st),rows=[],order,i;
  if(st.kind==='past'){order=['praet','perfekt'];}
  else if(st.kind==='fut'){order=['praes','futur'];}
  else{order=['praes'];}
  for(i=0;i<order.length;i++){
    rows.push({tn:order[i],text:cap(clause(st,order[i]))+'.',tag:order[i]===u?'usual':'possible'});
  }
  return rows;
}

/* ================= Prüfen ================= */
function norm(s){
  return String(s).toLowerCase().replace(/\/in\b/g,'in').replace(/\(in\)/g,'in')
    .replace(/ß/g,'ss').replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue')
    .replace(/[.,;:!?„“”"'’‘…()\/\-–]/g,' ').replace(/\s+/g,' ').replace(/\b0(\d)/g,'$1').trim();
}
function toks(s){var n=norm(s);return n?n.split(' '):[];}
function key(s){return toks(s).sort().join(' ');}
function keysFor(st,tense){
  var m={},gs=st.subj.g==='x'?['m','f']:[st.subj.g],s=st.subj.t,t=st.time.t,i,j,pre,combos,vt=vtoks(st,tense).join(' ');
  for(i=0;i<gs.length;i++){
    pre=preFor(st.phrase,gs[i]);
    combos=[vt,vt+' '+s,vt+' '+pre,vt+' '+s+' '+pre,vt+' '+s+' '+t,vt+' '+pre+' '+t,vt+' '+s+' '+pre+' '+t];
    for(j=0;j<combos.length;j++){m[key(combos[j])]=true;}
  }
  return m;
}
function evaluate(st,raw){
  var k=key(raw),ts,inp={},i,u=usual(st),a=alts(st),order=['perfekt','praet','praes','futur'],ph=st.phrase,v=V[ph.v],np,hint=null;
  if(!k){return {status:'empty'};}
  if(keysFor(st,u)[k]){return {status:'ok'};}
  for(i=0;i<a.length;i++){if(keysFor(st,a[i])[k]){return {status:'unusual',tense:a[i],usual:u};}}
  ts=toks(raw);for(i=0;i<ts.length;i++){inp[ts[i]]=true;}
  function has(tn){var w=toks(vtoks(st,tn).join(' ')),j;for(j=0;j<w.length;j++){if(!inp[w[j]]){return false;}}return true;}
  if(has(u)){return {status:'verbok'};}
  for(i=0;i<a.length;i++){if(has(a[i])){return {status:'verbok_unusual',tense:a[i],usual:u};}}
  for(i=0;i<order.length;i++){
    if(order[i]!==u&&a.indexOf(order[i])<0&&has(order[i])){return {status:'othertense',tense:order[i]};}
  }
  /* gezielte Hinweise */
  if(!ph.inf){
    np=norm(v.pp);
    if(v.untr&&inp['ge'+np]){hint='untr';}
    else if(inp[np]&&(u==='perfekt'||a.indexOf('perfekt')>=0)){hint='aux';}
  }
  return {status:'wrong',hint:hint};
}

root.SlotLogic={V:V,PHR:PHR,G:G,SUBJ:SUBJ,TIMES:TIMES,TN:TN,HS_SHARE:HS_SHARE,B_SHARE:B_SHARE,SUB_B:SUB_B,IDX:IDX,VWT:VWT,vw:vw,
  timePools:timePools,kOf:kOf,newSpin:newSpin,pickPhrase:pickPhrase,pickTime:pickTime,pickSubj:pickSubj,subjOK:subjOK,
  cap:cap,usual:usual,alts:alts,preFor:preFor,vtoks:vtoks,clause:clause,sentence:sentence,stamm:stamm,merke:merke,
  solutionRows:solutionRows,evaluate:evaluate,keysFor:keysFor,norm:norm,key:key,auxOf:auxOf};
})(typeof window!=='undefined'?window:this);

<script id="ui">
(function(){
'use strict';
var L=window.SlotLogic;
function $(id){return document.getElementById(id);}
var lang='de',lastFb=null,showMean=false;
function T(k,p){
  var s=(I18N[lang]&&I18N[lang][k]!==undefined)?I18N[lang][k]:I18N.de[k],x;
  if(p){for(x in p){if(p.hasOwnProperty(x)){s=s.split('{'+x+'}').join(p[x]);}}}
  return s;
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

var reels=[$('reel0'),$('reel1'),$('reel2')];

var cfg={tense:'all',mode:'A'},curScreen='start';
var tlOn=false,soundOn=false,ac=null;
var reduce=!!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches);

(function(){var h='',i;for(i=0;i<14;i++){h+='<i></i>';}$('lights').innerHTML=h;})();

function tone(f,d,type,vol,delay){
  if(!soundOn){return;}
  try{
    if(!ac){var A=window.AudioContext||window.webkitAudioContext;if(!A){return;}ac=new A();}
    var o=ac.createOscillator(),g=ac.createGain(),t0=ac.currentTime+(delay||0);
    o.type=type||'square';o.frequency.value=f;
    g.gain.setValueAtTime(vol||0.05,t0);g.gain.exponentialRampToValueAtTime(0.0001,t0+d);
    o.connect(g);g.connect(ac.destination);o.start(t0);o.stop(t0+d+0.02);
  }catch(e){}
}
function clack(){tone(220,0.08,'square',0.06);}
function winSound(){tone(523,0.14,'triangle',0.08,0);tone(659,0.14,'triangle',0.08,0.12);tone(784,0.14,'triangle',0.08,0.24);tone(1047,0.28,'triangle',0.08,0.36);}
function badSound(){tone(150,0.25,'sawtooth',0.05);}

function timeCell(it){return esc(L.cap(it.t));}
var NOTEKEY={'eine Person':'note_one','mehrere Personen':'note_many','formell':'note_formal'};
function subjCell(s){return esc(L.cap(s.t))+(s.note?'<small>'+esc(NOTEKEY[s.note]?T(NOTEKEY[s.note]):s.note)+'</small>':'');}
function phraseCell(p){return esc(p.d);}
function rnd(a){return a[Math.floor(Math.random()*a.length)];}
function allTimes(){return L.TIMES.past.concat(L.TIMES.pres,L.TIMES.fut);}
function plainSubj(){return L.SUBJ.filter(function(s){return !s.sp&&!s.an;});}
function poolPhrases(){
  var l=L.G.hs.concat(L.G.a);
  if(cfg.mode==='B'){l=l.concat(L.G.b.m,L.G.b.u,L.G.b.n);}
  return l;
}
function fillers(i,n){
  var out=[],k,ps=poolPhrases(),ss=plainSubj();
  for(k=0;k<n;k++){
    if(i===0){out.push(esc(L.cap(rnd(allTimes()))));}
    else if(i===1){out.push(subjCell(rnd(ss)));}
    else{out.push(phraseCell(Math.random()<0.3?rnd(L.G.hs):rnd(ps)));}
  }
  return out;
}
function mkCell(html){var d=document.createElement('div');d.className='cell';d.innerHTML=html;return d;}

function animate(i,finalHtml,dur,cb){
  var reel=reels[i],strip=reel.firstElementChild,H=reel.clientHeight,n,f,j,done=false,fl=fillers(i,12+i*5);
  var first=strip.firstElementChild?strip.firstElementChild.cloneNode(true):mkCell('?');
  strip.innerHTML='';strip.appendChild(first);
  for(j=0;j<fl.length;j++){strip.appendChild(mkCell(fl[j]));}
  strip.appendChild(mkCell(finalHtml));
  strip.style.transition='none';strip.style.transform='translateY(0)';
  void strip.offsetHeight;
  n=strip.children.length-1;
  reel.className='reel spinning';
  strip.style.transition='transform '+dur+'ms cubic-bezier(.17,.67,.2,1)';
  strip.style.transform='translateY('+(-n*H)+'px)';
  f=function(){
    if(done){return;}done=true;
    reel.className='reel';
    var last=strip.lastElementChild;strip.innerHTML='';strip.appendChild(last);
    strip.style.transition='none';strip.style.transform='translateY(0)';
    clack();cb();
  };
  strip.addEventListener('transitionend',f);
  setTimeout(f,dur+150);
}

function setHoldDisabled(v){var i;for(i=0;i<3;i++){holdBtns[i].disabled=v;}}
function resetHolds(){
  var i;held=[false,false,false];
  for(i=0;i<3;i++){holdBtns[i].className='hold';holdBtns[i].setAttribute('aria-pressed','false');holdBtns[i].textContent=T('hold');}
}

function spin(){
  if(busy){return;}
  busy=true;$('spin').disabled=true;setHoldDisabled(true);$('card').hidden=true;
  var now=new Date(),nowMin=now.getHours()*60+now.getMinutes();
  var next=L.newSpin(state,held,cfg,nowMin);
  var finals=[timeCell(next.time),subjCell(next.subj),phraseCell(next.phrase)];
  var pending=0,base=reduce?150:1100,i;
  function one(){pending--;if(pending<=0){finish(next);}}
  for(i=0;i<3;i++){
    if(state&&held[i]&&!(i===1&&state.subj!==next.subj)&&!(i===2&&state.phrase!==next.phrase)){continue;}
    pending++;
    animate(i,finals[i],base+i*550,one);
  }
  if(pending===0){finish(next);}
}

function updateTl(){
  var tl=$('tl'),spans=tl.getElementsByTagName('span'),idx=-1,i;
  tl.hidden=!tlOn;
  if(state){idx=state.kind==='past'?0:(state.kind==='pres'?1:2);}
  for(i=0;i<spans.length;i++){spans[i].className=(i===idx)?'on':'';}
}

function finish(next){
  state=next;busy=false;$('spin').disabled=false;setHoldDisabled(false);
  solved=false;attempts=0;
  $('ans').value='';$('ans').disabled=false;$('btnCheck').disabled=false;
  lastFb=null;$('fb').textContent='';$('fb').className='';$('sol').hidden=true;$('sol').innerHTML='';showMean=false;$('mean').hidden=true;
  updateTl();
  $('card').hidden=false;
  if(window.matchMedia&&window.matchMedia('(pointer:fine)').matches){$('ans').focus();}
}

function renderFb(){
  var f=$('fb');
  if(!lastFb){f.textContent='';f.className='';return;}
  f.textContent=lastFb.keys.map(function(k){return T(k.k,k.p);}).join(' ');f.className=lastFb.cls||'';
}
function setFb(keys,cls){lastFb=keys?{keys:keys,cls:cls}:null;renderFb();}
function updateScore(){$('scoreEl').textContent='⭐ '+score+' '+T('pts');$('streakEl').textContent='🔥 '+T('streak')+': '+streak;}
function renderMean(){
  var m=$('mean'),v,tr;
  if(!showMean||!state||lang==='de'){m.hidden=true;return;}
  v=state.phrase.v;tr=(window.VMEAN&&VMEAN[v])?VMEAN[v][lang]:'';
  m.innerHTML=tr?('<span class="de">'+esc(v)+'</span> = '+esc(tr)):'';
  m.hidden=!tr;
}

var solOn=false;
function showSolution(){
  solOn=true;renderSolution();
}
function renderSolution(){
  if(!solOn||!state){return;}
  var st=state,rows='',i,verdict,u=L.usual(st),sr=L.solutionRows(st),r,m1,m2,badge='',v=L.V[st.phrase.v],mk=L.merke(st),vt;
  if(st.kind==='past'){vt=T('v_past',{t:L.TN[u]});}
  else if(st.kind==='pres'){vt=T('v_pres',{t:L.TN.praes});}
  else{vt=T('v_fut');}
  verdict='<div class="verdict"><span class="de" dir="ltr">„'+esc(st.time.t)+'“</span> = '+esc(vt)+'</div>';
  m1=L.sentence(st,u,'time');m2=L.sentence(st,u,'subj');
  for(i=0;i<sr.length;i++){
    r=sr[i];
    rows+='<tr'+(r.tag==='usual'?' class="need"':'')+'><th>'+L.TN[r.tn]+'</th><td class="de">'+esc(r.text)+(r.tag==='usual'?' ◀':'')
      +(sr.length>1?(r.tag==='usual'?'<span class="tagU">'+esc(T('tag_u'))+'</span>':'<span class="tagM">'+esc(T('tag_x'))+'</span>'):'')+'</td></tr>';
  }
  if(v.kind==='hs'){badge='<span class="badge">'+esc(v.inf+' '+T('b_hs'))+'</span>';}
  else if(v.kind==='modal'){badge='<span class="badge">'+esc(T('b_modal'))+'</span>';}
  else if(v.untr){badge='<span class="badge">'+esc(T('b_untr'))+'</span>';}
  $('sol').innerHTML=verdict+'<div class="model">'+esc(m1)+'<br>'+esc(m2)+'</div>'
    +'<table><tbody>'+rows+'</tbody></table>'
    +(mk?'<div class="note"><b>'+esc(T('merke_l'))+'</b> '+esc(T(mk.k,{pp:mk.pp||''})+(mk.add?' '+T(mk.add):''))+'</div>':'')
    +'<div class="stamm">'+esc(T('stammlbl'))+' <span class="de">'+esc(L.stamm(st))+'</span>'+badge+'</div>';
  $('sol').hidden=false;
}

function unusualKey(r){
  return r.tense==='futur'?'fb_u_futur':(r.tense==='praet'?'fb_u_praet':'fb_u_perf');
}

function check(){
  if(!state||solved){return;}
  var raw=$('ans').value,r=L.evaluate(state,raw),pts,u=L.usual(state),alt=(u==='praet'?'perfekt':'praet');
  if(r.status==='empty'){setFb([{k:'fb_empty'}],'warn');return;}
  if(r.status==='ok'||r.status==='unusual'){
    pts=attempts===0?10:5;score+=pts;streak++;solved=true;
    if(r.status==='ok'){setFb([{k:'fb_ok',p:{n:pts}}],'good');}
    else{setFb([{k:'fb_ok',p:{n:pts}},{k:unusualKey(r)}],'warn');}
    winSound();
    $('ans').disabled=true;$('btnCheck').disabled=true;updateScore();showSolution();return;
  }
  attempts++;badSound();
  if(r.status==='verbok'){
    setFb([{k:'fb_verbok'}],'warn');
  }else if(r.status==='verbok_unusual'){
    setFb([{k:unusualKey(r)},{k:'fb_u_rest'}],'warn');
  }else if(r.status==='othertense'){
    if(state.kind==='past'){setFb([{k:'fb_oth_past',p:{t:L.TN[r.tense],u:L.TN[u],a:L.TN[alt]}}],'bad');}
    else{setFb([{k:state.kind==='pres'?'fb_oth_pres':'fb_oth_fut',p:{t:L.TN[r.tense]}}],'bad');}
  }else if(r.hint==='untr'){
    setFb([{k:'fb_untr'}],'bad');
  }else if(r.hint==='aux'){
    setFb([{k:'fb_aux'}],'bad');
  }else{
    setFb([{k:'fb_wrong'}],'bad');
  }
}
function reveal(){
  if(!state){return;}
  if(!solved){streak=0;updateScore();setFb(null);}
  solved=true;$('ans').disabled=true;$('btnCheck').disabled=true;showSolution();

var DISC_A=[
  {q:'q_usual',a:'Gestern war ich müde.',b:'Gestern bin ich müde gewesen.',right:'a',ex:'ex_hs'},
  {q:'q_usual',a:'Gestern ging ich ins Kino.',b:'Gestern bin ich ins Kino gegangen.',right:'b',ex:'ex_perf'},
  {q:'q_usual',a:'Letzte Woche hatte ich viel Arbeit.',b:'Letzte Woche habe ich viel Arbeit gehabt.',right:'a',ex:'ex_hs'},
  {q:'q_usual',a:'Ich habe gestern Brot gekauft.',b:'Ich kaufte gestern Brot.',right:'a',ex:'ex_perf2'}
];
var DISC_B=[
  {q:'q_modal',a:'Gestern musste ich arbeiten.',b:'Gestern habe ich arbeiten müssen.',right:'a',ex:'ex_modal'},
  {q:'q_untr',a:'Ich habe die Frage verstanden.',b:'Ich habe die Frage geverstanden.',right:'a',ex:'ex_untr'},
  {q:'q_sep',a:'Ich habe dich angerufen.',b:'Ich habe dich geanrufen.',right:'a',ex:'ex_sep'}
];
var discDone=0,discTotal=0,discItems=[],discPicked={};
function buildDisc(mode){
  var items=DISC_A.concat(mode==='B'?DISC_B:[]),h='',i;
  discItems=items;discDone=0;discTotal=items.length;discPicked={};
  for(i=0;i<items.length;i++){
    h+='<div class="pair" data-i="'+i+'"><div class="q" data-q="'+i+'"></div><div class="opts">'
      +'<button type="button" class="opt" data-k="a">'+esc(items[i].a)+'</button>'
      +'<button type="button" class="opt" data-k="b">'+esc(items[i].b)+'</button></div><div class="ex" data-ex="'+i+'"></div></div>';
  }
  $('pairs').innerHTML=h;
  var btns=$('pairs').querySelectorAll('.opt'),j;
  function bind(btn){
    btn.addEventListener('click',function(){
      var pair=btn.parentNode.parentNode,idx=parseInt(pair.getAttribute('data-i'),10),it=items[idx],ob=pair.querySelectorAll('.opt'),k;
      for(k=0;k<ob.length;k++){

      if(btn.getAttribute('data-k')!==it.right){btn.className='opt wrongpick';}
      discPicked[idx]=(btn.getAttribute('data-k')===it.right);
      discDone++;
      renderDisc();
    });

  for(j=0;j<btns.length;j++){bind(btns[j]);}

}

  $('merke').hidden=!(discDone>=discTotal);
  $('discGo').textContent=(discDone>=discTotal)?T('disc_go'):T('disc_skip');

function applyLang(){
  var i,els=document.querySelectorAll('[data-i18n]'),el,k,txt;
  document.documentElement.lang=lang;
  document.body.className=(RTL[lang]?'rtl':'');
  for(i=0;i<els.length;i++){

  $('modeEl').textContent=T(cfg.mode==='A'?'chip_a':'chip_b');
  $('btnMean').hidden=(lang==='de');
  updateScore();renderFb();renderMean();renderSolution();
  if(discItems.length&&curScreen==='disc'){renderDisc();}
}
(function(){
  var sel=$('selLang'),h='',i,saved=null;
  for(i=0;i<LANGS.length;i++){h+='<option value="'+LANGS[i][0]+'">'+esc(LANGS[i][1])+'</option>';}
  sel.innerHTML=h;
  try{saved=localStorage.getItem('slot_lang');}catch(e){}
  if(saved&&I18N[saved]){lang=saved;}
  sel.value=lang;
  sel.addEventListener('change',function(){
    lang=this.value;
    try{localStorage.setItem('slot_lang',lang);}catch(e){}
    applyLang();
  });
})();
applyLang();updateTl();show('start');
})();

</script>
