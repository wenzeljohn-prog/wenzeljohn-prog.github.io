  .rules li { margin:6px 0; }
  .hidden { display:none !important; }

  :root { --font: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  body { font-family: var(--font); }

  .wrap { max-width:640px; padding:12px 16px 40px; }

    if (text !== undefined && text !== null) e.textContent = text;
    return e;
  }
  function fmt(str, vals) {
    return str.replace(/\{(\w+)\}/g, function (m, k) { return (vals && (k in vals)) ? vals[k] : m; });
  }
  function shuffle(arr) {

  }
  function setLangAttrs(node, code) {

    node.dir = (code === "ar") ? "rtl" : "ltr";
    return node;
  }
  function deNode(tag, cls, text) { return setLangAttrs(el(tag, cls, text), "de"); }
  function tgNode(tag, cls, text) { return setLangAttrs(el(tag, cls, text), STR.lang); }
  function meaning(e) { return e[STR.lang]; }

  /* ---------- Auswahl / Pool ---------- */
  function inSel(e) {
    for (var i = 0; i < e.ls.length; i++) if (sel.indexOf(e.ls[i]) >= 0) return true;
    return false;
  }
  function wordsOfSel(list) {
    var out = [];
    for (var i = 0; i < WORDS.length; i++) {
      var e = WORDS[i], hit = false;
      for (var k = 0; k < e.ls.length; k++) if (list.indexOf(e.ls[k]) >= 0) { hit = true; break; }
      if (hit) out.push(e);
    }
    return out;
  }
  function partOf(e, L) {
    var idx = e.ls.indexOf(L);
    if (idx < 0) return "";
    return e.cats[idx].replace(/^\d+/, "");
  }
  function getPool() {
    var all = wordsOfSel(sel);
    if (state.part === "ALL" || sel.length !== 1) return all;
    var out = [];
    for (var i = 0; i < all.length; i++) if (partOf(all[i], sel[0]) === state.part) out.push(all[i]);
    return out;
  }
  function maxSel() { var m = 0; for (var i = 0; i < sel.length; i++) if (sel[i] > m) m = sel[i]; return m; }
  function lessonTag(e) {
    var parts = [];
    for (var i = 0; i < e.ls.length; i++) {
      if (sel.indexOf(e.ls[i]) >= 0) parts.push(e.ls[i]);
    }
    if (!parts.length) parts = e.ls.slice(0, 1);
    return STR.lessonShort + parts.join("/");
  }
  function selSummary() {
    if (sel.length === LESSONS) return STR.summaryAll;
    if (sel.length === 1) return fmt(STR.summaryOne, { l: sel[0] });
    return fmt(STR.summaryMany, { l: compactList(sel) });
  }
  function compactList(list) {
    // 1,2,3,5 -> 1–3, 5
    var out = [], i = 0;
    while (i < list.length) {
      var j = i;
      while (j + 1 < list.length && list[j + 1] === list[j] + 1) j++;
      if (j - i >= 2) out.push(list[i] + "–" + list[j]);
      else for (var k = i; k <= j; k++) out.push(String(list[k]));
      i = j + 1;
    }
    return out.join(STR.listSep || ", ");
  }

  /* ---------- Speicher ---------- */
  function lsGet(key) { try { return window.localStorage.getItem(key); } catch (e) { return null; } }
  function lsSet(key, val) { try { window.localStorage.setItem(key, val); } catch (e) {} }
  function loadProgress() {
    var raw = lsGet(PROG_KEY);
    if (!raw) return {};
    try { var p = JSON.parse(raw); return (p && typeof p === "object") ? p : {}; } catch (e) { return {}; }
  }
  function saveProgress(p) { lsSet(PROG_KEY, JSON.stringify(p)); }
  function recordResult(id, ok) {
    var p = loadProgress();
    if (!p[id]) p[id] = { c: 0, w: 0 };
    if (ok) {
      p[id].c += 1;
      if (typeof p[id].b === "number") p[id].b = Math.min(p[id].b + 1, 2);
    } else {
      p[id].w += 1;
      p[id].b = 0;
    }
    saveProgress(p);
  }
  function loadSel() {
    var raw = lsGet(SEL_KEY), out = [];
    if (!raw) return out;
    try {
      var a = JSON.parse(raw);
      for (var i = 0; i < a.length; i++) if (typeof a[i] === "number" && a[i] >= 1 && a[i] <= LESSONS && out.indexOf(a[i]) < 0) out.push(a[i]);
    } catch (e) {}
    out.sort(function (x, y) { return x - y; });
    return out;
  }
  function saveSel() { lsSet(SEL_KEY, JSON.stringify(sel)); }

  /* ---------- Gewichtete Auswahl (Leitner: 3 Boxen) ---------- */
  function itemWeight(e, p) {
    var r = p[e.id];
    if (!r || typeof r.b !== "number") return 1;
    return BOX_WEIGHTS[r.b] !== undefined ? BOX_WEIGHTS[r.b] : 1;
  }
  function weightedSample(pool, n) {
    var p = loadProgress(), keyed = [];
    for (var i = 0; i < pool.length; i++) {
      keyed.push({ e: pool[i], k: Math.pow(Math.random(), 1 / itemWeight(pool[i], p)) });
    }
    keyed.sort(function (a, b) { return b.k - a.k; });
    var out = [];
    for (var j = 0; j < keyed.length && out.length < n; j++) out.push(keyed[j].e);
    return out;
  }

  /* ---------- Bedeutungsvergleich ---------- */
  function normTr(s) {
    return s.replace(/\([^)]*\)/g, "").replace(/[.!?]+$/g, "").replace(/\s+/g, " ").trim().toLowerCase();
  }
  function altsOf(s) { return normTr(s).replace(/[,:\u2014\-]/g, " ").split(/\s*[\/;]\s*/); }
  function altOverlap(x, y) {
    x = x.replace(/\s+/g, " ").trim(); y = y.replace(/\s+/g, " ").trim();
    if (!x || !y) return false;
    if (x === y) return true;
    var sh = x.length <= y.length ? x : y, lg = x.length <= y.length ? y : x;
    if (sh.length < 3) return false;
    return (" " + lg + " ").indexOf(" " + sh + " ") >= 0;
  }
  // gleiche oder enthaltene Bedeutung (z.B. "doctor" / "family doctor") in irgendeiner der 4 Sprachen
  function sameMeaning(a, b) {
    if (a === b) return true;
    for (var i = 0; i < MEANING_LANGS.length; i++) {
      var l = MEANING_LANGS[i];
      var xa = altsOf(a[l]), xb = altsOf(b[l]);
      for (var p = 0; p < xa.length; p++) for (var q = 0; q < xb.length; q++) if (altOverlap(xa[p], xb[q])) return true;
    }
    return false;
  }

  /* ---------- Distraktoren: nur bedeutungsverwandte Woerter ---------- */
  function candidateTiers(item) {
    var pc = posClass(item), g = groupOf(item), maxL = maxSel();
    var firstL = item.ls[0];
    function eligible(c) { return c.ls[0] <= maxL && c !== item; }
    if (pc === "ph") {
      return [
        function (c) { return eligible(c) && posClass(c) === "ph" && c.cats[0] === item.cats[0]; },
        function (c) { return eligible(c) && posClass(c) === "ph" && c.ls[0] === firstL; },
        function (c) { return eligible(c) && posClass(c) === "ph"; }
      ];
    }
    return [
      function (c) { return eligible(c) && c.sem === item.sem && posClass(c) === pc; },
      function (c) { return eligible(c) && groupOf(c) === g && posClass(c) === pc; },
      function (c) { return eligible(c) && posClass(c) === pc && c.cats[0] === item.cats[0]; },
      function (c) { return eligible(c) && posClass(c) === pc; }
    ];
  }
  function pickDistractors(item, n, field) {
    var tiers = candidateTiers(item), chosen = [], used = {}, usedTier = [];
    var shown = function (c) { return field === "de" ? c.de : c[field]; };
    used[shown(item)] = true;
    for (var t = 0; t < tiers.length && chosen.length < n; t++) {
      var cands = [];
      for (var i = 0; i < WORDS.length; i++) if (tiers[t](WORDS[i])) cands.push(WORDS[i]);
      cands = shuffle(cands);
      for (var j = 0; j < cands.length && chosen.length < n; j++) {
        var c = cands[j];
        if (used[shown(c)]) continue;
        if (sameMeaning(item, c)) continue;
        var clash = false;
        for (var k = 0; k < chosen.length; k++) if (sameMeaning(chosen[k], c)) { clash = true; break; }
        if (clash) continue;
        used[shown(c)] = true;
        chosen.push(c);
        usedTier.push(t);
      }
    }
    pickDistractors.lastTiers = usedTier;
    return chosen;
  }

  /* ---------- Kopf / Tabs / Teile ---------- */
  function renderTabs() {
    var nav = $("tabs");
    nav.innerHTML = "";
    var tabs = [["flash", STR.tabFlashcards], ["quiz", STR.tabQuiz], ["match", STR.tabMatch], ["type", STR.tabType], ["progress", STR.tabProgress]];
    for (var i = 0; i < tabs.length; i++) {
      (function (key, label) {
        var b = el("button", "tab" + (key === state.tab ? " on" : ""), label);
        b.type = "button";
        b.addEventListener("click", function () {
          state.tab = key;
          initMode(key, false);
          render();
        });
        nav.appendChild(b);
      })(tabs[i][0], tabs[i][1]);
    }
  }
  function renderParts() {
    var wrap = $("parts");
    wrap.innerHTML = "";
    if (state.tab === "progress" || sel.length !== 1) { wrap.hidden = true; return; }
    wrap.hidden = false;
    var parts = ["ALL", "A", "B", "C"];
    for (var i = 0; i < parts.length; i++) {
      (function (p) {
        var label = p === "ALL" ? STR.partAll : fmt(STR.partLabel, { p: p });
        var b = el("button", "chip" + (p === state.part ? " on" : ""), label);
        b.type = "button";
        b.addEventListener("click", function () {

        });

      })(parts[i]);
    }
  }
  function renderDirectionSwitch(onChange) {

    var b2 = el("button", state.direction === "target2de" ? "on" : "", STR.directionTargetToDe);
    b1.type = "button"; b2.type = "button";
    b1.addEventListener("click", function () { if (state.direction === "de2target") return; state.direction = "de2target"; onChange(); });
    b2.addEventListener("click", function () { if (state.direction === "target2de") return; state.direction = "target2de"; onChange(); });
    wrap.appendChild(b1); wrap.appendChild(b2);
    return wrap;
  }

  /* ---------- Modus-Init ---------- */
  function initMode(tab, force) {
    var pool = getPool();
    if (tab === "flash" && (force || state.flash.deck.length === 0)) {
      state.flash.deck = weightedSample(pool, FLASH_N);
      state.flash.idx = 0; state.flash.flipped = false; state.flash.reviewMode = false; state.flash.finished = false;
    }
    if (tab === "quiz" && (force || state.quiz.deck.length === 0)) {
      state.quiz.deck = weightedSample(pool, QUIZ_N);
      state.quiz.idx = 0; state.quiz.score = 0; state.quiz.answered = false; state.quiz.finished = false;
      state.quiz.wrongMap = {}; state.quiz.opts = null; state.quiz.optsFor = null;
    }
    if (tab === "match" && (force || state.match.leftItems.length === 0)) setupMatchRound(pool);
    if (tab === "type" && (force || state.typeMode.deck.length === 0)) {
      var typable = [];
      for (var i = 0; i < pool.length; i++) if (pool[i].core) typable.push(pool[i]);
      state.typeMode.deck = weightedSample(typable, TYPE_N);
      state.typeMode.idx = 0; state.typeMode.checked = false;
    }
  }
  function resetAllModes() {
    var keepTab = state.tab, keepDir = state.direction;
    state = freshState();
    state.tab = keepTab; state.direction = keepDir;
    initMode(state.tab, true);
  }

  function setupMatchRound(pool) {
    var m = state.match;
    m.leftSel = null; m.matchedIds = {};
    m.leftItems = []; m.rightItems = [];
    if (!pool.length) return;
    var seed = weightedSample(pool, 1)[0];
    var pc = posClass(seed), g = groupOf(seed);
    var cands = [];
    for (var i = 0; i < pool.length; i++) {
      var c = pool[i];
      if (c === seed) continue;
      if ((posClass(c) === "ph") !== (pc === "ph")) continue;
      cands.push(c);
    }
    // bevorzugt aus derselben Bedeutungsgruppe, danach beliebig (gewichtet)
    var near = [], far = [];
    for (var k = 0; k < cands.length; k++) (groupOf(cands[k]) === g ? near : far).push(cands[k]);
    var ordered = weightedSample(near, near.length).concat(weightedSample(far, far.length));
    var chosen = [seed];
    for (var j = 0; j < ordered.length && chosen.length < MATCH_N; j++) {
      var clash = false;
      for (var z = 0; z < chosen.length; z++) {
        if (sameMeaning(chosen[z], ordered[j]) || chosen[z].de === ordered[j].de) { clash = true; break; }
      }
      if (!clash) chosen.push(ordered[j]);
    }
    m.leftItems = shuffle(chosen);
    m.rightItems = shuffle(chosen);
  }

  /* ---------- Render ---------- */
  function render() {
    if (!STR) return;
    renderTabs();
    renderParts();
    $("summary").textContent = selSummary();
    var app = $("app");
    app.innerHTML = "";
    if (state.tab !== "progress" && !getPool().length) {
      var p = el("div", "panel"); p.appendChild(el("p", "small", STR.emptyPool)); app.appendChild(p); return;
    }
    if (state.tab === "flash") renderFlash(app);
    else if (state.tab === "quiz") renderQuiz(app);
    else if (state.tab === "match") renderMatch(app);
    else if (state.tab === "type") renderType(app);
    else renderProgress(app);
  }

  function renderFinished(app, title, extraText, onNew) {
    var panel = el("div", "panel center");
    panel.appendChild(el("div", "bigmsg", title));
    if (extraText) panel.appendChild(el("div", "", extraText));
    var b = el("button", "main", STR.quizRestart);
    b.type = "button";
    b.addEventListener("click", onNew);
    panel.appendChild(b);
    app.appendChild(panel);
    return panel;
  }

  /* ---------- Karteikarten ---------- */
  function renderFlash(app) {
    var f = state.flash;

      return;
    }

    var panel = el("div", "panel");

    if (f.reviewMode) panel.appendChild(el("p", "badge", STR.flashReviewBadge));

    var textIsDe = frontIsDe ? !showBack : showBack;
    var text = textIsDe ? item.de : meaning(item);
    var card = el("div", "flashcard" + (showBack ? " back" : ""));
    card.setAttribute("role", "button");
    card.tabIndex = 0;
    card.appendChild(el("span", "ctag", showBack ? lessonTag(item) : STR.flashcardFlip));
    card.appendChild(setLangAttrs(el("div", "cword", text), textIsDe ? "de" : STR.lang));
    function flip() { f.flipped = !f.flipped; render(); }
    card.addEventListener("click", flip);
    card.addEventListener("keydown", function (ev) { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); flip(); } });

    var actions = el("div", "twocols");

    }

    panel.appendChild(actions);
    app.appendChild(panel);
  }

  /* ---------- Quiz (Multiple Choice, nur verwandte Woerter) ---------- */
  function renderQuiz(app) {

      var panel0 = renderFinished(app, STR.quizFinished, STR.quizScore + ": " + q.score + " / " + q.deck.length, function () { initMode("quiz", true); render(); });

  /* ---------- Zuordnen ---------- */

  /* ---------- Tippen ---------- */
  function foldAnswer(s) {
    s = s.replace(/[.!?,]+$/g, "").replace(/\s+/g, " ").trim().toLowerCase();
    return s.replace(/ä/g, "ae").replace(/ö/g, "oe").replace(/ü/g, "ue").replace(/ß/g, "ss");
  }
  function acceptable(item, typed) {
    var t = foldAnswer(typed);
    if (!t) return false;
    var cands = [item];
    var mine = normTr(meaning(item));
    for (var i = 0; i < WORDS.length; i++) {
      if (WORDS[i] !== item && WORDS[i].core && normTr(meaning(WORDS[i])) === mine) cands.push(WORDS[i]);
    }
    for (var k = 0; k < cands.length; k++) {
      if (foldAnswer(cands[k].core) === t || foldAnswer(cands[k].de) === t) return true;
    }
    return false;
  }
  function renderType(app) {
    var t = state.typeMode;
    var panel = el("div", "panel");
    if (t.deck.length === 0) { panel.appendChild(el("p", "small", STR.typeNone)); app.appendChild(panel); return; }
    if (t.idx >= t.deck.length) {
      renderFinished(app, STR.quizFinished, "", function () { initMode("type", true); render(); });
      return;
    }
    var item = t.deck[t.idx];
    var top = el("div", "top");
    top.appendChild(el("span", "", lessonTag(item)));
    top.appendChild(el("span", "", (t.idx + 1) + " / " + t.deck.length));
    panel.appendChild(top);
    panel.appendChild(el("p", "small", STR.typeInstructions));
    panel.appendChild(tgNode("div", "qbig smallbig", meaning(item)));

    var um = el("div", "umlauts");
    var chars = ["ä", "ö", "ü", "ß"];
    var input = el("input", "typein");
    input.type = "text"; input.placeholder = STR.typePlaceholder; input.autocomplete = "off";
    input.setAttribute("autocapitalize", "off"); input.setAttribute("autocorrect", "off");
    input.spellcheck = false; input.lang = "de"; input.dir = "ltr";
    for (var i = 0; i < chars.length; i++) {
      (function (ch) {
        var b = el("button", "", ch);
        b.type = "button";
        b.addEventListener("click", function () {
          if (input.disabled) return;
          var s = input.selectionStart, e = input.selectionEnd;
          if (typeof s !== "number") { input.value += ch; }
          else { input.value = input.value.slice(0, s) + ch + input.value.slice(e); input.selectionStart = input.selectionEnd = s + 1; }
          input.focus();
        });
        um.appendChild(b);
      })(chars[i]);
    }
    var feedback = el("div", "fb");
    var answerLine = deNode("div", "ans", "");
    var checkBtn = el("button", "main", STR.typeCheck);
    checkBtn.type = "button";
    checkBtn.addEventListener("click", function () {
      if (!t.checked) {
        t.checked = true;
        var ok = acceptable(item, input.value);
        recordResult(item.id, ok);
        input.disabled = true;
        if (ok) { input.className = "typein okin"; feedback.textContent = STR.typeCorrect; feedback.className = "fb ok"; }
        else {
          input.className = "typein badin"; feedback.textContent = STR.typeWrong; feedback.className = "fb bad";
          answerLine.textContent = item.core;
          feedback.textContent = STR.typeWrong + " " + STR.typeShowAnswer;
        }
        checkBtn.textContent = STR.typeNext;
      } else {
        t.idx += 1; t.checked = false;
        render();
      }
    });
    input.addEventListener("keydown", function (ev) { if (ev.key === "Enter") { ev.preventDefault(); checkBtn.click(); } });
    panel.appendChild(um);
    panel.appendChild(input);
    panel.appendChild(checkBtn);
    panel.appendChild(feedback);
    panel.appendChild(answerLine);
    panel.appendChild(el("p", "small", STR.typeFoldHint));
    app.appendChild(panel);
    setTimeout(function () { try { input.focus(); } catch (e) {} }, 0);
  }

  /* ---------- Fortschritt ---------- */
  function renderProgress(app) {
    var panel = el("div", "panel");
    panel.appendChild(el("h2", "", STR.progressTitle));
    var p = loadProgress();
    var any = false;
    for (var id in p) if (p.hasOwnProperty(id) && (p[id].c > 0 || p[id].w > 0)) { any = true; break; }
    if (!any) { panel.appendChild(el("p", "small", STR.progressNoData)); app.appendChild(panel); return; }

    function stats(items) {
      var c = 0, w = 0, sure = 0;
      for (var i = 0; i < items.length; i++) {
        var r = p[items[i].id];
        if (r) { c += r.c; w += r.w; if (r.b === 2) sure += 1; }
      }
      return { c: c, w: w, sure: sure, n: items.length };
    }
    function row(label, items, compact) {
      var s = stats(items), tot = s.c + s.w;
      var pct = tot > 0 ? Math.round(s.c * 100 / tot) : 0;
      var r = el("div", "prow" + (compact ? " cmp" : ""));
      var head = el("div", "phead");
      var lab = el("span", "plabel", label);
      if (compact) { var sm = el("small", "", "(" + s.sure + "/" + s.n + ")"); sm.dir = "ltr"; lab.appendChild(sm); }
      head.appendChild(lab);
      head.appendChild(el("span", "pval", tot > 0 ? fmt(STR.progressAccuracy, { p: pct }) : "\u2014"));
      r.appendChild(head);
      var bar = el("div", "bar"), fill = el("i", ""); fill.style.width = pct + "%";
      bar.appendChild(fill); r.appendChild(bar);
      if (!compact) r.appendChild(el("div", "small", fmt(STR.progressMastered, { n: s.sure, total: s.n })));
      return r;
    }
    panel.appendChild(row(STR.progressOverall, WORDS));
    panel.appendChild(el("h2", "mt", STR.progressByLesson));
    for (var L = 1; L <= LESSONS; L++) {
      panel.appendChild(row(STR.lessonWord + " " + L, wordsOfSel([L]), true));
    }
    var hard = [];
    var inCurrent = wordsOfSel(sel);
    for (var i = 0; i < inCurrent.length; i++) {
      var r0 = p[inCurrent[i].id];
      if (r0 && r0.b === 0) hard.push(inCurrent[i]);
    }
    if (hard.length > 0) {
      var hb = el("button", "main", fmt(STR.progressHard, { n: hard.length }));
      hb.type = "button";
      hb.addEventListener("click", function () {
        state.flash.deck = shuffle(hard); state.flash.idx = 0; state.flash.flipped = false;
        state.flash.reviewMode = true; state.flash.finished = false;
        state.tab = "flash"; render();
      });
      panel.appendChild(hb);
    } else {
      panel.appendChild(el("p", "small", STR.progressNoHard));
    }
    var rb = el("button", "resetbtn", STR.progressReset);
    rb.type = "button";
    rb.addEventListener("click", function () {
      if (window.confirm(STR.progressResetConfirm)) { saveProgress({}); render(); }
    });
    panel.appendChild(rb);
    app.appendChild(panel);
  }

  /* ---------- Sprachauswahl ---------- */
  function hasLang(code) { return Object.prototype.hasOwnProperty.call(STRINGS, code); }
  function buildPicker() {
    var prompt = $("pickPrompt"), list = $("langList");
    for (var i = 0; i < LANG_ORDER.length; i++) {
      (function (code) {
        var s = STRINGS[code];
        var pe = el("p", "", s.pickPrompt);
        pe.lang = s.lang; pe.dir = s.dir; pe.style.fontFamily = s.font;
        prompt.appendChild(pe);
        var b = el("button", "langchoice", s.nativeName);
        b.type = "button"; b.lang = s.lang; b.dir = s.dir; b.style.fontFamily = s.font;
        b.style.setProperty("--c", s.accent); b.style.setProperty("--cd", s.accentDark);
        b.addEventListener("click", function () { chooseLanguage(code); });
        list.appendChild(b);
      })(LANG_ORDER[i]);
    }
  }
  function rememberInUrl(code) {
    var want = code ? "#" + code : "";
    if (window.location.hash === want) return;
    try { window.history.replaceState(null, "", window.location.pathname + window.location.search + want); } catch (e) {}
  }
  var root = document.documentElement;
  function applyLanguage(code) {
    var s = STRINGS[code];
    STR = s;
    root.lang = s.lang; root.dir = s.dir;
    root.style.setProperty("--font", s.font);
    document.title = s.appTitle;
    $("appTitle").textContent = s.appTitle;
    $("setupAppTitle").textContent = s.appTitle;
    $("footerNote").textContent = s.footerNote;
    $("langBtnLabel").textContent = s.nativeName;
    $("langBtnLabel2").textContent = s.nativeName;
    $("changeBtn").textContent = s.changeLessons;
  }
  function show(which) {
    $("picker").hidden = which !== "picker";
    $("setup").hidden = which !== "setup";
    $("trainer").hidden = which !== "trainer";
    window.scrollTo(0, 0);
  }
  function chooseLanguage(code) {
    if (!hasLang(code)) return;
    applyLanguage(code);
    rememberInUrl(code);
    sel = loadSel();
    renderSetup();
    show("setup");
  }
  function showPicker() {
    STR = null;
    root.lang = "de"; root.dir = "ltr"; root.style.removeProperty("--font");
    document.title = PICK_TITLE;
    rememberInUrl("");
    show("picker");
  }

  /* ---------- Lektionswahl ---------- */
  function toggleLesson(L) {
    var i = sel.indexOf(L);
    if (i >= 0) sel.splice(i, 1); else { sel.push(L); sel.sort(function (a, b) { return a - b; }); }
    renderSetup();
  }
  function setSel(list) { sel = list.slice(); renderSetup(); }
  function range(a, b) { var o = []; for (var i = a; i <= b; i++) o.push(i); return o; }
  function renderSetup() {
    $("setupTitle").textContent = STR.setupTitle;
    $("setupHint").textContent = STR.setupHint;
    var allBtn = $("allBtn");
    allBtn.textContent = STR.btnAll;
    allBtn.className = "chip allchip" + (sel.length === LESSONS ? " on" : "");
    $("clearBtn").textContent = STR.clearBtn;
    var rg = $("ranges");
    rg.innerHTML = "";
    var ranges = [[1, 5], [6, 10], [11, 15], [16, 20]];
    for (var r = 0; r < ranges.length; r++) {
      (function (a, b) {
        var cur = sel.length === b - a + 1 && sel[0] === a && sel[sel.length - 1] === b;
        var btn = el("button", "chip" + (cur ? " on" : ""), fmt(STR.rangeLabel, { a: a, b: b }));
        btn.type = "button";
        btn.addEventListener("click", function () { setSel(range(a, b)); });
        rg.appendChild(btn);
      })(ranges[r][0], ranges[r][1]);
    }
    var grid = $("lessonGrid");
    grid.innerHTML = "";
    var counts = {};
    for (var i = 0; i < WORDS.length; i++) for (var k = 0; k < WORDS[i].ls.length; k++) counts[WORDS[i].ls[k]] = (counts[WORDS[i].ls[k]] || 0) + 1;
    for (var L = 1; L <= LESSONS; L++) {
      (function (L) {
        var on = sel.indexOf(L) >= 0;
        var b = el("button", "lbtn" + (on ? " on" : ""), "");
        b.type = "button";
        b.setAttribute("aria-pressed", on ? "true" : "false");
        b.setAttribute("aria-label", STR.lessonWord + " " + L);
        b.appendChild(el("span", "ln", String(L)));
        b.appendChild(el("span", "lc", String(counts[L] || 0)));
        b.addEventListener("click", function () { toggleLesson(L); });
        grid.appendChild(b);
      })(L);
    }
    var n = wordsOfSel(sel).length;
    var go = $("startBtn");
    go.textContent = sel.length ? fmt(STR.startWith, { n: n }) : STR.startNone;
    go.disabled = sel.length === 0;
  }
  function startTraining() {
    if (!sel.length) return;
    saveSel();
    state = freshState();
    initMode("flash", true);
    show("trainer");
    render();
  }

  

  buildPicker();
  $("allBtn").addEventListener("click", function () { setSel(range(1, LESSONS)); });
  $("clearBtn").addEventListener("click", function () { setSel([]); });
  $("startBtn").addEventListener("click", startTraining);
  $("changeBtn").addEventListener("click", function () { renderSetup(); show("setup"); });
  $("langBtn").addEventListener("click", showPicker);
  $("langBtn2").addEventListener("click", showPicker);

  function route() {
    var h = (window.location.hash || "").replace("#", "").toLowerCase();
    if (hasLang(h)) {
      if (STR !== STRINGS[h]) chooseLanguage(h);
    } else {
      showPicker();
    }
  }
  window.addEventListener("hashchange", route);
  route();
})();
</script>
</body>
</html>
