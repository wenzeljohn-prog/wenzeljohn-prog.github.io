<!DOCTYPE html>
<html lang="de" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wortschatztrainer Deutsch A1 (Lektion 7)</title>
<style>
  :root {
    --accent: #3E5C8A;
    --accent-dark: #293D5C;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --bg: #F7F5F1;
    --ink: #22201D;
    --muted: #8B8477;
    --card: #FFFFFF;
    --border: #E4DFD6;
    --ok: #3F8F5F;
    --bad: #C0473A;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; background: var(--bg); color: var(--ink);
    font-family: var(--font);
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
  }
  button, input {
    -webkit-appearance: none; appearance: none;
    touch-action: manipulation;
  }
  button { -webkit-user-select: none; user-select: none; }
  body { padding-bottom: 40px; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 0 16px; }
  header.top {
    background: var(--accent); color: #fff; padding: 22px 0 18px;
    border-bottom: 4px solid var(--accent-dark);
  }
  header.top h1 { margin: 0 0 4px; font-size: 1.35rem; font-weight: 700; letter-spacing: 0.01em; }
  header.top p { margin: 0; font-size: 0.92rem; opacity: 0.92; }

  nav.tabs {
    display: flex; gap: 6px; overflow-x: auto; margin-top: 16px; padding-bottom: 2px;
  }
  nav.tabs button {
    flex: 0 0 auto; border: none; background: rgba(255,255,255,0.18); color: #fff;
    padding: 8px 14px; border-radius: 999px; font-size: 0.88rem; cursor: pointer;
    font-family: inherit; white-space: nowrap;
  }
  nav.tabs button.active { background: #fff; color: var(--accent-dark); font-weight: 700; }

  .cats {
    display: flex; gap: 6px; flex-wrap: wrap; margin: 16px 0 4px;
  }
  .cats button {
    border: 1px solid var(--border); background: var(--card); color: var(--ink);
    padding: 6px 12px; border-radius: 999px; font-size: 0.84rem; cursor: pointer; font-family: inherit;
  }
  .cats button.active { background: var(--ink); border-color: var(--ink); color: #fff; }

  main { padding-top: 18px; min-height: 320px; }
  .panel { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 20px; }
  .hint { color: var(--muted); font-size: 0.86rem; margin: 0 0 16px; }

  /* Flashcards */
  .card-counter { text-align: center; color: var(--muted); font-size: 0.84rem; margin-bottom: 10px; }
  .flashcard {
    background: var(--card); border: 1px solid var(--border); border-radius: 16px;
    min-height: 180px; display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 24px; cursor: pointer; font-size: 1.3rem; font-weight: 600;
    box-shadow: 0 1px 0 var(--border);
  }
  .flashcard .back { color: var(--accent-dark); }
  .flashcard .tag { display: block; font-size: 0.78rem; font-weight: 500; color: var(--muted); margin-bottom: 10px; text-transform: none; }
  .flash-actions { display: flex; gap: 10px; margin-top: 16px; }
  .flash-actions button {
    flex: 1; padding: 12px; border-radius: 10px; border: none; font-size: 0.92rem; cursor: pointer; font-family: inherit; font-weight: 600;
  }
  .btn-know { background: var(--ok); color: #fff; }
  .btn-learn { background: #EFE4DA; color: var(--ink); }
  .dir-switch { display: flex; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; margin-bottom: 14px; }
  .dir-switch button {
    flex: 1; border: none; background: var(--card); color: var(--ink); padding: 10px 8px;
    font-size: 0.84rem; cursor: pointer; font-family: inherit;
  }
  .dir-switch button.active { background: var(--accent); color: #fff; font-weight: 700; }
  .dir-switch button:first-child { border-inline-end: 1px solid var(--border); }
  .row-tools { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; gap: 10px; }
  .link-btn {
    background: none; border: none; color: var(--accent-dark); font-size: 0.86rem; cursor: pointer;
    font-family: inherit; text-decoration: underline; padding: 4px 0;
  }

  /* Quiz */
  .quiz-q { font-size: 1.15rem; font-weight: 700; margin-bottom: 18px; text-align: center; }
  .quiz-opts { display: flex; flex-direction: column; gap: 10px; }
  .quiz-opts button {
    text-align: start; padding: 13px 14px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--card); font-size: 0.98rem; cursor: pointer; font-family: inherit;
  }
  .quiz-opts button.correct { background: #E4F3E9; border-color: var(--ok); color: var(--ok); font-weight: 700; }
  .quiz-opts button.wrong { background: #FBE7E4; border-color: var(--bad); color: var(--bad); font-weight: 700; }
  .quiz-opts button[disabled] { cursor: default; }
  .quiz-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; font-size: 0.86rem; color: var(--muted); }
  .quiz-feedback { text-align: center; margin-top: 14px; font-weight: 700; min-height: 1.4em; }
  .quiz-feedback.ok { color: var(--ok); }
  .quiz-feedback.bad { color: var(--bad); }
  .primary-btn {
    display: block; width: 100%; margin-top: 14px; padding: 13px; border-radius: 10px; border: none;
    background: var(--accent); color: #fff; font-size: 0.96rem; font-weight: 700; cursor: pointer; font-family: inherit;
  }
  .center-msg { text-align: center; padding: 20px 0; }
  .center-msg .big { font-size: 1.5rem; font-weight: 700; margin-bottom: 6px; }

  /* Matching */
  .match-cols { display: flex; gap: 10px; }
  .match-col { flex: 1; display: flex; flex-direction: column; gap: 8px; }
  .match-col button {
    padding: 11px 10px; border-radius: 10px; border: 1px solid var(--border); background: var(--card);
    font-size: 0.88rem; cursor: pointer; font-family: inherit; text-align: start;
  }
  .match-col button.selected { border-color: var(--accent); background: #EAF3F3; }
  .match-col button.matched { background: #E4F3E9; border-color: var(--ok); color: var(--ok); cursor: default; }
  .match-col button.flash-wrong { background: #FBE7E4; border-color: var(--bad); }
  .match-col button[disabled] { cursor: default; }

  /* Typing */
  .type-prompt { font-size: 1.1rem; font-weight: 700; margin-bottom: 16px; text-align: center; }
  .type-input {
    width: 100%; padding: 13px 14px; border-radius: 10px; border: 1px solid var(--border);
    font-size: 16px; font-family: inherit; margin-bottom: 12px; background: var(--card); color: var(--ink);
  }
  .type-input.ok { border-color: var(--ok); }
  .type-input.bad { border-color: var(--bad); }
  .type-feedback { min-height: 1.4em; font-weight: 700; margin-bottom: 6px; }
  .type-feedback.ok { color: var(--ok); }
  .type-feedback.bad { color: var(--bad); }
  .type-answer { color: var(--muted); font-size: 0.9rem; }

  /* Progress */
  .prog-row { margin-bottom: 18px; }
  .prog-label { display: flex; justify-content: space-between; font-size: 0.88rem; margin-bottom: 6px; }
  .prog-bar-bg { background: var(--border); border-radius: 999px; height: 10px; overflow: hidden; }
  .prog-bar-fill { background: var(--accent); height: 100%; border-radius: 999px; }
  .reset-btn { background: none; border: 1px solid var(--bad); color: var(--bad); padding: 9px 16px; border-radius: 10px; cursor: pointer; font-family: inherit; font-size: 0.86rem; margin-top: 6px; }

  footer.note { text-align: center; color: var(--muted); font-size: 0.78rem; margin-top: 28px; padding: 0 16px; }

  @media (max-width: 420px) {
    .flashcard { font-size: 1.12rem; min-height: 160px; }
  }
  [hidden] { display: none !important; }

  /* Kopfzeile mit Sprachwechsel */
  .top-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .top-row h1 { min-width: 0; }
  .lang-btn {
    flex: 0 0 auto; display: inline-flex; align-items: center; gap: 6px; border: none;
    background: rgba(255,255,255,0.18); color: #fff; padding: 6px 12px; border-radius: 999px;
    font-size: 0.84rem; cursor: pointer; font-family: inherit; white-space: nowrap;
  }
  .lang-btn svg { flex: none; }
  .lang-btn:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }

  /* Sprachauswahl */
  header.top.pick-top { background: #3A3631; border-bottom-color: #22201D; }
  .pick-prompt { text-align: center; color: var(--muted); font-size: 0.95rem; margin: 26px 0 20px; }
  .pick-prompt p { margin: 0 0 4px; }
  .lang-list { display: flex; flex-direction: column; gap: 12px; }
  .lang-choice {
    width: 100%; min-height: 68px; padding: 14px 18px; border: none; border-bottom: 4px solid var(--cd);
    border-radius: 14px; background: var(--c); color: #fff; font-size: 1.35rem; font-weight: 700;
    cursor: pointer; font-family: inherit; text-align: center;
  }
  .lang-choice:active { filter: brightness(0.92); }
  .lang-choice:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
</style>
</head>

  };
  var LANG_ORDER = ["tr", "ar", "rh", "en"];
  var STORAGE_PREFIX = "daz_trainer_a1l7_progress_";
  var PICK_TITLE = "Wortschatztrainer Deutsch A1 (Lektion 7)";
  var STR = null;          // aktive Sprache (null = Auswahlseite)
  var STORAGE_KEY = null;  // je Sprache getrennt, wie in den Einzeldateien

  function freshState() {
    return {
      tab: "flash",
      category: "ALL",
      direction: "de2target",
      flash: { deck: [], idx: 0, flipped: false },
      quiz: { deck: [], idx: 0, score: 0, answered: false, finished: false },
      match: { pairs: [], leftSel: null, rightItems: [], leftItems: [], matchedIds: {} },
      typeMode: { deck: [], idx: 0, checked: false, lastCorrect: null }
    };
  }
  var state = freshState();

  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  function fmt(str, vals) {
    return str.replace(/\{(\w+)\}/g, function (m, k) {
      return (vals && (k in vals)) ? vals[k] : m;
    });
  }

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined && text !== null) e.textContent = text;
    return e;
  }

  function getFiltered() {
    if (state.category === "ALL") return VOCAB;
    var out = [];
    for (var i = 0; i < VOCAB.length; i++) {
      if (VOCAB[i].cat === state.category) out.push(VOCAB[i]);
    }
    return out;
  }

  function catLabel(c) {
    if (c === "ALL") return STR.catAll;
    return (STR.catLabels && STR.catLabels[c]) ? STR.catLabels[c] : c;
  }

  function renderDirectionSwitch(onChange) {
    var wrap = el("div", "dir-switch");
    var b1 = el("button", state.direction === "de2target" ? "active" : "", STR.directionDeToTarget);
    var b2 = el("button", state.direction === "target2de" ? "active" : "", STR.directionTargetToDe);
    b1.addEventListener("click", function () {
      if (state.direction === "de2target") return;
      state.direction = "de2target";
      onChange();
    });
    b2.addEventListener("click", function () {
      if (state.direction === "target2de") return;
      state.direction = "target2de";
      onChange();
    });
    wrap.appendChild(b1);
    wrap.appendChild(b2);
    return wrap;
  }

  /* ---------- progress storage ---------- */
  function loadProgress() {
    try {
      var raw = window.localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : {};
    } catch (e) { return {}; }
  }
  function saveProgress(p) {
    try { window.localStorage.setItem(STORAGE_KEY, JSON.stringify(p)); } catch (e) {}
  }
  function recordResult(id, isCorrect) {
    var p = loadProgress();
    if (!p[id]) p[id] = { correct: 0, wrong: 0 };
    if (isCorrect) p[id].correct += 1; else p[id].wrong += 1;
    saveProgress(p);
  }

  /* ---------- top nav ---------- */
  function renderTabs() {
    var nav = document.getElementById("tabs");
    nav.innerHTML = "";
    var tabs = [
      ["flash", STR.tabFlashcards],
      ["quiz", STR.tabQuiz],
      ["match", STR.tabMatch],
      ["type", STR.tabType],
      ["progress", STR.tabProgress]
    ];
    for (var i = 0; i < tabs.length; i++) {
      (function (key, label) {
        var b = el("button", key === state.tab ? "active" : "", label);
        b.addEventListener("click", function () {
          state.tab = key;
          initModeIfNeeded(key, true);
          render();
        });
        nav.appendChild(b);
      })(tabs[i][0], tabs[i][1]);
    }
  }

  function renderCats() {
    var wrap = document.getElementById("cats");
    if (state.tab === "progress") { wrap.style.display = "none"; wrap.innerHTML = ""; return; }
    wrap.style.display = "flex";
    wrap.innerHTML = "";
    var cats = ["ALL"].concat(STR.catCodes || []);
    for (var i = 0; i < cats.length; i++) {
      (function (c) {
        var b = el("button", c === state.category ? "active" : "", catLabel(c));
        b.addEventListener("click", function () {
          state.category = c;
          initModeIfNeeded(state.tab, true);
          render();
        });
        wrap.appendChild(b);
      })(cats[i]);
    }
  }

  /* ---------- mode init ---------- */
  function initModeIfNeeded(tab, force) {
    var pool = getFiltered();
    if (tab === "flash" && (force || state.flash.deck.length === 0)) {
      state.flash.deck = shuffle(pool);
      state.flash.idx = 0;
      state.flash.flipped = false;
    }
    if (tab === "quiz" && (force || state.quiz.deck.length === 0)) {
      state.quiz.deck = shuffle(pool);
      state.quiz.idx = 0;
      state.quiz.score = 0;
      state.quiz.answered = false;
      state.quiz.finished = false;
    }
    if (tab === "match" && (force || state.match.leftItems.length === 0)) {
      setupMatchRound(pool);
    }
    if (tab === "type" && (force || state.typeMode.deck.length === 0)) {
      var typable = [];
      for (var i = 0; i < pool.length; i++) if (pool[i].core) typable.push(pool[i]);
      if (typable.length === 0) typable = VOCAB.filter(function (v) { return !!v.core; });
      state.typeMode.deck = shuffle(typable);
      state.typeMode.idx = 0;
      state.typeMode.checked = false;
      state.typeMode.lastCorrect = null;
    }
  }

  function setupMatchRound(pool) {
    var n = Math.min(6, pool.length);
    var chosen = shuffle(pool).slice(0, n);
    state.match.leftItems = chosen;
    state.match.rightItems = shuffle(chosen);
    state.match.leftSel = null;
    state.match.matchedIds = {};
  }

  /* ---------- render dispatch ---------- */
  function render() {
    if (!STR) return;
    renderTabs();
    renderCats();
    var app = document.getElementById("app");
    app.innerHTML = "";
    if (state.tab === "flash") renderFlash(app);
    else if (state.tab === "quiz") renderQuiz(app);
    else if (state.tab === "match") renderMatch(app);
    else if (state.tab === "type") renderType(app);
    else renderProgress(app);
  }

  /* ---------- Flashcards ---------- */
  function renderFlash(app) {
    var deck = state.flash.deck;
    if (deck.length === 0) { app.appendChild(el("p", "hint", STR.progressNoData)); return; }
    if (state.flash.idx >= deck.length) { state.flash.idx = 0; }
    var item = deck[state.flash.idx];

    var panel = el("div", "panel");
    panel.appendChild(renderDirectionSwitch(function () {
      state.flash.flipped = false;
      render();
    }));
    panel.appendChild(el("p", "card-counter", fmt(STR.cardCounter, { n: state.flash.idx + 1, total: deck.length })));

    var frontIsDe = state.direction === "de2target";
    var frontText = frontIsDe ? item.de : item[STR.lang];
    var backText = frontIsDe ? item[STR.lang] : item.de;

    var card = el("div", "flashcard");
    var tag = el("span", "tag", state.flash.flipped ? "" : STR.flashcardFlip);
    var txt = el("div", state.flash.flipped ? "back" : "front", state.flash.flipped ? backText : frontText);
    card.appendChild(tag);
    card.appendChild(txt);
    card.addEventListener("click", function () {
      state.flash.flipped = !state.flash.flipped;
      render();
    });
    panel.appendChild(card);

    var actions = el("div", "flash-actions");
    var learnBtn = el("button", "btn-learn", STR.stillLearning);
    var knowBtn = el("button", "btn-know", STR.knowIt);
    function advance(isCorrect) {
      recordResult(item.id, isCorrect);
      state.flash.idx = (state.flash.idx + 1) % deck.length;
      state.flash.flipped = false;
      render();
    }
    learnBtn.addEventListener("click", function () { advance(false); });
    knowBtn.addEventListener("click", function () { advance(true); });
    actions.appendChild(learnBtn);
    actions.appendChild(knowBtn);
    panel.appendChild(actions);

    app.appendChild(panel);
  }

  /* ---------- Quiz ---------- */
  function renderQuiz(app) {
    var q = state.quiz;
    var panel = el("div", "panel");
    if (q.deck.length === 0) { panel.appendChild(el("p", "hint", STR.progressNoData)); app.appendChild(panel); return; }

    if (q.finished || q.idx >= q.deck.length) {
      var msg = el("div", "center-msg");
      msg.appendChild(el("div", "big", STR.quizFinished));
      msg.appendChild(el("div", "", STR.quizScore + ": " + q.score + " / " + q.deck.length));
      var restart = el("button", "primary-btn", STR.quizRestart);
      restart.addEventListener("click", function () { initModeIfNeeded("quiz", true); render(); });
      msg.appendChild(restart);
      panel.appendChild(msg);
      app.appendChild(panel);
      return;
    }

    var item = q.deck[q.idx];
    panel.appendChild(renderDirectionSwitch(function () {
      q._options = null;
      render();
    }));
    var top = el("div", "quiz-top");
    top.appendChild(el("span", "", STR.quizScore + ": " + q.score + "/" + q.deck.length));
    top.appendChild(el("span", "", (q.idx + 1) + " / " + q.deck.length));
    panel.appendChild(top);

    var frontIsDe = state.direction === "de2target";
    var promptText = frontIsDe ? item.de : item[STR.lang];
    var answerField = frontIsDe ? STR.lang : "de";

    panel.appendChild(el("p", "hint", STR.quizQuestionPrompt));
    panel.appendChild(el("div", "quiz-q", promptText));

    if (!q._options || q._optForId !== item.id) {
      // Distraktoren: zuerst feine Unterkategorie (type, z.B. "object"/"profession"),
      // bei zu wenigen Treffern Rückfall auf die grobe Wortart (pos).
      var correctText = answerField === "de" ? item.de : item[STR.lang];
      var seenTexts = {};
      seenTexts[correctText] = true;
      var textOf = function (cand) { return answerField === "de" ? cand.de : cand[STR.lang]; };
      var pickBy = function (pred, limit) {
        var cands = [];
        for (var i = 0; i < POOL.length; i++) {
          var c = POOL[i];
          if (!pred(c)) continue;
          if (seenTexts[textOf(c)]) continue;
          cands.push(c);
        }
        cands = shuffle(cands);
        var out = [];
        for (var j = 0; j < cands.length && out.length < limit; j++) {
          var t = textOf(cands[j]);
          if (seenTexts[t]) continue;
          seenTexts[t] = true;
          out.push(cands[j]);
        }
        return out;
      };
      var itemType = item.type || item.pos;
      var distractors = pickBy(function (c) { return (c.type || c.pos) === itemType; }, 3);
      if (distractors.length < 3) {
        var more = pickBy(function (c) { return c.pos === item.pos; }, 3 - distractors.length);
        distractors = distractors.concat(more);
      }
      var opts = [item].concat(distractors);
      opts = shuffle(opts);
      q._options = opts;
      q._optForId = item.id;
    }

    var optWrap = el("div", "quiz-opts");
    var feedback = el("div", "quiz-feedback");
    var nextBtn = el("button", "primary-btn", STR.quizNext);
    nextBtn.style.display = "none";
    nextBtn.addEventListener("click", function () {
      q.idx += 1;
      q.answered = false;
      render();
    });

    for (var k = 0; k < q._options.length; k++) {
      (function (opt) {
        var label = answerField === "de" ? opt.de : opt[STR.lang];
        var b = el("button", "", label);
        b.addEventListener("click", function () {
          if (q.answered) return;
          q.answered = true;
          var isCorrect = opt.id === item.id;
          recordResult(item.id, isCorrect);
          if (isCorrect) { q.score += 1; b.className = "correct"; feedback.textContent = STR.quizCorrect; feedback.className = "quiz-feedback ok"; }
          else {
            b.className = "wrong"; feedback.textContent = STR.quizWrong; feedback.className = "quiz-feedback bad";
            var allBtns = optWrap.querySelectorAll("button");
            for (var m = 0; m < allBtns.length; m++) {
              if (allBtns[m].textContent === (answerField === "de" ? item.de : item[STR.lang])) allBtns[m].className = "correct";
            }
          }
          var allBtns2 = optWrap.querySelectorAll("button");
          for (var n2 = 0; n2 < allBtns2.length; n2++) allBtns2[n2].disabled = true;
          nextBtn.style.display = "block";
        });
        optWrap.appendChild(b);
      })(q._options[k]);
    }

    panel.appendChild(optWrap);
    panel.appendChild(feedback);
    panel.appendChild(nextBtn);

    app.appendChild(panel);
  }

  /* ---------- Matching ---------- */
  function renderMatch(app) {
    var panel = el("div", "panel");
    var m = state.match;
    if (m.leftItems.length === 0) { panel.appendChild(el("p", "hint", STR.progressNoData)); app.appendChild(panel); return; }

    panel.appendChild(el("p", "hint", STR.matchInstructions));

    var allMatched = m.leftItems.length > 0 && Object.keys(m.matchedIds).length === m.leftItems.length;

    if (allMatched) {
      var msg = el("div", "center-msg");
      msg.appendChild(el("div", "big", STR.matchAllMatched));
      var again = el("button", "primary-btn", STR.matchNewRound);
      again.addEventListener("click", function () { setupMatchRound(getFiltered()); render(); });
      msg.appendChild(again);
      panel.appendChild(msg);
      app.appendChild(panel);
      return;
    }

    var cols = el("div", "match-cols");
    var leftCol = el("div", "match-col");
    var rightCol = el("div", "match-col");

    for (var i = 0; i < m.leftItems.length; i++) {
      (function (item) {
        var isMatched = !!m.matchedIds[item.id];
        var cls = isMatched ? "matched" : (m.leftSel === item.id ? "selected" : "");
        var b = el("button", cls, item.de);
        b.disabled = isMatched;
        b.addEventListener("click", function () {
          m.leftSel = item.id;
          render();
        });
        leftCol.appendChild(b);
      })(m.leftItems[i]);
    }

    for (var j = 0; j < m.rightItems.length; j++) {
      (function (item) {
        var isMatched = !!m.matchedIds[item.id];
        var b = el("button", isMatched ? "matched" : "", item[STR.lang]);
        b.disabled = isMatched;
        b.addEventListener("click", function () {
          if (!m.leftSel) return;
          if (m.leftSel === item.id) {
            recordResult(item.id, true);
            m.matchedIds[item.id] = true;
            m.leftSel = null;
            render();
          } else {
            recordResult(item.id, false);
            b.className = "flash-wrong";
            var leftBtns = leftCol.querySelectorAll("button");
            for (var q2 = 0; q2 < leftBtns.length; q2++) {
              if (leftBtns[q2].textContent === (function () {
                    for (var z = 0; z < m.leftItems.length; z++) if (m.leftItems[z].id === m.leftSel) return m.leftItems[z].de;
                    return "";
                  })()) leftBtns[q2].className = "flash-wrong";
            }
            var selId = m.leftSel;
            setTimeout(function () {
              m.leftSel = null;
              render();
            }, 550);
          }
        });
        rightCol.appendChild(b);
      })(m.rightItems[j]);
    }

    cols.appendChild(leftCol);
    cols.appendChild(rightCol);
    panel.appendChild(cols);

    var tools = el("div", "row-tools");
    var newBtn = el("button", "link-btn", STR.matchNewRound);
    newBtn.addEventListener("click", function () { setupMatchRound(getFiltered()); render(); });
    tools.appendChild(newBtn);
    panel.appendChild(tools);

    app.appendChild(panel);
  }

  /* ---------- Typing ---------- */
  function normalize(s) {
    return s.replace(/[.!?,]+$/g, "").replace(/\s+/g, " ").trim().toLowerCase();
  }

  function renderType(app) {
    var panel = el("div", "panel");
    var t = state.typeMode;
    if (t.deck.length === 0) { panel.appendChild(el("p", "hint", STR.progressNoData)); app.appendChild(panel); return; }
    if (t.idx >= t.deck.length) { t.idx = 0; }
    var item = t.deck[t.idx];

    panel.appendChild(el("p", "hint", STR.typeInstructions));
    panel.appendChild(el("div", "type-prompt", item[STR.lang]));

    var input = el("input", "type-input");
    input.type = "text";
    input.placeholder = STR.typePlaceholder;
    input.autocomplete = "off";
    input.autocapitalize = "off";
    input.setAttribute("autocorrect", "off");
    input.setAttribute("autocapitalize", "off");
    input.spellcheck = false;

    var feedback = el("div", "type-feedback");
    var answerLine = el("div", "type-answer");
    var checkBtn = el("button", "primary-btn", STR.typeCheck);

    function doCheck() {
      if (t.checked) return;
      t.checked = true;
      var isCorrect = normalize(input.value) === normalize(item.core);
      recordResult(item.id, isCorrect);
      t.lastCorrect = isCorrect;
      if (isCorrect) {
        input.className = "type-input ok";
        feedback.textContent = STR.typeCorrect;
        feedback.className = "type-feedback ok";
      } else {
        input.className = "type-input bad";
        feedback.textContent = STR.typeWrong;
        feedback.className = "type-feedback bad";
        answerLine.textContent = STR.typeShowAnswer + " " + item.core;
      }
      input.disabled = true;
      checkBtn.textContent = STR.typeNext;
    }

    checkBtn.addEventListener("click", function () {
      if (!t.checked) { doCheck(); }
      else {
        t.idx += 1;
        t.checked = false;
        t.lastCorrect = null;
        render();
      }
    });
    input.addEventListener("keydown", function (e) {
      if (e.key === "Enter") { e.preventDefault(); checkBtn.click(); }
    });

    panel.appendChild(input);
    panel.appendChild(checkBtn);
    panel.appendChild(feedback);
    panel.appendChild(answerLine);

    app.appendChild(panel);
    setTimeout(function () { input.focus(); }, 0);
  }

  /* ---------- Progress ---------- */
  function renderProgress(app) {
    var panel = el("div", "panel");
    panel.appendChild(el("h2", "", STR.progressTitle));

    var p = loadProgress();
    var ids = Object.keys(p);
    var hasData = false;
    for (var i = 0; i < ids.length; i++) {
      if (p[ids[i]].correct > 0 || p[ids[i]].wrong > 0) { hasData = true; break; }
    }

    if (!hasData) {
      panel.appendChild(el("p", "hint", STR.progressNoData));
      app.appendChild(panel);
      return;
    }

    function tally(items) {
      var c = 0, w = 0;
      for (var i2 = 0; i2 < items.length; i2++) {
        var rec = p[items[i2].id];
        if (rec) { c += rec.correct; w += rec.wrong; }
      }
      return { c: c, w: w };
    }

    function bar(label, items) {
      var t = tally(items);
      var total = t.c + t.w;
      var pct = total > 0 ? Math.round((t.c / total) * 100) : 0;
      var row = el("div", "prog-row");
      var lab = el("div", "prog-label");
      lab.appendChild(el("span", "", label));
      lab.appendChild(el("span", "", total > 0 ? (pct + "%") : "—"));
      row.appendChild(lab);
      var bg = el("div", "prog-bar-bg");
      var fill = el("div", "prog-bar-fill");
      fill.style.width = pct + "%";
      bg.appendChild(fill);
      row.appendChild(bg);
      return row;
    }

    panel.appendChild(bar(STR.progressOverall, VOCAB));
    var byCat = el("h3", "", STR.progressByCategory);
    byCat.style.fontSize = "0.92rem";
    byCat.style.margin = "18px 0 8px";
    panel.appendChild(byCat);
    var catCodes = STR.catCodes || [];
    for (var ci = 0; ci < catCodes.length; ci++) {
      (function (c) {
        var catItems = VOCAB.filter(function (v) { return v.cat === c; });
        panel.appendChild(bar(catLabel(c), catItems));
      })(catCodes[ci]);
    }

    var resetBtn = el("button", "reset-btn", STR.progressReset);
    resetBtn.addEventListener("click", function () {
      if (window.confirm(STR.progressResetConfirm)) {
        saveProgress({});
        render();
      }
    });
    panel.appendChild(resetBtn);

    app.appendChild(panel);
  }

  /* ---------- Sprachauswahl ---------- */
  var root = document.documentElement;
  function $(id) { return document.getElementById(id); }
  function hasLang(code) { return Object.prototype.hasOwnProperty.call(STRINGS, code); }

  function buildPicker() {
    var prompt = $("pickPrompt");
    var list = $("langList");
    for (var i = 0; i < LANG_ORDER.length; i++) {
      (function (code) {
        var s = STRINGS[code];
        var p = el("p", "", s.pickPrompt);
        p.lang = s.lang; p.dir = s.dir;
        p.style.fontFamily = s.font;
        prompt.appendChild(p);

        var b = el("button", "lang-choice", s.nativeName);
        b.type = "button";
        b.lang = s.lang; b.dir = s.dir;
        b.style.fontFamily = s.font;
        b.style.setProperty("--c", s.accent);
        b.style.setProperty("--cd", s.accentDark);
        b.addEventListener("click", function () { setLanguage(code); });
        list.appendChild(b);
      })(LANG_ORDER[i]);
    }
  }

  // Sprache in der Adresse merken (#tr, #ar, #rh, #en), damit Neuladen und Direktlinks funktionieren
  function rememberInUrl(code) {
    var want = code ? "#" + code : "";
    if (window.location.hash === want) return;
    try {
      window.history.replaceState(null, "", window.location.pathname + window.location.search + want);
    } catch (e) {}
  }

  function setLanguage(code) {
    if (!hasLang(code)) return;
    var s = STRINGS[code];
    STR = s;
    STORAGE_KEY = STORAGE_PREFIX + s.lang;
    root.lang = s.lang;
    root.dir = s.dir;
    root.style.setProperty("--accent", s.accent);
    root.style.setProperty("--accent-dark", s.accentDark);
    root.style.setProperty("--font", s.font);
    document.title = s.appTitle;
    $("appTitle").textContent = s.appTitle;
    $("appSubtitle").textContent = s.appSubtitle;
    $("footerNote").textContent = s.footerNote;
    $("langBtnLabel").textContent = s.nativeName;
    $("picker").hidden = true;
    $("trainer").hidden = false;
    state = freshState();
    initModeIfNeeded("flash", true);
    render();
    rememberInUrl(code);
    window.scrollTo(0, 0);
  }

  function showPicker() {
    STR = null;
    STORAGE_KEY = null;
    root.lang = "de";
    root.dir = "ltr";
    root.style.removeProperty("--accent");
    root.style.removeProperty("--accent-dark");
    root.style.removeProperty("--font");
    document.title = PICK_TITLE;
    $("trainer").hidden = true;
    $("picker").hidden = false;
    rememberInUrl("");
    window.scrollTo(0, 0);
  }

  function route() {
    var h = (window.location.hash || "").replace("#", "").toLowerCase();
    if (hasLang(h)) {
      if (STR !== STRINGS[h]) setLanguage(h);
    } else {
      showPicker();
    }
  }

  buildPicker();
  $("langBtn").addEventListener("click", showPicker);
  window.addEventListener("hashchange", route);
  route();
})();
</script>
</body>
</html>
