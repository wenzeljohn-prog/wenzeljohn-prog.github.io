<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Modalverben-Trainer A1.1</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:#f3f6fb;color:#1c2833;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:17px;line-height:1.4}
#app{max-width:780px;margin:0 auto;padding:12px 12px 48px}
button{font:inherit;touch-action:manipulation;cursor:pointer;-webkit-appearance:none;appearance:none}
h1{font-size:1.5em;margin:6px 0 2px}
h2{font-size:1.15em;margin:0 0 8px}
.card{background:#fff;border-radius:14px;padding:14px;margin:12px 0;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.tr{display:block;font-size:.84em;color:#566573;font-weight:400;line-height:1.3}
.tr[dir=rtl]{text-align:right}
.sub{color:#566573}
.btn{border:2px solid #1565c0;background:#fff;color:#1565c0;border-radius:10px;padding:9px 14px;min-height:46px;text-align:center;margin:4px 6px 4px 0}
.btn .tr{color:inherit;opacity:.85;text-align:center}
.btn.primary{background:#1565c0;color:#fff}
.btn.small{min-height:38px;padding:5px 10px}
.btn.ghost{border-color:#9aa5b1;color:#43515f}
.btn:disabled{opacity:.45;cursor:default}
.langs{display:flex;flex-wrap:wrap}
.pill{border:2px solid #b0bec5;background:#fff;color:#33424f;border-radius:999px;padding:7px 14px;margin:4px 6px 4px 0;min-height:42px}
.pill.on{border-color:#1565c0;background:#e3f0ff;color:#0d47a1;font-weight:600}
.vchip{display:inline-block;text-align:left;border:2px solid #b0bec5;background:#fff;color:#33424f;border-radius:12px;padding:8px 14px;margin:4px 6px 4px 0;min-width:120px}
.vchip.on{border-color:#1565c0;background:#e3f0ff;color:#0d47a1}
.vchip b{font-size:1.1em}
.vchip small{display:block;font-size:.8em;color:#566573}
.grp{border-top:1px solid #e3e8ee;padding-top:10px;margin-top:10px}
.grp:first-of-type{border-top:none;margin-top:0;padding-top:0}
.grp h2 .tr{margin-top:0}
.note{font-size:.82em;color:#8a5a00}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.bar{height:8px;background:#dfe6ee;border-radius:6px;overflow:hidden;margin:8px 0 2px}
.bar i{display:block;height:100%;background:#1565c0;width:0}
.prompt{font-weight:600;margin:6px 0 10px}
.sent{position:relative;display:inline-block;padding-bottom:16px;font-size:1.3em;line-height:1.7}
.sent .w{display:inline-block;padding:0 3px;border-radius:6px}
.sent .pn{display:inline-block}
.sent .m{background:#e3f0ff;color:#0d47a1;font-weight:700}
.sent .i{background:#e4f5e6;color:#1b5e20;font-weight:700}
.sent .gapw{min-width:3.6em;border-bottom:3px solid #1565c0;background:transparent;color:#0d47a1;text-align:center}
.klammer{position:absolute;height:11px;border:3px solid #6a1b9a;border-top:none;border-radius:0 0 10px 10px;pointer-events:none}
.tags{margin:6px 0 10px}
.tag{display:inline-block;border-radius:999px;padding:3px 12px;margin:0 6px 4px 0;font-size:.9em;background:#eef2f7;color:#33424f}
.tag.v{background:#e4f5e6;color:#1b5e20}
.tag.p{background:#fff1d6;color:#7a4b00}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
@media (max-width:420px){.opts.one,.opts{grid-template-columns:1fr}}
.opts.one{grid-template-columns:1fr}
.opt{border:2px solid #90a4ae;background:#fff;color:#1c2833;border-radius:12px;padding:12px 10px;min-height:52px;font-size:1.05em}
.opt .tr{color:inherit;opacity:.8;text-align:center}
.opt.right{border-color:#2e7d32;background:#e4f5e6}
.opt.wrongc{border-color:#c62828;background:#fdeaea}
.opt:disabled{color:inherit;opacity:1}
.typed{width:100%;font-size:20px;padding:10px 12px;border:2px solid #90a4ae;border-radius:10px;margin:6px 0}
.keys{margin:2px 0 8px}
.key{border:2px solid #90a4ae;background:#fff;border-radius:8px;min-width:46px;min-height:44px;font-size:1.1em;margin-right:6px}
.fb{display:none;margin-top:14px;padding:12px;border-radius:12px}
.fb.ok{display:block;background:#e4f5e6;border:2px solid #2e7d32}
.fb.bad{display:block;background:#fdeaea;border:2px solid #c62828}
.fbt{font-weight:700;margin-bottom:4px}
.fb .sol{margin:6px 0}
.hint{font-size:.92em;margin:6px 0 0;padding:6px 8px;background:rgba(255,255,255,.7);border-radius:8px}
.line{min-height:56px;border:2px dashed #90a4ae;border-radius:12px;padding:6px;margin:6px 0;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.bank{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chip{border:2px solid #1565c0;background:#fff;color:#0d47a1;border-radius:10px;padding:8px 12px;min-height:44px;font-size:1.1em}
.chip.placed{background:#e3f0ff}
.chip.letter{min-width:46px;padding:8px 6px;font-size:1.25em;font-weight:600}
.chip.ghostc{visibility:hidden}
.gaprow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:8px 0;font-size:1.2em}
.gapb{border:2px dashed #1565c0;background:#f4f9ff;border-radius:8px;min-width:34px;min-height:44px;color:#1565c0}
.gapb:hover{background:#dcecff}
.gw{padding:4px 8px;border-radius:8px;background:#eef2f7}
.gw.m{background:#e3f0ff;color:#0d47a1;font-weight:700}
.gw.i{background:#e4f5e6;color:#1b5e20;font-weight:700}
.pmsg{font-size:.92em;margin:4px 0;padding:6px 8px;border-radius:8px}
.pmsg.ok{background:#e4f5e6}
.pmsg.bad{background:#fdeaea}
table.conj{border-collapse:collapse;width:100%;margin:6px 0}
table.conj th,table.conj td{border:1px solid #d5dce4;padding:6px 8px;text-align:left}
table.conj th{background:#eef2f7}
.bigscore{font-size:2.2em;font-weight:700;color:#1565c0;margin:6px 0}
ul.wl{padding-left:20px;margin:6px 0}
.ex{margin:10px 0 2px}
.small{font-size:.9em}
.right-note{color:#2e7d32}
.lnk{color:#566573;text-decoration:underline;background:none;border:none;padding:10px 4px;font-size:.9em}
</style>
</head>

function $(id){ return document.getElementById(id); }
function el(tag, cls, html){ var e=document.createElement(tag); if(cls){ e.className=cls; } if(html!==undefined){ e.innerHTML=html; } return e; }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function shuffle(a){ var b=a.slice(), i, j, t; for(i=b.length-1;i>0;i--){ j=Math.floor(Math.random()*(i+1)); t=b[i]; b[i]=b[j]; b[j]=t; } return b; }
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
function capFirst(s){ return s.charAt(0).toUpperCase()+s.slice(1); }
function lcAll(a){ var r=[], i; for(i=0;i<a.length;i++){ r.push(a[i].toLowerCase()); } return r; }
function trim(s){ return String(s).replace(/^\s+|\s+$/g,''); }
function stripUm(s){ return s.toLowerCase().replace(/ä/g,'a').replace(/ö/g,'o').replace(/ü/g,'u').replace(/ß/g,'ss').replace(/ae/g,'a').replace(/oe/g,'o').replace(/ue/g,'u'); }
function indexOf(a, x){ var i; for(i=0;i<a.length;i++){ if(a[i]===x){ return i; } } return -1; }
function uniq(a){ var r=[], i; for(i=0;i<a.length;i++){ if(indexOf(r,a[i])<0){ r.push(a[i]); } } return r; }

var STORE_KEY='modalverbenTrainerA1v1';
var store={lang:'de', verbs:null, stats:{}};
function loadStore(){
  try{
    var raw=window.localStorage.getItem(STORE_KEY), o;
    if(raw){ o=JSON.parse(raw); if(o){ if(o.lang){ store.lang=o.lang; } if(o.verbs){ store.verbs=o.verbs; } if(o.stats){ store.stats=o.stats; } } }
  }catch(e){}
}
function saveStore(){ try{ window.localStorage.setItem(STORE_KEY, JSON.stringify(store)); }catch(e){} }

function fill(s, v){
  if(!v){ return s; }
  return s.replace(/\{(\w+)\}/g, function(m,k){ return v[k]!==undefined ? v[k] : m; });
}
/* tt: Deutsch + (optional) Hilfssprache darunter */
function tt(key, vars){
  var o=T[key], h;
  if(!o){ return esc(key); }
  h='<span class="de">'+fill(o.de,vars)+'</span>';
  if(store.lang!=='de' && o[store.lang]){
    h+='<span class="tr" lang="'+store.lang+'"'+(store.lang==='ar'?' dir="rtl"':'')+'>'+fill(o[store.lang],vars)+'</span>';
  }
  return h;
}
function b(s){ return '<b>'+esc(s)+'</b>'; }

function verbById(id){ var i; for(i=0;i<VERBS.length;i++){ if(VERBS[i].id===id){ return VERBS[i]; } } return null; }
function selectedVerbs(){
  var r=[], i;
  if(store.verbs){ for(i=0;i<VERBS.length;i++){ if(indexOf(store.verbs,VERBS[i].id)>=0){ r.push(VERBS[i]); } } }
  return r.length ? r : VERBS.slice();
}
function weightedPick(list, keyFn){
  var w=[], tot=0, i, x, r;
  for(i=0;i<list.length;i++){ x=1+(store.stats[keyFn(list[i])]||0); w.push(x); tot+=x; }
  r=Math.random()*tot;
  for(i=0;i<list.length;i++){ r-=w[i]; if(r<=0){ return list[i]; } }
  return list[list.length-1];
}
function recordStat(it, ok){
  if(!it.skey){ return; }
  var v=store.stats[it.skey]||0;
  store.stats[it.skey]= ok ? Math.max(0,v-1) : Math.min(8,v+2);
  saveStore();
}

function genSentence(verb, person, o){
  o=o||{};
  var types=o.types||['stmt','yn','wq'], wgt={stmt:3,yn:2,wq:2}, pool=[], i, k, type;
  for(i=0;i<types.length;i++){ for(k=0;k<wgt[types[i]];k++){ pool.push(types[i]); } }
  type=pick(pool);
  var form=verb.forms[PERSON_FORMKEY[person]], subj=pick(SUBJECTS[person]);
  var tokens, mi, act=null, adv=null, q, rest, inf;
  if(type==='wq'){
    q=pick(WQ); rest=q.rest; inf=q.inf;
    tokens=[q.w, form, subj].concat(rest,[inf]); mi=1;
  } else {
    act=o.act||pick(ACTIVITIES); rest=act.rest; inf=act.inf;
    if(type==='yn'){ tokens=[form,subj].concat(rest,[inf]); mi=0; }
    else if(o.adv!==false && Math.random()<0.3){ adv=pick(ADV); tokens=[adv,form,subj].concat(rest,[inf]); mi=1; }
    else { tokens=[subj,form].concat(rest,[inf]); mi=1; }
  }
  tokens[0]=capFirst(tokens[0]);
  return {type:type, verb:verb.id, person:person, tokens:tokens, mi:mi, ii:tokens.length-1,
          form:form, inf:verb.inf, punct:(type==='stmt'?'.':'?'), adv:adv, act:act};
}
function sentText(s){ return s.tokens.join(' ')+s.punct; }
function sentHtml(s, o){
  o=o||{};
  var parts=[], i, cls, txt;
  for(i=0;i<s.tokens.length;i++){
    txt=esc(s.tokens[i]); cls='w';
    if(i===s.mi){
      if(o.gap){ parts.push('<span class="w gapw">'+(o.fill?txt:'&nbsp;')+'</span>'); continue; }
      if(o.col){ cls+=' m'; }
    } else if(i===s.ii && o.col){ cls+=' i'; }
    parts.push('<span class="'+cls+'">'+txt+'</span>');
  }
  return '<span class="sent"'+(o.col?' data-kl="1"':'')+'>'+parts.join(' ')+'<span class="pn">'+s.punct+'</span></span>';
}
function drawKlammers(root){
  var list=(root||document).querySelectorAll('.sent[data-kl]'), i, s, m, n, d, l, r, old, j;
  for(i=0;i<list.length;i++){
    s=list[i];
    old=s.querySelectorAll('.klammer');
    for(j=0;j<old.length;j++){ s.removeChild(old[j]); }
    m=s.querySelector('.m'); n=s.querySelector('.i');
    if(!m||!n){ continue; }
    if(m.offsetTop!==n.offsetTop){ continue; }
    l=m.offsetLeft+m.offsetWidth/2; r=n.offsetLeft+n.offsetWidth/2;
    d=el('div','klammer');
    d.style.left=l+'px'; d.style.width=Math.max(4,(r-l))+'px'; d.style.top=(m.offsetTop+m.offsetHeight-1)+'px';
    s.appendChild(d);
  }
}

/* Rechtschreib-Distraktoren */
function genMisspellings(w){
  var out=[];
  function add(x){ if(x && x!==w && indexOf(out,x)<0 && x.length>1){ out.push(x); } }
  add(w.replace(/ö/g,'o')); add(w.replace(/ü/g,'u')); add(w.replace(/ä/g,'a'));
  add(w.replace(/ö/g,'oe')); add(w.replace(/ü/g,'ue'));
  add(w.replace(/ss/g,'ß')); add(w.replace(/ss/g,'s')); add(w.replace(/nn/g,'n'));
  add(w.replace(/ch/g,'sch')); add(w.replace(/t$/,'d')); add(w.replace(/st$/,'s'));
  add(w.replace(/([aeiouäöü])/,'$1$1'));
  return out;
}
function spellOptions(verb, form){
  var list=(verb.wrong&&verb.wrong[form])?verb.wrong[form].slice():[], valid=[], k, res, extra, i;
  for(k in verb.forms){ if(verb.forms.hasOwnProperty(k)){ valid.push(verb.forms[k]); } }
  extra=genMisspellings(form);
  for(i=0;i<extra.length;i++){ if(indexOf(list,extra[i])<0){ list.push(extra[i]); } }
  res=[];
  list=shuffle(list);
  for(i=0;i<list.length && res.length<3;i++){ if(indexOf(valid,list[i])<0 && list[i]!==form){ res.push(list[i]); } }
  return res;
}

/* ---------------------------------------------------------------
   5) HINWEISE
   --------------------------------------------------------------- */
function hintBox(key, vars){ return '<div class="hint">'+tt(key,vars)+'</div>'; }
function conjHint(verb, person){
  var fk=PERSON_FORMKEY[person], f=verb.forms[fk], h, key;
  if(fk==='ich'||fk==='er'){ key = verb.sg13==='e' ? 'r_e' : 'r_none'; }
  else if(fk==='du'){ key='r_du'; }
  else if(fk==='ihr'){ key='r_ihr'; }
  else { key='r_inf'; }
  h=hintBox(key,{f:b(f)});
  if(verb.vowel && (fk==='ich'||fk==='du'||fk==='er')){ h+=hintBox('r_vowel',{a:esc(verb.vowel[0]),b:esc(verb.vowel[1])}); }
  return h;
}
function spellHint(form){
  var list=[], m=form.match(/[äöü]/g);
  if(m){ list.push(hintBox('r_umlaut',{u:esc(uniq(m).join(' / '))})); }
  if(/ss/.test(form)){ list.push(hintBox('r_ss',{f:b(form)})); }
  if(/nn/.test(form)){ list.push(hintBox('r_nn',{f:b(form)})); }
  if(/ch/.test(form)){ list.push(hintBox('r_ch',{f:b(form)})); }
  return list.slice(0,2).join('');
}
function posHint(s){
  var key = s.type==='stmt' ? 'r_stmt' : (s.type==='yn' ? 'r_yn' : 'r_wq');
  var h=hintBox(key);
  if(s.type==='stmt' && s.adv){ h+=hintBox('r_stmt_adv',{x:esc(s.adv)}); }
  return h;
}
function otherPersons(verb, typed){
  var map={ich:'ich',du:'du',er:'er / sie (Sg.)',wir:'wir',ihr:'ihr',sie:'sie (Pl.) / Sie'}, k, r=[];
  for(k in map){ if(map.hasOwnProperty(k) && verb.forms[k]===typed){ r.push(map[k]); } }
  return r.join(', ');
}

var MODES = {
  conj_choice:{grp:'conj', title:'m_conj_choice', q:'q_conj_choice'},
  conj_type:{grp:'conj', title:'m_conj_type', q:'q_conj_type'},

  spell_letters:{grp:'spell', title:'m_spell_letters', q:'q_spell_letters'},
  mean_cat:{grp:'mean', title:'m_mean_cat', q:'q_mean_cat'},
  mean_ctx:{grp:'mean', title:'m_mean_ctx', q:'q_mean_ctx'},
  mean_tr:{grp:'mean', title:'m_mean_tr', q:'q_mean_tr', needLang:true},
  order_build:{grp:'order', title:'m_order_build', q:'q_build'},
  order_klammer:{grp:'order', title:'m_order_klammer', q:'q_klammer_modal'}
};

var MODE_ORDER = ['conj_choice','conj_type','spell_choice','spell_letters','mean_cat','mean_ctx','mean_tr','order_build','order_klammer'];

function modeAvailable(m){
  if(MODES[m].needLang && store.lang==='de'){ return false; }
  return true;
}
function availableModes(){
  var r=[], i;
  for(i=0;i<MODE_ORDER.length;i++){ if(modeAvailable(MODE_ORDER[i])){ r.push(MODE_ORDER[i]); } }
  return r;
}

function pickVP(){
  var v=pick(selectedVerbs());
  var p=weightedPick(PERSONS,function(x){ return 'p:'+v.id+'|'+x; });
  return {v:v, p:p, skey:'p:'+v.id+'|'+p};
}

function makeItem(mode){
  var vp, s, it, i, opts, forms, k, list, ctx, v, act, cands, tr, ans, o;
  if(mode==='conj_choice' || mode==='conj_type'){
    vp=pickVP(); s=genSentence(vp.v, vp.p, {});
    it={mode:mode, verb:vp.v.id, person:vp.p, s:s, skey:vp.skey, answer:s.form, sig:mode+'|'+sentText(s), sum:sentText(s)};
    if(mode==='conj_choice'){
      forms=[]; for(k in vp.v.forms){ if(vp.v.forms.hasOwnProperty(k)){ forms.push(vp.v.forms[k]); } }
      it.options=shuffle(uniq(forms));
    }
    return it;
  }
  if(mode==='spell_choice'){
    vp=pickVP(); s=genSentence(vp.v, vp.p, {});
    list=spellOptions(vp.v, s.form);
    if(list.length<2){ return null; }
    opts=shuffle(list.concat([s.form]));
    return {mode:mode, verb:vp.v.id, person:vp.p, s:s, skey:'s:'+vp.v.id+'|'+vp.p, answer:s.form, options:opts, sig:mode+'|'+sentText(s), sum:sentText(s)};
  }
  if(mode==='spell_letters'){
    vp=pickVP(); s=genSentence(vp.v, vp.p, {types:['stmt'], adv:false});
    list=s.form.split('');
    opts=shuffle(list);
    for(i=0;i<10 && opts.join('')===s.form;i++){ opts=shuffle(list); }
    return {mode:mode, verb:vp.v.id, person:vp.p, s:s, skey:'s:'+vp.v.id+'|'+vp.p, answer:s.form, letters:opts, sig:mode+'|'+sentText(s), sum:sentText(s)};
  }
  if(mode==='mean_cat'){
    vp=pickVP(); s=genSentence(vp.v, vp.p, {});
    return {mode:mode, verb:vp.v.id, person:vp.p, s:s, skey:'m:'+vp.v.id, answer:vp.v.cat, sig:mode+'|'+sentText(s), sum:sentText(s)+' → '+vp.v.inf};
  }
  if(mode==='mean_ctx'){
    v=pick(selectedVerbs());
    if(!v.contexts || !v.contexts.length){ return null; }
    ctx=pick(v.contexts);
    list=[];
    for(i=0;i<VERBS.length;i++){
      if(VERBS[i].id===v.id || !(ctx.x && indexOf(ctx.x,VERBS[i].id)>=0)){ list.push({id:VERBS[i].id, form:VERBS[i].forms[PERSON_FORMKEY[ctx.p]]}); }
    }
    if(list.length<2){ return null; }
    ans=v.forms[PERSON_FORMKEY[ctx.p]];
    return {mode:mode, verb:v.id, person:ctx.p, ctx:ctx.t, options:shuffle(list), answer:ans, skey:'m:'+v.id, sig:mode+'|'+ctx.t, sum:ctx.t.replace('___',ans)};
  }
  if(mode==='mean_tr'){
    if(store.lang==='de'){ return null; }
    v=pick(selectedVerbs());
    cands=[];
    for(i=0;i<ACTIVITIES.length;i++){
      tr=ACTIVITIES[i].tr && ACTIVITIES[i].tr[store.lang];
      if(tr){
        o=true;
        for(k=0;k<CATEGORIES.length;k++){ if(!tr[k]){ o=false; } }
        if(o){ cands.push(ACTIVITIES[i]); }
      }
    }
    if(!cands.length){ return null; }
    act=pick(cands);
    s=genSentence(v,'ich',{types:['stmt'],adv:false,act:act});
    tr=act.tr[store.lang]; opts=[];
    for(k=0;k<CATEGORIES.length;k++){ opts.push({cat:CATEGORIES[k], text:tr[k]}); }
    return {mode:mode, verb:v.id, person:'ich', s:s, skey:'m:'+v.id, options:shuffle(opts), answer:v.cat, lang:store.lang, sig:mode+'|'+sentText(s), sum:sentText(s)+' = '+tr[indexOf(CATEGORIES,v.cat)]};
  }
  if(mode==='order_build' || mode==='order_klammer'){
    v=pick(selectedVerbs());
    o=pick(['stmt','yn','wq']);
    ans=weightedPick(PERSONS,function(x){ return 'o:'+v.id+'|'+o+'|'+x; });
    s=genSentence(v, ans, {types:[o], adv:(mode==='order_klammer')});
    it={mode:mode, verb:v.id, person:ans, s:s, skey:'o:'+v.id+'|'+o+'|'+ans, sig:mode+'|'+sentText(s), sum:sentText(s)};
    if(mode==='order_build'){
      list=[]; for(i=0;i<s.tokens.length;i++){ list.push(i); }
      opts=shuffle(list);
      for(i=0;i<10 && opts.join(',')===list.join(',');i++){ opts=shuffle(list); }
      it.order=opts;
    }
    return it;
  }
  return null;
}

/* ---------- Runde ---------- */
function startRound(modeId, items){
  var n=10, list=[], used={}, tries=0, m, it, av;
  if(items){ list=items; }
  else {
    av=availableModes();
    while(list.length<n && tries<300){
      tries++;
      m=(modeId==='mixed') ? pick(av) : modeId;
      it=makeItem(m);
      if(!it || used[it.sig]){ continue; }
      used[it.sig]=1; list.push(it);
    }
  }
  S.round={mode:modeId, items:list, idx:0, score:0, wrong:[], locked:false};
  S.screen='quiz';
  render();
}

        if(typeof st!=='number'){ st=val.length; en=val.length; }
        inp.value=val.slice(0,st)+ch+val.slice(en); pos=st+ch.length;
        try{ inp.focus(); inp.setSelectionRange(pos,pos); }catch(e){}
      };
      keys.appendChild(kb);
    })(ks[i]);
  }
  host.appendChild(keys);
  var cb=el('button','btn primary', tt('check')); cb.setAttribute('type','button');
  function doCheck(){
    if(S.round.locked){ return; }
    var val=trim(inp.value);
    if(val===''){ return; }
    var ok=(val.toLowerCase()===it.answer.toLowerCase()), h='', oth;
    inp.disabled=true; cb.disabled=true;
    $('sbox').innerHTML=sentHtml(it.s,{col:true});
    if(!ok){
      h='<div class="sol">'+tt('solution')+' '+b(it.answer)+'</div>';
      oth=otherPersons(v,val.toLowerCase());
      if(oth && val.toLowerCase()!==it.answer.toLowerCase()){ h+=hintBox('r_other',{x:esc(val),p:esc(oth)}); }
      else if(stripUm(val)===stripUm(it.answer)){ h+=spellHint(it.answer); }
      h+=conjHint(v,it.person);
    } else { h=conjHint(v,it.person); }
    answered(it, ok, h);
  }
  cb.onclick=doCheck;
  inp.onkeydown=function(e){ e=e||window.event; if(e.keyCode===13){ doCheck(); } };
  host.appendChild(cb);
  try{ inp.focus(); }catch(e){}
};

RENDERERS.spell_letters=function(it, host, v){
  host.innerHTML=tags(it,v,true)+'<div id="sbox">'+sentHtml(it.s,{gap:true})+'</div>';
  var placed=[], used=[], i, line=el('div','line'), bank=el('div','bank'), ctrl=el('div','');
  for(i=0;i<it.letters.length;i++){ used.push(false); }
  var bDel=el('button','btn small ghost', tt('del')), bClr=el('button','btn small ghost', tt('clear')), bChk=el('button','btn primary', tt('check'));
  bDel.setAttribute('type','button'); bClr.setAttribute('type','button'); bChk.setAttribute('type','button');
  function redraw(){
    var j;
    line.innerHTML='';
    for(j=0;j<placed.length;j++){
      (function(pos){
        var c=el('button','chip letter placed', esc(it.letters[placed[pos]]));
        c.setAttribute('type','button');
        c.onclick=function(){ if(S.round.locked){ return; } used[placed[pos]]=false; placed.splice(pos,1); redraw(); };
        line.appendChild(c);
      })(j);
    }
    bank.innerHTML='';
    for(j=0;j<it.letters.length;j++){
      (function(idx){
        var c=el('button','chip letter'+(used[idx]?' ghostc':''), esc(it.letters[idx]));
        c.setAttribute('type','button');
        if(!used[idx]){ c.onclick=function(){ if(S.round.locked){ return; } used[idx]=true; placed.push(idx); redraw(); }; }
        bank.appendChild(c);
      })(j);
    }
    bChk.disabled=(placed.length!==it.letters.length);
  }
  bDel.onclick=function(){ if(S.round.locked||!placed.length){ return; } used[placed.pop()]=false; redraw(); };
  bClr.onclick=function(){ if(S.round.locked){ return; } var j; placed=[]; for(j=0;j<used.length;j++){ used[j]=false; } redraw(); };
  bChk.onclick=function(){
    if(S.round.locked){ return; }
    var word='', j;
    for(j=0;j<placed.length;j++){ word+=it.letters[placed[j]]; }
    var ok=(word===it.answer);
    bDel.disabled=true; bClr.disabled=true; bChk.disabled=true;
    var chips=bank.querySelectorAll('button'), q;
    for(q=0;q<chips.length;q++){ chips[q].disabled=true; }
    chips=line.querySelectorAll('button');
    for(q=0;q<chips.length;q++){ chips[q].disabled=true; }
    $('sbox').innerHTML=sentHtml(it.s,{col:true});
    answered(it, ok, (ok?'':'<div class="sol">'+tt('solution')+' '+b(it.answer)+'</div>')+spellHint(it.answer));
  };
  host.appendChild(line); host.appendChild(bank);
  ctrl.appendChild(bDel); ctrl.appendChild(bClr); ctrl.appendChild(bChk);
  host.appendChild(ctrl);
  redraw();
};

function posIndexOf(seq, tok){ var i; for(i=0;i<seq.length;i++){ if(seq[i]===tok){ return i; } } return -1; }

RENDERERS.order_build=function(it, host, v){
  var s=it.s, order=it.order, placed=[], used=[], i, line=el('div','line'), bank=el('div','bank'), ctrl=el('div','');
  for(i=0;i<order.length;i++){ used.push(false); }
  host.appendChild(el('div','tags','<span class="tag p">'+esc(v.inf)+'</span>'));
  var bDel=el('button','btn small ghost', tt('del')), bClr=el('button','btn small ghost', tt('clear')), bChk=el('button','btn primary', tt('check'));
  bDel.setAttribute('type','button'); bClr.setAttribute('type','button'); bChk.setAttribute('type','button');
  function redraw(){
    var j;
    line.innerHTML='';
    for(j=0;j<placed.length;j++){
      (function(pos){
        var c=el('button','chip placed', esc(s.tokens[order[placed[pos]]]));
        c.setAttribute('type','button');
        c.onclick=function(){ if(S.round.locked){ return; } used[placed[pos]]=false; placed.splice(pos,1); redraw(); };
        line.appendChild(c);
      })(j);
    }
    line.appendChild(el('span','pn', esc(s.punct)));
    bank.innerHTML='';
    for(j=0;j<order.length;j++){
      (function(idx){
        var c=el('button','chip'+(used[idx]?' ghostc':''), esc(s.tokens[order[idx]]));
        c.setAttribute('type','button');
        if(!used[idx]){ c.onclick=function(){ if(S.round.locked){ return; } used[idx]=true; placed.push(idx); redraw(); }; }
        bank.appendChild(c);
      })(j);
    }
    bChk.disabled=(placed.length!==order.length);
  }
  bDel.onclick=function(){ if(S.round.locked||!placed.length){ return; } used[placed.pop()]=false; redraw(); };
  bClr.onclick=function(){ if(S.round.locked){ return; } var j; placed=[]; for(j=0;j<used.length;j++){ used[j]=false; } redraw(); };
  bChk.onclick=function(){
    if(S.round.locked){ return; }
    var seq=[], j, canon=lcAll(s.tokens), a, same, alt=false, expMi=s.mi, h='', modalTok=canon[s.mi];
    for(j=0;j<placed.length;j++){ seq.push(s.tokens[order[placed[j]]]); }
    a=lcAll(seq);
    same=(a.join('|')===canon.join('|'));
    if(!same && s.type==='stmt' && !s.adv && a[1]===modalTok && a[a.length-1]===canon[canon.length-1]){ alt=true; }
    var ok=same||alt;
    bDel.disabled=true; bClr.disabled=true; bChk.disabled=true;
    var chips=line.querySelectorAll('button'), q;
    for(q=0;q<chips.length;q++){ chips[q].disabled=true; }
    h='<div class="sol">'+sentHtml(s,{col:true})+'</div>';
    if(alt){ h='<div class="hint">'+tt('also_ok')+'</div>'+h; }
    if(!ok){
      h='<div class="sol">'+tt('solution')+'</div>'+h;
      if(posIndexOf(a,modalTok)!==expMi){ h+=posHint(s); }
      if(a[a.length-1]!==canon[canon.length-1]){ h+=hintBox('r_inf_end'); }
      if(posIndexOf(a,modalTok)===expMi && a[a.length-1]===canon[canon.length-1]){ h+=posHint(s); }
    } else if(alt){ h+=posHint(s); }
    answered(it, ok, h);
  };
  host.appendChild(line); host.appendChild(bank);
  ctrl.appendChild(bDel); ctrl.appendChild(bClr); ctrl.appendChild(bChk);
  host.appendChild(ctrl);
  redraw();
};

RENDERERS.order_klammer=function(it, host, v){
  var s=it.s, cur=[], i, phase=1, okM=false, okI=false, msg='', area=el('div',''), modalTok=s.tokens[s.mi], infTok=s.tokens[s.ii];
  for(i=0;i<s.tokens.length;i++){ if(i!==s.mi && i!==s.ii){ cur.push({t:s.tokens[i], k:''}); } }
  host.appendChild(el('div','tags','<span class="tag v">'+esc(modalTok)+'</span><span class="tag">'+esc(infTok)+'</span>'));
  host.appendChild(area);
  function setPrompt(key){ var p=$('promptTxt'); if(p){ p.innerHTML=tt(key); } }
  function draw(){
    var h, row, j;
    area.innerHTML='';
    if(msg){ area.appendChild(el('div','pmsg '+(okM?'ok':'bad'), msg)); }
    var info=el('div','sub small', phase===1 ? '<span class="tag v">'+esc(modalTok)+'</span>' : '<span class="tag" style="background:#e4f5e6;color:#1b5e20">'+esc(infTok)+'</span>');
    area.appendChild(info);
    row=el('div','gaprow');
    for(j=0;j<=cur.length;j++){
      (function(g){
        var gb=el('button','gapb','&nbsp;'); gb.setAttribute('type','button'); gb.setAttribute('aria-label','gap '+g);
        gb.onclick=function(){ tap(g); };
        row.appendChild(gb);
      })(j);
      if(j<cur.length){ row.appendChild(el('span','gw'+(cur[j].k?' '+cur[j].k:''), esc(cur[j].t))); }
    }
    row.appendChild(el('span','pn', esc(s.punct)));
    area.appendChild(row);
  }
  function tap(g){
    if(S.round.locked){ return; }
    if(phase===1){
      okM=(g===s.mi);
      cur.splice(s.mi,0,{t:modalTok,k:'m'});
      msg = okM ? tt('ok') : (tt('bad')+posHint(s));
      phase=2; setPrompt('q_klammer_inf'); draw();
    } else {
      okI=(g===cur.length);
      var ok=(okM&&okI), h='';
      area.innerHTML='<div class="sol">'+sentHtml(s,{col:true})+'</div>';
      if(!ok){
        if(!okM){ h+=posHint(s); }
        if(!okI){ h+=hintBox('r_inf_end'); }
      }
      answered(it, ok, h);
    }
  }
  draw();
};

function renderResult(app){
  var R=S.round, card=el('div','card'), i, h, bt, row;
  h='<h2>'+tt('done')+'</h2><div class="bigscore">'+R.score+' / '+R.items.length+'</div>';
  if(R.wrong.length){
    h+='<ul class="wl">';
    for(i=0;i<R.wrong.length;i++){ h+='<li>'+esc(R.wrong[i].sum)+'</li>'; }
    h+='</ul>';
  }
  card.innerHTML=h;
  row=el('div','');
  if(R.wrong.length){
    bt=el('button','btn primary', tt('retry')); bt.setAttribute('type','button');
    bt.onclick=function(){ startRound(R.mode, R.wrong.slice()); };
    row.appendChild(bt);
  }
  bt=el('button','btn', tt('again')); bt.setAttribute('type','button');
  bt.onclick=function(){ startRound(R.mode); };
  row.appendChild(bt);
  bt=el('button','btn ghost', tt('menu')); bt.setAttribute('type','button');
  bt.onclick=function(){ S.screen='menu'; render(); };
  row.appendChild(bt);
  card.appendChild(row);
  app.appendChild(card);
}
