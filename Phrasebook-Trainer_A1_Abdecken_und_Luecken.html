<!DOCTYPE html>
<html lang="uk" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phrasebook-Trainer A1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
/* Layout idea: one centred working card; Ukrainian on the left, German on the right, like a worksheet row. */
:root{
  --bg:#f2f4f8; --card:#ffffff; --ink:#15203b; --muted:#5a6580; --line:#d9deea;
  --accent:#1f4fa8; --accent-ink:#ffffff; --warm:#f2c230; --warm-ink:#2b2200;
  --cover:#11151f; --bad:#b3261e; --bad-bg:#fbe4e1; --gapbg:#eef2fb; --good:#1d7a4d; --good-bg:#e4f4ea; --peek-bg:#fff4cc;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  --sans:"Source Sans 3",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10141f; --card:#182033; --ink:#e8ecf6; --muted:#9aa5c0; --line:#2b3550;
    --accent:#7aa5f5; --accent-ink:#0c1428; --warm:#f2c230; --warm-ink:#2b2200;
    --cover:#dfe4f0; --bad:#ff9a90; --bad-bg:#452320; --gapbg:#222d47; --good:#6fd3a0; --good-bg:#17382b; --peek-bg:#40350f;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10141f; --card:#182033; --ink:#e8ecf6; --muted:#9aa5c0; --line:#2b3550;
  --accent:#7aa5f5; --accent-ink:#0c1428; --warm:#f2c230; --warm-ink:#2b2200;
  --cover:#dfe4f0; --bad:#ff9a90; --bad-bg:#452320; --gapbg:#222d47; --good:#6fd3a0; --good-bg:#17382b; --peek-bg:#40350f;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:18px;line-height:1.45}
.wrap{max-width:1040px;margin:0 auto;padding:20px 16px 48px;display:flex;flex-direction:column;gap:16px}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 16px}
h1{font-size:1.15rem;margin:0;font-weight:700;letter-spacing:.01em}
.fn{color:var(--muted);font-size:.95rem}
.fn b{color:var(--ink)}
.bar{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:end;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label,.field .lbl{font-size:.8rem;color:var(--muted);font-weight:600}
select{font:inherit;font-size:.95rem;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);max-width:100%}
.checks{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center}
.chk{display:flex;gap:8px;align-items:center;font-size:.95rem;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--accent)}
.stat{margin-inline-start:auto;text-align:end;font-variant-numeric:tabular-nums;font-size:.95rem;color:var(--muted)}
.stat b{color:var(--ink)}
.qbar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:6px;min-width:140px}
.qbar i{display:block;height:100%;background:var(--accent);width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px clamp(16px,3vw,32px) 26px;display:flex;flex-direction:column;gap:20px}
.steps{display:flex;gap:6px;align-items:center}
.steps i{flex:1;height:8px;border-radius:4px;background:var(--line);max-width:64px}
.steps i.on{background:var(--cover)}
.steps span{font-size:.85rem;color:var(--muted);margin-inline-start:8px;white-space:nowrap;font-variant-numeric:tabular-nums}
.instr{font-size:1.2rem;font-weight:600;margin:0;text-wrap:balance}
.instr small{display:block;font-weight:400;font-size:.95rem;color:var(--muted);margin-top:4px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px 32px;align-items:start;padding:20px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.pair .col{font-family:var(--serif);font-size:clamp(1.35rem,2.6vw,1.9rem);line-height:1.6;min-width:0;overflow-wrap:anywhere}
.pair .uk{color:var(--ink)}
.tag{display:block;font-family:var(--sans);font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.cv{background:var(--cover);color:transparent;border-radius:3px;user-select:none;-webkit-user-select:none;white-space:pre-wrap;padding:0 .08em;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.de.peek{background:var(--peek-bg);border-radius:8px;box-shadow:0 0 0 8px var(--peek-bg)}
.de.reveal .w{color:var(--accent)}
.btns{display:flex;flex-wrap:wrap;gap:10px}
button{font:inherit;font-size:1rem;font-weight:600;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);padding:11px 18px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;min-height:46px}
button:hover{border-color:var(--accent)}
button:focus-visible,select:focus-visible,.chk input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.warm{background:var(--warm);color:var(--warm-ink);border-color:var(--warm)}
button.hard{background:var(--peek-bg);color:var(--ink);border-color:var(--warm)}
button.good{background:var(--good-bg);color:var(--good);border-color:var(--good)}
button[disabled]{opacity:.45;cursor:not-allowed}
svg{width:20px;height:20px;flex:none}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}
.opts button{justify-content:flex-start;text-align:start;align-items:flex-start;padding:14px 16px;line-height:1.35}
.hint{font-size:.9rem;color:var(--muted);margin:0}
.warn{background:var(--peek-bg);border-radius:10px;padding:10px 14px;font-size:.95rem}
.done{text-align:center;padding:28px 8px;display:flex;flex-direction:column;gap:16px;align-items:center}
.done h2{margin:0;font-size:1.4rem}
[hidden]{display:none!important}
@media (max-width:860px){
  .opts{grid-template-columns:1fr}
  .pair{grid-template-columns:1fr}
  .stat{margin-inline-start:0;text-align:start}
}
@media (prefers-reduced-motion:no-preference){
  .qbar i{transition:width .3s}
}

header{align-items:flex-end}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border-radius:10px 10px 0 0;border:1.5px solid var(--line);border-bottom:0;background:transparent;padding:9px 16px;min-height:0;flex-direction:column;align-items:flex-start;gap:0;font-weight:600;color:var(--muted)}
.tab small{font-weight:400;font-size:.8rem}
.tab[aria-selected="true"]{background:var(--card);color:var(--ink);border-color:var(--line)}
.grp{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:end;flex:1 1 auto}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{flex:1 1 220px;flex-direction:column;align-items:flex-start;gap:2px;text-align:start}
.seg button small{font-weight:400;font-size:.85rem;color:var(--muted)}
.seg button[aria-pressed="true"]{border-color:var(--accent);background:var(--gapbg);box-shadow:inset 0 0 0 1px var(--accent)}
.lvls{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:-6px}
.lvls span.l{padding:4px 12px;border-radius:999px;border:1.5px solid var(--line);font-size:.85rem;font-weight:600;color:var(--muted)}
.lvls span.l.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.lvls span.l.past{background:var(--good-bg);color:var(--good);border-color:var(--good)}
.lvls .info{font-size:.85rem;color:var(--muted);margin-inline-start:6px}
.stack{display:flex;flex-direction:column;gap:6px;padding:20px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.stack .col{font-family:var(--serif);font-size:clamp(1.35rem,2.6vw,1.9rem);line-height:1.6}
.cloze{line-height:2.3!important}
.cloze .t{white-space:pre-wrap}
.gap{font:inherit;color:var(--accent);background:var(--gapbg);border:0;border-bottom:3px solid var(--ink);border-radius:5px 5px 0 0;text-align:center;padding:0 .1em;margin:0 .05em;height:1.5em;vertical-align:baseline;outline-offset:2px}
.gap:focus{background:var(--card);border-bottom-color:var(--accent)}
.gap.ok{border-bottom-color:var(--good);background:var(--good-bg);color:var(--good)}
.gap.bad{border-bottom-color:var(--bad);background:var(--bad-bg);color:var(--bad)}
.gap.shown{border-bottom-color:var(--warm);background:var(--peek-bg);color:var(--ink);font-style:italic}
.chars{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chars span{font-size:.85rem;color:var(--muted);margin-inline-end:4px}
.chars button{min-height:40px;padding:6px 14px;font-family:var(--serif);font-size:1.15rem}
.fb{min-height:1.5em;font-weight:600;margin:0}
.fb.ok{color:var(--good)}
.fb.bad{color:var(--bad)}
.fb small{display:block;font-weight:400;color:var(--muted)}
.deCol{direction:ltr;text-align:left}
.gap{direction:ltr}
.ltr{direction:ltr;unicode-bidi:isolate}
.langsel{display:flex;align-items:center;gap:8px}
.langsel svg{color:var(--muted)}
html[dir="rtl"] .pair .col:not(.deCol),html[dir="rtl"] .stack .col:not(.deCol){font-family:"Noto Naskh Arabic","Noto Sans Arabic","Segoe UI","Tahoma","Arial",sans-serif}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Phrasebook-Trainer A1</h1>
    <div class="langsel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.7 3.8 5.7 3.8 9s-1.3 6.3-3.8 9c-2.5-2.7-3.8-5.7-3.8-9S9.5 5.7 12 3z"/></svg>
      <select id="lang" aria-label="Language · Мова · Язык · Dil · اللغة · Język · Limbă · زبان"></select></div>

      <button class="tab" role="tab" id="tab1" type="button" aria-selected="true" aria-controls="v1"><span data-i="tab1"></span><small data-i="tab1s"></small></button>

  <section class="bar" data-aria="barAria">
    <div class="field">
      <label for="sec" data-i="sec"></label>
      <select id="sec"></select>
    </div>
    <div class="field">
      <span class="lbl" data-i="params"></span>

        <label class="chk"><input type="checkbox" id="slow"> <span data-i="slow"></span></label>
        <span id="o1" class="checks">
          <label class="chk"><input type="checkbox" id="shuf"> <span data-i="shuf"></span></label>
          <label class="chk"><input type="checkbox" id="auto" checked> <span data-i="auto"></span></label>
        </span>
        <span id="o2" class="checks" hidden>
          <label class="chk" id="shuf2w"><input type="checkbox" id="shuf2"> <span data-i="shuf"></span></label>
          <label class="chk"><input type="checkbox" id="auto2" checked> <span data-i="auto2"></span></label>
          <span class="field" id="kindw" hidden style="flex-direction:row;align-items:center;gap:8px"><label for="kind" data-i="kindLbl"></label>
            <select id="kind"><option value="mix" data-i="kAll"></option><option value="letter" data-i="kLetter"></option><option value="word" data-i="kWord"></option><option value="multi" data-i="kMulti"></option></select></span>
        </span>
      </div>
    </div>
    <div class="stat">
      <div id="st1"></div>
      <div id="st2" hidden></div>
      <div class="qbar"><i id="qfill"></i></div>
    </div>
  </section>

  <div id="novoice" class="warn" data-i="novoice" hidden></div>

  <main class="card" id="v1" role="tabpanel" aria-labelledby="tab1" aria-live="polite">
    <div id="work">
      <div class="steps" id="steps" aria-hidden="true"></div>
      <p class="instr" id="instr"></p>
      <div class="pair">
        <div class="col uk"><span class="tag" data-tag></span><span id="uk"></span></div>
        <div class="col deCol"><span class="tag">Deutsch</span><span id="de" class="de" lang="de" dir="ltr"></span></div>
      </div>
      <div class="btns" id="btns"></div>
      <div class="opts" id="opts" hidden></div>
    </div>
    <div class="done" id="fin" hidden>
      <h2 data-i="finT"></h2>
      <p class="hint" id="fin1txt"></p>
      <div class="btns"><button class="primary" id="again" type="button" data-i="bAgain"></button></div>
    </div>
  </main>

  <main class="card" id="v2" role="tabpanel" aria-labelledby="tab2" hidden>
    <div class="seg" role="group" data-aria="mAria">
      <button type="button" id="m-prog" aria-pressed="true"><span data-i="mProg"></span><small data-i="mProgS"></small></button>
      <button type="button" id="m-rand" aria-pressed="false"><span data-i="mRand"></span><small data-i="mRandS"></small></button>
    </div>
    <div id="work2">
      <div class="lvls" id="lvls" aria-hidden="true"></div>
      <p class="instr" id="i2"></p>
      <div class="stack">
        <div class="col uk"><span class="tag" data-tag></span><span id="uk2"></span></div>
        <div class="col cloze deCol"><span class="tag">Deutsch</span><span id="cl" lang="de" dir="ltr"></span></div>
      </div>
      <div class="chars" id="chars"><span data-i="special"></span></div>
      <p class="fb" id="fb" role="status"></p>
      <div class="btns" id="b2"></div>
    </div>
    <div class="done" id="fin2" hidden>
      <h2 data-i="finT"></h2>
      <p class="hint" id="fin2txt"></p>
      <div class="btns"><button class="primary" id="again2" type="button" data-i="bAgain"></button></div>
    </div>
  </main>
  <p class="hint" data-i="foot"></p>
</div>

/*LOGIC*/
function makeOrder(n){
  const a=[...Array(n).keys()];
  for(let i=n-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}
function newRun(item){const n=item.c.length;return {n:n,order:makeOrder(n),k:0,peek:false,reveal:false};}
function coveredSet(run){return new Set(run.order.slice(0,run.k));}
function advance(run){
  if(run.peek||run.reveal) return run;
  if(run.k<run.n) run.k++; else run.reveal=true;
  return run;
}
function canPeek(run){return run.k>=1&&!run.reveal&&!run.peek;}
function doPeek(run){if(canPeek(run)) run.peek=true; return run;}
function requeue(q,pos,id){
  /* difficult sentence: comes back after about 5 further sentences, at most once per pass at the end */
  const at=Math.min(pos+6,q.length);
  q.splice(at,0,id);
  return q;
}
function sentence(item){return item.c.join(' ');}
function buildQueue(sec,shuffle){
  let q=[];
  DATA.items.forEach((it,i)=>{ if(sec==='all'||it.s===+sec) q.push(i); });
  if(shuffle) q=makeOrder(q.length).map(i=>q[i]);
  return q;
}
/*END LOGIC*/

/*LOGIC2*/
const KINDS=['letter','word','multi'];
function splitWord(w){const m=w.match(/^([^\p{L}\p{N}]*)(.*?)([^\p{L}\p{N}]*)$/u);return {lead:m[1],core:m[2],trail:m[3]};}
function okCore(core){return /\p{L}/u.test(core)&&!/\d/.test(core)&&!/^(\p{L}-)+\p{L}$/u.test(core);}
function wordsOf(item){
  const out=[];
  item.c.forEach((ch,ci)=>{
    const arr=ch.split(' ').filter(Boolean);
    arr.forEach((w,wi)=>{const p=splitWord(w);out.push({ci:ci,wi:wi,n:arr.length,lead:p.lead,core:p.core,trail:p.trail});});
  });
  return out;
}
function shuf(a,rnd){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function letterPositions(core){const p=[];for(let i=1;i<core.length;i++){if(/\p{L}/u.test(core[i]))p.push(i);}return p;}
/* parts: {t:'s',s} text, {t:'g',a,kind} gap */
function buildCloze(item,kind,rnd){
  rnd=rnd||Math.random;
  const W=wordsOf(item);
  const wordGap=new Map(); /* index in W -> {kind,pos} */
  const chunkGap=new Set();
  if(kind==='letter'){
    const E=[];W.forEach((w,i)=>{if(okCore(w.core)&&w.core.length>=2&&letterPositions(w.core).length)E.push(i);});
    if(E.length){
      const g=Math.min(E.length,E.length<=2?1:Math.max(2,Math.round(E.length*0.4)));
      shuf(E,rnd).slice(0,g).forEach(i=>{const ps=letterPositions(W[i].core);wordGap.set(i,{kind:'letter',pos:ps[Math.floor(rnd()*ps.length)]});});
    }else kind='word';
  }
  if(kind==='word'){
    const E=[];W.forEach((w,i)=>{if(okCore(w.core))E.push(i);});
    const g=Math.min(E.length,E.length<=2?1:Math.max(1,Math.round(E.length*0.34)));
    shuf(E,rnd).slice(0,g).forEach(i=>wordGap.set(i,{kind:'word'}));
  }
  let E0=null;
  if(kind==='multi'){
    E0=[];
    item.c.forEach((ch,ci)=>{const ws=W.filter(w=>w.ci===ci);if(ws.every(w=>okCore(w.core)))E0.push(ci);});
    if(!E0.length)kind='word';
  }
  if(kind==='word'&&!wordGap.size){
    const Ew=[];W.forEach((w,i)=>{if(okCore(w.core))Ew.push(i);});
    const g=Math.min(Ew.length,Ew.length<=2?1:Math.max(1,Math.round(Ew.length*0.34)));
    shuf(Ew,rnd).slice(0,g).forEach(i=>wordGap.set(i,{kind:'word'}));
  }
  if(kind==='multi'){
    const E=E0;
    const m=Math.min(E.length,E.length<2?1:Math.max(2,Math.ceil(item.c.length*0.6)));
    const multi=E.filter(ci=>item.c[ci].split(' ').filter(Boolean).length>1);
    const pick=[];
    if(multi.length) pick.push(multi[Math.floor(rnd()*multi.length)]);
    shuf(E.filter(c=>!pick.includes(c)),rnd).forEach(c=>{if(pick.length<m)pick.push(c);});
    pick.forEach(c=>chunkGap.add(c));
  }
  const parts=[];
  const push=s=>{if(!s)return;const l=parts[parts.length-1];if(l&&l.t==='s')l.s+=s;else parts.push({t:'s',s:s});};
  item.c.forEach((ch,ci)=>{
    if(ci>0)push(' ');
    if(chunkGap.has(ci)){
      const lead=ch.match(/^[^\p{L}\p{N}]*/u)[0];
      const trail=ch.slice(lead.length).match(/[^\p{L}\p{N}]*$/u)[0];
      push(lead);parts.push({t:'g',a:ch.slice(lead.length,ch.length-trail.length),kind:'multi'});push(trail);
      return;
    }
    W.forEach((w,i)=>{
      if(w.ci!==ci)return;
      if(w.wi>0)push(' ');
      push(w.lead);
      const g=wordGap.get(i);
      if(!g)push(w.core);
      else if(g.kind==='word')parts.push({t:'g',a:w.core,kind:'word'});
      else{push(w.core.slice(0,g.pos));parts.push({t:'g',a:w.core[g.pos],kind:'letter'});push(w.core.slice(g.pos+1));}
      push(w.trail);
    });
  });
  return {parts:parts,kind:kind,gaps:parts.filter(p=>p.t==='g')};
}
function clozeFull(cl){return cl.parts.map(p=>p.t==='s'?p.s:p.a).join('');}
function expandDe(s){return s.replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/Ä/g,'Ae').replace(/Ö/g,'Oe').replace(/Ü/g,'Ue').replace(/ß/g,'ss');}
/* returns 'ok' | 'alt' (ae/oe/ue/ss instead of umlaut) | 'case' (only capitalisation differs) | 'bad' */
function evalGap(user,ans){
  const u=user.replace(/\s+/g,' ').trim();
  if(u===ans)return 'ok';
  if(!u)return 'bad';
  if(expandDe(u)===expandDe(ans))return 'alt';
  if(u.toLowerCase()===ans.toLowerCase())return 'case';
  if(expandDe(u).toLowerCase()===expandDe(ans).toLowerCase())return 'case';
  return 'bad';
}
/*END LOGIC2*/

function buildSecOptions(){
  const sel=$('sec');const keep=sel.value||'all';sel.textContent='';
  const counts={};DATA.items.forEach(i=>counts[i.s]=(counts[i.s]||0)+1);
  const all=document.createElement('option');all.value='all';all.textContent=t('all',DATA.items.length);sel.appendChild(all);

  });
  sel.value=keep;
}
function applyStatic(l){
  LANG=l;
  const de=document.documentElement;de.lang=l;de.dir=LANGS[l].dir;
  document.querySelectorAll('[data-i]').forEach(e=>{e.textContent=t(e.dataset.i);});
  document.querySelectorAll('[data-aria]').forEach(e=>e.setAttribute('aria-label',t(e.dataset.aria)));
  document.querySelectorAll('[data-tag]').forEach(e=>e.textContent=LANGS[l].tag);
  ['uk','uk2'].forEach(id=>{const e=$(id);e.lang=l;e.dir=LANGS[l].dir;});
  buildSecOptions();
}
function setLang(l){
  applyStatic(l);
  if(S.run){ if(S.pos>=S.queue.length)showFinish();else render(); }
  gt2Relabel();
  if(VIEW===1)updateStat(S.pos>=S.queue.length);
}
let VIEW=1;
const S={queue:[],pos:0,run:null,done:new Set(),hard:new Set(),voice:null,voicesReady:false};

function pickVoice(){
  if(!('speechSynthesis' in window)) return;
  const vs=speechSynthesis.getVoices();
  if(!vs.length) return;
  S.voicesReady=true;
  S.voice=vs.find(v=>v.lang==='de-DE')||vs.find(v=>/^de/i.test(v.lang))||null;
}
function speak(text){
  if(!('speechSynthesis' in window)){ $('novoice').hidden=false; return; }
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang='de-DE';
    if(S.voice) u.voice=S.voice;
    u.rate=$('slow').checked?0.6:0.9;
    speechSynthesis.speak(u);
    $('novoice').hidden=!(S.voicesReady&&!S.voice);
  }catch(e){ $('novoice').hidden=false; }
}
if('speechSynthesis' in window){
  pickVoice();
  speechSynthesis.addEventListener&&speechSynthesis.addEventListener('voiceschanged',pickVoice);
}

function current(){return DATA.items[S.queue[S.pos]];}

function setQueue(){
  S.queue=buildQueue($('sec').value,$('shuf').checked);
  S.pos=0;
  S.done=new Set();S.hard=new Set();
  startSentence(false);
}

function startSentence(say){
  if(S.pos>=S.queue.length){showFinish();return;}
  $('work').hidden=false;$('fin').hidden=true;
  S.run=newRun(current());
  render();
  if(say&&$('auto').checked) speak(sentence(current()));
}

function showFinish(){
  $('work').hidden=true;$('fin').hidden=false;
  updateStat(true);
}

function updateStat(fin){
  if(VIEW!==1) return;
  const tot=S.queue.length;
  $('st1').innerHTML=t('st1',fin?tot:Math.min(S.pos+1,tot),tot,S.done.size,S.hard.size);
  $('fin1txt').innerHTML=t('fin1',S.done.size,S.hard.size);
  $('qfill').style.width=(tot?(fin?tot:S.pos)/tot*100:0)+'%';
}

function renderDe(item,run){
  const de=$('de');
  de.textContent='';
  de.className='de'+(run.peek?' peek':'')+(run.reveal?' reveal':'');
  const cov=run.peek||run.reveal?new Set():coveredSet(run);
  item.c.forEach((c,i)=>{
    const isCov=cov.has(i);
    const nextCov=i<item.c.length-1&&cov.has(i+1);
    const s=document.createElement('span');
    if(isCov){
      s.className='cv';s.setAttribute('aria-hidden','true');
      s.textContent=c+(nextCov?' ':'');
    }else{
      s.className='w';s.textContent=c;
    }
    de.appendChild(s);
    if(i<item.c.length-1&&!(isCov&&nextCov)) de.appendChild(document.createTextNode(' '));
  });
}

function btn(label,cls,fn,icon,disabled){
  const b=document.createElement('button');
  b.type='button';b.className=cls||'';
  if(icon) b.insertAdjacentHTML('beforeend',icon);
  b.appendChild(document.createTextNode(label));
  if(disabled) b.disabled=true;
  b.addEventListener('click',fn);
  return b;
}

function render(){
  const item=current(),run=S.run,n=run.n;
  $('uk').textContent=tr(S.queue[S.pos]);
  renderDe(item,run);
  // steps bar
  const st=$('steps');st.textContent='';
  const cov=coveredSet(run);
  for(let i=0;i<n;i++){const e=document.createElement('i');if(!run.reveal&&!run.peek&&i<run.k)e.className='on';st.appendChild(e);}
  const lab=document.createElement('span');
  lab.textContent=run.reveal?t('stepRev'):(run.peek?t('stepPeek'):t('stepClosed',run.k,n));
  st.appendChild(lab);
  // instruction
  const ins=$('instr');ins.textContent='';
  const main=document.createElement('span');
  const sub=document.createElement('small');
  if(run.peek){
    main.textContent=t('iPeek');
    sub.textContent=t('sPeek');
  }else if(run.reveal){
    main.textContent=t('iRev');
    sub.textContent=t('sRev');
  }else if(run.k===0){
    main.textContent=t('i0');
    sub.textContent=t('s0');
  }else if(run.k<n){
    main.textContent=t('iMid');
    sub.textContent=t('sMid');
  }else{
    main.textContent=t('iAll');
    sub.textContent=t('sAll');
  }
  ins.appendChild(main);ins.appendChild(sub);
  // buttons
  const bs=$('btns');bs.textContent='';
  const opts=$('opts');opts.textContent='';opts.hidden=true;
  const say=()=>speak(sentence(item));
  if(run.peek){
    bs.appendChild(btn(t('bAgain'),'primary',()=>{S.run=newRun(item);render();},null));
  }else if(run.reveal){
    bs.appendChild(btn(t('bListen'),'primary',say,ICON_PLAY));
    opts.hidden=false;
    const id=S.queue[S.pos];
    const o1=btn(t('o1'),'',()=>{S.run=newRun(item);render();},null);
    const o2=btn(t('o2'),'hard',()=>{
      S.done.delete(id);S.hard.add(id);
      requeue(S.queue,S.pos,id);
      S.pos++;startSentence(true);},null);
    const o3=btn(t('o3'),'good',()=>{
      S.done.add(id);S.hard.delete(id);S.pos++;startSentence(true);},null);
    opts.appendChild(o1);opts.appendChild(o2);opts.appendChild(o3);
  }else if(run.k===0){
    bs.appendChild(btn(t('bListen'),'warm',say,ICON_PLAY));
    bs.appendChild(btn(t('bNext'),'primary',()=>{advance(S.run);render();},null));
  }else{
    bs.appendChild(btn(run.k<n?t('bNext'):t('bCheck'),'primary',()=>{advance(S.run);render();},null));
    bs.appendChild(btn(t('bPeek'),'',()=>{doPeek(S.run);render();},ICON_EYE));
  }
  // skip controls
  const sk=document.createElement('span');
  sk.style.marginInlineStart='auto';sk.style.display='flex';sk.style.gap='8px';
  const prev=btn(t('bPrev'),'',()=>{if(S.pos>0){S.pos--;startSentence(true);}},null,S.pos===0);
  const nxt=btn(t('bSkip'),'',()=>{S.pos++;startSentence(true);},null);
  sk.appendChild(prev);sk.appendChild(nxt);
  bs.appendChild(sk);
  updateStat(false);
}


/* ---------- Function 2: gap fill ---------- */
const GT={mode:'prog',queue:[],pos:0,level:1,kind:'letter',item:null,id:null,cl:null,state:'edit',attempts:0,hinted:false,
  done:new Set(),bag:[],ex:0,first:0,inputs:[],last:null,lastId:null,fb:null};
const KIND_KEY={letter:'kLetter',word:'kWord',multi:'kMulti'};
const HELP_KEY={letter:'hLetter',word:'hWord',multi:'hMulti'};

function gt2Reset(){
  GT.queue=buildQueue($('sec').value,$('shuf2').checked);
  GT.pos=0;GT.level=1;GT.done=new Set();GT.bag=[];GT.ex=0;GT.first=0;
  gt2Load(false);
}
function gt2NextId(){
  if(!GT.bag.length){
    const q=buildQueue($('sec').value,true);
    if(q.length>1&&q[0]===GT.id) q.push(q.shift());
    GT.bag=q;
  }
  return GT.bag.shift();
}
function gt2Load(focus){
  $('fin2').hidden=true;
  if(GT.mode==='prog'){
    if(GT.pos>=GT.queue.length){gt2Finish();return;}
    GT.id=GT.queue[GT.pos];GT.kind=KINDS[GT.level-1];
  }else{
    GT.id=gt2NextId();
    const k=$('kind').value;
    GT.kind=k==='mix'?KINDS[Math.floor(Math.random()*3)]:k;
  }
  if(GT.id===undefined){gt2Finish();return;}
  GT.item=DATA.items[GT.id];
  GT.cl=buildCloze(GT.item,GT.kind);
  GT.kind=GT.cl.kind;
  GT.state='edit';GT.attempts=0;GT.hinted=false;GT.last=null;
  gt2Render(focus);
}
function gt2Finish(){
  $('work2').hidden=true;$('fin2').hidden=false;
  $('fin2txt').innerHTML=t('fin2',GT.done.size);
  gt2Stat(true);
}
function gt2Stat(fin){
  if(VIEW!==2) return;
  if(GT.mode==='prog'){
    const tot=GT.queue.length;
    $('st2').innerHTML=t('st2p',fin?tot:Math.min(GT.pos+1,tot),tot,GT.done.size);
    $('qfill').style.width=(tot?((fin?tot:GT.pos)+(!fin&&tot?(GT.level-1)/3:0))/tot*100:0)+'%';
  }else{
    $('st2').innerHTML=t('st2r',GT.ex,GT.first);
    $('qfill').style.width=(GT.ex?GT.first/GT.ex*100:0)+'%';
  }
}
function gt2Render(focus){
  $('work2').hidden=false;
  $('uk2').textContent=tr(GT.id);
  // level pills
  const lv=$('lvls');lv.textContent='';
  if(GT.mode==='prog'){
    KINDS.forEach((k,i)=>{
      const s=document.createElement('span');
      s.className='l'+(i+1<GT.level?' past':'')+(i+1===GT.level?' on':'');
      s.textContent=(i+1)+' · '+t(KIND_KEY[k]);lv.appendChild(s);
    });
  }else{
    const s=document.createElement('span');s.className='l on';s.textContent=t('kindIs')+t(KIND_KEY[GT.kind]);lv.appendChild(s);
  }
  $('i2').textContent=(GT.mode==='prog'?t('lvlOf',GT.level):'')+t(HELP_KEY[GT.kind]);
  // cloze
  const cl=$('cl');cl.textContent='';GT.inputs=[];
  GT.cl.parts.forEach(p=>{
    if(p.t==='s'){const s=document.createElement('span');s.className='t';s.textContent=p.s;cl.appendChild(s);}
    else{
      const inp=document.createElement('input');
      inp.type='text';inp.className='gap';inp.autocomplete='off';inp.spellcheck=false;
      inp.setAttribute('autocapitalize','off');inp.setAttribute('autocorrect','off');
      inp.setAttribute('aria-label',t('gap',GT.inputs.length+1));inp.dir='ltr';
      inp.style.width=(Math.max(p.a.length,1)+1.2)+'ch';
      if(p.kind==='letter')inp.maxLength=1;
      inp.dataset.i=GT.inputs.length;
      inp.addEventListener('focus',()=>{GT.last=inp;});
      inp.addEventListener('input',()=>{
        inp.classList.remove('ok','bad','shown');
        if(p.kind==='letter'&&inp.value.length===1){const nx=GT.inputs[+inp.dataset.i+1];if(nx&&!nx.disabled)nx.focus();}
      });
      inp.addEventListener('keydown',e=>{
        if(e.key==='Enter'){e.preventDefault();if(GT.state==='edit')gt2Check();else gt2Next();}
      });
      cl.appendChild(inp);GT.inputs.push(inp);
    }
  });
  GT.fb=null;gt2Fb();
  gt2Buttons();
  gt2Stat(false);
  if(focus&&GT.inputs[0])GT.inputs[0].focus();
}
function gt2Buttons(){
  const b=$('b2');b.textContent='';
  const say=()=>speak(sentence(GT.item));
  const last=GT.mode==='prog'&&GT.level===3;
  if(GT.state==='edit'){
    b.appendChild(btn(t('bCheck'),'primary',gt2Check,null));
    b.appendChild(btn(t('bHint'),'warm',gt2Hint,null));
    b.appendChild(btn(t('bReveal'),'',gt2Reveal,ICON_EYE));
    b.appendChild(btn(t('bListen'),'',say,ICON_PLAY));
  }else{
    let label;
    if(GT.state==='revealed') label=GT.mode==='prog'?t('bRetry'):t('bNext');
    else label=GT.mode==='prog'?(last?t('bNextS'):t('bNextL',GT.level+1)):t('bNext');
    b.appendChild(btn(label,'primary',gt2Next,null));
    b.appendChild(btn(t('bListen'),'',say,ICON_PLAY));
  }
  if(GT.mode==='prog'){
    const sk=document.createElement('span');sk.style.marginInlineStart='auto';sk.style.display='flex';sk.style.gap='8px';
    sk.appendChild(btn(t('bSkipS'),'',()=>{GT.pos++;GT.level=1;gt2Load(true);},null));
    b.appendChild(sk);
  }
}
function gt2Check(){
  if(GT.state!=='edit')return;
  GT.attempts++;
  let bad=0,alt=false,cs=false;
  GT.inputs.forEach((inp,i)=>{
    const a=GT.cl.gaps[i].a;
    const r=evalGap(inp.value,a);
    inp.classList.remove('ok','bad','shown');
    if(r==='ok'||r==='alt'){inp.classList.add('ok');if(r==='alt'){alt=true;inp.value=a;}}
    else{inp.classList.add('bad');bad++;if(r==='case')cs=true;}
  });
  if(bad===0){
    GT.inputs.forEach(i=>i.disabled=true);
    GT.state='solved';
    if(GT.mode==='prog'){if(GT.level===3)GT.done.add(GT.id);}
    else{GT.ex++;if(GT.attempts===1&&!GT.hinted)GT.first++;}
    GT.fb={cls:'ok',m:'fbOk',s:alt?'fbUml':null};gt2Fb();
    gt2Buttons();gt2Stat(false);gt2FocusPrimary();
    if($('auto2').checked)speak(sentence(GT.item));
  }else{
    GT.fb={cls:'bad',m:'fbBad',s:cs?'fbCase':null};gt2Fb();
    const f=GT.inputs.find(i=>i.classList.contains('bad'));if(f)f.focus();
  }
}
function gt2Hint(){
  if(GT.state!=='edit')return;
  const idx=GT.inputs.findIndex((inp,i)=>!inp.classList.contains('ok')&&!inp.classList.contains('shown')&&evalGap(inp.value,GT.cl.gaps[i].a)!=='ok');
  if(idx<0)return;
  const inp=GT.inputs[idx];
  inp.value=GT.cl.gaps[idx].a;inp.classList.remove('bad');inp.classList.add('shown');
  GT.hinted=true;inp.focus();
}
function gt2Reveal(){
  if(GT.state!=='edit')return;
  GT.inputs.forEach((inp,i)=>{
    if(!inp.classList.contains('ok')){inp.value=GT.cl.gaps[i].a;inp.classList.remove('bad');inp.classList.add('shown');}
    inp.disabled=true;
  });
  GT.state='revealed';
  if(GT.mode==='rand')GT.ex++;
  GT.fb={cls:'bad',m:GT.mode==='prog'?'fbRevP':'fbRevR',s:null};gt2Fb();
  gt2Buttons();gt2Stat(false);gt2FocusPrimary();
}
function gt2Fb(){
  const fb=$('fb');fb.textContent='';
  if(!GT.fb){fb.className='fb';return;}
  fb.className='fb '+GT.fb.cls;fb.textContent=t(GT.fb.m);
  if(GT.fb.s){const s=document.createElement('small');s.textContent=t(GT.fb.s);fb.appendChild(s);}
}
function gt2Relabel(){
  if(!GT.item)return;
  if($('fin2').hidden===false){gt2Finish();return;}
  $('uk2').textContent=tr(GT.id);
  const lv=$('lvls');lv.textContent='';
  if(GT.mode==='prog'){
    KINDS.forEach((k,i)=>{const s=document.createElement('span');s.className='l'+(i+1<GT.level?' past':'')+(i+1===GT.level?' on':'');s.textContent=(i+1)+' · '+t(KIND_KEY[k]);lv.appendChild(s);});
  }else{const s=document.createElement('span');s.className='l on';s.textContent=t('kindIs')+t(KIND_KEY[GT.kind]);lv.appendChild(s);}
  $('i2').textContent=(GT.mode==='prog'?t('lvlOf',GT.level):'')+t(HELP_KEY[GT.kind]);
  GT.inputs.forEach((inp,i)=>inp.setAttribute('aria-label',t('gap',i+1)));
  gt2Fb();gt2Buttons();gt2Stat($('fin2').hidden===false);
}
function gt2FocusPrimary(){const p=$('b2').querySelector('.primary');if(p)p.focus();}
function gt2Next(){
  if(GT.state==='edit')return;
  if(GT.mode==='prog'){
    if(GT.state==='revealed'){}
    else if(GT.level<3)GT.level++;
    else{GT.pos++;GT.level=1;}
  }
  gt2Load(true);
}
function gt2SetMode(m){
  GT.mode=m;
  $('m-prog').setAttribute('aria-pressed',m==='prog');
  $('m-rand').setAttribute('aria-pressed',m==='rand');
  $('shuf2w').hidden=m!=='prog';$('kindw').hidden=m!=='rand';
  gt2Reset();
}
document.addEventListener('mousedown',e=>{if(e.target.closest&&e.target.closest('#chars button'))e.preventDefault();});
function insertChar(ch){
  const inp=GT.last&&!GT.last.disabled?GT.last:GT.inputs.find(i=>!i.disabled);
  if(!inp)return;
  if(inp.maxLength===1){inp.value=ch;inp.dispatchEvent(new Event('input'));}
  else{
    const s=inp.selectionStart==null?inp.value.length:inp.selectionStart,e=inp.selectionEnd==null?s:inp.selectionEnd;
    inp.value=inp.value.slice(0,s)+ch+inp.value.slice(e);
    inp.classList.remove('ok','bad','shown');
    inp.focus();inp.setSelectionRange(s+1,s+1);
  }
  inp.focus();
}

/* ---------- tabs ---------- */
function showView(n,fromHash){
  VIEW=n;
  if('speechSynthesis' in window)try{speechSynthesis.cancel();}catch(e){}
  $('v1').hidden=n!==1;$('v2').hidden=n!==2;
  $('tab1').setAttribute('aria-selected',n===1);$('tab2').setAttribute('aria-selected',n===2);
  $('o1').hidden=n!==1;$('o2').hidden=n!==2;
  $('st1').hidden=n!==1;$('st2').hidden=n!==2;
  if(n===1)updateStat(S.pos>=S.queue.length);else gt2Stat($('fin2').hidden===false);
  if(!fromHash){try{history.replaceState(null,'','#funktion-'+n);}catch(e){try{location.hash='funktion-'+n;}catch(_){}}}
}
function routeFromHash(){showView(location.hash==='#funktion-2'?2:1,true);}

// setup
(function init(){
  const sel=$('sec');
  const ls=$('lang');
  Object.keys(LANGS).forEach(k=>{const o=document.createElement('option');o.value=k;o.textContent=LANGS[k].n;ls.appendChild(o);});
  let sv=null;try{sv=localStorage.getItem('pt-lang');}catch(e){}
  const q=(location.search.match(/[?&]lang=(\w+)/)||[])[1];
  const start=LANGS[q]?q:(LANGS[sv]?sv:'uk');
  ls.value=start;
  ls.addEventListener('change',()=>{setLang(ls.value);try{localStorage.setItem('pt-lang',ls.value);}catch(e){}});
  sel.addEventListener('change',()=>{setQueue();gt2Reset();});
  $('shuf').addEventListener('change',setQueue);
  $('shuf2').addEventListener('change',gt2Reset);
  $('kind').addEventListener('change',()=>{gt2Reset();});
  $('again').addEventListener('click',setQueue);
  $('again2').addEventListener('click',gt2Reset);
  $('tab1').addEventListener('click',()=>showView(1));
  $('tab2').addEventListener('click',()=>showView(2));
  $('m-prog').addEventListener('click',()=>gt2SetMode('prog'));
  $('m-rand').addEventListener('click',()=>gt2SetMode('rand'));
  ['ä','ö','ü','ß','Ä','Ö','Ü'].forEach(ch=>{
    const b=document.createElement('button');b.type='button';b.textContent=ch;
    b.addEventListener('click',()=>insertChar(ch));$('chars').appendChild(b);
  });
  buildSecOptions();applyStatic(start);
  setQueue();
  gt2Reset();
  window.addEventListener('hashchange',routeFromHash);
  routeFromHash();
})();
</script>
