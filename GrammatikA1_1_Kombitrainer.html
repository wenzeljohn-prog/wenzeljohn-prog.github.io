<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grammatik A1.1 – Kombitrainer</title>
<style>
:root{
  --paper:#fbfcfe; --grid:rgba(70,110,170,.10); --ink:#1d2b4f; --soft:#5a6787; --line:#c9d3e6;
  --hi:#ffe680; --ok:#1e7f4f; --okbg:#e3f4ea; --bad:#c23b2f; --badbg:#fbe6e3; --margin:#e7a9a9;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;line-height:1.45;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}
#app{max-width:820px;margin:0 auto;padding:14px 14px 60px}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;margin:0}
h1{font-size:1.65rem;line-height:1.15}
h2{font-size:1.2rem;margin:22px 0 8px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid #3b6fd8;outline-offset:2px}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px;border-bottom:3px solid var(--ink);padding-bottom:10px;margin-bottom:6px}
.top p{margin:4px 0 0;color:var(--soft);font-size:.92rem}
.tabs{display:flex;gap:6px}
.tab{border:2px solid var(--ink);background:#fff;border-radius:8px;padding:6px 14px;font-weight:600}
.tab.on{background:var(--ink);color:#fff}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:2px solid var(--line);background:#fff;border-radius:8px;min-width:44px;padding:7px 10px;font-weight:600}
.seg button.on{border-color:var(--ink);background:var(--ink);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:2px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:.93rem;display:inline-flex;align-items:center;gap:7px}
.chip .dot{width:10px;height:10px;border-radius:50%;flex:none}
.chip small{color:var(--soft);font-size:.78rem}
.chip.on{border-color:var(--ink);background:#eef3ff}
.chip.off{opacity:.38;cursor:default}
.grp{margin:12px 0 4px;font-weight:700;font-size:.95rem}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0}
.lnk{background:none;border:none;color:#2b5fbf;text-decoration:underline;padding:4px 6px;font-size:.9rem}
.btn{border:2px solid var(--ink);background:var(--ink);color:#fff;border-radius:10px;padding:10px 20px;font-weight:700;font-size:1rem}
.btn.sec{background:#fff;color:var(--ink)}
.btn[disabled]{opacity:.4;cursor:default}
.cnt{color:var(--soft);font-size:.95rem}
.card{background:#fff;border:2px solid var(--ink);border-left:10px solid var(--margin);border-radius:12px;padding:16px 16px 14px;margin:12px 0}
.meta{font-size:.85rem;color:var(--soft);font-weight:600;margin-bottom:2px}
.ti{font-family:Georgia,serif;font-weight:700;font-size:1.1rem;margin-bottom:2px}
.instr{color:var(--soft);font-size:.92rem;margin-bottom:10px}
.sent{font-size:1.16rem;line-height:2.35;white-space:normal}
.gsel{font:inherit;font-size:1.05rem;color:var(--ink);border:none;border-bottom:2px solid var(--ink);background:#fff8d4;border-radius:4px 4px 0 0;padding:3px 2px;max-width:100%}
.gsel.ok,.gin.ok,.gap.ok{background:var(--okbg);border-bottom-color:var(--ok);color:var(--ok);font-weight:700}
.gsel.bad,.gin.bad,.gap.bad{background:var(--badbg);border-bottom-color:var(--bad);color:var(--bad);font-weight:700}
.gin{font:inherit;font-size:1.05rem;color:var(--ink);border:none;border-bottom:2px solid var(--ink);background:#fff8d4;border-radius:4px 4px 0 0;padding:3px 4px;text-align:center}
.ghint{color:var(--soft);font-size:.85rem;margin-left:3px}
.gap{display:inline-block;min-width:74px;text-align:center;border:none;border-bottom:2px solid var(--ink);background:#fff8d4;border-radius:4px 4px 0 0;padding:1px 6px;font-size:1.05rem;min-height:1.8em;vertical-align:baseline}
.gap.act{background:var(--hi);box-shadow:0 0 0 2px var(--ink)}
.fix{color:var(--bad);font-weight:700;font-size:.95rem;margin:0 4px}
.locked{border-bottom:2px dotted var(--soft);padding:0 3px}
.opts,.box,.pool,.ans{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.opt,.wchip{border:2px solid var(--ink);background:#fff;border-radius:8px;padding:7px 13px;font-size:1.02rem}
.opt.sel,.wchip.sel{background:var(--hi)}
.wchip.used{opacity:.25;cursor:default}
.box{padding:10px;border:2px dashed var(--line);border-radius:10px;background:#f6f8fd}
.ans{min-height:52px;border-bottom:2px solid var(--ink);align-items:center;margin-top:6px;padding-bottom:6px}
.ans:empty:before{content:"Hier entsteht dein Satz …";color:var(--soft);font-size:.95rem}
.endp{font-size:1.25rem;font-weight:700;margin-left:2px}
.sline{display:flex;align-items:flex-end;gap:2px}
.sline .ans{flex:1}
.choice{display:block;width:100%;text-align:left;margin:8px 0;border:2px solid var(--line);background:#fff;border-radius:10px;padding:10px 14px;font-size:1.05rem}
.choice.sel{border-color:var(--ink);background:#fff8d4}
.choice.ok{border-color:var(--ok);background:var(--okbg)}
.choice.bad{border-color:var(--bad);background:var(--badbg)}
.fb{margin-top:12px;border-radius:10px;padding:0}
.fb .hd{font-weight:700;padding:8px 12px;border-radius:10px}
.fb.ok .hd{background:var(--okbg);color:var(--ok)}
.fb.bad .hd{background:var(--badbg);color:var(--bad)}
.fb.warn .hd{background:#fff3cd;color:#7a5b00}
.fb .ln{padding:6px 12px 0;font-size:.97rem}
.fb .rule{padding:6px 12px;font-size:.92rem;border-left:4px solid var(--line);margin:8px 0 0 4px;background:#f6f8fd;border-radius:0 8px 8px 0}
.prog{height:10px;background:#e3e9f5;border-radius:6px;overflow:hidden;margin:10px 0 4px}
.prog i{display:block;height:100%;background:var(--ink)}
.pinfo{display:flex;justify-content:space-between;color:var(--soft);font-size:.9rem}
.big{font-family:Georgia,serif;font-size:3rem;font-weight:700;line-height:1}
.tr{display:grid;grid-template-columns:minmax(120px,1.3fr) 2fr auto;gap:10px;align-items:center;margin:8px 0;font-size:.95rem}
.bar{height:14px;background:#e3e9f5;border-radius:7px;overflow:hidden}
.bar i{display:block;height:100%}
details{background:#fff;border:2px solid var(--line);border-radius:10px;margin:8px 0;padding:0}
details[open]{border-color:var(--ink)}
summary{padding:10px 14px;cursor:pointer;font-weight:600;list-style:none;display:flex;gap:8px;align-items:center}
summary::-webkit-details-marker{display:none}
.rb{padding:2px 16px 14px;font-size:.96rem}
.rb ul{margin:6px 0;padding-left:20px}
table.ct{border-collapse:collapse;margin:8px 0;font-size:.93rem;max-width:100%}
table.ct th,table.ct td{border:1px solid var(--line);padding:5px 9px;text-align:left}
table.ct th{background:#eef3ff}
.tw{overflow-x:auto}
.note{color:var(--soft);font-size:.85rem;margin-top:18px}
@media (max-width:520px){.sent{font-size:1.08rem}.tr{grid-template-columns:1fr auto}.tr .bar{grid-column:1/3;order:3}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
'use strict';

/* ================= Themen ================= */
var GROUPS={
  v:{n:'Verben',c:'#2b5fbf'},
  s:{n:'Satzbau',c:'#7a4fbf'},
  n:{n:'Nomen und Artikel',c:'#138d90'},
  p:{n:'Pronomen',c:'#d9822b'},
  z:{n:'Präpositionen',c:'#b0428a'}
};
var PERS=['ich','du','er/sie/es','wir','ihr','sie/Sie'];
function ctab(heads,cols){
  var h='<div class="tw"><table class="ct"><thead><tr><th></th>';
  heads.forEach(function(x){h+='<th>'+x+'</th>';});
  h+='</tr></thead><tbody>';
  for(var i=0;i<6;i++){h+='<tr><th>'+PERS[i]+'</th>';cols.forEach(function(c){h+='<td>'+c[i]+'</td>';});h+='</tr>';}
  return h+'</tbody></table></div>';
}
function rtab(heads,rows){
  var h='<div class="tw"><table class="ct"><thead><tr>';
  heads.forEach(function(x){h+='<th>'+x+'</th>';});
  h+='</tr></thead><tbody>';
  rows.forEach(function(r){h+='<tr>';r.forEach(function(c,i){h+=(i===0?'<th>':'<td>')+c+(i===0?'</th>':'</td>');});h+='</tr>';});
  return h+'</tbody></table></div>';
}
function ul(a){return '<ul><li>'+a.join('</li><li>')+'</li></ul>';}

var TOPICS=[
 {id:'pr',l:1,g:'v',n:'Präsens: regelmäßige Verben',r:'ich -e · du -st · er/sie/es -t · wir -en · ihr -t · sie/Sie -en. Bei Stamm auf -t/-d: e-Erweiterung (du arbeitest, er arbeitet).',
  h:ctab(['kommen','arbeiten','heißen'],[['komme','kommst','kommt','kommen','kommt','kommen'],['arbeite','arbeitest','arbeitet','arbeiten','arbeitet','arbeiten'],['heiße','heißt','heißt','heißen','heißt','heißen']])},
 {id:'sh',l:1,g:'v',n:'sein und haben',r:'sein: ich bin, du bist, er/sie/es ist, wir sind, ihr seid, sie/Sie sind. haben: ich habe, du hast, er/sie/es hat, wir haben, ihr habt, sie/Sie haben.',
  h:ctab(['sein','haben'],[['bin','bist','ist','sind','seid','sind'],['habe','hast','hat','haben','habt','haben']])},
 {id:'un',l:5,g:'v',n:'unregelmäßige Verben',r:'Bei du und er/sie/es ändert sich der Vokal: sprechen → du sprichst, er spricht · essen → isst · lesen → liest · sehen → siehst, sieht · fahren → fährst, fährt · schlafen → schläfst, schläft · nehmen → nimmst, nimmt. Bei ich, wir, ihr, sie/Sie bleibt der Vokal.',
  h:rtab(['Infinitiv','ich','du','er/sie/es'],[['sprechen','spreche','sprichst','spricht'],['essen','esse','isst','isst'],['lesen','lese','liest','liest'],['sehen','sehe','siehst','sieht'],['fahren','fahre','fährst','fährt'],['schlafen','schlafe','schläfst','schläft'],['nehmen','nehme','nimmst','nimmt'],['treffen','treffe','triffst','trifft'],['helfen','helfe','hilfst','hilft'],['laufen','laufe','läufst','läuft']])},
 {id:'tr',l:6,g:'v',n:'trennbare Verben',r:'Das Präfix steht am Satzende: Ich stehe um 6 Uhr auf. Mit Modalverb bleibt das Verb zusammen: Ich muss früh aufstehen. Betont wird das Präfix: AUFstehen.',
  h:rtab(['Infinitiv','Satz'],[['aufstehen','Ich stehe um 6 Uhr auf.'],['anfangen','Der Kurs fängt um 9 Uhr an.'],['einkaufen','Wir kaufen heute ein.'],['anrufen','Ich rufe dich an.'],['ausmachen','Machst du das Licht aus?'],['mitbringen','Kannst du Kuchen mitbringen?']])},
 {id:'mo',l:7,g:'v',n:'möchte / mögen',r:'möchte: ich möchte, du möchtest, er/sie/es möchte, wir möchten, ihr möchtet, sie/Sie möchten. mögen: ich mag, du magst, er mag, wir mögen. Das zweite Verb steht als Infinitiv am Ende: Ich möchte einen Kaffee trinken.',
  h:ctab(['möchte','mögen'],[['möchte','möchtest','möchte','möchten','möchtet','möchten'],['mag','magst','mag','mögen','mögt','mögen']])},
 {id:'kn',l:8,g:'v',n:'Modalverb können',r:'ich kann, du kannst, er/sie/es kann, wir können, ihr könnt, sie/Sie können. Das zweite Verb steht als Infinitiv am Ende: Ich kann gut schwimmen.',
  h:ctab(['können'],[['kann','kannst','kann','können','könnt','können']])},
 {id:'mu',l:9,g:'v',n:'Modalverb müssen',r:'ich muss, du musst, er/sie/es muss, wir müssen, ihr müsst, sie/Sie müssen. Das zweite Verb steht als Infinitiv am Ende: Ich muss heute arbeiten.',
  h:ctab(['müssen'],[['muss','musst','muss','müssen','müsst','müssen']])},
 {id:'du',l:10,g:'v',n:'Modalverb dürfen',r:'ich darf, du darfst, er/sie/es darf, wir dürfen, ihr dürft, sie/Sie dürfen. „nicht dürfen“ = Verbot: Hier darf man nicht rauchen.',
  h:ctab(['dürfen'],[['darf','darfst','darf','dürfen','dürft','dürfen']])},
 {id:'sa',l:1,g:'s',n:'Verbposition: Aussage und W-Frage',r:'In Aussagesätzen und W-Fragen steht das konjugierte Verb auf Position 2: Ich komme aus Polen. Woher kommst du?',
  h:ul(['Ich <b>komme</b> aus Polen.','Woher <b>kommst</b> du?','Wie <b>heißen</b> Sie?'])},
 {id:'jn',l:5,g:'s',n:'Ja-/Nein-Fragen',r:'In Ja-/Nein-Fragen steht das Verb auf Position 1: Kommst du aus Polen? – Ja./Nein.',
  h:ul(['<b>Sprichst</b> du Deutsch?','<b>Möchten</b> Sie einen Kaffee?','<b>Kannst</b> du mich anrufen?'])},
 {id:'p1',l:10,g:'s',n:'Position 1 im Satz',r:'Auf Position 1 kann auch eine Zeit- oder Ortsangabe stehen. Das Verb bleibt auf Position 2, das Subjekt steht danach: Heute arbeite ich. / Ich arbeite heute.',
  h:ul(['Ich <b>fahre</b> morgen mit dem Zug.','Morgen <b>fahre</b> ich mit dem Zug.','Mit dem Zug <b>fahre</b> ich morgen.'])},
 {id:'ar',l:3,g:'n',n:'Artikel: der / die / das',r:'Nomen haben einen Artikel: der (maskulin), das (neutral), die (feminin), die (Plural). unbestimmt: ein / ein / eine. Lerne jedes Nomen mit Artikel.',
  h:rtab(['','maskulin','neutral','feminin','Plural'],[['bestimmt','der Tisch','das Bett','die Lampe','die Tische'],['unbestimmt','ein Tisch','ein Bett','eine Lampe','–'],['Negation','kein Tisch','kein Bett','keine Lampe','keine Tische']])},
 {id:'nu',l:7,g:'n',n:'Nullartikel',r:'Kein Artikel bei Plural (unbestimmt) und bei allgemeinen Aussagen: Ich esse gern Äpfel. Ich habe Hunger. Ich habe Durst.',
  h:ul(['Ich esse <b>Äpfel</b>. (nicht: eine Äpfel)','Wir haben <b>Hunger</b>. (nicht: einen Hunger)','Er trinkt gern <b>Tee</b>.'])},
 {id:'pl',l:4,g:'n',n:'Plural',r:'Plural-Endungen: -e (Tag → Tage), -e + Umlaut (Stuhl → Stühle), -n/-en (Frau → Frauen), -er (Kind → Kinder), -s (Auto → Autos), keine Endung (Lehrer → Lehrer). Artikel im Plural: immer „die“.',
  h:rtab(['Endung','Beispiel'],[['-e','der Tag → die Tage'],['-e + Umlaut','der Stuhl → die Stühle'],['-n / -en','die Frau → die Frauen · die Tasche → die Taschen'],['-er (+ Umlaut)','das Kind → die Kinder · der Mann → die Männer'],['-s','das Auto → die Autos'],['keine / nur Umlaut','der Lehrer → die Lehrer · der Bruder → die Brüder']])},
 {id:'ak',l:4,g:'n',n:'Akkusativ (Nomen und Artikel)',r:'Im Akkusativ ändert sich nur der maskuline Artikel: der → den, ein → einen, kein → keinen, mein → meinen. Neutrum, Femininum und Plural bleiben gleich. Akkusativ steht z. B. nach haben, brauchen, kaufen, sehen.',
  h:rtab(['Nominativ','Akkusativ'],[['der Hund / ein Hund','Ich sehe den Hund. / Ich habe einen Hund.'],['das Kind / ein Kind','Ich sehe das Kind. / Ich habe ein Kind.'],['die Lampe / eine Lampe','Ich sehe die Lampe. / Ich habe eine Lampe.'],['die Kinder','Ich sehe die Kinder.']])},
 {id:'da',l:10,g:'n',n:'Dativ (Nomen und Artikel)',r:'Nach mit, bei, zu und in (Wo?) steht der Dativ: maskulin/neutral dem (einem), feminin der (einer), Plural den + -n. Kurzformen: zu dem = zum, zu der = zur, in dem = im, bei dem = beim.',
  h:rtab(['Nominativ','Dativ'],[['der Bus','mit dem Bus'],['das Auto','mit dem Auto'],['die Straßenbahn','mit der Straßenbahn'],['die Kinder','mit den Kindern'],['der Arzt','Ich gehe zum Arzt.'],['die Ärztin','Ich gehe zur Ärztin.']])},
 {id:'ko',l:8,g:'n',n:'Komposita',r:'Nomen + Nomen = ein Wort. Das letzte Wort (Grundwort) bestimmt den Artikel: der Kaffee + die Tasse = die Kaffeetasse. Der Wortakzent liegt auf dem ersten Teil: KAFfeetasse.',
  h:ul(['der Apfel + der Saft = <b>der</b> Apfelsaft','das Telefon + die Nummer = <b>die</b> Telefonnummer','die Hand + die Tasche = <b>die</b> Handtasche','der Bus + der Fahrer = <b>der</b> Busfahrer'])},
 {id:'in',l:2,g:'n',n:'Berufe: weibliche Form auf -in',r:'Weibliche Berufsbezeichnung: Nomen + -in. Manche Nomen bekommen einen Umlaut: der Arzt → die Ärztin, der Koch → die Köchin. Plural: Lehrerinnen.',
  h:rtab(['männlich','weiblich'],[['der Lehrer','die Lehrerin'],['der Verkäufer','die Verkäuferin'],['der Student','die Studentin'],['der Arzt','die Ärztin'],['der Koch','die Köchin']])},
 {id:'p3',l:3,g:'p',n:'Personalpronomen er / sie / es',r:'er = der-Nomen, sie = die-Nomen, es = das-Nomen, sie = Plural. Der Tisch → er. Die Lampe → sie. Das Bett → es. Die Bücher → sie.',
  h:ul(['Das ist <b>der</b> Stuhl. <b>Er</b> ist neu.','Das ist <b>die</b> Lampe. <b>Sie</b> ist alt.','Das ist <b>das</b> Bett. <b>Es</b> ist groß.','Das sind <b>die</b> Bücher. <b>Sie</b> sind teuer.'])},
 {id:'ps',l:4,g:'p',n:'Possessivartikel',r:'mein, dein, sein (er), ihr (sie) stehen wie „ein“: maskulin/neutral mein, feminin/Plural meine. Akkusativ maskulin: meinen. Beispiel: Das ist meine Mutter. Ich sehe meinen Vater.',
  h:rtab(['Person','der / das','die / Plural'],[['ich','mein','meine'],['du','dein','deine'],['er / es','sein','seine'],['sie','ihr','ihre']])+'<p>Akkusativ maskulin: mein<b>en</b>, dein<b>en</b>, sein<b>en</b>, ihr<b>en</b>.</p>'},
 {id:'pa',l:9,g:'p',n:'Personalpronomen im Akkusativ',r:'mich, dich, ihn, sie, es, uns, euch, sie, Sie. Ich kenne ihn. Er ruft mich an. Nur „er“ ändert sich zu „ihn“ – wie der → den.',
  h:rtab(['Nominativ','Akkusativ'],[['ich','mich'],['du','dich'],['er','ihn'],['sie','sie'],['es','es'],['wir','uns'],['ihr','euch'],['sie / Sie','sie / Sie']])},
 {id:'av',l:1,g:'z',n:'aus, von',r:'aus + Land/Stadt (Herkunft): Ich komme aus Polen. von + Person (Zugehörigkeit): Das ist die Tasche von Anna. Der Sohn von Tom.',
  h:ul(['Ich komme <b>aus</b> Syrien.','Das ist die Tasche <b>von</b> Anna.','Er ist der Bruder <b>von</b> Tom.'])},
 {id:'ze',l:5,g:'z',n:'Zeit: am, um, von … bis, ab, bis, zwischen',r:'am + Tag/Tageszeit (am Montag, am Abend) · um + Uhrzeit (um 8 Uhr) · von … bis … (von 8 bis 12 Uhr) · ab + Beginn (ab 9 Uhr) · bis + Ende (bis 17 Uhr) · zwischen … und … (zwischen 8 und 10 Uhr).',
  h:rtab(['Präposition','Bedeutung','Beispiel'],[['am','Tag, Tageszeit','am Montag, am Abend'],['um','Uhrzeit','um 8 Uhr'],['von … bis','Zeitraum','von 8 bis 12 Uhr'],['ab','Beginn','ab 9 Uhr'],['bis','Ende','bis 17 Uhr'],['zwischen … und','Zeitraum','zwischen 8 und 10 Uhr']])},
 {id:'mi',l:7,g:'z',n:'mit, ohne',r:'mit = zusammen/dabei, ohne = nicht dabei: Kaffee mit Milch, Tee ohne Zucker. Mit Artikel: mit + Dativ (mit dem Bus), ohne + Akkusativ (ohne den Zucker).',
  h:ul(['Ich trinke Kaffee <b>mit</b> Milch.','Ich trinke Tee <b>ohne</b> Zucker.','Ich fahre <b>mit</b> dem Bus.'])}
];
var TM={};TOPICS.forEach(function(t){TM[t.id]=t;});

/* ================= Aufgaben-Helfer ================= */
function S(t,a,d,w){return {k:'s',t:t,a:a,o:[a].concat(d),w:w};}
function I(t,a,h){return {k:'i',t:t,a:(a instanceof Array)?a:[a],h:h};}
function B(t,a){return {k:'b',t:t,a:a};}
function T(lv,ti,p){return {f:'text',lv:lv,ti:ti,p:p};}
function W(lv,ti,p,extra){return {f:'bank',lv:lv,ti:ti,p:p,extra:extra};}
function Y(lv,ti,p){return {f:'type',lv:lv,ti:ti,p:p};}
function M(lv,t,b,a,d,af){return {f:'mc',lv:lv,p:[b,S(t,a,d),af]};}
function O(lv,tp,s,p,alts){return {f:'order',lv:lv,tp:tp,a:s.split(' '),p:p,alt:(alts||[]).map(function(x){return x.split(' ');})};}
function C(lv,t,opts,w){return {f:'choice',lv:lv,tp:[t],o:opts,w:w};}

var EX=[];

/* ---------- Lückentexte (Sprachbausteine) ---------- */
EX.push(
T(1,'Dialog: Kennenlernen',[
 'Guten Tag, ich ',S('sh','bin',['ist','bist']),' Tom Braun. Wie ',S('pr','heißen',['heißt','heiße']),' Sie?\n– Ich ',S('pr','heiße',['heißt','heißen']),
 ' Olga Petrowa.\n– Woher ',S('sa','kommen Sie',['Sie kommen','kommt Sie']),'?\n– Ich ',S('pr','komme',['kommst','kommt']),' ',S('av','aus',['von','in']),' Russland. Und Sie?']),

/* ================= Hilfsfunktionen ================= */
function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined&&txt!==null)e.textContent=txt;return e;}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function norm(s){return String(s).toLowerCase().replace(/\s+/g,' ').replace(/^\s+|\s+$/g,'').replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss');}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1);}
function sentence(tokens,p){return cap(tokens.join(' '))+p;}
function clear(n){while(n.firstChild)n.removeChild(n.firstChild);}
function addText(root,str){
  var lines=str.split('\n');
  lines.forEach(function(l,i){if(i>0)root.appendChild(document.createElement('br'));if(l)root.appendChild(document.createTextNode(l));});
}

var SS=null;
function setLevel(n){st.level=n;st.topics={};TOPICS.forEach(function(t){if(t.l<=n)st.topics[t.id]=true;});}
setLevel(10);FORMATS.forEach(function(f){st.formats[f[0]]=true;});

function pool(){
  return EX.filter(function(ex){
    if(ex.lv>st.level)return false;
    if(!st.formats[ex.f])return false;
    return ex.topics.some(function(t){return st.topics[t];});
  });
}

/* ================= Session ================= */
function startSession(topicsOverride){
  var list=pool();
  list=shuffle(list);
  if(st.count<list.length)list=list.slice(0,st.count);
  SS={queue:list.map(function(ex){return {ex:ex,retry:false};}),i:0,tally:{},gapsN:0,gapsOk:0};
  st.view='session';
  render();
}

function tallyAdd(t,ok){
  var x=SS.tally[t]||(SS.tally[t]={n:0,c:0});
  x.n++;if(ok)x.c++;
  SS.gapsN++;if(ok)SS.gapsOk++;
}

function renderSession(){
  var q=SS.queue[SS.i];
  if(!q){renderResult();return;}
  var ex=q.ex;
  clear(app);
  var top=el('div','row');top.style.justifyContent='space-between';
  top.appendChild(el('strong',null,'Grammatik A1.1'));
  var ab=el('button','lnk','Abbrechen');ab.onclick=function(){if(SS.i>0){renderResult();}else{st.view='home';render();}};
  top.appendChild(ab);app.appendChild(top);
  var pr=el('div','prog');var bar=el('i');bar.style.width=Math.round(SS.i/SS.queue.length*100)+'%';pr.appendChild(bar);app.appendChild(pr);
  var pi=el('div','pinfo');pi.appendChild(el('span',null,'Aufgabe '+(SS.i+1)+' von '+SS.queue.length));app.appendChild(pi);

  var card=el('div','card');
  card.appendChild(el('div','meta',FNAME[ex.f]+(q.retry?' · Wiederholung':'')));
  if(ex.ti)card.appendChild(el('div','ti',ex.ti));
  card.appendChild(el('div','instr',INSTR[ex.f]));
  var rt=(ex.f==='order')?buildOrder(ex):(ex.f==='choice')?buildChoice(ex):buildGaps(ex);
  card.appendChild(rt.node);
  var fb=el('div','fb');fb.setAttribute('aria-live','polite');card.appendChild(fb);
  var row=el('div','row');row.style.marginTop='14px';
  var btn=el('button','btn','Prüfen');
  row.appendChild(btn);
  if(rt.reset){var rs=el('button','btn sec','Zurücksetzen');rs.onclick=function(){if(!checked)rt.reset();};row.appendChild(rs);}
  card.appendChild(row);
  app.appendChild(card);
  var checked=false;
  function doCheck(){
    if(checked){SS.i++;render();window.scrollTo(0,0);return;}
    var r=rt.check();
    if(r===null){fb.className='fb warn';clear(fb);fb.appendChild(el('div','hd',rt.warn||'Bitte erst alle Lücken ausfüllen.'));return;}
    checked=true;
    if(!q.retry){r.items.forEach(function(it){tallyAdd(it.t,it.ok);});}
    clear(fb);fb.className='fb '+(r.ok?'ok':'bad');
    fb.appendChild(el('div','hd',r.ok?'Richtig!':'Noch nicht ganz.'));
    (r.lines||[]).forEach(function(l){fb.appendChild(el('div','ln',l));});
    if(!r.ok){
      var seen={};
      r.items.forEach(function(it){
        if(it.ok||seen[it.t])return;seen[it.t]=true;
        var d=el('div','rule');var b=el('strong',null,TM[it.t].n+': ');d.appendChild(b);d.appendChild(document.createTextNode(it.w||TM[it.t].r));fb.appendChild(d);
      });
      if(!q.retry){
        var pos=Math.min(SS.i+4,SS.queue.length);
        SS.queue.splice(pos,0,{ex:ex,retry:true});
      }
    }
    btn.textContent=(SS.i===SS.queue.length-1)?'Ergebnis':'Weiter';
    btn.focus();
  }
  btn.onclick=doCheck;
}

/* ----- Lücken-Aufgaben (Lückentext, Wortbank, Tippen, Blitzfrage) ----- */
function buildGaps(ex){
  var root=el('div','sent');
  var wrap=el('div');wrap.appendChild(root);
  var gaps=[];
  var mode=ex.f;
  var chips=[],active=null,boxEl=null,optsEl=null;

  ex.p.forEach(function(part){
    if(typeof part==='string'){addText(root,part);return;}
    var g=part;
    var gs={g:g,val:'',node:null,chip:null,locked:false};
    if(!st.topics[g.t]){
      gs.locked=true;
      var lk=el('span','locked',g.k==='i'?g.a[0]:g.a);root.appendChild(lk);gaps.push(gs);return;
    }
    if(mode==='text'){
      var sel=el('select','gsel');
      var o0=el('option',null,'…');o0.value='';sel.appendChild(o0);
      shuffle(g.o).forEach(function(o){var op=el('option',null,o);op.value=o;sel.appendChild(op);});
      sel.setAttribute('aria-label','Lücke');
      root.appendChild(sel);gs.node=sel;gs.get=function(){return sel.value;};
    }else if(mode==='mc'){
      var blank=el('span','gap','\u00a0');
      root.appendChild(blank);gs.node=blank;
      gs.get=function(){return gs.val;};
      optsEl=el('div','opts');
      shuffle(g.o).forEach(function(o){
        var b=el('button','opt',o);
        b.onclick=function(){if(gs.done)return;gs.val=o;blank.textContent=o;
          Array.prototype.forEach.call(optsEl.childNodes,function(x){x.classList.remove('sel');});b.classList.add('sel');};
        optsEl.appendChild(b);
      });
    }else if(mode==='type'){
      var inp=el('input','gin');inp.type='text';
      inp.setAttribute('autocomplete','off');inp.setAttribute('autocapitalize','none');inp.setAttribute('autocorrect','off');inp.setAttribute('spellcheck','false');
      inp.setAttribute('aria-label','Lücke');
      var len=0;g.a.forEach(function(a){if(a.length>len)len=a.length;});
      inp.size=Math.max(4,len+1);
      root.appendChild(inp);
      if(g.h)root.appendChild(el('span','ghint','('+g.h+')'));
      gs.node=inp;gs.get=function(){return inp.value;};
    }else if(mode==='bank'){
      var gb=el('button','gap','\u00a0');gb.type='button';gb.setAttribute('aria-label','Lücke');
      gb.onclick=function(){
        if(gs.done)return;
        if(gs.chip){gs.chip.used=false;gs.chip.node.classList.remove('used');gs.chip=null;gs.val='';gb.textContent='\u00a0';}
        active=gs;refreshActive();
      };
      root.appendChild(gb);gs.node=gb;gs.get=function(){return gs.val;};
    }
    gaps.push(gs);
  });

  function refreshActive(){gaps.forEach(function(x){if(x.node&&mode==='bank')x.node.classList.toggle('act',x===active);});}
  function firstEmpty(){for(var i=0;i<gaps.length;i++){if(!gaps[i].locked&&!gaps[i].val)return gaps[i];}return null;}

  if(mode==='bank'){
    var words=[];
    gaps.forEach(function(x){if(!x.locked)words.push(x.g.a);});
    (ex.extra||[]).forEach(function(w){words.push(w);});
    boxEl=el('div','box');
    shuffle(words).forEach(function(w){
      var c={w:w,used:false};
      var b=el('button','wchip',w);b.type='button';c.node=b;
      b.onclick=function(){
        if(c.used)return;
        var t=(active&&!active.val&&!active.done)?active:firstEmpty();
        if(!t)return;
        t.chip=c;t.val=w;c.used=true;b.classList.add('used');t.node.textContent=w;active=null;refreshActive();
      };
      chips.push(c);boxEl.appendChild(b);
    });
    wrap.appendChild(boxEl);
  }
  if(mode==='mc'&&optsEl)wrap.appendChild(optsEl);
  if(mode==='type'){
    var ins=[];gaps.forEach(function(x){if(x.node&&!x.locked)ins.push(x);});
    ins.forEach(function(x,i){
      x.node.addEventListener('keydown',function(e){
        if(e.key==='Enter'||e.keyCode===13){
          e.preventDefault();
          if(i<ins.length-1){ins[i+1].node.focus();}
          else{var b=document.querySelector('.card .btn');if(b)b.click();}
        }
      });
    });
  }

  return {
    node:wrap,
    warn:'Bitte erst alle Lücken ausfüllen.',
    check:function(){
      var open=gaps.filter(function(x){return !x.locked;});
      for(var i=0;i<open.length;i++){if(!open[i].get()||!String(open[i].get()).replace(/\s+/g,''))return null;}
      var items=[],all=true;
      open.forEach(function(x){
        var v=x.get(),ok;
        if(x.g.k==='i'){ok=x.g.a.some(function(a){return norm(a)===norm(v);});}
        else{ok=(v===x.g.a);}
        x.done=true;
        if(x.node){
          x.node.classList.remove('act');
          x.node.classList.add(ok?'ok':'bad');
          if(x.node.tagName==='SELECT'||x.node.tagName==='INPUT'){x.node.disabled=true;}
          if(!ok){
            var fx=el('span','fix','→ '+(x.g.k==='i'?x.g.a[0]:x.g.a));
            if(x.node.nextSibling&&x.node.nextSibling.className==='ghint'){x.node.parentNode.insertBefore(fx,x.node.nextSibling.nextSibling);}
            else{x.node.parentNode.insertBefore(fx,x.node.nextSibling);}
          }
        }
        if(!ok)all=false;
        items.push({t:x.g.t,ok:ok,w:x.g.w});
      });
      if(mode==='mc'&&optsEl){Array.prototype.forEach.call(optsEl.childNodes,function(b){b.disabled=true;});}
      if(mode==='bank'){chips.forEach(function(c){c.node.disabled=true;});}
      return {ok:all,items:items};
    },
    reset:null
  };
}

/* ----- Satzbau ----- */
function buildOrder(ex){
  var n=ex.a.length;
  var wrap=el('div');
  var line=el('div','sline');
  var ans=el('div','ans');
  line.appendChild(ans);line.appendChild(el('span','endp',ex.p));
  wrap.appendChild(line);
  var pl=el('div','pool');wrap.appendChild(pl);
  var chosen=[],chips=[];
  var order;
  var tries=0;
  do{order=shuffle(ex.a.map(function(_,i){return i;}));tries++;}
  while(tries<20&&order.every(function(v,i){return ex.a[v]===ex.a[i];}));
  function redraw(){
    clear(ans);
    chosen.forEach(function(c,i){
      var b=el('button','wchip',c.w);b.type='button';
      b.onclick=function(){if(done)return;chosen.splice(i,1);c.used=false;redraw();};
      ans.appendChild(b);
    });
    chips.forEach(function(c){c.node.classList.toggle('used',c.used);});
  }
  var done=false;
  order.forEach(function(idx){
    var c={w:ex.a[idx],used:false};
    var b=el('button','wchip',c.w);b.type='button';c.node=b;
    b.onclick=function(){if(done||c.used)return;c.used=true;chosen.push(c);redraw();};
    chips.push(c);pl.appendChild(b);
  });
  return {
    node:wrap,
    warn:'Bitte erst alle Wörter setzen.',
    reset:function(){chosen=[];chips.forEach(function(c){c.used=false;});redraw();},
    check:function(){
      if(chosen.length<n)return null;
      done=true;
      var got=chosen.map(function(c){return c.w;});
      function eq(a){return a.length===got.length&&a.every(function(x,i){return x===got[i];});}
      var ok=eq(ex.a)||ex.alt.some(eq);
      Array.prototype.forEach.call(ans.childNodes,function(b){b.classList.add(ok?'sel':'sel');b.disabled=true;});
      chips.forEach(function(c){c.node.disabled=true;});
      var lines=[];
      if(ok){
        lines.push(sentence(got,ex.p));
        var others=[ex.a].concat(ex.alt).filter(function(a){return a.join(' ')!==got.join(' ');});
        if(others.length)lines.push('Auch möglich: '+others.map(function(a){return sentence(a,ex.p);}).join('  ·  '));
      }else{
        lines.push('Deine Lösung: '+sentence(got,ex.p));
        lines.push('Richtig: '+sentence(ex.a,ex.p)+(ex.alt.length?'  ·  auch möglich: '+ex.alt.map(function(a){return sentence(a,ex.p);}).join('  ·  '):''));
      }
      return {ok:ok,items:ex.tp.map(function(t){return {t:t,ok:ok};}),lines:lines};
    }
  };
}

/* ----- Satzwahl ----- */
function buildChoice(ex){
  var wrap=el('div');
  var sel=null,btns=[],done=false;
  shuffle(ex.o).forEach(function(o){
    var b=el('button','choice',o);b.type='button';
    b.onclick=function(){if(done)return;sel=o;btns.forEach(function(x){x.classList.remove('sel');});b.classList.add('sel');};
    btns.push(b);wrap.appendChild(b);
  });
  return {
    node:wrap,
    warn:'Bitte erst einen Satz wählen.',
    check:function(){
      if(!sel)return null;
      done=true;
      var ok=sel===ex.o[0];
      btns.forEach(function(b){
        b.disabled=true;b.classList.remove('sel');
        if(b.textContent===ex.o[0])b.classList.add('ok');
        else if(b.textContent===sel)b.classList.add('bad');
      });
      return {ok:ok,items:[{t:ex.tp[0],ok:ok,w:ok?null:ex.w}],lines:ex.w?[ex.w]:[]};
    }
  };
}

/* ================= Ergebnis ================= */
function renderResult(){
  clear(app);app.appendChild(header());
  var pct=SS.gapsN?Math.round(SS.gapsOk/SS.gapsN*100):0;
  var card=el('div','card');
  card.appendChild(el('div','meta','Ergebnis'));
  card.appendChild(el('div','big',pct+' %'));
  card.appendChild(el('p',null,SS.gapsOk+' von '+SS.gapsN+' Antworten richtig (nur erste Versuche gezählt).'));
  app.appendChild(card);
  var ids=Object.keys(SS.tally);
  ids.sort(function(a,b){return SS.tally[a].c/SS.tally[a].n-SS.tally[b].c/SS.tally[b].n;});
  var weak=[];
  if(ids.length){
    app.appendChild(el('h2',null,'Nach Themen'));
    ids.forEach(function(id){
      var x=SS.tally[id],r=x.c/x.n;
      if(r<0.8)weak.push(id);
      var row=el('div','tr');
      row.appendChild(el('span',null,TM[id].n));
      var bar=el('div','bar');var i=el('i');i.style.width=Math.round(r*100)+'%';i.style.background=r>=0.8?'#1e7f4f':(r>=0.5?'#d9a42b':'#c23b2f');bar.appendChild(i);row.appendChild(bar);
      row.appendChild(el('span',null,x.c+'/'+x.n));
      app.appendChild(row);
    });
  }
  var row=el('div','row');row.style.marginTop='20px';
  if(weak.length){
    var bw=el('button','btn','Schwächen üben ('+weak.length+' '+(weak.length===1?'Thema':'Themen')+')');
    bw.onclick=function(){
      st.topics={};weak.forEach(function(t){st.topics[t]=true;});
      FORMATS.forEach(function(f){st.formats[f[0]]=true;});
      if(st.count<20)st.count=20;
      startSession();
    };
    row.appendChild(bw);
  }
  var again=el('button','btn sec','Nochmal mit gleicher Auswahl');again.onclick=function(){startSession();};
  var home=el('button','btn sec','Neue Auswahl');home.onclick=function(){st.view='home';render();};
  row.appendChild(again);row.appendChild(home);
  app.appendChild(row);
  if(!weak.length&&ids.length)app.appendChild(el('p','note','Alle Themen über 80 % – sehr gut! Mit einer höheren Lektion geht es weiter.'));
  if(weak.length)app.appendChild(el('p','note','Tipp: Die Regeln zu den schwachen Themen stehen im Reiter „Regeln“.'));
}

function render(){
  if(st.view==='home')renderHome();
  else if(st.view==='rules')renderRules();
  else if(st.view==='session')renderSession();
  window.scrollTo(0,0);
}
window.__GT={getSS:function(){return SS;},EX:EX,TM:TM,TOPICS:TOPICS,st:st,render:render,startSession:startSession,pool:pool};
render();
})();
</script>
