<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>W-Fragen-Trainer A1</title>
<style>
  :root {
    --bg:#f4f6fa; --card:#fff; --text:#1d2433; --muted:#5b667a; --line:#d5dbe6;
    --accent:#2b5fd9; --accent-text:#fff; --chip:#e9eef8;
    --der:#1f5fbf; --der-bg:#e3ecfb; --die:#b3303f; --die-bg:#fbe4e7; --das:#1f7a4d; --das-bg:#e0f3e8;
    --ok:#1f7a4d; --ok-bg:#e0f3e8; --bad:#b3303f; --bad-bg:#fbe4e7; --warn-bg:#fff4d6;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#12161f; --card:#1b2130; --text:#e8ecf5; --muted:#9aa5ba; --line:#30394d;
      --accent:#6b97ff; --accent-text:#0b1226; --chip:#252d40;
      --der:#7fb0ff; --der-bg:#1b2c4a; --die:#ff8a98; --die-bg:#42202a; --das:#6fd6a2; --das-bg:#183427;
      --ok:#6fd6a2; --ok-bg:#183427; --bad:#ff8a98; --bad-bg:#42202a; --warn-bg:#3a3118;
    }
  }
  * { box-sizing:border-box; }
  html,body { margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; line-height:1.45; min-height:100vh; }
  .wrap { max-width:900px; margin:0 auto; padding:14px; }
  h1 { font-size:1.2rem; margin:2px 0 10px; }
  .tabs { display:flex; gap:6px; margin-bottom:12px; }
  .tab { flex:1; min-height:48px; border-radius:12px; border:2px solid var(--line); background:var(--card); color:var(--text); font-size:1rem; cursor:pointer; font-weight:600; }
  .tab.on { border-color:var(--accent); background:var(--chip); }
  .panel { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin-bottom:12px; }
  .panel h2 { font-size:.78rem; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:0 0 8px; }
  .row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .chip { display:inline-flex; align-items:center; gap:6px; min-height:44px; padding:6px 14px; border-radius:999px; background:var(--chip); border:2px solid transparent; cursor:pointer; user-select:none; font-size:.95rem; }
  .chip input { position:absolute; opacity:0; pointer-events:none; }
  .chip.on { border-color:var(--accent); font-weight:700; }
  .chip:focus-within { outline:3px solid var(--accent); outline-offset:2px; }
  .chip small { color:var(--muted); font-weight:400; }
  .small { color:var(--muted); font-size:.86rem; margin-top:6px; }
  .linkbtn { background:none; border:none; color:var(--accent); cursor:pointer; font-size:.92rem; padding:6px 4px; min-height:44px; }
  select, input[type=search] { min-height:44px; border-radius:10px; border:2px solid var(--line); background:var(--card); color:var(--text); font-size:1rem; padding:6px 10px; }
  label.opt { display:flex; align-items:center; gap:8px; min-height:44px; }
  button.main { width:100%; min-height:56px; border-radius:14px; border:none; cursor:pointer; font-size:1.15rem; font-weight:700; background:var(--accent); color:var(--accent-text); }
  button.main:disabled { opacity:.4; cursor:default; }
  button.sec { min-height:48px; padding:0 18px; border-radius:12px; cursor:pointer; font-size:1rem; background:var(--card); color:var(--text); border:2px solid var(--line); }
  button:focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
  .bar { height:10px; background:var(--chip); border-radius:999px; overflow:hidden; }
  .bar > i { display:block; height:100%; background:var(--accent); }
  .top { display:flex; justify-content:space-between; font-size:.9rem; color:var(--muted); margin-bottom:6px; }
  .qcard { text-align:center; padding:22px 10px 12px; }
  .qlesson { font-size:.8rem; color:var(--muted); }
  .qword { font-size:clamp(2rem,9vw,3.4rem); font-weight:800; margin:10px 0 4px; word-wrap:break-word; overflow-wrap:anywhere; }
  .qmean { font-size:1.15rem; color:var(--muted); min-height:1.6em; }
  .art { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin:14px 0 8px; }
  .art button { min-height:72px; border-radius:14px; border:3px solid var(--line); background:var(--card); color:var(--text); font-size:1.5rem; font-weight:800; cursor:pointer; }
  .art button small { display:block; font-size:.7rem; font-weight:500; color:var(--muted); }
  .art button[data-a=der] { border-color:var(--der); color:var(--der); }
  .art button[data-a=die] { border-color:var(--die); color:var(--die); }
  .art button[data-a=das] { border-color:var(--das); color:var(--das); }
  .art button.right { background:var(--ok-bg); border-color:var(--ok); color:var(--ok); }
  .art button.wrong { background:var(--bad-bg); border-color:var(--bad); color:var(--bad); }
  .art button:disabled { cursor:default; }
  .art button:disabled:not(.right):not(.wrong) { opacity:.45; }
  .fb { border-radius:12px; padding:12px 14px; margin-top:6px; text-align:left; }
  .fb.ok { background:var(--ok-bg); } .fb.bad { background:var(--bad-bg); }
  .fb .big { font-size:1.25rem; font-weight:800; }
  .fb .hint { margin-top:6px; padding:8px 10px; border-radius:10px; background:var(--warn-bg); font-size:.95rem; }
  .fb .hint .ex { margin-top:4px; color:var(--muted); font-size:.9rem; }
  .hint b.exc { color:var(--bad); }
  .g-der { color:var(--der); font-weight:800; } .g-die { color:var(--die); font-weight:800; } .g-das { color:var(--das); font-weight:800; }
  .score { font-size:2.2rem; font-weight:800; text-align:center; }
  .rev { list-style:none; margin:8px 0 0; padding:0; }
  .rev li { padding:10px 0; border-top:1px solid var(--line); }
  .rev .pl { color:var(--muted); font-size:.92rem; }
  .cols { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .col { border-radius:12px; padding:8px 10px; }
  .col h3 { margin:0 0 6px; font-size:1.05rem; }
  .col.der { background:var(--der-bg); } .col.die { background:var(--die-bg); } .col.das { background:var(--das-bg); }
  .col ul { list-style:none; margin:0; padding:0; }
  .col li { padding:2px 0; font-size:.95rem; }
  .col li small { color:var(--muted); }
  .rowbar { display:flex; height:14px; border-radius:999px; overflow:hidden; background:var(--chip); }
  .rowbar i { display:block; height:100%; }
  .seg-s { background:var(--ok); } .seg-g { background:#e0a526; }
  table.prog { width:100%; border-collapse:collapse; font-size:.95rem; }
  table.prog td { padding:6px 4px; border-top:1px solid var(--line); vertical-align:middle; }
  table.prog td.n { width:56px; font-weight:700; white-space:nowrap; }
  table.prog td.c { width:110px; text-align:right; color:var(--muted); font-size:.85rem; white-space:nowrap; }
  details summary { cursor:pointer; font-weight:600; min-height:44px; display:flex; align-items:center; }
  .rules li { margin:4px 0; }
  .hidden { display:none !important; }
  [dir=rtl] { direction:rtl; unicode-bidi:isolate; }
  @media (max-width:560px) { .cols { grid-template-columns:1fr; } .wrap { padding:10px; } }

  .tabs .tab { font-size:.95rem; }
  .langbar { display:flex; align-items:center; gap:8px; margin:0 0 10px; }
  .langbar label { color:var(--muted); font-size:.9rem; }
  .lead { font-size:1.02rem; margin:0 0 10px; }
  .de { unicode-bidi:isolate; }
  .modebtn { display:block; width:100%; text-align:start; margin:0 0 10px; padding:12px 14px; border-radius:14px; border:2px solid var(--line); background:var(--card); color:var(--text); cursor:pointer; font-size:1rem; }
  .modebtn:hover:not(:disabled) { border-color:var(--accent); }
  .modebtn:disabled { opacity:.5; cursor:default; }
  .modebtn .mt { font-size:1.15rem; font-weight:800; }
  .modebtn .md { color:var(--muted); font-size:.9rem; margin:2px 0 8px; }
  .modebtn .ms { color:var(--muted); font-size:.8rem; margin-top:4px; }
  .modebtn:focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
  .chipbtn { min-height:44px; padding:6px 14px; border-radius:999px; border:2px solid var(--line); background:var(--chip); color:var(--text); cursor:pointer; font-size:.95rem; }
  .ans { margin:6px 0 4px; color:var(--muted); font-size:1.05rem; }
  .ans .de { color:var(--text); font-weight:600; }
  .opts { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:14px 0 8px; }
  .opts.two { grid-template-columns:1fr 1fr; }
  .opt-b { min-height:64px; border-radius:14px; border:3px solid var(--line); background:var(--card); color:var(--text); font-size:1.15rem; font-weight:700; cursor:pointer; padding:6px 8px; position:relative; }
  .opt-b small { position:absolute; top:4px; inset-inline-end:8px; font-weight:500; font-size:.7rem; color:var(--muted); }
  .opt-b.right { background:var(--ok-bg); border-color:var(--ok); color:var(--ok); }
  .opt-b.wrong { background:var(--bad-bg); border-color:var(--bad); color:var(--bad); }
  .opt-b:disabled { cursor:default; }
  .opt-b:disabled:not(.right):not(.wrong) { opacity:.45; }
  .opt-b:focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
  .fb .hint { margin-top:6px; padding:8px 10px; border-radius:10px; background:var(--warn-bg); font-size:.95rem; }
  .fb .small { margin-top:4px; }
  .fb table.wt { margin-top:8px; }
  .tilearea { min-height:62px; border:2px dashed var(--line); border-radius:14px; padding:8px; display:flex; flex-wrap:wrap; gap:8px; align-items:center; justify-content:center; margin:12px 0 10px; direction:ltr; }
  .tilebank { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-bottom:12px; direction:ltr; min-height:52px; }
  .tile { min-height:48px; padding:6px 14px; border-radius:12px; border:2px solid var(--accent); background:var(--chip); color:var(--text); font-size:1.1rem; font-weight:700; cursor:pointer; }
  .tile.in { background:var(--card); }
  .tile:focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
  .qm { font-size:1.4rem; font-weight:800; color:var(--muted); }
  .row.center { justify-content:center; }
  .demo { background:var(--chip); border-radius:12px; padding:10px 14px; margin-bottom:12px; font-size:1.2rem; }
  .p1 { color:var(--die); } .p2 { color:var(--der); }
  .wcard { border-top:1px solid var(--line); padding:10px 0; }
  .wh { display:flex; flex-wrap:wrap; gap:6px 12px; align-items:baseline; }
  .wde { font-size:1.3rem; font-weight:800; color:var(--accent); }
  .wtr { font-size:1.05rem; font-weight:600; }
  .exb { margin-top:6px; padding:8px 10px; background:var(--chip); border-radius:10px; }
  .gbox { margin-bottom:10px; } .gbox h3 { margin:0 0 4px; font-size:1rem; }
  .gbox ul { margin:0; padding-inline-start:20px; } .gbox li { margin:3px 0; }
  .cmp { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:10px 0; }
  .cbox { border:2px solid var(--line); border-radius:12px; padding:10px; }
  .cbox h3 { margin:0 0 6px; font-size:1.15rem; color:var(--accent); }
  .cbox .tag { font-size:.85rem; color:var(--muted); margin-bottom:2px; }
  .cbox .cex { margin-top:6px; font-size:.95rem; }
  .cex { margin:6px 0; }
  .xbad { color:var(--bad); font-weight:700; } .xgood { color:var(--ok); font-weight:700; }
  .panel h2 { text-transform:none; }
  table.wt { width:100%; border-collapse:collapse; margin:10px 0; text-align:center; direction:ltr; table-layout:fixed; }
  table.wt th:first-child { width:21%; }
  table.wt td b { font-size:.78rem; white-space:nowrap; }
  table.wt td { padding:6px 1px; }
  table.wt th { font-size:.68rem; overflow-wrap:anywhere; }
  table.wt th { font-size:.8rem; color:var(--muted); font-weight:600; padding:4px; }
  table.wt td { border:1px solid var(--line); padding:6px 4px; }
  table.wt td b { display:block; }
  table.wt td small { color:var(--muted); font-size:.8rem; }
  table.wt td.hi { background:var(--ok-bg); border:2px solid var(--ok); }
  table.wt td.chg { background:var(--warn-bg); }
  table.wt th.rowh { text-align:start; color:var(--text); font-size:.85rem; }
  .refh { margin:18px 0 8px; font-size:.78rem; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); }
  .steps { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; }
  .step { font-size:.8rem; padding:4px 10px; border-radius:999px; background:var(--chip); color:var(--muted); }
  .step.on { background:var(--accent); color:var(--accent-text); font-weight:700; }
  .exwrap { display:grid; gap:8px; }
  .exb2 { background:var(--chip); border-radius:12px; padding:8px 12px; }
  .exh { font-size:.78rem; color:var(--muted); font-weight:700; margin-bottom:2px; }
  .exline { margin:4px 0; font-size:1.02rem; }
  .uq { font-size:1.2rem; font-weight:700; margin:8px 4px 4px; }
  .ruleline { padding:8px 0; border-top:1px solid var(--line); }
  .wde2 { color:var(--accent); font-size:1.1rem; }
  .wtr2 { font-weight:600; }
  [dir=rtl] .tabs { direction:rtl; }
  @media (max-width:560px) { .cmp { grid-template-columns:1fr; } }
</style>
</head>

      var ids = []; for (var j = 0; j < wrong.length; j++) { ids.push(wrong[j].q.id); }
      startSession(session.mode, shuffle(ids), true, session.unit);
    });
    acts.appendChild(rb);
  }
  var again = el("button", "sec", T("newRound")); again.type = "button"; again.style.marginTop = "10px"; again.style.width = "100%";
  again.addEventListener("click", function () { session = null; renderPractice(); });
  acts.appendChild(again); v.appendChild(acts);
}
function reviewText(q) {
  if (q.mode === "recog") { return R[q.id][0]; }
  if (q.mode === "viel") { return V[q.id][1].replace("___", V[q.id][2]); }
  if (q.mode === "welch") { return WC[q.id][0].replace("___", WC[q.id][4]); }
  if (q.mode === "build") { return B[q.id] + "?"; }
  return WBY[q.correct][1];
}

/* ---------- Fortschritt ---------- */
function renderProg() {
  var v = $("viewProg"); clear(v);
  var k, tot = 0, sure = 0, n = 0, c = 0, i2;
  var p = el("div", "panel"); p.appendChild(el("h2", null, T("overall")));
  var tb = el("table", "prog");
  for (k = 0; k < MODES.length; k++) {
    var st = modeStats(MODES[k]); tot += st.t; sure += st.s;
    var tr1 = el("tr"), td = el("td", "n", T("m_" + MODES[k])); if (MODES[k] === "viel" || MODES[k] === "welch") { td.setAttribute("dir", "ltr"); }
    tr1.appendChild(td);
    var tdb = el("td"), bb = el("div", "rowbar"), a1 = el("i", "seg-s"); a1.style.width = (100 * st.s / st.t) + "%"; bb.appendChild(a1); tdb.appendChild(bb); tr1.appendChild(tdb);
    tr1.appendChild(el("td", "c", st.s + " / " + st.t)); tb.appendChild(tr1);
  }
  for (var key in store.words) { if (store.words.hasOwnProperty(key)) { n += store.words[key].n; c += store.words[key].c; } }
  p.appendChild(el("div", null, T("sureOf", { s: sure, t: tot, a: n ? Math.round(100 * c / n) : 0 })));
  p.appendChild(tb); p.appendChild(el("div", "small", T("sureNote")));

  var p5 = el("div", "panel"), rs = el("button", "sec", T("resetProg")); rs.type = "button";
  rs.addEventListener("click", function () { if (window.confirm(T("resetConfirm"))) { store.words = {}; store.units = {}; save(); renderProg(); } });
  p5.appendChild(rs); v.appendChild(p5);
}

/* ---------- Rahmen ---------- */
function renderChrome() {
  $("tabLearn").textContent = T("tabLearn"); $("tabPractice").textContent = T("tabPractice"); $("tabProg").textContent = T("tabProgress");
  $("langLbl").textContent = T("langLabel");
}
function showTab(t) {
  tab = t;
  $("viewLearn").className = t === "learn" ? "" : "hidden";
  $("viewPractice").className = t === "practice" ? "" : "hidden";
  $("viewProg").className = t === "prog" ? "" : "hidden";
  $("tabLearn").className = "tab" + (t === "learn" ? " on" : "");
  $("tabPractice").className = "tab" + (t === "practice" ? " on" : "");
  $("tabProg").className = "tab" + (t === "prog" ? " on" : "");
  if (t === "learn") { renderLearn(); } else if (t === "practice") { renderPractice(); } else { renderProg(); }
}
function init() {
  load(); applyLang();
  var sel = $("langSel"), k;
  for (k = 0; k < LANGS.length; k++) {
    var o = document.createElement("option"); o.value = LANGS[k].id; o.textContent = LANGS[k].label;
    if (LANGS[k].id === lang()) { o.selected = true; } sel.appendChild(o);
  }
  sel.addEventListener("change", function () {
    store.settings.lang = sel.value; save(); applyLang();
    if (autoTimer) { clearTimeout(autoTimer); autoTimer = null; }
    session = null; renderChrome(); showTab(tab);
  });
  $("tabLearn").addEventListener("click", function () { showTab("learn"); });
  $("tabPractice").addEventListener("click", function () { showTab("practice"); });
  $("tabProg").addEventListener("click", function () { showTab("prog"); });
  document.addEventListener("keydown", function (ev) {
    if (tab !== "practice" || !session || session.pos >= session.qs.length) { return; }
    var tag = ev.target && ev.target.tagName;
    if (tag === "INPUT" || tag === "SELECT") { return; }
    var q = session.qs[session.pos];
    if (!session.answered) {
      if (q.opts && /^[1-4]$/.test(ev.key)) { var o = q.opts[parseInt(ev.key, 10) - 1]; if (o) { answerChoice(o); } }
    } else if ((ev.key === "Enter" || ev.key === " ") && tag !== "BUTTON") { ev.preventDefault(); nextQuestion(); }
  });
  renderChrome(); showTab("learn");
}

init();

})();
