<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Perfekt-Blitz – Hilfsverb und Partizip II auf Zeit (mehrsprachig)</title>
<style>
:root{--gold:#f5c542;--ink:#1d1633}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:radial-gradient(circle at 50% 0,#4a2a8a 0,#241447 55%,#150b2e 100%);color:#fff;min-height:100vh}
.wrap{max-width:980px;margin:0 auto;padding:16px 14px 40px}
header{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center}
h1{font-size:clamp(20px,3.2vw,30px);margin:0;line-height:1.2}
h1 span{display:block;font-size:.55em;font-weight:600;color:var(--gold);letter-spacing:.04em}
.pill{background:rgba(255,255,255,.14);border-radius:999px;padding:6px 14px;font-weight:700;font-size:15px;white-space:nowrap}
.score{display:flex;gap:8px;flex-wrap:wrap}
.card{background:#fff;color:var(--ink);border-radius:18px;padding:20px;margin-top:16px;box-shadow:0 6px 20px rgba(0,0,0,.35)}
.card[hidden]{display:none}
.card h2{margin:0 0 8px;font-size:22px}
.card h3{margin:16px 0 6px;font-size:18px}
.btn{font:inherit;font-weight:800;border:0;border-radius:12px;padding:10px 18px;cursor:pointer;background:#4a2a8a;color:#fff}
.btn.ghost{background:#e9e4f7;color:#3b2475}
.btn.big{font-size:20px;padding:14px 34px;background:linear-gradient(#ffe27a,#f5b41b);color:#3a2a07;border:3px solid #3a2a07;box-shadow:0 5px 0 #9a6b00}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:10px 0}
.chip{font:inherit;font-weight:700;border:2px solid #b9aedc;background:#f6f2ff;color:var(--ink);border-radius:999px;padding:6px 16px;cursor:pointer}
.chip.on{background:#4a2a8a;color:#fff;border-color:#4a2a8a}
input[type=number]{font:inherit;font-size:20px;width:90px;padding:6px 10px;border:2px solid #b9aedc;border-radius:10px}
.mode{display:block;width:100%;text-align:left;font:inherit;font-size:17px;font-weight:700;line-height:1.35;border:3px solid #b9aedc;border-radius:14px;background:#f6f2ff;color:var(--ink);padding:12px 16px;margin:8px 0;cursor:pointer}
.mode.on{border-color:#0d7a3f;background:#eaf8f0}
.mode small{display:block;font-weight:500;font-size:14px;color:#5b5078;margin-top:3px}
.hud{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.timer{font-size:34px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:.03em}
.timer.low{color:#ff8a8a;animation:pulse .8s infinite}
@keyframes pulse{50%{opacity:.55}}
.bar{height:10px;border-radius:999px;background:rgba(255,255,255,.18);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;width:100%;background:var(--gold);transition:width .3s linear}
.q{background:#fff;color:var(--ink);border-radius:20px;padding:20px 16px 22px;margin-top:14px;box-shadow:0 6px 20px rgba(0,0,0,.35);text-align:center}
.inf{font-size:clamp(34px,8vw,60px);font-weight:900;color:#4a2a8a;line-height:1.1}
.sent{font-size:clamp(20px,4.2vw,32px);font-weight:700;margin:14px 0 6px;line-height:1.6}
.gap{display:inline-block;min-width:3.2em;padding:0 .35em;border-bottom:4px solid #b9aedc;color:#4a2a8a;font-weight:900;text-align:center;vertical-align:baseline}
.gap.gp{min-width:5.5em}
.gap.ok{border-color:#0d7a3f;color:#0d7a3f}
.gap.bad{border-color:#b3261e;color:#b3261e;text-decoration:line-through}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px;text-align:left}
.col h4{margin:0 0 8px;text-align:center;color:#5b5078;font-size:15px;text-transform:uppercase;letter-spacing:.06em}
.opt{display:flex;align-items:center;gap:8px;width:100%;font:inherit;font-size:clamp(17px,3.4vw,24px);font-weight:800;text-align:left;border:3px solid #b9aedc;background:#f6f2ff;color:var(--ink);border-radius:12px;padding:9px 12px;margin:0 0 8px;cursor:pointer;direction:ltr}
.opt:hover:not(:disabled){border-color:#4a2a8a;background:#ece5ff}
.opt.sel{border-color:#4a2a8a;background:#ddd2ff}
.opt.right{border-color:#0d7a3f;background:#d7f3e3}
.opt.wrong{border-color:#b3261e;background:#fde0dd}
.opt:disabled{cursor:default}
.key{flex:none;width:1.6em;height:1.6em;border-radius:6px;background:#e0d9f3;color:#3b2475;font-size:.62em;display:flex;align-items:center;justify-content:center}
@media (pointer:coarse){.key{display:none}}
.fbk{margin-top:6px;min-height:3.2em;font-size:18px;font-weight:700}
.fbk.good{color:#0d7a3f}.fbk.bad{color:#b3261e}
.fbk small{display:block;font-weight:500;color:#5b5078;font-size:14px;margin-top:2px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:10px 0}
.stat{background:#f1ecff;border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:26px;color:#4a2a8a}
.stat span{font-size:13px;color:#5b5078}
.err{border:2px solid #f0d4d1;background:#fff7f6;border-radius:12px;padding:10px 12px;margin:8px 0}
.err .inf2{font-weight:900;color:#4a2a8a}
.err .s{font-size:17px;margin:2px 0}
.err .m{font-size:14px;color:#5b5078}
.wrongtxt{color:#b3261e;font-weight:800}.righttxt{color:#0d7a3f;font-weight:800}
.why{border-left:6px solid #4a2a8a;background:#f6f2ff;border-radius:0 12px 12px 0;padding:10px 14px;margin:12px 0}
.why h4{margin:0 0 4px;font-size:17px}
.why .n{float:right;background:#4a2a8a;color:#fff;border-radius:999px;padding:1px 10px;font-weight:800;font-size:14px}
.why p{margin:6px 0}
.why ul{margin:4px 0 6px 18px;padding:0}
.why .rule{background:#fff4c9;border-radius:8px;padding:6px 10px;margin:6px 0}
.why .vb{font-size:14px;color:#5b5078}
.help{margin-top:16px;font-size:14px;color:#d9d0f2}
.help summary{cursor:pointer;font-weight:700}
.help ul{margin:8px 0 0 18px;padding:0;line-height:1.5}
.good{color:#0d7a3f}
@media (max-width:560px){.cols{gap:8px}.opt{padding:8px 8px;border-width:2px}.q{padding:14px 8px 16px}}

.langbar{display:flex;gap:8px;align-items:center;margin-top:10px;font-size:14px;color:#d9d0f2}
.langbar select{font:inherit}
.sym{display:inline-block;margin-inline-start:.12em;font-size:.82em;vertical-align:.05em}
.symleg{min-height:1.5em;font-size:13px;font-weight:600;color:#5b5078;margin:0 0 4px;line-height:1.4}
.meanrow{min-height:46px;margin-top:6px;display:flex;justify-content:center;align-items:center}
.meanrow[hidden]{display:none}
.btn.small{font-size:14px;padding:6px 14px}
.mean{background:#eef6ff;border:2px solid #b8d4f2;border-radius:12px;padding:6px 14px;font-size:20px;font-weight:700;color:#12325a;cursor:pointer}
.mean[hidden],.btn[hidden]{display:none}
.opt .lbl{min-width:0;overflow-wrap:anywhere}
.opt.unu{border-color:#c98a00;background:#fff4c9}
.gap.unu{border-color:#c98a00;color:#8a5d00}
.fbk.unu{color:#8a5d00}
.why.unuw{border-left-color:#c98a00;background:#fff8dd}
.lab{color:#5b5078;font-size:.92em}
.de{unicode-bidi:isolate}
.err .s,.err .inf2{direction:ltr;text-align:left}
body.rtl .card,body.rtl .help,body.rtl .langbar,body.rtl #result{direction:rtl;text-align:right}
body.rtl .mode{direction:rtl;text-align:right}
body.rtl .hud,body.rtl .cols,body.rtl .q,body.rtl .bar{direction:ltr}
body.rtl .fbk,body.rtl .symleg{direction:rtl;text-align:center}
body.rtl .why{border-left:0;border-right:6px solid #4a2a8a;border-radius:12px 0 0 12px}
body.rtl .why.unuw{border-right-color:#c98a00}
body.rtl .why .n{float:left}
body.rtl .err .m{direction:rtl}
body.rtl h1 span{unicode-bidi:plaintext;text-align:left}
body.rtl .row{direction:rtl}

.fsent{display:block;font-size:1.15em;margin:2px 0;color:inherit}
.fbk small{margin-top:3px}
bdi[dir=ltr]{white-space:nowrap}

</style>
</head>

<div class="wrap">

      </div>
      <div class="fbk" id="fbk"></div>
    </div>
  </section>

  <section class="card" id="result" hidden></section>
</div>

hs_verb_p:"بپرسید: «آیا من چیزی هستم یا جایی هستم؟» ← sein. «آیا چیزی دارم یا حس می‌کنم؟» ← haben.",
hs_mix_t:"Präteritum و Partizip II با هم قاطی شد",

pp_unsinn_p:"پیش از کلیک همهٔ گزینه‌ها را بخوانید – کلمات ساختگی معمولاً فوراً شناخته می‌شوند.",

mA:"A. أريد أن أتدرّب فقط (موصى به)",mB:"B. أريد أن أتدرّب أيضًا على الأفعال ذات البادئات غير المنفصلة (besuchen, verstehen …) وعلى أفعال جديدة من L18 (للذين يشعرون بالملل فقط)",
mA_sub:"أفعال حتى L17، بدون الأفعال الناقصة وبدون الأفعال ذات البادئات غير المنفصلة.",mB_sub:"الأفعال الناقصة غائبة هنا أيضًا، لأن Perfekt الخاص بها حالة خاصة.",start:"ابدأ",
help_sum:"كيف تعمل اللعبة",
h1:"في الأعلى يظهر المصدر (Infinitiv) وتحته جملة ناقصة في الماضي. اختر في العمود الأيسر الفعل المصرَّف الصحيح (غالبًا الفعل المساعد) وفي العمود الأيمن Partizip II الصحيح.",
h2:"بمجرد أن تختار شيئًا في العمودين يُفحص جوابك فورًا. عند الخطأ ترى الحل الصحيح لوقت قصير (Enter = التالي).",
h3:"لوحة المفاتيح: العمود الأيسر A S D F G والعمود الأيمن Q W E R T. نقرت على الجواب الخطأ؟ قبل اختيارك الثاني انقر ببساطة جوابًا آخر في العمود نفسه.",
h4:"أحيانًا لا يلزم Partizip II إطلاقًا. عندها تكون «–» هي الصحيحة. قرّر بنفسك متى يكون الأمر كذلك!",
h5:"النقاط: 10 لكل مهمة صحيحة تمامًا، بالإضافة إلى مكافأة للسلاسل المتتالية. بعد انتهاء الوقت تحصل على تحليل للأخطاء ويمكنك أن تتدرّب مرة أخرى على الأفعال التي أخطأت فيها بالضبط.",
h6:"عند «Sie» يوضّح رمزٌ من المقصود: 👩 = sie (امرأة واحدة)، 👥 = sie (عدة أشخاص)، 🤵 = Sie (صيغة المخاطبة المهذّبة).",
h7:"لم تفهم الفعل؟ انقر على «ما معنى هذا الفعل؟» لترى المعنى بلغتك.",
quit:"إنهاء",col_aux:"الفعل المصرَّف",col_pp:"Partizip II",none_opt:"– (بدون Partizip II)",meaning:"ما معنى هذا الفعل؟",

err_h:"أخطاؤك ({n})",lbl_aux_bad:"الفعل خاطئ",lbl_pp_bad:"Partizip خاطئ",lbl_both:"كلاهما خاطئ",e_aux:"الفعل",e_pp:"Partizip",
ana_h:"التحليل: لماذا حدثت الأخطاء؟",lbl_cause:"السبب المحتمل:",lbl_obs:"لاحظ:",lbl_rule:"القاعدة:",lbl_tip:"نصيحة:",lbl_aff:"المتأثر عندك:",verbs_err:"أفعال فيها أخطاء:",
tempo_h:"السرعة",tempo_fast:"عند الأخطاء أجبتَ في المتوسط أسرع ({a} ث) من الإجابات الصحيحة ({b} ث). هذا يدل على التسرّع أو التخمين أكثر مما يدل على نقص المعرفة: اقرأ الفاعل والفعل بإيجاز قبل أن تنقر.",
tempo_slow:"عند الأخطاء تردّدتَ أطول ({a} ث) من الإجابات الصحيحة ({b} ث). هذا يدل على أنك غير متأكد فعلًا من هذه الأفعال – والمراجعة المركّزة مفيدة.",
mix_h:"حالة خاصة: الأفعال المختلطة",mix_p:"في {v} يتغيّر الجذر وتكون النهاية -t: gebracht, gedacht, gekannt, gewusst. هذه أربعة أفعال فقط – ومن السهل حفظها عن ظهر قلب.",
unu_h:"صحيح، لكنه غير معتاد: Perfekt مع haben/sein",unu_p:"اخترتَ Perfekt (hat gehabt, ist gewesen). هذا صحيح نحويًا. لكن في الكلام اليومي يُقال عادةً مع haben وsein الـ Präteritum (hatte, war). لذلك حصلتَ على نصف النقاط.",
btn_retry:"تدرّب فقط على أفعالي الخاطئة",btn_again:"جولة جديدة",btn_setup:"تغيير الإعدادات",
rl_reg:"منتظم: -t",rl_irr:"غير منتظم: -en",rl_mix:"مختلط: حرف علة الجذر + -t",plq:"مع hatte/war + Partizip II سيكون زمنًا آخر (Plusquamperfekt).",plq2:"hatte gehabt / war gewesen = Plusquamperfekt: الزمن الذي يسبق ماضيًا آخر.",sein_use:"sein: حالة، مكان، مهنة",haben_use:"haben: ملكية، مشاعر، وقت، عمل",no_pp:"لا يوجد هنا Partizip: –",
aux_sein_fehlt_t:"اخترتَ «haben» لكن هذا الفعل يحتاج «sein»",
aux_sein_fehlt_w:"على الأرجح اعتمدتَ haben كفعل مساعد افتراضي. لكن الأفعال التي تعبّر عن تغيّر المكان أو تغيّر الحالة تُكوِّن Perfekt مع sein.",
aux_sein_fehlt_r:"sein: تغيّر المكان (gehen, fahren, kommen, fliegen …) وتغيّر الحالة (aufstehen) والحالات الخاصة bleiben, sein, passieren.",
aux_sein_fehlt_p:"اسأل نفسك: هل يتغيّر المكان أو الحالة؟ عندها غالبًا sein.",
aux_sein_zuviel_t:"اخترتَ «sein» لكن هذا الفعل يحتاج «haben»",
aux_sein_zuviel_w:"على الأرجح فكّرتَ في الحركة أو التغيّر. لكن معظم الأفعال تُكوِّن Perfekt مع haben، خاصة الأفعال التي لها مفعول به في Akkusativ والأفعال بدون تغيّر مكان (sitzen, stehen, liegen, schlafen, arbeiten).",
aux_sein_zuviel_r:"haben هو الحالة العادية. sein فقط عند تغيّر المكان وتغيّر الحالة وbleiben, sein, passieren.",
aux_sein_zuviel_p:"إذا لم تكن متأكدًا فخذ haben – فهو صحيح لمعظم الأفعال.",
aux_person_t:"الفعل صحيح لكن صيغة الشخص خاطئة",
aux_person_w:"يجب أن يتطابق الفعل المصرَّف مع الفاعل – تمامًا كما في Präsens. على الأرجح لم تنتبه جيدًا إلى الفاعل أو إلى النهاية.",
aux_person_r:"يُصرَّف الفعل المساعد (وفي haben/sein في Präteritum: الفعل نفسه) بما يناسب الفاعل.",
aux_person_p:"اقرأ الفاعل أولًا وانطق صيغة الشخص بصوت عالٍ: «Meine Oma … hat».",
aux_praet_t:"صيغة Präteritum بدل صيغة Präsens للفعل المساعد",
aux_praet_w:"على الأرجح خلطتَ بين Perfekt وPräteritum. hatte/war تنتميان إلى Präteritum.",
aux_praet_r:"Perfekt = Präsens من haben/sein + Partizip II.",
aux_praet_p:"حتى لو وردت «gestern/letzte Woche» في الجملة يبقى الفعل المساعد في Perfekt في Präsens.",
pp_endung_t:"خلط بين النهايتين -t و-en",
pp_endung_w:"على الأرجح لم يكن واضحًا هل الفعل منتظم أم غير منتظم. الأفعال المنتظمة تنتهي في Partizip بـ -t وغير المنتظمة غالبًا بـ -en – وفيها كثيرًا ما يتغيّر الجذر.",
pp_endung_r:"المنتظم: ge- + الجذر + -t. غير المنتظم: ge- + الجذر (المتغيّر) + -en. المختلط: الجذر المتغيّر + -t.",
pp_endung_p:"تعلّم الأفعال غير المنتظمة دائمًا بكل صيغها: gehen – ging – ist gegangen.",
pp_geinf_t:"تكوين ge- + المصدر",
pp_geinf_w:"على الأرجح «ركّبتَ» Partizip من المصدر. لكن في الأفعال غير المنتظمة يتغيّر الجذر.",
pp_geinf_r:"Partizip II ليس «ge- + المصدر». في الأفعال غير المنتظمة يجب حفظ الصيغة.",
pp_geinf_p:"انطق الصيغ الأساسية بصوت عالٍ: nehmen – nahm – genommen.",
pp_gepos_t:"ge- في المكان الخطأ (الأفعال المنفصلة)",
pp_gepos_w:"على الأرجح وضعتَ ge- في البداية. لكن في الأفعال المنفصلة يأتي ge- بين البادئة والفعل.",
pp_gepos_r:"المنفصل: البادئة + ge + الجذر. البادئة هي المنبورة (ANrufen).",
pp_gepos_p:"اسأل: هل أستطيع فصل البادئة («Ich rufe an»)؟ عندها يأتي ge- بعدها.",
pp_noge_t:"نُسي ge-",
pp_noge_w:"على الأرجح اشتققتَ الصيغة من Präsens أو من المصدر. معظم الأفعال لها ge- في Partizip II.",
pp_noge_r:"ge- موجود في Partizip II لمعظم الأفعال. الاستثناءات: البادئات غير المنفصلة والأفعال المنتهية بـ -ieren.",
pp_noge_p:"انتبه هل يبدأ الفعل بـ be- أو ver- أو er- أو ent- أو emp- أو ge- أو zer- أو miss- أو ينتهي بـ -ieren.",
pp_extrage_t:"ge- زائد (البادئات غير المنفصلة و-ieren)",
pp_extrage_w:"على الأرجح عمّمتَ قاعدة «Partizip = ge- + …» أكثر من اللازم.",
pp_extrage_r:"لا ge- مع البادئات غير المنفصلة (be-, ver-, er-, ent-, emp-, ge-, zer-, miss-، وهنا أيضًا über-, unter-, wieder-) ومع الأفعال المنتهية بـ -ieren.",
pp_extrage_p:"البادئات be-, ver-, er-, ent-, emp- غير منبورة – عندها لا ge-.",
pp_praet_t:"اختيار صيغة Präteritum بدل Partizip II",
pp_praet_w:"على الأرجح خلطتَ بين Perfekt وPräteritum.",
pp_praet_r:"يحتاج Perfekt بعد الفعل المساعد إلى Partizip II.",
pp_praet_p:"بعد «hat/ist» يأتي Partizip في نهاية الجملة.",
pp_inf_t:"اختيار المصدر بدل Partizip II",
pp_inf_w:"على الأرجح لم تتعرّف على Partizip في الأفعال التي بدون ge-.",
pp_inf_r:"في Perfekt يأتي Partizip II في نهاية الجملة وليس المصدر.",
pp_inf_p:"الأفعال بدون ge- لها Partizip أيضًا: be-/ver-/er-… + الصيغة الأساسية.",
hs_praes_t:"Präsens بدل Präteritum مع haben/sein",
hs_praes_w:"على الأرجح لم تنتبه إلى ظرف الزمان (gestern, letzte Woche …) أو أردتَ تكوين Perfekt.",
hs_praes_r:"في الكلام اليومي يأتي haben وsein في الماضي بصيغة Präteritum – بدون Partizip II.",
hs_praes_p:"انطق بصوت عالٍ: «Gestern WAR ich …, gestern HATTE ich …».",
hs_verb_t:"خلط بين haben وsein",
hs_verb_w:"على الأرجح لم يكن واضحًا هل المقصود حالة/مكان/مهنة (sein) أم ملكية/شعور/وقت (haben).",
hs_verb_r:"sein يصف كيف أو أين يكون شخص ما؛ haben يصف ما يملكه أو يشعر به.",
hs_verb_p:"اسأل: «هل أنا شيء ما أو في مكان ما؟» ← sein. «هل أملك شيئًا أو أشعر به؟» ← haben.",
hs_mix_t:"خلط بين Präteritum وPartizip II",

hs_mix_r:"Präteritum = كلمة واحدة فقط: war, hatte. بدون Partizip II.",
hs_mix_p:"إذا اخترتَ «war» أو «hatte» فيبقى الفراغ الثاني فارغًا (–).",
pp_unsinn_t:"اختيار صيغة مختلقة",

pp_unsinn_r:"لا يوجد Partizip II إلا عندما يسبقه فعل مساعد (haben/sein + Partizip).",

pp_none_t:"اختيار «–» (بدون Partizip) مع أن Partizip II مطلوب",

pp_none_r:"Perfekt = haben/sein + Partizip II – دائمًا.",
pp_none_p:"اسأل نفسك: هل في الجملة فعل مساعد (hat/ist/haben/sind …)؟ عندها يأتي Partizip في النهاية."
};

tempo_h:"Hız",tempo_fast:"Hata yaptığında ortalama olarak doğru cevaplarından ({b} sn) daha hızlı ({a} sn) cevap verdin. Bu, bilgi eksikliğinden çok acelecilik ya da tahmin etmeye işaret ediyor: tıklamadan önce özneyi ve fiili kısaca oku.",

function PH(cat,sub,arr){

    mkP(pre,a[1],cn,cat,sub);
  });
}
function SPX(cat,sub,pre,v,only,extra){
  var e=extra||{};e.only=only;mkP(pre,v,null,cat,sub,e);
}

function wpick(list,rnd){
  var by={},keys=[],i,tot=0,r,acc=0,k,arr;
  for(i=0;i<list.length;i++){k=list[i].v;if(!by[k]){by[k]=[];keys.push(k);tot+=vw(k);}by[k].push(list[i]);}
  r=rnd()*tot;k=keys[keys.length-1];
  for(i=0;i<keys.length;i++){acc+=vw(keys[i]);if(r<acc){k=keys[i];break;}}
  arr=by[k];
  return arr[Math.floor(rnd()*arr.length)];
}
function pickPhrase(cfg,rnd,filter){
  rnd=rnd||Math.random;
  filter=filter||function(){return true;};
  var r=rnd(),cands,s,sub,i,l;
  if(r<HS_SHARE){cands=[G.hs,G.a];}
  else if(cfg.mode==='B'&&r<HS_SHARE+(1-HS_SHARE)*B_SHARE){
    s=rnd();sub=s<SUB_B.m?'m':(s<SUB_B.m+SUB_B.u?'u':'n');
    cands=[G.b[sub],G.b.n,G.b.u,G.b.m,G.a,G.hs];
  }else{cands=[G.a,G.hs];}
  for(i=0;i<cands.length;i++){
    l=cands[i].filter(filter);
    if(l.length){return wpick(l,rnd);}
  }
  return null;
}
function pick(a,rnd){return a[Math.floor(rnd()*a.length)];}
function pickSubj(phrase,rnd){
  var l=SUBJ.filter(function(s){return subjOK(s,phrase);});
  return pick(l,rnd);
}

var TIMES={
  past:['gestern','vorgestern','gestern Abend','gestern Nacht','gestern um 20:00 Uhr','letzte Woche','letzten Monat','letztes Jahr','letzten Sommer','letzten Montag','letzten Freitag','vor einer Stunde','vor zwei Tagen','vor einer Woche','vor einem Monat','vor drei Jahren','vor langer Zeit','früher','damals','als Kind'],
  pres:['jetzt','im Moment','momentan','zurzeit','gerade jetzt','in diesem Moment','heutzutage'],
  fut:['morgen','übermorgen','morgen früh um 07:00 Uhr','nächste Woche','nächsten Monat','nächstes Jahr','nächsten Sommer','nächsten Freitag','in einer Stunde','in zwei Tagen','in einem Monat','in drei Jahren','bald','in Zukunft'],
  clock:['06:00','08:00','10:30','12:00','15:00','18:00','20:00','22:00']
};
function timePools(nowMin){
  var out={past:[],pres:[],fut:[]},i,c,hm,m,d;
  for(i=0;i<TIMES.past.length;i++){out.past.push({t:TIMES.past[i],k:'past'});}
  for(i=0;i<TIMES.pres.length;i++){out.pres.push({t:TIMES.pres[i],k:'pres'});}
  for(i=0;i<TIMES.fut.length;i++){out.fut.push({t:TIMES.fut[i],k:'fut'});}
  for(i=0;i<TIMES.clock.length;i++){
    c=TIMES.clock[i];hm=c.split(':');m=parseInt(hm[0],10)*60+parseInt(hm[1],10);d=m-nowMin;
    if(d<=-10){out.past.push({t:'heute um '+c+' Uhr',k:'past',c:m});}
    else if(d>=10){out.fut.push({t:'heute um '+c+' Uhr',k:'fut',c:m});}
  }
  return out;
}
function kOf(item,nowMin){if(item.c!==undefined&&item.c!==null){return item.c<nowMin?'past':'fut';}return item.k;}
function pickTime(tenseCfg,nowMin,rnd){
  var pools=timePools(nowMin),w,keys,k,acc=0,r=rnd(),cat,i;
  if(tenseCfg==='past'){w={past:1};}else if(tenseCfg==='pf'){w={pres:0.5,fut:0.5};}else{w={past:0.45,pres:0.30,fut:0.25};}
  keys=[];for(k in w){if(w.hasOwnProperty(k)){keys.push(k);}}
  cat=keys[keys.length-1];
  for(i=0;i<keys.length;i++){acc+=w[keys[i]];if(r<acc){cat=keys[i];break;}}
  return pick(pools[cat],rnd);
}

/* Üblich: haben/sein (Vollverb) und Modalverben -> Präteritum, alle anderen Verben -> Perfekt */
function usual(st){
  var v;
  if(st.kind==='past'){
    v=V[st.phrase.v];
    return (v.kind==='hs'||v.kind==='modal')?'praet':'perfekt';
  }
  return 'praes';
}
function alts(st){
  if(st.kind==='past'){return [usual(st)==='praet'?'perfekt':'praet'];}
  if(st.kind==='fut'){return ['futur'];}
  return [];
}
function newSpin(prev,held,cfg,nowMin,rnd){
  rnd=rnd||Math.random;
  var st={},keep=!!prev,phrase,subj,flt;
  st.time=(keep&&held[0])?prev.time:pickTime(cfg.tense,nowMin,rnd);
  if(keep&&held[2]&&held[1]){phrase=prev.phrase;subj=prev.subj;}
  else if(keep&&held[2]){phrase=prev.phrase;subj=pickSubj(phrase,rnd);}
  else if(keep&&held[1]){
    subj=prev.subj;
    flt=function(p){return subjOK(subj,p);};
    phrase=pickPhrase(cfg,rnd,flt);
    if(!phrase){phrase=pickPhrase(cfg,rnd);subj=pickSubj(phrase,rnd);}
  }else{phrase=pickPhrase(cfg,rnd);subj=pickSubj(phrase,rnd);}
  st.phrase=phrase;st.subj=subj;
  st.kind=kOf(st.time,nowMin);
  st.tense=usual(st);
  return st;
}

function cap(s){return s.charAt(0).toUpperCase()+s.slice(1);}
function join(a){var o=[],i;for(i=0;i<a.length;i++){if(a[i]){o.push(a[i]);}}return o.join(' ');}
function nounFor(b,g){if(g==='f'){return b+'in';}if(g==='fpl'){return b+'innen';}if(g==='x'){return b+'/in';}return b;}
function preFor(ph,g){return ph.cn?nounFor(ph.cn,g):ph.pre;}
function auxOf(ph){return ph.aux||V[ph.v].aux;}
function vtoks(st,tense){
  var ph=st.phrase,v=V[ph.v],i=IDX[st.subj.p],fin;
  if(tense==='perfekt'){
    if(ph.inf){return [V.haben.p[i],v.inf];}
    return [V[auxOf(ph)].p[i],v.pp];
  }
  if(tense==='futur'){return [WERDEN[i],v.inf];}
  fin=(tense==='praes'?v.p:v.t)[i];
  return v.sep?[fin,v.sep]:[fin];
}
function clause(st,tense,g){

}
function sentence(st,tense,order,g){
  var t=vtoks(st,tense),pre=preFor(st.phrase,g||st.subj.g),fin=t[0],end=t[1]||'';
  var parts=order==='time'?[st.time.t,fin,st.subj.t,pre,end]:[st.subj.t,fin,st.time.t,pre,end];
  return cap(join(parts))+'.';
}
function stamm(st){
  var ph=st.phrase,v=V[ph.v],pret=v.t[2]+(v.sep?' '+v.sep:'');
  if(ph.inf){return v.inf+' – '+pret+' – (hat) … '+v.inf;}
  return v.inf+' – '+pret+' – '+(auxOf(ph)==='sein'?'ist ':'hat ')+v.pp;
}
/* Merkhinweis zur Aufgabe: liefert Textschlüssel (Übersetzung in der Oberfläche) */
function merke(st){
  var ph=st.phrase,v=V[ph.v];
  if(st.kind!=='past'){return st.kind==='fut'?{k:'m_fut'}:null;}
  if(v.kind==='hs'){return {k:'m_hs'};}
  if(v.kind==='modal'){return {k:'m_modal'};}
  if(v.untr){return {k:'m_untr',pp:v.pp};}
  if(v.ieren){return {k:'m_ieren',pp:v.pp};}
  if(v.sep){return {k:'m_sep',pp:v.pp};}

}
function solutionRows(st){
  var u=usual(st),a=alts(st),rows=[],order,i;
  if(st.kind==='past'){order=['praet','perfekt'];}
  else if(st.kind==='fut'){order=['praes','futur'];}
  else{order=['praes'];}
  for(i=0;i<order.length;i++){
    rows.push({tn:order[i],text:cap(clause(st,order[i]))+'.',tag:order[i]===u?'usual':'possible'});
  }
  return rows;
}

/* ================= Prüfen ================= */
function norm(s){
  return String(s).toLowerCase().replace(/\/in\b/g,'in').replace(/\(in\)/g,'in')
    .replace(/ß/g,'ss').replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue')
    .replace(/[.,;:!?„“”"'’‘…()\/\-–]/g,' ').replace(/\s+/g,' ').replace(/\b0(\d)/g,'$1').trim();
}
function toks(s){var n=norm(s);return n?n.split(' '):[];}
function key(s){return toks(s).sort().join(' ');}
function keysFor(st,tense){
  var m={},gs=st.subj.g==='x'?['m','f']:[st.subj.g],s=st.subj.t,t=st.time.t,i,j,pre,combos,vt=vtoks(st,tense).join(' ');
  for(i=0;i<gs.length;i++){
    pre=preFor(st.phrase,gs[i]);
    combos=[vt,vt+' '+s,vt+' '+pre,vt+' '+s+' '+pre,vt+' '+s+' '+t,vt+' '+pre+' '+t,vt+' '+s+' '+pre+' '+t];
    for(j=0;j<combos.length;j++){m[key(combos[j])]=true;}
  }
  return m;
}
function evaluate(st,raw){
  var k=key(raw),ts,inp={},i,u=usual(st),a=alts(st),order=['perfekt','praet','praes','futur'],ph=st.phrase,v=V[ph.v],np,hint=null;
  if(!k){return {status:'empty'};}
  if(keysFor(st,u)[k]){return {status:'ok'};}
  for(i=0;i<a.length;i++){if(keysFor(st,a[i])[k]){return {status:'unusual',tense:a[i],usual:u};}}
  ts=toks(raw);for(i=0;i<ts.length;i++){inp[ts[i]]=true;}
  function has(tn){var w=toks(vtoks(st,tn).join(' ')),j;for(j=0;j<w.length;j++){if(!inp[w[j]]){return false;}}return true;}
  if(has(u)){return {status:'verbok'};}
  for(i=0;i<a.length;i++){if(has(a[i])){return {status:'verbok_unusual',tense:a[i],usual:u};}}
  for(i=0;i<order.length;i++){
    if(order[i]!==u&&a.indexOf(order[i])<0&&has(order[i])){return {status:'othertense',tense:order[i]};}
  }
  /* gezielte Hinweise */
  if(!ph.inf){
    np=norm(v.pp);
    if(v.untr&&inp['ge'+np]){hint='untr';}
    else if(inp[np]&&(u==='perfekt'||a.indexOf('perfekt')>=0)){hint='aux';}
  }
  return {status:'wrong',hint:hint};
}

<script id="game">
(function(){
'use strict';
var L=window.SlotLogic,V=L.V;
var lang='de';

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function rnd(a){return a[Math.floor(Math.random()*a.length)];}
function shuffle(a){var i,j,t,b=a.slice();for(i=b.length-1;i>0;i--){j=Math.floor(Math.random()*(i+1));t=b[i];b[i]=b[j];b[j]=t;}return b;}

/* ================= Texte ================= */
function T(key,p){
  var s=(I18N[lang]&&I18N[lang][key]!==undefined)?I18N[lang][key]:I18N.de[key],k;
  if(s===undefined){return key;}
  if(p){for(k in p){if(p.hasOwnProperty(k)){s=s.split('{'+k+'}').join(p[k]);}}}
  return s;
}
/* Text als HTML; in RTL-Sprachen werden lateinische Fragmente (deutsche Wörter, ge-, -t …) als LTR-Block isoliert */
var LAT='-?[A-Za-zÄÖÜäöüß]+[0-9]*(?:-[A-Za-zÄÖÜäöüß]*)*';
var LATRUN=new RegExp(LAT+'(?:[ \u2013+/,]+'+LAT+')*','g');
function TH(key,p){
  var s=(I18N[lang]&&I18N[lang][key]!==undefined)?I18N[lang][key]:I18N.de[key],k;
  if(s===undefined){return key;}
  if(RTL[lang]){
    s=s.split(/(\{[a-z]+\})/).map(function(x){return /^\{[a-z]+\}$/.test(x)?x:x.replace(LATRUN,function(m){return '<bdi dir="ltr">'+m+'</bdi>';});}).join('');
  }
  if(p){for(k in p){if(p.hasOwnProperty(k)){s=s.split('{'+k+'}').join(p[k]);}}}
  return s;
}
/* deutsche Wörter im übersetzten Text: Leserichtung links-nach-rechts isolieren */
function de(s){return '<bdi class="de" dir="ltr">'+esc(s)+'</bdi>';}
var DECOMMA={de:1,pl:1,ru:1,uk:1,tr:1,ro:1,nl:1};
function num1(x){var s=x.toFixed(1);return DECOMMA[lang]?s.replace('.',','):s;}

/* ================= Aufgabengenerator ================= */
var HS_SHARE=0.22,B_SHARE=0.45,NONE_SHARE=0.35;
var NONMOD=function(p){return !p.inf;};
var POOL_ALL=[].concat(L.G.hs,L.G.a,L.G.b.u,L.G.b.n).filter(NONMOD);
var KEYS_AUX=['A','S','D','F','G'],KEYS_PP=['Q','W','E','R','T'];
var NONE='–';
var NONSENSE=['geplimplim','umgebraumpft','ankalidiert','gefrumpelt','abgeknuspft','gelumpfen','verblorken','entschnaupt','gekrixt','mitgeplorbt','eingezwabbelt','beflamunkt','zerschlimmt','ausgebraxen','gemoplig','aufgeschnurzelt','erklomptert','gepfliffert'];

function stemOf(inf){
  if(/ern$|eln$/.test(inf)){return inf.slice(0,-1);}
  if(/en$/.test(inf)){return inf.slice(0,-2);}
  return inf.slice(0,-1);
}
function wpickPhrase(list){
  var by={},keys=[],i,tot=0,r,acc=0,k,arr;
  for(i=0;i<list.length;i++){k=list[i].v;if(!by[k]){by[k]=[];keys.push(k);tot+=L.vw(k);}by[k].push(list[i]);}
  r=Math.random()*tot;k=keys[keys.length-1];
  for(i=0;i<keys.length;i++){acc+=L.vw(keys[i]);if(r<acc){k=keys[i];break;}}
  arr=by[k];return rnd(arr);
}
function candidatesPP(key){
  var v=V[key],pp=v.pp,inf=v.inf,sepPre=v.sep||'',hasGe=!(v.untr||v.ieren),baseInf=v.base?V[v.base].inf:inf;
  var bst=stemOf(baseInf),strong=/en$/.test(pp),ge=hasGe?'ge':'',c={},core;
  var end=strong?(/[td]$/.test(bst)?'et':'t'):'en';
  c.swap=sepPre+ge+bst+end;
  if(hasGe){
    c.geInf='ge'+inf;
    core=pp.slice((sepPre+'ge').length);
    c.noGe=sepPre+core;
    if(sepPre){c.misplace='ge'+pp;}
  }else{
    c.extraGe='ge'+pp;
    c.inf=inf;
    c.geSwap='ge'+c.swap;
  }
  if(strong){c.coreT=pp.slice(0,-2)+'t';}else if(hasGe){c.ppE=pp+'e';}
  c.praet=v.t[2];
  if(hasGe){c.gePraet=sepPre+'ge'+v.t[2];}
  return {c:c,strong:strong,hasGe:hasGe,sep:!!sepPre};
}
function ppOptions(key){
  var v=V[key],pp=v.pp,info=candidatesPP(key),c=info.c,order,out=[{t:v.pp,why:'correct'}],seen={},i,k;
  seen[v.pp]=true;
  if(!info.hasGe){order=info.strong?['extraGe','swap','praet','coreT','inf','geSwap']:['extraGe','swap','praet','geSwap','inf'];}
  else if(info.sep){order=info.strong?['geInf','swap','coreT','noGe','praet','misplace','gePraet']:['geInf','swap','misplace','noGe','praet','ppE'];}
  else{order=info.strong?['swap','geInf','noGe','praet','coreT','gePraet']:['swap','noGe','praet','ppE','geInf'];}
  /* nicht immer dieselben 4: Reihenfolge leicht mischen, aber 'swap' und 'noGe/extraGe' bevorzugen */
  order=order.slice(0,2).concat(shuffle(order.slice(2)));
  for(i=0;i<order.length&&out.length<5;i++){
    k=order[i];
    if(c[k]&&!seen[c[k]]){seen[c[k]]=true;out.push({t:c[k],why:k});}
  }
  var fb=['ge'+pp,pp+'e',pp+'t',pp.slice(0,-1)+'t'],q=0;
  while(out.length<5&&q<fb.length){if(!seen[fb[q]]){seen[fb[q]]=true;out.push({t:fb[q],why:'swap'});}q++;}
  return out;
}
/* Normale Aufgabe: manchmal ersetzt „–“ eine der falschen Optionen (dann ist „–“ falsch) */
function withNone(opts){
  var idx=[],i;
  if(Math.random()>=NONE_SHARE){return opts;}
  for(i=opts.length-1;i>=1;i--){idx.push(i);}
  /* bevorzugt eine der hinteren (weniger wichtigen) Optionen ersetzen */
  i=idx[Math.floor(Math.random()*Math.min(2,idx.length))];
  opts[i]={t:NONE,why:'none'};
  return opts;
}
function auxOptions(ph,subj){
  var a=L.auxOf(ph),o=(a==='haben')?'sein':'haben',i=L.IDX[subj.p],corr=V[a].p[i],out=[{t:corr,why:'correct'}],seen={},j,t,forms;
  seen[corr]=true;
  function add(t,why){if(t&&!seen[t]){seen[t]=true;out.push({t:t,why:why});}}
  add(V[o].p[i],'other_same');
  forms=shuffle(V[a].p.filter(function(x){return x!==corr;}));
  add(forms[0],'same_person');
  add(V[a].t[i],'praet');
  forms=shuffle(V[o].p.filter(function(x){return !seen[x];}));
  add(forms[0],'other_person');
  forms=shuffle(V[a].p.filter(function(x){return !seen[x];}));
  add(forms[0],'same_person');
  return out.slice(0,5);
}
/* haben/sein: gefragt ist das Präteritum. Das Perfekt (habe … gehabt) gilt als „richtig, aber unüblich“. */
function hsAuxOptions(ph,subj){
  var a=ph.v,o=(a==='haben')?'sein':'haben',i=L.IDX[subj.p],corr=V[a].t[i],out=[{t:corr,why:'correct'}],seen={},forms,n=0;
  seen[corr]=true;
  function add(t,why){if(t&&!seen[t]){seen[t]=true;out.push({t:t,why:why});}}
  add(V[a].p[i],'perf');
  add(V[o].t[i],'other_verb');
  forms=shuffle(V[a].t.filter(function(x){return !seen[x];}));
  add(forms[0],'same_person');
  add(V[o].p[i],'other_praes');
  forms=shuffle(V[a].t.filter(function(x){return !seen[x];}));
  add(forms[0],'same_person');
  forms=shuffle(V[o].t.filter(function(x){return !seen[x];}));
  add(forms[0],'other_verb');
  return out.slice(0,5);
}
function hsPPOptions(key){
  var real=V[key].pp,out=[{t:NONE,why:'none'},{t:real,why:'hsPerf'}],seen={},nons,plaus,i;
  seen[NONE]=true;seen[real]=true;
  plaus=ppOptions(key).filter(function(x){return x.why!=='correct';});
  plaus=shuffle(plaus);
  if(plaus.length&&!seen[plaus[0].t]){seen[plaus[0].t]=true;out.push({t:plaus[0].t,why:'unsinn'});}
  nons=shuffle(NONSENSE);
  for(i=0;i<nons.length&&out.length<5;i++){if(!seen[nons[i]]){seen[nons[i]]=true;out.push({t:nons[i],why:'unsinn'});}}
  return out;
}
var recent=[];
function newQuestion(cfg){
  var list,r,ph,subj,subs,time,tries=0,pre,auxs,pps,hs,idx;
  do{
    r=Math.random();
    if(cfg.retry){list=POOL_ALL.filter(function(p){return cfg.retry[p.v];});}
    else if(r<HS_SHARE){list=L.G.hs;}
    else if(cfg.mode==='B'&&Math.random()<B_SHARE){list=(Math.random()<0.45?L.G.b.u:L.G.b.n);}
    else{list=L.G.a;}
    if(!list.length){list=POOL_ALL;}
    ph=wpickPhrase(list);tries++;
  }while(recent.indexOf(ph.v)>=0&&tries<12&&!(cfg.retry&&Object.keys(cfg.retry).length<4)&&V[ph.v].kind!=='hs');
  recent.push(ph.v);if(recent.length>6){recent.shift();}
  hs=V[ph.v].kind==='hs';
  subs=L.SUBJ.filter(function(s){return L.subjOK(s,ph)&&!(ph.cn&&s.g==='x');});
  subj=rnd(subs);
  time=rnd(L.TIMES.past);
  pre=L.preFor(ph,subj.g);
  idx=L.IDX[subj.p];
  if(hs){
    auxs=shuffle(hsAuxOptions(ph,subj));pps=shuffle(hsPPOptions(ph.v));
    return {ph:ph,verb:ph.v,inf:V[ph.v].inf,subj:subj,time:time,pre:pre,auxs:auxs,pps:pps,hs:true,
      auxC:V[ph.v].t[idx],ppC:NONE,auxKind:ph.v,perfAux:V[ph.v].p[idx],perfPP:V[ph.v].pp};
  }

    auxC:V[L.auxOf(ph)].p[idx],ppC:V[ph.v].pp,auxKind:L.auxOf(ph)};
}
/* richtig / unüblich-richtig / falsch */
function judge(q,a,p){
  var okA,okP,unusual=false;
  if(q.hs){
    if(a.why==='perf'&&p.why==='hsPerf'){okA=true;okP=true;unusual=true;}
    else{okA=(a.why==='correct');okP=(p.why==='none');}
  }else{okA=(a.why==='correct');okP=(p.why==='correct');}
  return {okA:okA,okP:okP,ok:okA&&okP,unusual:unusual};
}

function symLegend(sy){

/* ================= Spielablauf ================= */
var cfg={mode:'A',minutes:3,retry:null};

}

function pickOpt(col,i){
  if(!S||!S.q||S.locked){return;}
  var q=S.q,btns,k,list=col==='a'?q.auxs:q.pps;
  if(i<0||i>=list.length){return;}
  if(col==='a'){S.sa=i;}else{S.sp=i;}
  btns=$(col==='a'?'colA':'colP').querySelectorAll('.opt');
  for(k=0;k<btns.length;k++){btns[k].className='opt'+(k===i?' sel':'');}
  $(col==='a'?'gapA':'gapP').textContent=list[i].t;
  if(S.sa!==null&&S.sp!==null){submit();}
}
function submit(){
  var q=S.q,a=q.auxs[S.sa],p=q.pps[S.sp],j=judge(q,a,p),secs=(Date.now()-S.tq)/1000,pts=0,k,btnsA,btnsP,corrP=q.hs?'none':'correct',cls,delay;
  S.locked=true;
  if(j.ok){pts=10+2*Math.min(S.streak,5);if(j.unusual){pts=Math.round(pts/2);}S.streak++;if(S.streak>S.best){S.best=S.streak;}S.score+=pts;}
  else{S.streak=0;}
  S.log.push({q:q,a:a,p:p,okA:j.okA,okP:j.okP,ok:j.ok,unusual:j.unusual,secs:secs});
  $('scoreEl').textContent='⭐ '+S.score;$('streakEl').textContent='🔥 '+S.streak;
  btnsA=$('colA').querySelectorAll('.opt');btnsP=$('colP').querySelectorAll('.opt');
  for(k=0;k<btnsA.length;k++){
    cls='opt';btnsA[k].disabled=true;
    if(j.unusual){cls+=(k===S.sa?' unu':(q.auxs[k].why==='correct'?' right':''));}
    else{cls+=(q.auxs[k].why==='correct'?' right':(k===S.sa?' wrong':''));}
    btnsA[k].className=cls;
  }
  for(k=0;k<btnsP.length;k++){
    cls='opt';btnsP[k].disabled=true;
    if(j.unusual){cls+=(k===S.sp?' unu':(q.pps[k].why===corrP?' right':''));}
    else{cls+=(q.pps[k].why===corrP?' right':(k===S.sp?' wrong':''));}
    btnsP[k].className=cls;
  }
  $('gapA').className='gap '+(j.unusual?'unu':(j.okA?'ok':'bad'));
  $('gapP').className='gap gp '+(j.unusual?'unu':(j.okP?'ok':'bad'));
  if(j.ok&&!j.unusual){
    S.fbCls='fbk good';delay=650;
    S.fbFn=function(){return TH('fb_ok',{n:pts});};
  }else if(j.unusual){
    S.fbCls='fbk unu';delay=3000;
    S.fbFn=function(){return TH('fb_unusual',{n:pts})+'<small>'+TH('fb_right')+'</small><span class="fsent">'+fullSentenceHTML(q)+'</span><small>'+TH('fb_next')+'</small>';};
  }else{
    S.fbCls='fbk bad';delay=3200;
    S.fbFn=function(){
      var m1=j.okA?TH('fb_aux_ok'):TH('fb_aux_bad',{a:de(a.t),c:de(q.auxC)});
      var m2=j.okP?TH('fb_pp_ok'):TH('fb_pp_bad',{a:de(p.t),c:de(q.ppC)});
      return '✘ '+TH('fb_right')+'<span class="fsent">'+fullSentenceHTML(q)+'</span><small>'+m1+' '+m2+'</small><small>'+TH('fb_next')+'</small>';
    };
  }
  $('fbk').className=S.fbCls;$('fbk').innerHTML=S.fbFn();
  S.adv=setTimeout(nextQ,delay);
}
function skipWait(){if(S&&S.locked&&S.adv){nextQ();}}

/* ================= Auswertung ================= */
var EX={
 aux_sein_fehlt:['Ich bin nach Hause gegangen.','Wir sind nach Spanien geflogen.','Er ist um 6 Uhr aufgestanden.','Ich bin zu Hause geblieben.'],
 aux_sein_zuviel:['Ich habe Brot gekauft.','Er hat lange geschlafen.','Wir haben im Café gesessen.','Sie hat zwei Stunden gearbeitet.'],
 aux_person:['ich habe – du hast – er/sie/es hat','wir haben – ihr habt – sie haben','ich bin – du bist – er ist','wir sind – ihr seid – sie sind'],
 aux_praet:['Perfekt: Ich habe Brot gekauft. – Ich bin nach Hause gegangen.','Präteritum: Ich hatte Hunger. – Ich war müde.',{k:'plq'}],
 pp_endung:[{s:'kaufen – gekauft, machen – gemacht, lernen – gelernt',l:'rl_reg'},{s:'gehen – gegangen, sehen – gesehen, rufen – gerufen',l:'rl_irr'},{s:'bringen – gebracht, denken – gedacht, kennen – gekannt, wissen – gewusst',l:'rl_mix'}],
 pp_geinf:['gehen → gegangen   ✘ gegehen','nehmen → genommen   ✘ genehmen','sprechen → gesprochen   ✘ gesprechen'],
 pp_gepos:['anrufen → an-ge-rufen   ✘ geanrufen','aufstehen → auf-ge-standen','einkaufen → ein-ge-kauft','mitbringen → mit-ge-bracht'],
 pp_noge:['kaufen → gekauft','anrufen → angerufen','spielen → gespielt'],
 pp_extrage:['besuchen → besucht   ✘ gebesucht','verstehen → verstanden','bekommen → bekommen','telefonieren → telefoniert'],
 pp_praet:['Präteritum: Er kaufte Brot. – Er rief an.','Perfekt: Er hat Brot gekauft. – Er hat angerufen.'],
 pp_inf:['Ich habe das Wort verstanden.   ✘ verstehen','Wir haben viel bezahlt.'],
 hs_praes:['Gestern war ich müde.','Letzte Woche hatte ich keine Zeit.',{s:'Ich hatte Hunger.',l:'no_pp'}],
 hs_verb:[{s:'Wir waren in Berlin.',l:'sein_use'},{s:'Sie war Lehrerin.',l:'sein_use'},{s:'Ich hatte Hunger.',l:'haben_use'},{s:'Wir hatten keine Zeit.',l:'haben_use'}],
 hs_mix:['Gestern war ich müde.   ✘ war gewesen','Er hatte Hunger.   ✘ hatte gehabt',{k:'plq2'}],
 pp_unsinn:['kaufen → gekauft','anrufen → angerufen','haben → gehabt, sein → gewesen','✘ geplimplim, umgebraumpft, ankalidiert'],
 pp_none:['Ich habe Brot gekauft.','Er ist nach Hause gegangen.',{s:'Ich hatte Hunger.',l:'no_pp'}]
};
function exHTML(item){
  if(typeof item==='string'){return '<li><span class="de" dir="ltr">'+esc(item)+'</span></li>';}
  if(item.k){return '<li>'+TH(item.k)+'</li>';}
  return '<li><span class="de" dir="ltr">'+esc(item.s)+'</span>'+(item.l?' <span class="lab">('+TH(item.l)+')</span>':'')+'</li>';
}
function ppReason(e){
  var w=e.p.why;
  if(e.q.hs){return w==='hsPerf'?'hs_mix':'pp_unsinn';}
  if(w==='none'){return 'pp_none';}
  if(w==='praet'||w==='gePraet'||w==='ppE'){return 'pp_praet';}
  if(w==='inf'){return 'pp_inf';}
  if(w==='noGe'){return 'pp_noge';}
  if(w==='extraGe'||w==='geSwap'){return 'pp_extrage';}
  if(w==='misplace'){return 'pp_gepos';}
  if(w==='geInf'){return V[e.q.verb].sep?'pp_gepos':'pp_geinf';}
  return 'pp_endung';
}
function auxReason(e){
  var w=e.a.why;
  if(e.q.hs){
    if(w==='perf'){return 'hs_praes';}
    if(w==='other_verb'||w==='other_praes'){return 'hs_verb';}
    return 'aux_person';
  }
  if(w==='praet'){return 'aux_praet';}
  if(w==='same_person'){return 'aux_person';}
  return e.q.auxKind==='sein'?'aux_sein_fehlt':'aux_sein_zuviel';
}
function avg(a){var s=0,i;for(i=0;i<a.length;i++){s+=a[i];}return a.length?s/a.length:0;}
function finishRound(){
  if(!S){return;}
  clearInterval(S.timer);clearTimeout(S.adv);
  var st=S;S=null;
  lastResult=st;
  renderResult(st);
}
function renderResult(st,keepScroll){
  var log=st.log,n=log.length,okN=0,uN=0,i,errs=[],aErr=0,pErr=0,both=0,h='',cnt={},verbsBy={},per={},tOk=[],tBad=[],arrow=RTL[lang]?'←':'→';
  for(i=0;i<n;i++){
    if(log[i].ok){okN++;tOk.push(log[i].secs);if(log[i].unusual){uN++;}}
    else{
      errs.push(log[i]);tBad.push(log[i].secs);
      if(!log[i].okA){aErr++;}
      if(!log[i].okP){pErr++;}
      if(!log[i].okA&&!log[i].okP){both++;}
    }
  }
  var wrongVerbs={};
  errs.forEach(function(e){
    var r=[];
    if(!e.okA){r.push(auxReason(e));}
    if(!e.okP){r.push(ppReason(e));}
    e.reasons=r;wrongVerbs[e.q.verb]=(wrongVerbs[e.q.verb]||0)+1;
    r.forEach(function(x){cnt[x]=(cnt[x]||0)+1;(verbsBy[x]=verbsBy[x]||{})[e.q.inf]=1;(per[x]=per[x]||[]).push(e);});
  });
  var pct=n?Math.round(100*okN/n):0;
  h+='<h2>'+TH('res_h')+'</h2>';
  h+='<div class="stats"><div class="stat"><b>'+n+'</b><span>'+TH('st_n')+'</span></div><div class="stat"><b>'+(okN-uN)+' ('+pct+' %)</b><span>'+TH('st_ok')+'</span></div>'
    +(uN?'<div class="stat"><b>'+uN+'</b><span>'+TH('st_unu')+'</span></div>':'')
    +'<div class="stat"><b>'+st.score+'</b><span>'+TH('st_pts')+'</span></div><div class="stat"><b>'+st.best+'</b><span>'+TH('st_best')+'</span></div><div class="stat"><b>'+(n?num1(avg(log.map(function(x){return x.secs;}))):'–')+' s</b><span>'+TH('st_sec')+'</span></div></div>';
  if(!n){h+='<p>'+TH('none_done')+'</p>';}
  else if(!errs.length){h+='<p class="good"><b>'+TH('no_err')+'</b></p>';}
  else{
    h+='<h3>'+TH('err_h',{n:errs.length})+'</h3>';
    h+='<p>'+TH('lbl_aux_bad')+': <b>'+aErr+'</b> · '+TH('lbl_pp_bad')+': <b>'+pErr+'</b>'+(both?' · '+TH('lbl_both')+': <b>'+both+'</b>':'')+'</p>';
    errs.forEach(function(e){
      h+='<div class="err"><div><span class="inf2 de" dir="ltr">'+esc(e.q.inf)+'</span></div><div class="s">'+fullSentenceHTML(e.q)+'</div><div class="m">'
        +TH('e_aux')+': '+(e.okA?'✔ '+de(e.q.auxC):'<span class="wrongtxt">'+de(e.a.t)+'</span> '+arrow+' <span class="righttxt">'+de(e.q.auxC)+'</span>')+' &nbsp;|&nbsp; '
        +TH('e_pp')+': '+(e.okP?'✔ '+de(e.q.ppC):'<span class="wrongtxt">'+de(e.p.t)+'</span> '+arrow+' <span class="righttxt">'+de(e.q.ppC)+'</span>')+'</div></div>';
    });
    h+='<h3>'+TH('ana_h')+'</h3>';
    var keys=Object.keys(cnt).sort(function(a,b){return cnt[b]-cnt[a];});
    keys.forEach(function(k){
      var vs=Object.keys(verbsBy[k]).map(de).join(', '),ex=(EX[k]||[]).map(exHTML).join('');
      h+='<div class="why"><h4><span class="n">'+cnt[k]+'×</span>'+TH(k+'_t')+'</h4>'
        +'<p><b>'+TH('lbl_cause')+'</b> '+TH(k+'_w')+'</p>'
        +'<p><b>'+TH('lbl_obs')+'</b></p><ul>'+ex+'</ul>'
        +'<div class="rule"><b>'+TH('lbl_rule')+'</b> '+TH(k+'_r')+'</div>'
        +'<p><b>'+TH('lbl_tip')+'</b> '+TH(k+'_p')+'</p>'
        +'<div class="vb">'+TH('lbl_aff')+' '+vs+'</div></div>';
    });
    var mv=['bringen','denken','kennen','wissen'].filter(function(x){return wrongVerbs[x];});
    if(mv.length&&cnt.pp_endung){h+='<div class="why"><h4>'+TH('mix_h')+'</h4><p>'+TH('mix_p',{v:mv.map(function(x){return '<b>'+de(x)+'</b>';}).join(', ')})+'</p></div>';}
    /* Tempo */
    if(tBad.length&&tOk.length){
      var a1=avg(tBad),a2=avg(tOk);
      if(a1<a2*0.8){h+='<div class="why"><h4>'+TH('tempo_h')+'</h4><p>'+TH('tempo_fast',{a:num1(a1),b:num1(a2)})+'</p></div>';}
      else if(a1>a2*1.3){h+='<div class="why"><h4>'+TH('tempo_h')+'</h4><p>'+TH('tempo_slow',{a:num1(a1),b:num1(a2)})+'</p></div>';}
    }
    /* Schwierigste Verben */
    var wv=Object.keys(wrongVerbs).sort(function(a,b){return wrongVerbs[b]-wrongVerbs[a];});
    h+='<p><b>'+TH('verbs_err')+'</b> '+wv.map(function(v){return de(V[v].inf)+(wrongVerbs[v]>1?' ('+wrongVerbs[v]+'×)':'');}).join(', ')+'</p>';
  }
  if(uN){h+='<div class="why unuw"><h4><span class="n">'+uN+'×</span>'+TH('unu_h')+'</h4><p>'+TH('unu_p')+'</p></div>';}
  h+='<div class="row">'+(errs.length?'<button type="button" class="btn big" id="btnRetry">'+TH('btn_retry')+'</button>':'')+'<button type="button" class="btn" id="btnAgain">'+TH('btn_again')+'</button><button type="button" class="btn ghost" id="btnSetup">'+TH('btn_setup')+'</button></div>';
  $('result').innerHTML=h;
  show('result');
  if(!keepScroll){window.scrollTo(0,0);}
  var wvs={};errs.forEach(function(e){wvs[e.q.verb]=1;});
  if($('btnRetry')){$('btnRetry').addEventListener('click',function(){cfg.retry=wvs;startRound();});}
  $('btnAgain').addEventListener('click',function(){cfg.retry=null;startRound();});
  $('btnSetup').addEventListener('click',function(){cfg.retry=null;lastResult=null;show('setup');});
}

/* ================= Sprache ================= */
function applyLang(){
  var els=document.querySelectorAll('[data-i18n]'),i;
  document.documentElement.lang=lang;
  document.body.className=RTL[lang]?'rtl':'';
  for(i=0;i<els.length;i++){els[i].innerHTML=TH(els[i].getAttribute('data-i18n'));}
  refreshNoneLabels();
  renderMean();
  if(S&&S.q){
    $('sent').innerHTML=sentHTML(S.q);
    /* gewählte Lücken wieder füllen */
    if(S.sa!==null){$('gapA').textContent=S.q.auxs[S.sa].t;}
    if(S.sp!==null){$('gapP').textContent=S.q.pps[S.sp].t;}
    if(S.locked&&S.log.length){
      var lg=S.log[S.log.length-1];
      $('gapA').className='gap '+(lg.unusual?'unu':(lg.okA?'ok':'bad'));
      $('gapP').className='gap gp '+(lg.unusual?'unu':(lg.okP?'ok':'bad'));
    }
    var sy=symOf(S.q.subj);$('symleg').textContent=sy?symLegend(sy):'';
    if(S.locked&&S.fbFn){$('fbk').innerHTML=S.fbFn();}
  }
  if(lastResult&&!$('result').hidden){renderResult(lastResult,true);}
  try{localStorage.setItem('blitz_lang',lang);}catch(e){}
}
function setLang(l){if(I18N[l]){lang=l;$('selLang').value=l;applyLang();}}

/* ================= Einstellungen / Ereignisse ================= */
function setMinutes(m){
  m=Math.max(1,Math.min(60,Math.round(m)||3));cfg.minutes=m;$('minutes').value=m;
  var ch=document.querySelectorAll('.chip'),i;
  for(i=0;i<ch.length;i++){ch[i].className='chip'+(parseInt(ch[i].getAttribute('data-m'),10)===m?' on':'');}
}
function setMode(m){
  cfg.mode=m;
  $('modeA').className='mode'+(m==='A'?' on':'');$('modeB').className='mode'+(m==='B'?' on':'');
}
(function(){
  var ch=document.querySelectorAll('.chip'),i,sel=$('selLang'),h='',saved=null;
  for(i=0;i<LANGS.length;i++){h+='<option value="'+LANGS[i][0]+'">'+LANGS[i][1]+'</option>';}
  sel.innerHTML=h;
  try{saved=localStorage.getItem('blitz_lang');}catch(e){}
  if(saved&&I18N[saved]){lang=saved;}
  sel.value=lang;
  sel.addEventListener('change',function(){setLang(sel.value);});
  for(i=0;i<ch.length;i++){(function(c){c.addEventListener('click',function(){setMinutes(parseInt(c.getAttribute('data-m'),10));});})(ch[i]);}
  $('minutes').addEventListener('change',function(){setMinutes(parseFloat(this.value));});
  $('modeA').addEventListener('click',function(){setMode('A');});
  $('modeB').addEventListener('click',function(){setMode('B');});
  $('btnStart').addEventListener('click',function(){setMinutes(parseFloat($('minutes').value));cfg.retry=null;startRound();});
  $('btnQuit').addEventListener('click',function(){if(S){finishRound();}});
  $('btnMean').addEventListener('click',function(){showMean=true;renderMean();});
  $('mean').addEventListener('click',function(){showMean=false;renderMean();});
  $('play').addEventListener('click',function(e){
    var b=e.target.closest?e.target.closest('.opt'):null;
    if(b&&!b.disabled){pickOpt(b.getAttribute('data-c'),parseInt(b.getAttribute('data-i'),10));}
    else if(S&&S.locked&&e.target.closest&&e.target.closest('#fbk')){skipWait();}
  });
  document.addEventListener('keydown',function(e){
    if(!S||$('play').hidden){return;}
    var k=(e.key||'').toUpperCase(),i;
    if(e.target&&e.target.tagName==='SELECT'){return;}
    if(k==='ENTER'||k===' '){e.preventDefault();skipWait();return;}
    if(e.ctrlKey||e.metaKey||e.altKey){return;}
    i=KEYS_AUX.indexOf(k);if(i>=0){pickOpt('a',i);return;}
    i=KEYS_PP.indexOf(k);if(i>=0){pickOpt('p',i);}
  });
  setMinutes(3);setMode('A');show('setup');applyLang();
})();
window.PerfektBlitz={start:function(o){if(o&&o.mode){setMode(o.mode);}cfg.retry=null;startRound(o);},newQuestion:newQuestion,cfg:cfg,auxOptions:auxOptions,ppOptions:ppOptions,
  hsAuxOptions:hsAuxOptions,hsPPOptions:hsPPOptions,judge:judge,POOL_ALL:POOL_ALL,setLang:setLang,T:T,symLegend:symLegend,fullSentence:fullSentence,state:function(){return S;},NONSENSE:NONSENSE};
})();

</script>
