<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>body{margin:0;font-family:system-ui,sans-serif}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Sprachbausteine-Diagnose DTB B2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Vazirmatn:wght@400;600&display=swap">
<style>
/* Layout: Antwortbogen-Logik – Kopf mit Reitern, darunter "Papier" (Prüfungstext) neben dem Bearbeitungsfeld; Auswertung als Profil-Liste */
:root{
  --bg:#eef0eb; --paper:#ffffff; --ink:#1c2230; --muted:#5b6474; --line:#d6dad2;
  --accent:#2c4c9c; --accent-soft:#e3e9f7; --mark:#fff0a3;
  --ok:#23704a; --ok-soft:#e1f1e7; --warn:#9a5a00; --warn-soft:#fbefd9; --bad:#ad2a20; --bad-soft:#f8e3e1;
  --f-text:"Source Serif 4", Georgia, "Times New Roman", serif;
  --f-ui:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-num:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
:root{color-scheme:light}
/* bewusst nur helles Design – unabhängig vom Dunkelmodus des Geräts */
*{box-sizing:border-box}
.langbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 16px;font-size:.88rem;color:var(--muted)}
.lb{font:inherit;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:14px;padding:4px 12px;cursor:pointer}
.lb[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.tr{margin-top:8px;padding:8px 12px;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:4px;font-size:.93rem;line-height:1.6}
.tr[dir="rtl"]{border-left:0;border-right:3px solid var(--accent);text-align:right;font-family:"Vazirmatn",var(--f-ui);font-size:.98rem;line-height:1.8}
.tr i,.tr b{unicode-bidi:plaintext}
.tr p{margin:.35em 0}.tr ul{margin:.4em 0;padding-inline-start:1.3em}.tr li{margin:.2em 0}
.tr .trskill{color:var(--muted);font-size:.86rem;margin-bottom:4px}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
header.top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between;margin-bottom:16px}
h1{font-family:var(--f-text);font-weight:600;font-size:1.7rem;line-height:1.15;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:4px 0 0;font-size:.92rem}
.namefield{display:flex;flex-direction:column;gap:4px;font-size:.8rem;color:var(--muted);letter-spacing:.03em;text-transform:uppercase}
.namefield input{font:inherit;text-transform:none;letter-spacing:0;font-size:.95rem;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:7px 10px;width:220px;max-width:100%}
nav.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:20px;scrollbar-width:thin}
nav.tabs button{font:inherit;font-size:.9rem;background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);padding:10px 12px 8px;cursor:pointer;white-space:nowrap;display:flex;gap:8px;align-items:center}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
nav.tabs button:disabled{opacity:.45;cursor:not-allowed}
.count{font-family:var(--f-num);font-size:.72rem;background:var(--accent-soft);color:var(--accent);border-radius:10px;padding:1px 7px}
.count.done{background:var(--ok-soft);color:var(--ok)}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.intro{display:grid;gap:4px;margin-bottom:16px}
.eyebrow{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.instr{background:var(--accent-soft);border-radius:8px;padding:10px 14px;font-size:.93rem}
.instr b{font-weight:600}
.grid2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:860px){.grid2{grid-template-columns:minmax(0,1fr)}}
.paper{background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:28px 30px;font-family:var(--f-text);font-size:1.06rem;line-height:1.85;min-width:0;box-shadow:0 1px 0 var(--line)}
@media (max-width:520px){.paper{padding:20px 16px;font-size:1rem}}
.paper p{margin:0 0 .9em}
.paper .meta{font-family:var(--f-ui);font-size:.8rem;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:16px;line-height:1.5}
.gap{font:inherit;display:inline-flex;align-items:baseline;gap:5px;border:0;background:none;padding:0 2px;margin:0 1px;cursor:pointer;color:inherit;border-bottom:2px solid var(--muted);border-radius:2px;line-height:1.4;vertical-align:baseline}
.gap .n{font-family:var(--f-num);font-size:.7rem;color:var(--muted);transform:translateY(-1px)}
.gap .w{min-width:4.5em;text-align:left;font-weight:600;color:var(--accent)}
.gap .w.empty{color:transparent}
.gap.active{background:var(--mark);border-bottom-color:var(--accent)}
.gap.ok{border-bottom-color:var(--ok)} .gap.ok .w{color:var(--ok)}
.gap.bad{border-bottom-color:var(--bad);background:var(--bad-soft)} .gap.bad .w{color:var(--bad)}
.gap .corr{font-weight:600;color:var(--ok)}
.gap s{opacity:.75}
span.gap{cursor:default}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:16px;min-width:0;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
@media (max-width:860px){.panel{position:static}}
.panel h3{margin:0 0 10px;font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.wordbox{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.chip{font:inherit;display:flex;align-items:center;gap:8px;text-align:left;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:6px;padding:8px 10px;cursor:pointer;min-width:0}
.chip .l{font-family:var(--f-num);font-size:.78rem;color:var(--muted);width:1em}
.chip .t{flex:1;min-width:0;overflow-wrap:anywhere}
.chip .u{font-family:var(--f-num);font-size:.7rem;color:var(--accent);background:var(--accent-soft);border-radius:8px;padding:0 6px}
.chip.used{background:var(--bg)}
.chip:hover:not(:disabled){border-color:var(--accent)}
.chip:disabled{cursor:default;opacity:.7}
.hint{font-size:.85rem;color:var(--muted);margin:10px 0 0}
.row-btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btn{font:inherit;font-weight:500;border-radius:6px;padding:9px 16px;cursor:pointer;border:1px solid var(--accent);background:var(--accent);color:var(--paper)}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.small{padding:6px 12px;font-size:.88rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.mc{display:grid;gap:10px}
.mc .it{display:grid;grid-template-columns:2.4em minmax(0,1fr);gap:8px;align-items:start}
.mc .num{font-family:var(--f-num);font-size:.85rem;color:var(--muted);padding-top:8px}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{font:inherit;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:6px;padding:6px 10px;cursor:pointer;display:flex;gap:6px;align-items:baseline}
.opt .l{font-family:var(--f-num);font-size:.75rem;color:var(--muted)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);font-weight:600}
.opt.ok{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.opt:disabled{cursor:default}
.evalbar{margin-top:24px;border-top:1px solid var(--line);padding-top:16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.confirm{background:var(--warn-soft);color:var(--ink);border-radius:8px;padding:10px 14px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
/* Auswertung */
.summary{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:22px}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:12px 16px;min-width:140px}
.stat .v{font-family:var(--f-num);font-size:1.5rem;font-variant-numeric:tabular-nums}
.stat .k{font-size:.8rem;color:var(--muted)}
h2{font-family:var(--f-text);font-weight:600;font-size:1.3rem;margin:26px 0 10px;text-wrap:balance}
.profile{display:grid;gap:0;background:var(--paper);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.prow{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) auto;gap:6px 18px;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}
.prow:first-child{border-top:0}
@media (max-width:640px){.prow{grid-template-columns:minmax(0,1fr) auto}.prow .bar{grid-column:1 / -1;grid-row:3}}
.prow .nm{font-weight:600}
.prow .ds{font-size:.85rem;color:var(--muted)}
.prow .refs{font-family:var(--f-num);font-size:.72rem;color:var(--muted);margin-top:2px}
.bar{display:flex;align-items:center;gap:10px}
.bar .track{flex:1;height:8px;border-radius:4px;background:var(--bg);overflow:hidden;display:flex}
.bar .fill{height:100%;background:var(--ok)}
.bar .fill.mid{background:var(--warn)} .bar .fill.low{background:var(--bad)}
.bar .fr{font-family:var(--f-num);font-size:.8rem;font-variant-numeric:tabular-nums;color:var(--muted);min-width:3.2em;text-align:right}
.pill{font-size:.75rem;font-weight:600;border-radius:12px;padding:3px 10px;white-space:nowrap;justify-self:end}
.pill.sicher{background:var(--ok-soft);color:var(--ok)}
.pill.teilweise{background:var(--warn-soft);color:var(--warn)}
.pill.uebung{background:var(--bad-soft);color:var(--bad)}
details.review{background:var(--paper);border:1px solid var(--line);border-radius:8px;margin-bottom:10px}
details.review>summary{cursor:pointer;padding:12px 16px;font-weight:600;display:flex;gap:10px;align-items:center;list-style:none}
details.review>summary::-webkit-details-marker{display:none}
details.review>summary::before{content:"▸";color:var(--muted);transition:transform .15s}
details.review[open]>summary::before{transform:rotate(90deg)}
.ritem{border-top:1px solid var(--line);padding:12px 16px;display:grid;grid-template-columns:3em minmax(0,1fr);gap:4px 10px}
.ritem .num{font-family:var(--f-num);font-size:.85rem;padding-top:2px}
.ritem .num.ok{color:var(--ok)} .ritem .num.bad{color:var(--bad)}
.ritem .ans{font-size:.92rem}
.ritem .skill{font-size:.8rem;color:var(--muted);margin-top:2px}
.ritem .ex{font-size:.92rem;margin-top:4px}
.tagrow{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.tag{font-size:.7rem;border:1px solid var(--line);border-radius:10px;padding:0 7px;color:var(--muted)}
/* Übungen */
.pcard{background:var(--paper);border:1px solid var(--line);border-radius:8px;margin-bottom:18px;overflow:hidden}
.pcard .ph{padding:14px 18px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
.pcard .ph h3{margin:0;font-family:var(--f-text);font-size:1.15rem;font-weight:600}
.pcard .why{padding:10px 18px;font-size:.88rem;color:var(--muted);border-bottom:1px solid var(--line)}
.rule{padding:0 18px;border-bottom:1px solid var(--line)}
.rule summary{cursor:pointer;padding:12px 0;font-weight:600;color:var(--accent)}
.rule .rb{padding-bottom:14px;font-size:.94rem;max-width:72ch}
.rule .rb p{margin:.4em 0}
.rule table{border-collapse:collapse;font-size:.88rem;margin:8px 0;min-width:340px}
.rule th,.rule td{border:1px solid var(--line);padding:4px 8px;text-align:left}
.rule th{background:var(--bg);font-weight:600}
.tw{overflow-x:auto}
.ex-list{padding:6px 18px 14px}
.exi{padding:12px 0;border-top:1px dashed var(--line)}
.exi:first-child{border-top:0}
.exi .q{font-family:var(--f-text);font-size:1.02rem;margin-bottom:8px}
.exi .q .blank{display:inline-block;min-width:3.5em;border-bottom:2px solid var(--muted);text-align:center;font-weight:600;color:var(--accent)}
.fb{margin-top:8px;font-size:.9rem;border-radius:6px;padding:8px 12px}
.fb.ok{background:var(--ok-soft)} .fb.bad{background:var(--bad-soft)}
.fb b{font-weight:600}
.pfoot{padding:10px 18px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;font-size:.9rem;background:var(--bg)}
.empty-state{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:24px;max-width:60ch}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:8px;font-size:.9rem;z-index:20}
textarea.copyfall{width:100%;min-height:160px;font-family:var(--f-num);font-size:.8rem;margin-top:10px;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div>
      <h1>Sprachbausteine-Diagnose DTB B2</h1>
      <p class="sub">Zwei Durchgänge im Prüfungsformat · Kompetenzprofil · gezielte Nachübungen</p>
    </div>
    <label class="namefield" for="tn-name">Name (optional)
      <input id="tn-name" type="text" autocomplete="off" placeholder="Vor- und Nachname">
    </label>
  </header>
  <nav class="tabs" id="tabs" role="tablist"></nav>
  <main id="view"></main>
</div>

<script>
/* ================= DATEN ================= */
const CATS = {
  konn:{name:"Konnektoren & Satzbau",desc:"Konjunktionen und Konnektoradverbien nach Bedeutung und Verbstellung unterscheiden (falls, damit, je … desto).",
    rule:`<p>Die Lücke verrät, welcher Konnektor-Typ gebraucht wird – achten Sie auf die <b>Position des Verbs</b>:</p>
<div class="tw"><table><tr><th>Typ</th><th>Beispiele</th><th>Verb</th></tr>
<tr><td>Subjunktion (Nebensatz)</td><td>weil, obwohl, falls/wenn, damit, sodass, während, nachdem, bevor, ob</td><td>am Ende</td></tr>
<tr><td>Konnektoradverb</td><td>deshalb, trotzdem, außerdem, dennoch, allerdings</td><td>direkt danach (Pos. 2)</td></tr>
<tr><td>Konjunktion (Pos. 0)</td><td>und, aber, oder, denn, sondern</td><td>Subjekt, dann Verb</td></tr></table></div>
<p><b>damit</b> vs. <b>um … zu</b>: Beide drücken einen Zweck aus. <i>um … zu</i> nur mit Infinitiv und ohne eigenes Subjekt; hat der Nebensatz ein eigenes Subjekt, braucht man <i>damit</i>.</p>
<p><b>Zweiteilige Konnektoren:</b> je + Komparativ …, desto/umso + Komparativ · sowohl … als auch · weder … noch · entweder … oder · nicht nur … sondern auch · zwar … aber.</p>
<p><b>ob</b> leitet eine indirekte Ja/Nein-Frage ein, <b>falls/wenn</b> eine Bedingung.</p>`,
    ex:[
      {q:"___ wir die Frist einhalten können, müssen alle Unterlagen bis Montag vorliegen.",o:["Damit","Um","Sodass"],a:"Damit",e:"Zweck mit eigenem Subjekt (<i>wir</i>) und konjugiertem Verb (<i>können</i>) → <b>damit</b>. <i>Um … zu</i> geht nur mit Infinitiv; <i>sodass</i> drückt eine Folge aus und steht nach dem Hauptsatz."},
      {q:"Die Lieferung kam zu spät. ___ mussten wir die Produktion unterbrechen.",o:["Deshalb","Weil","Denn"],a:"Deshalb",e:"Nach der Lücke folgt direkt das Verb (<i>mussten</i>) → Konnektoradverb auf Position 1: <b>deshalb</b>. Nach <i>weil</i> stünde das Verb am Ende, nach <i>denn</i> käme zuerst das Subjekt."},
      {q:"___ das Projekt teurer wurde als geplant, hat die Geschäftsleitung es genehmigt.",o:["Obwohl","Trotzdem","Weil"],a:"Obwohl",e:"Gegensatz + Verb am Ende (<i>wurde</i>) → <b>obwohl</b>. <i>Trotzdem</i> verlangt das Verb direkt danach; <i>weil</i> nennt einen Grund, keinen Gegensatz."},
      {q:"Je mehr Erfahrung Sie mitbringen, ___ höher ist Ihr Einstiegsgehalt.",o:["desto","als","so"],a:"desto",e:"<i>je</i> + Komparativ …, <b>desto</b> (oder <i>umso</i>) + Komparativ + Verb."},
      {q:"Wir suchen eine Person, die ___ Englisch als auch Französisch spricht.",o:["sowohl","weder","entweder"],a:"sowohl",e:"<b>sowohl … als auch</b> = beides. Zu <i>weder</i> gehört <i>noch</i>, zu <i>entweder</i> gehört <i>oder</i>."},
      {q:"Ich weiß noch nicht, ___ ich an der Schulung teilnehmen kann.",o:["ob","wenn","falls"],a:"ob",e:"Indirekte Ja/Nein-Frage (<i>Kann ich teilnehmen?</i>) → <b>ob</b>. <i>wenn</i> und <i>falls</i> leiten Bedingungen ein."}
    ]},
  praep:{name:"Präpositionen & ihr Kasus",desc:"Präpositionen nach Bedeutung (Zeitpunkt, Zeitraum, Frist, Grund, Gegensatz) und Kasus auswählen.",
    rule:`<div class="tw"><table><tr><th>Kasus</th><th>Präpositionen</th></tr>
<tr><td>Genitiv</td><td>während, wegen, trotz, innerhalb, außerhalb, aufgrund, statt, bezüglich, anlässlich</td></tr>
<tr><td>Dativ</td><td>seit, ab, aus, bei, mit, nach, von, zu, gegenüber</td></tr>
<tr><td>Akkusativ</td><td>bis, durch, für, gegen, ohne, um</td></tr></table></div>
<p><b>Zeit:</b> <i>seit</i> = Beginn in der Vergangenheit, dauert noch an (mit Präsens) · <i>ab</i> = Startpunkt, oft in der Zukunft · <i>während</i> = im Verlauf von · <i>innerhalb</i> = vor Ablauf einer Frist · <i>bis</i> = Endpunkt.</p>
<p><b>Grund vs. Gegensatz:</b> <i>wegen/aufgrund</i> nennen einen Grund, <i>trotz</i> einen Gegensatz.</p>
<p>Ohne Artikel steht <i>innerhalb</i> meist mit <i>von</i> + Dativ: <i>innerhalb von 14 Tagen</i>.</p>`,
    ex:[
      {q:"___ der Sitzung bitten wir Sie, Ihr Handy auszuschalten.",o:["Während","Seit","Bis"],a:"Während",e:"Zeitraum, in dem etwas gilt → <b>während</b> + Genitiv (<i>der Sitzung</i>)."},
      {q:"Die Rechnung ist ___ von 14 Tagen zu bezahlen.",o:["innerhalb","während","seit"],a:"innerhalb",e:"Frist → <b>innerhalb</b>. Ohne Artikel folgt <i>von</i> + Dativ: innerhalb von 14 Tagen."},
      {q:"___ des schlechten Wetters fand das Firmenfest im Freien statt.",o:["Trotz","Wegen","Aufgrund"],a:"Trotz",e:"Das Fest fand draußen statt, obwohl das Wetter schlecht war → Gegensatz: <b>trotz</b> + Genitiv. <i>wegen/aufgrund</i> nennen einen Grund."},
      {q:"___ nächstem Monat gelten neue Öffnungszeiten.",o:["Ab","Seit","Bis"],a:"Ab",e:"Startpunkt in der Zukunft → <b>ab</b> + Dativ (<i>nächstem</i>). <i>seit</i> nur für Vergangenes bis jetzt; <i>bis</i> bezeichnet ein Ende und verlangt den Akkusativ (bis nächsten Monat)."},
      {q:"Herr Novak arbeitet ___ drei Jahren in unserer Firma.",o:["seit","vor","ab"],a:"seit",e:"Beginn in der Vergangenheit, dauert bis heute an → <b>seit</b> + Dativ, mit Präsens. <i>vor drei Jahren</i> bräuchte eine Vergangenheitsform."},
      {q:"Die Kantine ist ___ des Umbaus bis Ende Mai geschlossen.",o:["wegen","trotz","innerhalb"],a:"wegen",e:"Der Umbau ist der Grund → <b>wegen</b> + Genitiv."}
    ]},
  rektion:{name:"Feste Präpositionen (Rektion)",desc:"Wissen, welche Präposition ein Verb, Nomen oder Adjektiv verlangt (bestehen in, sich freuen auf, achten auf …).",
    rule:`<p>Viele Verben, Nomen und Adjektive haben eine <b>feste Präposition</b>. Sie muss mitgelernt werden – am besten mit Kasus und Beispielsatz.</p>
<div class="tw"><table><tr><th>Ausdruck</th><th>Kasus</th><th>Beispiel</th></tr>
<tr><td>sich freuen auf / über</td><td>Akk.</td><td>auf Zukünftiges · über Geschehenes</td></tr>
<tr><td>denken an</td><td>Akk.</td><td>Denken Sie an die Frist.</td></tr>
<tr><td>bestehen in / aus</td><td>Dat.</td><td>Die Aufgabe besteht in der Planung. · Das Team besteht aus fünf Personen.</td></tr>
<tr><td>achten auf</td><td>Akk.</td><td>Achten Sie auf die Hinweise.</td></tr>
<tr><td>sich entscheiden für</td><td>Akk.</td><td>(aber: sich entschließen <b>zu</b>)</td></tr>
<tr><td>teilnehmen an</td><td>Dat.</td><td>an der Schulung</td></tr>
<tr><td>abhängen von</td><td>Dat.</td><td>von der Finanzierung</td></tr>
<tr><td>verantwortlich für</td><td>Akk.</td><td>für die Einarbeitung</td></tr>
<tr><td>Interesse an</td><td>Dat.</td><td>(aber: sich interessieren <b>für</b>)</td></tr></table></div>
<p><b>Strategie:</b> Steht die Präposition schon im Satz, suchen Sie das Verb, das dazu passt. Fehlt sie, fragen Sie: Welche Präposition verlangt das Verb?</p>`,
    ex:[
      {q:"Bitte achten Sie ___ die Sicherheitshinweise.",o:["auf","an","für"],a:"auf",e:"<b>achten auf</b> + Akkusativ."},
      {q:"Wir haben uns ___ das günstigere Angebot entschieden.",o:["für","über","zu"],a:"für",e:"<b>sich entscheiden für</b> + Akk. (<i>zu</i> gehört zu <i>sich entschließen</i>)."},
      {q:"Frau Yilmaz ist ___ die Einarbeitung neuer Kollegen verantwortlich.",o:["für","über","um"],a:"für",e:"<b>verantwortlich für</b> + Akkusativ."},
      {q:"Haben Sie Interesse ___ einer Weiterbildung?",o:["an","für","auf"],a:"an",e:"Das Nomen <b>Interesse an</b> + Dativ. Nur das Verb <i>sich interessieren</i> hat <i>für</i>."},
      {q:"Ob wir das Projekt verlängern, hängt ___ der Finanzierung ab.",o:["von","an","aus"],a:"von",e:"<b>abhängen von</b> + Dativ."},
      {q:"Wie viele Personen haben ___ der Schulung teilgenommen?",o:["an","bei","in"],a:"an",e:"<b>teilnehmen an</b> + Dativ."}
    ]},
  pronadv:{name:"Pronominaladverbien",desc:"da(r)- und wo(r)- + Präposition korrekt bilden und einsetzen (darauf, daran, worin …).",
    rule:`<p>Für <b>Sachen</b> (nicht für Personen) ersetzt man Präposition + Nomen/Pronomen durch ein Pronominaladverb:</p>
<div class="tw"><table><tr><th></th><th>Hinweis / Rückverweis</th><th>Frage / indirekte Frage</th></tr>
<tr><td>auf</td><td>darauf</td><td>worauf</td></tr><tr><td>an</td><td>daran</td><td>woran</td></tr>
<tr><td>in</td><td>darin</td><td>worin</td></tr><tr><td>über</td><td>darüber</td><td>worüber</td></tr>
<tr><td>für / mit / von</td><td>dafür / damit / davon</td><td>wofür / womit / wovon</td></tr></table></div>
<p>Beginnt die Präposition mit einem Vokal, wird ein <b>r</b> eingefügt: dar-auf, wor-in.</p>
<p>Das Pronominaladverb kann auf einen folgenden <b>dass-Satz oder Infinitivsatz</b> vorausweisen: <i>Ich freue mich <b>darauf</b>, Sie kennenzulernen.</i></p>
<p><b>Personen:</b> Präposition + Pronomen: <i>Ich verlasse mich auf <b>ihn</b>. An <b>wen</b> denken Sie?</i></p>`,
    ex:[
      {q:"Wir haben über das neue Konzept gesprochen. Was halten Sie ___?",o:["davon","darüber","dazu"],a:"davon",e:"Nach der Meinung fragt man mit <i>halten von</i> → <b>davon</b>."},
      {q:"___ haben Sie sich beim Hausmeister beschwert? – Über den Lärm im Treppenhaus.",o:["Worüber","Darüber","Wofür"],a:"Worüber",e:"Frage nach einer Sache + <i>sich beschweren über</i> → <b>worüber</b>."},
      {q:"Unser Teamleiter ist sehr zuverlässig. Wir können uns immer ___ verlassen.",o:["auf ihn","darauf","worauf"],a:"auf ihn",e:"Bei <b>Personen</b> kein Pronominaladverb, sondern Präposition + Pronomen: <b>auf ihn</b>."},
      {q:"Bitte denken Sie ___, die Fenster zu schließen.",o:["daran","darauf","dafür"],a:"daran",e:"<i>denken an</i> → <b>daran</b>, vorausweisend auf den Infinitivsatz."},
      {q:"Die Kollegin hat gefragt, ___ wir am Freitag gesprochen haben.",o:["worüber","darüber","worauf"],a:"worüber",e:"Indirekte Frage + <i>sprechen über</i> → <b>worüber</b>."},
      {q:"Vielen Dank für Ihre schnelle Hilfe! Ich habe mich sehr ___ gefreut.",o:["darüber","darauf","daran"],a:"darüber",e:"Die Hilfe ist schon geschehen → <i>sich freuen über</i> → <b>darüber</b>. Auf Zukünftiges freut man sich <i>darauf</i>."}
    ]},
  relativ:{name:"Relativpronomen",desc:"Genus/Numerus vom Bezugswort und Kasus aus dem Relativsatz ableiten (die, deren, denen …).",
    rule:`<p>Zwei Fragen: <b>1.</b> Worauf bezieht sich das Pronomen? → Genus und Zahl. <b>2.</b> Welche Rolle hat es im Relativsatz (bzw. welche Präposition steht davor)? → Kasus.</p>
<div class="tw"><table><tr><th></th><th>mask.</th><th>neutr.</th><th>fem.</th><th>Plural</th></tr>
<tr><td>Nom.</td><td>der</td><td>das</td><td>die</td><td>die</td></tr>
<tr><td>Akk.</td><td>den</td><td>das</td><td>die</td><td>die</td></tr>
<tr><td>Dat.</td><td>dem</td><td>dem</td><td>der</td><td><b>denen</b></td></tr>
<tr><td>Gen.</td><td><b>dessen</b></td><td><b>dessen</b></td><td><b>deren</b></td><td><b>deren</b></td></tr></table></div>
<p><b>dessen/deren</b> zeigen Besitz; danach steht ein Nomen <b>ohne Artikel</b>: <i>die Firma, <b>deren</b> Produkte …</i></p>`,
    ex:[
      {q:"Der Kunde, ___ wir gestern das Angebot geschickt haben, hat schon geantwortet.",o:["dem","den","der"],a:"dem",e:"Bezugswort <i>der Kunde</i> (mask.); im Relativsatz Dativobjekt (<i>wir haben <b>dem</b> Kunden das Angebot geschickt</i>) → <b>dem</b>."},
      {q:"Die Firma, ___ Produkte wir vertreiben, sitzt in Hamburg.",o:["deren","dessen","die"],a:"deren",e:"Die Produkte gehören der Firma (fem.) → Genitiv <b>deren</b>."},
      {q:"Das ist der Kollege, mit ___ ich das Projekt leite.",o:["dem","den","der"],a:"dem",e:"<i>mit</i> + Dativ, <i>der Kollege</i> mask. → <b>mit dem</b>."},
      {q:"Die Bewerber, ___ wir eine Absage geschickt haben, erhalten ihre Unterlagen zurück.",o:["denen","die","deren"],a:"denen",e:"Plural + Dativobjekt (<i>jemandem eine Absage schicken</i>) → <b>denen</b>."},
      {q:"Das Seminar, ___ Sie sich angemeldet haben, findet in Raum 204 statt.",o:["für das","für dem","das"],a:"für das",e:"<i>sich anmelden für</i> + Akk.; <i>das Seminar</i> neutral → <b>für das</b>."},
      {q:"Unser Abteilungsleiter, ___ Vertrag Ende des Jahres ausläuft, geht in Rente.",o:["dessen","deren","dem"],a:"dessen",e:"<i>der Abteilungsleiter</i> mask., Besitz (sein Vertrag) → <b>dessen</b>."}
    ]},
  kasus:{name:"Kasus- & Adjektivendungen",desc:"Den Kasus erkennen und die passende Endung bei Artikel, Possessivartikel und Adjektiv bilden.",
    rule:`<p><b>Kasus bestimmen:</b> Was verlangt das Verb (helfen + Dat., schicken + Dat. + Akk.)? Welche Präposition steht davor? Ist es ein Attribut (<i>eine Kopie <b>wessen</b>?</i> → Genitiv)?</p>
<div class="tw"><table><tr><th></th><th>mask.</th><th>neutr.</th><th>fem.</th><th>Plural</th></tr>
<tr><td>Nom.</td><td>der/ein</td><td>das/ein</td><td>die/eine</td><td>die</td></tr>
<tr><td>Akk.</td><td>den/einen</td><td>das/ein</td><td>die/eine</td><td>die</td></tr>
<tr><td>Dat.</td><td>dem/einem</td><td>dem/einem</td><td>der/einer</td><td>den (+ -n am Nomen)</td></tr>
<tr><td>Gen.</td><td>des/eines (+ -s)</td><td>des/eines (+ -s)</td><td>der/einer</td><td>der</td></tr></table></div>
<p><b>Adjektivendung:</b> Zeigt der Artikel den Kasus schon deutlich (der, dem, einen …), hat das Adjektiv meist <b>-e/-en</b>. Hat das Artikelwort keine Endung (ein, Ihr, unser im Nom./Akk.) oder fehlt es, zeigt das Adjektiv die Signalendung: <i>ein großes Interesse, mit freundlichen Grüßen</i>.</p>`,
    ex:[
      {q:"Wir suchen einen ___ Mitarbeiter für unser Team.",o:["erfahrenen","erfahrener","erfahrenem"],a:"erfahrenen",e:"<i>einen</i> zeigt Akkusativ maskulin → Adjektiv <b>-en</b>."},
      {q:"Mit ___ Grüßen",o:["freundlichen","freundlicher","freundliche"],a:"freundlichen",e:"<i>mit</i> + Dativ Plural, kein Artikel → Signalendung <b>-en</b>."},
      {q:"Die Ergebnisse ___ Umfrage liegen jetzt vor.",o:["der letzten","die letzte","den letzten"],a:"der letzten",e:"Die Ergebnisse <i>wessen</i>? → Genitiv; <i>die Umfrage</i> fem. → <b>der letzten</b> Umfrage."},
      {q:"Er hat ___ Kunden die neue Preisliste geschickt.",o:["allen","alle","aller"],a:"allen",e:"<i>jemandem etwas schicken</i>: Die Kunden sind Dativ Plural → <b>allen</b>."},
      {q:"Wir danken Ihnen für Ihr ___ Interesse.",o:["großes","großen","große"],a:"großes",e:"<i>Ihr</i> (neutr., Akk.) hat keine Endung → das Adjektiv zeigt das Genus: <b>großes</b>."},
      {q:"Ich spreche gerade mit einem ___ Kollegen.",o:["neuen","neuer","neuem"],a:"neuen",e:"<i>mit</i> + Dativ; <i>einem</i> zeigt den Kasus → Adjektiv <b>-en</b>."}
    ]},
  genus:{name:"Genus der Nomen",desc:"Das Genus wichtiger Nomen kennen bzw. an Endungen erkennen (-ung → die, das Zeugnis …).",
    rule:`<p>Das Genus entscheidet über Artikel-, Pronomen- und Adjektivendungen. Endungen helfen oft:</p>
<div class="tw"><table><tr><th>Genus</th><th>typische Endungen / Gruppen</th></tr>
<tr><td>feminin</td><td>-ung, -heit, -keit, -schaft, -ion, -tät, -ur, -ik</td></tr>
<tr><td>neutral</td><td>-ment, -um, -chen, -lein, nominalisierte Infinitive (das Lernen), viele mit Ge- (das Gehalt, das Gespräch)</td></tr>
<tr><td>maskulin</td><td>-er (Personen/Geräte), -ling, -ismus, Tage, Monate</td></tr></table></div>
<p><b>Komposita:</b> Das letzte Wort bestimmt das Genus: <i>der Vertrag → der Arbeits<b>vertrag</b></i>.</p>
<p><b>Wichtige Berufswörter:</b> der Termin, der Vertrag, der Lebenslauf, der Antrag · das Angebot, das Gehalt, das Zeugnis, das Gespräch · die Rechnung, die Frist, die Bewerbung, die Abteilung.</p>`,
    ex:[
      {q:"Haben Sie ___ Rechnung schon bezahlt?",o:["die","den","das"],a:"die",e:"<i>die Rechnung</i> (-ung → feminin), Akkusativ → <b>die</b>."},
      {q:"Wir schicken Ihnen ___ Angebot bis Freitag.",o:["das","den","die"],a:"das",e:"<i>das Angebot</i> (neutral), Akkusativ → <b>das</b>."},
      {q:"Bitte unterschreiben Sie ___ Arbeitsvertrag.",o:["den","die","das"],a:"den",e:"<i>der Vertrag</i> → <i>der Arbeitsvertrag</i>; Akkusativ → <b>den</b>."},
      {q:"Die Höhe ___ Gehalts hängt von Ihrer Erfahrung ab.",o:["des","der","dem"],a:"des",e:"<i>das Gehalt</i> (neutral) → Genitiv <b>des</b> Gehalts."},
      {q:"Ich habe morgen ___ Termin beim Personalchef.",o:["einen","eine","ein"],a:"einen",e:"<i>der Termin</i> (mask.) → Akkusativ <b>einen</b>."},
      {q:"Wir informieren Sie bald über ___ Entscheidung.",o:["unsere","unseren","unser"],a:"unsere",e:"<i>die Entscheidung</i> (-ung → fem.), <i>über</i> + Akk. → <b>unsere</b>."}
    ]},
  artikel:{name:"Bestimmter, unbestimmter oder kein Artikel",desc:"Entscheiden, ob etwas neu, bekannt/bestimmt oder allgemein ist (ein Gutschein vs. das gewünschte Angebot).",
    rule:`<p><b>Unbestimmter Artikel</b> (ein/eine): Etwas wird zum ersten Mal genannt oder ist eines von vielen.</p>
<p><b>Bestimmter Artikel</b> (der/die/das): Etwas ist bekannt, schon erwähnt, eindeutig oder genauer bestimmt – durch den Kontext (<i>das gewünschte Angebot</i>), einen Relativsatz (<i>der Lebenslauf, um den Sie gebeten haben</i>) oder einen Superlativ (<i>das beste Angebot</i>).</p>
<p><b>Kein Artikel:</b> unbestimmter Plural (<i>Wir suchen Mitarbeiter</i>), nicht zählbare Begriffe allgemein (<i>Erfahrung, Geld, Zeit</i>), Berufe nach sein/werden/als (<i>Sie ist Ingenieurin</i>), feste Wendungen (<i>Bescheid geben</i>).</p>`,
    ex:[
      {q:"Ich arbeite seit fünf Jahren als ___ Krankenpfleger.",o:["– (kein Artikel)","ein","der"],a:"– (kein Artikel)",e:"Berufe nach <i>sein, werden, als</i> stehen <b>ohne Artikel</b>."},
      {q:"Anbei finden Sie ___ Lebenslauf, um den Sie mich gebeten haben.",o:["den","einen","– (kein Artikel)"],a:"den",e:"Der Relativsatz bestimmt genau, welcher Lebenslauf gemeint ist → <b>bestimmter Artikel</b>."},
      {q:"Wir haben ___ neuen Kollegen. Er heißt Herr Petrov.",o:["einen","den","– (kein Artikel)"],a:"einen",e:"Der Kollege wird zum ersten Mal erwähnt → <b>unbestimmter Artikel</b>."},
      {q:"Für diese Stelle brauchen Sie ___ Erfahrung im Vertrieb.",o:["– (kein Artikel)","eine","die"],a:"– (kein Artikel)",e:"<i>Erfahrung</i> ist hier allgemein und nicht zählbar → <b>kein Artikel</b>."},
      {q:"Das ist ___ beste Angebot, das wir bekommen haben.",o:["das","ein","– (kein Artikel)"],a:"das",e:"Beim <b>Superlativ</b> steht immer der bestimmte Artikel."},
      {q:"Wir suchen ab sofort ___ Mitarbeiterinnen und Mitarbeiter für unser Lager.",o:["– (kein Artikel)","die","eine"],a:"– (kein Artikel)",e:"Unbestimmter <b>Plural</b> → kein Artikel (<i>ein</i> hat keinen Plural)."}
    ]},
  valenz:{name:"Verbvalenz & Reflexivpronomen",desc:"Wissen, welche Ergänzungen ein Verb braucht (Dativ, Akkusativ, reflexiv) – z. B. sich entschuldigen, beachten + Akk.",
    rule:`<p><b>Dativverben:</b> helfen, danken, gefallen, gehören, antworten, gratulieren, folgen, passen.</p>
<p><b>Dativ + Akkusativ:</b> jemandem etwas geben, schicken, mitteilen, empfehlen, anbieten.</p>
<p><b>Reflexive Verben:</b> sich entschuldigen, sich bewerben, sich beschweren, sich erkundigen, sich verlassen auf. Das Reflexivpronomen richtet sich nach dem Subjekt:</p>
<div class="tw"><table><tr><th>Subjekt</th><th>ich</th><th>du</th><th>er/sie/es</th><th>wir</th><th>ihr</th><th>sie/Sie</th></tr>
<tr><td>Akk.</td><td>mich</td><td>dich</td><td>sich</td><td>uns</td><td>euch</td><td>sich</td></tr>
<tr><td>Dat.</td><td>mir</td><td>dir</td><td>sich</td><td>uns</td><td>euch</td><td>sich</td></tr></table></div>
<p>Dativ-Reflexiv, wenn schon ein Akkusativ da ist: <i>Ich stelle <b>mir</b> das vor.</i></p>
<p><b>Mit oder ohne Präposition?</b> <i>beachten</i> + Akk. (ohne Präposition) – aber <i>achten <b>auf</b></i> + Akk.</p>`,
    ex:[
      {q:"Können Sie ___ bitte bei der Planung helfen?",o:["mir","mich","ich"],a:"mir",e:"<i>helfen</i> + Dativ → <b>mir</b>."},
      {q:"Wir möchten ___ für die Verspätung entschuldigen.",o:["uns","sich","euch"],a:"uns",e:"<i>sich entschuldigen</i>, Subjekt <i>wir</i> → <b>uns</b>."},
      {q:"Ich kann ___ gut vorstellen, im Ausland zu arbeiten.",o:["mir","mich","sich"],a:"mir",e:"<i>sich etwas vorstellen</i>: Das „etwas“ (im Ausland zu arbeiten) ist das Akkusativobjekt → Reflexivpronomen im Dativ: <b>mir</b>."},
      {q:"Bitte ___ Sie die Hinweise in der Anleitung.",o:["beachten","achten","aufpassen"],a:"beachten",e:"Direktes Akkusativobjekt ohne Präposition → <b>beachten</b>. <i>achten</i> braucht <i>auf</i>."},
      {q:"Haben Sie ___ schon nach den Öffnungszeiten erkundigt?",o:["sich","Ihnen","Sie"],a:"sich",e:"<i>sich erkundigen nach</i>; Höflichkeitsform <i>Sie</i> → <b>sich</b>."},
      {q:"Die neue Regelung gefällt ___ Kolleginnen gar nicht.",o:["den","die","der"],a:"den",e:"<i>gefallen</i> + Dativ; Dativ Plural → <b>den</b> Kolleginnen."}
    ]},
  verbform:{name:"Passiv & Hilfsverben",desc:"Passivformen (werden/worden/wurden) und Perfekt mit haben oder sein sicher bilden.",
    rule:`<div class="tw"><table><tr><th>Form</th><th>Bildung</th><th>Beispiel</th></tr>
<tr><td>Passiv Präsens</td><td>werden + Partizip II</td><td>Die Ware wird geliefert.</td></tr>
<tr><td>Passiv Präteritum</td><td>wurden + Partizip II</td><td>Die Stellen wurden geschaffen.</td></tr>
<tr><td>Passiv Perfekt</td><td>sein + Partizip II + <b>worden</b></td><td>Der Vertrag ist unterschrieben worden.</td></tr>
<tr><td>Passiv mit Modalverb</td><td>Modalverb … Partizip II + <b>werden</b></td><td>Das muss berücksichtigt werden.</td></tr></table></div>
<p><b>worden</b> nur im Passiv; <b>geworden</b> beim Vollverb <i>werden</i> (<i>Sie ist Chefin geworden</i>).</p>
<p><b>Perfekt mit sein:</b> Bewegung/Zustandsänderung ohne Akkusativobjekt (ankommen, gehen, passieren, werden). Sonst meist <b>haben</b> (bekommen, erhalten).</p>`,
    ex:[
      {q:"Die Unterlagen müssen bis Freitag eingereicht ___.",o:["werden","worden","wurden"],a:"werden",e:"Modalverb + Passiv-Infinitiv: eingereicht <b>werden</b>."},
      {q:"Der Vertrag ist gestern unterschrieben ___.",o:["worden","geworden","werden"],a:"worden",e:"Perfekt Passiv: ist + Partizip II + <b>worden</b>."},
      {q:"Was ___ in der Besprechung passiert?",o:["ist","hat","wurde"],a:"ist",e:"<i>passieren</i> bildet das Perfekt mit <b>sein</b>."},
      {q:"Im letzten Jahr ___ in unserer Firma drei neue Stellen geschaffen.",o:["wurden","worden","haben"],a:"wurden",e:"Präteritum Passiv: <b>wurden</b> + Partizip II (Subjekt: drei neue Stellen, Plural)."},
      {q:"Herr Klein ist letztes Jahr Abteilungsleiter ___.",o:["geworden","worden","werden"],a:"geworden",e:"Vollverb <i>werden</i> (= eine neue Funktion bekommen) → Partizip <b>geworden</b>."},
      {q:"Die Kunden ___ rechtzeitig über die Änderung informiert werden.",o:["sollen","sind","haben"],a:"sollen",e:"Nur ein <b>Modalverb</b> kann mit dem Passiv-Infinitiv (<i>informiert werden</i>) stehen."}
    ]},
  festeverb:{name:"Nomen-Verb-Verbindungen & Kollokationen",desc:"Feste Wortverbindungen der Berufssprache kennen (zur Verfügung stehen, einen Rabatt gewähren …).",
    rule:`<p>In festen Verbindungen trägt das Nomen die Bedeutung, das Verb ist festgelegt. Das richtige Verb lernt man nur mit der Verbindung.</p>
<div class="tw"><table><tr><th>Verbindung</th><th>Bedeutung</th></tr>
<tr><td>zur Verfügung <b>stehen</b> / <b>stellen</b></td><td>bereit sein / etwas bereitstellen (+ Akk.)</td></tr>
<tr><td>eine Entscheidung <b>treffen</b></td><td>entscheiden</td></tr>
<tr><td>einen Antrag <b>stellen</b></td><td>offiziell beantragen</td></tr>
<tr><td>in Kraft <b>treten</b></td><td>gültig werden</td></tr>
<tr><td>Rücksicht <b>nehmen</b> auf</td><td>berücksichtigen</td></tr>
<tr><td>jemandem Bescheid <b>geben</b></td><td>informieren</td></tr>
<tr><td>einen Rabatt <b>gewähren</b></td><td>einen Preisnachlass geben</td></tr>
<tr><td>einen Vertrag <b>abschließen</b></td><td>vereinbaren, unterschreiben</td></tr>
<tr><td>jemandem <b>unterläuft</b> ein Fehler</td><td>versehentlich einen Fehler machen</td></tr></table></div>`,
    ex:[
      {q:"Wir müssen bis morgen eine Entscheidung ___.",o:["treffen","machen","stellen"],a:"treffen",e:"eine Entscheidung <b>treffen</b> (nicht: machen)."},
      {q:"Die neue Regelung tritt am 1. Januar in ___.",o:["Kraft","Wirkung","Gang"],a:"Kraft",e:"Gesetze und Regeln treten in <b>Kraft</b>."},
      {q:"Wenn Sie Elterngeld möchten, müssen Sie einen Antrag ___.",o:["stellen","legen","geben"],a:"stellen",e:"einen Antrag <b>stellen</b>."},
      {q:"Bitte nehmen Sie Rücksicht ___ Ihre Kolleginnen und Kollegen.",o:["auf","für","an"],a:"auf",e:"Rücksicht nehmen <b>auf</b> + Akkusativ."},
      {q:"Bitte geben Sie mir bis Mittwoch ___, ob Sie teilnehmen.",o:["Bescheid","Meldung","Ahnung"],a:"Bescheid",e:"jemandem <b>Bescheid</b> geben = jemanden informieren."},
      {q:"Wir haben mit der Firma Krüger einen neuen Vertrag ___.",o:["abgeschlossen","zugeschlossen","beschlossen"],a:"abgeschlossen",e:"einen Vertrag <b>abschließen</b>. <i>beschließen</i> = entscheiden."}
    ]},
  wortbildung:{name:"Wortfamilien & verwechselbare Wörter",desc:"Ähnliche Wörter einer Wortfamilie nach Bedeutung unterscheiden (Durchführung/Vorführung, ankommen/bekommen …).",
    rule:`<p>Präfixe und Suffixe verändern die Bedeutung stark. Im Test stehen oft drei Wörter mit gleichem Stamm zur Wahl – prüfen Sie die <b>genaue Bedeutung</b> und die <b>Konstruktion</b> (mit Akkusativ? reflexiv? Perfekt mit sein?).</p>
<div class="tw"><table><tr><th>Wortfamilie</th><th>Unterschiede</th></tr>

const TR={};
TR.en={c:{
konn:[`Connectors & sentence structure`,`Choosing conjunctions and connecting adverbs by meaning and verb position (falls, damit, je … desto).`,
`<p>The gap tells you which type of connector is needed – look at the <b>position of the verb</b>:</p><ul><li><b>Subordinating conjunctions</b> (weil, obwohl, falls/wenn, damit, sodass, während, nachdem, bevor, ob): the verb goes to the <b>end</b> of the clause.</li><li><b>Connecting adverbs</b> (deshalb, trotzdem, außerdem, dennoch, allerdings): they take position 1, the verb follows <b>directly</b> (position 2).</li><li><b>Coordinating conjunctions</b> (und, aber, oder, denn, sondern): position 0 – then subject, then verb.</li></ul><p><b>damit</b> vs. <b>um … zu</b>: both express a purpose. <i>um … zu</i> only works with an infinitive and without its own subject; if the clause has its own subject, you need <i>damit</i>.</p><p><b>Two-part connectors:</b> je + comparative …, desto/umso + comparative (the more …, the more …) · sowohl … als auch (both … and) · weder … noch (neither … nor) · entweder … oder (either … or) · nicht nur … sondern auch (not only … but also) · zwar … aber (admittedly … but).</p><p><b>ob</b> introduces an indirect yes/no question (whether), <b>falls/wenn</b> a condition (if).</p>`],
praep:[`Prepositions & their case`,`Choosing prepositions by meaning (point in time, period, deadline, reason, contrast) and case.`,
`<p>Every preposition requires a fixed case (see the German table): <b>Genitiv</b>: während, wegen, trotz, innerhalb … · <b>Dativ</b>: seit, ab, aus, bei, mit … · <b>Akkusativ</b>: bis, durch, für, gegen, ohne, um.</p><p><b>Time:</b> <i>seit</i> = started in the past and still continues (used with the present tense) · <i>ab</i> = starting point, often in the future · <i>während</i> = during · <i>innerhalb</i> = within a deadline · <i>bis</i> = end point (until).</p><p><b>Reason vs. contrast:</b> <i>wegen/aufgrund</i> give a reason (because of), <i>trotz</i> a contrast (despite).</p><p>Without an article, <i>innerhalb</i> is usually followed by <i>von</i> + Dativ: <i>innerhalb von 14 Tagen</i>.</p>`],
rektion:[`Fixed prepositions (verb/noun/adjective + preposition)`,`Knowing which preposition a verb, noun or adjective requires (bestehen in, sich freuen auf, achten auf …).`,
`<p>Many verbs, nouns and adjectives have a <b>fixed preposition</b>. You have to learn it together with the word – ideally with the case and an example sentence (see the table).</p><ul><li><i>sich freuen auf</i> = look forward to (future) · <i>sich freuen über</i> = be happy about (something that has happened)</li><li><i>bestehen in</i> = consist in (content of a task) · <i>bestehen aus</i> = consist of (parts)</li><li><i>sich entscheiden für</i> = decide on – but <i>sich entschließen zu</i></li><li><i>Interesse an</i> + Dativ – but <i>sich interessieren für</i></li></ul><p><b>Strategy:</b> If the preposition is already in the sentence, look for the verb that goes with it. If it is missing, ask: which preposition does this verb need?</p>`],
pronadv:[`Pronominal adverbs (darauf, worin …)`,`Forming and using da(r)- and wo(r)- + preposition correctly (darauf, daran, worin …).`,
`<p>For <b>things</b> (not people), preposition + noun/pronoun is replaced by a pronominal adverb: <b>da-</b> + preposition to refer to something (darauf, daran, dafür), <b>wo-</b> + preposition in questions and indirect questions (worauf, woran, wofür).</p><p>If the preposition begins with a vowel, an <b>r</b> is inserted: dar-auf, wor-in.</p><p>The pronominal adverb can point ahead to a following <b>dass clause or infinitive clause</b>: <i>Ich freue mich <b>darauf</b>, Sie kennenzulernen.</i> (I am looking forward to meeting you.)</p><p><b>People:</b> preposition + pronoun: <i>Ich verlasse mich auf <b>ihn</b>. An <b>wen</b> denken Sie?</i></p>`],
relativ:[`Relative pronouns`,`Taking gender/number from the reference word and the case from the relative clause (die, deren, denen …).`,
`<p>Two questions: <b>1.</b> What does the pronoun refer to? → gender and number. <b>2.</b> What is its function in the relative clause (or which preposition comes before it)? → case. The forms are in the German table.</p><p>Watch out for the special forms: dative plural <b>denen</b>, genitive <b>dessen</b> (masculine/neuter) and <b>deren</b> (feminine/plural).</p><p><b>dessen/deren</b> express possession (whose); they are followed by a noun <b>without an article</b>: <i>die Firma, <b>deren</b> Produkte …</i> (the company whose products …).</p>`],
kasus:[`Case & adjective endings`,`Recognising the case and choosing the correct ending for articles, possessives and adjectives.`,
`<p><b>Determining the case:</b> What does the verb require (helfen + Dativ, schicken + Dativ + Akkusativ)? Which preposition comes before the word? Is it an attribute (<i>eine Kopie <b>wessen</b>?</i> – a copy of what? → Genitiv)?</p><p>The article forms for all four cases are in the German table. In the dative plural the noun usually gets <b>-n</b>; in the genitive masculine/neuter it gets <b>-s/-es</b>.</p><p><b>Adjective ending:</b> If the article already shows the case clearly (der, dem, einen …), the adjective usually ends in <b>-e/-en</b>. If the article word has no ending (ein, Ihr, unser in Nominativ/Akkusativ) or there is no article, the adjective shows the signal ending: <i>ein großes Interesse, mit freundlichen Grüßen</i>.</p>`],
genus:[`Noun gender`,`Knowing the gender of important nouns or recognising it from endings (-ung → die, das Zeugnis …).`,
`<p>Gender determines the endings of articles, pronouns and adjectives. Endings often help:</p><ul><li><b>feminine (die):</b> -ung, -heit, -keit, -schaft, -ion, -tät, -ur, -ik</li><li><b>neuter (das):</b> -ment, -um, -chen, -lein, infinitives used as nouns (das Lernen), many words with Ge- (das Gehalt, das Gespräch)</li><li><b>masculine (der):</b> -er (people/devices), -ling, -ismus, days, months</li></ul><p><b>Compound nouns:</b> the last word determines the gender: <i>der Vertrag → der Arbeits<b>vertrag</b></i>.</p><p><b>Important work-related words:</b> der Termin, der Vertrag, der Lebenslauf, der Antrag · das Angebot, das Gehalt, das Zeugnis, das Gespräch · die Rechnung, die Frist, die Bewerbung, die Abteilung.</p>`],
artikel:[`Definite, indefinite or no article`,`Deciding whether something is new, known/specific or general (ein Gutschein vs. das gewünschte Angebot).`,
`<p><b>Indefinite article</b> (ein/eine): something is mentioned for the first time or is one of many.</p><p><b>Definite article</b> (der/die/das): something is known, already mentioned, unique or specified – by the context (<i>das gewünschte Angebot</i> – the offer you requested), by a relative clause (<i>der Lebenslauf, um den Sie gebeten haben</i>) or by a superlative (<i>das beste Angebot</i>).</p><p><b>No article:</b> indefinite plural (<i>Wir suchen Mitarbeiter</i>), uncountable things in general (<i>Erfahrung, Geld, Zeit</i>), professions after sein/werden/als (<i>Sie ist Ingenieurin</i>), fixed expressions (<i>Bescheid geben</i>).</p>`],
valenz:[`Verb complements & reflexive pronouns`,`Knowing which complements a verb needs (dative, accusative, reflexive) – e.g. sich entschuldigen, beachten + Akkusativ.`,
`<p><b>Verbs with dative:</b> helfen, danken, gefallen, gehören, antworten, gratulieren, folgen, passen.</p><p><b>Dative + accusative:</b> jemandem etwas geben, schicken, mitteilen, empfehlen, anbieten (give/send/tell/recommend/offer someone something).</p><p><b>Reflexive verbs:</b> sich entschuldigen, sich bewerben, sich beschweren, sich erkundigen, sich verlassen auf. The reflexive pronoun agrees with the subject (see the table): ich → mich/mir, wir → uns, Sie → sich.</p><p>Use the dative reflexive pronoun if there is already an accusative object: <i>Ich stelle <b>mir</b> das vor.</i></p><p><b>With or without a preposition?</b> <i>beachten</i> + Akkusativ (no preposition) – but <i>achten <b>auf</b></i> + Akkusativ (both: pay attention to).</p>`],
verbform:[`Passive & auxiliary verbs`,`Forming passive forms (werden/worden/wurden) and the perfect tense with haben or sein correctly.`,
`<ul><li><b>Passive, present:</b> werden + Partizip II – <i>Die Ware wird geliefert.</i></li><li><b>Passive, simple past:</b> wurden + Partizip II – <i>Die Stellen wurden geschaffen.</i></li><li><b>Passive, perfect:</b> sein + Partizip II + <b>worden</b> – <i>Der Vertrag ist unterschrieben worden.</i></li><li><b>Passive with a modal verb:</b> modal verb … Partizip II + <b>werden</b> – <i>Das muss berücksichtigt werden.</i></li></ul><p><b>worden</b> only in the passive; <b>geworden</b> with the main verb <i>werden</i> = become (<i>Sie ist Chefin geworden</i>).</p><p><b>Perfect with sein:</b> movement/change of state without an accusative object (ankommen, gehen, passieren, werden). Otherwise usually <b>haben</b> (bekommen, erhalten).</p>`],
festeverb:[`Noun-verb combinations & collocations`,`Knowing fixed word combinations used at work (zur Verfügung stehen, einen Rabatt gewähren …).`,
`<p>In fixed combinations the noun carries the meaning and the verb is fixed. You can only learn the right verb together with the combination.</p><ul><li>zur Verfügung <b>stehen</b> = be available · zur Verfügung <b>stellen</b> = make something available (+ Akkusativ)</li><li>eine Entscheidung <b>treffen</b> = make a decision</li><li>einen Antrag <b>stellen</b> = submit an application</li><li>in Kraft <b>treten</b> = come into force</li><li>Rücksicht <b>nehmen</b> auf = show consideration for</li><li>jemandem Bescheid <b>geben</b> = let someone know</li><li>einen Rabatt <b>gewähren</b> = grant a discount</li><li>einen Vertrag <b>abschließen</b> = conclude a contract</li><li>jemandem <b>unterläuft</b> ein Fehler = someone makes a mistake by accident</li></ul>`],
wortbildung:[`Word families & easily confused words`,`Distinguishing similar words from one word family by meaning (Durchführung/Vorführung, ankommen/bekommen …).`,
`<p>Prefixes and suffixes change the meaning a lot. In the test you often choose between three words with the same stem – check the <b>exact meaning</b> and the <b>construction</b> (with Akkusativ? reflexive? perfect with sein?).</p><ul><li><b>bekommen</b> = receive (perfect with haben) · <b>ankommen</b> = arrive (perfect with sein) · <b>vorkommen</b> = happen, occur</li><li><b>Durchführung</b> = carrying out · <b>Vorführung</b> = demonstration · <b>Durchsetzung</b> = achieving something against resistance</li><li><b>Auftrag</b> = order (from a customer) · <b>Antrag</b> = application · <b>Vertrag</b> = contract · <b>Beitrag</b> = contribution, fee, article</li><li><b>gewähren</b> = grant · <b>sich bewähren</b> = prove itself · <b>sich gewöhnen an</b> = get used to</li><li><b>senken</b> = lower something (transitive) · <b>sinken</b> = fall, go down (intransitive)</li></ul>`]},
i:{
"1A-46":[`Relative pronoun: gender of the reference word (die Bewerbung → feminine) and case in the relative clause (accusative object of „gelesen“).`,`The relative pronoun refers to <i>Ihre Bewerbung</i> (feminine, singular). In the relative clause it is the accusative object: <i>Wir haben die Bewerbung gelesen</i> → <b>die</b>. <i>deren</i> would be genitive (possession) and does not fit here.`],
"1A-47":[`Verb with a fixed preposition (bestehen in + Dativ) and wo(r)- + preposition in an indirect question.`,`<i>bestehen in</i> = to consist in: <i>Meine Aufgaben bestanden in der Planung …</i> In an indirect question this becomes <b>wo(r) + in = worin</b>. <i>darauf/daran</i> have the wrong preposition and are not question words.`],
"1A-48":[`Connector for a condition + verb at the end of the subordinate clause.`,`The verb <i>besitzen</i> is at the end → subordinate clause with a subordinating conjunction. It expresses a condition → <b>Falls</b> (if). <i>trotzdem</i> is an adverb: the verb would have to follow directly, and the meaning (contrast) does not fit.`],
"1A-49":[`Temporal preposition with genitive (während + Genitiv).`,`<b>Während</b> + genitive describes a period of time: <i>während der Einarbeitung</i> = during the time you are being trained. <i>der</i> is genitive feminine here (die Einarbeitung).`],
"1A-50":[`Genitive attribute: possessive article in the genitive; gender of „Zeugnis“ (das).`,`<i>eine Kopie wessen?</i> (a copy of what?) → genitive. <i>das Arbeitszeugnis</i> is neuter → <b>Ihres</b> letzten Arbeitszeugnisses (noun ending in -ses). <i>Ihrem</i> would be dative.`],
"1A-51":[`sich freuen auf (future) + pronominal adverb pointing ahead to the infinitive clause.`,`You look forward to something in the future with <b>auf</b> (meeting you soon). <b>darauf</b> announces the infinitive clause. <i>daran</i> belongs to verbs like <i>denken an</i>.`],
"1B-46":[`Purpose clause: damit (own subject, conjugated verb) vs. um … zu (infinitive without subject).`,`The clause expresses a purpose and has its own subject (<i>alle</i>) with a conjugated verb (<i>können</i>) → <b>Damit</b> (so that). <i>um … zu</i> needs an infinitive with <i>zu</i> and no subject of its own.`],
"1B-47":[`Relative pronoun in the genitive plural (possession: deren Unterstützung).`,`The support comes from the colleagues (plural): <i>die Unterstützung der Kollegen</i> → genitive plural <b>deren</b> (whose). Typically a noun without an article follows. <i>denen</i> is dative plural.`],
"1B-48":[`einer/eine/einen + genitive plural („einen der beiden Termine“).`,`<i>einen der beiden Termine</i> = one of the two dates. After <i>einen</i> the whole group follows in the genitive plural: <b>der</b> beiden Termine.`],
"1B-49":[`Two-part connector je … desto/umso + comparative.`,`<i>je</i> + comparative is followed by <b>desto</b> (or umso) + comparative, then the verb: <i>… desto leichter wird euch die Umstellung fallen.</i> (the earlier …, the easier …)`],
"1B-50":[`denken an + pronominal adverb pointing ahead to the infinitive clause.`,`<i>denken</i> (remember) goes with <b>an</b>: <i>Denkt <b>daran</b>, … einzutragen.</i> <i>darauf</i> belongs to <i>achten auf, sich freuen auf</i>.`],
"1B-51":[`Passive with a modal verb: Partizip II + werden (infinitive).`,`After the modal verb <i>können</i> comes the passive infinitive: berücksichtigt <b>werden</b>. <i>worden</i> only exists in the passive perfect/past perfect (<i>ist berücksichtigt worden</i>).`],
"2A-52":[`Definiteness (the requested offer is known) + gender (das Angebot) + adjective ending.`,`Mr Brandt requested the offer – so it is known and specific: <b>das</b> gewünschte Angebot. <i>ein</i> fits neither the situation nor the ending <i>-e</i> (correct would be <i>ein gewünschtes</i>); <i>den</i> would be masculine.`],
"2A-53":[`Word family: distinguishing Durchführung / Durchsetzung / Vorführung.`,`Work is <b>durchgeführt</b> (carried out) → die <b>Durchführung</b> der Arbeiten. <i>Durchsetzung</i> = achieving something against resistance; <i>Vorführung</i> = demonstration, presentation.`],
"2A-54":[`achten auf + Akkusativ vs. beachten + Akkusativ (without preposition).`,`<i>auf</i> is already in the sentence → <b>achten auf</b> (pay attention to). <i>beachten</i> takes an accusative object without a preposition (<i>Wir beachten die Vorschriften</i>). <i>aufpassen</i> is separable and means „be careful, look after“.`],
"2A-55":[`Collocation „einen Rabatt gewähren“; distinguishing similar-sounding verbs.`,`You <b>gewähren</b> (officially grant) a discount, access or a loan. <i>sich bewähren</i> = prove itself; <i>sich gewöhnen an</i> = get used to.`],
"2A-56":[`sich entscheiden für vs. sich entschließen zu.`,`The preposition <i>für</i> is already in the sentence → sich <b>entscheiden</b> für (decide on). <i>sich entschließen</i> requires <i>zu</i>; <i>bestimmen</i> is not possible here.`],
"2A-57":[`Noun-verb combination: zur Verfügung stehen vs. zur Verfügung stellen.`,`The subject is <i>Frau Lehmann</i>, who is ready to help: she <b>steht</b> Ihnen zur Verfügung (is available to you). <i>zur Verfügung stellen</i> needs an accusative object (<i>Wir stellen Ihnen einen Raum zur Verfügung</i>).`],
"2B-52":[`Distinguishing prefix verbs (ankommen/bekommen/annehmen) + perfect with sein.`,`The cartridges did not arrive on time: <b>angekommen</b> (ankommen = reach the destination, perfect with <i>sein</i>). <i>bekommen</i> forms the perfect with <i>haben</i> and means „receive“; <i>angenommen sind</i> would be wrong without <i>worden</i>.`],
"2B-53":[`Fixed expression: jemandem unterläuft ein Fehler.`,`The fixed expression for an accidental mistake: <i>Uns ist ein Fehler <b>unterlaufen</b>.</i> <i>unterlassen</i> = refrain from doing something; <i>zustoßen</i> = something bad happens to someone (e.g. an accident).`],
"2B-54":[`Reflexive pronoun agreeing with the subject (wir → uns).`,`<i>sich entschuldigen</i> (apologise) is reflexive; the pronoun agrees with the subject <i>wir</i> → <b>uns</b>. The person you apologise to is already there (<i>bei Ihnen</i>).`],
"2B-55":[`Indefinite article for first mention + accusative masculine.`,`The voucher is mentioned for the first time → indefinite article. <i>der Gutschein</i> is masculine and the accusative object of <i>erhalten</i> → <b>einen</b>. <i>ein</i> would be nominative; <i>den</i> assumes that the voucher is already known.`],
"2B-56":[`Preposition with genitive for a deadline (innerhalb eines Jahres).`,`A deadline → <b>innerhalb</b> (within) + genitive: <i>innerhalb eines Jahres</i>. <i>seit</i> and <i>ab</i> require the dative and have a different meaning.`],
"2B-57":[`Recognising gender (-ung → feminine) + dative after „in“ (Wo? – where?).`,`<i>die Abteilung</i> (-ung → always feminine), question <i>Wo?</i> → dative: in <b>unserer</b> Versandabteilung. <i>unserem</i> would be masculine/neuter, <i>unseren</i> dative plural.`]}};

TR.tr={c:{
konn:[`Bağlaçlar ve cümle yapısı`,`Bağlaçları ve bağlaç işlevli zarfları anlamlarına ve fiilin konumuna göre ayırt etmek (falls, damit, je … desto).`,
`<p>Boşluk, hangi tür bağlacın gerektiğini gösterir – <b>fiilin konumuna</b> dikkat edin:</p><ul><li><b>Yan cümle bağlaçları</b> (weil, obwohl, falls/wenn, damit, sodass, während, nachdem, bevor, ob): fiil cümlenin <b>sonuna</b> gider.</li><li><b>Bağlaç zarfları</b> (deshalb, trotzdem, außerdem, dennoch, allerdings): 1. konumda durur, fiil <b>hemen ardından</b> gelir (2. konum).</li><li><b>Sıralama bağlaçları</b> (und, aber, oder, denn, sondern): 0. konum – önce özne, sonra fiil.</li></ul><p><b>damit</b> ve <b>um … zu</b>: ikisi de amaç bildirir. <i>um … zu</i> yalnızca mastarla ve ayrı bir özne olmadan kullanılır; yan cümlenin kendi öznesi varsa <i>damit</i> gerekir.</p><p><b>İki parçalı bağlaçlar:</b> je + karşılaştırma derecesi …, desto/umso + karşılaştırma derecesi (ne kadar …, o kadar …) · sowohl … als auch (hem … hem de) · weder … noch (ne … ne de) · entweder … oder (ya … ya da) · nicht nur … sondern auch (sadece … değil, aynı zamanda …) · zwar … aber (gerçi … ama).</p><p><b>ob</b> dolaylı evet/hayır sorusunu (… -ip -mediğini), <b>falls/wenn</b> ise koşulu (eğer) başlatır.</p>`],
praep:[`Edatlar ve aldıkları hâl`,`Edatları anlamlarına (zaman noktası, süre, son tarih, sebep, karşıtlık) ve hâllerine göre seçmek.`,
`<p>Her edat belirli bir hâl ister (Almanca tabloya bakın): <b>Genitiv</b>: während, wegen, trotz, innerhalb … · <b>Dativ</b>: seit, ab, aus, bei, mit … · <b>Akkusativ</b>: bis, durch, für, gegen, ohne, um.</p><p><b>Zaman:</b> <i>seit</i> = geçmişte başlamış ve hâlâ süren (şimdiki zamanla) · <i>ab</i> = başlangıç noktası, çoğunlukla gelecekte · <i>während</i> = süresince · <i>innerhalb</i> = bir süre içinde (son tarih) · <i>bis</i> = bitiş noktası (-e kadar).</p><p><b>Sebep ve karşıtlık:</b> <i>wegen/aufgrund</i> sebep bildirir (-den dolayı), <i>trotz</i> karşıtlık (-e rağmen).</p><p>Artikel yoksa <i>innerhalb</i>'dan sonra genellikle <i>von</i> + Dativ gelir: <i>innerhalb von 14 Tagen</i>.</p>`],
rektion:[`Sabit edatlar (fiil/isim/sıfat + edat)`,`Bir fiilin, ismin ya da sıfatın hangi edatı gerektirdiğini bilmek (bestehen in, sich freuen auf, achten auf …).`,
`<p>Birçok fiil, isim ve sıfatın <b>sabit bir edatı</b> vardır. Bu edat kelimeyle birlikte öğrenilmelidir – en iyisi hâli ve bir örnek cümleyle (tabloya bakın).</p><ul><li><i>sich freuen auf</i> = gelecekteki bir şeyi dört gözle beklemek · <i>sich freuen über</i> = olmuş bir şeye sevinmek</li><li><i>bestehen in</i> = (bir görevin içeriği) -den ibaret olmak · <i>bestehen aus</i> = (parçalardan) oluşmak</li><li><i>sich entscheiden für</i> = -de karar kılmak – ama <i>sich entschließen zu</i></li><li><i>Interesse an</i> + Dativ – ama <i>sich interessieren für</i></li></ul><p><b>Strateji:</b> Edat cümlede zaten varsa ona uyan fiili arayın. Edat yoksa şunu sorun: Bu fiil hangi edatı ister?</p>`],
pronadv:[`Zamir işlevli zarflar (darauf, worin …)`,`da(r)- ve wo(r)- + edat yapılarını doğru kurmak ve kullanmak (darauf, daran, worin …).`,
`<p><b>Nesneler</b> için (kişiler için değil) edat + isim/zamir yerine zamir işlevli zarf kullanılır: bir şeye gönderme yapmak için <b>da-</b> + edat (darauf, daran, dafür), sorularda ve dolaylı sorularda <b>wo-</b> + edat (worauf, woran, wofür).</p><p>Edat ünlüyle başlıyorsa araya <b>r</b> girer: dar-auf, wor-in.</p><p>Zamir işlevli zarf, ardından gelen bir <b>dass cümlesine veya mastar cümlesine</b> önceden işaret edebilir: <i>Ich freue mich <b>darauf</b>, Sie kennenzulernen.</i> (Sizinle tanışmayı dört gözle bekliyorum.)</p><p><b>Kişiler:</b> edat + zamir: <i>Ich verlasse mich auf <b>ihn</b>. An <b>wen</b> denken Sie?</i></p>`],
relativ:[`İlgi zamirleri`,`Cinsiyeti/sayıyı atıf yapılan kelimeden, hâli ise ilgi cümlesindeki görevden belirlemek (die, deren, denen …).`,
`<p>İki soru: <b>1.</b> Zamir neye atıf yapıyor? → cinsiyet ve sayı. <b>2.</b> İlgi cümlesindeki görevi ne (ya da önünde hangi edat var)? → hâl. Biçimler Almanca tablodadır.</p><p>Özel biçimlere dikkat: Dativ çoğul <b>denen</b>, Genitiv <b>dessen</b> (eril/nötr) ve <b>deren</b> (dişil/çoğul).</p><p><b>dessen/deren</b> iyelik bildirir; ardından <b>artikelsiz</b> bir isim gelir: <i>die Firma, <b>deren</b> Produkte …</i> (ürünleri … olan firma).</p>`],
kasus:[`Hâl ekleri ve sıfat ekleri`,`Hâli tanımak ve artikel, iyelik sözcüğü ve sıfat için doğru eki seçmek.`,
`<p><b>Hâli belirleme:</b> Fiil ne istiyor (helfen + Dativ, schicken + Dativ + Akkusativ)? Kelimenin önünde hangi edat var? Bir tamlama mı (<i>eine Kopie <b>wessen</b>?</i> – neyin kopyası? → Genitiv)?</p><p>Dört hâlin artikel biçimleri Almanca tablodadır. Dativ çoğulda isim genellikle <b>-n</b>, eril/nötr Genitivde <b>-s/-es</b> alır.</p><p><b>Sıfat eki:</b> Artikel hâli zaten açıkça gösteriyorsa (der, dem, einen …) sıfat genellikle <b>-e/-en</b> alır. Artikel sözcüğünün eki yoksa (Nominativ/Akkusativ'de ein, Ihr, unser) ya da artikel hiç yoksa, belirleyici eki sıfat taşır: <i>ein großes Interesse, mit freundlichen Grüßen</i>.</p>`],
genus:[`İsimlerin cinsiyeti`,`Önemli isimlerin cinsiyetini bilmek veya eklerinden tanımak (-ung → die, das Zeugnis …).`,
`<p>Cinsiyet; artikel, zamir ve sıfat eklerini belirler. Ekler çoğu zaman yardımcı olur:</p><ul><li><b>dişil (die):</b> -ung, -heit, -keit, -schaft, -ion, -tät, -ur, -ik</li><li><b>nötr (das):</b> -ment, -um, -chen, -lein, isimleşmiş mastarlar (das Lernen), Ge- ile başlayan birçok kelime (das Gehalt, das Gespräch)</li><li><b>eril (der):</b> -er (kişiler/aletler), -ling, -ismus, günler, aylar</li></ul><p><b>Birleşik isimler:</b> cinsiyeti son kelime belirler: <i>der Vertrag → der Arbeits<b>vertrag</b></i>.</p><p><b>İş hayatından önemli kelimeler:</b> der Termin, der Vertrag, der Lebenslauf, der Antrag · das Angebot, das Gehalt, das Zeugnis, das Gespräch · die Rechnung, die Frist, die Bewerbung, die Abteilung.</p>`],
artikel:[`Belirli artikel, belirsiz artikel ya da artikelsiz`,`Bir şeyin yeni mi, bilinen/belirli mi yoksa genel mi olduğuna karar vermek (ein Gutschein – das gewünschte Angebot).`,
`<p><b>Belirsiz artikel</b> (ein/eine): bir şeyden ilk kez söz ediliyor ya da birçoğundan biri.</p><p><b>Belirli artikel</b> (der/die/das): bir şey biliniyor, daha önce söz edilmiş, tek ya da daha ayrıntılı belirlenmiş – bağlamla (<i>das gewünschte Angebot</i> – istediğiniz teklif), bir ilgi cümlesiyle (<i>der Lebenslauf, um den Sie gebeten haben</i>) ya da en üstünlük derecesiyle (<i>das beste Angebot</i>).</p><p><b>Artikelsiz:</b> belirsiz çoğul (<i>Wir suchen Mitarbeiter</i>), genel anlamda sayılamayan kavramlar (<i>Erfahrung, Geld, Zeit</i>), sein/werden/als'tan sonra meslekler (<i>Sie ist Ingenieurin</i>), kalıp ifadeler (<i>Bescheid geben</i>).</p>`],
valenz:[`Fiil tümleçleri ve dönüşlü zamirler`,`Bir fiilin hangi tümleçlere ihtiyaç duyduğunu bilmek (Dativ, Akkusativ, dönüşlü) – örn. sich entschuldigen, beachten + Akkusativ.`,
`<p><b>Dativ alan fiiller:</b> helfen, danken, gefallen, gehören, antworten, gratulieren, folgen, passen.</p><p><b>Dativ + Akkusativ:</b> jemandem etwas geben, schicken, mitteilen, empfehlen, anbieten (birine bir şey vermek/göndermek/bildirmek/önermek/sunmak).</p><p><b>Dönüşlü fiiller:</b> sich entschuldigen, sich bewerben, sich beschweren, sich erkundigen, sich verlassen auf. Dönüşlü zamir özneye uyar (tabloya bakın): ich → mich/mir, wir → uns, Sie → sich.</p><p>Cümlede zaten bir Akkusativ nesnesi varsa dönüşlü zamir Dativ olur: <i>Ich stelle <b>mir</b> das vor.</i></p><p><b>Edatlı mı edatsız mı?</b> <i>beachten</i> + Akkusativ (edatsız) – ama <i>achten <b>auf</b></i> + Akkusativ (ikisi de: dikkat etmek).</p>`],
verbform:[`Edilgen çatı ve yardımcı fiiller`,`Edilgen biçimleri (werden/worden/wurden) ve haben ya da sein ile Perfekt'i doğru kurmak.`,
`<ul><li><b>Edilgen, şimdiki zaman:</b> werden + Partizip II – <i>Die Ware wird geliefert.</i></li><li><b>Edilgen, Präteritum:</b> wurden + Partizip II – <i>Die Stellen wurden geschaffen.</i></li><li><b>Edilgen, Perfekt:</b> sein + Partizip II + <b>worden</b> – <i>Der Vertrag ist unterschrieben worden.</i></li><li><b>Modal fiille edilgen:</b> modal fiil … Partizip II + <b>werden</b> – <i>Das muss berücksichtigt werden.</i></li></ul><p><b>worden</b> yalnızca edilgende; <b>geworden</b> ise asıl fiil <i>werden</i> (= olmak) ile kullanılır (<i>Sie ist Chefin geworden</i>).</p><p><b>sein ile Perfekt:</b> Akkusativ nesnesi olmayan hareket/durum değişikliği fiilleri (ankommen, gehen, passieren, werden). Diğerlerinde genellikle <b>haben</b> (bekommen, erhalten).</p>`],
festeverb:[`İsim-fiil birleşimleri ve eşdizimler`,`İş dilindeki kalıplaşmış söz öbeklerini bilmek (zur Verfügung stehen, einen Rabatt gewähren …).`,
`<p>Kalıplaşmış birleşimlerde anlamı isim taşır, fiil sabittir. Doğru fiil ancak birleşimle birlikte öğrenilebilir.</p><ul><li>zur Verfügung <b>stehen</b> = hizmete hazır olmak · zur Verfügung <b>stellen</b> = bir şeyi sağlamak, kullanıma sunmak (+ Akkusativ)</li><li>eine Entscheidung <b>treffen</b> = karar vermek</li><li>einen Antrag <b>stellen</b> = başvuruda bulunmak</li><li>in Kraft <b>treten</b> = yürürlüğe girmek</li><li>Rücksicht <b>nehmen</b> auf = -i dikkate almak, -e saygı göstermek</li><li>jemandem Bescheid <b>geben</b> = birine haber vermek</li><li>einen Rabatt <b>gewähren</b> = indirim yapmak</li><li>einen Vertrag <b>abschließen</b> = sözleşme yapmak</li><li>jemandem <b>unterläuft</b> ein Fehler = birinin elinde olmadan hata yapması</li></ul>`],
wortbildung:[`Kelime aileleri ve karıştırılan kelimeler`,`Aynı kelime ailesinden benzer kelimeleri anlamlarına göre ayırt etmek (Durchführung/Vorführung, ankommen/bekommen …).`,
`<p>Ön ekler ve son ekler anlamı çok değiştirir. Sınavda çoğu zaman aynı köke sahip üç kelime arasından seçim yaparsınız – <b>tam anlamı</b> ve <b>yapıyı</b> kontrol edin (Akkusativ ile mi? dönüşlü mü? sein ile Perfekt mi?).</p><ul><li><b>bekommen</b> = almak (haben ile Perfekt) · <b>ankommen</b> = varmak, ulaşmak (sein ile Perfekt) · <b>vorkommen</b> = olmak, rastlanmak</li><li><b>Durchführung</b> = yürütme, uygulama · <b>Vorführung</b> = gösteri, sunum · <b>Durchsetzung</b> = bir şeyi direnişe rağmen kabul ettirme</li><li><b>Auftrag</b> = sipariş (müşteriden) · <b>Antrag</b> = başvuru, dilekçe · <b>Vertrag</b> = sözleşme · <b>Beitrag</b> = katkı, aidat, makale</li><li><b>gewähren</b> = tanımak, vermek · <b>sich bewähren</b> = kendini kanıtlamak · <b>sich gewöhnen an</b> = -e alışmak</li><li><b>senken</b> = bir şeyi düşürmek (geçişli) · <b>sinken</b> = düşmek, azalmak (geçişsiz)</li></ul>`]},
i:{
"1A-46":[`İlgi zamiri: atıf yapılan kelimenin cinsiyeti (die Bewerbung → dişil) ve ilgi cümlesindeki hâl („gelesen“ fiilinin Akkusativ nesnesi).`,`İlgi zamiri <i>Ihre Bewerbung</i> kelimesine (dişil, tekil) atıf yapar. İlgi cümlesinde Akkusativ nesnesidir: <i>Wir haben die Bewerbung gelesen</i> → <b>die</b>. <i>deren</i> Genitiv (iyelik) olurdu ve burada uymaz.`],
"1A-47":[`Sabit edatlı fiil (bestehen in + Dativ) ve dolaylı soruda wo(r)- + edat.`,`<i>bestehen in</i> = -den ibaret olmak: <i>Meine Aufgaben bestanden in der Planung …</i> Dolaylı soruda bu <b>wo(r) + in = worin</b> olur. <i>darauf/daran</i> yanlış edatı içerir ve soru sözcüğü değildir.`],
"1A-48":[`Koşul bildiren bağlaç + yan cümlede fiilin sonda olması.`,`<i>besitzen</i> fiili cümlenin sonunda → yan cümle bağlacı gerekir. Bir koşul söz konusu → <b>Falls</b> (eğer). <i>trotzdem</i> bir zarftır: fiil hemen ardından gelmeliydi ve anlam (karşıtlık) uymuyor.`],
"1A-49":[`Genitiv alan zaman edatı (während + Genitiv).`,`<b>Während</b> + Genitiv bir süreyi anlatır: <i>während der Einarbeitung</i> = işe alıştırılma süresince. <i>der</i> burada dişil Genitivdir (die Einarbeitung).`],
"1A-50":[`Genitiv tamlaması: Genitivde iyelik sözcüğü; „Zeugnis“ kelimesinin cinsiyeti (das).`,`<i>eine Kopie wessen?</i> (neyin kopyası?) → Genitiv. <i>das Arbeitszeugnis</i> nötrdür → <b>Ihres</b> letzten Arbeitszeugnisses (isim -ses eki alır). <i>Ihrem</i> Dativ olurdu.`],
"1A-51":[`sich freuen auf (gelecek) + mastar cümlesine önceden işaret eden zamir işlevli zarf.`,`Gelecekteki bir şeyi <b>auf</b> ile beklersiniz (yakında tanışmak). <b>darauf</b> mastar cümlesini haber verir. <i>daran</i> ise <i>denken an</i> gibi fiillere aittir.`],
"1B-46":[`Amaç cümlesi: damit (kendi öznesi, çekimli fiil) ve um … zu (öznesiz mastar).`,`Cümle bir amaç bildiriyor ve kendi öznesi (<i>alle</i>) ile çekimli bir fiili (<i>können</i>) var → <b>Damit</b> (-sın diye). <i>um … zu</i> ise <i>zu</i>'lu mastar ister ve ayrı bir özne almaz.`],
"1B-47":[`Genitiv çoğulda ilgi zamiri (iyelik: deren Unterstützung).`,`Destek meslektaşlardan geliyor (çoğul): <i>die Unterstützung der Kollegen</i> → Genitiv çoğul <b>deren</b>. Genellikle ardından artikelsiz bir isim gelir. <i>denen</i> Dativ çoğuldur.`],
"1B-48":[`einer/eine/einen + Genitiv çoğul („einen der beiden Termine“).`,`<i>einen der beiden Termine</i> = iki tarihten biri. <i>einen</i>'den sonra grubun tamamı Genitiv çoğulda gelir: <b>der</b> beiden Termine.`],
"1B-49":[`İki parçalı bağlaç je … desto/umso + karşılaştırma derecesi.`,`<i>je</i> + karşılaştırma derecesinden sonra <b>desto</b> (veya umso) + karşılaştırma derecesi, ardından fiil gelir: <i>… desto leichter wird euch die Umstellung fallen.</i> (ne kadar erken …, o kadar kolay …)`],
"1B-50":[`denken an + mastar cümlesine önceden işaret eden zamir işlevli zarf.`,`<i>denken</i> (unutmamak) <b>an</b> ile kullanılır: <i>Denkt <b>daran</b>, … einzutragen.</i> <i>darauf</i> ise <i>achten auf, sich freuen auf</i> fiillerine aittir.`],
"1B-51":[`Modal fiille edilgen: Partizip II + werden (mastar).`,`<i>können</i> modal fiilinden sonra edilgen mastar gelir: berücksichtigt <b>werden</b>. <i>worden</i> yalnızca edilgen Perfekt/Plusquamperfekt'te vardır (<i>ist berücksichtigt worden</i>).`],
"2A-52":[`Belirlilik (istenen teklif biliniyor) + cinsiyet (das Angebot) + sıfat eki.`,`Bay Brandt teklifi istemişti – yani teklif biliniyor ve belirli: <b>das</b> gewünschte Angebot. <i>ein</i> ne duruma ne de <i>-e</i> ekine uyar (doğrusu <i>ein gewünschtes</i> olurdu); <i>den</i> eril olurdu.`],
"2A-53":[`Kelime ailesi: Durchführung / Durchsetzung / Vorführung ayrımı.`,`İşler <b>durchgeführt</b> edilir (yürütülür) → die <b>Durchführung</b> der Arbeiten. <i>Durchsetzung</i> = bir şeyi direnişe rağmen kabul ettirme; <i>Vorführung</i> = gösteri, sunum.`],
"2A-54":[`achten auf + Akkusativ ile beachten + Akkusativ (edatsız) ayrımı.`,`Cümlede zaten <i>auf</i> var → <b>achten auf</b> (-e dikkat etmek). <i>beachten</i> edatsız bir Akkusativ nesnesi alır (<i>Wir beachten die Vorschriften</i>). <i>aufpassen</i> ayrılabilen bir fiildir ve „dikkatli olmak, göz kulak olmak“ anlamına gelir.`],
"2A-55":[`Eşdizim „einen Rabatt gewähren“; sesçe benzer fiilleri ayırt etmek.`,`İndirim, erişim ya da kredi <b>gewährt</b> edilir (resmî olarak tanınır). <i>sich bewähren</i> = kendini kanıtlamak; <i>sich gewöhnen an</i> = -e alışmak.`],
"2A-56":[`sich entscheiden für ile sich entschließen zu ayrımı.`,`<i>für</i> edatı cümlede zaten var → sich <b>entscheiden</b> für (-de karar kılmak). <i>sich entschließen</i> <i>zu</i> ister; <i>bestimmen</i> burada mümkün değildir.`],
"2A-57":[`İsim-fiil birleşimi: zur Verfügung stehen ile zur Verfügung stellen.`,`Özne, yardıma hazır olan <i>Frau Lehmann</i>: <i>sie <b>steht</b> Ihnen zur Verfügung</i> (hizmetinize hazırdır). <i>zur Verfügung stellen</i> bir Akkusativ nesnesi ister (<i>Wir stellen Ihnen einen Raum zur Verfügung</i>).`],
"2B-52":[`Ön ekli fiilleri ayırt etmek (ankommen/bekommen/annehmen) + sein ile Perfekt.`,`Kartuşlar zamanında ulaşmadı: <b>angekommen</b> (ankommen = hedefe varmak, <i>sein</i> ile Perfekt). <i>bekommen</i> Perfekt'i <i>haben</i> ile kurar ve „almak“ demektir; <i>angenommen sind</i> ise <i>worden</i> olmadan yanlıştır.`],
"2B-53":[`Kalıp ifade: jemandem unterläuft ein Fehler.`,`İstemeden yapılan bir hata için kalıp ifade: <i>Uns ist ein Fehler <b>unterlaufen</b>.</i> <i>unterlassen</i> = bir şeyi yapmaktan kaçınmak; <i>zustoßen</i> = birinin başına kötü bir şey gelmek (örn. kaza).`],
"2B-54":[`Özneye uyan dönüşlü zamir (wir → uns).`,`<i>sich entschuldigen</i> (özür dilemek) dönüşlüdür; zamir <i>wir</i> öznesine uyar → <b>uns</b>. Özür dilenen kişi zaten cümlede var (<i>bei Ihnen</i>).`],
"2B-55":[`İlk kez söz edilen şey için belirsiz artikel + eril Akkusativ.`,`Hediye çekinden ilk kez söz ediliyor → belirsiz artikel. <i>der Gutschein</i> erildir ve <i>erhalten</i> fiilinin Akkusativ nesnesidir → <b>einen</b>. <i>ein</i> Nominativ olurdu; <i>den</i> çekin zaten bilindiğini varsayar.`],
"2B-56":[`Son tarih için Genitiv alan edat (innerhalb eines Jahres).`,`Bir süre sınırı → <b>innerhalb</b> (içinde) + Genitiv: <i>innerhalb eines Jahres</i>. <i>seit</i> ve <i>ab</i> Dativ ister ve başka anlam taşır.`],
"2B-57":[`Cinsiyeti tanımak (-ung → dişil) + „in“den sonra Dativ (Wo? – nerede?).`,`<i>die Abteilung</i> (-ung → her zaman dişil), soru <i>Wo?</i> → Dativ: in <b>unserer</b> Versandabteilung. <i>unserem</i> eril/nötr, <i>unseren</i> Dativ çoğul olurdu.`]}};
TR.ru={c:{
konn:[`Союзы и порядок слов`,`Различать союзы и союзные наречия по значению и месту глагола (falls, damit, je … desto).`,
`<p>Пропуск подсказывает, какой тип союза нужен, – обратите внимание на <b>место глагола</b>:</p><ul><li><b>Подчинительные союзы</b> (weil, obwohl, falls/wenn, damit, sodass, während, nachdem, bevor, ob): глагол стоит <b>в конце</b> предложения.</li><li><b>Союзные наречия</b> (deshalb, trotzdem, außerdem, dennoch, allerdings): стоят на 1-м месте, глагол идёт <b>сразу после них</b> (2-е место).</li><li><b>Сочинительные союзы</b> (und, aber, oder, denn, sondern): нулевая позиция – затем подлежащее, потом глагол.</li></ul><p><b>damit</b> и <b>um … zu</b>: оба выражают цель. <i>um … zu</i> – только с инфинитивом и без собственного подлежащего; если в придаточном есть своё подлежащее, нужен <i>damit</i>.</p><p><b>Парные союзы:</b> je + сравнительная степень …, desto/umso + сравнительная степень (чем …, тем …) · sowohl … als auch (как …, так и) · weder … noch (ни … ни) · entweder … oder (либо … либо) · nicht nur … sondern auch (не только …, но и) · zwar … aber (хотя … но).</p><p><b>ob</b> вводит косвенный вопрос «да/нет» (ли), <b>falls/wenn</b> – условие (если).</p>`],
praep:[`Предлоги и их падеж`,`Выбирать предлоги по значению (момент времени, период, срок, причина, противопоставление) и падежу.`,
`<p>Каждый предлог требует определённого падежа (см. немецкую таблицу): <b>Genitiv</b>: während, wegen, trotz, innerhalb … · <b>Dativ</b>: seit, ab, aus, bei, mit … · <b>Akkusativ</b>: bis, durch, für, gegen, ohne, um.</p><p><b>Время:</b> <i>seit</i> = началось в прошлом и продолжается (с настоящим временем) · <i>ab</i> = начальная точка, часто в будущем · <i>während</i> = во время · <i>innerhalb</i> = в течение (срок) · <i>bis</i> = конечная точка (до).</p><p><b>Причина и противопоставление:</b> <i>wegen/aufgrund</i> называют причину (из-за), <i>trotz</i> – противопоставление (несмотря на).</p><p>Без артикля после <i>innerhalb</i> обычно стоит <i>von</i> + Dativ: <i>innerhalb von 14 Tagen</i>.</p>`],
rektion:[`Устойчивые предлоги (управление)`,`Знать, какой предлог требует глагол, существительное или прилагательное (bestehen in, sich freuen auf, achten auf …).`,
`<p>Многие глаголы, существительные и прилагательные имеют <b>устойчивый предлог</b>. Его нужно учить вместе со словом – лучше всего с падежом и примером (см. таблицу).</p><ul><li><i>sich freuen auf</i> = радоваться предстоящему · <i>sich freuen über</i> = радоваться тому, что уже произошло</li><li><i>bestehen in</i> = заключаться в (содержание задачи) · <i>bestehen aus</i> = состоять из (частей)</li><li><i>sich entscheiden für</i> = выбрать, решиться на – но <i>sich entschließen zu</i></li><li><i>Interesse an</i> + Dativ – но <i>sich interessieren für</i></li></ul><p><b>Стратегия:</b> если предлог уже есть в предложении, ищите подходящий к нему глагол. Если предлога нет, спросите себя: какой предлог требует этот глагол?</p>`],
pronadv:[`Местоименные наречия (darauf, worin …)`,`Правильно образовывать и употреблять da(r)- и wo(r)- + предлог (darauf, daran, worin …).`,
`<p>Для <b>предметов</b> (не для людей) сочетание «предлог + существительное/местоимение» заменяется местоименным наречием: <b>da-</b> + предлог для отсылки (darauf, daran, dafür), <b>wo-</b> + предлог в вопросах и косвенных вопросах (worauf, woran, wofür).</p><p>Если предлог начинается с гласной, вставляется <b>r</b>: dar-auf, wor-in.</p><p>Местоименное наречие может указывать вперёд на следующее <b>придаточное с dass или инфинитивный оборот</b>: <i>Ich freue mich <b>darauf</b>, Sie kennenzulernen.</i> (Я с нетерпением жду знакомства с Вами.)</p><p><b>Люди:</b> предлог + местоимение: <i>Ich verlasse mich auf <b>ihn</b>. An <b>wen</b> denken Sie?</i></p>`],
relativ:[`Относительные местоимения`,`Определять род/число по слову, к которому относится местоимение, а падеж – по его роли в придаточном (die, deren, denen …).`,
`<p>Два вопроса: <b>1.</b> К чему относится местоимение? → род и число. <b>2.</b> Какую роль оно играет в придаточном (или какой предлог стоит перед ним)? → падеж. Формы – в немецкой таблице.</p><p>Обратите внимание на особые формы: Dativ мн. ч. <b>denen</b>, Genitiv <b>dessen</b> (м./ср. род) и <b>deren</b> (ж. род/мн. ч.).</p><p><b>dessen/deren</b> выражают принадлежность («чей»); после них стоит существительное <b>без артикля</b>: <i>die Firma, <b>deren</b> Produkte …</i> (фирма, чьи продукты …).</p>`],
kasus:[`Падежные окончания и окончания прилагательных`,`Распознавать падеж и выбирать правильное окончание артикля, притяжательного местоимения и прилагательного.`,
`<p><b>Как определить падеж:</b> чего требует глагол (helfen + Dativ, schicken + Dativ + Akkusativ)? Какой предлог стоит перед словом? Это определение (<i>eine Kopie <b>wessen</b>?</i> – копия чего? → Genitiv)?</p><p>Формы артиклей во всех четырёх падежах – в немецкой таблице. В Dativ мн. ч. существительное обычно получает <b>-n</b>, в Genitiv м./ср. рода – <b>-s/-es</b>.</p><p><b>Окончание прилагательного:</b> если артикль уже ясно показывает падеж (der, dem, einen …), у прилагательного обычно <b>-e/-en</b>. Если у артиклевого слова нет окончания (ein, Ihr, unser в Nominativ/Akkusativ) или артикля нет, окончание-сигнал получает прилагательное: <i>ein großes Interesse, mit freundlichen Grüßen</i>.</p>`],
genus:[`Род существительных`,`Знать род важных существительных или определять его по суффиксам (-ung → die, das Zeugnis …).`,
`<p>Род определяет окончания артиклей, местоимений и прилагательных. Часто помогают суффиксы:</p><ul><li><b>женский род (die):</b> -ung, -heit, -keit, -schaft, -ion, -tät, -ur, -ik</li><li><b>средний род (das):</b> -ment, -um, -chen, -lein, субстантивированные инфинитивы (das Lernen), многие слова на Ge- (das Gehalt, das Gespräch)</li><li><b>мужской род (der):</b> -er (люди/приборы), -ling, -ismus, дни недели, месяцы</li></ul><p><b>Сложные слова:</b> род определяет последнее слово: <i>der Vertrag → der Arbeits<b>vertrag</b></i>.</p><p><b>Важные слова из профессиональной сферы:</b> der Termin, der Vertrag, der Lebenslauf, der Antrag · das Angebot, das Gehalt, das Zeugnis, das Gespräch · die Rechnung, die Frist, die Bewerbung, die Abteilung.</p>`],
artikel:[`Определённый, неопределённый артикль или без артикля`,`Решать, является ли что-то новым, известным/конкретным или общим (ein Gutschein – das gewünschte Angebot).`,
