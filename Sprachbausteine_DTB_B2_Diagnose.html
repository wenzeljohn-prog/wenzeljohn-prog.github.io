TR.en.x={
konn:[`Purpose with its own subject (<i>wir</i>) and a conjugated verb (<i>können</i>) → <b>damit</b>. <i>Um … zu</i> only works with an infinitive; <i>sodass</i> expresses a result and comes after the main clause.`,`The verb follows directly after the gap (<i>mussten</i>) → connecting adverb in position 1: <b>deshalb</b>. After <i>weil</i> the verb would be at the end; after <i>denn</i> the subject would come first.`,`Contrast + verb at the end (<i>wurde</i>) → <b>obwohl</b>. <i>Trotzdem</i> needs the verb directly after it; <i>weil</i> gives a reason, not a contrast.`,`<i>je</i> + comparative …, <b>desto</b> (or <i>umso</i>) + comparative + verb.`,`<b>sowohl … als auch</b> = both. <i>weder</i> goes with <i>noch</i>, <i>entweder</i> goes with <i>oder</i>.`,`Indirect yes/no question (<i>Kann ich teilnehmen?</i>) → <b>ob</b> (whether). <i>wenn</i> and <i>falls</i> introduce conditions.`],
praep:[`A period during which something applies → <b>während</b> + Genitiv (<i>der Sitzung</i>).`,`A deadline → <b>innerhalb</b>. Without an article, <i>von</i> + Dativ follows: innerhalb von 14 Tagen.`,`The party was outside although the weather was bad → contrast: <b>trotz</b> + Genitiv. <i>wegen/aufgrund</i> give a reason.`,`Starting point in the future → <b>ab</b> + Dativ (<i>nächstem</i>). <i>seit</i> is only for something from the past until now; <i>bis</i> marks an end and takes the accusative (bis nächsten Monat).`,`Started in the past and still continues → <b>seit</b> + Dativ, with the present tense. <i>vor drei Jahren</i> would need a past tense.`,`The renovation is the reason → <b>wegen</b> + Genitiv.`],
rektion:[`<b>achten auf</b> + Akkusativ.`,`<b>sich entscheiden für</b> + Akkusativ (<i>zu</i> belongs to <i>sich entschließen</i>).`,`<b>verantwortlich für</b> + Akkusativ.`,`The noun <b>Interesse an</b> + Dativ. Only the verb <i>sich interessieren</i> takes <i>für</i>.`,`<b>abhängen von</b> + Dativ.`,`<b>teilnehmen an</b> + Dativ.`],
pronadv:[`You ask for an opinion with <i>halten von</i> → <b>davon</b>.`,`Question about a thing + <i>sich beschweren über</i> → <b>worüber</b>.`,`For <b>people</b> there is no pronominal adverb, but preposition + pronoun: <b>auf ihn</b>.`,`<i>denken an</i> → <b>daran</b>, pointing ahead to the infinitive clause.`,`Indirect question + <i>sprechen über</i> → <b>worüber</b>.`,`The help has already happened → <i>sich freuen über</i> → <b>darüber</b>. For something in the future: <i>darauf</i>.`],
relativ:[`Reference word <i>der Kunde</i> (masculine); in the relative clause it is the dative object (<i>wir haben <b>dem</b> Kunden das Angebot geschickt</i>) → <b>dem</b>.`,`The products belong to the company (feminine) → genitive <b>deren</b>.`,`<i>mit</i> + Dativ, <i>der Kollege</i> masculine → <b>mit dem</b>.`,`Plural + dative object (<i>jemandem eine Absage schicken</i>) → <b>denen</b>.`,`<i>sich anmelden für</i> + Akkusativ; <i>das Seminar</i> is neuter → <b>für das</b>.`,`<i>der Abteilungsleiter</i> is masculine, possession (his contract) → <b>dessen</b>.`],
kasus:[`<i>einen</i> shows accusative masculine → adjective <b>-en</b>.`,`<i>mit</i> + dative plural, no article → signal ending <b>-en</b>.`,`The results of what? → genitive; <i>die Umfrage</i> is feminine → <b>der letzten</b> Umfrage.`,`<i>jemandem etwas schicken</i>: the customers are dative plural → <b>allen</b>.`,`<i>Ihr</i> (neuter, accusative) has no ending → the adjective shows the gender: <b>großes</b>.`,`<i>mit</i> + Dativ; <i>einem</i> shows the case → adjective <b>-en</b>.`],
genus:[`<i>die Rechnung</i> (-ung → feminine), accusative → <b>die</b>.`,`<i>das Angebot</i> (neuter), accusative → <b>das</b>.`,`<i>der Vertrag</i> → <i>der Arbeitsvertrag</i>; accusative → <b>den</b>.`,`<i>das Gehalt</i> (neuter) → genitive <b>des</b> Gehalts.`,`<i>der Termin</i> (masculine) → accusative <b>einen</b>.`,`<i>die Entscheidung</i> (-ung → feminine), <i>über</i> + Akkusativ → <b>unsere</b>.`],
artikel:[`Professions after <i>sein, werden, als</i> take <b>no article</b>.`,`The relative clause specifies exactly which CV is meant → <b>definite article</b>.`,`The colleague is mentioned for the first time → <b>indefinite article</b>.`,`<i>Erfahrung</i> is general and uncountable here → <b>no article</b>.`,`With a <b>superlative</b> there is always the definite article.`,`Indefinite <b>plural</b> → no article (<i>ein</i> has no plural).`],
valenz:[`<i>helfen</i> + Dativ → <b>mir</b>.`,`<i>sich entschuldigen</i>, subject <i>wir</i> → <b>uns</b>.`,`<i>sich etwas vorstellen</i>: the "something" (im Ausland zu arbeiten) is the accusative object → reflexive pronoun in the dative: <b>mir</b>.`,`Direct accusative object without a preposition → <b>beachten</b>. <i>achten</i> needs <i>auf</i>.`,`<i>sich erkundigen nach</i>; polite form <i>Sie</i> → <b>sich</b>.`,`<i>gefallen</i> + Dativ; dative plural → <b>den</b> Kolleginnen.`],
verbform:[`Modal verb + passive infinitive: eingereicht <b>werden</b>.`,`Passive perfect: ist + Partizip II + <b>worden</b>.`,`<i>passieren</i> forms the perfect with <b>sein</b>.`,`Passive simple past: <b>wurden</b> + Partizip II (subject: drei neue Stellen, plural).`,`Main verb <i>werden</i> (= become, get a new position) → participle <b>geworden</b>.`,`Only a <b>modal verb</b> can be used with the passive infinitive (<i>informiert werden</i>).`],
festeverb:[`eine Entscheidung <b>treffen</b> (not: machen) = make a decision.`,`Laws and rules come into force: in <b>Kraft</b> treten.`,`einen Antrag <b>stellen</b> = submit an application.`,`Rücksicht nehmen <b>auf</b> + Akkusativ = show consideration for.`,`jemandem <b>Bescheid</b> geben = let someone know.`,`einen Vertrag <b>abschließen</b> = conclude a contract. <i>beschließen</i> = decide.`],
wortbildung:[`<b>Auftrag</b> = an order from a customer. <i>Antrag</i> = official application; <i>Beitrag</i> = contribution, payment or article.`,`<b>sich bewähren</b> = prove itself. <i>gewähren</i> = grant; <i>sich gewöhnen</i> needs <i>an</i>.`,`<b>bekommen</b> = receive. <i>ankommen</i> = arrive; <i>vorkommen</i> = happen.`,`<b>Vorstellung</b> of a product = presentation. <i>Einstellung</i> = attitude or hiring an employee.`,`With an accusative object (<i>die Kosten</i>) → transitive <b>senken</b> (lower). <i>sinken</i> is intransitive: Die Kosten sinken.`,`<b>benachrichtigen</b> = inform. <i>berichtigen</i> = correct.`]};

TR.tr.x={
konn:[`Kendi öznesi (<i>wir</i>) ve çekimli fiili (<i>können</i>) olan amaç → <b>damit</b>. <i>Um … zu</i> yalnızca mastarla kullanılır; <i>sodass</i> bir sonuç bildirir ve ana cümleden sonra gelir.`,`Boşluktan hemen sonra fiil geliyor (<i>mussten</i>) → 1. konumda bağlaç zarfı: <b>deshalb</b>. <i>weil</i>'den sonra fiil sonda olurdu; <i>denn</i>'den sonra önce özne gelirdi.`,`Karşıtlık + fiil sonda (<i>wurde</i>) → <b>obwohl</b>. <i>Trotzdem</i>'den sonra fiil hemen gelmelidir; <i>weil</i> karşıtlık değil, sebep bildirir.`,`<i>je</i> + karşılaştırma derecesi …, <b>desto</b> (veya <i>umso</i>) + karşılaştırma derecesi + fiil.`,`<b>sowohl … als auch</b> = hem … hem de. <i>weder</i> ile <i>noch</i>, <i>entweder</i> ile <i>oder</i> kullanılır.`,`Dolaylı evet/hayır sorusu (<i>Kann ich teilnehmen?</i>) → <b>ob</b>. <i>wenn</i> ve <i>falls</i> koşul başlatır.`],
praep:[`Bir şeyin geçerli olduğu süre → <b>während</b> + Genitiv (<i>der Sitzung</i>).`,`Son tarih → <b>innerhalb</b>. Artikel yoksa <i>von</i> + Dativ gelir: innerhalb von 14 Tagen.`,`Hava kötü olmasına rağmen kutlama dışarıda yapıldı → karşıtlık: <b>trotz</b> + Genitiv. <i>wegen/aufgrund</i> sebep bildirir.`,`Gelecekte bir başlangıç noktası → <b>ab</b> + Dativ (<i>nächstem</i>). <i>seit</i> yalnızca geçmişten bugüne süren şeyler için; <i>bis</i> bir bitiş bildirir ve Akkusativ alır (bis nächsten Monat).`,`Geçmişte başlamış ve süren → <b>seit</b> + Dativ, şimdiki zamanla. <i>vor drei Jahren</i> geçmiş zaman gerektirirdi.`,`Sebep tadilat → <b>wegen</b> + Genitiv.`],
rektion:[`<b>achten auf</b> + Akkusativ.`,`<b>sich entscheiden für</b> + Akkusativ (<i>zu</i>, <i>sich entschließen</i>'e aittir).`,`<b>verantwortlich für</b> + Akkusativ.`,`İsim <b>Interesse an</b> + Dativ. Yalnızca <i>sich interessieren</i> fiili <i>für</i> alır.`,`<b>abhängen von</b> + Dativ.`,`<b>teilnehmen an</b> + Dativ.`],
pronadv:[`Fikir sorulurken <i>halten von</i> kullanılır → <b>davon</b>.`,`Bir nesne hakkında soru + <i>sich beschweren über</i> → <b>worüber</b>.`,`<b>Kişiler</b> için zamir işlevli zarf kullanılmaz; edat + zamir: <b>auf ihn</b>.`,`<i>denken an</i> → <b>daran</b>, mastar cümlesine önceden işaret eder.`,`Dolaylı soru + <i>sprechen über</i> → <b>worüber</b>.`,`Yardım zaten yapıldı → <i>sich freuen über</i> → <b>darüber</b>. Gelecekteki bir şey için: <i>darauf</i>.`],
relativ:[`Atıf yapılan kelime <i>der Kunde</i> (eril); ilgi cümlesinde Dativ nesnesi (<i>wir haben <b>dem</b> Kunden das Angebot geschickt</i>) → <b>dem</b>.`,`Ürünler firmaya ait (dişil) → Genitiv <b>deren</b>.`,`<i>mit</i> + Dativ, <i>der Kollege</i> eril → <b>mit dem</b>.`,`Çoğul + Dativ nesnesi (<i>jemandem eine Absage schicken</i>) → <b>denen</b>.`,`<i>sich anmelden für</i> + Akkusativ; <i>das Seminar</i> nötr → <b>für das</b>.`,`<i>der Abteilungsleiter</i> eril, iyelik (onun sözleşmesi) → <b>dessen</b>.`],
kasus:[`<i>einen</i> eril Akkusativi gösteriyor → sıfat <b>-en</b>.`,`<i>mit</i> + Dativ çoğul, artikel yok → belirleyici ek <b>-en</b>.`,`Neyin sonuçları? → Genitiv; <i>die Umfrage</i> dişil → <b>der letzten</b> Umfrage.`,`<i>jemandem etwas schicken</i>: müşteriler Dativ çoğul → <b>allen</b>.`,`<i>Ihr</i> (nötr, Akkusativ) ek almaz → cinsiyeti sıfat gösterir: <b>großes</b>.`,`<i>mit</i> + Dativ; <i>einem</i> hâli gösteriyor → sıfat <b>-en</b>.`],
genus:[`<i>die Rechnung</i> (-ung → dişil), Akkusativ → <b>die</b>.`,`<i>das Angebot</i> (nötr), Akkusativ → <b>das</b>.`,`<i>der Vertrag</i> → <i>der Arbeitsvertrag</i>; Akkusativ → <b>den</b>.`,`<i>das Gehalt</i> (nötr) → Genitiv <b>des</b> Gehalts.`,`<i>der Termin</i> (eril) → Akkusativ <b>einen</b>.`,`<i>die Entscheidung</i> (-ung → dişil), <i>über</i> + Akkusativ → <b>unsere</b>.`],
artikel:[`<i>sein, werden, als</i>'tan sonra meslekler <b>artikelsiz</b> kullanılır.`,`İlgi cümlesi hangi özgeçmişin kastedildiğini tam olarak belirtiyor → <b>belirli artikel</b>.`,`Meslektaştan ilk kez söz ediliyor → <b>belirsiz artikel</b>.`,`<i>Erfahrung</i> burada genel ve sayılamaz → <b>artikelsiz</b>.`,`<b>En üstünlük derecesinde</b> her zaman belirli artikel kullanılır.`,`Belirsiz <b>çoğul</b> → artikelsiz (<i>ein</i>'in çoğulu yoktur).`],
valenz:[`<i>helfen</i> + Dativ → <b>mir</b>.`,`<i>sich entschuldigen</i>, özne <i>wir</i> → <b>uns</b>.`,`<i>sich etwas vorstellen</i>: „bir şey“ (im Ausland zu arbeiten) Akkusativ nesnesidir → dönüşlü zamir Dativ: <b>mir</b>.`,`Edatsız doğrudan Akkusativ nesnesi → <b>beachten</b>. <i>achten</i> <i>auf</i> ister.`,`<i>sich erkundigen nach</i>; nezaket biçimi <i>Sie</i> → <b>sich</b>.`,`<i>gefallen</i> + Dativ; Dativ çoğul → <b>den</b> Kolleginnen.`],
verbform:[`Modal fiil + edilgen mastar: eingereicht <b>werden</b>.`,`Edilgen Perfekt: ist + Partizip II + <b>worden</b>.`,`<i>passieren</i> Perfekt'i <b>sein</b> ile kurar.`,`Edilgen Präteritum: <b>wurden</b> + Partizip II (özne: drei neue Stellen, çoğul).`,`Asıl fiil <i>werden</i> (= olmak, yeni bir göreve gelmek) → ortaç <b>geworden</b>.`,`Edilgen mastarla (<i>informiert werden</i>) yalnızca bir <b>modal fiil</b> kullanılabilir.`],
festeverb:[`eine Entscheidung <b>treffen</b> (machen değil) = karar vermek.`,`Yasalar ve kurallar yürürlüğe girer: in <b>Kraft</b> treten.`,`einen Antrag <b>stellen</b> = başvuruda bulunmak.`,`Rücksicht nehmen <b>auf</b> + Akkusativ = -i dikkate almak.`,`jemandem <b>Bescheid</b> geben = birine haber vermek.`,`einen Vertrag <b>abschließen</b> = sözleşme yapmak. <i>beschließen</i> = karar vermek.`],
wortbildung:[`<b>Auftrag</b> = müşteri siparişi. <i>Antrag</i> = resmî başvuru; <i>Beitrag</i> = katkı, ödeme veya makale.`,`<b>sich bewähren</b> = kendini kanıtlamak. <i>gewähren</i> = vermek, tanımak; <i>sich gewöhnen</i> <i>an</i> ister.`,`<b>bekommen</b> = almak. <i>ankommen</i> = varmak; <i>vorkommen</i> = olmak, yaşanmak.`,`Bir ürünün <b>Vorstellung</b>'u = tanıtımı. <i>Einstellung</i> = tutum veya bir çalışanın işe alınması.`,`Akkusativ nesnesiyle (<i>die Kosten</i>) → geçişli <b>senken</b> (düşürmek). <i>sinken</i> geçişsizdir: Die Kosten sinken.`,`<b>benachrichtigen</b> = haber vermek. <i>berichtigen</i> = düzeltmek.`]};

TR.ru.x={
konn:[`Цель со своим подлежащим (<i>wir</i>) и спрягаемым глаголом (<i>können</i>) → <b>damit</b>. <i>Um … zu</i> возможно только с инфинитивом; <i>sodass</i> выражает следствие и стоит после главного предложения.`,`Сразу после пропуска идёт глагол (<i>mussten</i>) → союзное наречие на 1-м месте: <b>deshalb</b>. После <i>weil</i> глагол стоял бы в конце, после <i>denn</i> сначала шло бы подлежащее.`,`Противопоставление + глагол в конце (<i>wurde</i>) → <b>obwohl</b>. После <i>trotzdem</i> глагол стоит сразу; <i>weil</i> называет причину, а не противопоставление.`,`<i>je</i> + сравнительная степень …, <b>desto</b> (или <i>umso</i>) + сравнительная степень + глагол.`,`<b>sowohl … als auch</b> = и то, и другое. К <i>weder</i> относится <i>noch</i>, к <i>entweder</i> – <i>oder</i>.`,`Косвенный вопрос «да/нет» (<i>Kann ich teilnehmen?</i>) → <b>ob</b> (ли). <i>wenn</i> и <i>falls</i> вводят условие.`],
praep:[`Период, в течение которого что-то действует → <b>während</b> + Genitiv (<i>der Sitzung</i>).`,`Срок → <b>innerhalb</b>. Без артикля следует <i>von</i> + Dativ: innerhalb von 14 Tagen.`,`Праздник прошёл на улице, хотя погода была плохой → противопоставление: <b>trotz</b> + Genitiv. <i>wegen/aufgrund</i> называют причину.`,`Начальная точка в будущем → <b>ab</b> + Dativ (<i>nächstem</i>). <i>seit</i> – только для того, что длится с прошлого до сих пор; <i>bis</i> обозначает конец и требует Akkusativ (bis nächsten Monat).`,`Началось в прошлом и продолжается → <b>seit</b> + Dativ, с настоящим временем. Для <i>vor drei Jahren</i> нужно прошедшее время.`,`Причина – ремонт → <b>wegen</b> + Genitiv.`],
rektion:[`<b>achten auf</b> + Akkusativ.`,`<b>sich entscheiden für</b> + Akkusativ (<i>zu</i> относится к <i>sich entschließen</i>).`,`<b>verantwortlich für</b> + Akkusativ.`,`Существительное <b>Interesse an</b> + Dativ. Только глагол <i>sich interessieren</i> употребляется с <i>für</i>.`,`<b>abhängen von</b> + Dativ.`,`<b>teilnehmen an</b> + Dativ.`],
pronadv:[`О мнении спрашивают с <i>halten von</i> → <b>davon</b>.`,`Вопрос о предмете + <i>sich beschweren über</i> → <b>worüber</b>.`,`Для <b>людей</b> местоименное наречие не используется, нужно «предлог + местоимение»: <b>auf ihn</b>.`,`<i>denken an</i> → <b>daran</b>, указывает вперёд на инфинитивный оборот.`,`Косвенный вопрос + <i>sprechen über</i> → <b>worüber</b>.`,`Помощь уже оказана → <i>sich freuen über</i> → <b>darüber</b>. Предстоящему радуются: <i>darauf</i>.`],
relativ:[`Слово <i>der Kunde</i> (м. р.); в придаточном это дополнение в Dativ (<i>wir haben <b>dem</b> Kunden das Angebot geschickt</i>) → <b>dem</b>.`,`Продукты принадлежат фирме (ж. р.) → Genitiv <b>deren</b>.`,`<i>mit</i> + Dativ, <i>der Kollege</i> м. р. → <b>mit dem</b>.`,`Мн. ч. + дополнение в Dativ (<i>jemandem eine Absage schicken</i>) → <b>denen</b>.`,`<i>sich anmelden für</i> + Akkusativ; <i>das Seminar</i> – ср. р. → <b>für das</b>.`,`<i>der Abteilungsleiter</i> – м. р., принадлежность (его договор) → <b>dessen</b>.`],
kasus:[`<i>einen</i> показывает Akkusativ м. р. → прилагательное на <b>-en</b>.`,`<i>mit</i> + Dativ мн. ч., без артикля → окончание-сигнал <b>-en</b>.`,`Результаты чего? → Genitiv; <i>die Umfrage</i> ж. р. → <b>der letzten</b> Umfrage.`,`<i>jemandem etwas schicken</i>: клиенты стоят в Dativ мн. ч. → <b>allen</b>.`,`<i>Ihr</i> (ср. р., Akkusativ) без окончания → род показывает прилагательное: <b>großes</b>.`,`<i>mit</i> + Dativ; <i>einem</i> показывает падеж → прилагательное на <b>-en</b>.`],
genus:[`<i>die Rechnung</i> (-ung → ж. р.), Akkusativ → <b>die</b>.`,`<i>das Angebot</i> (ср. р.), Akkusativ → <b>das</b>.`,`<i>der Vertrag</i> → <i>der Arbeitsvertrag</i>; Akkusativ → <b>den</b>.`,`<i>das Gehalt</i> (ср. р.) → Genitiv <b>des</b> Gehalts.`,`<i>der Termin</i> (м. р.) → Akkusativ <b>einen</b>.`,`<i>die Entscheidung</i> (-ung → ж. р.), <i>über</i> + Akkusativ → <b>unsere</b>.`],
artikel:[`Профессии после <i>sein, werden, als</i> употребляются <b>без артикля</b>.`,`Относительное придаточное точно указывает, какое резюме имеется в виду → <b>определённый артикль</b>.`,`Коллега упоминается впервые → <b>неопределённый артикль</b>.`,`<i>Erfahrung</i> здесь в общем смысле и неисчисляемо → <b>без артикля</b>.`,`При <b>превосходной степени</b> всегда определённый артикль.`,`Неопределённое <b>множественное число</b> → без артикля (у <i>ein</i> нет мн. ч.).`],
valenz:[`<i>helfen</i> + Dativ → <b>mir</b>.`,`<i>sich entschuldigen</i>, подлежащее <i>wir</i> → <b>uns</b>.`,`<i>sich etwas vorstellen</i>: «что-то» (im Ausland zu arbeiten) – дополнение в Akkusativ → возвратное местоимение в Dativ: <b>mir</b>.`,`Прямое дополнение в Akkusativ без предлога → <b>beachten</b>. <i>achten</i> требует <i>auf</i>.`,`<i>sich erkundigen nach</i>; вежливая форма <i>Sie</i> → <b>sich</b>.`,`<i>gefallen</i> + Dativ; Dativ мн. ч. → <b>den</b> Kolleginnen.`],
verbform:[`Модальный глагол + инфинитив пассива: eingereicht <b>werden</b>.`,`Перфект пассива: ist + Partizip II + <b>worden</b>.`,`<i>passieren</i> образует перфект с <b>sein</b>.`,`Präteritum пассива: <b>wurden</b> + Partizip II (подлежащее: drei neue Stellen, мн. ч.).`,`Самостоятельный глагол <i>werden</i> (= стать, получить должность) → причастие <b>geworden</b>.`,`С инфинитивом пассива (<i>informiert werden</i>) может стоять только <b>модальный глагол</b>.`],
festeverb:[`eine Entscheidung <b>treffen</b> (не: machen) = принять решение.`,`Законы и правила вступают в силу: in <b>Kraft</b> treten.`,`einen Antrag <b>stellen</b> = подать заявление.`,`Rücksicht nehmen <b>auf</b> + Akkusativ = считаться с кем-/чем-либо.`,`jemandem <b>Bescheid</b> geben = сообщить кому-то.`,`einen Vertrag <b>abschließen</b> = заключить договор. <i>beschließen</i> = решить.`],
wortbildung:[`<b>Auftrag</b> = заказ клиента. <i>Antrag</i> = официальное заявление; <i>Beitrag</i> = вклад, взнос или статья.`,`<b>sich bewähren</b> = оправдать себя. <i>gewähren</i> = предоставлять; <i>sich gewöhnen</i> требует <i>an</i>.`,`<b>bekommen</b> = получать. <i>ankommen</i> = прибывать; <i>vorkommen</i> = случаться.`,`<b>Vorstellung</b> продукта = презентация. <i>Einstellung</i> = отношение или приём сотрудника на работу.`,`С дополнением в Akkusativ (<i>die Kosten</i>) → переходный <b>senken</b> (снижать). <i>sinken</i> – непереходный: Die Kosten sinken.`,`<b>benachrichtigen</b> = сообщить, уведомить. <i>berichtigen</i> = исправить.`]};

TR.uk.x={
konn:[`Мета з власним підметом (<i>wir</i>) і відмінюваним дієсловом (<i>können</i>) → <b>damit</b>. <i>Um … zu</i> можливе лише з інфінітивом; <i>sodass</i> виражає наслідок і стоїть після головного речення.`,`Одразу після пропуску йде дієслово (<i>mussten</i>) → сполучний прислівник на 1-му місці: <b>deshalb</b>. Після <i>weil</i> дієслово стояло б у кінці, після <i>denn</i> спершу йшов би підмет.`,`Протиставлення + дієслово в кінці (<i>wurde</i>) → <b>obwohl</b>. Після <i>trotzdem</i> дієслово стоїть одразу; <i>weil</i> називає причину, а не протиставлення.`,`<i>je</i> + вищий ступінь …, <b>desto</b> (або <i>umso</i>) + вищий ступінь + дієслово.`,`<b>sowohl … als auch</b> = і те, і те. До <i>weder</i> належить <i>noch</i>, до <i>entweder</i> – <i>oder</i>.`,`Непряме питання «так/ні» (<i>Kann ich teilnehmen?</i>) → <b>ob</b> (чи). <i>wenn</i> і <i>falls</i> вводять умову.`],
praep:[`Період, протягом якого щось діє → <b>während</b> + Genitiv (<i>der Sitzung</i>).`,`Строк → <b>innerhalb</b>. Без артикля йде <i>von</i> + Dativ: innerhalb von 14 Tagen.`,`Свято відбулося надворі, хоча погода була погана → протиставлення: <b>trotz</b> + Genitiv. <i>wegen/aufgrund</i> називають причину.`,`Початкова точка в майбутньому → <b>ab</b> + Dativ (<i>nächstem</i>). <i>seit</i> – лише для того, що триває з минулого досі; <i>bis</i> позначає кінець і вимагає Akkusativ (bis nächsten Monat).`,`Почалося в минулому й триває → <b>seit</b> + Dativ, з теперішнім часом. Для <i>vor drei Jahren</i> потрібен минулий час.`,`Причина – ремонт → <b>wegen</b> + Genitiv.`],
rektion:[`<b>achten auf</b> + Akkusativ.`,`<b>sich entscheiden für</b> + Akkusativ (<i>zu</i> належить до <i>sich entschließen</i>).`,`<b>verantwortlich für</b> + Akkusativ.`,`Іменник <b>Interesse an</b> + Dativ. Лише дієслово <i>sich interessieren</i> вживається з <i>für</i>.`,`<b>abhängen von</b> + Dativ.`,`<b>teilnehmen an</b> + Dativ.`],
pronadv:[`Про думку питають із <i>halten von</i> → <b>davon</b>.`,`Питання про предмет + <i>sich beschweren über</i> → <b>worüber</b>.`,`Для <b>людей</b> займенниковий прислівник не вживається, потрібно «прийменник + займенник»: <b>auf ihn</b>.`,`<i>denken an</i> → <b>daran</b>, вказує наперед на інфінітивний зворот.`,`Непряме питання + <i>sprechen über</i> → <b>worüber</b>.`,`Допомога вже відбулася → <i>sich freuen über</i> → <b>darüber</b>. Майбутньому радіють: <i>darauf</i>.`],
relativ:[`Слово <i>der Kunde</i> (ч. р.); у підрядному реченні це додаток у Dativ (<i>wir haben <b>dem</b> Kunden das Angebot geschickt</i>) → <b>dem</b>.`,`Продукти належать фірмі (ж. р.) → Genitiv <b>deren</b>.`,`<i>mit</i> + Dativ, <i>der Kollege</i> ч. р. → <b>mit dem</b>.`,`Мн. + додаток у Dativ (<i>jemandem eine Absage schicken</i>) → <b>denen</b>.`,`<i>sich anmelden für</i> + Akkusativ; <i>das Seminar</i> – сер. р. → <b>für das</b>.`,`<i>der Abteilungsleiter</i> – ч. р., належність (його договір) → <b>dessen</b>.`],
kasus:[`<i>einen</i> показує Akkusativ ч. р. → прикметник на <b>-en</b>.`,`<i>mit</i> + Dativ мн., без артикля → сигнальне закінчення <b>-en</b>.`,`Результати чого? → Genitiv; <i>die Umfrage</i> ж. р. → <b>der letzten</b> Umfrage.`,`<i>jemandem etwas schicken</i>: клієнти стоять у Dativ мн. → <b>allen</b>.`,`<i>Ihr</i> (сер. р., Akkusativ) без закінчення → рід показує прикметник: <b>großes</b>.`,`<i>mit</i> + Dativ; <i>einem</i> показує відмінок → прикметник на <b>-en</b>.`],
genus:[`<i>die Rechnung</i> (-ung → ж. р.), Akkusativ → <b>die</b>.`,`<i>das Angebot</i> (сер. р.), Akkusativ → <b>das</b>.`,`<i>der Vertrag</i> → <i>der Arbeitsvertrag</i>; Akkusativ → <b>den</b>.`,`<i>das Gehalt</i> (сер. р.) → Genitiv <b>des</b> Gehalts.`,`<i>der Termin</i> (ч. р.) → Akkusativ <b>einen</b>.`,`<i>die Entscheidung</i> (-ung → ж. р.), <i>über</i> + Akkusativ → <b>unsere</b>.`],
artikel:[`Професії після <i>sein, werden, als</i> вживаються <b>без артикля</b>.`,`Відносне речення точно вказує, яке резюме мається на увазі → <b>означений артикль</b>.`,`Колегу згадано вперше → <b>неозначений артикль</b>.`,`<i>Erfahrung</i> тут у загальному значенні й незлічуване → <b>без артикля</b>.`,`При <b>найвищому ступені</b> завжди означений артикль.`,`Неозначена <b>множина</b> → без артикля (<i>ein</i> не має множини).`],
valenz:[`<i>helfen</i> + Dativ → <b>mir</b>.`,`<i>sich entschuldigen</i>, підмет <i>wir</i> → <b>uns</b>.`,`<i>sich etwas vorstellen</i>: «щось» (im Ausland zu arbeiten) – додаток в Akkusativ → зворотний займенник у Dativ: <b>mir</b>.`,`Прямий додаток в Akkusativ без прийменника → <b>beachten</b>. <i>achten</i> вимагає <i>auf</i>.`,`<i>sich erkundigen nach</i>; ввічлива форма <i>Sie</i> → <b>sich</b>.`,`<i>gefallen</i> + Dativ; Dativ мн. → <b>den</b> Kolleginnen.`],
verbform:[`Модальне дієслово + інфінітив пасиву: eingereicht <b>werden</b>.`,`Перфект пасиву: ist + Partizip II + <b>worden</b>.`,`<i>passieren</i> утворює перфект із <b>sein</b>.`,`Präteritum пасиву: <b>wurden</b> + Partizip II (підмет: drei neue Stellen, мн.).`,`Повнозначне дієслово <i>werden</i> (= стати, отримати посаду) → дієприкметник <b>geworden</b>.`,`З інфінітивом пасиву (<i>informiert werden</i>) може стояти лише <b>модальне дієслово</b>.`],
festeverb:[`eine Entscheidung <b>treffen</b> (не: machen) = ухвалити рішення.`,`Закони й правила набирають чинності: in <b>Kraft</b> treten.`,`einen Antrag <b>stellen</b> = подати заяву.`,`Rücksicht nehmen <b>auf</b> + Akkusativ = зважати на когось/щось.`,`jemandem <b>Bescheid</b> geben = повідомити когось.`,`einen Vertrag <b>abschließen</b> = укласти договір. <i>beschließen</i> = вирішити.`],
wortbildung:[`<b>Auftrag</b> = замовлення клієнта. <i>Antrag</i> = офіційна заява; <i>Beitrag</i> = внесок, платіж або стаття.`,`<b>sich bewähren</b> = виправдати себе. <i>gewähren</i> = надавати; <i>sich gewöhnen</i> вимагає <i>an</i>.`,`<b>bekommen</b> = отримувати. <i>ankommen</i> = прибувати; <i>vorkommen</i> = траплятися.`,`<b>Vorstellung</b> продукту = презентація. <i>Einstellung</i> = ставлення або прийняття працівника на роботу.`,`З додатком в Akkusativ (<i>die Kosten</i>) → перехідне <b>senken</b> (знижувати). <i>sinken</i> – неперехідне: Die Kosten sinken.`,`<b>benachrichtigen</b> = повідомити. <i>berichtigen</i> = виправити.`]};

TR.ar.x={
konn:[`غرض بفاعل خاص (<i>wir</i>) وفعل مصرَّف (<i>können</i>) ← <b>damit</b>. لا تُستخدم <i>Um … zu</i> إلا مع المصدر؛ و<i>sodass</i> تعبّر عن نتيجة وتأتي بعد الجملة الرئيسية.`,`يأتي الفعل مباشرةً بعد الفراغ (<i>mussten</i>) ← ظرف ربط في الموقع الأول: <b>deshalb</b>. بعد <i>weil</i> يأتي الفعل في الآخر، وبعد <i>denn</i> يأتي الفاعل أولًا.`,`تعارض + الفعل في الآخر (<i>wurde</i>) ← <b>obwohl</b>. أمّا <i>trotzdem</i> فيليها الفعل مباشرةً؛ و<i>weil</i> تذكر سببًا لا تعارضًا.`,`<i>je</i> + صيغة المقارنة …، <b>desto</b> (أو <i>umso</i>) + صيغة المقارنة + الفعل.`,`<b>sowohl … als auch</b> = كلاهما. مع <i>weder</i> تأتي <i>noch</i>، ومع <i>entweder</i> تأتي <i>oder</i>.`,`سؤال غير مباشر جوابه نعم/لا (<i>Kann ich teilnehmen?</i>) ← <b>ob</b>. أمّا <i>wenn</i> و<i>falls</i> فتُدخلان شرطًا.`],
praep:[`مدة يسري فيها شيء ما ← <b>während</b> + Genitiv (<i>der Sitzung</i>).`,`مهلة ← <b>innerhalb</b>. وبلا أداة تعريف تأتي <i>von</i> + Dativ: innerhalb von 14 Tagen.`,`أُقيم الحفل في الخارج رغم سوء الطقس ← تعارض: <b>trotz</b> + Genitiv. أمّا <i>wegen/aufgrund</i> فتذكران السبب.`,`نقطة بداية في المستقبل ← <b>ab</b> + Dativ (<i>nächstem</i>). <i>seit</i> فقط لما بدأ في الماضي واستمر حتى الآن؛ و<i>bis</i> تدل على النهاية وتأخذ Akkusativ (bis nächsten Monat).`,`بدأ في الماضي وما زال مستمرًا ← <b>seit</b> + Dativ مع المضارع. أمّا <i>vor drei Jahren</i> فتحتاج إلى زمن ماضٍ.`,`السبب هو أعمال الترميم ← <b>wegen</b> + Genitiv.`],
rektion:[`<b>achten auf</b> + Akkusativ.`,`<b>sich entscheiden für</b> + Akkusativ (<i>zu</i> تخص <i>sich entschließen</i>).`,`<b>verantwortlich für</b> + Akkusativ.`,`الاسم <b>Interesse an</b> + Dativ. والفعل <i>sich interessieren</i> وحده يأخذ <i>für</i>.`,`<b>abhängen von</b> + Dativ.`,`<b>teilnehmen an</b> + Dativ.`],
pronadv:[`السؤال عن الرأي يكون بـ <i>halten von</i> ← <b>davon</b>.`,`سؤال عن شيء + <i>sich beschweren über</i> ← <b>worüber</b>.`,`مع <b>الأشخاص</b> لا يُستخدم الظرف الضميري، بل حرف الجر + ضمير: <b>auf ihn</b>.`,`<i>denken an</i> ← <b>daran</b>، وتشير مسبقًا إلى الجملة المصدرية.`,`سؤال غير مباشر + <i>sprechen über</i> ← <b>worüber</b>.`,`المساعدة حدثت فعلًا ← <i>sich freuen über</i> ← <b>darüber</b>. ولشيء في المستقبل: <i>darauf</i>.`],
relativ:[`الكلمة المرجعية <i>der Kunde</i> (مذكر)؛ وهو في جملة الصلة مفعول به في Dativ (<i>wir haben <b>dem</b> Kunden das Angebot geschickt</i>) ← <b>dem</b>.`,`المنتجات تخص الشركة (مؤنث) ← Genitiv <b>deren</b>.`,`<i>mit</i> + Dativ، و<i>der Kollege</i> مذكر ← <b>mit dem</b>.`,`جمع + مفعول به في Dativ (<i>jemandem eine Absage schicken</i>) ← <b>denen</b>.`,`<i>sich anmelden für</i> + Akkusativ؛ و<i>das Seminar</i> محايد ← <b>für das</b>.`,`<i>der Abteilungsleiter</i> مذكر، ملكية (عقده) ← <b>dessen</b>.`],
kasus:[`<i>einen</i> تُظهر Akkusativ المذكر ← الصفة بـ <b>-en</b>.`,`<i>mit</i> + Dativ الجمع بلا أداة ← النهاية الدالّة <b>-en</b>.`,`نتائج ماذا؟ ← Genitiv؛ و<i>die Umfrage</i> مؤنث ← <b>der letzten</b> Umfrage.`,`<i>jemandem etwas schicken</i>: الزبائن في Dativ الجمع ← <b>allen</b>.`,`<i>Ihr</i> (محايد، Akkusativ) بلا نهاية ← الصفة تُظهر الجنس: <b>großes</b>.`,`<i>mit</i> + Dativ؛ و<i>einem</i> تُظهر الحالة ← الصفة بـ <b>-en</b>.`],
genus:[`<i>die Rechnung</i> (-ung ← مؤنث)، Akkusativ ← <b>die</b>.`,`<i>das Angebot</i> (محايد)، Akkusativ ← <b>das</b>.`,`<i>der Vertrag</i> ← <i>der Arbeitsvertrag</i>؛ Akkusativ ← <b>den</b>.`,`<i>das Gehalt</i> (محايد) ← Genitiv <b>des</b> Gehalts.`,`<i>der Termin</i> (مذكر) ← Akkusativ <b>einen</b>.`,`<i>die Entscheidung</i> (-ung ← مؤنث)، <i>über</i> + Akkusativ ← <b>unsere</b>.`],
artikel:[`المهن بعد <i>sein, werden, als</i> تأتي <b>بلا أداة</b>.`,`جملة الصلة تحدد بدقة السيرة الذاتية المقصودة ← <b>أداة التعريف</b>.`,`يُذكر الزميل لأول مرة ← <b>أداة التنكير</b>.`,`<i>Erfahrung</i> هنا بمعنى عام وغير معدودة ← <b>بلا أداة</b>.`,`مع <b>صيغة التفضيل</b> تأتي دائمًا أداة التعريف.`,`<b>جمع</b> غير محدد ← بلا أداة (<i>ein</i> ليس لها جمع).`],
valenz:[`<i>helfen</i> + Dativ ← <b>mir</b>.`,`<i>sich entschuldigen</i>، والفاعل <i>wir</i> ← <b>uns</b>.`,`<i>sich etwas vorstellen</i>: «الشيء» (im Ausland zu arbeiten) هو المفعول به في Akkusativ ← الضمير الانعكاسي في Dativ: <b>mir</b>.`,`مفعول به مباشر في Akkusativ بلا حرف جر ← <b>beachten</b>. أمّا <i>achten</i> فتحتاج إلى <i>auf</i>.`,`<i>sich erkundigen nach</i>؛ صيغة الاحترام <i>Sie</i> ← <b>sich</b>.`,`<i>gefallen</i> + Dativ؛ Dativ الجمع ← <b>den</b> Kolleginnen.`],
verbform:[`فعل ناقص (Modalverb) + مصدر المجهول: eingereicht <b>werden</b>.`,`Perfekt المجهول: ist + Partizip II + <b>worden</b>.`,`<i>passieren</i> تكوّن Perfekt مع <b>sein</b>.`,`Präteritum المجهول: <b>wurden</b> + Partizip II (الفاعل: drei neue Stellen، جمع).`,`الفعل الأساسي <i>werden</i> (= يصبح، يتولّى منصبًا) ← اسم المفعول <b>geworden</b>.`,`لا يأتي مع مصدر المجهول (<i>informiert werden</i>) إلا <b>فعل ناقص (Modalverb)</b>.`],
festeverb:[`eine Entscheidung <b>treffen</b> (لا: machen) = يتّخذ قرارًا.`,`القوانين والقواعد تدخل حيّز التنفيذ: in <b>Kraft</b> treten.`,`einen Antrag <b>stellen</b> = يقدّم طلبًا.`,`Rücksicht nehmen <b>auf</b> + Akkusativ = يراعي.`,`jemandem <b>Bescheid</b> geben = يُبلغ شخصًا.`,`einen Vertrag <b>abschließen</b> = يُبرم عقدًا. أمّا <i>beschließen</i> = يقرّر.`],
wortbildung:[`<b>Auftrag</b> = طلبية من زبون. <i>Antrag</i> = طلب رسمي؛ <i>Beitrag</i> = مساهمة أو دفعة أو مقال.`,`<b>sich bewähren</b> = يثبت جدارته. <i>gewähren</i> = يمنح؛ و<i>sich gewöhnen</i> تحتاج إلى <i>an</i>.`,`<b>bekommen</b> = يتلقّى. <i>ankommen</i> = يصل؛ <i>vorkommen</i> = يحدث.`,`<b>Vorstellung</b> منتج = عرضه وتقديمه. <i>Einstellung</i> = موقف أو توظيف موظف.`,`مع مفعول به في Akkusativ (<i>die Kosten</i>) ← الفعل المتعدّي <b>senken</b> (يخفّض). أمّا <i>sinken</i> فلازم: Die Kosten sinken.`,`<b>benachrichtigen</b> = يُبلغ. <i>berichtigen</i> = يصحّح.`]};

TR.fa.x={
konn:[`هدف با فاعل جداگانه (<i>wir</i>) و فعل صرف‌شده (<i>können</i>) ← <b>damit</b>. <i>Um … zu</i> فقط با مصدر می‌آید؛ <i>sodass</i> نتیجه را بیان می‌کند و بعد از جملهٔ اصلی می‌آید.`,`بلافاصله بعد از جای خالی فعل آمده (<i>mussten</i>) ← قید ربط در جایگاه اول: <b>deshalb</b>. بعد از <i>weil</i> فعل در انتها می‌آمد و بعد از <i>denn</i> اول فاعل می‌آمد.`,`تضاد + فعل در انتها (<i>wurde</i>) ← <b>obwohl</b>. بعد از <i>Trotzdem</i> فعل بلافاصله می‌آید؛ <i>weil</i> دلیل را بیان می‌کند نه تضاد را.`,`<i>je</i> + صفت تفضیلی …، <b>desto</b> (یا <i>umso</i>) + صفت تفضیلی + فعل.`,`<b>sowohl … als auch</b> = هر دو. با <i>weder</i> کلمهٔ <i>noch</i> و با <i>entweder</i> کلمهٔ <i>oder</i> می‌آید.`,`پرسش غیرمستقیم بله/خیر (<i>Kann ich teilnehmen?</i>) ← <b>ob</b>. <i>wenn</i> و <i>falls</i> شرط را شروع می‌کنند.`],
praep:[`بازه‌ای که در آن چیزی معتبر است ← <b>während</b> + Genitiv (<i>der Sitzung</i>).`,`مهلت ← <b>innerhalb</b>. بدون حرف تعریف، <i>von</i> + Dativ می‌آید: innerhalb von 14 Tagen.`,`جشن با وجود هوای بد در فضای باز برگزار شد ← تضاد: <b>trotz</b> + Genitiv. <i>wegen/aufgrund</i> دلیل را بیان می‌کنند.`,`نقطهٔ شروع در آینده ← <b>ab</b> + Dativ (<i>nächstem</i>). <i>seit</i> فقط برای چیزی است که از گذشته تا حالا ادامه دارد؛ <i>bis</i> پایان را نشان می‌دهد و Akkusativ می‌گیرد (bis nächsten Monat).`,`در گذشته شروع شده و ادامه دارد ← <b>seit</b> + Dativ با زمان حال. <i>vor drei Jahren</i> زمان گذشته لازم دارد.`,`دلیل، بازسازی است ← <b>wegen</b> + Genitiv.`],
rektion:[`<b>achten auf</b> + Akkusativ.`,`<b>sich entscheiden für</b> + Akkusativ (<i>zu</i> مربوط به <i>sich entschließen</i> است).`,`<b>verantwortlich für</b> + Akkusativ.`,`اسم <b>Interesse an</b> + Dativ. فقط فعل <i>sich interessieren</i> با <i>für</i> می‌آید.`,`<b>abhängen von</b> + Dativ.`,`<b>teilnehmen an</b> + Dativ.`],
pronadv:[`برای پرسیدن نظر از <i>halten von</i> استفاده می‌شود ← <b>davon</b>.`,`پرسش دربارهٔ یک چیز + <i>sich beschweren über</i> ← <b>worüber</b>.`,`برای <b>افراد</b> قید ضمیری به کار نمی‌رود، بلکه حرف اضافه + ضمیر: <b>auf ihn</b>.`,`<i>denken an</i> ← <b>daran</b>، که از پیش به جملهٔ مصدری اشاره می‌کند.`,`پرسش غیرمستقیم + <i>sprechen über</i> ← <b>worüber</b>.`,`کمک قبلاً انجام شده ← <i>sich freuen über</i> ← <b>darüber</b>. برای چیزی در آینده: <i>darauf</i>.`],
relativ:[`کلمهٔ مرجع <i>der Kunde</i> (مذکر)؛ در جملهٔ موصولی مفعول Dativ است (<i>wir haben <b>dem</b> Kunden das Angebot geschickt</i>) ← <b>dem</b>.`,`محصولات متعلق به شرکت (مؤنث) هستند ← Genitiv <b>deren</b>.`,`<i>mit</i> + Dativ، <i>der Kollege</i> مذکر ← <b>mit dem</b>.`,`جمع + مفعول Dativ (<i>jemandem eine Absage schicken</i>) ← <b>denen</b>.`,`<i>sich anmelden für</i> + Akkusativ؛ <i>das Seminar</i> خنثی است ← <b>für das</b>.`,`<i>der Abteilungsleiter</i> مذکر، مالکیت (قراردادش) ← <b>dessen</b>.`],
kasus:[`<i>einen</i> حالت Akkusativ مذکر را نشان می‌دهد ← صفت با <b>-en</b>.`,`<i>mit</i> + Dativ جمع، بدون حرف تعریف ← پایانهٔ نشانه <b>-en</b>.`,`نتایج چه چیزی؟ ← Genitiv؛ <i>die Umfrage</i> مؤنث است ← <b>der letzten</b> Umfrage.`,`<i>jemandem etwas schicken</i>: مشتریان در Dativ جمع هستند ← <b>allen</b>.`,`<i>Ihr</i> (خنثی، Akkusativ) پایانه ندارد ← صفت جنس را نشان می‌دهد: <b>großes</b>.`,`<i>mit</i> + Dativ؛ <i>einem</i> حالت را نشان می‌دهد ← صفت با <b>-en</b>.`],
genus:[`<i>die Rechnung</i> (-ung ← مؤنث)، Akkusativ ← <b>die</b>.`,`<i>das Angebot</i> (خنثی)، Akkusativ ← <b>das</b>.`,`<i>der Vertrag</i> ← <i>der Arbeitsvertrag</i>؛ Akkusativ ← <b>den</b>.`,`<i>das Gehalt</i> (خنثی) ← Genitiv <b>des</b> Gehalts.`,`<i>der Termin</i> (مذکر) ← Akkusativ <b>einen</b>.`,`<i>die Entscheidung</i> (-ung ← مؤنث)، <i>über</i> + Akkusativ ← <b>unsere</b>.`],
artikel:[`شغل‌ها بعد از <i>sein, werden, als</i> <b>بدون حرف تعریف</b> می‌آیند.`,`جملهٔ موصولی دقیقاً مشخص می‌کند کدام رزومه منظور است ← <b>حرف تعریف معین</b>.`,`همکار برای اولین بار ذکر می‌شود ← <b>حرف تعریف نامعین</b>.`,`<i>Erfahrung</i> اینجا کلی و غیرقابل‌شمارش است ← <b>بدون حرف تعریف</b>.`,`با <b>صفت عالی</b> همیشه حرف تعریف معین می‌آید.`,`<b>جمع</b> نامعین ← بدون حرف تعریف (<i>ein</i> جمع ندارد).`],
valenz:[`<i>helfen</i> + Dativ ← <b>mir</b>.`,`<i>sich entschuldigen</i>، فاعل <i>wir</i> ← <b>uns</b>.`,`<i>sich etwas vorstellen</i>: «چیزی» (im Ausland zu arbeiten) مفعول Akkusativ است ← ضمیر انعکاسی در Dativ: <b>mir</b>.`,`مفعول مستقیم Akkusativ بدون حرف اضافه ← <b>beachten</b>. <i>achten</i> به <i>auf</i> نیاز دارد.`,`<i>sich erkundigen nach</i>؛ صورت مؤدبانهٔ <i>Sie</i> ← <b>sich</b>.`,`<i>gefallen</i> + Dativ؛ Dativ جمع ← <b>den</b> Kolleginnen.`],
verbform:[`فعل وجهی + مصدر مجهول: eingereicht <b>werden</b>.`,`Perfekt مجهول: ist + Partizip II + <b>worden</b>.`,`<i>passieren</i> زمان Perfekt را با <b>sein</b> می‌سازد.`,`Präteritum مجهول: <b>wurden</b> + Partizip II (فاعل: drei neue Stellen، جمع).`,`فعل اصلی <i>werden</i> (= شدن، به سمتی رسیدن) ← صفت مفعولی <b>geworden</b>.`,`فقط یک <b>فعل وجهی</b> می‌تواند با مصدر مجهول (<i>informiert werden</i>) بیاید.`],
festeverb:[`eine Entscheidung <b>treffen</b> (نه machen) = تصمیم گرفتن.`,`قوانین و مقررات لازم‌الاجرا می‌شوند: in <b>Kraft</b> treten.`,`einen Antrag <b>stellen</b> = درخواست دادن.`,`Rücksicht nehmen <b>auf</b> + Akkusativ = ملاحظهٔ کسی/چیزی را کردن.`,`jemandem <b>Bescheid</b> geben = به کسی خبر دادن.`,`einen Vertrag <b>abschließen</b> = قرارداد بستن. <i>beschließen</i> = تصمیم گرفتن.`],
wortbildung:[`<b>Auftrag</b> = سفارش مشتری. <i>Antrag</i> = درخواست رسمی؛ <i>Beitrag</i> = سهم، پرداخت یا مقاله.`,`<b>sich bewähren</b> = کارایی خود را ثابت کردن. <i>gewähren</i> = اعطا کردن؛ <i>sich gewöhnen</i> به <i>an</i> نیاز دارد.`,`<b>bekommen</b> = دریافت کردن. <i>ankommen</i> = رسیدن؛ <i>vorkommen</i> = پیش آمدن.`,`<b>Vorstellung</b> یک محصول = معرفی و ارائهٔ آن. <i>Einstellung</i> = نگرش یا استخدام یک کارمند.`,`با مفعول Akkusativ (<i>die Kosten</i>) ← فعل متعدی <b>senken</b> (کاهش دادن). <i>sinken</i> لازم است: Die Kosten sinken.`,`<b>benachrichtigen</b> = خبر دادن. <i>berichtigen</i> = تصحیح کردن.`]};
/*APP*/
/* ================= APP ================= */
const KEY="sb-dtb-b2-diagnose-v1";
let S={name:"",ans:{},evaluated:false,view:"1A",active:{},prac:{}};
try{const raw=localStorage.getItem(KEY);if(raw){S=Object.assign(S,JSON.parse(raw));}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const cap=s=>s?s.charAt(0).toUpperCase()+s.slice(1):s;
const LET="abcdefghij";
/* Übersetzungs-Helfer */
const curLang=()=>LANGS.find(l=>l.c===S.lang);
function trBox(html){const l=curLang();if(!l||!html)return "";return `<div class="tr" lang="${l.c}" dir="${l.dir}">${html}</div>`}
function tc(c,i){const t=S.lang&&TR[S.lang];return t&&t.c[c]?t.c[c][i]:""}
function ti(key,i){const t=S.lang&&TR[S.lang];return t&&t.i[key]?t.i[key][i]:""}
function langBar(){return `<div class="langbar"><span>Übersetzung:</span>${[{c:"",n:"Aus"}].concat(LANGS).map(l=>`<button class="lb" data-lang="${l.c}" aria-pressed="${(S.lang||"")===l.c}" lang="${l.c||"de"}"${l.dir?` dir="${l.dir}"`:""}>${l.n}</button>`).join("")}</div>`}
document.addEventListener("click",e=>{const b=e.target.closest("[data-lang]");if(!b)return;S.lang=b.dataset.lang;save();const y=window.scrollY;render();window.scrollTo(0,y);});
const k=(set,n)=>set.id+"-"+n;
const allItems=()=>SETS.flatMap(s=>s.items.map(it=>({set:s,it})));
function answeredCount(set){return set.items.filter(it=>S.ans[k(set,it.n)]).length}

/* stabile Mischung der Übungsoptionen */
function hash(str){let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function shuffled(arr,seed){const a=arr.slice();let h=hash(seed);for(let i=a.length-1;i>0;i--){h=Math.imul(h^(h>>>15),2246822507)>>>0;const j=h%(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}

/* ---------- Auswertung ---------- */
function analyse(){
  const cats={};Object.keys(CATS).forEach(c=>cats[c]={c:0,t:0,hits:[]});
  let total=0,right=0;const per={};
  allItems().forEach(({set,it})=>{
    const given=S.ans[k(set,it.n)]||"";const ok=given===it.a;
    total++;if(ok)right++;
    per[set.id]=per[set.id]||{c:0,t:0};per[set.id].t++;if(ok)per[set.id].c++;
    const tags=ok?it.tags:((it.diag&&it.diag[given])||it.tags);
    tags.forEach(t=>{cats[t].t++;if(ok)cats[t].c++;cats[t].hits.push({id:set.id,n:it.n,ok})});
  });
  Object.values(cats).forEach(o=>{o.st=o.t===0?"none":(o.c===o.t?"sicher":(o.c/o.t>=.5?"teilweise":"uebung"))});
  return {cats,total,right,per};
}
const ST_LABEL={sicher:"sicher",teilweise:"teilweise sicher",uebung:"Übungsbedarf"};

/* ---------- Tabs ---------- */
function renderTabs(){
  const tabs=SETS.map(s=>({id:s.id,label:s.label,count:answeredCount(s)+"/6",done:answeredCount(s)===6}))
   .concat([{id:"profil",label:"Profil & Lösungen",dis:!S.evaluated},{id:"ueben",label:"Gezielt üben",dis:!S.evaluated}]);
  $("#tabs").innerHTML=tabs.map(t=>`<button role="tab" data-tab="${t.id}" aria-selected="${S.view===t.id}" ${t.dis?"disabled":""}>${esc(t.label)}${t.count&&!S.evaluated?` <span class="count ${t.done?"done":""}">${t.count}</span>`:""}</button>`).join("");
}
document.addEventListener("click",e=>{
  const tb=e.target.closest("[data-tab]");if(tb&&!tb.disabled){S.view=tb.dataset.tab;save();render();window.scrollTo(0,0);}
});

/* ---------- Text rendern ---------- */
function gapHTML(set,it){
  const given=S.ans[k(set,it.n)]||"";
  const show=w=>it.cap?cap(w):w;
  if(S.evaluated){
    const ok=given===it.a;
    const inner=ok?`<span class="w">${esc(show(given))}</span>`:
      `<span class="w">${given?`<s>${esc(show(given))}</s> `:""}<span class="corr">${esc(show(it.a))}</span></span>`;
    return `<span class="gap ${ok?"ok":"bad"}"><span class="n">${it.n}</span>${inner}</span>`;
  }
  const act=set.teil===1&&S.active[set.id]===it.n;
  return `<button class="gap ${act?"active":""}" data-gap="${set.id}|${it.n}" aria-label="Lücke ${it.n}${given?": "+esc(given):", leer"}"><span class="n">${it.n}</span><span class="w ${given?"":"empty"}">${given?esc(show(given)):"……"}</span></button>`;
}
function paperHTML(set){
  const byN={};set.items.forEach(it=>byN[it.n]=it);
  const ps=set.paras.map(p=>"<p>"+p.split(/(\{\d+\})/).map(part=>{const m=part.match(/^\{(\d+)\}$/);return m?gapHTML(set,byN[+m[1]]):part}).join("")+"</p>").join("");
  return `<article class="paper"><div class="meta">${esc(set.meta)}</div>${ps}</article>`;
}
function renderSet(set){
  const t1=set.teil===1;
  if(t1&&!S.active[set.id]){const f=set.items.find(it=>!S.ans[k(set,it.n)]);S.active[set.id]=f?f.n:set.items[0].n;}
  const range=t1?"46–51":"52–57";
  const instr=t1?`Lesen Sie den folgenden Text. Welche Wörter <b>a–j</b> passen am besten in die Lücken <b>${range}</b>? Nicht alle Wörter passen in den Text. Jedes Wort passt nur einmal.`
               :`Lesen Sie den folgenden Text. Welcher Ausdruck (<b>a, b oder c</b>) passt am besten in die Lücken <b>${range}</b>?`;
  let panel;
  if(t1){
    const used={};set.items.forEach(it=>{const g=S.ans[k(set,it.n)];if(g)used[g]=it.n});
    panel=`<aside class="panel"><h3>Wörter a–j</h3><div class="wordbox">${set.words.map((w,i)=>`<button class="chip ${used[w]?"used":""}" data-word="${set.id}|${esc(w)}" ${S.evaluated?"disabled":""}><span class="l">${LET[i]}</span><span class="t">${esc(w)}</span>${used[w]?`<span class="u">${used[w]}</span>`:""}</button>`).join("")}</div>
     ${S.evaluated?`<p class="hint">Ausgewertet. Grün = richtig, rot = falsch (richtige Lösung daneben).</p>`:`<p class="hint">Tippen Sie auf eine Lücke im Text und dann auf ein Wort. Aktive Lücke: <b>${S.active[set.id]}</b>. Ein schon verwendetes Wort wird in die aktive Lücke verschoben.</p>
     <div class="row-btns"><button class="btn ghost small" data-clear="${set.id}">Aktive Lücke leeren</button></div>`}</aside>`;
  }else{
    panel=`<aside class="panel"><h3>Lücken ${range}</h3><div class="mc">${set.items.map(it=>{
      const g=S.ans[k(set,it.n)];
      return `<div class="it"><span class="num">${it.n}</span><div class="opts" role="group" aria-label="Lücke ${it.n}">${it.o.map((o,i)=>{
        let cls="";if(S.evaluated){if(o===it.a)cls="ok";else if(o===g)cls="bad";}
        return `<button class="opt ${cls}" data-mc="${set.id}|${it.n}|${esc(o)}" aria-pressed="${g===o}" ${S.evaluated?"disabled":""}><span class="l">${"abc"[i]}</span>${esc(o)}</button>`}).join("")}</div></div>`}).join("")}</div></aside>`;
  }
  const idx=SETS.indexOf(set);const next=SETS[idx+1];
  const totalAns=allItems().filter(({set:s,it})=>S.ans[k(s,it.n)]).length;
  const evalbar=S.evaluated?`<div class="evalbar"><span>Dieser Text: ${set.items.filter(it=>S.ans[k(set,it.n)]===it.a).length} von 6 richtig.</span><button class="btn" data-tab="profil">Zum Profil</button></div>`
   :`<div class="evalbar"><span>Beantwortet insgesamt: <b>${totalAns}</b> von 24</span><div class="row-btns" style="margin:0">${next?`<button class="btn ghost" data-tab="${next.id}">Weiter zu ${esc(next.label)}</button>`:""}<button class="btn" id="evalBtn">Auswerten</button></div></div><div id="confirmSlot"></div>`;
  return `<section class="intro"><span class="eyebrow">Sprachbausteine ${set.label}</span><div class="instr">${instr}<br><span style="color:var(--muted)">Situation: ${esc(set.sit)}</span></div></section>
   <div class="grid2">${paperHTML(set)}${panel}</div>${evalbar}`;
}
document.addEventListener("click",e=>{
  if(S.evaluated)return;
  const g=e.target.closest("[data-gap]");
  if(g){const [id,n]=g.dataset.gap.split("|");const set=SETS.find(s=>s.id===id);
    if(set.teil===1){S.active[id]=+n;save();render();}
    else{const el=document.querySelector(`[data-mc^="${id}|${n}|"]`);if(el){el.scrollIntoView({block:"center",behavior:"smooth"});el.focus({preventScroll:true});}}
    return;}
  const w=e.target.closest("[data-word]");
  if(w){const [id,word]=w.dataset.word.split("|");const set=SETS.find(s=>s.id===id);const n=S.active[id];
    set.items.forEach(it=>{if(S.ans[k(set,it.n)]===word)delete S.ans[k(set,it.n)]});
    S.ans[id+"-"+n]=word;
    const nxt=set.items.find(it=>!S.ans[k(set,it.n)]);if(nxt)S.active[id]=nxt.n;
    save();render();return;}
  const c=e.target.closest("[data-clear]");
  if(c){const id=c.dataset.clear;delete S.ans[id+"-"+S.active[id]];save();render();return;}
  const m=e.target.closest("[data-mc]");
  if(m){const [id,n,o]=m.dataset.mc.split("|");S.ans[id+"-"+n]=o;save();render();return;}
  if(e.target.closest("#evalBtn")){
    const missing=24-allItems().filter(({set,it})=>S.ans[k(set,it.n)]).length;
    if(missing>0){$("#confirmSlot").innerHTML=`<div class="confirm" style="margin-top:12px"><span>Es fehlen noch <b>${missing}</b> Antworten. Leere Lücken zählen als falsch.</span><button class="btn small" id="evalNow">Trotzdem auswerten</button><button class="btn ghost small" id="evalCancel">Weiter bearbeiten</button></div>`;}
    else doEval();return;}
  if(e.target.closest("#evalNow")){doEval();return;}
  if(e.target.closest("#evalCancel")){$("#confirmSlot").innerHTML="";return;}
});
function doEval(){S.evaluated=true;S.view="profil";save();render();window.scrollTo(0,0);}

/* ---------- Profil ---------- */
function renderProfile(){
  const A=analyse();
  const order={uebung:0,teilweise:1,sicher:2,none:3};
  const keys=Object.keys(CATS).filter(c=>A.cats[c].t>0).sort((a,b)=>order[A.cats[a].st]-order[A.cats[b].st]||A.cats[a].c/A.cats[a].t-A.cats[b].c/A.cats[b].t);
  const t1=A.per["1A"].c+A.per["1B"].c, t2=A.per["2A"].c+A.per["2B"].c;
  const nErr=keys.filter(c=>A.cats[c].st!=="sicher").length;
  const rows=keys.map(c=>{const o=A.cats[c];const pct=Math.round(o.c/o.t*100);const cls=o.st==="sicher"?"":(o.st==="teilweise"?"mid":"low");
    const pr=practiceScore(c);
    return `<div class="prow"><div><div class="nm">${esc(CATS[c].name)}</div><div class="ds">${esc(CATS[c].desc)}</div>
      <div class="refs">${o.hits.map(h=>`${h.id}/${h.n}${h.ok?"✓":"✗"}`).join(" · ")}${pr.done?` · Nachübung: ${pr.right}/${pr.total}`:""}</div>
      ${trBox(tc(c,0)?`<b>${tc(c,0)}</b><br>${tc(c,1)}`:"")}</div>
      <div class="bar"><div class="track"><div class="fill ${cls}" style="width:${Math.max(pct,3)}%"></div></div><span class="fr">${o.c}/${o.t}</span></div>
      <span class="pill ${o.st}">${ST_LABEL[o.st]}</span></div>`}).join("");
  const reviews=SETS.map(set=>{const c=set.items.filter(it=>S.ans[k(set,it.n)]===it.a).length;
    return `<details class="review" ${c<6?"open":""}><summary>${esc(set.label)} <span class="count ${c===6?"done":""}">${c}/6</span></summary>${set.items.map(it=>{
      const g=S.ans[k(set,it.n)]||"";const ok=g===it.a;const key=k(set,it.n);
      const trI=trBox(ti(key,0)?`<div class="trskill">${ti(key,0)}</div><div>${ti(key,1)}</div>`:"");
      return `<div class="ritem"><span class="num ${ok?"ok":"bad"}">${it.n} ${ok?"✓":"✗"}</span><div>
        <div class="ans">${ok?`Ihre Antwort: <b>${esc(it.a)}</b>`:`Ihre Antwort: <b>${g?esc(g):"(leer)"}</b> · richtig: <b>${esc(it.a)}</b>`}</div>
        <div class="skill">Geprüft: ${esc(it.skill)}</div>
        ${ok?"":`<div class="ex">${it.e}</div>${trI}`}
        ${ok?`<details><summary style="cursor:pointer;font-size:.85rem;color:var(--accent)">Erklärung</summary><div class="ex">${it.e}</div>${trI}</details>`:""}
        <div class="tagrow">${it.tags.map(t=>`<span class="tag">${esc(CATS[t].name)}</span>`).join("")}</div></div></div>`}).join("")}</details>`}).join("");
  return `<section class="summary">
     <div class="stat"><div class="v">${A.right}<span style="font-size:1rem;color:var(--muted)">/24</span></div><div class="k">richtig insgesamt</div></div>
     <div class="stat"><div class="v">${t1}<span style="font-size:1rem;color:var(--muted)">/12</span></div><div class="k">Teil 1 (Wortkasten)</div></div>
     <div class="stat"><div class="v">${t2}<span style="font-size:1rem;color:var(--muted)">/12</span></div><div class="k">Teil 2 (a/b/c)</div></div>
     <div class="stat"><div class="v">${(A.right*0.25).toLocaleString("de-DE",{minimumFractionDigits:1,maximumFractionDigits:2})}<span style="font-size:1rem;color:var(--muted)">/6</span></div><div class="k">Punkte umgerechnet auf eine Prüfung (je 0,5 pro Lücke)</div></div>
   </section>
   ${langBar()}
   <h2>Kompetenzprofil${S.name?" – "+esc(S.name):""}</h2>
   <p class="sub" style="margin:-4px 0 12px">Jede Lücke wurde danach analysiert, welches Wissen man zum Lösen braucht. Bei Fehlern zählt, was die gewählte falsche Antwort verrät. Kürzel: Text/Lücke ✓ richtig ✗ falsch.</p>
   <div class="profile">${rows}</div>
   <div class="row-btns" style="margin-top:14px">
     ${nErr?`<button class="btn" data-tab="ueben">Gezielt üben (${nErr} ${nErr===1?"Bereich":"Bereiche"})</button>`:""}
     <button class="btn ghost" id="copyBtn">Ergebnis für die Lehrkraft kopieren</button>
     <button class="btn ghost" id="resetBtn">Neu beginnen</button>
   </div><div id="copySlot"></div><div id="resetSlot"></div>
   <h2>Lösungen mit Erklärungen</h2>${reviews}`;
}
function reportText(){
  const A=analyse();const d=new Date().toLocaleDateString("de-DE");
  const g=st=>Object.keys(CATS).filter(c=>A.cats[c].st===st).map(c=>`${CATS[c].name} (${A.cats[c].c}/${A.cats[c].t})`).join("; ")||"–";
  const errs=allItems().filter(({set,it})=>S.ans[k(set,it.n)]!==it.a).map(({set,it})=>`${set.id}/${it.n}: ${S.ans[k(set,it.n)]||"leer"} → ${it.a}`).join("\n");
  const pr=Object.keys(CATS).map(c=>{const p=practiceScore(c);return p.done?`${CATS[c].name}: ${p.right}/${p.total}`:null}).filter(Boolean).join("; ");
  return `Sprachbausteine DTB B2 – Diagnose\nName: ${S.name||"–"} | Datum: ${d}\nErgebnis: ${A.right}/24 (Teil 1: ${A.per["1A"].c+A.per["1B"].c}/12, Teil 2: ${A.per["2A"].c+A.per["2B"].c}/12)\n\nSicher: ${g("sicher")}\nTeilweise sicher: ${g("teilweise")}\nÜbungsbedarf: ${g("uebung")}\n\nFehler:\n${errs||"keine"}${pr?`\n\nNachübungen: ${pr}`:""}`;
}
document.addEventListener("click",e=>{
  if(e.target.closest("#copyBtn")){const txt=reportText();
    const fallback=()=>{$("#copySlot").innerHTML=`<textarea class="copyfall" id="copyArea" readonly>${esc(txt)}</textarea>`;const t=$("#copyArea");t.focus();t.select();toast("Text markiert – bitte manuell kopieren.");};
    try{navigator.clipboard.writeText(txt).then(()=>toast("Ergebnis kopiert."),fallback);}catch(err){fallback();}
    return;}
  if(e.target.closest("#resetBtn")){$("#resetSlot").innerHTML=`<div class="confirm" style="margin-top:12px"><span>Alle Antworten und Übungen werden gelöscht.</span><button class="btn small" id="resetNow">Ja, neu beginnen</button><button class="btn ghost small" id="resetCancel">Abbrechen</button></div>`;return;}
  if(e.target.closest("#resetCancel")){$("#resetSlot").innerHTML="";return;}
  if(e.target.closest("#resetNow")){const nm=S.name,lg=S.lang;S={name:nm,lang:lg,ans:{},evaluated:false,view:"1A",active:{},prac:{}};save();render();window.scrollTo(0,0);return;}
});
function toast(msg){const t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2200);}

/* ---------- Übungen ---------- */
function practiceScore(c){const ex=CATS[c].ex;let right=0,done=0;ex.forEach((x,i)=>{const g=S.prac[c+"-"+i];if(g){done++;if(g===x.a)right++;}});return {right,total:ex.length,done:done===ex.length,answered:done}}
function renderPractice(){
  const A=analyse();
  const keys=Object.keys(CATS).filter(c=>A.cats[c].t>0&&A.cats[c].st!=="sicher")
    .sort((a,b)=>A.cats[a].c/A.cats[a].t-A.cats[b].c/A.cats[b].t);
  if(!keys.length)return `<div class="empty-state"><h2 style="margin-top:0">Keine Nachübungen nötig</h2><p>In allen geprüften Bereichen wurden alle Lücken richtig gelöst. Für weiteres Training eignet sich ein neuer Modelltest unter Zeitdruck (Sprachbausteine Teil 1 und 2 zusammen ca. 15 Minuten).</p></div>`;
  return langBar()+`<p class="sub" style="margin:0 0 16px">Nur die Bereiche, in denen im Test Fehler aufgetreten sind – der schwächste zuerst. Lesen Sie die Regel, dann lösen Sie die Übungen. Nach jeder Antwort erscheint eine Erklärung.</p>`+
  keys.map(c=>{const C=CATS[c];const o=A.cats[c];const pr=practiceScore(c);
    const wrong=o.hits.filter(h=>!h.ok);
    const wrongIn=wrong.map(h=>{const set=SETS.find(s=>s.id===h.id);const it=set.items.find(i=>i.n===h.n);return `<b>${h.id}/${h.n}</b> (${esc(it.skill)})`}).join("<br>");
    const wrongTr=wrong.map(h=>ti(h.id+"-"+h.n,0)?`<b>${h.id}/${h.n}</b> ${ti(h.id+"-"+h.n,0)}`:"").filter(Boolean).join("<br>");
    return `<section class="pcard" id="p-${c}"><div class="ph"><div><h3>${esc(C.name)}</h3>${tc(c,0)?`<div style="font-size:.9rem;color:var(--muted)" lang="${S.lang}" dir="${curLang().dir}">${tc(c,0)}</div>`:""}</div><span class="pill ${o.st}">Test: ${o.c}/${o.t} · ${ST_LABEL[o.st]}</span></div>
     <div class="why">Fehler bei:<br>${wrongIn}${trBox(wrongTr)}</div>
     <details class="rule" ${pr.answered===0||S.lang?"open":""}><summary>Regel und Tipps</summary><div class="rb">${C.rule}${trBox(tc(c,2))}</div></details>
     <div class="ex-list">${C.ex.map((x,i)=>{const key=c+"-"+i;const g=S.prac[key];const opts=shuffled(x.o,c+x.q);
       const qh=esc(x.q).replace("___",`<span class="blank">${g?esc(g.startsWith("–")?"–":g):"&nbsp;"}</span>`);
       return `<div class="exi"><div class="q"><span style="font-family:var(--f-num);font-size:.75rem;color:var(--muted);margin-right:6px">${i+1}</span>${qh}</div>
         <div class="opts">${opts.map(op=>{let cls="";if(g){if(op===x.a)cls="ok";else if(op===g)cls="bad";}
           return `<button class="opt ${cls}" data-px="${key}|${esc(op)}" ${g?"disabled":""} aria-pressed="${g===op}">${esc(op)}</button>`}).join("")}</div>
         ${g?`<div class="fb ${g===x.a?"ok":"bad"}"><b>${g===x.a?"Richtig.":"Leider falsch."}</b> ${x.e}${trBox(S.lang&&TR[S.lang].x&&TR[S.lang].x[c]?TR[S.lang].x[c][i]:"")}</div>`:""}</div>`}).join("")}</div>
     <div class="pfoot"><span>${pr.answered}/${pr.total} bearbeitet · <b>${pr.right}</b> richtig${pr.done?(pr.right===pr.total?" – sehr gut, dieser Bereich sitzt jetzt.":pr.right>=4?" – fast geschafft. Lesen Sie die Regel noch einmal zu den Fehlern.":" – bitte die Regel noch einmal genau lesen und wiederholen."):""}</span>
       ${pr.answered?`<button class="btn ghost small" data-preset="${c}">Übung wiederholen</button>`:""}</div></section>`}).join("");
}
document.addEventListener("click",e=>{
  const p=e.target.closest("[data-px]");
  if(p){const i=p.dataset.px.indexOf("|");const key=p.dataset.px.slice(0,i);const val=p.dataset.px.slice(i+1);
    S.prac[key]=val.replace(/&amp;/g,"&");save();const y=window.scrollY;render();window.scrollTo(0,y);return;}
  const r=e.target.closest("[data-preset]");
  if(r){const c=r.dataset.preset;Object.keys(S.prac).forEach(x=>{if(x.startsWith(c+"-"))delete S.prac[x]});save();render();const el=document.getElementById("p-"+c);if(el)el.scrollIntoView({block:"start"});}
});

/* ---------- Haupt-Render ---------- */
function render(){
  if((S.view==="profil"||S.view==="ueben")&&!S.evaluated)S.view="1A";
  renderTabs();
  const set=SETS.find(s=>s.id===S.view);
  $("#view").innerHTML=set?renderSet(set):(S.view==="profil"?renderProfile():renderPractice());
}
const nameEl=$("#tn-name");nameEl.value=S.name||"";
nameEl.addEventListener("input",()=>{S.name=nameEl.value.trim();save();});
render();
</script>

</body>
