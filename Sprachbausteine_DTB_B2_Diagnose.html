`<p><b>Неопределённый артикль</b> (ein/eine): о чём-то говорят впервые, или это одно из многих.</p><p><b>Определённый артикль</b> (der/die/das): что-то известно, уже упоминалось, единственно или уточнено – контекстом (<i>das gewünschte Angebot</i> – запрошенное Вами предложение), относительным придаточным (<i>der Lebenslauf, um den Sie gebeten haben</i>) или превосходной степенью (<i>das beste Angebot</i>).</p><p><b>Без артикля:</b> неопределённое множественное число (<i>Wir suchen Mitarbeiter</i>), неисчисляемые понятия в общем смысле (<i>Erfahrung, Geld, Zeit</i>), профессии после sein/werden/als (<i>Sie ist Ingenieurin</i>), устойчивые выражения (<i>Bescheid geben</i>).</p>`],
valenz:[`Управление глаголов и возвратные местоимения`,`Знать, какие дополнения нужны глаголу (Dativ, Akkusativ, возвратность) – например, sich entschuldigen, beachten + Akkusativ.`,
`<p><b>Глаголы с Dativ:</b> helfen, danken, gefallen, gehören, antworten, gratulieren, folgen, passen.</p><p><b>Dativ + Akkusativ:</b> jemandem etwas geben, schicken, mitteilen, empfehlen, anbieten (кому-то что-то дать/послать/сообщить/рекомендовать/предложить).</p><p><b>Возвратные глаголы:</b> sich entschuldigen, sich bewerben, sich beschweren, sich erkundigen, sich verlassen auf. Возвратное местоимение согласуется с подлежащим (см. таблицу): ich → mich/mir, wir → uns, Sie → sich.</p><p>Если в предложении уже есть дополнение в Akkusativ, возвратное местоимение стоит в Dativ: <i>Ich stelle <b>mir</b> das vor.</i></p><p><b>С предлогом или без?</b> <i>beachten</i> + Akkusativ (без предлога) – но <i>achten <b>auf</b></i> + Akkusativ (оба: обращать внимание).</p>`],
verbform:[`Пассив и вспомогательные глаголы`,`Правильно образовывать формы пассива (werden/worden/wurden) и перфект с haben или sein.`,
`<ul><li><b>Пассив, настоящее время:</b> werden + Partizip II – <i>Die Ware wird geliefert.</i></li><li><b>Пассив, Präteritum:</b> wurden + Partizip II – <i>Die Stellen wurden geschaffen.</i></li><li><b>Пассив, перфект:</b> sein + Partizip II + <b>worden</b> – <i>Der Vertrag ist unterschrieben worden.</i></li><li><b>Пассив с модальным глаголом:</b> модальный глагол … Partizip II + <b>werden</b> – <i>Das muss berücksichtigt werden.</i></li></ul><p><b>worden</b> – только в пассиве; <b>geworden</b> – у самостоятельного глагола <i>werden</i> = становиться (<i>Sie ist Chefin geworden</i>).</p><p><b>Перфект с sein:</b> движение/изменение состояния без дополнения в Akkusativ (ankommen, gehen, passieren, werden). В остальных случаях обычно <b>haben</b> (bekommen, erhalten).</p>`],
festeverb:[`Именно-глагольные сочетания и коллокации`,`Знать устойчивые словосочетания деловой речи (zur Verfügung stehen, einen Rabatt gewähren …).`,
`<p>В устойчивых сочетаниях значение несёт существительное, а глагол закреплён. Правильный глагол можно выучить только вместе с сочетанием.</p><ul><li>zur Verfügung <b>stehen</b> = быть в распоряжении, быть готовым помочь · zur Verfügung <b>stellen</b> = предоставлять что-то (+ Akkusativ)</li><li>eine Entscheidung <b>treffen</b> = принять решение</li><li>einen Antrag <b>stellen</b> = подать заявление</li><li>in Kraft <b>treten</b> = вступить в силу</li><li>Rücksicht <b>nehmen</b> auf = считаться с кем-/чем-либо</li><li>jemandem Bescheid <b>geben</b> = сообщить кому-то</li><li>einen Rabatt <b>gewähren</b> = предоставить скидку</li><li>einen Vertrag <b>abschließen</b> = заключить договор</li><li>jemandem <b>unterläuft</b> ein Fehler = кто-то случайно допускает ошибку</li></ul>`],
wortbildung:[`Однокоренные и легко путаемые слова`,`Различать похожие однокоренные слова по значению (Durchführung/Vorführung, ankommen/bekommen …).`,
`<p>Приставки и суффиксы сильно меняют значение. В тесте часто нужно выбрать из трёх однокоренных слов – проверьте <b>точное значение</b> и <b>конструкцию</b> (с Akkusativ? возвратный? перфект с sein?).</p><ul><li><b>bekommen</b> = получать (перфект с haben) · <b>ankommen</b> = прибывать (перфект с sein) · <b>vorkommen</b> = случаться, встречаться</li><li><b>Durchführung</b> = проведение, выполнение · <b>Vorführung</b> = показ, демонстрация · <b>Durchsetzung</b> = осуществление вопреки сопротивлению</li><li><b>Auftrag</b> = заказ (клиента) · <b>Antrag</b> = заявление · <b>Vertrag</b> = договор · <b>Beitrag</b> = вклад, взнос, статья</li><li><b>gewähren</b> = предоставлять · <b>sich bewähren</b> = оправдать себя · <b>sich gewöhnen an</b> = привыкать к</li><li><b>senken</b> = снижать что-то (переходный) · <b>sinken</b> = снижаться, падать (непереходный)</li></ul>`]},
i:{
"1A-46":[`Относительное местоимение: род слова, к которому оно относится (die Bewerbung → ж. р.), и падеж в придаточном (дополнение в Akkusativ к „gelesen“).`,`Относительное местоимение относится к <i>Ihre Bewerbung</i> (ж. р., ед. ч.). В придаточном это дополнение в Akkusativ: <i>Wir haben die Bewerbung gelesen</i> → <b>die</b>. <i>deren</i> было бы Genitiv (принадлежность) и здесь не подходит.`],
"1A-47":[`Глагол с устойчивым предлогом (bestehen in + Dativ) и wo(r)- + предлог в косвенном вопросе.`,`<i>bestehen in</i> = заключаться в: <i>Meine Aufgaben bestanden in der Planung …</i> В косвенном вопросе получается <b>wo(r) + in = worin</b>. В <i>darauf/daran</i> неправильный предлог, и это не вопросительные слова.`],
"1A-48":[`Союз условия + глагол в конце придаточного.`,`Глагол <i>besitzen</i> стоит в конце → придаточное с подчинительным союзом. Речь идёт об условии → <b>Falls</b> (если). <i>trotzdem</i> – наречие: глагол должен был бы стоять сразу после него, и значение (противопоставление) не подходит.`],
"1A-49":[`Временной предлог с Genitiv (während + Genitiv).`,`<b>Während</b> + Genitiv обозначает период: <i>während der Einarbeitung</i> = во время ввода в должность. <i>der</i> здесь – Genitiv ж. р. (die Einarbeitung).`],
"1A-50":[`Определение в Genitiv: притяжательное местоимение в Genitiv; род слова „Zeugnis“ (das).`,`<i>eine Kopie wessen?</i> (копия чего?) → Genitiv. <i>das Arbeitszeugnis</i> – средний род → <b>Ihres</b> letzten Arbeitszeugnisses (существительное с окончанием -ses). <i>Ihrem</i> было бы Dativ.`],
"1A-51":[`sich freuen auf (будущее) + местоименное наречие, указывающее на инфинитивный оборот.`,`Предстоящему радуются с предлогом <b>auf</b> (скоро познакомиться). <b>darauf</b> вводит инфинитивный оборот. <i>daran</i> относится к глаголам вроде <i>denken an</i>.`],
"1B-46":[`Придаточное цели: damit (своё подлежащее, спрягаемый глагол) или um … zu (инфинитив без подлежащего).`,`Предложение выражает цель и имеет своё подлежащее (<i>alle</i>) и спрягаемый глагол (<i>können</i>) → <b>Damit</b> (чтобы). Для <i>um … zu</i> нужен инфинитив с <i>zu</i> без собственного подлежащего.`],
"1B-47":[`Относительное местоимение в Genitiv мн. ч. (принадлежность: deren Unterstützung).`,`Поддержка исходит от коллег (мн. ч.): <i>die Unterstützung der Kollegen</i> → Genitiv мн. ч. <b>deren</b> (чья). Обычно после него идёт существительное без артикля. <i>denen</i> – Dativ мн. ч.`],
"1B-48":[`einer/eine/einen + Genitiv мн. ч. („einen der beiden Termine“).`,`<i>einen der beiden Termine</i> = один из двух сроков. После <i>einen</i> вся группа стоит в Genitiv мн. ч.: <b>der</b> beiden Termine.`],
"1B-49":[`Парный союз je … desto/umso + сравнительная степень.`,`После <i>je</i> + сравнительная степень следует <b>desto</b> (или umso) + сравнительная степень, затем глагол: <i>… desto leichter wird euch die Umstellung fallen.</i> (чем раньше …, тем легче …)`],
"1B-50":[`denken an + местоименное наречие, указывающее на инфинитивный оборот.`,`<i>denken</i> (не забыть, помнить) употребляется с <b>an</b>: <i>Denkt <b>daran</b>, … einzutragen.</i> <i>darauf</i> относится к <i>achten auf, sich freuen auf</i>.`],
"1B-51":[`Пассив с модальным глаголом: Partizip II + werden (инфинитив).`,`После модального глагола <i>können</i> стоит инфинитив пассива: berücksichtigt <b>werden</b>. <i>worden</i> бывает только в перфекте/плюсквамперфекте пассива (<i>ist berücksichtigt worden</i>).`],
"2A-52":[`Определённость (запрошенное предложение известно) + род (das Angebot) + окончание прилагательного.`,`Господин Брандт запросил предложение – значит, оно известно и конкретно: <b>das</b> gewünschte Angebot. <i>ein</i> не подходит ни к ситуации, ни к окончанию <i>-e</i> (правильно было бы <i>ein gewünschtes</i>); <i>den</i> – мужской род.`],
"2A-53":[`Однокоренные слова: различать Durchführung / Durchsetzung / Vorführung.`,`Работы <b>durchgeführt</b> (проводят, выполняют) → die <b>Durchführung</b> der Arbeiten. <i>Durchsetzung</i> = добиться чего-то вопреки сопротивлению; <i>Vorführung</i> = показ, презентация.`],
"2A-54":[`achten auf + Akkusativ или beachten + Akkusativ (без предлога).`,`В предложении уже есть <i>auf</i> → <b>achten auf</b> (обращать внимание на). <i>beachten</i> требует дополнения в Akkusativ без предлога (<i>Wir beachten die Vorschriften</i>). <i>aufpassen</i> – глагол с отделяемой приставкой и значит «быть осторожным, присматривать».`],
"2A-55":[`Коллокация „einen Rabatt gewähren“; различать похожие по звучанию глаголы.`,`Скидку, доступ или кредит <b>gewährt</b> (официально предоставляют). <i>sich bewähren</i> = оправдать себя; <i>sich gewöhnen an</i> = привыкнуть к.`],
"2A-56":[`sich entscheiden für или sich entschließen zu.`,`Предлог <i>für</i> уже есть в предложении → sich <b>entscheiden</b> für (выбрать, решиться на). <i>sich entschließen</i> требует <i>zu</i>; <i>bestimmen</i> здесь невозможно.`],
"2A-57":[`Именно-глагольное сочетание: zur Verfügung stehen или zur Verfügung stellen.`,`Подлежащее – <i>Frau Lehmann</i>, которая готова помочь: она <b>steht</b> Ihnen zur Verfügung (в Вашем распоряжении). <i>zur Verfügung stellen</i> требует дополнения в Akkusativ (<i>Wir stellen Ihnen einen Raum zur Verfügung</i>).`],
"2B-52":[`Различать глаголы с приставками (ankommen/bekommen/annehmen) + перфект с sein.`,`Картриджи не прибыли вовремя: <b>angekommen</b> (ankommen = прибыть, перфект с <i>sein</i>). <i>bekommen</i> образует перфект с <i>haben</i> и значит «получать»; <i>angenommen sind</i> без <i>worden</i> неправильно.`],
"2B-53":[`Устойчивое выражение: jemandem unterläuft ein Fehler.`,`Устойчивое выражение для случайной ошибки: <i>Uns ist ein Fehler <b>unterlaufen</b>.</i> <i>unterlassen</i> = воздержаться от чего-то; <i>zustoßen</i> = с кем-то случается что-то плохое (например, несчастный случай).`],
"2B-54":[`Возвратное местоимение, согласованное с подлежащим (wir → uns).`,`<i>sich entschuldigen</i> (извиняться) – возвратный глагол; местоимение согласуется с подлежащим <i>wir</i> → <b>uns</b>. Тот, перед кем извиняются, уже назван (<i>bei Ihnen</i>).`],
"2B-55":[`Неопределённый артикль при первом упоминании + Akkusativ м. р.`,`Ваучер упоминается впервые → неопределённый артикль. <i>der Gutschein</i> – мужской род и дополнение в Akkusativ к <i>erhalten</i> → <b>einen</b>. <i>ein</i> было бы Nominativ, <i>den</i> предполагает, что ваучер уже известен.`],
"2B-56":[`Предлог с Genitiv для срока (innerhalb eines Jahres).`,`Срок → <b>innerhalb</b> (в течение) + Genitiv: <i>innerhalb eines Jahres</i>. <i>seit</i> и <i>ab</i> требуют Dativ и имеют другое значение.`],
"2B-57":[`Определить род (-ung → ж. р.) + Dativ после „in“ (Wo? – где?).`,`<i>die Abteilung</i> (-ung → всегда ж. р.), вопрос <i>Wo?</i> → Dativ: in <b>unserer</b> Versandabteilung. <i>unserem</i> – м./ср. род, <i>unseren</i> – Dativ мн. ч.`]}};

TR.uk={c:{
konn:[`Сполучники та порядок слів`,`Розрізняти сполучники та сполучні прислівники за значенням і місцем дієслова (falls, damit, je … desto).`,
`<p>Пропуск підказує, який тип сполучника потрібен, – зверніть увагу на <b>місце дієслова</b>:</p><ul><li><b>Підрядні сполучники</b> (weil, obwohl, falls/wenn, damit, sodass, während, nachdem, bevor, ob): дієслово стоїть <b>у кінці</b> речення.</li><li><b>Сполучні прислівники</b> (deshalb, trotzdem, außerdem, dennoch, allerdings): стоять на 1-му місці, дієслово йде <b>одразу після них</b> (2-ге місце).</li><li><b>Сурядні сполучники</b> (und, aber, oder, denn, sondern): нульова позиція – далі підмет, потім дієслово.</li></ul><p><b>damit</b> і <b>um … zu</b>: обидва виражають мету. <i>um … zu</i> – лише з інфінітивом і без власного підмета; якщо в підрядному реченні є свій підмет, потрібен <i>damit</i>.</p><p><b>Парні сполучники:</b> je + вищий ступінь …, desto/umso + вищий ступінь (чим …, тим …) · sowohl … als auch (як …, так і) · weder … noch (ні … ні) · entweder … oder (або … або) · nicht nur … sondern auch (не лише …, а й) · zwar … aber (хоча … але).</p><p><b>ob</b> вводить непряме питання «так/ні» (чи), <b>falls/wenn</b> – умову (якщо).</p>`],
praep:[`Прийменники та їхній відмінок`,`Добирати прийменники за значенням (момент часу, період, строк, причина, протиставлення) і відмінком.`,
`<p>Кожен прийменник вимагає певного відмінка (див. німецьку таблицю): <b>Genitiv</b>: während, wegen, trotz, innerhalb … · <b>Dativ</b>: seit, ab, aus, bei, mit … · <b>Akkusativ</b>: bis, durch, für, gegen, ohne, um.</p><p><b>Час:</b> <i>seit</i> = почалося в минулому й триває досі (з теперішнім часом) · <i>ab</i> = початкова точка, часто в майбутньому · <i>während</i> = під час · <i>innerhalb</i> = протягом (строк) · <i>bis</i> = кінцева точка (до).</p><p><b>Причина і протиставлення:</b> <i>wegen/aufgrund</i> називають причину (через), <i>trotz</i> – протиставлення (попри, незважаючи на).</p><p>Без артикля після <i>innerhalb</i> зазвичай стоїть <i>von</i> + Dativ: <i>innerhalb von 14 Tagen</i>.</p>`],
rektion:[`Сталі прийменники (керування)`,`Знати, якого прийменника вимагає дієслово, іменник чи прикметник (bestehen in, sich freuen auf, achten auf …).`,
`<p>Багато дієслів, іменників і прикметників мають <b>сталий прийменник</b>. Його треба вчити разом зі словом – найкраще з відмінком і прикладом (див. таблицю).</p><ul><li><i>sich freuen auf</i> = радіти майбутньому, чекати з нетерпінням · <i>sich freuen über</i> = радіти тому, що вже сталося</li><li><i>bestehen in</i> = полягати в (зміст завдання) · <i>bestehen aus</i> = складатися з (частин)</li><li><i>sich entscheiden für</i> = обрати, вирішити на користь – але <i>sich entschließen zu</i></li><li><i>Interesse an</i> + Dativ – але <i>sich interessieren für</i></li></ul><p><b>Стратегія:</b> якщо прийменник уже є в реченні, шукайте дієслово, яке до нього пасує. Якщо його немає, запитайте себе: якого прийменника вимагає це дієслово?</p>`],
pronadv:[`Займенникові прислівники (darauf, worin …)`,`Правильно утворювати та вживати da(r)- і wo(r)- + прийменник (darauf, daran, worin …).`,
`<p>Для <b>предметів</b> (не для людей) сполучення «прийменник + іменник/займенник» замінюють займенниковим прислівником: <b>da-</b> + прийменник для відсилання (darauf, daran, dafür), <b>wo-</b> + прийменник у питаннях і непрямих питаннях (worauf, woran, wofür).</p><p>Якщо прийменник починається з голосного, вставляється <b>r</b>: dar-auf, wor-in.</p><p>Займенниковий прислівник може вказувати наперед на наступне <b>підрядне речення з dass або інфінітивний зворот</b>: <i>Ich freue mich <b>darauf</b>, Sie kennenzulernen.</i> (Я з нетерпінням чекаю на знайомство з Вами.)</p><p><b>Люди:</b> прийменник + займенник: <i>Ich verlasse mich auf <b>ihn</b>. An <b>wen</b> denken Sie?</i></p>`],
relativ:[`Відносні займенники`,`Визначати рід/число за словом, до якого належить займенник, а відмінок – за його роллю в підрядному реченні (die, deren, denen …).`,
`<p>Два питання: <b>1.</b> До чого належить займенник? → рід і число. <b>2.</b> Яку роль він виконує в підрядному реченні (або який прийменник стоїть перед ним)? → відмінок. Форми – у німецькій таблиці.</p><p>Зверніть увагу на особливі форми: Dativ мн. <b>denen</b>, Genitiv <b>dessen</b> (ч./сер. рід) і <b>deren</b> (ж. рід/мн.).</p><p><b>dessen/deren</b> виражають належність («чий»); після них стоїть іменник <b>без артикля</b>: <i>die Firma, <b>deren</b> Produkte …</i> (фірма, чиї продукти …).</p>`],
kasus:[`Відмінкові закінчення та закінчення прикметників`,`Розпізнавати відмінок і добирати правильне закінчення артикля, присвійного займенника та прикметника.`,
`<p><b>Як визначити відмінок:</b> чого вимагає дієслово (helfen + Dativ, schicken + Dativ + Akkusativ)? Який прийменник стоїть перед словом? Чи це означення (<i>eine Kopie <b>wessen</b>?</i> – копія чого? → Genitiv)?</p><p>Форми артиклів у всіх чотирьох відмінках – у німецькій таблиці. У Dativ мн. іменник зазвичай отримує <b>-n</b>, у Genitiv ч./сер. роду – <b>-s/-es</b>.</p><p><b>Закінчення прикметника:</b> якщо артикль уже чітко показує відмінок (der, dem, einen …), прикметник зазвичай має <b>-e/-en</b>. Якщо артиклеве слово не має закінчення (ein, Ihr, unser у Nominativ/Akkusativ) або артикля немає, сигнальне закінчення отримує прикметник: <i>ein großes Interesse, mit freundlichen Grüßen</i>.</p>`],
genus:[`Рід іменників`,`Знати рід важливих іменників або визначати його за суфіксами (-ung → die, das Zeugnis …).`,
`<p>Рід визначає закінчення артиклів, займенників і прикметників. Часто допомагають суфікси:</p><ul><li><b>жіночий рід (die):</b> -ung, -heit, -keit, -schaft, -ion, -tät, -ur, -ik</li><li><b>середній рід (das):</b> -ment, -um, -chen, -lein, субстантивовані інфінітиви (das Lernen), багато слів на Ge- (das Gehalt, das Gespräch)</li><li><b>чоловічий рід (der):</b> -er (люди/прилади), -ling, -ismus, дні тижня, місяці</li></ul><p><b>Складні слова:</b> рід визначає останнє слово: <i>der Vertrag → der Arbeits<b>vertrag</b></i>.</p><p><b>Важливі слова з професійної сфери:</b> der Termin, der Vertrag, der Lebenslauf, der Antrag · das Angebot, das Gehalt, das Zeugnis, das Gespräch · die Rechnung, die Frist, die Bewerbung, die Abteilung.</p>`],
artikel:[`Означений, неозначений артикль чи без артикля`,`Вирішувати, чи щось нове, відоме/конкретне чи загальне (ein Gutschein – das gewünschte Angebot).`,
`<p><b>Неозначений артикль</b> (ein/eine): про щось говорять уперше, або це одне з багатьох.</p><p><b>Означений артикль</b> (der/die/das): щось відоме, уже згадувалося, єдине або уточнене – контекстом (<i>das gewünschte Angebot</i> – пропозиція, яку Ви запитували), відносним реченням (<i>der Lebenslauf, um den Sie gebeten haben</i>) або найвищим ступенем (<i>das beste Angebot</i>).</p><p><b>Без артикля:</b> неозначена множина (<i>Wir suchen Mitarbeiter</i>), незлічувані поняття в загальному значенні (<i>Erfahrung, Geld, Zeit</i>), професії після sein/werden/als (<i>Sie ist Ingenieurin</i>), сталі вирази (<i>Bescheid geben</i>).</p>`],
valenz:[`Керування дієслів і зворотні займенники`,`Знати, яких додатків потребує дієслово (Dativ, Akkusativ, зворотність) – наприклад, sich entschuldigen, beachten + Akkusativ.`,
`<p><b>Дієслова з Dativ:</b> helfen, danken, gefallen, gehören, antworten, gratulieren, folgen, passen.</p><p><b>Dativ + Akkusativ:</b> jemandem etwas geben, schicken, mitteilen, empfehlen, anbieten (комусь щось дати/надіслати/повідомити/порекомендувати/запропонувати).</p><p><b>Зворотні дієслова:</b> sich entschuldigen, sich bewerben, sich beschweren, sich erkundigen, sich verlassen auf. Зворотний займенник узгоджується з підметом (див. таблицю): ich → mich/mir, wir → uns, Sie → sich.</p><p>Якщо в реченні вже є додаток в Akkusativ, зворотний займенник стоїть у Dativ: <i>Ich stelle <b>mir</b> das vor.</i></p><p><b>З прийменником чи без?</b> <i>beachten</i> + Akkusativ (без прийменника) – але <i>achten <b>auf</b></i> + Akkusativ (обидва: звертати увагу).</p>`],
verbform:[`Пасив і допоміжні дієслова`,`Правильно утворювати форми пасиву (werden/worden/wurden) і перфект із haben або sein.`,
`<ul><li><b>Пасив, теперішній час:</b> werden + Partizip II – <i>Die Ware wird geliefert.</i></li><li><b>Пасив, Präteritum:</b> wurden + Partizip II – <i>Die Stellen wurden geschaffen.</i></li><li><b>Пасив, перфект:</b> sein + Partizip II + <b>worden</b> – <i>Der Vertrag ist unterschrieben worden.</i></li><li><b>Пасив із модальним дієсловом:</b> модальне дієслово … Partizip II + <b>werden</b> – <i>Das muss berücksichtigt werden.</i></li></ul><p><b>worden</b> – лише в пасиві; <b>geworden</b> – у повнозначного дієслова <i>werden</i> = ставати (<i>Sie ist Chefin geworden</i>).</p><p><b>Перфект із sein:</b> рух/зміна стану без додатка в Akkusativ (ankommen, gehen, passieren, werden). В інших випадках зазвичай <b>haben</b> (bekommen, erhalten).</p>`],
festeverb:[`Іменно-дієслівні сполуки та колокації`,`Знати сталі словосполучення ділового мовлення (zur Verfügung stehen, einen Rabatt gewähren …).`,
`<p>У сталих сполуках значення несе іменник, а дієслово закріплене. Правильне дієслово можна вивчити лише разом зі сполукою.</p><ul><li>zur Verfügung <b>stehen</b> = бути в розпорядженні, бути готовим допомогти · zur Verfügung <b>stellen</b> = надавати щось (+ Akkusativ)</li><li>eine Entscheidung <b>treffen</b> = ухвалити рішення</li><li>einen Antrag <b>stellen</b> = подати заяву</li><li>in Kraft <b>treten</b> = набрати чинності</li><li>Rücksicht <b>nehmen</b> auf = зважати на когось/щось</li><li>jemandem Bescheid <b>geben</b> = повідомити когось</li><li>einen Rabatt <b>gewähren</b> = надати знижку</li><li>einen Vertrag <b>abschließen</b> = укласти договір</li><li>jemandem <b>unterläuft</b> ein Fehler = хтось випадково припускається помилки</li></ul>`],
wortbildung:[`Спільнокореневі та схожі слова`,`Розрізняти схожі спільнокореневі слова за значенням (Durchführung/Vorführung, ankommen/bekommen …).`,
`<p>Префікси та суфікси сильно змінюють значення. У тесті часто треба обрати з трьох спільнокореневих слів – перевірте <b>точне значення</b> і <b>конструкцію</b> (з Akkusativ? зворотне? перфект із sein?).</p><ul><li><b>bekommen</b> = отримувати (перфект із haben) · <b>ankommen</b> = прибувати (перфект із sein) · <b>vorkommen</b> = траплятися, зустрічатися</li><li><b>Durchführung</b> = проведення, виконання · <b>Vorführung</b> = показ, демонстрація · <b>Durchsetzung</b> = здійснення всупереч опору</li><li><b>Auftrag</b> = замовлення (клієнта) · <b>Antrag</b> = заява · <b>Vertrag</b> = договір · <b>Beitrag</b> = внесок, стаття</li><li><b>gewähren</b> = надавати · <b>sich bewähren</b> = виправдати себе · <b>sich gewöhnen an</b> = звикати до</li><li><b>senken</b> = знижувати щось (перехідне) · <b>sinken</b> = знижуватися, падати (неперехідне)</li></ul>`]},
i:{
"1A-46":[`Відносний займенник: рід слова, до якого він належить (die Bewerbung → ж. р.), і відмінок у підрядному реченні (додаток в Akkusativ до „gelesen“).`,`Відносний займенник належить до <i>Ihre Bewerbung</i> (ж. р., одн.). У підрядному реченні це додаток в Akkusativ: <i>Wir haben die Bewerbung gelesen</i> → <b>die</b>. <i>deren</i> був би Genitiv (належність) і тут не підходить.`],
"1A-47":[`Дієслово зі сталим прийменником (bestehen in + Dativ) і wo(r)- + прийменник у непрямому питанні.`,`<i>bestehen in</i> = полягати в: <i>Meine Aufgaben bestanden in der Planung …</i> У непрямому питанні виходить <b>wo(r) + in = worin</b>. У <i>darauf/daran</i> неправильний прийменник, і це не питальні слова.`],
"1A-48":[`Сполучник умови + дієслово в кінці підрядного речення.`,`Дієслово <i>besitzen</i> стоїть у кінці → підрядне речення з підрядним сполучником. Ідеться про умову → <b>Falls</b> (якщо). <i>trotzdem</i> – прислівник: дієслово мало б стояти одразу після нього, і значення (протиставлення) не підходить.`],
"1A-49":[`Часовий прийменник із Genitiv (während + Genitiv).`,`<b>Während</b> + Genitiv позначає період: <i>während der Einarbeitung</i> = під час введення в посаду. <i>der</i> тут – Genitiv ж. р. (die Einarbeitung).`],
"1A-50":[`Означення в Genitiv: присвійний займенник у Genitiv; рід слова „Zeugnis“ (das).`,`<i>eine Kopie wessen?</i> (копія чого?) → Genitiv. <i>das Arbeitszeugnis</i> – середній рід → <b>Ihres</b> letzten Arbeitszeugnisses (іменник із закінченням -ses). <i>Ihrem</i> був би Dativ.`],
"1A-51":[`sich freuen auf (майбутнє) + займенниковий прислівник, що вказує на інфінітивний зворот.`,`Майбутньому радіють із прийменником <b>auf</b> (незабаром познайомитися). <b>darauf</b> вводить інфінітивний зворот. <i>daran</i> належить до дієслів на кшталт <i>denken an</i>.`],
"1B-46":[`Підрядне речення мети: damit (власний підмет, відмінюване дієслово) чи um … zu (інфінітив без підмета).`,`Речення виражає мету й має власний підмет (<i>alle</i>) і відмінюване дієслово (<i>können</i>) → <b>Damit</b> (щоб). Для <i>um … zu</i> потрібен інфінітив із <i>zu</i> без власного підмета.`],
"1B-47":[`Відносний займенник у Genitiv мн. (належність: deren Unterstützung).`,`Підтримка надходить від колег (мн.): <i>die Unterstützung der Kollegen</i> → Genitiv мн. <b>deren</b> (чия). Зазвичай після нього йде іменник без артикля. <i>denen</i> – Dativ мн.`],
"1B-48":[`einer/eine/einen + Genitiv мн. („einen der beiden Termine“).`,`<i>einen der beiden Termine</i> = один із двох термінів. Після <i>einen</i> уся група стоїть у Genitiv мн.: <b>der</b> beiden Termine.`],
"1B-49":[`Парний сполучник je … desto/umso + вищий ступінь.`,`Після <i>je</i> + вищий ступінь іде <b>desto</b> (або umso) + вищий ступінь, далі дієслово: <i>… desto leichter wird euch die Umstellung fallen.</i> (чим раніше …, тим легше …)`],
"1B-50":[`denken an + займенниковий прислівник, що вказує на інфінітивний зворот.`,`<i>denken</i> (не забути, пам’ятати) вживається з <b>an</b>: <i>Denkt <b>daran</b>, … einzutragen.</i> <i>darauf</i> належить до <i>achten auf, sich freuen auf</i>.`],
"1B-51":[`Пасив із модальним дієсловом: Partizip II + werden (інфінітив).`,`Після модального дієслова <i>können</i> стоїть інфінітив пасиву: berücksichtigt <b>werden</b>. <i>worden</i> буває лише в перфекті/плюсквамперфекті пасиву (<i>ist berücksichtigt worden</i>).`],
"2A-52":[`Означеність (запитувана пропозиція відома) + рід (das Angebot) + закінчення прикметника.`,`Пан Брандт запитував пропозицію – отже, вона відома й конкретна: <b>das</b> gewünschte Angebot. <i>ein</i> не підходить ні до ситуації, ні до закінчення <i>-e</i> (правильно було б <i>ein gewünschtes</i>); <i>den</i> – чоловічий рід.`],
"2A-53":[`Спільнокореневі слова: розрізняти Durchführung / Durchsetzung / Vorführung.`,`Роботи <b>durchgeführt</b> (проводять, виконують) → die <b>Durchführung</b> der Arbeiten. <i>Durchsetzung</i> = домогтися чогось усупереч опору; <i>Vorführung</i> = показ, презентація.`],
"2A-54":[`achten auf + Akkusativ чи beachten + Akkusativ (без прийменника).`,`У реченні вже є <i>auf</i> → <b>achten auf</b> (звертати увагу на). <i>beachten</i> вимагає додатка в Akkusativ без прийменника (<i>Wir beachten die Vorschriften</i>). <i>aufpassen</i> – дієслово з відокремлюваним префіксом, означає «бути обережним, наглядати».`],
"2A-55":[`Колокація „einen Rabatt gewähren“; розрізняти схожі на звучання дієслова.`,`Знижку, доступ чи кредит <b>gewährt</b> (офіційно надають). <i>sich bewähren</i> = виправдати себе; <i>sich gewöhnen an</i> = звикнути до.`],
"2A-56":[`sich entscheiden für чи sich entschließen zu.`,`Прийменник <i>für</i> уже є в реченні → sich <b>entscheiden</b> für (обрати, вирішити на користь). <i>sich entschließen</i> вимагає <i>zu</i>; <i>bestimmen</i> тут неможливе.`],
"2A-57":[`Іменно-дієслівна сполука: zur Verfügung stehen чи zur Verfügung stellen.`,`Підмет – <i>Frau Lehmann</i>, яка готова допомогти: вона <b>steht</b> Ihnen zur Verfügung (у Вашому розпорядженні). <i>zur Verfügung stellen</i> вимагає додатка в Akkusativ (<i>Wir stellen Ihnen einen Raum zur Verfügung</i>).`],
"2B-52":[`Розрізняти дієслова з префіксами (ankommen/bekommen/annehmen) + перфект із sein.`,`Картриджі не надійшли вчасно: <b>angekommen</b> (ankommen = прибути, перфект із <i>sein</i>). <i>bekommen</i> утворює перфект із <i>haben</i> і означає «отримувати»; <i>angenommen sind</i> без <i>worden</i> неправильно.`],
"2B-53":[`Сталий вираз: jemandem unterläuft ein Fehler.`,`Сталий вираз для випадкової помилки: <i>Uns ist ein Fehler <b>unterlaufen</b>.</i> <i>unterlassen</i> = утриматися від чогось; <i>zustoßen</i> = з кимось стається щось погане (наприклад, нещасний випадок).`],
"2B-54":[`Зворотний займенник, узгоджений із підметом (wir → uns).`,`<i>sich entschuldigen</i> (вибачатися) – зворотне дієслово; займенник узгоджується з підметом <i>wir</i> → <b>uns</b>. Того, перед ким вибачаються, уже названо (<i>bei Ihnen</i>).`],
"2B-55":[`Неозначений артикль при першій згадці + Akkusativ ч. р.`,`Ваучер згадується вперше → неозначений артикль. <i>der Gutschein</i> – чоловічий рід і додаток в Akkusativ до <i>erhalten</i> → <b>einen</b>. <i>ein</i> був би Nominativ, <i>den</i> передбачає, що ваучер уже відомий.`],
"2B-56":[`Прийменник із Genitiv для строку (innerhalb eines Jahres).`,`Строк → <b>innerhalb</b> (протягом) + Genitiv: <i>innerhalb eines Jahres</i>. <i>seit</i> і <i>ab</i> вимагають Dativ і мають інше значення.`],
"2B-57":[`Визначити рід (-ung → ж. р.) + Dativ після „in“ (Wo? – де?).`,`<i>die Abteilung</i> (-ung → завжди ж. р.), питання <i>Wo?</i> → Dativ: in <b>unserer</b> Versandabteilung. <i>unserem</i> – ч./сер. рід, <i>unseren</i> – Dativ мн.`]}};
TR.ar={c:{
konn:[`أدوات الربط وترتيب الجملة`,`التمييز بين أدوات الربط وظروف الربط حسب المعنى وموقع الفعل (falls, damit, je … desto).`,
`<p>الفراغ يدلّ على نوع أداة الربط المطلوبة – انتبه إلى <b>موقع الفعل</b>:</p><ul><li><b>أدوات الجملة الفرعية</b> (weil, obwohl, falls/wenn, damit, sodass, während, nachdem, bevor, ob): يأتي الفعل <b>في آخر</b> الجملة.</li><li><b>ظروف الربط</b> (deshalb, trotzdem, außerdem, dennoch, allerdings): تأتي في الموقع الأول، ويليها الفعل <b>مباشرةً</b> (الموقع الثاني).</li><li><b>أدوات العطف</b> (und, aber, oder, denn, sondern): في الموقع صفر – ثم الفاعل ثم الفعل.</li></ul><p><b>damit</b> و<b>um … zu</b>: كلاهما يعبّر عن الغرض. تُستخدم <i>um … zu</i> مع المصدر فقط ومن دون فاعل خاص؛ أمّا إذا كان للجملة الفرعية فاعل خاص بها فنحتاج إلى <i>damit</i>.</p><p><b>أدوات الربط الثنائية:</b> je + صيغة المقارنة …، desto/umso + صيغة المقارنة (كلّما … ازداد …) · sowohl … als auch (كلٌّ من … و…) · weder … noch (لا … ولا) · entweder … oder (إمّا … أو) · nicht nur … sondern auch (ليس فقط … بل أيضًا) · zwar … aber (صحيح أنّ … لكن).</p><p><b>ob</b> تُدخل سؤالًا غير مباشر جوابه نعم/لا (ما إذا كان)، و<b>falls/wenn</b> تُدخل شرطًا (إذا).</p>`],
praep:[`حروف الجر وحالتها الإعرابية`,`اختيار حروف الجر حسب المعنى (نقطة زمنية، مدة، مهلة، سبب، تعارض) وحسب الحالة.`,
`<p>كل حرف جر يتطلب حالة محددة (انظر الجدول الألماني): <b>Genitiv</b>: während, wegen, trotz, innerhalb … · <b>Dativ</b>: seit, ab, aus, bei, mit … · <b>Akkusativ</b>: bis, durch, für, gegen, ohne, um.</p><p><b>الزمن:</b> <i>seit</i> = بدأ في الماضي وما زال مستمرًا (مع زمن المضارع) · <i>ab</i> = نقطة البداية، غالبًا في المستقبل · <i>während</i> = أثناء · <i>innerhalb</i> = خلال مهلة · <i>bis</i> = نقطة النهاية (حتى).</p><p><b>السبب والتعارض:</b> <i>wegen/aufgrund</i> تذكران السبب (بسبب)، و<i>trotz</i> تذكر التعارض (على الرغم من).</p><p>إذا لم توجد أداة تعريف فغالبًا ما تأتي بعد <i>innerhalb</i> كلمة <i>von</i> + Dativ: <i>innerhalb von 14 Tagen</i>.</p>`],
rektion:[`حروف الجر الثابتة (التعدية بحرف)`,`معرفة حرف الجر الذي يتطلبه الفعل أو الاسم أو الصفة (bestehen in, sich freuen auf, achten auf …).`,
`<p>لكثير من الأفعال والأسماء والصفات <b>حرف جر ثابت</b>. يجب حفظه مع الكلمة – والأفضل مع الحالة ومثال (انظر الجدول).</p><ul><li><i>sich freuen auf</i> = يتطلّع بفرح إلى شيء في المستقبل · <i>sich freuen über</i> = يفرح بشيء حدث</li><li><i>bestehen in</i> = يتمثّل في (مضمون المهمة) · <i>bestehen aus</i> = يتكوّن من (أجزاء)</li><li><i>sich entscheiden für</i> = يقرّر اختيار شيء – لكن <i>sich entschließen zu</i></li><li><i>Interesse an</i> + Dativ – لكن <i>sich interessieren für</i></li></ul><p><b>استراتيجية:</b> إذا كان حرف الجر موجودًا في الجملة فابحث عن الفعل المناسب له. وإذا كان ناقصًا فاسأل: ما حرف الجر الذي يتطلبه هذا الفعل؟</p>`],
pronadv:[`الظروف الضميرية (darauf, worin …)`,`تكوين واستخدام da(r)- و wo(r)- + حرف الجر بشكل صحيح (darauf, daran, worin …).`,
`<p>مع <b>الأشياء</b> (لا الأشخاص) يُستبدل «حرف الجر + اسم/ضمير» بظرف ضميري: <b>da-</b> + حرف الجر للإحالة إلى شيء (darauf, daran, dafür)، و<b>wo-</b> + حرف الجر في الأسئلة والأسئلة غير المباشرة (worauf, woran, wofür).</p><p>إذا بدأ حرف الجر بحرف علّة يُضاف <b>r</b>: dar-auf, wor-in.</p><p>يمكن للظرف الضميري أن يشير مسبقًا إلى <b>جملة dass أو جملة مصدرية</b> تأتي بعده: <i>Ich freue mich <b>darauf</b>, Sie kennenzulernen.</i> (أتطلّع إلى التعرّف عليكم.)</p><p><b>الأشخاص:</b> حرف الجر + ضمير: <i>Ich verlasse mich auf <b>ihn</b>. An <b>wen</b> denken Sie?</i></p>`],
relativ:[`أسماء الموصول (ضمائر الصلة)`,`تحديد الجنس والعدد من الكلمة المرجعية، والحالة من وظيفة الضمير في جملة الصلة (die, deren, denen …).`,
`<p>سؤالان: <b>1.</b> إلى أي كلمة يعود الضمير؟ ← الجنس والعدد. <b>2.</b> ما وظيفته في جملة الصلة (أو ما حرف الجر الذي يسبقه)؟ ← الحالة. الصيغ موجودة في الجدول الألماني.</p><p>انتبه إلى الصيغ الخاصة: Dativ الجمع <b>denen</b>، وGenitiv <b>dessen</b> (للمذكر/المحايد) و<b>deren</b> (للمؤنث/الجمع).</p><p><b>dessen/deren</b> تعبّران عن الملكية؛ ويأتي بعدهما اسم <b>بلا أداة تعريف</b>: <i>die Firma, <b>deren</b> Produkte …</i> (الشركة التي منتجاتها …).</p>`],
kasus:[`نهايات الحالات ونهايات الصفات`,`التعرّف على الحالة واختيار النهاية الصحيحة لأداة التعريف وأداة الملكية والصفة.`,
`<p><b>تحديد الحالة:</b> ماذا يتطلب الفعل (helfen + Dativ, schicken + Dativ + Akkusativ)؟ ما حرف الجر الذي يسبق الكلمة؟ هل هي مضاف إليه (<i>eine Kopie <b>wessen</b>?</i> – نسخة من ماذا؟ ← Genitiv)؟</p><p>صيغ أدوات التعريف في الحالات الأربع موجودة في الجدول الألماني. في Dativ الجمع يأخذ الاسم عادةً <b>-n</b>، وفي Genitiv المذكر/المحايد يأخذ <b>-s/-es</b>.</p><p><b>نهاية الصفة:</b> إذا كانت أداة التعريف تُظهر الحالة بوضوح (der, dem, einen …) فإن الصفة تنتهي غالبًا بـ <b>-e/-en</b>. وإذا لم يكن لأداة التعريف نهاية (ein, Ihr, unser في Nominativ/Akkusativ) أو لم توجد أداة أصلًا، فإن الصفة تحمل النهاية الدالّة: <i>ein großes Interesse, mit freundlichen Grüßen</i>.</p>`],
genus:[`جنس الأسماء`,`معرفة جنس الأسماء المهمة أو التعرّف عليه من النهايات (-ung ← die، das Zeugnis …).`,
`<p>الجنس يحدد نهايات أدوات التعريف والضمائر والصفات. والنهايات تساعد في كثير من الأحيان:</p><ul><li><b>مؤنث (die):</b> -ung, -heit, -keit, -schaft, -ion, -tät, -ur, -ik</li><li><b>محايد (das):</b> -ment, -um, -chen, -lein، والمصادر المستخدمة كأسماء (das Lernen)، وكثير من الكلمات التي تبدأ بـ Ge- (das Gehalt, das Gespräch)</li><li><b>مذكر (der):</b> -er (أشخاص/أجهزة)، -ling، -ismus، أيام الأسبوع، الأشهر</li></ul><p><b>الأسماء المركّبة:</b> الكلمة الأخيرة تحدد الجنس: <i>der Vertrag → der Arbeits<b>vertrag</b></i>.</p><p><b>كلمات مهمة من عالم العمل:</b> der Termin, der Vertrag, der Lebenslauf, der Antrag · das Angebot, das Gehalt, das Zeugnis, das Gespräch · die Rechnung, die Frist, die Bewerbung, die Abteilung.</p>`],
artikel:[`أداة التعريف أو أداة التنكير أو بلا أداة`,`تحديد ما إذا كان الشيء جديدًا أو معروفًا/محددًا أو عامًا (ein Gutschein – das gewünschte Angebot).`,
`<p><b>أداة التنكير</b> (ein/eine): يُذكر الشيء لأول مرة أو هو واحد من كثيرين.</p><p><b>أداة التعريف</b> (der/die/das): الشيء معروف أو ذُكر سابقًا أو فريد أو محدَّد – بالسياق (<i>das gewünschte Angebot</i> – العرض الذي طلبتموه)، أو بجملة صلة (<i>der Lebenslauf, um den Sie gebeten haben</i>)، أو بصيغة التفضيل (<i>das beste Angebot</i>).</p><p><b>بلا أداة:</b> الجمع غير المحدد (<i>Wir suchen Mitarbeiter</i>)، والمفاهيم غير المعدودة بمعناها العام (<i>Erfahrung, Geld, Zeit</i>)، والمهن بعد sein/werden/als (<i>Sie ist Ingenieurin</i>)، والتعابير الثابتة (<i>Bescheid geben</i>).</p>`],
valenz:[`متمّمات الفعل والضمائر الانعكاسية`,`معرفة المتمّمات التي يحتاجها الفعل (Dativ، Akkusativ، انعكاسي) – مثل sich entschuldigen و beachten + Akkusativ.`,
`<p><b>أفعال تأخذ Dativ:</b> helfen, danken, gefallen, gehören, antworten, gratulieren, folgen, passen.</p><p><b>Dativ + Akkusativ:</b> jemandem etwas geben, schicken, mitteilen, empfehlen, anbieten (يعطي/يرسل/يُبلغ/يوصي/يعرض على شخصٍ شيئًا).</p><p><b>الأفعال الانعكاسية:</b> sich entschuldigen, sich bewerben, sich beschweren, sich erkundigen, sich verlassen auf. يتوافق الضمير الانعكاسي مع الفاعل (انظر الجدول): ich ← mich/mir، wir ← uns، Sie ← sich.</p><p>إذا وُجد في الجملة مفعول به في Akkusativ يأتي الضمير الانعكاسي في Dativ: <i>Ich stelle <b>mir</b> das vor.</i></p><p><b>مع حرف جر أم بدونه؟</b> <i>beachten</i> + Akkusativ (بلا حرف جر) – لكن <i>achten <b>auf</b></i> + Akkusativ (كلاهما: ينتبه إلى).</p>`],
verbform:[`المبني للمجهول والأفعال المساعدة`,`تكوين صيغ المبني للمجهول (werden/worden/wurden) وزمن Perfekt مع haben أو sein بشكل صحيح.`,
`<ul><li><b>المجهول في المضارع:</b> werden + Partizip II – <i>Die Ware wird geliefert.</i></li><li><b>المجهول في Präteritum:</b> wurden + Partizip II – <i>Die Stellen wurden geschaffen.</i></li><li><b>المجهول في Perfekt:</b> sein + Partizip II + <b>worden</b> – <i>Der Vertrag ist unterschrieben worden.</i></li><li><b>المجهول مع الأفعال الناقصة (Modalverben):</b> الفعل الناقص … Partizip II + <b>werden</b> – <i>Das muss berücksichtigt werden.</i></li></ul><p><b>worden</b> في المبني للمجهول فقط؛ و<b>geworden</b> مع الفعل الأساسي <i>werden</i> = يصبح (<i>Sie ist Chefin geworden</i>).</p><p><b>Perfekt مع sein:</b> أفعال الحركة/تغيّر الحالة التي ليس لها مفعول به في Akkusativ (ankommen, gehen, passieren, werden). وفي غير ذلك غالبًا <b>haben</b> (bekommen, erhalten).</p>`],
festeverb:[`التراكيب الاسمية الفعلية والمتلازمات اللفظية`,`معرفة التراكيب الثابتة في لغة العمل (zur Verfügung stehen, einen Rabatt gewähren …).`,
`<p>في التراكيب الثابتة يحمل الاسم المعنى، والفعل ثابت لا يتغير. ولا يمكن معرفة الفعل الصحيح إلا بحفظ التركيب كاملًا.</p><ul><li>zur Verfügung <b>stehen</b> = يكون متاحًا/مستعدًّا للمساعدة · zur Verfügung <b>stellen</b> = يوفّر شيئًا (+ Akkusativ)</li><li>eine Entscheidung <b>treffen</b> = يتّخذ قرارًا</li><li>einen Antrag <b>stellen</b> = يقدّم طلبًا</li><li>in Kraft <b>treten</b> = يدخل حيّز التنفيذ</li><li>Rücksicht <b>nehmen</b> auf = يراعي</li><li>jemandem Bescheid <b>geben</b> = يُبلغ شخصًا</li><li>einen Rabatt <b>gewähren</b> = يمنح خصمًا</li><li>einen Vertrag <b>abschließen</b> = يُبرم عقدًا</li><li>jemandem <b>unterläuft</b> ein Fehler = يقع شخص في خطأ دون قصد</li></ul>`],
wortbildung:[`عائلات الكلمات والكلمات المتشابهة`,`التمييز بين الكلمات المتشابهة من العائلة نفسها حسب المعنى (Durchführung/Vorführung, ankommen/bekommen …).`,
`<p>السوابق واللواحق تغيّر المعنى كثيرًا. في الامتحان تختار غالبًا بين ثلاث كلمات من الجذر نفسه – تحقّق من <b>المعنى الدقيق</b> ومن <b>التركيب</b> (مع Akkusativ؟ انعكاسي؟ Perfekt مع sein؟).</p><ul><li><b>bekommen</b> = يتلقّى/يحصل على (Perfekt مع haben) · <b>ankommen</b> = يصل (Perfekt مع sein) · <b>vorkommen</b> = يحدث، يوجد</li><li><b>Durchführung</b> = تنفيذ · <b>Vorführung</b> = عرض توضيحي · <b>Durchsetzung</b> = فرض شيء رغم المقاومة</li><li><b>Auftrag</b> = طلبية (من زبون) · <b>Antrag</b> = طلب رسمي · <b>Vertrag</b> = عقد · <b>Beitrag</b> = مساهمة، اشتراك، مقال</li><li><b>gewähren</b> = يمنح · <b>sich bewähren</b> = يثبت جدارته · <b>sich gewöhnen an</b> = يعتاد على</li><li><b>senken</b> = يخفّض شيئًا (متعدٍّ) · <b>sinken</b> = ينخفض (لازم)</li></ul>`]},
i:{
"1A-46":[`اسم الموصول: جنس الكلمة المرجعية (die Bewerbung ← مؤنث) والحالة في جملة الصلة (مفعول به في Akkusativ للفعل „gelesen“).`,`يعود اسم الموصول إلى <i>Ihre Bewerbung</i> (مؤنث، مفرد). وفي جملة الصلة هو مفعول به في Akkusativ: <i>Wir haben die Bewerbung gelesen</i> ← <b>die</b>. أمّا <i>deren</i> فهي Genitiv (ملكية) ولا تناسب هنا.`],
"1A-47":[`فعل بحرف جر ثابت (bestehen in + Dativ) و wo(r)- + حرف الجر في السؤال غير المباشر.`,`<i>bestehen in</i> = يتمثّل في: <i>Meine Aufgaben bestanden in der Planung …</i> وفي السؤال غير المباشر يصبح <b>wo(r) + in = worin</b>. أمّا <i>darauf/daran</i> فحرف الجر فيهما خاطئ وليستا أداتي استفهام.`],
"1A-48":[`أداة ربط للشرط + الفعل في آخر الجملة الفرعية.`,`الفعل <i>besitzen</i> في آخر الجملة ← جملة فرعية بأداة ربط تابعة. والمقصود شرط ← <b>Falls</b> (إذا). أمّا <i>trotzdem</i> فظرف: كان يجب أن يأتي الفعل بعده مباشرةً، ومعناه (التعارض) لا يناسب.`],
"1A-49":[`حرف جر زمني يأخذ Genitiv (während + Genitiv).`,`<b>Während</b> + Genitiv تدلّ على مدة: <i>während der Einarbeitung</i> = خلال فترة التدريب على العمل. و<i>der</i> هنا Genitiv مؤنث (die Einarbeitung).`],
"1A-50":[`مضاف إليه في Genitiv: أداة الملكية في Genitiv؛ جنس كلمة „Zeugnis“ (das).`,`<i>eine Kopie wessen?</i> (نسخة من ماذا؟) ← Genitiv. <i>das Arbeitszeugnis</i> محايد ← <b>Ihres</b> letzten Arbeitszeugnisses (ويأخذ الاسم -ses). أمّا <i>Ihrem</i> فهي Dativ.`],
"1A-51":[`sich freuen auf (المستقبل) + ظرف ضميري يشير مسبقًا إلى الجملة المصدرية.`,`نتطلّع إلى شيء مستقبلي بـ <b>auf</b> (التعرّف قريبًا). و<b>darauf</b> تمهّد للجملة المصدرية. أمّا <i>daran</i> فتخص أفعالًا مثل <i>denken an</i>.`],
"1B-46":[`جملة الغرض: damit (فاعل خاص وفعل مصرَّف) أو um … zu (مصدر بلا فاعل).`,`تعبّر الجملة عن غرض ولها فاعل خاص (<i>alle</i>) وفعل مصرَّف (<i>können</i>) ← <b>Damit</b> (لكي). أمّا <i>um … zu</i> فتحتاج إلى مصدر مع <i>zu</i> ومن دون فاعل خاص.`],
"1B-47":[`اسم الموصول في Genitiv الجمع (ملكية: deren Unterstützung).`,`الدعم يأتي من الزملاء (جمع): <i>die Unterstützung der Kollegen</i> ← Genitiv الجمع <b>deren</b>. وعادةً يليه اسم بلا أداة تعريف. أمّا <i>denen</i> فهي Dativ الجمع.`],
"1B-48":[`einer/eine/einen + Genitiv الجمع („einen der beiden Termine“).`,`<i>einen der beiden Termine</i> = أحد الموعدين. بعد <i>einen</i> تأتي المجموعة كلها في Genitiv الجمع: <b>der</b> beiden Termine.`],
"1B-49":[`أداة ربط ثنائية je … desto/umso + صيغة المقارنة.`,`بعد <i>je</i> + صيغة المقارنة تأتي <b>desto</b> (أو umso) + صيغة المقارنة ثم الفعل: <i>… desto leichter wird euch die Umstellung fallen.</i> (كلّما كان أبكر، كان التحوّل أسهل)`],
"1B-50":[`denken an + ظرف ضميري يشير مسبقًا إلى الجملة المصدرية.`,`الفعل <i>denken</i> (يتذكّر، لا ينسى) يأتي مع <b>an</b>: <i>Denkt <b>daran</b>, … einzutragen.</i> أمّا <i>darauf</i> فتخص <i>achten auf, sich freuen auf</i>.`],
"1B-51":[`المجهول مع الفعل الناقص (Modalverb): Partizip II + werden (مصدر).`,`بعد الفعل الناقص <i>können</i> يأتي مصدر المجهول: berücksichtigt <b>werden</b>. أمّا <i>worden</i> فتوجد فقط في Perfekt/Plusquamperfekt المجهول (<i>ist berücksichtigt worden</i>).`],
"2A-52":[`التعريف (العرض المطلوب معروف) + الجنس (das Angebot) + نهاية الصفة.`,`السيد براندت طلب العرض – فهو إذن معروف ومحدد: <b>das</b> gewünschte Angebot. أمّا <i>ein</i> فلا تناسب الموقف ولا النهاية <i>-e</i> (الصحيح سيكون <i>ein gewünschtes</i>)؛ و<i>den</i> للمذكر.`],
"2A-53":[`عائلة كلمات: التمييز بين Durchführung / Durchsetzung / Vorführung.`,`الأعمال <b>durchgeführt</b> (تُنفَّذ) ← die <b>Durchführung</b> der Arbeiten. <i>Durchsetzung</i> = فرض شيء رغم المقاومة؛ <i>Vorführung</i> = عرض توضيحي.`],
"2A-54":[`achten auf + Akkusativ أو beachten + Akkusativ (بلا حرف جر).`,`حرف الجر <i>auf</i> موجود في الجملة ← <b>achten auf</b> (ينتبه إلى). أمّا <i>beachten</i> فتأخذ مفعولًا به في Akkusativ بلا حرف جر (<i>Wir beachten die Vorschriften</i>). و<i>aufpassen</i> فعل منفصل السابقة ومعناه «يحذر، يعتني بـ».`],
"2A-55":[`المتلازمة „einen Rabatt gewähren“؛ التمييز بين أفعال متشابهة اللفظ.`,`الخصم أو الوصول أو القرض <b>gewährt</b> (يُمنح رسميًا). <i>sich bewähren</i> = يثبت جدارته؛ <i>sich gewöhnen an</i> = يعتاد على.`],
"2A-56":[`sich entscheiden für أو sich entschließen zu.`,`حرف الجر <i>für</i> موجود في الجملة ← sich <b>entscheiden</b> für (يقرّر اختيار). أمّا <i>sich entschließen</i> فتتطلب <i>zu</i>؛ و<i>bestimmen</i> غير ممكنة هنا.`],
"2A-57":[`تركيب اسمي فعلي: zur Verfügung stehen أو zur Verfügung stellen.`,`الفاعل هو <i>Frau Lehmann</i> المستعدة للمساعدة: <i>sie <b>steht</b> Ihnen zur Verfügung</i> (هي في خدمتكم). أمّا <i>zur Verfügung stellen</i> فتحتاج إلى مفعول به في Akkusativ (<i>Wir stellen Ihnen einen Raum zur Verfügung</i>).`],
"2B-52":[`التمييز بين الأفعال ذات السوابق (ankommen/bekommen/annehmen) + Perfekt مع sein.`,`لم تصل الخراطيش في الوقت المحدد: <b>angekommen</b> (ankommen = يصل، Perfekt مع <i>sein</i>). أمّا <i>bekommen</i> فتكوّن Perfekt مع <i>haben</i> ومعناها «يتلقّى»؛ و<i>angenommen sind</i> خاطئة من دون <i>worden</i>.`],
"2B-53":[`تعبير ثابت: jemandem unterläuft ein Fehler.`,`التعبير الثابت لخطأ غير مقصود: <i>Uns ist ein Fehler <b>unterlaufen</b>.</i> <i>unterlassen</i> = يمتنع عن فعل شيء؛ <i>zustoßen</i> = يصيب شخصًا شيء سيئ (مثل حادث).`],
"2B-54":[`الضمير الانعكاسي المتوافق مع الفاعل (wir ← uns).`,`<i>sich entschuldigen</i> (يعتذر) فعل انعكاسي؛ يتوافق الضمير مع الفاعل <i>wir</i> ← <b>uns</b>. والشخص الذي نعتذر إليه مذكور أصلًا (<i>bei Ihnen</i>).`],
"2B-55":[`أداة التنكير عند الذكر الأول + Akkusativ المذكر.`,`تُذكر القسيمة لأول مرة ← أداة تنكير. <i>der Gutschein</i> مذكر وهو مفعول به في Akkusativ للفعل <i>erhalten</i> ← <b>einen</b>. أمّا <i>ein</i> فهي Nominativ، و<i>den</i> تفترض أن القسيمة معروفة مسبقًا.`],
"2B-56":[`حرف جر يأخذ Genitiv لمهلة زمنية (innerhalb eines Jahres).`,`مهلة ← <b>innerhalb</b> (خلال) + Genitiv: <i>innerhalb eines Jahres</i>. أمّا <i>seit</i> و<i>ab</i> فتتطلبان Dativ ولهما معنى آخر.`],
"2B-57":[`التعرّف على الجنس (-ung ← مؤنث) + Dativ بعد „in“ (Wo? – أين؟).`,`<i>die Abteilung</i> (-ung ← مؤنث دائمًا)، والسؤال <i>Wo?</i> ← Dativ: in <b>unserer</b> Versandabteilung. أمّا <i>unserem</i> فللمذكر/المحايد، و<i>unseren</i> هي Dativ الجمع.`]}};

TR.fa={c:{
konn:[`حروف ربط و ترتیب جمله`,`تشخیص حروف ربط و قیدهای ربط بر اساس معنا و جایگاه فعل (falls, damit, je … desto).`,
`<p>جای خالی نشان می‌دهد چه نوع حرف ربطی لازم است – به <b>جایگاه فعل</b> توجه کنید:</p><ul><li><b>حروف ربط جملهٔ وابسته</b> (weil, obwohl, falls/wenn, damit, sodass, während, nachdem, bevor, ob): فعل در <b>انتهای</b> جمله می‌آید.</li><li><b>قیدهای ربط</b> (deshalb, trotzdem, außerdem, dennoch, allerdings): در جایگاه اول قرار می‌گیرند و فعل <b>بلافاصله بعد از آن‌ها</b> می‌آید (جایگاه دوم).</li><li><b>حروف ربط هم‌پایه</b> (und, aber, oder, denn, sondern): جایگاه صفر – سپس فاعل و بعد فعل.</li></ul><p><b>damit</b> و <b>um … zu</b>: هر دو هدف را بیان می‌کنند. <i>um … zu</i> فقط با مصدر و بدون فاعل جداگانه به کار می‌رود؛ اگر جملهٔ وابسته فاعل خودش را داشته باشد، <i>damit</i> لازم است.</p><p><b>حروف ربط دوبخشی:</b> je + صفت تفضیلی …، desto/umso + صفت تفضیلی (هرچه … ، … تر) · sowohl … als auch (هم … و هم) · weder … noch (نه … و نه) · entweder … oder (یا … یا) · nicht nur … sondern auch (نه تنها … بلکه) · zwar … aber (درست است که … اما).</p><p><b>ob</b> پرسش غیرمستقیم بله/خیر را شروع می‌کند (که آیا)، و <b>falls/wenn</b> شرط را (اگر).</p>`],
praep:[`حروف اضافه و حالت دستوری آن‌ها`,`انتخاب حروف اضافه بر اساس معنا (لحظهٔ زمانی، مدت، مهلت، دلیل، تضاد) و حالت دستوری.`,
`<p>هر حرف اضافه حالت مشخصی می‌خواهد (جدول آلمانی را ببینید): <b>Genitiv</b>: während, wegen, trotz, innerhalb … · <b>Dativ</b>: seit, ab, aus, bei, mit … · <b>Akkusativ</b>: bis, durch, für, gegen, ohne, um.</p><p><b>زمان:</b> <i>seit</i> = در گذشته شروع شده و هنوز ادامه دارد (با زمان حال) · <i>ab</i> = نقطهٔ شروع، اغلب در آینده · <i>während</i> = در طولِ · <i>innerhalb</i> = ظرفِ (مهلت) · <i>bis</i> = نقطهٔ پایان (تا).</p><p><b>دلیل و تضاد:</b> <i>wegen/aufgrund</i> دلیل را بیان می‌کنند (به خاطرِ)، <i>trotz</i> تضاد را (با وجودِ).</p><p>اگر حرف تعریف نباشد، بعد از <i>innerhalb</i> معمولاً <i>von</i> + Dativ می‌آید: <i>innerhalb von 14 Tagen</i>.</p>`],
rektion:[`حروف اضافهٔ ثابت (فعل/اسم/صفت + حرف اضافه)`,`دانستن اینکه یک فعل، اسم یا صفت کدام حرف اضافه را می‌خواهد (bestehen in, sich freuen auf, achten auf …).`,
`<p>بسیاری از فعل‌ها، اسم‌ها و صفت‌ها <b>حرف اضافهٔ ثابت</b> دارند. باید آن را همراه با کلمه یاد گرفت – بهتر است با حالت دستوری و یک جملهٔ نمونه (جدول را ببینید).</p><ul><li><i>sich freuen auf</i> = مشتاقانه منتظر چیزی در آینده بودن · <i>sich freuen über</i> = از چیزی که اتفاق افتاده خوشحال شدن</li><li><i>bestehen in</i> = عبارت بودن از (محتوای یک کار) · <i>bestehen aus</i> = تشکیل شدن از (اجزا)</li><li><i>sich entscheiden für</i> = تصمیم به انتخاب چیزی گرفتن – اما <i>sich entschließen zu</i></li><li><i>Interesse an</i> + Dativ – اما <i>sich interessieren für</i></li></ul><p><b>راهبرد:</b> اگر حرف اضافه در جمله هست، فعلی را پیدا کنید که با آن جور است. اگر نیست، بپرسید: این فعل کدام حرف اضافه را می‌خواهد؟</p>`],
pronadv:[`قیدهای ضمیری (darauf, worin …)`,`ساختن و به کار بردن درست da(r)- و wo(r)- + حرف اضافه (darauf, daran, worin …).`,
`<p>برای <b>اشیا</b> (نه برای افراد) به جای «حرف اضافه + اسم/ضمیر» از قید ضمیری استفاده می‌شود: <b>da-</b> + حرف اضافه برای ارجاع به چیزی (darauf, daran, dafür)، <b>wo-</b> + حرف اضافه در پرسش‌ها و پرسش‌های غیرمستقیم (worauf, woran, wofür).</p><p>اگر حرف اضافه با واکه شروع شود، یک <b>r</b> اضافه می‌شود: dar-auf, wor-in.</p><p>قید ضمیری می‌تواند از پیش به <b>جملهٔ dass یا جملهٔ مصدری</b> بعدی اشاره کند: <i>Ich freue mich <b>darauf</b>, Sie kennenzulernen.</i> (مشتاقانه منتظر آشنایی با شما هستم.)</p><p><b>افراد:</b> حرف اضافه + ضمیر: <i>Ich verlasse mich auf <b>ihn</b>. An <b>wen</b> denken Sie?</i></p>`],
relativ:[`ضمایر موصولی`,`تعیین جنس/شمار از کلمهٔ مرجع و حالت دستوری از نقش ضمیر در جملهٔ موصولی (die, deren, denen …).`,
`<p>دو پرسش: <b>۱.</b> ضمیر به چه چیزی برمی‌گردد؟ ← جنس و شمار. <b>۲.</b> نقش آن در جملهٔ موصولی چیست (یا چه حرف اضافه‌ای قبل از آن است)؟ ← حالت دستوری. صورت‌ها در جدول آلمانی آمده‌اند.</p><p>به صورت‌های خاص توجه کنید: Dativ جمع <b>denen</b>، Genitiv <b>dessen</b> (مذکر/خنثی) و <b>deren</b> (مؤنث/جمع).</p><p><b>dessen/deren</b> مالکیت را نشان می‌دهند؛ بعد از آن‌ها اسمی <b>بدون حرف تعریف</b> می‌آید: <i>die Firma, <b>deren</b> Produkte …</i> (شرکتی که محصولاتش …).</p>`],
kasus:[`پایانه‌های حالت و پایانه‌های صفت`,`تشخیص حالت دستوری و انتخاب پایانهٔ درست برای حرف تعریف، صفت ملکی و صفت.`,
`<p><b>تعیین حالت:</b> فعل چه می‌خواهد (helfen + Dativ, schicken + Dativ + Akkusativ)؟ چه حرف اضافه‌ای قبل از کلمه است؟ آیا مضاف‌الیه است (<i>eine Kopie <b>wessen</b>?</i> – نسخه‌ای از چه؟ ← Genitiv)؟</p><p>صورت‌های حرف تعریف در هر چهار حالت در جدول آلمانی آمده‌اند. در Dativ جمع اسم معمولاً <b>-n</b> می‌گیرد و در Genitiv مذکر/خنثی <b>-s/-es</b>.</p><p><b>پایانهٔ صفت:</b> اگر حرف تعریف حالت را به‌روشنی نشان دهد (der, dem, einen …)، صفت معمولاً <b>-e/-en</b> می‌گیرد. اگر حرف تعریف پایانه نداشته باشد (ein, Ihr, unser در Nominativ/Akkusativ) یا اصلاً حرف تعریفی نباشد، صفت پایانهٔ نشانه را می‌گیرد: <i>ein großes Interesse, mit freundlichen Grüßen</i>.</p>`],
genus:[`جنس دستوری اسم‌ها`,`دانستن جنس اسم‌های مهم یا تشخیص آن از پسوندها (-ung ← die، das Zeugnis …).`,
`<p>جنس دستوری پایانهٔ حرف تعریف، ضمیر و صفت را تعیین می‌کند. پسوندها اغلب کمک می‌کنند:</p><ul><li><b>مؤنث (die):</b> -ung, -heit, -keit, -schaft, -ion, -tät, -ur, -ik</li><li><b>خنثی (das):</b> -ment, -um, -chen, -lein، مصدرهایی که اسم شده‌اند (das Lernen)، بسیاری از کلمات با Ge- (das Gehalt, das Gespräch)</li><li><b>مذکر (der):</b> -er (افراد/دستگاه‌ها)، -ling، -ismus، روزهای هفته، ماه‌ها</li></ul><p><b>اسم‌های مرکب:</b> کلمهٔ آخر جنس را تعیین می‌کند: <i>der Vertrag → der Arbeits<b>vertrag</b></i>.</p><p><b>کلمات مهم محیط کار:</b> der Termin, der Vertrag, der Lebenslauf, der Antrag · das Angebot, das Gehalt, das Zeugnis, das Gespräch · die Rechnung, die Frist, die Bewerbung, die Abteilung.</p>`],
artikel:[`حرف تعریف معین، نامعین یا بدون حرف تعریف`,`تشخیص اینکه چیزی تازه است، شناخته‌شده/مشخص است یا کلی (ein Gutschein – das gewünschte Angebot).`,
`<p><b>حرف تعریف نامعین</b> (ein/eine): چیزی برای اولین بار گفته می‌شود یا یکی از چندتاست.</p><p><b>حرف تعریف معین</b> (der/die/das): چیزی شناخته‌شده است، قبلاً گفته شده، یگانه است یا مشخص شده – با بافت (<i>das gewünschte Angebot</i> – پیشنهادی که درخواست کرده‌اید)، با جملهٔ موصولی (<i>der Lebenslauf, um den Sie gebeten haben</i>) یا با صفت عالی (<i>das beste Angebot</i>).</p><p><b>بدون حرف تعریف:</b> جمع نامعین (<i>Wir suchen Mitarbeiter</i>)، مفاهیم غیرقابل‌شمارش به‌طور کلی (<i>Erfahrung, Geld, Zeit</i>)، شغل‌ها بعد از sein/werden/als (<i>Sie ist Ingenieurin</i>)، عبارت‌های ثابت (<i>Bescheid geben</i>).</p>`],
valenz:[`متمم‌های فعل و ضمایر انعکاسی`,`دانستن اینکه فعل چه متمم‌هایی لازم دارد (Dativ، Akkusativ، انعکاسی) – مثلاً sich entschuldigen و beachten + Akkusativ.`,
`<p><b>فعل‌هایی که Dativ می‌خواهند:</b> helfen, danken, gefallen, gehören, antworten, gratulieren, folgen, passen.</p><p><b>Dativ + Akkusativ:</b> jemandem etwas geben, schicken, mitteilen, empfehlen, anbieten (چیزی را به کسی دادن/فرستادن/اطلاع دادن/توصیه کردن/پیشنهاد کردن).</p><p><b>فعل‌های انعکاسی:</b> sich entschuldigen, sich bewerben, sich beschweren, sich erkundigen, sich verlassen auf. ضمیر انعکاسی با فاعل مطابقت دارد (جدول را ببینید): ich ← mich/mir، wir ← uns، Sie ← sich.</p><p>اگر در جمله مفعول Akkusativ وجود داشته باشد، ضمیر انعکاسی Dativ می‌شود: <i>Ich stelle <b>mir</b> das vor.</i></p><p><b>با حرف اضافه یا بدون آن؟</b> <i>beachten</i> + Akkusativ (بدون حرف اضافه) – اما <i>achten <b>auf</b></i> + Akkusativ (هر دو: توجه کردن به).</p>`],
verbform:[`مجهول و فعل‌های کمکی`,`ساختن درست صورت‌های مجهول (werden/worden/wurden) و زمان Perfekt با haben یا sein.`,
`<ul><li><b>مجهول حال:</b> werden + Partizip II – <i>Die Ware wird geliefert.</i></li><li><b>مجهول Präteritum:</b> wurden + Partizip II – <i>Die Stellen wurden geschaffen.</i></li><li><b>مجهول Perfekt:</b> sein + Partizip II + <b>worden</b> – <i>Der Vertrag ist unterschrieben worden.</i></li><li><b>مجهول با فعل وجهی:</b> فعل وجهی … Partizip II + <b>werden</b> – <i>Das muss berücksichtigt werden.</i></li></ul><p><b>worden</b> فقط در مجهول؛ <b>geworden</b> با فعل اصلی <i>werden</i> = شدن (<i>Sie ist Chefin geworden</i>).</p><p><b>Perfekt با sein:</b> فعل‌های حرکت/تغییر حالت بدون مفعول Akkusativ (ankommen, gehen, passieren, werden). در بقیهٔ موارد معمولاً <b>haben</b> (bekommen, erhalten).</p>`],
festeverb:[`ترکیب‌های اسم-فعل و هم‌آیندها`,`دانستن ترکیب‌های ثابت زبان کاری (zur Verfügung stehen, einen Rabatt gewähren …).`,
`<p>در ترکیب‌های ثابت، معنا را اسم حمل می‌کند و فعل ثابت است. فعل درست را فقط همراه با کل ترکیب می‌توان یاد گرفت.</p><ul><li>zur Verfügung <b>stehen</b> = در دسترس بودن، آمادهٔ کمک بودن · zur Verfügung <b>stellen</b> = چیزی را در اختیار گذاشتن (+ Akkusativ)</li><li>eine Entscheidung <b>treffen</b> = تصمیم گرفتن</li><li>einen Antrag <b>stellen</b> = درخواست دادن</li><li>in Kraft <b>treten</b> = لازم‌الاجرا شدن</li><li>Rücksicht <b>nehmen</b> auf = ملاحظهٔ کسی/چیزی را کردن</li><li>jemandem Bescheid <b>geben</b> = به کسی خبر دادن</li><li>einen Rabatt <b>gewähren</b> = تخفیف دادن</li><li>einen Vertrag <b>abschließen</b> = قرارداد بستن</li><li>jemandem <b>unterläuft</b> ein Fehler = کسی ناخواسته اشتباه می‌کند</li></ul>`],
wortbildung:[`خانواده‌های واژگانی و کلمات مشابه`,`تشخیص کلمات مشابه از یک خانوادهٔ واژگانی بر اساس معنا (Durchführung/Vorführung, ankommen/bekommen …).`,
`<p>پیشوندها و پسوندها معنا را بسیار تغییر می‌دهند. در آزمون اغلب باید از میان سه کلمه با ریشهٔ یکسان انتخاب کنید – <b>معنای دقیق</b> و <b>ساختار</b> را بررسی کنید (با Akkusativ؟ انعکاسی؟ Perfekt با sein؟).</p><ul><li><b>bekommen</b> = دریافت کردن (Perfekt با haben) · <b>ankommen</b> = رسیدن (Perfekt با sein) · <b>vorkommen</b> = پیش آمدن، وجود داشتن</li><li><b>Durchführung</b> = اجرا · <b>Vorführung</b> = نمایش، ارائه · <b>Durchsetzung</b> = به کرسی نشاندن چیزی با وجود مخالفت</li><li><b>Auftrag</b> = سفارش (از مشتری) · <b>Antrag</b> = درخواست رسمی · <b>Vertrag</b> = قرارداد · <b>Beitrag</b> = سهم، حق عضویت، مقاله</li><li><b>gewähren</b> = اعطا کردن · <b>sich bewähren</b> = کارایی خود را ثابت کردن · <b>sich gewöhnen an</b> = عادت کردن به</li><li><b>senken</b> = چیزی را کاهش دادن (متعدی) · <b>sinken</b> = کاهش یافتن (لازم)</li></ul>`]},
i:{
"1A-46":[`ضمیر موصولی: جنس کلمهٔ مرجع (die Bewerbung ← مؤنث) و حالت در جملهٔ موصولی (مفعول Akkusativ برای „gelesen“).`,`ضمیر موصولی به <i>Ihre Bewerbung</i> (مؤنث، مفرد) برمی‌گردد. در جملهٔ موصولی مفعول Akkusativ است: <i>Wir haben die Bewerbung gelesen</i> ← <b>die</b>. <i>deren</i> حالت Genitiv (مالکیت) است و اینجا مناسب نیست.`],
"1A-47":[`فعل با حرف اضافهٔ ثابت (bestehen in + Dativ) و wo(r)- + حرف اضافه در پرسش غیرمستقیم.`,`<i>bestehen in</i> = عبارت بودن از: <i>Meine Aufgaben bestanden in der Planung …</i> در پرسش غیرمستقیم این می‌شود <b>wo(r) + in = worin</b>. <i>darauf/daran</i> حرف اضافهٔ نادرست دارند و کلمهٔ پرسشی نیستند.`],
"1A-48":[`حرف ربط شرط + فعل در انتهای جملهٔ وابسته.`,`فعل <i>besitzen</i> در انتهای جمله است ← جملهٔ وابسته با حرف ربط وابسته‌ساز. موضوع یک شرط است ← <b>Falls</b> (اگر). <i>trotzdem</i> یک قید است: فعل باید بلافاصله بعد از آن بیاید و معنایش (تضاد) هم مناسب نیست.`],
"1A-49":[`حرف اضافهٔ زمانی با Genitiv (während + Genitiv).`,`<b>Während</b> + Genitiv یک بازهٔ زمانی را نشان می‌دهد: <i>während der Einarbeitung</i> = در دورهٔ آموزش اولیهٔ کار. <i>der</i> اینجا Genitiv مؤنث است (die Einarbeitung).`],
"1A-50":[`مضاف‌الیه در Genitiv: صفت ملکی در Genitiv؛ جنس „Zeugnis“ (das).`,`<i>eine Kopie wessen?</i> (نسخه‌ای از چه؟) ← Genitiv. <i>das Arbeitszeugnis</i> خنثی است ← <b>Ihres</b> letzten Arbeitszeugnisses (اسم با -ses). <i>Ihrem</i> حالت Dativ است.`],
"1A-51":[`sich freuen auf (آینده) + قید ضمیری که از پیش به جملهٔ مصدری اشاره می‌کند.`,`برای چیزی در آینده با <b>auf</b> اشتیاق نشان می‌دهیم (به‌زودی آشنا شدن). <b>darauf</b> جملهٔ مصدری را از پیش اعلام می‌کند. <i>daran</i> مربوط به فعل‌هایی مثل <i>denken an</i> است.`],
"1B-46":[`جملهٔ هدف: damit (فاعل جداگانه، فعل صرف‌شده) یا um … zu (مصدر بدون فاعل).`,`جمله هدف را بیان می‌کند و فاعل خودش (<i>alle</i>) و فعل صرف‌شده (<i>können</i>) را دارد ← <b>Damit</b> (تا). <i>um … zu</i> مصدر با <i>zu</i> می‌خواهد و فاعل جداگانه ندارد.`],
"1B-47":[`ضمیر موصولی در Genitiv جمع (مالکیت: deren Unterstützung).`,`حمایت از طرف همکاران (جمع) است: <i>die Unterstützung der Kollegen</i> ← Genitiv جمع <b>deren</b>. معمولاً بعد از آن اسمی بدون حرف تعریف می‌آید. <i>denen</i> حالت Dativ جمع است.`],
"1B-48":[`einer/eine/einen + Genitiv جمع („einen der beiden Termine“).`,`<i>einen der beiden Termine</i> = یکی از دو وقت. بعد از <i>einen</i> کل گروه در Genitiv جمع می‌آید: <b>der</b> beiden Termine.`],
"1B-49":[`حرف ربط دوبخشی je … desto/umso + صفت تفضیلی.`,`بعد از <i>je</i> + صفت تفضیلی، <b>desto</b> (یا umso) + صفت تفضیلی و سپس فعل می‌آید: <i>… desto leichter wird euch die Umstellung fallen.</i> (هرچه زودتر، تغییر آسان‌تر)`],
"1B-50":[`denken an + قید ضمیری که از پیش به جملهٔ مصدری اشاره می‌کند.`,`<i>denken</i> (به یاد داشتن، فراموش نکردن) با <b>an</b> می‌آید: <i>Denkt <b>daran</b>, … einzutragen.</i> <i>darauf</i> مربوط به <i>achten auf, sich freuen auf</i> است.`],
"1B-51":[`مجهول با فعل وجهی: Partizip II + werden (مصدر).`,`بعد از فعل وجهی <i>können</i> مصدر مجهول می‌آید: berücksichtigt <b>werden</b>. <i>worden</i> فقط در Perfekt/Plusquamperfekt مجهول وجود دارد (<i>ist berücksichtigt worden</i>).`],
"2A-52":[`معین بودن (پیشنهاد درخواست‌شده شناخته‌شده است) + جنس (das Angebot) + پایانهٔ صفت.`,`آقای براندت پیشنهاد را درخواست کرده – پس شناخته‌شده و مشخص است: <b>das</b> gewünschte Angebot. <i>ein</i> نه با موقعیت جور است و نه با پایانهٔ <i>-e</i> (صورت درست <i>ein gewünschtes</i> بود)؛ <i>den</i> مذکر است.`],
"2A-53":[`خانوادهٔ واژگانی: تشخیص Durchführung / Durchsetzung / Vorführung.`,`کارها <b>durchgeführt</b> (اجرا) می‌شوند ← die <b>Durchführung</b> der Arbeiten. <i>Durchsetzung</i> = به کرسی نشاندن چیزی با وجود مخالفت؛ <i>Vorführung</i> = نمایش، ارائه.`],
"2A-54":[`achten auf + Akkusativ یا beachten + Akkusativ (بدون حرف اضافه).`,`<i>auf</i> از قبل در جمله هست ← <b>achten auf</b> (توجه کردن به). <i>beachten</i> مفعول Akkusativ بدون حرف اضافه می‌گیرد (<i>Wir beachten die Vorschriften</i>). <i>aufpassen</i> فعل جداشدنی است و یعنی «مراقب بودن، مواظبت کردن».`],
"2A-55":[`هم‌آیند „einen Rabatt gewähren“؛ تشخیص فعل‌های هم‌آوا.`,`تخفیف، دسترسی یا وام <b>gewährt</b> (رسماً اعطا) می‌شود. <i>sich bewähren</i> = کارایی خود را ثابت کردن؛ <i>sich gewöhnen an</i> = عادت کردن به.`],
"2A-56":[`sich entscheiden für یا sich entschließen zu.`,`حرف اضافهٔ <i>für</i> از قبل در جمله هست ← sich <b>entscheiden</b> für (تصمیم به انتخاب گرفتن). <i>sich entschließen</i> با <i>zu</i> می‌آید؛ <i>bestimmen</i> اینجا ممکن نیست.`],
"2A-57":[`ترکیب اسم-فعل: zur Verfügung stehen یا zur Verfügung stellen.`,`فاعل <i>Frau Lehmann</i> است که آمادهٔ کمک است: <i>sie <b>steht</b> Ihnen zur Verfügung</i> (در اختیار شماست). <i>zur Verfügung stellen</i> مفعول Akkusativ لازم دارد (<i>Wir stellen Ihnen einen Raum zur Verfügung</i>).`],
"2B-52":[`تشخیص فعل‌های پیشونددار (ankommen/bekommen/annehmen) + Perfekt با sein.`,`کارتریج‌ها به‌موقع نرسیدند: <b>angekommen</b> (ankommen = رسیدن، Perfekt با <i>sein</i>). <i>bekommen</i> صورت Perfekt را با <i>haben</i> می‌سازد و یعنی «دریافت کردن»؛ <i>angenommen sind</i> بدون <i>worden</i> نادرست است.`],
"2B-53":[`عبارت ثابت: jemandem unterläuft ein Fehler.`,`عبارت ثابت برای اشتباه ناخواسته: <i>Uns ist ein Fehler <b>unterlaufen</b>.</i> <i>unterlassen</i> = از انجام کاری خودداری کردن؛ <i>zustoßen</i> = اتفاق بدی برای کسی افتادن (مثلاً تصادف).`],
"2B-54":[`ضمیر انعکاسی مطابق با فاعل (wir ← uns).`,`<i>sich entschuldigen</i> (عذرخواهی کردن) انعکاسی است؛ ضمیر با فاعل <i>wir</i> مطابقت دارد ← <b>uns</b>. کسی که از او عذرخواهی می‌شود از قبل در جمله هست (<i>bei Ihnen</i>).`],
"2B-55":[`حرف تعریف نامعین برای اولین اشاره + Akkusativ مذکر.`,`کارت هدیه برای اولین بار ذکر می‌شود ← حرف تعریف نامعین. <i>der Gutschein</i> مذکر و مفعول Akkusativ فعل <i>erhalten</i> است ← <b>einen</b>. <i>ein</i> حالت Nominativ است و <i>den</i> فرض می‌کند که کارت هدیه از قبل شناخته‌شده است.`],
"2B-56":[`حرف اضافه با Genitiv برای مهلت (innerhalb eines Jahres).`,`مهلت ← <b>innerhalb</b> (ظرفِ) + Genitiv: <i>innerhalb eines Jahres</i>. <i>seit</i> و <i>ab</i> حالت Dativ می‌خواهند و معنای دیگری دارند.`],
"2B-57":[`تشخیص جنس (-ung ← مؤنث) + Dativ بعد از „in“ (Wo? – کجا؟).`,`<i>die Abteilung</i> (-ung ← همیشه مؤنث)، پرسش <i>Wo?</i> ← Dativ: in <b>unserer</b> Versandabteilung. <i>unserem</i> مذکر/خنثی و <i>unseren</i> Dativ جمع است.`]}};
