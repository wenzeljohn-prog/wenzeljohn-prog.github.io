/* Stufen und Teile */
var STAGES=[
{parts:['disc'],intro:null},
{parts:['match','choose','type','table'],intro:'pron'},
{parts:['verbMean','stehen2'],intro:'verbs'},
{parts:['subj','form','formType','order'],intro:'order'},
{parts:['artChoose','artType','names'],intro:'noun',nounTable:true},
{parts:['replace','wem','who'],intro:null},
{parts:['detect'],intro:'traps'},
{parts:['dialog'],intro:null}
];
var PARTS={
disc:{type:'disc',build:function(){return DISC.slice();}},
match:{type:'match',build:function(){return P.slice();}},
choose:{type:'mc',build:function(){return shuffle(CHOOSE);}},
type:{type:'ty',help:true,build:function(){return shuffle(TYPE);}},
table:{type:'tbl',help:false,build:function(){return P.slice();}},
verbMean:{type:'mc',build:function(){return shuffle(VERBMEAN);}},
stehen2:{type:'mc',build:function(){return shuffle(STEHEN2);}},
subj:{type:'mc',build:function(){return shuffle(SUBJ);}},
form:{type:'mc',build:function(){return shuffle(FORM);}},
formType:{type:'ty',build:function(){return shuffle(FORMTYPE);}},
order:{type:'ord',build:function(){return shuffle(ORD);}},
artChoose:{type:'mc',build:function(){return shuffle(ARTCHOOSE);}},
artType:{type:'ty',build:function(){return shuffle(ARTTYPE);}},
names:{type:'mc',build:function(){return shuffle(NAMES);}},
replace:{type:'ty',help:true,build:function(){return shuffle(REPLACE);}},
wem:{type:'ty',help:true,build:function(){return shuffle(WEM);}},
who:{type:'ty',help:true,build:function(){return shuffle(WHO);}},
detect:{type:'det',build:function(){return shuffle(DETECT.concat(langTraps()));}},
dialog:{type:'ty',help:true,build:function(){return shuffle(DIALOG);}}
};

/* ===== Engine (ES5, Inline-onclick, kein externer Code) ===== */
var KEY='dativPSG_v1';
var ST={lang:null,prog:{}};
var view='lang';
var cur={si:0};
var run=null;
var HELP=false;
var SAVED={};
var LANG_ORDER=['de','pl','en','ar','tr','fa','ku','ru','uk'];
var LANG_NAMES={de:'Deutsch',pl:'Polski',en:'English',ar:'العربية',tr:'Türkçe',fa:'فارسی',ku:'Kurdî (Kurmancî)',ru:'Русский',uk:'Українська'};

function $(id){return document.getElementById(id);}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function shuffle(a){var b=a.slice(),i,j,t;for(i=b.length-1;i>0;i--){j=Math.floor(Math.random()*(i+1));t=b[i];b[i]=b[j];b[j]=t;}return b;}
function LG(){return LANGS[ST.lang]||LANGS.de;}
function T(k){var u=LG().ui;if(u&&u[k]!==undefined){return u[k];}var d=LANGS.de.ui[k];return d===undefined?k:d;}
var LATIN=/[A-Za-zÄÖÜäöüß][A-Za-zÄÖÜäöüß0-9]*(?:[ ,\-\/]{1,2}[A-Za-zÄÖÜäöüß0-9]+)*/g;
function de(s,raw){
  s=String(s);
  if(!raw&&LG().dir==='rtl'){
    s=s.split(/(‹[^›]*›)/).map(function(p,i){return i%2?p:p.replace(LATIN,'‹$&›');}).join('');
  }
  return s.replace(/‹([^›]*)›/g,function(m,t){return '<bdi class="de'+(t.length<=30?' nw':'')+'" dir="ltr" lang="de">'+t+'</bdi>';});
}
function mk(s){return String(s).replace(/\{([dns]):([^}]*)\}/g,'<span class="hl hl-$1">$2</span>');}
function A(){var l=LG();return ' dir="'+l.dir+'" lang="'+l.lang+'"';}
function L1(html,cls){var l=LG();return '<div class="l1 '+(cls||'')+'" dir="'+l.dir+'" lang="'+l.lang+'">'+de(html)+'</div>';}
function save(){try{localStorage.setItem(KEY,JSON.stringify({lang:ST.lang,prog:ST.prog}));}catch(e){}}
function load(){try{var s=localStorage.getItem(KEY);if(s){var o=JSON.parse(s);if(o&&o.lang&&LANGS[o.lang]){ST.lang=o.lang;}if(o&&o.prog){ST.prog=o.prog;}}}catch(e){}}

/* ---------- Bausteine ---------- */
function tagPair(p,isNew){return '<span class="pair'+(isNew?' new':'')+'"><span class="tag n">'+esc(p.n)+'</span><span class="stitch"></span><span class="tag d">'+esc(p.d)+'</span></span>';}
function pairsHtml(ids,newId){var h='<div class="pairs">',i,p;for(i=0;i<P.length;i++){p=P[i];if(!ids||ids.indexOf(p.id)>=0){h+=tagPair(p,p.id===newId);}}return h+'</div>';}
function pLabel(p){return p.lab?T(p.lab):'';}
function hintHtml(tg){
  var l=LG(),t=null;
  if(!tg){return '';}
  if(tg.indexOf('trap_')===0){t=l.trapWhy&&l.trapWhy[tg.slice(5)];}
  else{t=(l.fb&&l.fb[tg])||(LANGS.de.fb&&LANGS.de.fb[tg]);}
  if(!t){return '';}
  return '<div class="hint l1" dir="'+l.dir+'" lang="'+l.lang+'">'+de(t)+'</div>';
}
function blocks(arr){
  var l=LG(),h='',i,b,r,c,cls,j,k;
  if(!arr){return '';}
  for(i=0;i<arr.length;i++){
    b=arr[i];
    if(b.k==='p'){h+='<p>'+de(b.h)+'</p>';}
    else if(b.k==='h'){h+='<h3>'+de(b.h)+'</h3>';}
    else if(b.k==='w'){h+='<div class="note warn"><b>'+T('trap')+'</b> '+de(b.h)+'</div>';}
    else if(b.k==='tip'){h+='<div class="note tip">'+de(b.h)+'</div>';}
    else if(b.k==='t'){
      h+='<table class="tbl">';
      if(b.head){h+='<tr>';for(j=0;j<b.head.length;j++){h+='<th>'+de(b.head[j])+'</th>';}h+='</tr>';}
      for(r=0;r<b.rows.length;r++){
        h+='<tr>';
        for(c=0;c<b.rows[r].length;c++){
          cls=b.cols&&b.cols[c]?b.cols[c]:'';
          h+='<td class="'+(cls?'c-'+cls:'')+'"'+((cls==='nom'||cls==='dat'||cls==='de')?' dir="ltr"':'')+'>'+de(b.rows[r][c],(cls==='nom'||cls==='dat'||cls==='de'))+'</td>';
        }
        h+='</tr>';
      }
      h+='</table>';
    }
  }
  return '<div class="l1blk" dir="'+l.dir+'" lang="'+l.lang+'">'+h+'</div>';
}
function nounTableHtml(){
  var rows=[['der Mann','dem Mann','ihm'],['die Frau','der Frau','ihr'],['das Kind','dem Kind','ihm'],['die Kinder','den Kindern','ihnen'],['Tom / Anna','Tom / Anna','ihm / ihr']];
  var h='<table class="tbl"><tr><th>'+T('nom')+'</th><th>'+T('dat')+'</th><th>= </th></tr>',i;
  for(i=0;i<rows.length;i++){h+='<tr><td class="c-nom">'+rows[i][0]+'</td><td class="c-dat">'+rows[i][1]+'</td><td class="c-dat">'+rows[i][2]+'</td></tr>';}
  return '<div class="card">'+h+'</table></div>';
}
function helpHtml(){return '<div class="card help">'+pairsHtml(null,null)+'</div>';}

/* ---------- Navigation ---------- */
function go(v){
  if(view==='part'&&v!=='part'&&run&&!run.finished&&run.P.type!=='match'&&run.P.type!=='tbl'){SAVED[run.id]=run;}
  view=v;render();
}
function render(keep){
  var h='';
  if(view==='lang'){h=vLang();}
  else{
    h=hdr();
    if(view==='home'){h+=vHome();}
    else if(view==='stage'){h+=vStage();}
    else if(view==='part'){h+=vPart();}
    else if(view==='result'){h+=vResult();}
    else if(view==='bridge'){h+=vBridge();}
  }
  $('app').innerHTML='<div class="wrap">'+h+'</div>';
  document.documentElement.lang=ST.lang?LG().lang:'de';
  if(!keep){window.scrollTo(0,0);}
  if(view==='part'){setTimeout(function(){var f=$('g1');if(f&&!f.disabled){try{f.focus();}catch(e){}}},60);}
}
function chooseLang(c){ST.lang=c;save();go('home');}
function setLang(c){ST.lang=c;save();if(view==='part'){openStage(cur.si);return;}if(view==='result'){view='stage';}render(true);}
function hdr(){
  var o='',i,c,l=LG();
  for(i=0;i<LANG_ORDER.length;i++){c=LANG_ORDER[i];o+='<option value="'+c+'"'+(c===ST.lang?' selected':'')+'>'+LANG_NAMES[c]+'</option>';}
  return '<div class="top"><button class="brand" onclick="go(\'home\')">passen, stehen, gefallen</button><select class="sel" onchange="setLang(this.value)" aria-label="Sprache / Language">'+o+'</select></div>'+
  '<div class="nav"><button class="chip'+(view==='home'?' on':'')+'" dir="'+l.dir+'" onclick="go(\'home\')">'+T('menu')+'</button><button class="chip'+(view==='bridge'?' on':'')+'" dir="'+l.dir+'" onclick="go(\'bridge\')">'+T('bridgeBtn')+'</button></div>';
}
function vLang(){
  var h='<div class="langpage"><h1 class="brand">passen, stehen, gefallen</h1><div class="pick">Sprache wählen<br>Wybierz język<br>Choose your language<br><span dir="rtl">اختر اللغة</span><br>Dil seçin<br><span dir="rtl">زبان را انتخاب کنید</span><br>Ziman hilbijêre<br>Выберите язык<br>Оберіть мову</div>',i,c;
  for(i=0;i<LANG_ORDER.length;i++){c=LANG_ORDER[i];h+='<button class="lbtn" lang="'+LANGS[c].lang+'" dir="'+LANGS[c].dir+'" onclick="chooseLang(\''+c+'\')">'+LANG_NAMES[c]+'</button>';}
  return h+'</div>';
}

/* ---------- Fortschritt ---------- */
function stageStats(si){
  var ps=STAGES[si].parts,n=0,i;
  for(i=0;i<ps.length;i++){if(ST.prog[ps[i]]&&ST.prog[ps[i]].done){n++;}}
  return {done:n,total:ps.length};
}
function vHome(){
  var l=LG(),h,i,s,cls;
  h='<div class="card hero"><div class="sent">'+mk('{s:Die Hose} passt {d:mir} nicht.')+'</div><div class="sent">'+mk('{s:Das Kleid} steht {d:dir} gut.')+'</div><div class="sent">'+mk('{s:Der Mantel} gefällt {d:Ihnen}.')+'</div>'+L1(T('homeIntro'),'small')+'</div>';
  for(i=0;i<STAGES.length;i++){
    s=stageStats(i);
    cls=s.done===s.total?' done':(s.done>0?' part':'');
    h+='<button class="stg'+cls+'" onclick="openStage('+i+')"><div class="prt"><div><div class="st" dir="'+l.dir+'" lang="'+l.lang+'">'+T('stage')+' '+(i+1)+': '+de(l.stages[i].t)+'</div>'+(ST.lang!=='de'?'<div class="sg" lang="de">'+LANGS.de.stages[i].t+'</div>':'')+'<div class="sd" dir="'+l.dir+'" lang="'+l.lang+'">'+de(l.stages[i].d)+'</div></div><div class="stat'+(s.done===s.total?' ok':'')+'">'+s.done+'/'+s.total+'</div></div></button>';
  }
  h+='<div><button class="lnk"'+A()+' onclick="resetAll()">'+T('reset')+'</button></div>';
  return h;
}
function resetAll(){if(window.confirm(T('resetAsk'))){ST.prog={};save();render(true);}}
function openStage(si){
  if(view==='part'&&run&&!run.finished&&run.P.type!=='match'&&run.P.type!=='tbl'){SAVED[run.id]=run;}
  cur.si=si;HELP=false;go('stage');
}
function vStage(){
  var si=cur.si,st=STAGES[si],l=LG(),h,i,id,p,stt;
  h='<div class="card"><div class="st" dir="'+l.dir+'" lang="'+l.lang+'"><b>'+T('stage')+' '+(si+1)+': '+de(l.stages[si].t)+'</b></div>'+L1(l.stages[si].d,'small');
  if(si===0){h+=L1(T('s1intro'))+'<div class="note tip" dir="'+l.dir+'" lang="'+l.lang+'">'+de(T('verbsGloss'))+'</div>';}
  if(st.intro){h+=blocks(l.bridge[st.intro]);}
  h+='</div>';
  if(st.nounTable){h+=nounTableHtml();}
  for(i=0;i<st.parts.length;i++){
    id=st.parts[i];p=ST.prog[id];
    stt=p&&p.done?('<span class="stat ok">'+p.best+'%</span>'):'';
    if(SAVED[id]){stt='<span class="stat">'+(SAVED[id].idx+1)+'/'+SAVED[id].items.length+'</span>';}
    h+='<button class="stg'+(p&&p.done?' done':'')+'" onclick="openPart(\''+id+'\')"><div class="prt"><div class="st" dir="'+l.dir+'" lang="'+l.lang+'">'+T('part')+' '+(i+1)+': '+de(l.parts[id][0])+'</div>'+stt+'</div></button>';
  }
  if(si+1<STAGES.length&&stageStats(si).done===stageStats(si).total){h+='<div class="nxt"><button class="btn" '+A()+' onclick="openStage('+(si+1)+')">'+T('nextStage')+'</button></div>';}
  return h;
}
function vBridge(){
  var l=LG(),h='<div class="card"><div class="st"><b>'+de(T('bridgeTitle'))+'</b></div>',keys=['pron','verbs','order','noun','traps'],i;
  for(i=0;i<keys.length;i++){h+='<h3 dir="'+l.dir+'" lang="'+l.lang+'" style="margin:18px 0 4px">'+de(T('b_'+keys[i]))+'</h3>'+blocks(l.bridge[keys[i]]);if(keys[i]==='noun'){h+=nounTableHtml();}}
  return h+'</div>';
}

/* ---------- Teil starten ---------- */
function openPart(id){
  var sv=SAVED[id],P_=PARTS[id],items;
  if(sv){
    delete SAVED[id];
    run=sv;HELP=false;
    if(run.locked){run.idx++;}
    if(run.idx>=run.items.length){finish();return;}
    prepItem();go('part');return;
  }
  items=P_.build();
  run={id:id,P:P_,items:items,idx:0,ok1:0,wrongs:[],rep:false,found:[],newId:null};
  if(P_.type==='match'){run.m={sel:-1,done:{},rdone:{},ro:shuffle([0,1,2,3,4,5,6,7,8]),mist:0,msg:''};}
  if(P_.type==='tbl'){run.t={att:0,locked:false};}
  HELP=false;
  prepItem();
  go('part');
}
function prepItem(){
  var it=run.items[run.idx],t=run.P.type;
  run.att=0;run.firstDone=false;run.step=1;run.locked=false;
  if(t==='mc'){run.opts=it.fix?it.opts.slice():shuffle(it.opts);}
  if(t==='ord'){run.o={tk:shuffle(it.pool),sel:[]};}
}
function first(ok){
  if(run.firstDone){return;}
  run.firstDone=true;
  if(ok){run.ok1++;}else{run.wrongs.push(run.items[run.idx]);}
}
function nextItem(){
  run.idx++;
  if(run.idx>=run.items.length){finish();return;}
  prepItem();
  render();
}
function finish(){
  var N=run.items.length,pct=Math.round(100*run.ok1/N),old=ST.prog[run.id];
  if(run.P.type==='match'||run.P.type==='tbl'){N=9;pct=Math.round(100*run.ok1/9);}
  run.pct=pct;run.finished=true;delete SAVED[run.id];
  if(!run.rep){ST.prog[run.id]={done:true,best:Math.max(pct,old&&old.best?old.best:0)};}
  else if(!old||!old.done){ST.prog[run.id]={done:true,best:old&&old.best?old.best:0};}
  save();
  go('result');
}
function vResult(){
  var l=LG(),N=(run.P.type==='match'||run.P.type==='tbl')?9:run.items.length,h,si=cur.si,st=STAGES[si],pi=st.parts.indexOf(run.id),nx=pi>=0&&pi+1<st.parts.length?st.parts[pi+1]:null;
  h='<div class="card"><div class="st"'+A()+'><b>'+T('partDone')+'</b></div><div class="bigdat" style="font-family:inherit">'+run.ok1+' / '+N+'</div>'+L1(T('firstTry'),'small');
  if(run.id==='disc'){h+='<div class="note tip">'+pairsHtml(null,null)+'</div>';}
  h+='<div class="nxt">';
  if(run.wrongs.length>0){h+='<button class="btn" onclick="repeatWrong()">'+T('repeatWrong')+'</button>';}
  if(nx){h+='<button class="btn" onclick="openPart(\''+nx+'\')">'+T('next')+'</button>';}
  else if(si+1<STAGES.length){h+='<button class="btn" '+A()+' onclick="openStage('+(si+1)+')">'+T('nextStage')+'</button>';}
  h+='<button class="btn alt" onclick="openPart(\''+run.id+'\')">'+T('again')+'</button><button class="btn alt" onclick="openStage('+si+')">'+T('backStage')+'</button></div></div>';
  return h;
}
function repeatWrong(){
  var w=run.wrongs.slice(),id=run.id,P_=run.P;
  run={id:id,P:P_,items:shuffle(w),idx:0,ok1:0,wrongs:[],rep:true,found:[],newId:null};
  prepItem();
  go('part');
}

/* ---------- Teil anzeigen ---------- */
function vPart(){
  var l=LG(),N=run.items.length,t=run.P.type,h,pct;
  if(t==='match'||t==='tbl'){N=1;}
  pct=Math.round(100*run.idx/N);
  h='<div class="ptop"><button class="chip" onclick="openStage('+cur.si+')" dir="'+l.dir+'">'+T('backStage')+'</button><div class="pt" dir="'+l.dir+'" lang="'+l.lang+'">'+de(l.parts[run.id][0])+'</div></div>';
  h+='<div class="bar"><i style="width:'+pct+'%"></i></div>';
  h+='<div class="ins l1" dir="'+l.dir+'" lang="'+l.lang+'">'+de(l.parts[run.id][1])+'</div>';
  if(N>1||t==='disc'){h+='<div class="small"'+A()+'>'+T('task')+' '+(run.idx+1)+' / '+N+'</div>';}
  if(run.P.help){h+='<div><button class="lnk" id="helpbtn" onclick="toggleHelp()">'+(HELP?T('hideTable'):T('showTable'))+'</button></div><div id="helpbox">'+(HELP?helpHtml():'')+'</div>';}
  if(t==='disc'){h+=rDisc();}
  else if(t==='mc'){h+=rMC();}
  else if(t==='ty'){h+=rTY();}
  else if(t==='ord'){h+=rOrd();}
  else if(t==='det'){h+=rDet();}
  else if(t==='match'){h+=rMatch();}
  else if(t==='tbl'){h+=rTbl();}
  return h;
}
function toggleHelp(){HELP=!HELP;$('helpbox').innerHTML=HELP?helpHtml():'';$('helpbtn').innerHTML=HELP?T('hideTable'):T('showTable');}
function nxtBtn(){return '<div class="nxt"><button class="btn" id="nxbtn" onclick="nextItem()">'+T('next')+'</button></div>';}
function banner(ok){return '<div class="fb '+(ok?'fbok':'fbbad')+'" dir="'+LG().dir+'"><b>'+(ok?T('ok'):T('bad'))+'</b>';}

/* ---------- Entdecken ---------- */
function rDisc(){
  var it=run.items[run.idx],i,h,p;
  h='<div class="card"><div class="sent">'+mk(it.s1)+'</div><div class="sent">'+mk(it.s2)+'</div></div>';
  h+='<div class="card">'+L1(T('discQ'),'q')+'<div class="bigdat"><span class="hl hl-d">'+esc(it.dat)+'</span></div><div class="opts" id="dopts">';
  for(i=0;i<P.length;i++){p=P[i];h+='<button class="opt" id="d'+i+'" onclick="pickDisc('+i+')">'+esc(p.n)+(p.lab?'<small>'+esc(pLabel(p))+'</small>':'')+'</button>';}
  h+='</div><div id="fb"></div></div>';
  h+='<div class="card"><div class="small"'+A()+'>'+T('myTable')+'</div><div id="found">'+pairsHtml(run.found,run.newId)+'</div></div>';
  return h;
}
function pickDisc(i){
  var it=run.items[run.idx],ok,b,fb,j;
  if(run.locked){return;}
  ok=(P[i].id===it.id);
  b=$('d'+i);
  if(ok){
    run.locked=true;
    first(run.att===0);
    run.found.push(it.id);run.newId=it.id;
    $('found').innerHTML=pairsHtml(run.found,run.newId);
    for(j=0;j<P.length;j++){if(j!==i&&$('d'+j).className.indexOf('bad')<0){$('d'+j).className='opt dis';}}
    b.className='opt ok';
    fb=banner(true)+' <span class="hl hl-n">'+esc(PI(it.id).n)+'</span> &rarr; <span class="hl hl-d">'+esc(it.dat)+'</span>';
    if(it.id==='es'){fb+=hintHtml('ihmEs');}
    if(it.id==='ihr'){fb+=hintHtml('ihrnom');}
    if(it.id==='siepl'||it.id==='Sie'){fb+=hintHtml('sieSie');}
    fb+='</div>'+nxtBtn();
    $('fb').innerHTML=fb;
  }else{
    run.att++;
    first(false);
    b.className='opt bad dis';
    $('fb').innerHTML=banner(false)+'<div class="sent small">'+esc(it.who)+'</div>'+hintHtml('pron')+'</div>';
  }
}

/* ---------- Multiple Choice ---------- */
function optLabel(o){return o.charAt(0)==='@'?T(o.slice(1)):o;}
function rMC(){
  var it=run.items[run.idx],h,i,pre;
  pre=mk(it.pre).replace(/___/g,'<span class="gap" id="gap">&nbsp;</span>');
  h='<div class="card"><div class="sent">'+pre+'</div><div class="opts">';
  for(i=0;i<run.opts.length;i++){h+='<button class="opt'+(run.opts[i].charAt(0)==='@'?' l1o':'')+'" id="o'+i+'" onclick="pickMC('+i+')" '+(run.opts[i].charAt(0)==='@'?'dir="'+LG().dir+'" lang="'+LG().lang+'"':'')+'>'+de(optLabel(run.opts[i]))+'</button>';}
  return h+'</div><div id="fb"></div></div>';
}
function pickMC(i){
  var it=run.items[run.idx],ch=run.opts[i],ok=(ch===it.ans),j,g,fb,tg;
  if(run.locked){return;}
  run.locked=true;
  first(ok);
  for(j=0;j<run.opts.length;j++){
    $('o'+j).className='opt'+(run.opts[j].charAt(0)==='@'?' l1o':'')+(run.opts[j]===it.ans?' ok':(j===i?' bad':' dis'));
  }
  g=$('gap');
  if(g){g.innerHTML=esc(ok?ch:it.ans);g.className='gap '+(ok?'ok':'bad');}
  fb=banner(ok);
  if(it.full){fb+=' <span class="sent small">'+mk(it.full)+'</span>';}
  if(!ok){tg=(it.tags&&it.tags[ch])||it.tag;fb+=hintHtml(tg);}
  fb+='</div>'+nxtBtn();
  $('fb').innerHTML=fb;
}

/* ---------- Tippen ---------- */
function fold(s){return s.toLowerCase().replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss');}
function evalGap(val,g){
  var v=val.replace(/^\s+|\s+$/g,'').replace(/[.!?]+$/,''),i,a,cap=false;
  for(i=0;i<g.a.length;i++){
    a=g.a[i];
    if(g.cs){
      if(v===a){return 'ok';}
      if(v.toLowerCase()===a.toLowerCase()){cap=true;}
    }else{
      if(v.toLowerCase()===a.toLowerCase()){return 'ok';}
      if(fold(v)===fold(a)){return 'tr';}
    }
  }
  return cap?'cap':'bad';
}
function inputHtml(n,len,id){
  var w=len<=2?2.6:Math.max(5.2,len*0.62+1.8);
  return '<input class="inp" id="'+id+'" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" style="width:'+w.toFixed(1)+'em" onkeydown="return tyKey(event)">';
}
function tyKey(e){if(e.keyCode===13){tyCheck();return false;}return true;}
function rTY(){
  var it=run.items[run.idx],h='<div class="card">',i,s;
  for(i=0;i<it.lines.length;i++){
    s=mk(it.lines[i]).replace(/\{#(\d)\}/g,function(m,n){return inputHtml(n,it.g[parseInt(n,10)-1].a[0].length,'g'+n);});
    h+='<div class="sent">'+s+'</div>';
  }
  return h+'<div class="nxt" id="act"><button class="btn" onclick="tyCheck()">'+T('check')+'</button></div><div id="fb"></div></div>';
}
function tyCheck(){
  var it=run.items[run.idx],i,inp,res=[],allok=true,hasCap=false,hasTr=false,tags=[],fb='',r;
  if(run.locked){return;}
  for(i=0;i<it.g.length;i++){
    inp=$('g'+(i+1));
    if(inp.disabled){res.push('ok');continue;}
    r=evalGap(inp.value,it.g[i]);
    res.push(r);
    if(r==='cap'){hasCap=true;}
    if(r==='tr'){hasTr=true;}
    if(r==='bad'||r==='cap'){allok=false;if(it.g[i].tag){tags.push(it.g[i].tag);}}
  }
  if(allok){
    run.locked=true;
    first(run.att===0);
    for(i=0;i<it.g.length;i++){inp=$('g'+(i+1));inp.className='inp ok';inp.disabled=true;if(res[i]==='tr'){inp.value=it.g[i].a[0];}}
    fb=banner(true)+' <span class="sent small">'+mk(it.full)+'</span>';
    if(hasTr){fb+='<div class="hint">'+T('umlaut')+'</div>';}
    $('fb').innerHTML=fb+'</div>';
    $('act').innerHTML='<button class="btn" id="nxbtn" onclick="nextItem()">'+T('next')+'</button>';
    return;
  }
  run.att++;
  first(false);
  for(i=0;i<it.g.length;i++){
    inp=$('g'+(i+1));
    if(res[i]==='ok'||res[i]==='tr'){inp.className='inp ok';inp.disabled=true;if(res[i]==='tr'){inp.value=it.g[i].a[0];}}
    else{inp.className='inp bad';}
  }
  if(run.att>=2){
    run.locked=true;
    for(i=0;i<it.g.length;i++){inp=$('g'+(i+1));if(!inp.disabled){inp.value=it.g[i].a[0];inp.className='inp bad';inp.disabled=true;}}
    fb=banner(false)+' <span class="sent small">'+mk(it.full)+'</span>'+(tags.length?hintHtml(tags[0]):hintHtml(it.tag))+'</div>';
    $('fb').innerHTML=fb;
    $('act').innerHTML='<button class="btn" id="nxbtn" onclick="nextItem()">'+T('next')+'</button>';
  }else{
    fb=banner(false)+' '+T('tryAgain')+(hasCap?'<div class="hint">'+T('capHint')+'</div>':'')+(tags.length?hintHtml(tags[0]):hintHtml(it.tag))+'</div>';
    $('fb').innerHTML=fb;
    for(i=0;i<it.g.length;i++){inp=$('g'+(i+1));if(!inp.disabled){try{inp.focus();}catch(e){}break;}}
  }
}

/* ---------- Satz bauen ---------- */
function ordHtml(){
  var o=run.o,h='<div class="line">',k,i;
  for(k=0;k<o.sel.length;k++){h+='<button class="tile on" '+(run.locked?'disabled ':'')+'onclick="ordRem('+k+')">'+esc(o.tk[o.sel[k]])+'</button>';}
  h+='</div><div class="pool">';
  for(i=0;i<o.tk.length;i++){if(o.sel.indexOf(i)<0){h+='<button class="tile" '+(run.locked?'disabled ':'')+'onclick="ordAdd('+i+')">'+esc(o.tk[i])+'</button>';}}
  return h+'</div>';
}
function rOrd(){
  return '<div class="card"><div id="obox">'+ordHtml()+'</div><div class="nxt" id="act"><button class="btn" onclick="ordCheck()">'+T('check')+'</button><button class="btn alt" onclick="ordUndo()">'+T('undo')+'</button></div><div id="fb"></div></div>';
}
function ordRefresh(){$('obox').innerHTML=ordHtml();}
function ordAdd(i){if(run.locked){return;}run.o.sel.push(i);ordRefresh();}
function ordRem(k){if(run.locked){return;}run.o.sel.splice(k,1);ordRefresh();}
function ordUndo(){if(run.locked){return;}run.o.sel.pop();ordRefresh();}
function ordCheck(){
  var it=run.items[run.idx],o=run.o,parts=[],k,built,i,hit=null,fb;
  if(run.locked||o.sel.length===0){return;}
  for(k=0;k<o.sel.length;k++){parts.push(o.tk[o.sel[k]]);}
  built=(parts.join(' ')+it.end).toLowerCase();
  for(i=0;i<it.ok.length;i++){if(it.ok[i].toLowerCase()===built){hit=it.ok[i];}}
  if(hit){
    run.locked=true;first(run.att===0);
    ordRefresh();
    fb=banner(true)+' <span class="sent small">'+esc(hit)+'</span></div>';
    if(it.ok.length>1){fb+='<div class="small">'+esc(it.ok.join('  /  '))+'</div>';}
    $('fb').innerHTML=fb;
    $('act').innerHTML='<button class="btn" id="nxbtn" onclick="nextItem()">'+T('next')+'</button>';
  }else{
    run.att++;first(false);
    if(run.att>=2){
      run.locked=true;ordRefresh();
      $('fb').innerHTML=banner(false)+' <span class="sent small">'+esc(it.ok.join('  /  '))+'</span>'+hintHtml(it.tag)+'</div>';
      $('act').innerHTML='<button class="btn" id="nxbtn" onclick="nextItem()">'+T('next')+'</button>';
    }else{
      $('fb').innerHTML=banner(false)+' '+T('tryAgain')+hintHtml(it.tag)+'</div>';
    }
  }
}

/* ---------- Fehlerdetektiv ---------- */
function rDet(){
  var it=run.items[run.idx];
  return '<div class="card"><div class="sent">'+esc(it.s)+'</div><div id="dbox" class="opts">'+detStep1()+'</div><div id="fb"></div></div>';
}
function detStep1(){return '<button class="opt l1o" id="r1" dir="'+LG().dir+'" onclick="detPick(true)">'+T('right')+'</button><button class="opt l1o" id="r2" dir="'+LG().dir+'" onclick="detPick(false)">'+T('wrong')+'</button>';}
function detPick(v){
  var it=run.items[run.idx],ok=(v===it.good),fb;
  if(run.locked||run.step!==1){return;}
  if(!ok){
    run.locked=true;first(false);
    $('r1').className='opt l1o '+(it.good?'ok':'dis');$('r2').className='opt l1o '+(it.good?'dis':'ok');
    fb=banner(false);
    if(!it.good){fb+=' <span class="sent small">'+esc(it.fix)+'</span>';}
    fb+=hintHtml(it.tag)+'</div>'+nxtBtn();
    $('fb').innerHTML=fb;return;
  }
  if(it.good){
    run.locked=true;first(run.att===0);
    $('r1').className='opt l1o ok';$('r2').className='opt l1o dis';
    $('fb').innerHTML=banner(true)+hintHtml(it.tag==='pron'||it.tag==='order'||it.tag==='verbmean'?null:it.tag)+'</div>'+nxtBtn();return;
  }
  run.step=2;
  run.dopts=shuffle([it.fix].concat(it.alts));
  var h='',i;
  h+='<div class="small" style="width:100%" dir="'+LG().dir+'">'+T('pickFix')+'</div>';
  for(i=0;i<run.dopts.length;i++){h+='<button class="opt" style="font-size:18px;text-align:left" id="f'+i+'" onclick="detFix('+i+')">'+esc(run.dopts[i])+'</button>';}
  $('dbox').innerHTML=h;
}
function detFix(i){
  var it=run.items[run.idx],ok=(run.dopts[i]===it.fix),j,fb;
  if(run.locked){return;}
  run.locked=true;first(ok);
  for(j=0;j<run.dopts.length;j++){$('f'+j).className='opt '+(run.dopts[j]===it.fix?'ok':(j===i?'bad':'dis'));$('f'+j).style.fontSize='18px';$('f'+j).style.textAlign='left';}
  fb=banner(ok)+' <span class="sent small">'+esc(it.fix)+'</span>'+hintHtml(it.tag)+'</div>'+nxtBtn();
  $('fb').innerHTML=fb;
}

/* ---------- Zuordnen (Paare) ---------- */
function matchHtml(){
  var m=run.m,h='<div class="mcols"><div class="mcol">',i,p,k,cls;
  for(i=0;i<P.length;i++){
    p=P[i];cls='opt'+(m.done[i]?' ok dis':(m.sel===i?' sel':''));
    h+='<button class="'+cls+'" onclick="mL('+i+')">'+esc(p.n)+(p.lab?'<small>'+esc(pLabel(p))+'</small>':'')+'</button>';
  }
  h+='</div><div class="mcol">';
  for(k=0;k<9;k++){
    p=P[m.ro[k]];cls='opt'+(m.rdone[k]?' ok dis':'');
    h+='<button class="'+cls+'" onclick="mR('+k+')">'+esc(p.d)+'</button>';
  }
  return h+'</div></div>';
}
function rMatch(){return '<div class="card"><div id="mbox">'+matchHtml()+'</div><div id="fb"></div></div>';}
function mL(i){var m=run.m;if(m.done[i]){return;}m.sel=i;$('mbox').innerHTML=matchHtml();}
function mR(k){
  var m=run.m,n=0,key,ok,fb;
  if(m.rdone[k]){return;}
  if(m.sel<0){return;}
  ok=(P[m.sel].d===P[m.ro[k]].d);
  if(ok){
    m.done[m.sel]=true;m.rdone[k]=true;m.sel=-1;
    for(key in m.done){if(m.done.hasOwnProperty(key)){n++;}}
    $('mbox').innerHTML=matchHtml();
    $('fb').innerHTML='';
    if(n===9){
      run.ok1=Math.max(0,9-m.mist);
      $('fb').innerHTML=banner(true)+'</div>'+pairsHtml(null,null)+'<div class="nxt"><button class="btn" onclick="finish()">'+T('next')+'</button></div>';
    }
  }else{
    m.mist++;
    $('fb').innerHTML=banner(false)+hintHtml('pron')+'</div>';
    m.sel=-1;
    $('mbox').innerHTML=matchHtml();
  }
}

/* ---------- Tabelle ausfuellen ---------- */
function rTbl(){
  var h='<div class="card">',i,p;
  for(i=0;i<P.length;i++){
    p=P[i];
    h+='<div class="trow"><span class="tag n">'+esc(p.n)+(p.lab?' <small style="font:13px Arial">'+esc(pLabel(p))+'</small>':'')+'</span><span class="stitch"></span>'+inputHtml(i,p.d.length,'t'+i)+'</div>';
  }
  return h+'<div class="nxt" id="act"><button class="btn" onclick="tblCheck()">'+T('check')+'</button></div><div id="fb"></div></div>';
}
function tblCheck(){
  var t=run.t,i,inp,r,okn=0,cap=false,fb;
  if(t.locked){return;}
  t.att++;
  for(i=0;i<P.length;i++){
    inp=$('t'+i);
    if(inp.disabled){okn++;continue;}
    r=evalGap(inp.value,{a:[P[i].d],cs:(P[i].id==='siepl'||P[i].id==='Sie')});
    if(r==='ok'||r==='tr'){inp.className='inp ok';inp.disabled=true;okn++;}
    else{inp.className='inp bad';if(r==='cap'){cap=true;}}
  }
  if(t.att===1){run.ok1=okn;}
  if(okn===9){
    t.locked=true;
    $('fb').innerHTML=banner(true)+'</div>'+pairsHtml(null,null);
    $('act').innerHTML='<button class="btn" onclick="finish()">'+T('next')+'</button>';
  }else if(t.att>=3){
    t.locked=true;
    for(i=0;i<P.length;i++){inp=$('t'+i);if(!inp.disabled){inp.value=P[i].d;inp.disabled=true;}}
    $('fb').innerHTML=banner(false)+'</div>'+pairsHtml(null,null);
    $('act').innerHTML='<button class="btn" onclick="finish()">'+T('next')+'</button>';
  }else{
    $('fb').innerHTML=banner(false)+' '+T('tryAgain')+(cap?'<div class="hint">'+T('capHint')+'</div>':'')+'</div>';
  }
}

/* ---------- Start ---------- */
load();
view=ST.lang?'home':'lang';
render();

</script>
