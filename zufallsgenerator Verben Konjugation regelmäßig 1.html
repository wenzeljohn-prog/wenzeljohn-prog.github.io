<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zufallsgenerator – Karten ziehen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --board: #2e4a3d;
    --board-dark: #24392f;
    --chalk: #eef3ee;
    --chalk-dim: #b9c9bd;
    --card-paper: #f6f1e2;
    --card-paper-dark: #e9e0c8;
    --card-ink: #2b2b26;
    --accent: #e8b34a;
    --accent-dark: #c8952f;
    --line: rgba(238, 243, 238, 0.18);
  }

  :root:not([data-theme="light"]) {
    color-scheme: dark;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
  }

  body {
    min-height: 100vh;
    background:
      radial-gradient(ellipse at 50% -10%, rgba(238,243,238,0.05), transparent 60%),
      var(--board);
    background-color: var(--board);
    font-family: 'Space Grotesk', system-ui, sans-serif;
    color: var(--chalk);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 20px 44px;
  }

  .wrap {
    width: 100%;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 28px;
  }

  header {
    text-align: center;
  }

  h1 {
    font-family: 'Kalam', cursive;
    font-weight: 700;
    font-size: clamp(28px, 6vw, 38px);
    margin: 0 0 6px;
    letter-spacing: 0.5px;
    color: var(--chalk);
  }

  .subtitle {
    font-size: 14px;
    color: var(--chalk-dim);
    margin: 0;
  }

  .deck-area {
    position: relative;
    width: 100%;
    max-width: 340px;
    height: 260px;
    perspective: 1200px;
  }

  .stack-shadow {
    position: absolute;
    inset: 0;
    border-radius: 18px;
    background: var(--card-paper-dark);
    transform: translate(10px, 12px) rotate(3deg);
    opacity: 0.55;
  }
  .stack-shadow.two {
    transform: translate(-8px, 16px) rotate(-4deg);
    opacity: 0.4;
  }

  .card {
    position: absolute;
    inset: 0;
    border-radius: 18px;
    background: var(--card-paper);
    color: var(--card-ink);
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 28px;
    box-shadow: 0 18px 34px rgba(0,0,0,0.28);
    border: 1px solid rgba(0,0,0,0.06);
    transform-origin: center;
    animation: none;
  }

  .card::before {
    content: "";
    position: absolute;
    top: 14px;
    left: 14px;
    right: 14px;
    bottom: 14px;
    border: 1.5px dashed rgba(43,43,38,0.16);
    border-radius: 10px;
    pointer-events: none;
  }

  .card-text {
    font-family: 'Kalam', cursive;
    font-weight: 700;
    font-size: clamp(21px, 5vw, 27px);
    line-height: 1.35;
    max-width: 26ch;
  }

  .card.is-drawing {
    animation: draw-card 480ms cubic-bezier(.2,.8,.3,1);
  }

  @keyframes draw-card {
    0%   { transform: translateY(0) rotate(0deg) scale(1); opacity: 1; }
    35%  { transform: translateY(-18px) rotate(-6deg) scale(0.98); opacity: 0.55; }
    36%  { transform: translateY(14px) rotate(5deg) scale(0.98); opacity: 0; }
    60%  { transform: translateY(14px) rotate(5deg) scale(0.98); opacity: 0; }
    100% { transform: translateY(0) rotate(0deg) scale(1); opacity: 1; }
  }

  @media (prefers-reduced-motion: reduce) {
    .card.is-drawing { animation: none; }
  }

  .controls {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    width: 100%;
  }

  button#draw {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 17px;
    color: var(--board-dark);
    background: var(--accent);
    border: none;
    border-radius: 999px;
    padding: 14px 36px;
    cursor: pointer;
    box-shadow: 0 10px 22px rgba(232, 179, 74, 0.28);
    transition: transform 140ms ease, box-shadow 140ms ease, background 140ms ease;
  }

  button#draw:hover {
    background: var(--accent-dark);
    transform: translateY(-1px);
    box-shadow: 0 14px 26px rgba(232, 179, 74, 0.34);
  }

  button#draw:active {
    transform: translateY(1px);
  }

  button#draw:focus-visible {
    outline: 3px solid var(--chalk);
    outline-offset: 3px;
  }

  .progress {
    font-size: 13px;
    color: var(--chalk-dim);
    letter-spacing: 0.3px;
  }

  .progress b {
    color: var(--chalk);
    font-weight: 600;
  }

  .track {
    width: 100%;
    max-width: 300px;
    height: 4px;
    border-radius: 4px;
    background: var(--line);
    overflow: hidden;
  }

  .track-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 4px;
    transition: width 320ms ease;
    width: 0%;
  }

  .reshuffle-note {
    font-size: 12.5px;
    color: var(--chalk-dim);
    text-align: center;
    min-height: 16px;
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <p class="subtitle">Karte ziehen – Rolle spielen</p>
    </header>

    <div class="deck-area">
      <div class="stack-shadow two"></div>
      <div class="stack-shadow"></div>
      <div class="card" id="card">
        <div class="card-text" id="cardText">Karte ziehen, um zu starten</div>
      </div>
    </div>

    <div class="controls">
      <button id="draw" type="button">Karte ziehen</button>
      <div class="track"><div class="track-fill" id="trackFill"></div></div>
      <div class="progress">Karte <b id="pos">0</b> von <b id="total">15</b></div>
      <div class="reshuffle-note" id="note"></div>
    </div>
  </div>

<script>
  const items = [
    "mein Auto reparieren",
    "Polka tanzen",
    "als Koch arbeiten",
    "aus der Ukraine kommen",
    "in Erfurt wohnen",
    "ein bisschen Deutsch sprechen",
    "Hilfe brauchen",
    "nicht verstehen",
    "Anna heißen",
    "Biologie studieren",
    "Deutsch lernen",
    "Probleme machen",
    "\u201eGuten Tag\u201c sagen",
    "ein Wort buchstabieren",
    "nach Hause gehen"
  ];

  const cardEl = document.getElementById('card');
  const textEl = document.getElementById('cardText');
  const posEl = document.getElementById('pos');
  const totalEl = document.getElementById('total');
  const fillEl = document.getElementById('trackFill');
  const noteEl = document.getElementById('note');
  const drawBtn = document.getElementById('draw');

  totalEl.textContent = items.length;

  let deck = [];
  let drawnCount = 0;

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function newDeck(showNote) {
    deck = shuffle(items.map((_, i) => i));
    drawnCount = 0;
    if (showNote) {
      noteEl.textContent = "Alle Karten gezogen – neu gemischt";
      setTimeout(() => { noteEl.textContent = ""; }, 1800);
    }
  }

  function draw() {
    if (deck.length === 0) {
      newDeck(drawnCount > 0);
    }
    const idx = deck.pop();
    drawnCount++;

    cardEl.classList.remove('is-drawing');
    void cardEl.offsetWidth;
    cardEl.classList.add('is-drawing');

    setTimeout(() => {
      textEl.textContent = items[idx];
    }, 170);

    posEl.textContent = drawnCount;
    fillEl.style.width = ((items.length - deck.length) / items.length * 0) + '%';
    fillEl.style.width = (drawnCount / items.length * 100) + '%';
  }

  newDeck(false);
  drawBtn.addEventListener('click', draw);
</script>
</body>
</html>
