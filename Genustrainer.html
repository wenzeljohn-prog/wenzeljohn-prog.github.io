<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Genustrainer B2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&display=swap">
<style>
/* Aufbau: schmale Kopfzeile mit Reitern, darunter eine Arbeitsfläche. Die drei Artikel tragen die Farbe (der blau, die rot, das grün), alles andere bleibt neutral. */
:root{
  --bg:#F2F4F8; --surface:#FFFFFF; --surface2:#F6F8FB; --ink:#141C28; --muted:#566275; --line:#D6DDE7;
  --btn:#141C28; --btn-ink:#FFFFFF;
  --der:#1B58B8; --der-soft:#E1ECFB; --die:#B02A55; --die-soft:#FBE3EA; --das:#23764A; --das-soft:#DDF1E5;
  --warn:#A8460C; --warn-soft:#FDEBDD; --focus:#1B58B8;
  --font-display:'Bricolage Grotesque','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;
  --font-body:'Atkinson Hyperlegible','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E131A; --surface:#161D27; --surface2:#1B2430; --ink:#E7ECF3; --muted:#9AA7B8; --line:#2A3544;
  --btn:#E7ECF3; --btn-ink:#0E131A;
  --der:#86B4FF; --der-soft:#14284A; --die:#FF93B3; --die-soft:#3C1A27; --das:#86D6A5; --das-soft:#133224;
  --warn:#FFB27A; --warn-soft:#3A2310; --focus:#86B4FF; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E131A; --surface:#161D27; --surface2:#1B2430; --ink:#E7ECF3; --muted:#9AA7B8; --line:#2A3544;
  --btn:#E7ECF3; --btn-ink:#0E131A;
  --der:#86B4FF; --der-soft:#14284A; --die:#FF93B3; --die-soft:#3C1A27; --das:#86D6A5; --das-soft:#133224;
  --warn:#FFB27A; --warn-soft:#3A2310; --focus:#86B4FF; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
.wrap{max-width:62rem;margin:0 auto;padding-inline:16px;padding-block:0 48px}
h1,h2,h3{font-family:var(--font-display);line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:1.5rem} h3{font-size:1.15rem}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Kopf */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 10px;border-bottom:1px solid var(--line);margin-inline:-16px;padding-inline:16px}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.brand h1{font-size:1.45rem}
.brand .sub{color:var(--muted);font-size:.9rem}
.brand .art3{display:inline-flex;gap:4px;margin-left:auto}
.art3 i{font-style:normal;font-family:var(--font-display);font-weight:700;font-size:.8rem;padding:2px 8px;border-radius:99px}
.nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.nav button{white-space:nowrap;border:1px solid var(--line);background:var(--surface);padding:7px 14px;border-radius:99px;font-weight:700;font-size:.95rem}
.nav button[aria-current="page"]{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
main{padding-top:20px;display:flex;flex-direction:column;gap:20px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}
.lead{color:var(--muted);max-width:46rem}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.spread{justify-content:space-between}
.muted{color:var(--muted)} .small{font-size:.88rem}

/* Artikelfarben */
.t-m{color:var(--der)} .t-f{color:var(--die)} .t-n{color:var(--das)}
.b-m{background:var(--der-soft);color:var(--der)} .b-f{background:var(--die-soft);color:var(--die)} .b-n{background:var(--das-soft);color:var(--das)} .b-x{background:var(--surface2);color:var(--muted)}
.art3 .b-m,.art3 .b-f,.art3 .b-n{border:0}

/* Buttons */
.btn{border:1px solid var(--btn);background:var(--btn);color:var(--btn-ink);padding:10px 18px;border-radius:10px;font-weight:700}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.sm{padding:6px 12px;font-size:.9rem}
.btn:disabled{opacity:.45;cursor:default}
.link{background:none;border:0;padding:0;color:var(--ink);text-decoration:underline;font-weight:700}

/* Einheitenraster */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{border:1px solid var(--line);border-radius:12px;padding:16px;background:var(--surface);display:flex;flex-direction:column;gap:10px;text-align:left;min-width:0}
button.card:hover{border-color:var(--ink)}
.card .no{font-family:var(--font-display);font-weight:700;font-size:.85rem;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:99px;font-weight:700;font-size:.85rem;white-space:nowrap}
.bar{height:6px;background:var(--surface2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar>i{display:block;height:100%;background:var(--ink)}

/* Regelkarten */
.rule{border:1px solid var(--line);border-left-width:6px;border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px;background:var(--surface);min-width:0}
.rule.g-m{border-left-color:var(--der)} .rule.g-f{border-left-color:var(--die)} .rule.g-n{border-left-color:var(--das)} .rule.g-x{border-left-color:var(--muted)}
.rule header{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.rule .pat{font-family:var(--font-display);font-weight:700;font-size:1.6rem}
.rule .strength{font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.exs{display:flex;flex-wrap:wrap;gap:8px}
.ex{display:inline-flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;padding:5px 10px;background:var(--surface2);line-height:1.25}
.ex .pl{font-size:.75rem;color:var(--muted)}
.ex .a{font-weight:700;margin-right:3px}
.ex.exc{border-style:dashed;background:var(--surface)}
.label{font-size:.78rem;text-transform:uppercase;letter-spacing:.07em;font-weight:700;color:var(--muted)}
mark.hl,b.hl{background:none;color:inherit;font-weight:700;text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:3px}
.hl-m{text-decoration-color:var(--der)} .hl-f{text-decoration-color:var(--die)} .hl-n{text-decoration-color:var(--das)}
.note{background:var(--surface2);border-radius:10px;padding:10px 12px;font-size:.95rem}

/* Quiz */
.quiz{display:flex;flex-direction:column;gap:18px;max-width:40rem;margin-inline:auto}
.qhead{display:flex;gap:12px;align-items:center}
.qhead .bar{flex:1}
.memo{border:1px solid var(--line);border-radius:10px;background:var(--surface2);padding:8px 12px}
.memo summary{cursor:pointer;font-weight:700}
.memo .chips{margin-top:8px}
.word{font-family:var(--font-display);font-weight:700;font-size:clamp(2rem,9vw,3rem);text-align:center;padding-block:14px 4px;overflow-wrap:anywhere}
.word small{display:block;font-family:var(--font-body);font-weight:400;font-size:.9rem;color:var(--muted);margin-top:4px}
.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.choices.six{grid-template-columns:repeat(3,1fr)}
.choices button{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:14px 6px;font-family:var(--font-display);font-weight:700;font-size:1.35rem;min-width:0;overflow-wrap:anywhere}
.choices button .k{display:block;font-family:var(--font-body);font-weight:400;font-size:.72rem;color:var(--muted)}
.choices button.c-m{border-color:var(--der);color:var(--der);background:var(--der-soft)}
.choices button.c-f{border-color:var(--die);color:var(--die);background:var(--die-soft)}
.choices button.c-n{border-color:var(--das);color:var(--das);background:var(--das-soft)}
.choices button:disabled{cursor:default}
.choices button.dim{opacity:.35}
.choices button.right{box-shadow:0 0 0 3px var(--ink)}
.choices button.wrong{border-style:dashed;box-shadow:0 0 0 3px var(--warn)}
.choices.six button{background:var(--surface);color:var(--ink);font-size:1.15rem}
.choices.six button.right{border-color:var(--ink)}
.feedback{border-radius:12px;padding:14px 16px;border:2px solid var(--ink);background:var(--surface);display:flex;flex-direction:column;gap:8px}
.feedback.bad{border-color:var(--warn);border-style:dashed;background:var(--warn-soft)}
.feedback .verdict{font-family:var(--font-display);font-weight:700;font-size:1.15rem}
.feedback .full{font-size:1.2rem}
.sentence{font-size:1.3rem;line-height:1.7;text-align:center;overflow-wrap:anywhere}
.gap{display:inline-block;min-width:3.6em;border-bottom:3px solid var(--ink);text-align:center;font-weight:700;padding-inline:4px}
.gap.ok{color:var(--ink)} .gap.no{color:var(--warn);border-bottom-style:dashed}
.sentence .noun{font-weight:700}
.tag{display:inline-block;border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:3px 10px;font-size:.88rem}
.tag b{font-weight:700}
.typebox{display:flex;gap:8px}
.typebox input{flex:1;min-width:0;font:inherit;font-size:1.2rem;padding:10px 12px;border:2px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
.decl{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;font-size:.92rem}
.decl div{border:1px solid var(--line);border-radius:8px;padding:5px 8px;background:var(--surface2);overflow-wrap:anywhere}
.decl div.on{border-color:var(--ink);background:var(--surface);font-weight:700}
.decl small{display:block;color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.05em}
@media (max-width:520px){.decl{grid-template-columns:repeat(2,minmax(0,1fr))}.choices.six{grid-template-columns:repeat(2,1fr)}}

/* Einstellungen */
.fs{border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:8px;min-width:0}
.fs legend{padding:0;margin-bottom:6px;font-weight:700}
.opt{position:relative}
.opt input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.opt span{display:inline-block;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 13px;font-weight:700;font-size:.92rem}
.opt input:checked+span{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.opt input:focus-visible+span{outline:3px solid var(--focus);outline-offset:2px}
select{font:inherit;padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.settings{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}

/* Tabellen */
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:420px}
th,td{border:1px solid var(--line);padding:8px 10px;text-align:left}
th{background:var(--surface2);font-size:.85rem}
td.m{background:var(--der-soft);color:var(--der);font-weight:700} td.f{background:var(--die-soft);color:var(--die);font-weight:700} td.n{background:var(--das-soft);color:var(--das);font-weight:700} td.p{background:var(--surface2);font-weight:700}
.cols3{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.cols3>div{border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.heat td{text-align:center;font-weight:700}
.stack{display:flex;flex-direction:column;gap:12px}
details.acc{border:1px solid var(--line);border-radius:12px;background:var(--surface)}
details.acc>summary{padding:12px 16px;cursor:pointer;font-weight:700}
details.acc>div{padding:0 16px 16px}
@media (prefers-reduced-motion:no-preference){.bar>i{transition:width .25s}}
.warnmsg{color:var(--warn);font-weight:600}

</style>

function cap1(s){return s.charAt(0).toUpperCase()+s.slice(1);}
function wsample(arr,wf,n){
  var pool=arr.slice(),out=[],i,tot,r;
  while(out.length<n&&pool.length){
    tot=0;for(i=0;i<pool.length;i++)tot+=wf(pool[i]);
    r=Math.random()*tot;
    for(i=0;i<pool.length;i++){r-=wf(pool[i]);if(r<=0)break;}
    if(i>=pool.length)i=pool.length-1;
    out.push(pool.splice(i,1)[0]);
  }
  return out;
}

/* Artikelformen */
var DEF={m:['der','den','dem','des'],f:['die','die','der','der'],n:['das','das','dem','des'],p:['die','die','den','der']};
var EEND={m:['','en','em','es'],f:['e','e','er','er'],n:['','','em','es'],p:['e','e','en','er']};
var DEND={m:['er','en','em','es'],f:['e','e','er','er'],n:['es','es','em','es'],p:['e','e','en','er']};
var CI={N:0,A:1,D:2,G:3};
function artForm(type,stem,c,g){
  var ci=CI[c];
  if(type==='def')return DEF[g][ci];
  if(type==='dem')return stem+DEND[g][ci];
  var end=EEND[g][ci];
  if(stem==='euer'&&end)return 'eur'+end;
  return stem+end;
}
function optionsFor(type,stem){
  if(type==='def')return ['der','die','das','den','dem','des'];
  var out=[],gs=['m','f','n','p'],i,j,f;
  for(i=0;i<4;i++)for(j=0;j<4;j++){f=artForm(type,stem,CASES[i],gs[j]);if(!has(out,f))out.push(f);}
  var order=type==='dem'?['er','e','es','en','em']:['','e','en','em','er','es'];
  var base=type==='dem'?stem:stem;
  var res=[],k;
  for(k=0;k<order.length;k++){
    f=type==='dem'?stem+order[k]:(stem==='euer'&&order[k]?'eur'+order[k]:stem+order[k]);
    if(has(out,f)&&!has(res,f))res.push(f);
  }
  return res;
}
function nounForm(n,c,num){
  if(num==='p')return c==='D'?n.dp:n.pl;
  return c==='N'?n.w:c==='A'?n.acc:c==='D'?n.dat:n.gs;
}

/* Hervorhebung der Endung */
function hlWord(e){
  var r=RULES[e.r],w=e.w,i,s,lw;
  if(!r)return esc(w);
  if(e.r==='komp'&&e.h)return esc(w.slice(0,e.h))+'<b class="hl hl-'+e.a+'">'+esc(w.slice(e.h))+'</b>';
  lw=w.toLowerCase();
  for(i=0;i<r.hl.length;i++){
    s=r.hl[i];
    if(s==='Ge'){if(w.indexOf('Ge')===0)return '<b class="hl hl-'+e.a+'">Ge</b>'+esc(w.slice(2));}
    else if(lw.length>s.length&&lw.slice(-s.length)===s)return esc(w.slice(0,w.length-s.length))+'<b class="hl hl-'+e.a+'">'+esc(w.slice(w.length-s.length))+'</b>';
  }
  return esc(w);
}
function artSpan(a,txt){return '<span class="t-'+a+'">'+esc(txt||ART[a])+'</span>';}
function exChip(e,cls){
  var pl=e.pl==='-'?'':'<span class="pl">Pl. '+esc(e.pl)+'</span>';
  if(e.r==='abk')pl='<span class="pl">= '+esc(e.lf)+'</span>';
  return '<span class="ex '+(cls||'')+'"><span><span class="a t-'+e.a+'">'+ART[e.a]+'</span>'+hlWord(e)+'</span>'+pl+'</span>';
}
function ruleLabel(r){
  var g=r.g==='x'?'':' → '+ART[r.g];
  return r.pat+g;
}
function chipRule(r){
  var cls=r.g==='x'?'b-x':'b-'+r.g;
  return '<span class="chip '+cls+'">'+esc(r.pat)+(r.g==='x'?'':' → '+ART[r.g])+'</span>';
}
function pctStr(a,b){return b?Math.round(100*a/b)+' %':'–';}

/* Leitner-Gewichte */
/* Niveau-Ausgleich: A1/A2-Wörter sollen nicht von den vielen B1/B2-Wörtern verdrängt werden */
function lvlBalance(pool){
  var c={1:0,2:0,3:0,4:0},i,n=0,k;
  for(i=0;i<pool.length;i++){c[pool[i].lvl]++;}
  for(k=1;k<=4;k++)if(c[k])n++;
  var avg=pool.length/Math.max(1,n);
  return function(w){return c[w.lvl]?avg/c[w.lvl]:1;};
}
function wordBox(w){var s=P.w[w.w+'|'+w.a];return s?s.b:0;}
function wordWeight(w){var b=wordBox(w);return [3,6,3.5,2,1.1,.5][b];}
function wordResult(w,ok){
  var k=w.w+'|'+w.a,s=P.w[k]||(P.w[k]={b:0,o:0,n:0});
  s.n++;
  if(ok){s.o++;s.b=s.b?Math.min(5,s.b+1):2;}else{s.b=1;}
}

function ruleInfo(e){
  var r=RULES[e.r];
  if(e.r==='komp')return 'Zusammengesetztes Nomen: Das letzte Wort („'+esc(cap1(e.w.slice(e.h)))+'“) bestimmt den Artikel, also '+ART[e.a]+' '+hlWord(e)+'.';
  if(e.r==='abk')return 'Abkürzung: Die Langform ist '+esc(e.lf)+'. Darum heißt es '+ART[e.a]+' '+esc(e.w)+'.';
  if(!r)return 'Für dieses Wort gibt es keine verlässliche Faustregel. Merken Sie sich den Artikel gleich mit dem Wort.';
  if(e.r==='pers_x')return 'Achtung: Der Artikel passt nicht zum natürlichen Geschlecht. Dieses Wort lernt man einzeln.';
  if(e.x)return '<b>Ausnahme!</b> Nach der Regel „'+esc(r.t)+'“ ('+esc(ruleLabel(r))+', '+esc(r.s)+') würde man '+ART[r.g]+' erwarten. Dieses Wort lernt man einzeln.';
  return 'Regel: '+hlWord(e)+' → <b class="t-'+e.a+'">'+ART[e.a]+'</b> ('+esc(r.t)+', '+esc(r.s)+')';
}
function fullLine(e){
  var pl=e.pl==='-'?'kein Plural':'Plural: <b>die '+esc(e.pl)+'</b>';
  return '<div class="full"><b class="t-'+e.a+'">'+ART[e.a]+'</b> <b>'+esc(e.w)+'</b> <span class="muted">· '+pl+'</span></div>';

/* cfg: items, title, cards(bool), memo(array Regel-IDs), meta(bool), onWord, onDone(res), onBack, onAgain, onNext, nextLabel, againLabel, backLabel */
function runQuiz(root,cfg){
  var items=cfg.items,i=0,score=0,wrong=[],answered=false,revealed=false;
  function memoHTML(){
    if(!cfg.memo||!cfg.memo.length)return '';
    var h='<details class="memo"'+(cfg.memoOpen===false?'':' open')+'><summary>Erinnerung: die Regeln dieser Einheit</summary><div class="chips">';
    cfg.memo.forEach(function(id){h+=chipRule(RULES[id]);});
    return h+'</div></details>';
  }
  function head(){
    return '<div class="qhead"><span class="small muted" aria-live="polite">'+(i+1)+' / '+items.length+'</span><div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="'+items.length+'" aria-valuenow="'+i+'"><i style="width:'+Math.round(100*i/items.length)+'%"></i></div><span class="small muted">'+score+' richtig</span></div>';
  }
  function metaHTML(e){
    if(!cfg.meta)return '';
    return '<small>'+LV[e.lvl]+' · '+esc(THEMES[e.th])+'</small>';
  }
  function show(){
    var e=items[i];answered=false;revealed=false;
    var h='<div class="quiz">'+(cfg.title?'<div class="row spread"><h3>'+esc(cfg.title)+'</h3><button class="link" id="q-quit">Abbrechen</button></div>':'')+head()+memoHTML();
    h+='<div class="word">'+esc(e.w)+metaHTML(e)+'</div>';
    if(cfg.cards){
      h+='<div id="q-card"><button class="btn" id="q-reveal" style="width:100%">Artikel aufdecken (Leertaste)</button></div>';
    }else{
      h+='<div class="choices" id="q-ch" role="group" aria-label="Artikel wählen">';
      ['m','f','n'].forEach(function(g,k){h+='<button type="button" data-a="'+g+'" class="c-'+g+'">'+ART[g]+'<span class="k">Taste '+(k+1)+'</span></button>';});
      h+='</div>';
    }
    h+='<div id="q-fb" aria-live="polite"></div></div>';
    root.innerHTML=h;
    $('#q-quit',root)&&($('#q-quit',root).onclick=function(){setKeys(null);cfg.onBack&&cfg.onBack();});
    if(cfg.cards){$('#q-reveal',root).onclick=reveal;}
    else $$('#q-ch button',root).forEach(function(b){b.onclick=function(){answer(b.getAttribute('data-a'));};});
    var a=$('#q-ch button',root)||$('#q-reveal',root);a&&a.focus&&a.focus({preventScroll:true});
  }
  function fb(ok){
    var e=items[i];
    var h='<div class="feedback'+(ok?'':' bad')+'"><div class="verdict">'+(ok?'✓ Richtig':'✗ Nicht ganz')+'</div>'+fullLine(e)+'<div>'+ruleInfo(e)+'</div>';
    h+='<div class="row" style="margin-top:4px"><button class="btn" id="q-next">'+(i+1<items.length?'Weiter':'Ergebnis')+' (Enter)</button></div></div>';
    $('#q-fb',root).innerHTML=h;
    var nb=$('#q-next',root);nb.onclick=next;nb.focus({preventScroll:true});
    if(nb.scrollIntoView)try{nb.scrollIntoView({block:'nearest'});}catch(x){}
  }
  function finishWord(ok){
    var e=items[i];
    if(ok)score++;else wrong.push(e);
    cfg.onWord&&cfg.onWord(e,ok);
  }
  function answer(g){
    if(answered)return;answered=true;
    var e=items[i],ok=g===e.a;
    $$('#q-ch button',root).forEach(function(b){
      var bg=b.getAttribute('data-a');b.disabled=true;
      if(bg===e.a)b.classList.add('right');else if(bg===g)b.classList.add('wrong');else b.classList.add('dim');
    });
    finishWord(ok);fb(ok);
  }
  function reveal(){
    if(revealed)return;revealed=true;
    var e=items[i];
    var h='<div class="feedback" style="border-style:solid">'+fullLine(e)+'<div>'+ruleInfo(e)+'</div><div class="row" style="margin-top:6px"><button class="btn" id="q-yes">Gewusst (1)</button><button class="btn ghost" id="q-no">Noch nicht (2)</button></div></div>';
    $('#q-card',root).innerHTML=h;
    $('#q-yes',root).onclick=function(){cardAns(true);};
    $('#q-no',root).onclick=function(){cardAns(false);};
    $('#q-yes',root).focus({preventScroll:true});
  }
  function cardAns(ok){
    if(answered)return;answered=true;finishWord(ok);next();
  }
  function next(){
    if(!answered)return;
    i++;
    if(i<items.length)show();else done();
  }
  function done(){
    setKeys(null);
    var res={score:score,total:items.length,wrong:wrong};
    cfg.onDone&&cfg.onDone(res);
    var pct=Math.round(100*score/items.length);
    var h='<div class="quiz"><h3>Ergebnis</h3><div class="panel"><div class="word" style="padding-block:0">'+score+' von '+items.length+'<small>'+pct+' % richtig</small></div></div>';
    if(wrong.length){
      h+='<div class="stack"><span class="label">Das sollten Sie wiederholen</span><div class="exs">';
      wrong.forEach(function(e){h+=exChip(e);});
      h+='</div>';
      if(wrong.some(function(e){return e.r&&RULES[e.r];}))h+='<p class="small muted">Tipp: Lesen Sie bei Fehlern die Regel noch einmal in der Lerneinheit.</p>';
      h+='</div>';
    }else h+='<p>Alles richtig. Sehr gut!</p>';
    h+='<div class="row">';
    if(wrong.length)h+='<button class="btn" id="r-fix">Fehler wiederholen</button>';
    if(cfg.onNext)h+='<button class="btn'+(wrong.length?' ghost':'')+'" id="r-next">'+esc(cfg.nextLabel||'Weiter')+'</button>';
    if(cfg.onAgain)h+='<button class="btn ghost" id="r-again">'+esc(cfg.againLabel||'Neue Runde')+'</button>';
    h+='<button class="btn ghost" id="r-back">'+esc(cfg.backLabel||'Zurück')+'</button></div></div>';
    root.innerHTML=h;
    $('#r-fix',root)&&($('#r-fix',root).onclick=function(){
      runQuiz(root,{items:shuffle(wrong),title:'Fehler wiederholen',cards:cfg.cards,meta:cfg.meta,onWord:cfg.onWord,onBack:cfg.onBack,backLabel:cfg.backLabel,onAgain:cfg.onAgain,againLabel:cfg.againLabel,onNext:cfg.onNext,nextLabel:cfg.nextLabel});
    });
    $('#r-next',root)&&($('#r-next',root).onclick=cfg.onNext);
    $('#r-again',root)&&($('#r-again',root).onclick=cfg.onAgain);
    $('#r-back',root).onclick=function(){cfg.onBack&&cfg.onBack();};
    window.scrollTo(0,0);
  }
  setKeys(function(ev){
    if(ev.ctrlKey||ev.metaKey||ev.altKey)return;
    var tag=(ev.target&&ev.target.tagName)||'';
    if(tag==='INPUT'||tag==='SELECT'||tag==='TEXTAREA')return;
    var k=ev.key;
    if(cfg.cards){
      if(!revealed&&(k===' '||k==='Enter')){ev.preventDefault();reveal();}
      else if(revealed&&!answered){if(k==='1'){cardAns(true);}else if(k==='2'){cardAns(false);}}
      return;
    }
    if(!answered){
      if(k==='1')answer('m');else if(k==='2')answer('f');else if(k==='3')answer('n');
    }else if(k==='Enter'||k===' '){
      if(document.activeElement&&document.activeElement.id==='q-next')return;
      ev.preventDefault();next();
    }
  });
  show();
}

/* ===== Lerneinheit: Faustregeln ===== */
function ruleItems(rid,exc){
  return W.filter(function(w){return w.r===rid&&(exc?w.x:!w.x)&&!w.nopr;});
}
function sortByLevel(a){return a.slice().sort(function(x,y){return x.lvl-y.lvl||x.w.length-y.w.length||(x.w<y.w?-1:1);});}

function batchRules(b){return b.r.map(function(id){return RULES[id];});}

function learnHome(root){
  setKeys(null);
  var h='<section class="panel stack"><h2>Faustregeln für den Artikel</h2><p class="lead">Zehn kurze Einheiten. Jede Einheit hat drei bis fünf Regeln und danach eine Übung. Autos, Metalle oder Farben fehlen mit Absicht: Wichtig sind häufige Endungen und Wortbildungen, die im Alltag und in der Prüfung vorkommen.</p></section><div class="grid">';
  BATCHES.forEach(function(b){
    var st=P.b[b.id],chips='';
    batchRules(b).forEach(function(r){chips+=chipRule(r);});
    h+='<button class="card" data-b="'+b.id+'"><span class="no">Einheit '+b.id+'</span><h3>'+esc(b.t)+'</h3><span class="small muted">'+esc(b.x)+'</span><span class="chips">'+chips+'</span>'+
       '<span class="small muted">'+(st?'Beste Übung: '+st.best+' % · '+st.runs+'× geübt':'Noch nicht geübt')+'</span><span class="bar"><i style="width:'+(st?st.best:0)+'%"></i></span></button>';
  });
  var st=P.b.all;
  h+='<button class="card" data-b="all" style="border-width:2px"><span class="no">Alle Einheiten</span><h3>Gesamtwiederholung</h3><span class="small muted">Bis zu 200 gemischte Wörter aus allen 39 Regeln, mit vielen Ausnahmen. Sie wählen den Umfang.</span><span class="small muted">'+(st?'Beste Übung: '+st.best+' % · '+st.runs+'× geübt':'Noch nicht geübt')+'</span><span class="bar"><i style="width:'+(st?st.best:0)+'%"></i></span></button></div>';

  $$('button[data-b]',root).forEach(function(b){b.onclick=function(){var v=b.getAttribute('data-b');learnBatch(root,v==='all'?'all':parseInt(v,10));};});

function ruleCard(r){
  var ex=sortByLevel(ruleItems(r.id,false)),exc=sortByLevel(ruleItems(r.id,true));
  var nEx=r.id==='pers_x'?12:r.id==='komp'||r.id==='abk'?6:6;
  var h='<article class="rule g-'+r.g+'"><header><span class="pat">'+esc(r.pat)+'</span>'+(r.g==='x'?'':'<span class="chip b-'+r.g+'">'+ART[r.g]+'</span>')+'<span class="strength">'+esc(r.s)+'</span></header>';
  h+='<p>'+esc(r.x)+'</p>';
  h+='<div class="stack" style="gap:6px"><span class="label">Beispiele</span><div class="exs">';
  var shown=ex.slice(0,nEx);
  if(r.id!=='pers_x'&&r.id!=='komp'&&r.id!=='abk'&&ex.length>nEx){
    // Mischung aus leicht und etwas schwerer
    shown=ex.slice(0,Math.ceil(nEx/2)).concat(shuffle(ex.slice(Math.ceil(nEx/2))).slice(0,Math.floor(nEx/2)));
  }
  shown.forEach(function(e){h+=exChip(e);});
  h+='</div></div>';
  if(exc.length&&r.id!=='pers_x'){
    h+='<div class="stack" style="gap:6px"><span class="label">Ausnahmen</span><div class="exs">';
    exc.slice(0,8).forEach(function(e){h+=exChip(e,'exc');});
    h+='</div></div>';
  }
  if(r.n)h+='<div class="note">'+esc(r.n)+'</div>';
  return h+'</article>';
}

function learnBatch(root,bid,view){
  setKeys(null);
  if(bid==='all'){allSetup(root);return;}
  var b=BATCHES[bid-1],h='<div class="row spread"><button class="link" id="l-back">← Alle Einheiten</button><span class="small muted">Einheit '+b.id+' von '+BATCHES.length+'</span></div>';
  h+='<section class="panel stack"><h2>'+esc(b.t)+'</h2><p class="lead">'+esc(b.x)+'</p></section><div class="stack">';
  batchRules(b).forEach(function(r){h+=ruleCard(r);});
  h+='</div><div class="panel row spread"><div><h3>Anwendungsübung</h3><p class="small muted">14 Wörter zu diesen Regeln, darunter einige Ausnahmen.</p></div><button class="btn" id="l-go">Übung starten</button></div>';
  h+='<div class="row spread">'+(bid>1?'<button class="btn ghost sm" id="l-prev">← Einheit '+(bid-1)+'</button>':'<span></span>')+(bid<BATCHES.length?'<button class="btn ghost sm" id="l-nextb">Einheit '+(bid+1)+' →</button>':'<span></span>')+'</div>';

  $('#l-nextb')&&($('#l-nextb').onclick=function(){learnBatch(root,bid+1);});
}

function buildBatchItems(bid,n){
  var rids,total,maxExc;
  if(bid==='all'){rids=RLIST.map(function(r){return r.id;});total=n||80;maxExc=Math.round(total*0.2);}
  else{rids=BATCHES[bid-1].r;total=14;maxExc=3;}
  var regs={},excs={},out=[],rid,i,id;
  rids.forEach(function(id){
    regs[id]=ruleItems(id,false);excs[id]=ruleItems(id,true);
    regs[id]=shuffle(regs[id]);excs[id]=shuffle(excs[id]);
  });
  if(bid==='all'){
    // Ausnahmen gleichmäßig über alle Regeln verteilen (reihum)
    var ec=shuffle(rids.filter(function(id){return excs[id].length&&id!=='pers_x';})),g=0;
    while(out.length<maxExc&&ec.some(function(id){return excs[id].length;})&&g<2000){
      id=ec[g%ec.length];g++;
      if(excs[id].length)out.push(excs[id].shift());
    }
    // pers_x (Artikel passt nicht zum Geschlecht) mit einigen Wörtern
    for(i=0;i<Math.min(4,excs.pers_x.length+regs.pers_x.length)&&out.length<total;i++){
      var src=regs.pers_x.length?regs.pers_x:excs.pers_x;out.push(src.shift());
    }
  }else{
    var cand=shuffle(rids.filter(function(id){return excs[id].length&&id!=='pers_x';}));
    for(i=0;i<cand.length&&out.length<maxExc;i++){out.push(excs[cand[i]][0]);}
  }
  // reguläre Wörter reihum über alle Regeln, damit jede Regel vorkommt
  var order=shuffle(rids),guard=0;
  while(out.length<total&&guard<5000){
    guard++;
    rid=order[guard%order.length];
    if(regs[rid].length)out.push(regs[rid].shift());
    else if(!order.some(function(id){return regs[id].length;}))break;
  }
  // doppelte Wörter vermeiden
  var seen={};out=out.filter(function(e){var k=e.w+'|'+e.a;if(seen[k])return false;seen[k]=1;return true;});

}

var FR=FR_RAW.map(function(f){return {c:f[0],k:f[1],s:f[2],p:f[3],why:f[4]};});

var ATYPE={def:'bestimmter Artikel',ind:'unbestimmter Artikel',pos:'Possessivartikel',dem:'Demonstrativartikel'};
var POSS=['mein','dein','sein','ihr','unser','euer','Ihr'];

function kSettings(){
  var s=P.set.k||{};
  return {cases:s.cases||['N','A','D','G'],types:s.types||['def','ind','pos','dem'],num:s.num||'mix',lvl:s.lvl||4,input:s.input||'mc',help:s.help||'full',gen:!!s.gen,n:s.n||20};
}
function kPool(s){return W.filter(function(w){return w.lvl<=s.lvl&&w.cls!=='X'&&w.r!=='adjn'&&w.r!=='inf';});}

var byLevel={};
function makeKItem(s,pool,used){
  if(!byLevel.__p||byLevel.__p!==pool){byLevel={__p:pool,1:[],2:[],3:[],4:[]};pool.forEach(function(w){byLevel[w.lvl].push(w);});}
  var t,n,c,num,fr,f,ty,stem,g,tpl,nf,parts;
  var lv=[],q;
  for(q=1;q<=s.lvl;q++)lv.push(q);
  for(t=0;t<300;t++){
    var L=pick(lv),cand=byLevel[L];
    if(!cand||!cand.length)continue;
    n=pick(cand);
    if(used[n.id])continue;
    c=pick(s.cases);
    num=s.num==='pl'?'p':s.num==='sg'?'s':(Math.random()<0.3?'p':'s');
    if(!n.pe){if(s.num==='pl')continue;num='s';}
    fr=FR.filter(function(x){return x.c===c&&x.k.indexOf(n.cls)>=0;});
    if(!fr.length)continue;
    f=pick(fr);ty=pick(s.types);
    stem=ty==='def'?'':ty==='ind'?(num==='p'||Math.random()<0.25?'kein':'ein'):ty==='pos'?pick(POSS):(Math.random()<0.85?'dies':'jen');
    g=num==='p'?'p':n.a;
    nf=nounForm(n,c,num);
    tpl=((num==='p'&&f.p)?f.p:f.s).replace('{n}','<span class="noun">'+esc(nf)+'</span>');
    parts=tpl.split('{a}');
    used[n.id]=1;
    return {n:n,c:c,num:num,g:g,f:f,ty:ty,stem:stem,ans:artForm(ty,stem,c,g),pre:parts[0],post:parts[1]};
  }
  return null;
}
function typeChip(it){
  var s='';
  if(it.ty==='def')s='bestimmter Artikel';
  else if(it.ty==='ind')s=it.stem==='kein'?'Negativartikel (kein-)':'unbestimmter Artikel (ein-)';
  else if(it.ty==='pos')s='Possessivartikel: <b>'+esc(it.stem)+'-</b>';
  else s='Demonstrativartikel: <b>'+it.stem+'-</b>';
  return '<span class="tag">Ergänze: '+s+'</span>';
}
function declGrid(it){
  var h='<div class="decl">';
  CASES.forEach(function(c){
    var a=artForm(it.ty,it.stem,c,it.g),nf=nounForm(it.n,c,it.num);
    h+='<div'+(c===it.c?' class="on"':'')+'><small>'+CASENAME[c]+'</small>'+esc(a)+' '+esc(nf)+'</div>';
  });
  return h+'</div>';
}
function showAns(it){return it.pre.replace(/\s+$/,'')===''?cap1(it.ans):it.ans;}

function runKasus(root,s){
  var pool=kPool(s),used={},items=[],k,it;
  for(k=0;k<s.n;k++){it=makeKItem(s,pool,used);if(it)items.push(it);}
  var i=0,score=0,answered=false,wrongList=[];
  function stat(it,ok){
    var key=it.c+it.g,v=P.k[key]||(P.k[key]=[0,0]);
    v[1]++;if(ok)v[0]++;save();
  }
  function head(){
    return '<div class="qhead"><span class="small muted">'+(i+1)+' / '+items.length+'</span><div class="bar"><i style="width:'+Math.round(100*i/items.length)+'%"></i></div><span class="small muted">'+score+' richtig</span></div>';
  }
  function caseTag(it){
    if(s.help==='none')return '';
    var t='<span class="tag"><b>'+CASENAME[it.c]+'</b>'+(s.help==='full'?' · '+CASEQ[it.c]:'')+'</span>';
    return t;
  }
  function show(){
    var it=items[i];answered=false;
    var h='<div class="quiz"><div class="row spread"><h3>Kasus üben</h3><button class="link" id="k-quit">Abbrechen</button></div>'+head();
    h+='<div class="row" style="justify-content:center">'+caseTag(it)+typeChip(it)+'</div>';
    h+='<p class="sentence" id="k-sent">'+esc(it.pre)+'<span class="gap" id="k-gap">&nbsp;</span>'+it.post+'</p>';
    if(s.gen)h+='<p class="small muted" style="text-align:center">Nomen: '+ART[it.n.a]+' '+esc(it.n.w)+(it.num==='p'?' (hier im Plural)':'')+'</p>';
    if(s.input==='type'){
      h+='<form class="typebox" id="k-form" autocomplete="off"><input id="k-in" type="text" autocapitalize="none" autocorrect="off" spellcheck="false" aria-label="Artikel eintippen" placeholder="Artikel eintippen"><button class="btn" type="submit">Prüfen</button></form>';
    }else{
      var opts=optionsFor(it.ty,it.stem);
      h+='<div class="choices six" id="k-ch" role="group" aria-label="Artikel wählen">';
      opts.forEach(function(o,j){h+='<button type="button" data-o="'+esc(o)+'">'+esc(o)+'<span class="k">Taste '+(j+1)+'</span></button>';});
      h+='</div>';
    }
    h+='<div id="k-fb" aria-live="polite"></div></div>';
    root.innerHTML=h;
    $('#k-quit',root).onclick=function(){setKeys(null);kasusHome(root);};
    if(s.input==='type'){
      $('#k-form',root).onsubmit=function(ev){ev.preventDefault();var v=$('#k-in',root).value;if(v.replace(/\s/g,''))answer(v);};
      $('#k-in',root).focus({preventScroll:true});
    }else{
      $$('#k-ch button',root).forEach(function(b){b.onclick=function(){answer(b.getAttribute('data-o'));};});
    }
  }
  function answer(v){
    if(answered)return;answered=true;
    var it=items[i],norm=v.toLowerCase().replace(/\s+/g,''),ok=norm===it.ans.toLowerCase();
    if(ok)score++;else wrongList.push(it);
    stat(it,ok);
    var gap=$('#k-gap',root);gap.className='gap '+(ok?'ok':'no');gap.textContent=ok?showAns(it):v.trim();
    if(s.input==='type'){$('#k-in',root).disabled=true;$$('#k-form button',root).forEach(function(b){b.disabled=true;});}
    else $$('#k-ch button',root).forEach(function(b){
      var o=b.getAttribute('data-o');b.disabled=true;
      if(o.toLowerCase()===it.ans.toLowerCase())b.classList.add('right');else if(o===v)b.classList.add('wrong');else b.classList.add('dim');
    });
    var fb='<div class="feedback'+(ok?'':' bad')+'"><div class="verdict">'+(ok?'✓ Richtig':'✗ Nicht ganz')+'</div>';
    fb+='<div class="full">'+esc(it.pre)+'<b>'+esc(showAns(it))+'</b>'+it.post+'</div>';
    if(!ok)fb+='<div>Gesucht ist: <b>'+CASENAME[it.c]+'</b>, '+GNAME[it.g]+(it.g==='p'?'':', Singular')+' → <b>'+esc(it.ans)+'</b>.</div>';
    fb+='<div class="small muted">'+esc(it.f.why)+'</div>'+declGrid(it);
    fb+='<div class="row" style="margin-top:4px"><button class="btn" id="k-next">'+(i+1<items.length?'Weiter':'Ergebnis')+' (Enter)</button></div></div>';
    $('#k-fb',root).innerHTML=fb;
    var nb=$('#k-next',root);nb.onclick=next;nb.focus({preventScroll:true});
  }
  function next(){
    if(!answered)return;
    i++;
    if(i<items.length)show();else done();
  }
  function done(){
    setKeys(null);
    var pct=Math.round(100*score/items.length);
    var h='<div class="quiz"><h3>Ergebnis</h3><div class="panel"><div class="word" style="padding-block:0">'+score+' von '+items.length+'<small>'+pct+' % richtig</small></div></div>';
    if(wrongList.length){
      h+='<div class="stack"><span class="label">Noch einmal ansehen</span>';
      wrongList.forEach(function(it){
        h+='<div class="note">'+esc(it.pre)+'<b>'+esc(showAns(it))+'</b>'+it.post+' <span class="muted small">('+CASENAME[it.c]+', '+GNAME[it.g]+')</span></div>';
      });
      h+='</div>';
    }else h+='<p>Alles richtig. Sehr gut!</p>';
    h+='<div class="row"><button class="btn" id="k-again">Neue Runde</button><button class="btn ghost" id="k-back">Einstellungen</button></div></div>';
    root.innerHTML=h;window.scrollTo(0,0);
    $('#k-again',root).onclick=function(){runKasus(root,s);};
    $('#k-back',root).onclick=function(){kasusHome(root);};
  }
  setKeys(function(ev){
    if(ev.ctrlKey||ev.metaKey||ev.altKey)return;
    var tag=(ev.target&&ev.target.tagName)||'';
    if(tag==='INPUT'||tag==='SELECT'||tag==='TEXTAREA')return;
    if(!answered&&s.input!=='type'){
      var n=parseInt(ev.key,10);
      if(n>=1&&n<=6){var bs=$$('#k-ch button',root);if(bs[n-1])answer(bs[n-1].getAttribute('data-o'));}
    }else if(answered&&(ev.key==='Enter'||ev.key===' ')){
      if(document.activeElement&&document.activeElement.id==='k-next')return;
      ev.preventDefault();next();
    }
  });
  if(!items.length){root.innerHTML='<div class="panel">Mit dieser Auswahl gibt es keine passenden Sätze. Bitte ändern Sie die Einstellungen.</div>';return;}
  show();window.scrollTo(0,0);
}

function kasusHome(root){
  setKeys(null);
  var s=kSettings();
  var h='<section class="panel stack"><h2>Kasus üben: Artikel in Sätzen</h2><p class="lead">Ergänzen Sie den Artikel im richtigen Fall. Die Nomen sind schon dekliniert (zum Beispiel den Kolleg<b>en</b>, des Lehrer<b>s</b>, den Kinder<b>n</b>). Nach jeder Antwort sehen Sie die ganze Deklination.</p></section>';
  h+='<form class="panel stack" id="k-set"><div class="settings">';
  h+='<fieldset class="fs"><legend>Fälle</legend><div class="chips">';
  CASES.forEach(function(c){h+=optBox('checkbox','case',c,CASENAME[c],has(s.cases,c));});
  h+='</div></fieldset><fieldset class="fs"><legend>Artikelarten</legend><div class="chips">';
  h+=optBox('checkbox','type','def','bestimmt (der, die, das)',has(s.types,'def'))+optBox('checkbox','type','ind','unbestimmt (ein-, kein-)',has(s.types,'ind'))+optBox('checkbox','type','pos','Possessiv (mein-, dein- …)',has(s.types,'pos'))+optBox('checkbox','type','dem','Demonstrativ (dies-, jen-)',has(s.types,'dem'));
  h+='</div></fieldset><fieldset class="fs"><legend>Singular oder Plural</legend><div class="chips">'+optBox('radio','num','mix','gemischt',s.num==='mix')+optBox('radio','num','sg','nur Singular',s.num==='sg')+optBox('radio','num','pl','nur Plural',s.num==='pl')+'</div></fieldset>';
  h+='<fieldset class="fs"><legend>Wortschatz bis</legend><div class="chips">';
  for(var l=1;l<=4;l++)h+=optBox('radio','lvl',l,LV[l],s.lvl===l);
  h+='</div></fieldset><fieldset class="fs"><legend>Antwort</legend><div class="chips">'+optBox('radio','input','mc','auswählen',s.input==='mc')+optBox('radio','input','type','eintippen',s.input==='type')+'</div></fieldset>';
  h+='<fieldset class="fs"><legend>Hilfe vor der Antwort</legend><div class="chips">'+optBox('radio','help','full','Fall und Frage',s.help==='full')+optBox('radio','help','case','nur der Fall',s.help==='case')+optBox('radio','help','none','keine Hilfe',s.help==='none')+'</div>'+
     '<label class="row small"><input type="checkbox" id="k-gen"'+(s.gen?' checked':'')+'> Artikel des Nomens (Nominativ) anzeigen</label></fieldset>';
  h+='<fieldset class="fs"><legend>Anzahl Sätze</legend><div class="chips">'+optBox('radio','n','10','10',s.n===10)+optBox('radio','n','20','20',s.n===20)+optBox('radio','n','40','40',s.n===40)+'</div></fieldset></div>';
  h+='<div class="row spread"><span class="small muted" id="k-msg"></span><button class="btn" id="k-go" type="submit">Starten</button></div></form>';
  root.innerHTML=h;
  var form=$('#k-set',root);
  function read(){
    return {cases:getChecked(form,'case'),types:getChecked(form,'type'),num:getChecked(form,'num')[0],lvl:parseInt(getChecked(form,'lvl')[0],10),input:getChecked(form,'input')[0],help:getChecked(form,'help')[0],gen:$('#k-gen',form).checked,n:parseInt(getChecked(form,'n')[0],10)};
  }
  function upd(){
    var c=read(),okk=c.cases.length&&c.types.length;
    $('#k-go',root).disabled=!okk;
    $('#k-msg',root).textContent=okk?'':'Bitte wählen Sie mindestens einen Fall und eine Artikelart.';
  }
  form.addEventListener('change',upd);upd();
  form.onsubmit=function(ev){ev.preventDefault();var c=read();P.set.k=c;save();runKasus(root,c);};
}

/* ===== Tabellen und Übersicht ===== */
function artTable(title,type,stem,note){
  var gs=['m','f','n','p'],h='<div class="stack"><h3>'+title+'</h3><div class="tw"><table><thead><tr><th>Fall</th><th>maskulin</th><th>feminin</th><th>neutral</th><th>Plural</th></tr></thead><tbody>';
  CASES.forEach(function(c){
    h+='<tr><th>'+CASENAME[c]+'<br><span class="muted small">'+CASEQ[c]+'</span></th>';
    gs.forEach(function(g){h+='<td class="'+g+'">'+esc(artForm(type,stem,c,g))+'</td>';});
    h+='</tr>';
  });
  return h+'</tbody></table></div>'+(note?'<p class="small muted">'+note+'</p>':'')+'</div>';
}
function nounTable(){
  var list=W.filter(function(w){return w.nd&&w.lvl<=3&&w.cls!=='X';}).sort(function(a,b){return a.lvl-b.lvl;}).slice(0,16);
  var h='<div class="tw"><table><thead><tr><th>Nominativ</th><th>Akkusativ</th><th>Dativ</th><th>Genitiv</th></tr></thead><tbody>';
  list.forEach(function(w){h+='<tr><td>der '+esc(w.w)+'</td><td>den '+esc(w.acc)+'</td><td>dem '+esc(w.dat)+'</td><td>des '+esc(w.gs)+'</td></tr>';});
  return h+'</tbody></table></div>';
}
function signalHTML(){
  function row(t,items,cls){return '<div class="stack" style="gap:6px"><span class="label">'+t+'</span><div class="chips">'+items.map(function(x){return '<span class="chip '+cls+'">'+esc(x)+'</span>';}).join('')+'</div></div>';}
  var h='<div class="cols3">';
  h+='<div class="b-x" style="background:var(--surface2)">'+row('Akkusativ',['durch','für','gegen','ohne','um','bis','entlang'],'b-x')+'<p class="small muted">Diese Präpositionen verlangen immer den Akkusativ.</p></div>';
  h+='<div style="background:var(--surface2)">'+row('Dativ',['aus','bei','mit','nach','seit','von','zu','ab','außer','gegenüber'],'b-x')+'<p class="small muted">Diese Präpositionen verlangen immer den Dativ.</p></div>';
  h+='<div style="background:var(--surface2)">'+row('Genitiv',['wegen','trotz','während','statt / anstatt','innerhalb','außerhalb','aufgrund'],'b-x')+'<p class="small muted">Diese Präpositionen stehen mit dem Genitiv.</p></div>';
  h+='</div>';
  h+='<div class="note"><b>Wechselpräpositionen</b> (an, auf, hinter, in, neben, über, unter, vor, zwischen): <b>Wohin?</b> (Bewegung zu einem Ziel) → Akkusativ: Ich gehe in <b>den</b> Park. <b>Wo?</b> (Ort, ohne Bewegung zu einem Ziel) → Dativ: Ich bin in <b>dem</b> Park (im Park).</div>';
  h+=row('Verben mit Dativ',['helfen','danken','gehören','gefallen','gratulieren','antworten','folgen','zuhören','glauben','schmecken','passen','fehlen','begegnen','gelingen'],'b-x');
  return '<div class="stack">'+h+'</div>';
}
function overviewHTML(){
  function col(g,t,cls){return '<div class="b-'+g+'" style="background:var(--'+cls+'-soft)"><h3 class="t-'+g+'">'+t+'</h3><div class="chips">'+RLIST.filter(function(r){return r.g===g;}).map(function(r){return '<span class="chip" style="background:var(--surface);color:var(--ink);border:1px solid var(--line)" title="'+esc(r.s)+'">'+esc(r.pat)+'</span>';}).join('')+'</div></div>';}
  return '<div class="cols3">'+col('m','der','der')+col('f','die','die')+col('n','das','das')+'</div><p class="small muted">Alle Regeln gelten „fast immer“ oder „meistens“. Fahren Sie mit der Maus über eine Regel, um die Stärke zu sehen. Ausnahmen finden Sie in den Lerneinheiten.</p>';
}
function tablesView(root){
  setKeys(null);
  var h='<section class="panel stack"><h2>Tabellen zum Nachschlagen</h2><p class="lead">Die Artikelformen in allen vier Fällen, die Nomenendungen und die wichtigsten Signalwörter.</p></section>';
  h+='<section class="panel stack"><h2>Artikel in allen Fällen</h2><div class="note">Merkhilfe: Nur beim Maskulinum ändert sich der Akkusativ (der → den, ein → einen). Beim Femininum, Neutrum und Plural ist der Akkusativ gleich dem Nominativ. Im Dativ Plural bekommt das Nomen meist ein -n (den Kindern). Im Genitiv bekommen maskuline und neutrale Nomen oft -s oder -es (des Lehrers, des Hauses).</div>';
  h+=artTable('Bestimmter Artikel','def','')+artTable('Unbestimmter Artikel (ein-)','ind','ein','Der Negativartikel <b>kein-</b> hat die gleichen Endungen: kein, keine, keinen, keinem, keiner, keines. Im Plural gibt es kein „ein“, aber keine, keinen, keiner.')+
     artTable('Possessivartikel (mein-)','pos','mein','Gleiche Endungen für dein-, sein-, ihr-, unser-, euer-, Ihr-. Bei euer- fällt das e weg: eure, euren, eurem, eurer.')+
     artTable('Demonstrativartikel (dies-)','dem','dies','jen- hat die gleichen Endungen: jener, jene, jenes, jenen, jenem.')+'</section>';
  h+='<section class="panel stack"><h2>Signalwörter für den Fall</h2>'+signalHTML()+'</section>';
  h+='<section class="panel stack"><h2>n-Deklination</h2><p>Manche maskulinen Nomen (vor allem Personen und Tiere) bekommen in allen Fällen außer dem Nominativ die Endung -n oder -en. Dazu gehören viele Nomen auf -e, -ist, -ant und -ent.</p>'+nounTable()+'<p class="small muted">Sonderfälle mit -ns im Genitiv: der Name – des Namens, der Gedanke – des Gedankens, der Buchstabe – des Buchstabens.</p></section>';
  h+='<section class="panel stack"><h2>Faustregeln auf einen Blick</h2>'+overviewHTML()+'</section>';
  root.innerHTML=h;
}

/* ===== Fortschritt ===== */
function progressView(root){
  setKeys(null);
  var h='<section class="panel stack"><h2>Mein Fortschritt</h2><p class="lead">Ihre Ergebnisse bleiben in diesem Browser gespeichert. Auf einem anderen Gerät beginnen Sie neu.</p></section>';
  h+='<section class="panel stack"><h3>Lerneinheiten</h3><div class="tw"><table><thead><tr><th>Einheit</th><th>Beste Übung</th><th>Übungen</th></tr></thead><tbody>';
  BATCHES.forEach(function(b){var st=P.b[b.id];h+='<tr><td>'+b.id+' · '+esc(b.t)+'</td><td>'+(st?st.best+' %':'–')+'</td><td>'+(st?st.runs:0)+'</td></tr>';});
  var sa=P.b.all;h+='<tr><td>Gesamtwiederholung</td><td>'+(sa?sa.best+' %':'–')+'</td><td>'+(sa?sa.runs:0)+'</td></tr></tbody></table></div></section>';
  // Wortschatz
  var seen=0,sure=0,weak=[],k,key,s;
  for(key in P.w){if(P.w.hasOwnProperty(key)){s=P.w[key];seen++;if(s.b>=4)sure++;if(s.b===1)weak.push(key);}}
  h+='<section class="panel stack"><h3>Wortschatz</h3><p>'+seen+' Wörter geübt, davon '+sure+' sicher (mehrmals hintereinander richtig).</p>';
  if(weak.length){
    h+='<span class="label">Noch unsicher</span><div class="chips">';
    weak.slice(0,60).forEach(function(k){var p=k.split('|');var e=null,i;for(i=0;i<W.length;i++){if(W[i].w===p[0]&&W[i].a===p[1]){e=W[i];break;}}if(e)h+='<span class="chip b-'+e.a+'">'+ART[e.a]+' '+esc(e.w)+'</span>';});
    h+='</div>';
  }
  h+='</section>';
  // Kasus-Matrix
  h+='<section class="panel stack"><h3>Kasus: Trefferquote nach Fall und Genus</h3><div class="tw"><table class="heat"><thead><tr><th>Fall</th><th>maskulin</th><th>feminin</th><th>neutral</th><th>Plural</th></tr></thead><tbody>';
  CASES.forEach(function(c){
    h+='<tr><th>'+CASENAME[c]+'</th>';
    ['m','f','n','p'].forEach(function(g){
      var v=P.k[c+g],txt='–',st='';
      if(v&&v[1]){var p=Math.round(100*v[0]/v[1]);txt=p+' %<br><span class="small muted">'+v[0]+'/'+v[1]+'</span>';st=' style="background:'+(p>=85?'var(--das-soft)':p>=60?'var(--surface2)':'var(--warn-soft)')+'"';}
      h+='<td'+st+'>'+txt+'</td>';
    });
    h+='</tr>';
  });
  h+='</tbody></table></div><p class="small muted">Grün: sicher (ab 85 %). Orange: noch üben (unter 60 %).</p></section>';
  h+='<section class="panel row spread"><span class="small muted">Alle gespeicherten Ergebnisse löschen:</span><button class="btn ghost sm" id="p-reset">Zurücksetzen</button></section>';
  root.innerHTML=h;
  var rb=$('#p-reset',root),armed=false;
  rb.onclick=function(){
    if(!armed){armed=true;rb.textContent='Wirklich löschen? Noch einmal klicken';return;}
    P={b:{},w:{},k:{},set:P.set};save();progressView(root);
  };
}

/* ===== Start ===== */
var TABS=[['learn','Faustregeln'],['genus','Genus üben'],['kasus','Kasus üben'],['tables','Tabellen'],['progress','Fortschritt']];
var view=$('#view'),nav=$('#nav');
function go(t){
  if(!has(TABS.map(function(x){return x[0];}),t))t='learn';
  $$('button',nav).forEach(function(b){if(b.getAttribute('data-t')===t)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});
  P.set.tab=t;save();
  setKeys(null);
  if(t==='learn')learnHome(view);
  else if(t==='genus')genusHome(view);
  else if(t==='kasus')kasusHome(view);
  else if(t==='tables')tablesView(view);
  else progressView(view);
  window.scrollTo(0,0);
}
(function(){
  var h='';
  TABS.forEach(function(t){h+='<button type="button" data-t="'+t[0]+'">'+t[1]+'</button>';});
  nav.innerHTML=h;
  $$('button',nav).forEach(function(b){b.onclick=function(){go(b.getAttribute('data-t'));};});
  go(P.set.tab||'learn');
})();
if(window.__GT_TEST){window.__GT_TEST={W:W,FR:FR,RULES:RULES,RLIST:RLIST,BATCHES:BATCHES,makeKItem:makeKItem,kPool:kPool,artForm:artForm,optionsFor:optionsFor,nounForm:nounForm,buildBatchItems:buildBatchItems,ruleItems:ruleItems,showAns:showAns,genusPool:genusPool,gSettings:gSettings,kSettings:kSettings,wsample:wsample,ruleInfo:ruleInfo,hlWord:hlWord};}

})();
</script>
