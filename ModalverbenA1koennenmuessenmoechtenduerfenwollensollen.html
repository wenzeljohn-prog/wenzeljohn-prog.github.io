function rnd(n) { return Math.floor(Math.random() * n); }
function shuffle(a) {
  var b = a.slice(), i, j, t;
  for (i = b.length - 1; i > 0; i--) { j = rnd(i + 1); t = b[i]; b[i] = b[j]; b[j] = t; }
  return b;
}
function U(k) { return UI[st.lang][k]; }
function D() { return (st.lang === "ar" || st.lang === "fa") ? ' dir="rtl"' : ""; }
function cap1(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
function trim(s) { return s.replace(/^\s+|\s+$/g, ""); }

/* ---------- Aufgaben erzeugen ---------- */
function newE1() {
  var items = [], v, ps, k, p, pv;
  for (v = 0; v < 6; v++) {
    ps = shuffle([0, 1, 2, 3, 4, 5]);
    for (k = 0; k < 2; k++) {
      p = ps[k]; pv = PV[p];
      items.push({v: v, p: p, pr: pv[rnd(pv.length)], val: "", res: -1});
    }
  }
  st.e1 = {items: shuffle(items), checked: false};
}
function newE2() {
  var pick = shuffle(BANK).slice(0, 12), items = [], i, b, vs, opts, j;
  for (i = 0; i < pick.length; i++) {
    b = pick[i];
    vs = [b.v].concat(b.d);
    opts = [];
    for (j = 0; j < vs.length; j++) {
      opts.push({v: vs[j], t: b.cap ? cap1(VERBS[vs[j]].f[b.p]) : VERBS[vs[j]].f[b.p]});
    }
    items.push({b: b, opts: shuffle(opts), sel: -1});
  }
  st.e2 = {items: items};
}
function newE3() {
  var pick = shuffle(SENT).slice(0, 8), items = [], i, n, idx, tries, order;
  for (i = 0; i < pick.length; i++) {
    n = pick[i].t.length;
    idx = [];
    for (tries = 0; tries < n; tries++) { idx.push(tries); }
    tries = 0;
    do { order = shuffle(idx); tries++; } while (order.join() === idx.join() && tries < 8);
    items.push({s: pick[i], pool: order, built: [], checked: false, ok: false});
  }
  st.e3 = {items: items};
}

/* ---------- Rendering ---------- */
function saveE1() {
  var inputs = app.querySelectorAll("input[data-i]"), i, it;
  if (!st.e1) { return; }
  for (i = 0; i < inputs.length; i++) {
    it = st.e1.items[parseInt(inputs[i].getAttribute("data-i"), 10)];
    if (it && !st.e1.checked) { it.val = inputs[i].value; }
  }
}

function rExp() {
  var h = "", i, m, r = RULES[st.lang];
  h += '<h2' + D() + '>' + U("rulesH") + '</h2><div class="card plain"' + D() + '><ul class="rules">';
  for (i = 0; i < r.length; i++) { h += "<li>" + r[i] + "</li>"; }
  h += "</ul></div>";
  h += '<h2' + D() + '>' + U("verbsH") + '</h2>';
  for (i = 0; i < VERBS.length; i++) {
    m = MEAN[i][st.lang];
    h += '<div class="card v' + i + '"><div><span class="vn c' + i + '">' + VERBS[i].inf + '</span><span class="ex">' + VERBS[i].ex + '</span></div>' +
         '<div class="mean"' + D() + '><b>' + m[0] + '</b> – ' + m[1] + '</div></div>';

}

function rTab() {
  var h = "<table><tr><th class=\"p\"></th>", i, p;
  for (i = 0; i < 6; i++) { h += '<th class="h' + i + '">' + VERBS[i].inf + "</th>"; }
  h += "</tr>";
  for (p = 0; p < 6; p++) {
    h += '<tr><td class="pr">' + PRON[p] + "</td>";
    for (i = 0; i < 6; i++) {
      h += "<td" + ((p < 3 && VERBS[i].irr) ? ' class="irr"' : "") + ">" + VERBS[i].f[p] + "</td>";
    }
    h += "</tr>";
  }
  h += "</table>";
  h += '<p class="legend"' + D() + '><span>' + "ich kann" + '</span> ' + U("legend") + "</p>";
  return h;
}

function score1() {
  var n = st.e1.items.length, s = 0, i;
  for (i = 0; i < n; i++) { if (st.e1.items[i].res === 1) { s++; } }
  return U("score") + ": " + s + " / " + n + ((st.e1.checked && s === n) ? " – " + U("done") : "");
}

function r1() {
  var h = "", i, it, cls, dis;
  h += '<p class="intro"' + D() + '>' + U("i1") + '</p>';
  h += '<div class="chars"><button data-act="ins" data-ch="ä">ä</button><button data-act="ins" data-ch="ö">ö</button><button data-act="ins" data-ch="ü">ü</button><button data-act="ins" data-ch="ß">ß</button></div>';
  if (st.e1.checked) { h += '<div class="score"' + D() + '>' + score1() + '</div>'; }
  for (i = 0; i < st.e1.items.length; i++) {
    it = st.e1.items[i];
    cls = it.res === 1 ? ' class="ok"' : (it.res === 0 ? ' class="bad"' : "");
    dis = st.e1.checked ? " disabled" : "";
    h += '<div class="row"><span class="pr">' + it.pr + '</span>' +
         '<input type="text" data-i="' + i + '" value="' + it.val.replace(/"/g, "&quot;") + '"' + cls + dis + ' autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">' +
         '<span class="inf">(' + VERBS[it.v].inf + ')</span>' +
         (it.res === 0 ? '<span class="sol">→ ' + VERBS[it.v].f[it.p] + '</span>' : "") + '</div>';
  }
  h += '<div class="act">' + (st.e1.checked ? "" : '<button class="btn" data-act="chk1">' + U("check") + '</button>') +
       '<button class="btn alt" data-act="new1">' + U("newSet") + '</button></div>';
  return h;
}

function score2() {
  var n = st.e2.items.length, s = 0, a = 0, i, it;
  for (i = 0; i < n; i++) {
    it = st.e2.items[i];
    if (it.sel >= 0) { a++; if (it.opts[it.sel].v === it.b.v) { s++; } }
  }
  return U("score") + ": " + s + " / " + n + (a === n ? " – " + U("done") : "");
}

function r2() {
  var h = "", i, it, q, j, o, ok, cls, gap, m, f;
  h += '<p class="intro"' + D() + '>' + U("i2") + '</p><div class="score"' + D() + '>' + score2() + '</div>';
  for (i = 0; i < st.e2.items.length; i++) {
    it = st.e2.items[i]; q = it.b;
    gap = it.sel < 0 ? "&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;" : it.opts[it.sel].t;
    h += '<div class="card q"><div class="qs">' + (i + 1) + ". " +
         q.s.replace("___", '<span class="gap">' + gap + "</span>") + (q.h ? " <i>" + q.h + "</i>" : "") + '</div><div class="opts">';
    for (j = 0; j < it.opts.length; j++) {
      o = it.opts[j]; cls = "opt";
      if (it.sel >= 0) {
        if (o.v === q.v) { cls += " right"; } else if (j === it.sel) { cls += " wrong"; }
      }
      h += '<button class="' + cls + '" data-act="opt" data-q="' + i + '" data-o="' + j + '"' + (it.sel >= 0 ? " disabled" : "") + ">" + o.t + "</button>";
    }
    h += "</div>";
    if (it.sel >= 0) {
      ok = it.opts[it.sel].v === q.v;
      m = MEAN[q.v][st.lang];
      f = q.cap ? cap1(VERBS[q.v].f[q.p]) : VERBS[q.v].f[q.p];
      h += '<div class="fb ' + (ok ? "okc" : "badc") + '"' + D() + '><b>' + (ok ? "✔ " + U("ok") : "✘ " + U("bad") + " " + U("sol") + ": " + f) +
           '</b> <span dir="ltr">' + f + " (" + VERBS[q.v].inf + ")</span> — " + m[0] + ": " + m[1] + "</div>";
    }
    h += "</div>";
  }
  h += '<div class="act"><button class="btn alt" data-act="new2">' + U("newSet") + '</button></div>';
  return h;
}

function score3() {
  var n = st.e3.items.length, s = 0, i;
  for (i = 0; i < n; i++) { if (st.e3.items[i].checked && st.e3.items[i].ok) { s++; } }
  return U("score") + ": " + s + " / " + n;
}

function sentText(it) {
  var w = [], i;
  for (i = 0; i < it.built.length; i++) { w.push(it.s.t[it.built[i]]); }
  return w.join(" ");
}

function r3() {
  var h = "", i, it, k;
  h += '<p class="intro"' + D() + '>' + U("i3") + '</p><div class="score"' + D() + '>' + score3() + '</div>';
  for (i = 0; i < st.e3.items.length; i++) {
    it = st.e3.items[i];
    h += '<div class="card q' + (it.checked ? (it.ok ? " good" : " nogood") : "") + '"><div class="ans">';
    for (k = 0; k < it.built.length; k++) {
      h += '<button class="w" data-act="rm" data-q="' + i + '" data-k="' + k + '"' + (it.checked ? " disabled" : "") + ">" + it.s.t[it.built[k]] + "</button>";
    }
    h += '</div><div class="pool">';
    for (k = 0; k < it.pool.length; k++) {
      h += '<button class="w" data-act="w" data-q="' + i + '" data-k="' + k + '"' + (it.checked ? " disabled" : "") + ">" + it.s.t[it.pool[k]] + "</button>";
    }
    h += "</div>";
    if (!it.checked) {
      h += '<div class="act">';
      if (it.built.length) { h += '<button class="btn alt" data-act="undo3" data-q="' + i + '">' + U("undo") + "</button>"; }
      if (!it.pool.length) { h += '<button class="btn" data-act="chk3" data-q="' + i + '">' + U("check") + "</button>"; }
      h += "</div>";
    } else {
      h += '<div class="fb ' + (it.ok ? "okc" : "badc") + '"' + D() + '><b>' + (it.ok ? "✔ " + U("ok") : "✘ " + U("bad")) + "</b>" +
           (it.ok ? "" : ' <span dir="ltr">' + U("sol") + ": " + it.s.a[0] + "</span>") + "</div>";
    }
    h += "</div>";
  }
  h += '<div class="act"><button class="btn alt" data-act="new3">' + U("newSet") + '</button></div>';
  return h;
}

function render() {
  var h = "", i, tabs = [["exp", "tExp"], ["tab", "tTab"], ["e1", "t1"], ["e2", "t2"], ["e3", "t3"]];
  if (st.tab === "e1" && st.e1) { saveE1(); }
  if (!st.e1) { newE1(); }
  if (!st.e2) { newE2(); }
  if (!st.e3) { newE3(); }
  st.last = null;
  h += "<h1>Modalverben</h1><div class=\"sub\">wollen · möchten · sollen · dürfen · müssen · können — Präsens</div>";
  h += '<div class="langs">';
  for (i = 0; i < LANGS.length; i++) {
    h += '<button class="lb' + (LANGS[i].c === st.lang ? " on" : "") + '" data-act="lang" data-v="' + LANGS[i].c + '">' + LANGS[i].n + "</button>";
  }
  h += "</div><div class=\"tabs\">";
  for (i = 0; i < tabs.length; i++) {
    h += '<button class="tb' + (tabs[i][0] === st.tab ? " on" : "") + '" data-act="tab" data-v="' + tabs[i][0] + '">' + U(tabs[i][1]) + "</button>";
  }
  h += "</div><div id=\"content\">";
  if (st.tab === "exp") { h += rExp(); }
  else if (st.tab === "tab") { h += rTab(); }
  else if (st.tab === "e1") { h += r1(); }
  else if (st.tab === "e2") { h += r2(); }
  else { h += r3(); }
  h += "</div>";
  app.innerHTML = h;
}

/* ---------- Aktionen ---------- */
function chk1() {
  var inputs = app.querySelectorAll("input[data-i]"), i, it, v;
  for (i = 0; i < inputs.length; i++) {
    it = st.e1.items[parseInt(inputs[i].getAttribute("data-i"), 10)];
    it.val = inputs[i].value;
    v = trim(it.val).toLowerCase();
    it.res = (v === VERBS[it.v].f[it.p]) ? 1 : 0;
  }
  st.e1.checked = true;
  render();
}

function chk3(q) {
  var it = st.e3.items[q], s = sentText(it).toLowerCase(), i;
  it.checked = true; it.ok = false;
  for (i = 0; i < it.s.a.length; i++) {
    if (it.s.a[i].toLowerCase() === s) { it.ok = true; }
  }
  render();
}

function act(el) {
  var a = el.getAttribute("data-act"), q, k, it, inp, s, e, v, ch;
  if (a === "lang") {
    st.lang = el.getAttribute("data-v");
    try { window.localStorage.setItem("modalverbenLang", st.lang); } catch (err) {}
    render();
  } else if (a === "tab") {
    if (st.tab === "e1") { saveE1(); }
    st.tab = el.getAttribute("data-v");
    render();
  } else if (a === "ins") {
    inp = st.last;
    if (!inp || inp.disabled) { return; }
    ch = el.getAttribute("data-ch");
    v = inp.value;
    s = inp.selectionStart; e = inp.selectionEnd;
    if (typeof s === "number") {
      inp.value = v.slice(0, s) + ch + v.slice(e);
      inp.focus();
      try { inp.setSelectionRange(s + 1, s + 1); } catch (err2) {}
    } else {
      inp.value = v + ch;
      inp.focus();
    }
  } else if (a === "chk1") { chk1(); }
  else if (a === "new1") { newE1(); render(); }
  else if (a === "opt") {
    q = parseInt(el.getAttribute("data-q"), 10);
    if (st.e2.items[q].sel < 0) { st.e2.items[q].sel = parseInt(el.getAttribute("data-o"), 10); render(); }
  } else if (a === "new2") { newE2(); render(); }
  else if (a === "w") {
    q = parseInt(el.getAttribute("data-q"), 10); k = parseInt(el.getAttribute("data-k"), 10);
    it = st.e3.items[q];
    if (it.checked) { return; }
    it.built.push(it.pool[k]);
    it.pool.splice(k, 1);
    render();
  } else if (a === "rm") {
    q = parseInt(el.getAttribute("data-q"), 10); k = parseInt(el.getAttribute("data-k"), 10);
    it = st.e3.items[q];
    if (it.checked) { return; }
    it.pool.push(it.built[k]);
    it.built.splice(k, 1);
    render();
  } else if (a === "undo3") {
    q = parseInt(el.getAttribute("data-q"), 10);
    it = st.e3.items[q];
    if (it.built.length) { it.pool.push(it.built.pop()); render(); }
  } else if (a === "chk3") { chk3(parseInt(el.getAttribute("data-q"), 10)); }
  else if (a === "new3") { newE3(); render(); }
}

app.addEventListener("click", function (e) {
  var t = e.target;
  while (t && t !== app && !(t.getAttribute && t.getAttribute("data-act"))) { t = t.parentNode; }
  if (!t || t === app || t.disabled) { return; }
  act(t);
});
app.addEventListener("mousedown", function (e) {
  var t = e.target;
  if (t && t.getAttribute && t.getAttribute("data-act") === "ins") { e.preventDefault(); }
});
