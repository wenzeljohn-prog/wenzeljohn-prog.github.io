    var alts = String(ans).split("|"), u = norm(user);
    if (!u) return false;
    for (var i = 0; i < alts.length; i++) if (norm(alts[i]) === u) return true;
    return false;
  }
  function writeOk(user, answers) {
    var u = norm(user); if (!u) return false;
    for (var i = 0; i < answers.length; i++) if (norm(answers[i]) === u) return true;
    return false;
  }
  function dispPunct(ans, isQ) { if (ans.indexOf(" ") < 0) return ans; return ans + (isQ ? "?" : "."); }

  var prog = (function () {
    var o = { ex: {} }, raw = lsGet(STORE_KEY);
    if (raw) { try { var p = JSON.parse(raw); if (p && p.ex) o.ex = p.ex; } catch (e) {} }
    return o;
  })();
  function saveProg() { lsSet(STORE_KEY, JSON.stringify(prog)); }

  function applyLanguage(code) {
    lang = code; STR = STRINGS[code];
    root.lang = STR.lang; root.dir = STR.dir;
    root.style.setProperty("--font", STR.font);
    document.title = STR.appTitle;
    $("picker").hidden = true; $("app").hidden = false;
    render();
  }
  function showPicker() {
    lang = null; STR = null;
    root.lang = "de"; root.dir = "ltr"; root.style.removeProperty("--font");
    document.title = "Perfekt: haben oder sein? · Regel 9 · A1";
    $("picker").hidden = false; $("app").hidden = true;
    window.scrollTo(0, 0);
  }
  function buildPicker() {
    var prompt = $("pickPrompt"), list = $("langList");
    LANG_ORDER.forEach(function (code) {
      var s = STRINGS[code];
      var pe = el("p", "", s.pickPrompt); pe.lang = s.lang; pe.dir = s.dir; pe.style.fontFamily = s.font; prompt.appendChild(pe);
      var b = el("button", "langchoice", s.nativeName); b.type = "button"; b.lang = s.lang; b.dir = s.dir; b.style.fontFamily = s.font;
      b.style.setProperty("--c", s.accent); b.style.setProperty("--cd", s.accentDark);
      b.addEventListener("click", function () { applyLanguage(code); });
      list.appendChild(b);
    });
  }

  function renderTable(spec) {
    var wrap = el("div", "tablewrap"); wrap.dir = "ltr";
    var table = el("table"); table.dir = "ltr"; table.lang = "de";
    var heads = ["inf", "perf", "ex"], de = { inf:"Infinitiv", perf:"Perfekt", ex:"Beispielsatz" };
    var thead = el("thead"), tr = el("tr");
    heads.forEach(function (h) {
      var th = el("th"); th.appendChild(document.createTextNode(de[h]));
      if (STR.col[h] !== de[h]) th.appendChild(setLangAttrs(el("small", "", STR.col[h]), lang));
      tr.appendChild(th);
    });
    thead.appendChild(tr); table.appendChild(thead);
    var tb = el("tbody");
    spec.rows.forEach(function (row) {
      var trr = el("tr");
      row.forEach(function (v, c) {
        var td = el("td");
        if (c === 1) td.appendChild(el("strong", "", v)); else td.appendChild(document.createTextNode(v));
        trr.appendChild(td);
      });
      tb.appendChild(trr);
    });
    table.appendChild(tb); wrap.appendChild(table);
    return wrap;
  }

  function render() {
    var app = $("app"); app.innerHTML = "";
    var bar = el("div", "topbar");
    bar.appendChild(deNode("span", "brand", "Das Perfekt · A1"));
    var lb = el("button", "pill", "🌐 " + STR.nativeName); lb.type = "button"; setLangAttrs(lb, lang);
    lb.addEventListener("click", showPicker);
    bar.appendChild(lb); app.appendChild(bar);

    var head = el("header", "sechead");
    head.appendChild(tgNode("div", "kicker", fmt(STR.ruleN, { n: SEC.rule })));
    var h2 = el("h1", "sectitle");
    h2.appendChild(deNode("span", "tde", SEC.title.de));
    if (tl(SEC.title) !== SEC.title.de) h2.appendChild(tgNode("span", "ttr", tl(SEC.title)));
    head.appendChild(h2); app.appendChild(head);

    var card = el("div", "card");
    var kd = deNode("div", "keyde"); mdInto(kd, SEC.text.de); card.appendChild(kd);
    var body = tgNode("div", "ruletext"); richText(body, tl(SEC.text)); card.appendChild(body);
    app.appendChild(card);

    SEC.tables.forEach(function (tb) {
      var lab = el("div", "tlabel"); lab.appendChild(deNode("span", "", tb.label.de));
      if (tl(tb.label) !== tb.label.de) { lab.appendChild(document.createTextNode(" · ")); lab.appendChild(tgNode("span", "", tl(tb.label))); }
      app.appendChild(lab);
      app.appendChild(renderTable(tb));
    });

    var mm = el("div", "memo");
    mm.appendChild(tgNode("div", "memolabel", "💡 " + STR.memoLabel));
    var md = deNode("div", "memode"); mdInto(md, SEC.memo.de); mm.appendChild(md);
    var mt = tgNode("div", "memotext"); mdInto(mt, tl(SEC.memo)); mm.appendChild(mt);
    app.appendChild(mm);

    SEC.ex.forEach(function (ex) { app.appendChild(buildExercise(ex)); });
    window.scrollTo(0, 0);
  }

  function newState(ex) {
    var st = { vals: [] };
    ex.items.forEach(function (it) {
      if (ex.kind === "fill") { var n = it.t.split("___").length - 1, bl = []; for (var b = 0; b < n; b++) bl.push(""); st.vals.push(bl); }
      else st.vals.push("");
    });
    return st;
  }
  function umlautBar(card) {
    var bar = el("div", "umlauts"); bar.dir = "ltr";
    ["ä", "ö", "ü", "ß"].forEach(function (ch) {
      var b = el("button", "", ch); b.type = "button"; b.lang = "de";
      b.addEventListener("mousedown", function (e) { e.preventDefault(); });
      b.addEventListener("click", function () {
        var inp = lastInput; if (!inp || !card.contains(inp)) return;
        var s = inp.selectionStart, e2 = inp.selectionEnd;
        if (typeof s !== "number") inp.value += ch;
        else { inp.value = inp.value.slice(0, s) + ch + inp.value.slice(e2); try { inp.selectionStart = inp.selectionEnd = s + 1; } catch (er) {} }
        var ev = document.createEvent("Event"); ev.initEvent("input", true, true); inp.dispatchEvent(ev); inp.focus();
      });
      bar.appendChild(b);
    });
    return bar;
  }

  function buildExercise(ex) {
    var st = exState[ex.id]; if (!st) st = exState[ex.id] = newState(ex);
    var card = el("section", "excard");
    var head = el("div", "exhead");
    head.appendChild(tgNode("h3", "", fmt(STR.exLabel, { n: ex.n })));
    var badge = tgNode("span", "badge", ""); head.appendChild(badge); card.appendChild(head);
    card.appendChild(deNode("p", "insde", ex.de));
    card.appendChild(tgNode("p", "inst", STR[ex.ins]));
    function setBadge() {
      var s = prog.ex[ex.id];
      badge.className = "badge" + (s ? " b-" + s : "");
      badge.textContent = s === "ok" ? "✓ " + STR.stDone : s === "sol" ? "• " + STR.solShown : "";
    }
    setBadge();

    var list = el("ol", "items"); card.appendChild(list);
    var recs = [];
    var res = tgNode("div", "result", ""); res.setAttribute("role", "status"); res.setAttribute("aria-live", "polite");

    function clearMark(i) { recs[i].li.className = "item"; recs[i].mark.textContent = ""; }
    function setMark(i, ok) { recs[i].li.className = "item " + (ok ? "ok" : "bad"); recs[i].mark.textContent = ok ? "✓" : "✗"; }
    function inputCls(inp, c) { inp.className = inp.className.replace(/ ?(okin|badin)/g, "") + (c ? " " + c : ""); }

    ex.items.forEach(function (it, i) {
      var li = el("li", "item");
      var rec = { li: li, mark: el("span", "mark"), inputs: [] };
      rec.mark.setAttribute("aria-hidden", "true");
      recs.push(rec);
      var main = el("div", "imain");
      if (ex.kind === "fill") {
        var parts = it.t.split("___"), row = deNode("div", "line");
        for (var b = 0; b < parts.length; b++) {
          row.appendChild(document.createTextNode(parts[b]));
          if (b < parts.length - 1) (function (b) {
            var inp = el("input", "blank"); inp.type = "text";
            inp.setAttribute("autocomplete", "off"); inp.setAttribute("autocapitalize", "none"); inp.setAttribute("autocorrect", "off");
            inp.spellcheck = false; inp.lang = "de"; inp.dir = "ltr";
            inp.style.width = Math.max(5, it.a[b].split("|")[0].length + 3) + "ch";
            inp.value = st.vals[i][b] || "";
            inp.addEventListener("input", function () { st.vals[i][b] = inp.value; clearMark(i); inputCls(inp, ""); });
            inp.addEventListener("focus", function () { lastInput = inp; });
            rec.inputs.push(inp); row.appendChild(inp);
          })(b);
        }
        main.appendChild(row);
        rec.ev = function () { for (var k = 0; k < it.a.length; k++) if (!blankOk(st.vals[i][k] || "", it.a[k])) return false; return true; };
        rec.showSol = function () { for (var k = 0; k < it.a.length; k++) { var v = it.a[k].split("|")[0]; st.vals[i][k] = v; rec.inputs[k].value = v; } };
      } else {
        main.appendChild(deNode("div", "wprompt", it.t));
        var inp2 = el("input", "blank wide"); inp2.type = "text";
        inp2.setAttribute("autocomplete", "off"); inp2.setAttribute("autocapitalize", "sentences"); inp2.setAttribute("autocorrect", "off");
        inp2.spellcheck = false; inp2.lang = "de"; inp2.dir = "ltr";
        inp2.value = st.vals[i] || "";
        inp2.addEventListener("input", function () { st.vals[i] = inp2.value; clearMark(i); inputCls(inp2, ""); });
        inp2.addEventListener("focus", function () { lastInput = inp2; });
        rec.inputs.push(inp2); main.appendChild(inp2);
        rec.ev = function () { return writeOk(st.vals[i] || "", it.a); };
        rec.showSol = function () { var v = (norm(it.a[0]) === "richtig") ? it.a[0] : dispPunct(it.a[0], /\?\s*$/.test(it.t)); st.vals[i] = v; inp2.value = v; };
      }
      li.appendChild(main); li.appendChild(rec.mark); list.appendChild(li);
    });
    card.appendChild(umlautBar(card));
    card.addEventListener("keydown", function (e) {
      if (e.key !== "Enter" || !e.target || e.target.tagName !== "INPUT") return;
      var all = card.querySelectorAll("input.blank"), k;
      for (k = 0; k < all.length; k++) if (all[k] === e.target) break;
      e.preventDefault();
      if (k < all.length - 1) all[k + 1].focus(); else checkBtn.click();
    });

    var btnRow = el("div", "btnrow");
    var checkBtn = el("button", "main", STR.check); checkBtn.type = "button"; setLangAttrs(checkBtn, lang);
    var solBtn = el("button", "sec", STR.solution); solBtn.type = "button"; setLangAttrs(solBtn, lang);
    var rstBtn = el("button", "linkbtn", STR.restart); rstBtn.type = "button"; setLangAttrs(rstBtn, lang);
    btnRow.appendChild(checkBtn); btnRow.appendChild(solBtn); btnRow.appendChild(rstBtn);
    card.appendChild(btnRow); card.appendChild(res);

    function setRes(text, cls) { res.className = "result " + cls; res.textContent = text; }

    checkBtn.addEventListener("click", function () {
      var right = 0;
      recs.forEach(function (r, i) {
        var ok = r.ev(); setMark(i, ok); if (ok) right++;
        r.inputs.forEach(function (inp) { inputCls(inp, ok ? "okin" : "badin"); });
      });
      var n = recs.length;
      if (right === n) {
        if (prog.ex[ex.id] !== "ok") { prog.ex[ex.id] = "ok"; saveProg(); }
        setBadge(); setRes(fmt(STR.resFmt, { r: right, n: n }) + " · " + STR.allOk, "good");
      } else setRes(fmt(STR.resFmt, { r: right, n: n }) + " · " + STR.fixIt, "warn");
    });
    solBtn.addEventListener("click", function () {
      recs.forEach(function (r) {
        r.showSol(); r.li.className = "item shown"; r.mark.textContent = "";
        r.inputs.forEach(function (inp) { inputCls(inp, ""); });
      });
      if (!prog.ex[ex.id]) { prog.ex[ex.id] = "sol"; saveProg(); }
      setBadge(); setRes(STR.solShown, "info");
    });
    rstBtn.addEventListener("click", function () {
      delete exState[ex.id];
      card.parentNode.replaceChild(buildExercise(ex), card);
    });
    return card;
  }

  buildPicker();
})();
</script>
</body>
</html>
